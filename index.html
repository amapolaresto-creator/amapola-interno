                </select>
              ):(
                <Inp value={provNuevo} onChange={setProvNuevo} placeholder="Nombre del nuevo proveedor"/>
              )}
            </Field>
            <div style={{marginTop:-8,marginBottom:6}}>
              <button onClick={()=>{setMostrarNuevoProv(!mostrarNuevoProv);setProvSel("");setProvNuevo("");}} style={{background:"none",border:"none",color:"#2D6A4F",fontSize:".74rem",fontWeight:600,cursor:"pointer",padding:0}}>
                {mostrarNuevoProv?"← Elegir de la lista":"+ Es un proveedor nuevo"}
              </button>
            </div>
            <Field label="Sector">
              <select value={sector} onChange={e=>setSector(e.target.value)} style={sS}>
                {["COCINA","FRONT","OTRO"].map(x=><option key={x} value={x}>{x}</option>)}
              </select>
            </Field>
            <Field label="Nombre del producto"><Inp value={nombreProducto} onChange={setNombreProducto} placeholder="Ej: ACEITE X LITRO"/></Field>
          </>)}
          {!editId&&modoAgregar==="cargar"&&(
            <p style={{fontSize:".82rem",color:"#7B7063",marginTop:0}}>Cargando: <strong>{catalogo.find(c=>c.id===catId)?.producto}</strong>{provSel?` · ${provSel}`:""}</p>
          )}
          {editId&&<p style={{fontSize:".82rem",color:"#7B7063",marginTop:0}}>Editando: <strong>{stock.find(s=>s.id===editId)?.nombre}</strong></p>}
          <div style={{display:"flex",gap:8,marginTop:14}}>
            <div style={{flex:1}}>
              <label style={{display:"block",fontSize:".78rem",fontWeight:600,color:"#2C1A0E",marginBottom:5}}>{editId?"Cantidad actual":"Cantidad inicial"}</label>
              <Inp type="number" value={cantidad} onChange={setCantidad} placeholder="0"/>
            </div>
            <div style={{flex:1}}>
              <label style={{display:"block",fontSize:".78rem",fontWeight:600,color:"#2C1A0E",marginBottom:5}}>Stock mínimo</label>
              <Inp type="number" value={minimo} onChange={setMinimo} placeholder="0"/>
            </div>
          </div>
          <Field label="Unidad de medida">
            <select value={unidad} onChange={e=>setUnidad(e.target.value)} style={sS}>
              {["unidades","kg","g","litros","ml","cajas","bolsas","porciones"].map(u=><option key={u} value={u}>{u}</option>)}
            </select>
          </Field>
          <div style={{display:"flex",gap:8,marginTop:18}}>
            <button onClick={limpiar} style={{flex:1,padding:13,borderRadius:10,border:"none",background:"#E8DCC8",fontWeight:600,cursor:"pointer"}}>Cancelar</button>
            <Btn bg={editId?"#555":"#2C1A0E"} onClick={guardarProducto} disabled={busy}>{busy?"Guardando…":editId?"Actualizar":modoAgregar==="crear"?"Crear producto":"Cargar al inventario"}</Btn>
          </div>
        </div>
      </div>
    )}

    {!combinado.length?<Empty icon="📦">Todavía no hay productos cargados. Usá "+ Crear producto" para agregar el primero.</Empty>:(<>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8,flexWrap:"wrap",marginBottom:14}}>
        <button onClick={()=>setOffset(offset-1)} style={{padding:"7px 12px",border:"none",borderRadius:8,background:"#E8DCC8",fontWeight:600,cursor:"pointer",fontSize:".8rem"}}>← Semana anterior</button>
        <div style={{textAlign:"center"}}>
          <div style={{fontFamily:"Georgia,serif",fontSize:"1rem",color:"#2C1A0E"}}>{rangoLabel}</div>
          {offset!==0&&<button onClick={()=>setOffset(0)} style={{background:"none",border:"none",color:"#2D6A4F",fontSize:".72rem",fontWeight:600,cursor:"pointer",padding:0,marginTop:2}}>Volver a esta semana</button>}
        </div>
        <button onClick={()=>setOffset(offset+1)} style={{padding:"7px 12px",border:"none",borderRadius:8,background:"#E8DCC8",fontWeight:600,cursor:"pointer",fontSize:".8rem"}}>Semana siguiente →</button>
      </div>

      <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:14}}>
        <input value={fQuery} onChange={e=>setFQuery(e.target.value)} placeholder="Buscar producto..." style={{flex:"2 1 160px",padding:"9px 12px",border:"1.5px solid #E8DCC8",borderRadius:10,fontSize:".82rem",background:"#fff",color:"#2C1A0E"}}/>
        <select value={fProv} onChange={e=>setFProv(e.target.value)} style={{...sS,flex:"1 1 120px"}}>
          <option value="">Todos los proveedores</option>
          {proveedoresCat.map(p=><option key={p} value={p}>{p}</option>)}
        </select>
        <select value={fSector} onChange={e=>setFSector(e.target.value)} style={{...sS,flex:"1 1 110px"}}>
          <option value="">Todos los sectores</option>
          {sectoresCat.map(s=><option key={s} value={s}>{s}</option>)}
        </select>
        <button onClick={()=>setSoloBajo(!soloBajo)} style={{padding:"9px 14px",border:"none",borderRadius:10,background:soloBajo?"#C0392B":"#FFF0EF",color:soloBajo?"#fff":"#C0392B",fontSize:".78rem",fontWeight:600,cursor:"pointer",whiteSpace:"nowrap"}}>⚠️ Solo stock bajo ({conAlerta.length})</button>
        <button onClick={()=>setMostrarInactivos(!mostrarInactivos)} style={{padding:"9px 14px",border:"none",borderRadius:10,background:mostrarInactivos?"#7B7063":"#F2EAE0",color:mostrarInactivos?"#fff":"#7B7063",fontSize:".78rem",fontWeight:600,cursor:"pointer",whiteSpace:"nowrap"}}>{mostrarInactivos?"← Volver a activos":`😴 Ver inactivos (${inactivosCount})`}</button>
      </div>

      {!gruposInv.length?<Empty icon="🔍">Ningún producto coincide con el filtro</Empty>:gruposInv.map(g=>{
        const cerrado=!!colapsados[g.proveedor];
        return(
        <div key={g.proveedor} style={{background:"#fff",borderRadius:14,boxShadow:"0 2px 12px rgba(44,26,14,.08)",overflow:"hidden",marginBottom:14}}>
          <div onClick={()=>setColapsados({...colapsados,[g.proveedor]:!cerrado})} style={{background:"#F4EEE3",padding:"9px 16px",fontFamily:"Georgia,serif",fontStyle:"italic",fontSize:".88rem",color:"#2C1A0E",borderBottom:cerrado?"none":"1px solid #E8DCC8",display:"flex",justifyContent:"space-between",alignItems:"center",cursor:"pointer",userSelect:"none"}}>
            <span>{cerrado?"▸":"▾"} {g.proveedor}</span>
            <span style={{fontSize:".65rem",color:"#7B7063",fontStyle:"normal"}}>{g.items.length} producto{g.items.length!==1?"s":""}</span>
          </div>
          {!cerrado&&(
          <div style={{overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:".78rem",minWidth:920}}>
            <thead>
              <tr style={{background:"#F9F6F1"}}>
                <th style={thS}>Producto</th>
                <th style={{...thS,textAlign:"right"}}>Stock actual</th>
                {dias.map((d,i)=>{
                  const esHoy=d.toDateString()===hoyDate.toDateString();
                  return(
                    <th key={i} style={{...thS,textAlign:"center",background:esHoy?"#EAF5F0":"#F9F6F1",color:esHoy?"#2D6A4F":"#7B7063"}}>
                      {DIAS[i]}<br/><span style={{fontWeight:400,textTransform:"none",fontSize:".62rem"}}>{d.getDate()}/{d.getMonth()+1}</span>
                    </th>
                  );
                })}
                <th style={{...thS,textAlign:"center"}}>Cierre semana</th>
                <th style={{...thS,textAlign:"right"}}>Acciones</th>
              </tr>
            </thead>
            <tbody>
              {g.items.map((s,i)=>{
                const alerta=!s.sinCargar&&Number(s.cantidad)<=Number(s.minimo)&&Number(s.minimo)>0;
                const cierre=s.sinCargar?null:cierreDe(s);
                return(
                  <tr key={s.id} style={{background:alerta?"#FFF0EF":(i%2===0?"#fff":"#F9F6F1")}}>
                    <td style={tdS}>
                      <div>{s.nombre}{alerta&&<span style={{background:"#F09595",color:"#501313",fontSize:".58rem",fontWeight:700,padding:"1px 6px",borderRadius:10,marginLeft:6}}>BAJO</span>}{s.sinCargar&&<span style={{background:"#E8DCC8",color:"#7B7063",fontSize:".58rem",fontWeight:700,padding:"1px 6px",borderRadius:10,marginLeft:6}}>SIN CARGAR</span>}</div>
                      <div style={{fontSize:".65rem",color:"#B7A98F"}}>{s.sector||"—"}</div>
                    </td>
                    <td style={{...tdS,textAlign:"right",fontFamily:"Georgia,serif",fontWeight:700,color:s.sinCargar?"#B7A98F":(alerta?"#C0392B":"#2D6A4F"),whiteSpace:"nowrap"}}>{s.sinCargar?"Sin cargar":(<>{s.cantidad} <span style={{color:"#7B7063",fontWeight:400,fontSize:".7rem"}}>{s.unidad}</span></>)}</td>
                    {dias.map((d,j)=>{
                      const v=entradasDia(s,d);
                      const c=conteoDeDia(s,d);
                      return(
                        <td key={j} style={{...tdS,textAlign:"center"}}>
                          {v===0&&c===null&&<span style={{color:"#D8CFC0"}}>—</span>}
                          {v>0&&<div style={{color:"#2D6A4F"}}>+{v}</div>}
                          {c!==null&&<div style={{color:"#B7860B",fontWeight:700}}>🧮{c}</div>}
                        </td>
                      );
                    })}
                    <td style={{...tdS,textAlign:"center",fontFamily:"Georgia,serif",fontWeight:700,color:cierre!==null?"#2C1A0E":"#D8CFC0",whiteSpace:"nowrap"}}>{cierre!==null?`${cierre} ${s.unidad}`:"—"}</td>
                    <td style={{...tdS,textAlign:"right",whiteSpace:"nowrap"}}>
                      {s.sinCargar?(
                        <button onClick={()=>abrirCargar(s)} style={{background:"#2C1A0E",color:"#fff",border:"none",borderRadius:6,padding:"4px 10px",fontSize:".68rem",fontWeight:600,cursor:"pointer",marginRight:4}}>Cargar</button>
                      ):(<>
                        <button onClick={()=>{setMovModal(s);setMovTipo("entrada");}} style={{background:"#EAF5F0",color:"#2D6A4F",border:"none",borderRadius:6,padding:"4px 8px",fontSize:".68rem",fontWeight:600,cursor:"pointer",marginRight:4}}>+</button>
                        <button onClick={()=>{setMovModal(s);setMovTipo("salida");}} style={{background:"#FFF0EF",color:"#C0392B",border:"none",borderRadius:6,padding:"4px 8px",fontSize:".68rem",fontWeight:600,cursor:"pointer",marginRight:4}}>−</button>
                        <button onClick={()=>setHistModal(s)} style={{background:"#F2EAE0",color:"#7B7063",border:"none",borderRadius:6,padding:"4px 8px",fontSize:".68rem",fontWeight:600,cursor:"pointer",marginRight:4}}>⋯</button>
                      </>)}
                      {s.catalogoId&&(
                        <button onClick={()=>toggleActivo(s.catalogoId,s.activo)} title={s.activo?"Marcar inactivo":"Reactivar"} style={{background:"#F2EAE0",color:"#7B7063",border:"none",borderRadius:6,padding:"4px 8px",fontSize:".68rem",fontWeight:600,cursor:"pointer"}}>{s.activo?"⏸":"▶"}</button>
                      )}
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
          </div>
          )}
        </div>
        );
      })}
      {gruposInv.length>0&&(
        <div style={{display:"flex",gap:16,marginTop:6,fontSize:".68rem",color:"#7B7063",flexWrap:"wrap"}}>
          <span><span style={{color:"#2D6A4F",fontWeight:700}}>+N</span> compra o producción cargada ese día</span>
          <span><span style={{color:"#B7860B",fontWeight:700}}>🧮N</span> conteo hecho ese día (parcial o completo)</span>
        </div>
      )}
    </>)}
  </>);
}

function StockConteo({stock,saveStock,catalogo,saveCatalogo,proveedoresCat,conteos,saveConteos,registradoPor}){
  const[fProv,setFProv]=useState("");
  const[fSector,setFSector]=useState("");
  const[fQuery,setFQuery]=useState("");
  const[valores,setValores]=useState({});
  const[busy,setBusy]=useState(false);
  const[expandido,setExpandido]=useState({});
  const[mostrarInactivos,setMostrarInactivos]=useState(false);
  const[colapsados,setColapsados]=useState({});
  const sectoresCat=[...new Set([...stock.map(s=>s.sector),...catalogo.map(c=>c.sector)].filter(Boolean))].sort();
  const thS={padding:"7px 8px",fontWeight:700,color:"#7B7063",fontSize:".63rem",letterSpacing:".05em",textTransform:"uppercase",borderBottom:"2px solid #E8DCC8",textAlign:"left"};
  const tdS={padding:"7px 8px"};

  const toggleActivo=async(catalogoId,activoActual)=>{
    if(!catalogoId)return;
    await saveCatalogo(catalogo.map(c=>c.id===catalogoId?{...c,activo:!activoActual}:c));
    toast(activoActual?"Producto marcado como inactivo":"Producto reactivado ✓");
  };

  const catalogoIds=new Set(catalogo.map(c=>c.id));
  const stockPorCatId={};
  stock.forEach(s=>{if(s.catalogoId)stockPorCatId[s.catalogoId]=s;});
  const combinado=[];
  catalogo.forEach(c=>{
    const activo=c.activo!==false;
    const s=stockPorCatId[c.id];
    if(s)combinado.push({...s,catalogoId:c.id,activo});
    else combinado.push({id:"sc_"+c.id,sinCargar:true,catalogoId:c.id,nombre:c.producto,proveedor:c.proveedor,sector:c.sector,unidad:c.unidad||"unidades",cantidad:0,minimo:0,movimientos:[],activo});
  });
  stock.forEach(s=>{if(!s.catalogoId||!catalogoIds.has(s.catalogoId))combinado.push({...s,activo:true});});

  const inactivosCount=catalogo.filter(c=>c.activo===false).length;

  const filtrado=combinado.filter(s=>{
    if(mostrarInactivos){if(s.activo)return false;}else{if(!s.activo)return false;}
    if(fProv&&s.proveedor!==fProv)return false;
    if(fSector&&s.sector!==fSector)return false;
    if(fQuery&&!norm(s.nombre).includes(norm(fQuery)))return false;
    return true;
  });

  const valorDe=s=>valores[s.id]!==undefined?valores[s.id]:(s.sinCargar?"":String(s.cantidad));
  const diffDe=s=>{
    const v=valorDe(s);
    if(v===""||isNaN(Number(v)))return null;
    return Number(v)-(s.sinCargar?0:Number(s.cantidad));
  };

  const gruposCnt=[];
  filtrado.forEach(s=>{
    const key=s.proveedor||"Sin proveedor";
    let g=gruposCnt.find(g=>g.proveedor===key);
    if(!g){g={proveedor:key,items:[]};gruposCnt.push(g);}
    g.items.push(s);
  });
  gruposCnt.sort((a,b)=>a.proveedor.localeCompare(b.proveedor));
  gruposCnt.forEach(g=>g.items.sort((a,b)=>a.nombre.localeCompare(b.nombre)));

  const conMenos=filtrado.filter(s=>{const d=diffDe(s);return d!==null&&d<0;}).length;
  const conMas=filtrado.filter(s=>{const d=diffDe(s);return d!==null&&d>0;}).length;

  const tocados=filtrado.filter(s=>s.sinCargar?(valores[s.id]!==undefined&&valores[s.id]!==""&&!isNaN(Number(valores[s.id]))):true);

  const guardarConteo=async()=>{
    if(!tocados.length){toast(filtrado.length?"No cargaste ningún conteo":"No hay productos para contar con este filtro");return;}
    const conDiferencia=conMenos+conMas;
    const alcanceTxt=fProv?`proveedor ${fProv}`:fSector?`sector ${fSector}`:"todo el inventario";
    if(!confirm(`Vas a registrar un conteo de ${tocados.length} producto${tocados.length!==1?"s":""} (${alcanceTxt}), ${conDiferencia} con diferencia. ¿Confirmás?`))return;
    setBusy(true);
    const fecha=new Date().toISOString();
    const nuevosStock=[];
    const itemsConteo=tocados.map(s=>{
      const v=valorDe(s);
      const teorico=s.sinCargar?0:Number(s.cantidad);
      const contado=(v===""||isNaN(Number(v)))?teorico:Number(v);
      let stockId=s.id;
      if(s.sinCargar){
        stockId=uid();
        const mov={id:uid(),tipo:"entrada",origen:"conteo",cantidad:contado,obs:"Conteo inicial",fecha,registradoPor:registradoPor||null};
        nuevosStock.push({id:stockId,catalogoId:s.catalogoId,nombre:s.nombre,proveedor:s.proveedor,sector:s.sector,cantidad:contado,minimo:0,unidad:s.unidad,movimientos:contado>0?[mov]:[],fecha,registradoPor:registradoPor||null});
      }
      return{stockId,nombre:s.nombre,proveedor:s.proveedor,sector:s.sector,unidad:s.unidad,teorico,contado,diferencia:contado-teorico};
    });
    const stockActualizado=stock.map(s=>{
      const it=itemsConteo.find(i=>i.stockId===s.id);
      if(!it)return s;
      if(it.diferencia===0)return{...s,cantidad:it.contado};
      const mov={id:uid(),tipo:it.diferencia>0?"entrada":"salida",origen:"conteo",cantidad:Math.abs(it.diferencia),obs:`Conteo: teórico ${it.teorico}, contado ${it.contado}`,fecha,registradoPor:registradoPor||null};
      return{...s,cantidad:it.contado,movimientos:[mov,...(s.movimientos||[])].slice(0,50)};
    }).concat(nuevosStock);
    await saveStock(stockActualizado);
    const registro={id:uid(),fecha,alcance:fProv?`Proveedor: ${fProv}`:fSector?`Sector: ${fSector}`:"Todo el inventario",items:itemsConteo,registradoPor:registradoPor||null};
    await saveConteos([registro,...(conteos||[])]);
    toast(`✓ Conteo guardado: ${itemsConteo.length} producto${itemsConteo.length!==1?"s":""}`);
    setValores({});setBusy(false);
  };

  if(!combinado.length)return(
    <Empty icon="🧮">Todavía no hay productos en el catálogo. Cargalos primero desde 🗂️ Catálogo.</Empty>
  );

  return(<>
    <Card title="Nuevo conteo">
      <p style={{fontSize:".78rem",color:"#7B7063",marginBottom:14}}>Elegí qué contar (o dejalo en todos), corregí lo que sea distinto de lo que muestra el sistema y guardá. La diferencia queda registrada como el consumo/venta implícito de ese período.</p>
      <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
        <input value={fQuery} onChange={e=>setFQuery(e.target.value)} placeholder="Buscar producto..." style={{flex:"2 1 160px",padding:"9px 12px",border:"1.5px solid #E8DCC8",borderRadius:10,fontSize:".82rem",background:"#fff",color:"#2C1A0E"}}/>
        <select value={fProv} onChange={e=>setFProv(e.target.value)} style={{...sS,flex:"1 1 120px"}}>
          <option value="">Todos los proveedores</option>
          {proveedoresCat.map(p=><option key={p} value={p}>{p}</option>)}
        </select>
        <select value={fSector} onChange={e=>setFSector(e.target.value)} style={{...sS,flex:"1 1 110px"}}>
          <option value="">Todos los sectores</option>
          {sectoresCat.map(s=><option key={s} value={s}>{s}</option>)}
        </select>
        <button onClick={()=>setMostrarInactivos(!mostrarInactivos)} style={{padding:"9px 14px",border:"none",borderRadius:10,background:mostrarInactivos?"#7B7063":"#F2EAE0",color:mostrarInactivos?"#fff":"#7B7063",fontSize:".78rem",fontWeight:600,cursor:"pointer",whiteSpace:"nowrap"}}>{mostrarInactivos?"← Volver a activos":`😴 Ver inactivos (${inactivosCount})`}</button>
      </div>
      {(conMenos>0||conMas>0)&&(
        <div style={{fontSize:".74rem",color:"#7B7063",marginTop:12}}>
          {conMenos>0&&<span style={{color:"#C0392B",fontWeight:600,marginRight:12}}>⚠️ {conMenos} con menos de lo esperado</span>}
          {conMas>0&&<span style={{color:"#2D6A4F",fontWeight:600}}>+ {conMas} con más de lo esperado</span>}
        </div>
      )}
    </Card>

    {!gruposCnt.length?<Empty icon="🔍">Ningún producto coincide con el filtro</Empty>:gruposCnt.map(g=>{
      const cerrado=!!colapsados[g.proveedor];
      return(
      <div key={g.proveedor} style={{background:"#fff",borderRadius:14,boxShadow:"0 2px 12px rgba(44,26,14,.08)",overflow:"hidden",marginBottom:14}}>
        <div onClick={()=>setColapsados({...colapsados,[g.proveedor]:!cerrado})} style={{background:"#F4EEE3",padding:"9px 16px",fontFamily:"Georgia,serif",fontStyle:"italic",fontSize:".88rem",color:"#2C1A0E",borderBottom:cerrado?"none":"1px solid #E8DCC8",display:"flex",justifyContent:"space-between",alignItems:"center",cursor:"pointer",userSelect:"none"}}>
          <span>{cerrado?"▸":"▾"} {g.proveedor}</span>
          <span style={{fontSize:".65rem",color:"#7B7063",fontStyle:"normal"}}>{g.items.length} producto{g.items.length!==1?"s":""}</span>
        </div>
        {!cerrado&&(
        <div style={{overflowX:"auto"}}>
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:".78rem",minWidth:480}}>
          <thead>
            <tr style={{background:"#F9F6F1"}}>
              <th style={thS}>Producto</th>
              <th style={{...thS,textAlign:"right"}}>Teórico</th>
              <th style={{...thS,width:110}}>Contado</th>
              <th style={{...thS,textAlign:"right"}}>Diferencia</th>
            </tr>
          </thead>
          <tbody>
            {g.items.map((s,i)=>{
              const d=diffDe(s);
              const val=valorDe(s);
              return(
                <tr key={s.id} style={{background:i%2===0?"#fff":"#F9F6F1"}}>
                  <td style={tdS}>{s.nombre}{s.sinCargar&&<span style={{background:"#E8DCC8",color:"#7B7063",fontSize:".58rem",fontWeight:700,padding:"1px 6px",borderRadius:10,marginLeft:6}}>SIN CARGAR</span>}</td>
                  <td style={{...tdS,textAlign:"right",color:"#7B7063"}}>{s.sinCargar?"—":(<>{s.cantidad} <span style={{fontSize:".68rem"}}>{s.unidad}</span></>)}</td>
                  <td style={tdS}>
                    <div style={{display:"flex",alignItems:"center",gap:6}}>
                      <input type="number" value={val} onChange={e=>setValores({...valores,[s.id]:e.target.value})} placeholder="0" style={{width:80,border:"1.5px solid #E8DCC8",borderRadius:6,padding:"5px 6px",fontSize:".82rem",textAlign:"center"}}/>
                      <span style={{color:"#B7A98F",fontSize:".8rem"}}>✎</span>
                    </div>
                  </td>
                  <td style={{...tdS,textAlign:"right",fontFamily:"Georgia,serif",fontWeight:700,color:d>0?"#2D6A4F":d<0?"#C0392B":"#B7A98F"}}>{d===null?"—":(d>0?"+":"")+d}</td>
                </tr>
              );
            })}
          </tbody>
        </table>
        </div>
        )}
      </div>
      );
    })}

    {gruposCnt.length>0&&(
      <Btn bg="#2C1A0E" onClick={guardarConteo} disabled={busy||!tocados.length}>{busy?"Guardando…":`Guardar conteo (${tocados.length} producto${tocados.length!==1?"s":""})`}</Btn>
    )}

    <div style={{marginTop:28}}>
      <div style={{fontWeight:700,fontSize:".85rem",color:"#2C1A0E",marginBottom:10}}>Historial de conteos</div>
      {!conteos||!conteos.length?<Empty icon="🧮">Todavía no hiciste ningún conteo</Empty>:conteos.map(c=>{
        const abierto=!!expandido[c.id];
        const conDif=(c.items||[]).filter(i=>i.diferencia!==0);
        return(
          <div key={c.id} style={{background:"#fff",borderRadius:12,marginBottom:10,boxShadow:"0 2px 10px rgba(44,26,14,.07)",overflow:"hidden"}}>
            <div onClick={()=>setExpandido({...expandido,[c.id]:!abierto})} style={{padding:"12px 16px",cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center",gap:8}}>
              <div>
                <div style={{fontWeight:600,fontSize:".85rem"}}>{abierto?"▾":"▸"} {fmtF(c.fecha)} {fmtH(c.fecha)} · {c.alcance}</div>
                <div style={{fontSize:".7rem",color:"#7B7063",marginTop:2}}>{(c.items||[]).length} contados · {conDif.length} con diferencia{c.registradoPor?` · ${c.registradoPor}`:""}</div>
              </div>
              <SmBtn color="#C0392B" onClick={e=>{e.stopPropagation();if(confirm("¿Eliminar este registro del historial? No revierte el ajuste de stock ya aplicado."))saveConteos((conteos||[]).filter(x=>x.id!==c.id));}}>Eliminar</SmBtn>
            </div>
            {abierto&&(
              <div style={{overflowX:"auto",borderTop:"1px solid #F2EAE0"}}>
                <table style={{width:"100%",borderCollapse:"collapse",fontSize:".76rem",minWidth:480}}>
                  <thead>
                    <tr style={{background:"#F9F6F1"}}>
                      <th style={thS}>Producto</th>
                      <th style={{...thS,textAlign:"right"}}>Teórico</th>
                      <th style={{...thS,textAlign:"right"}}>Contado</th>
                      <th style={{...thS,textAlign:"right"}}>Diferencia</th>
                    </tr>
                  </thead>
                  <tbody>
                    {(c.items||[]).map((it,i)=>(
                      <tr key={i} style={{background:i%2===0?"#fff":"#F9F6F1"}}>
                        <td style={tdS}>{it.nombre}</td>
                        <td style={{...tdS,textAlign:"right",color:"#7B7063"}}>{it.teorico} {it.unidad}</td>
                        <td style={{...tdS,textAlign:"right"}}>{it.contado} {it.unidad}</td>
                        <td style={{...tdS,textAlign:"right",fontWeight:700,color:it.diferencia>0?"#2D6A4F":it.diferencia<0?"#C0392B":"#B7A98F"}}>{it.diferencia>0?"+":""}{it.diferencia}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </div>
        );
      })}
    </div>
  </>);
}
function StockProduccion({stock,saveStock,catalogo,registradoPor}){
  const EMPLEADOS_PRODUCCION=["Denil","Mike","Rocio","Pedro","Lautaro","Omar"];
  const[prodId,setProdId]=useState("");
  const[cantidad,setCantidad]=useState("");
  const[empleado,setEmpleado]=useState("");
  const[obs,setObs]=useState("");
  const[busy,setBusy]=useState(false);
  const[fecha,setFecha]=useState(hoyLocal());
  const[offset,setOffset]=useState(0);

  // Solo productos activos del proveedor INTERNO
  const productosInternos=catalogo.filter(c=>norm(c.proveedor)==="interno"&&c.activo!==false)
    .slice().sort((a,b)=>a.producto.localeCompare(b.producto));

  const registrar=async()=>{
    if(!prodId){toast("Elegí un producto");return;}
    if(!cantidad||Number(cantidad)<=0){toast("Ingresá la cantidad producida");return;}
    if(!empleado){toast("Elegí quién lo elaboró");return;}
    setBusy(true);
    const prod=productosInternos.find(c=>c.id===prodId);
    const fechaISO=fecha?fechaLocalISO(fecha):new Date().toISOString();
    const stockActual=[...stock];
    const idx=stockActual.findIndex(s=>s.catalogoId===prodId);
    const mov={id:uid(),tipo:"entrada",origen:"produccion",cantidad:Number(cantidad),elaboradoPor:empleado,obs:obs.trim()||"Producción del día",fecha:fechaISO,registradoPor:registradoPor||null};
    if(idx>=0){
      stockActual[idx]={...stockActual[idx],cantidad:stockActual[idx].cantidad+Number(cantidad),movimientos:[mov,...(stockActual[idx].movimientos||[])].slice(0,50)};
    }else{
      stockActual.push({id:uid(),catalogoId:prodId,nombre:prod.producto,proveedor:"INTERNO",sector:prod.sector||"COCINA",cantidad:Number(cantidad),minimo:0,unidad:prod.unidad||"unidades",movimientos:[mov],fecha:fechaISO,registradoPor:registradoPor||null});
    }
    await saveStock(stockActual);
    toast(`✓ ${prod.producto}: +${cantidad} ${prod.unidad||"unidades"} registradas`);
    setBusy(false);setProdId("");setCantidad("");setEmpleado("");setObs("");setFecha(hoyLocal());
  };

  if(!productosInternos.length)return(
    <Empty icon="🍳">No hay productos internos en el catálogo. Agregá productos con proveedor INTERNO desde 🗂️ Catálogo.</Empty>
  );

  const thS={padding:"7px 8px",fontWeight:700,color:"#7B7063",fontSize:".63rem",letterSpacing:".05em",textTransform:"uppercase",borderBottom:"2px solid #E8DCC8",textAlign:"left"};
  const tdS={padding:"7px 8px"};
  const DIAS=["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];
  const monday=(()=>{
    const d=new Date();
    const day=d.getDay();
    const diff=d.getDate()-day+(day===0?-6:1);
    const m=new Date(d.getFullYear(),d.getMonth(),diff);
    m.setDate(m.getDate()+offset*7);
    m.setHours(0,0,0,0);
    return m;
  })();
  const dias=Array.from({length:7},(_,i)=>{const d=new Date(monday);d.setDate(monday.getDate()+i);return d;});
  const hoyDate=new Date();
  const enDia=(f,dia)=>f&&new Date(f).toDateString()===dia.toDateString();
  const rangoLabel=`${dias[0].toLocaleDateString("es-AR",{day:"numeric",month:"short"})} – ${dias[6].toLocaleDateString("es-AR",{day:"numeric",month:"short"})}`;

  const stockPorCatId={};
  stock.forEach(s=>{if(s.catalogoId)stockPorCatId[s.catalogoId]=s;});
  const filas=productosInternos.map(c=>{
    const s=stockPorCatId[c.id];
    return s?{...s,catalogoId:c.id}:{id:"sc_"+c.id,sinCargar:true,catalogoId:c.id,nombre:c.producto,unidad:c.unidad||"unidades",movimientos:[]};
  }).sort((a,b)=>a.nombre.localeCompare(b.nombre));

  const produccionDia=(s,dia)=>(s.movimientos||[]).filter(m=>m.origen==="produccion"&&enDia(m.fecha,dia)).reduce((acc,m)=>acc+Number(m.cantidad||0),0);
  const totalSemana=s=>dias.reduce((acc,d)=>acc+produccionDia(s,d),0);

  return(<>
    <Card title="Registrar producción">
      <p style={{fontSize:".78rem",color:"#7B7063",marginBottom:14}}>Cargá cuánto se produjo hoy de cada producto interno. Suma automáticamente al stock.</p>
      <Field label="Producto">
        <select value={prodId} onChange={e=>setProdId(e.target.value)} style={sS}>
          <option value="">— Elegí un producto —</option>
          {productosInternos.map(c=><option key={c.id} value={c.id}>{c.producto} ({c.unidad||"unidades"})</option>)}
        </select>
      </Field>
      <Field label="Cantidad producida">
        <Inp type="number" value={cantidad} onChange={setCantidad} placeholder="0"/>
      </Field>
      <Field label="Elaborado por">
        <select value={empleado} onChange={e=>setEmpleado(e.target.value)} style={sS}>
          <option value="">— Elegí quién lo elaboró —</option>
          {EMPLEADOS_PRODUCCION.map(n=><option key={n} value={n}>{n}</option>)}
        </select>
      </Field>
      <Field label="Observaciones (opcional)">
        <Inp value={obs} onChange={setObs} placeholder="Ej: tanda de la mañana"/>
      </Field>
      <Field label="Fecha"><Inp type="date" value={fecha} onChange={setFecha}/></Field>
      <Btn bg="#2D6A4F" onClick={registrar} disabled={busy}>{busy?"Guardando…":"Registrar producción"}</Btn>
    </Card>

    <div style={{fontWeight:700,fontSize:".85rem",color:"#2C1A0E",margin:"22px 0 10px"}}>Historial de producción</div>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8,flexWrap:"wrap",marginBottom:14}}>
      <button onClick={()=>setOffset(offset-1)} style={{padding:"7px 12px",border:"none",borderRadius:8,background:"#E8DCC8",fontWeight:600,cursor:"pointer",fontSize:".8rem"}}>← Semana anterior</button>
      <div style={{textAlign:"center"}}>
        <div style={{fontFamily:"Georgia,serif",fontSize:"1rem",color:"#2C1A0E"}}>{rangoLabel}</div>
        {offset!==0&&<button onClick={()=>setOffset(0)} style={{background:"none",border:"none",color:"#2D6A4F",fontSize:".72rem",fontWeight:600,cursor:"pointer",padding:0,marginTop:2}}>Volver a esta semana</button>}
      </div>
      <button onClick={()=>setOffset(offset+1)} style={{padding:"7px 12px",border:"none",borderRadius:8,background:"#E8DCC8",fontWeight:600,cursor:"pointer",fontSize:".8rem"}}>Semana siguiente →</button>
    </div>

    <div style={{background:"#fff",borderRadius:14,boxShadow:"0 2px 12px rgba(44,26,14,.08)",overflow:"hidden",marginBottom:14}}>
      <div style={{overflowX:"auto"}}>
      <table style={{width:"100%",borderCollapse:"collapse",fontSize:".78rem",minWidth:760}}>
        <thead>
          <tr style={{background:"#F9F6F1"}}>
            <th style={thS}>Producto</th>
            {dias.map((d,i)=>{
              const esHoy=d.toDateString()===hoyDate.toDateString();
              return(
                <th key={i} style={{...thS,textAlign:"center",background:esHoy?"#EAF5F0":"#F9F6F1",color:esHoy?"#2D6A4F":"#7B7063"}}>
                  {DIAS[i]}<br/><span style={{fontWeight:400,textTransform:"none",fontSize:".62rem"}}>{d.getDate()}/{d.getMonth()+1}</span>
                </th>
              );
            })}
            <th style={{...thS,textAlign:"right"}}>Total semana</th>
          </tr>
        </thead>
        <tbody>
          {filas.map((s,i)=>{
            const tot=totalSemana(s);
            return(
              <tr key={s.id} style={{background:i%2===0?"#fff":"#F9F6F1"}}>
                <td style={tdS}>
                  <div>{s.nombre}{s.sinCargar&&<span style={{background:"#E8DCC8",color:"#7B7063",fontSize:".58rem",fontWeight:700,padding:"1px 6px",borderRadius:10,marginLeft:6}}>SIN PRODUCIR</span>}</div>
                </td>
                {dias.map((d,j)=>{
                  const v=produccionDia(s,d);
                  const quienes=[...new Set((s.movimientos||[]).filter(m=>m.origen==="produccion"&&enDia(m.fecha,d)&&m.elaboradoPor).map(m=>m.elaboradoPor))];
                  return(
                    <td key={j} style={{...tdS,textAlign:"center"}} title={quienes.length?`Elaboró: ${quienes.join(", ")}`:""}>
                      {v>0?<span style={{color:"#2D6A4F",fontWeight:700}}>+{v}</span>:<span style={{color:"#D8CFC0"}}>—</span>}
                    </td>
                  );
                })}
                <td style={{...tdS,textAlign:"right",fontFamily:"Georgia,serif",fontWeight:700,color:tot>0?"#2D6A4F":"#D8CFC0",whiteSpace:"nowrap"}}>{tot>0?`+${tot} ${s.unidad}`:"—"}</td>
              </tr>
            );
          })}
        </tbody>
      </table>
      </div>
    </div>
  </>);
}

function StockCatalogo({catalogo,saveCatalogo,proveedoresCat,proveedores,saveProveedores,stock,saveStock}){
  const[provSel,setProvSel]=useState("");
  const[provNuevo,setProvNuevo]=useState("");
  const[mostrarNuevoProv,setMostrarNuevoProv]=useState(false);
  const[sector,setSector]=useState("COCINA");
  const[producto,setProducto]=useState("");
  const[unidad,setUnidad]=useState("unidades");
  const[minimo,setMinimo]=useState("");
  const[maximo,setMaximo]=useState("");
  const[fProv,setFProv]=useState("");
  const[fSector,setFSector]=useState("");
  const[fQuery,setFQuery]=useState("");
  const[colapsados,setColapsados]=useState({});
  const[busy,setBusy]=useState(false);
  const[editModal,setEditModal]=useState(null);
  const[editProv,setEditProv]=useState("");
  const[editProvNuevo,setEditProvNuevo]=useState("");
  const[editMostrarNuevoProv,setEditMostrarNuevoProv]=useState(false);
  const[editSector,setEditSector]=useState("COCINA");
  const[editProducto,setEditProducto]=useState("");
  const[editMinimo,setEditMinimo]=useState("");
  const[editMaximo,setEditMaximo]=useState("");
  const[editBusy,setEditBusy]=useState(false);
  const[mostrarForm,setMostrarForm]=useState(false);
  const[mostrarInactivos,setMostrarInactivos]=useState(false);
  const UNIDADES=["unidades","kg","g","litros","ml","cajas","bolsas","porciones","paquetes"];
  const sectoresCat=[...new Set(catalogo.map(c=>c.sector).filter(Boolean))].sort();
  const thS={padding:"7px 8px",fontWeight:700,color:"#7B7063",fontSize:".63rem",letterSpacing:".05em",textTransform:"uppercase",borderBottom:"2px solid #E8DCC8",textAlign:"left"};
  const tdS={padding:"7px 8px"};

  const proveedorFinal=mostrarNuevoProv?provNuevo.trim().toUpperCase():provSel;

  const agregar=async()=>{
    if(!proveedorFinal){toast("Elegí o ingresá un proveedor");return;}
    if(!producto.trim()){toast("Ingresá el nombre del producto");return;}
    const yaExiste=catalogo.some(c=>norm(c.proveedor)===norm(proveedorFinal)&&norm(c.producto)===norm(producto));
    if(yaExiste){toast("Ese producto ya existe para ese proveedor");return;}
    setBusy(true);
    const nuevo={id:uid(),proveedor:proveedorFinal,sector,producto:producto.trim().toUpperCase(),unidad,minimo:Number(minimo)||0,maximo:Number(maximo)||0};
    await saveCatalogo([...catalogo,nuevo]);
    const yaEsProveedor=(proveedores||[]).some(p=>norm(p.nombre)===norm(proveedorFinal));
    if(!yaEsProveedor){
      const nuevoProv={id:uid(),nombre:proveedorFinal,deudaInicial:0,obs:"",fecha:new Date().toISOString()};
      await saveProveedores([...(proveedores||[]),nuevoProv]);
    }
    toast(yaEsProveedor?"Producto agregado al catálogo ✓":"Producto agregado y proveedor creado ✓");
    setBusy(false);setProducto("");setProvNuevo("");setMostrarNuevoProv(false);setUnidad("unidades");setMinimo("");setMaximo("");setMostrarForm(false);
  };

  const cambiarUnidad=async(id,nuevaUnidad)=>{
    await saveCatalogo(catalogo.map(c=>c.id===id?{...c,unidad:nuevaUnidad}:c));
  };

  const toggleActivo=async(id,activoActual)=>{
    await saveCatalogo(catalogo.map(c=>c.id===id?{...c,activo:!activoActual}:c));
    toast(activoActual?"Producto marcado como inactivo":"Producto reactivado ✓");
  };

  const eliminar=async id=>{
    if(!confirm("¿Eliminar este producto del catálogo? (no afecta el inventario ya cargado)"))return;
    await saveCatalogo(catalogo.filter(c=>c.id!==id));toast("Eliminado");
  };

  const abrirEditar=c=>{
    setEditModal(c);setEditProv(c.proveedor);setEditProvNuevo("");setEditMostrarNuevoProv(false);
    setEditSector(c.sector||"COCINA");setEditProducto(c.producto||"");setEditMinimo(String(c.minimo||""));setEditMaximo(String(c.maximo||""));
  };

  const guardarEdicion=async()=>{
    const proveedorFinal=editMostrarNuevoProv?editProvNuevo.trim().toUpperCase():editProv;
    if(!proveedorFinal){toast("Elegí o ingresá un proveedor");return;}
    if(!editProducto.trim()){toast("Ingresá el nombre del producto");return;}
    const nombreFinal=editProducto.trim().toUpperCase();
    const dup=catalogo.some(c=>c.id!==editModal.id&&norm(c.proveedor)===norm(proveedorFinal)&&norm(c.producto)===norm(nombreFinal));
    if(dup){toast("Ya existe un producto con ese nombre para ese proveedor");return;}
    setEditBusy(true);
    await saveCatalogo(catalogo.map(c=>c.id===editModal.id?{...c,proveedor:proveedorFinal,sector:editSector,producto:nombreFinal,minimo:Number(editMinimo)||0,maximo:Number(editMaximo)||0}:c));
    if(stock&&saveStock){
      const stockActualizado=stock.map(s=>s.catalogoId===editModal.id?{...s,nombre:nombreFinal,proveedor:proveedorFinal,sector:editSector}:s);
      const cambio=stockActualizado.some((s,i)=>s.nombre!==stock[i].nombre||s.proveedor!==stock[i].proveedor||s.sector!==stock[i].sector);
      if(cambio)await saveStock(stockActualizado);
    }
    const yaEsProveedor=(proveedores||[]).some(p=>norm(p.nombre)===norm(proveedorFinal));
    if(!yaEsProveedor){
      const nuevoProv={id:uid(),nombre:proveedorFinal,deudaInicial:0,obs:"",fecha:new Date().toISOString()};
      await saveProveedores([...(proveedores||[]),nuevoProv]);
    }
    toast("Producto actualizado ✓");
    setEditBusy(false);setEditModal(null);
  };

  const inactivosCount=catalogo.filter(c=>c.activo===false).length;

  const listado=catalogo.filter(c=>{
    if(mostrarInactivos){if(c.activo!==false)return false;}else{if(c.activo===false)return false;}
    if(fProv&&c.proveedor!==fProv)return false;
    if(fSector&&c.sector!==fSector)return false;
    if(fQuery&&!norm(c.producto).includes(norm(fQuery)))return false;
    return true;
  }).slice().sort((a,b)=>a.proveedor.localeCompare(b.proveedor)||a.producto.localeCompare(b.producto));

  const grupos=[];
  listado.forEach(c=>{
    let g=grupos.find(g=>g.proveedor===c.proveedor);
    if(!g){g={proveedor:c.proveedor,items:[]};grupos.push(g);}
    g.items.push(c);
  });

  return(<>
    {!mostrarForm&&(
      <div style={{display:"flex",justifyContent:"flex-end",marginBottom:16}}>
        <button onClick={()=>setMostrarForm(true)} style={{padding:"9px 16px",borderRadius:10,border:"none",background:"#2C1A0E",color:"#fff",fontWeight:600,fontSize:".8rem",cursor:"pointer"}}>+ Nuevo producto</button>
      </div>
    )}

    {mostrarForm&&(
    <Card title="Agregar producto al catálogo">
      <Field label="Proveedor">
        {!mostrarNuevoProv?(
          <select value={provSel} onChange={e=>setProvSel(e.target.value)} style={sS}>
            <option value="">— Elegí un proveedor —</option>
            {proveedoresCat.map(p=><option key={p} value={p}>{p}</option>)}
          </select>
        ):(
          <Inp value={provNuevo} onChange={setProvNuevo} placeholder="Nombre del nuevo proveedor"/>
        )}
      </Field>
      <div style={{marginTop:6}}>
        <button onClick={()=>{setMostrarNuevoProv(!mostrarNuevoProv);setProvSel("");setProvNuevo("");}} style={{background:"none",border:"none",color:"#2D6A4F",fontSize:".74rem",fontWeight:600,cursor:"pointer",padding:0}}>
          {mostrarNuevoProv?"← Elegir de la lista":"+ Es un proveedor nuevo"}
        </button>
      </div>
      <Field label="Sector">
        <select value={sector} onChange={e=>setSector(e.target.value)} style={sS}>
          {["COCINA","FRONT","OTRO"].map(s=><option key={s} value={s}>{s}</option>)}
        </select>
      </Field>
      <Field label="Nombre del producto"><Inp value={producto} onChange={setProducto} placeholder="Ej: ACEITE X LITRO"/></Field>
      <Field label="Unidad de medida">
        <select value={unidad} onChange={e=>setUnidad(e.target.value)} style={sS}>
          {UNIDADES.map(u=><option key={u} value={u}>{u}</option>)}
        </select>
      </Field>
      <div style={{display:"flex",gap:8}}>
        <div style={{flex:1}}>
          <Field label="Mínimo"><Inp type="number" value={minimo} onChange={setMinimo} placeholder="0"/></Field>
        </div>
        <div style={{flex:1}}>
          <Field label="Máximo"><Inp type="number" value={maximo} onChange={setMaximo} placeholder="0"/></Field>
        </div>
      </div>
      <div style={{display:"flex",gap:8,marginTop:4}}>
        <button onClick={()=>setMostrarForm(false)} style={{flex:1,padding:13,borderRadius:10,border:"none",background:"#E8DCC8",fontWeight:600,cursor:"pointer"}}>Cancelar</button>
        <Btn onClick={agregar} disabled={busy}>{busy?"Guardando…":"Agregar al catálogo"}</Btn>
      </div>
    </Card>
    )}

    <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:14}}>
      <input value={fQuery} onChange={e=>setFQuery(e.target.value)} placeholder="Buscar producto..." style={{flex:"2 1 160px",padding:"9px 12px",border:"1.5px solid #E8DCC8",borderRadius:10,fontSize:".82rem",background:"#fff",color:"#2C1A0E"}}/>
      <select value={fProv} onChange={e=>setFProv(e.target.value)} style={{...sS,flex:"1 1 120px"}}>
        <option value="">Todos los proveedores ({proveedoresCat.length})</option>
        {proveedoresCat.map(p=><option key={p} value={p}>{p}</option>)}
      </select>
      <select value={fSector} onChange={e=>setFSector(e.target.value)} style={{...sS,flex:"1 1 110px"}}>
        <option value="">Todos los sectores</option>
        {sectoresCat.map(s=><option key={s} value={s}>{s}</option>)}
      </select>
      <button onClick={()=>setMostrarInactivos(!mostrarInactivos)} style={{padding:"9px 14px",border:"none",borderRadius:10,background:mostrarInactivos?"#7B7063":"#F2EAE0",color:mostrarInactivos?"#fff":"#7B7063",fontSize:".78rem",fontWeight:600,cursor:"pointer",whiteSpace:"nowrap"}}>{mostrarInactivos?"← Volver a activos":`😴 Ver inactivos (${inactivosCount})`}</button>
    </div>

    {!grupos.length?<Empty icon="🔍">Ningún producto coincide con el filtro</Empty>:grupos.map(g=>{
      const cerrado=!!colapsados[g.proveedor];
      return(
        <div key={g.proveedor} style={{background:"#fff",borderRadius:14,boxShadow:"0 2px 12px rgba(44,26,14,.08)",overflow:"hidden",marginBottom:14}}>
          <div onClick={()=>setColapsados({...colapsados,[g.proveedor]:!cerrado})} style={{background:"#F4EEE3",padding:"9px 16px",fontFamily:"Georgia,serif",fontStyle:"italic",fontSize:".88rem",color:"#2C1A0E",borderBottom:cerrado?"none":"1px solid #E8DCC8",display:"flex",justifyContent:"space-between",alignItems:"center",cursor:"pointer",userSelect:"none"}}>
            <span>{cerrado?"▸":"▾"} {g.proveedor}</span>
            <span style={{fontSize:".65rem",color:"#7B7063",fontStyle:"normal"}}>{g.items.length} producto{g.items.length!==1?"s":""}</span>
          </div>
          {!cerrado&&(
          <div style={{overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:".78rem",minWidth:640}}>
            <thead>
              <tr style={{background:"#F9F6F1"}}>
                <th style={thS}>Producto</th>
                <th style={thS}>Sector</th>
                <th style={{...thS,width:120}}>Unidad</th>
                <th style={{...thS,textAlign:"right"}}>Mínimo</th>
                <th style={{...thS,textAlign:"right"}}>Máximo</th>
                <th style={{...thS,textAlign:"right"}}>Acciones</th>
              </tr>
            </thead>
            <tbody>
              {g.items.map((c,i)=>{
                const activo=c.activo!==false;
                return(
                <tr key={c.id} style={{background:i%2===0?"#fff":"#F9F6F1",opacity:activo?1:.55}}>
                  <td style={tdS}>{c.producto}{!activo&&<span style={{background:"#E8DCC8",color:"#7B7063",fontSize:".58rem",fontWeight:700,padding:"1px 6px",borderRadius:10,marginLeft:6}}>INACTIVO</span>}</td>
                  <td style={{...tdS,color:"#7B7063"}}>{c.sector}</td>
                  <td style={tdS}>
                    <select value={c.unidad||"unidades"} onChange={e=>cambiarUnidad(c.id,e.target.value)} style={{fontSize:".72rem",color:"#7B7063",border:"1px solid #E8DCC8",borderRadius:8,padding:"4px 6px",background:"#fff"}}>
                      {UNIDADES.map(u=><option key={u} value={u}>{u}</option>)}
                    </select>
                  </td>
                  <td style={{...tdS,textAlign:"right",color:"#7B7063"}}>{c.minimo||0}</td>
                  <td style={{...tdS,textAlign:"right",color:"#7B7063"}}>{c.maximo||0}</td>
                  <td style={{...tdS,textAlign:"right",whiteSpace:"nowrap"}}>
                    <button onClick={()=>abrirEditar(c)} style={{background:"#F2EAE0",color:"#2C1A0E",border:"none",borderRadius:6,padding:"4px 10px",fontSize:".68rem",fontWeight:600,cursor:"pointer",marginRight:4}}>Editar</button>
                    <button onClick={()=>toggleActivo(c.id,activo)} style={{background:"#F2EAE0",color:"#7B7063",border:"none",borderRadius:6,padding:"4px 10px",fontSize:".68rem",fontWeight:600,cursor:"pointer",marginRight:4}}>{activo?"Desactivar":"Reactivar"}</button>
                    <button onClick={()=>eliminar(c.id)} style={{background:"#FFF0EF",color:"#C0392B",border:"none",borderRadius:6,padding:"4px 10px",fontSize:".68rem",fontWeight:600,cursor:"pointer"}}>Eliminar</button>
                  </td>
                </tr>
                );
              })}
            </tbody>
          </table>
          </div>
          )}
        </div>
      );
    })}

    {editModal&&(
      <div style={{position:"fixed",inset:0,background:"rgba(44,26,14,.65)",zIndex:500,display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
        <div style={{background:"#fff",borderRadius:"20px 20px 0 0",padding:"24px 20px 32px",width:"100%",maxWidth:460,maxHeight:"85vh",overflowY:"auto"}}>
          <p style={{fontFamily:"Georgia,serif",fontSize:"1.1rem",marginBottom:4}}>Editar producto</p>
          <p style={{fontSize:".82rem",color:"#7B7063",marginBottom:14}}><strong>{editModal.producto}</strong></p>
          <Field label="Proveedor">
            {!editMostrarNuevoProv?(
              <select value={editProv} onChange={e=>setEditProv(e.target.value)} style={sS}>
                <option value="">— Elegí un proveedor —</option>
                {proveedoresCat.map(p=><option key={p} value={p}>{p}</option>)}
              </select>
            ):(
              <Inp value={editProvNuevo} onChange={setEditProvNuevo} placeholder="Nombre del nuevo proveedor"/>
            )}
          </Field>
          <div style={{marginTop:-8,marginBottom:6}}>
            <button onClick={()=>{setEditMostrarNuevoProv(!editMostrarNuevoProv);setEditProv("");setEditProvNuevo("");}} style={{background:"none",border:"none",color:"#2D6A4F",fontSize:".74rem",fontWeight:600,cursor:"pointer",padding:0}}>
              {editMostrarNuevoProv?"← Elegir de la lista":"+ Es un proveedor nuevo"}
            </button>
          </div>
          <Field label="Sector">
            <select value={editSector} onChange={e=>setEditSector(e.target.value)} style={sS}>
              {["COCINA","FRONT","OTRO"].map(s=><option key={s} value={s}>{s}</option>)}
            </select>
          </Field>
          <Field label="Nombre del producto"><Inp value={editProducto} onChange={setEditProducto} placeholder="Ej: ACEITE X LITRO"/></Field>
          <div style={{display:"flex",gap:8,marginTop:6}}>
            <div style={{flex:1}}>
              <Field label="Mínimo"><Inp type="number" value={editMinimo} onChange={setEditMinimo} placeholder="0"/></Field>
            </div>
            <div style={{flex:1}}>
              <Field label="Máximo"><Inp type="number" value={editMaximo} onChange={setEditMaximo} placeholder="0"/></Field>
            </div>
          </div>
          <div style={{marginTop:10}}>
            <button onClick={()=>{toggleActivo(editModal.id,editModal.activo!==false);setEditModal({...editModal,activo:!(editModal.activo!==false)});}} style={{background:"#F2EAE0",color:"#7B7063",border:"none",borderRadius:8,padding:"7px 14px",fontSize:".76rem",fontWeight:600,cursor:"pointer"}}>{editModal.activo!==false?"⏸ Marcar inactivo":"▶ Reactivar"}</button>
          </div>
          <div style={{display:"flex",gap:8,marginTop:18}}>
            <button onClick={()=>setEditModal(null)} style={{flex:1,padding:13,borderRadius:10,border:"none",background:"#E8DCC8",fontWeight:600,cursor:"pointer"}}>Cancelar</button>
            <Btn bg="#2C1A0E" onClick={guardarEdicion} disabled={editBusy}>{editBusy?"Guardando…":"Guardar cambios"}</Btn>
          </div>
        </div>
      </div>
    )}
  </>);
}

function notaPedidoHTML(p){
  const filas=p.items.map(it=>"<tr><td>"+it.producto+"</td><td style=\"text-align:right\">"+it.cantidad+"</td></tr>").join("");
  return "<!DOCTYPE html><html lang=\"es\"><head><meta charset=\"UTF-8\"><title>Nota de pedido — "+p.proveedor+"</title>"
    +"<style>body{font-family:Georgia,serif;color:#2C1A0E;padding:36px;max-width:560px;margin:0 auto;}"
    +"h1{font-size:1.3rem;margin:0 0 2px;}.sub{font-size:.8rem;color:#7B7063;margin-bottom:20px;}"
    +"table{width:100%;border-collapse:collapse;margin-bottom:0;}"
    +"th{text-align:left;font-size:.68rem;letter-spacing:.05em;text-transform:uppercase;color:#7B7063;border-bottom:2px solid #2C1A0E;padding:6px 0;}"
    +"td{padding:8px 0;font-size:.95rem;border-bottom:1px solid #eee;vertical-align:top;}"
    +".badge{display:inline-block;background:#F2EAE0;padding:3px 10px;border-radius:20px;font-size:.7rem;letter-spacing:.05em;text-transform:uppercase;margin-bottom:16px;}"
    +".foot{font-size:.68rem;color:#999;margin-top:30px;border-top:1px solid #eee;padding-top:10px;}"
    +"@media print{.noprint{display:none;}}</style></head><body>"
    +"<h1>Amapola Resto</h1><div class=\"sub\">Nota de pedido</div>"
    +"<div class=\"badge\">"+fmtF(p.fecha)+"</div>"
    +"<p style=\"font-size:1.1rem;margin:0 0 16px;\"><strong>Proveedor: "+p.proveedor+"</strong></p>"
    +"<table><thead><tr><th>Producto</th><th style=\"text-align:right\">Cantidad</th></tr></thead><tbody>"+filas+"</tbody></table>"
    +(p.obs?("<p style=\"font-size:.85rem;color:#7B7063;margin-top:16px;\"><strong>Nota:</strong> "+p.obs+"</p>"):"")
    +"<div class=\"foot\">Emitido el "+new Date().toLocaleDateString("es-AR")+" · Amapola Interno</div>"
    +"<button class=\"noprint\" onclick=\"window.print()\" style=\"margin-top:20px;padding:10px 20px;border:none;border-radius:8px;background:#2C1A0E;color:#fff;cursor:pointer;\">Imprimir / Guardar como imagen o PDF</button>"
    +"</body></html>";
}
function StockPedidos({catalogo,proveedoresCat,pedidos,savePedidos,registradoPor}){
  const[provSel,setProvSel]=useState("");
  const[cants,setCants]=useState({});
  const[obs,setObs]=useState("");
  const[busy,setBusy]=useState(false);
  const[editId,setEditId]=useState(null);

  const productosDelProv=provSel?catalogo.filter(c=>c.proveedor===provSel&&c.activo!==false):[];

  const crearPedido=async()=>{
    const items=productosDelProv.filter(c=>Number(cants[c.id])>0).map(c=>({producto:c.producto,cantidad:Number(cants[c.id])}));
    if(!provSel){toast("Elegí un proveedor");return;}
    if(!items.length){toast("Ingresá cantidad en al menos un producto");return;}
    setBusy(true);
    if(editId){
      await savePedidos(pedidos.map(p=>p.id===editId?{...p,proveedor:provSel,items,obs:obs.trim()}:p));
      toast("Pedido actualizado ✓");
    }else{
      const nuevo={id:uid(),proveedor:provSel,fecha:new Date().toISOString(),items,obs:obs.trim(),estado:"pendiente",creadoPor:registradoPor||null};
      await savePedidos([nuevo,...pedidos]);
      toast("Pedido creado ✓");
    }
    setBusy(false);setProvSel("");setCants({});setObs("");setEditId(null);
  };

  const abrirEditar=p=>{
    setEditId(p.id);
    setProvSel(p.proveedor);
    const nuevosCants={};
    catalogo.filter(c=>c.proveedor===p.proveedor).forEach(c=>{
      const it=(p.items||[]).find(i=>i.producto===c.producto);
      if(it)nuevosCants[c.id]=String(it.cantidad);
    });
    setCants(nuevosCants);
    setObs(p.obs||"");
    window.scrollTo({top:0,behavior:"smooth"});
  };

  const cancelarEdicion=()=>{setEditId(null);setProvSel("");setCants({});setObs("");};

  const cambiarEstado=async(id,estado)=>{
    await savePedidos(pedidos.map(p=>p.id===id?{...p,estado}:p));
    toast("Pedido actualizado ✓");
  };

  const eliminar=async id=>{
    if(!confirm("¿Eliminar este pedido?"))return;
    await savePedidos(pedidos.filter(p=>p.id!==id));toast("Eliminado");
  };

  const verNota=p=>{
    const w=window.open("","_blank");
    if(w){w.document.write(notaPedidoHTML(p));w.document.close();}
  };

  const colorEstado={pendiente:"#B7860B",enviado:"#2980B9",recibido:"#2D6A4F"};

  return(<>
    <Card title={editId?"✏️ Editar pedido":"Nuevo pedido a proveedor"}>
      <Field label="Proveedor">
        <select value={provSel} onChange={e=>{setProvSel(e.target.value);setCants({});}} style={sS}>
          <option value="">— Elegí un proveedor —</option>
          {proveedoresCat.map(p=><option key={p} value={p}>{p}</option>)}
        </select>
      </Field>
      {provSel&&(
        <div style={{marginTop:14,maxHeight:320,overflowY:"auto",border:"1px solid #E8DCC8",borderRadius:10,padding:10}}>
          {productosDelProv.map(c=>(
            <div key={c.id} style={{display:"flex",alignItems:"center",gap:8,padding:"6px 2px",borderBottom:"1px solid #F2EAE0"}}>
              <div style={{flex:1,fontSize:".8rem"}}>{c.producto}</div>
              <input type="number" min="0" value={cants[c.id]||""} onChange={e=>setCants({...cants,[c.id]:e.target.value})} placeholder="0" style={{width:64,border:"1.5px solid #E8DCC8",borderRadius:6,padding:"5px 6px",fontSize:".82rem",textAlign:"center"}}/>
            </div>
          ))}
        </div>
      )}
      <Field label="Observaciones (opcional)"><TA value={obs} onChange={setObs} placeholder="Ej: pedir para el jueves..."/></Field>
      <Btn onClick={crearPedido} disabled={busy}>{busy?"Guardando…":editId?"Guardar cambios":"Crear pedido"}</Btn>
      {editId&&<button onClick={cancelarEdicion} style={{marginTop:8,width:"100%",padding:10,borderRadius:10,border:"none",background:"#E8DCC8",fontWeight:600,cursor:"pointer",fontSize:".82rem"}}>Cancelar edición</button>}
    </Card>

    {!pedidos.length?<Empty icon="🧾">Todavía no creaste pedidos</Empty>:pedidos.map(p=>(
      <div key={p.id} style={{background:"#fff",borderRadius:12,padding:16,marginBottom:10,boxShadow:"0 2px 10px rgba(44,26,14,.07)"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
          <div>
            <div style={{fontWeight:700,fontSize:".9rem"}}>{p.proveedor}</div>
            <div style={{fontSize:".7rem",color:"#7B7063"}}>{fmtFL(p.fecha)}{p.creadoPor?` · ${p.creadoPor}`:""}</div>
          </div>
          <span style={{background:colorEstado[p.estado]+"22",color:colorEstado[p.estado],fontSize:".66rem",fontWeight:700,padding:"3px 9px",borderRadius:20,textTransform:"uppercase"}}>{p.estado}</span>
        </div>
        <div style={{marginTop:10,fontSize:".8rem",color:"#2C1A0E"}}>
          {p.items.map((it,i)=><div key={i} style={{padding:"2px 0"}}>· {it.producto} — <strong>{it.cantidad}</strong></div>)}
        </div>
        {p.obs&&<div style={{marginTop:8,fontSize:".76rem",color:"#7B7063",fontStyle:"italic"}}>{p.obs}</div>}
        <div style={{display:"flex",gap:8,marginTop:12,flexWrap:"wrap"}}>
          <SmBtn color="#2D6A4F" onClick={()=>verNota(p)}>📄 Nota de pedido</SmBtn>
          <SmBtn onClick={()=>abrirEditar(p)}>✏️ Editar</SmBtn>
          {p.estado!=="pendiente"&&<SmBtn onClick={()=>cambiarEstado(p.id,"pendiente")}>Marcar pendiente</SmBtn>}
          {p.estado!=="enviado"&&<SmBtn onClick={()=>cambiarEstado(p.id,"enviado")}>Marcar enviado</SmBtn>}
          {p.estado!=="recibido"&&<SmBtn onClick={()=>cambiarEstado(p.id,"recibido")}>Marcar recibido</SmBtn>}
          <SmBtn color="#C0392B" onClick={()=>eliminar(p.id)}>Eliminar</SmBtn>
        </div>
      </div>
    ))}
  </>);
}




function StockDesperdicios({stock,saveStock,catalogo,desperdicios,saveDesperdicios,registradoPor}){
  const[itemId,setItemId]=useState("");
  const[cantidad,setCantidad]=useState("");
  const[motivo,setMotivo]=useState("Vencido");
  const[obs,setObs]=useState("");
  const[busy,setBusy]=useState(false);
  const[fecha,setFecha]=useState(hoyLocal());

  const MOTIVOS=["Vencido","Roto/dañado","Quemado/error de cocina","Devolución de cliente","Otro"];
  const inactivosIds=new Set((catalogo||[]).filter(c=>c.activo===false).map(c=>c.id));
  const itemsOrdenados=stock.filter(s=>!s.catalogoId||!inactivosIds.has(s.catalogoId)).sort((a,b)=>a.nombre.localeCompare(b.nombre));
  const itemSel=stock.find(s=>s.id===itemId);

  const registrar=async()=>{
    if(!itemId){toast("Elegí un producto del inventario");return;}
    if(!cantidad||Number(cantidad)<=0){toast("Ingresá la cantidad");return;}
    setBusy(true);
    const fechaISO=fecha?fechaLocalISO(fecha):new Date().toISOString();
    const cant=Number(cantidad);
    const mov={id:uid(),tipo:"salida",origen:"desperdicio",cantidad:cant,obs:`${motivo}${obs.trim()?" — "+obs.trim():""}`,fecha:fechaISO,registradoPor:registradoPor||null};
    const stockActual=stock.map(s=>s.id===itemId?{...s,cantidad:Math.max(0,s.cantidad-cant),movimientos:[mov,...(s.movimientos||[])].slice(0,50)}:s);
    await saveStock(stockActual);
    const registro={id:uid(),stockId:itemId,producto:itemSel.nombre,unidad:itemSel.unidad,proveedor:itemSel.proveedor,cantidad:cant,motivo,obs:obs.trim(),registradoPor:registradoPor||null,fecha:fechaISO};
    await saveDesperdicios([registro,...desperdicios]);
    toast(`✓ Desperdicio registrado: ${itemSel.nombre}`);
    setBusy(false);setItemId("");setCantidad("");setObs("");setMotivo("Vencido");setFecha(hoyLocal());
  };

  const eliminar=async id=>{
    if(!confirm("¿Eliminar este registro de desperdicio? (no repone el stock)"))return;
    await saveDesperdicios(desperdicios.filter(d=>d.id!==id));toast("Eliminado");
  };

  const hoyStr=hoyLocal();
  const desperdiciosHoy=desperdicios.filter(d=>d.fecha&&d.fecha.slice(0,10)===hoyStr);

  if(!stock.length)return(
    <Empty icon="🗑️">Todavía no hay productos en el inventario. Cargalos primero desde 📋 Control de stock.</Empty>
  );

  return(<>
    <Card title="Registrar desperdicio">
      <p style={{fontSize:".78rem",color:"#7B7063",marginBottom:14}}>Descuenta del inventario y queda registrado el motivo, para saber cuánto se pierde.</p>
      <Field label="Producto">
        <select value={itemId} onChange={e=>setItemId(e.target.value)} style={sS}>
          <option value="">— Elegí un producto —</option>
          {itemsOrdenados.map(s=><option key={s.id} value={s.id}>{s.nombre} (stock: {s.cantidad} {s.unidad})</option>)}
        </select>
      </Field>
      <Field label={`Cantidad${itemSel?` (${itemSel.unidad})`:""}`}>
        <Inp type="number" value={cantidad} onChange={setCantidad} placeholder="0"/>
      </Field>
      <Field label="Motivo">
        <select value={motivo} onChange={e=>setMotivo(e.target.value)} style={sS}>
          {MOTIVOS.map(m=><option key={m} value={m}>{m}</option>)}
        </select>
      </Field>
      <Field label="Observaciones (opcional)"><TA value={obs} onChange={setObs} placeholder="Ej: se venció ayer"/></Field>
      <Field label="Fecha"><Inp type="date" value={fecha} onChange={setFecha}/></Field>
      <Btn bg="#C0392B" onClick={registrar} disabled={busy}>{busy?"Guardando…":"Registrar desperdicio"}</Btn>
    </Card>

    {desperdiciosHoy.length>0&&(
      <div style={{background:"#FFF0EF",border:"1px solid #f5b7b1",borderRadius:12,padding:"12px 16px",marginBottom:16}}>
        <div style={{fontWeight:700,fontSize:".82rem",color:"#C0392B"}}>🗑️ {desperdiciosHoy.length} desperdicio{desperdiciosHoy.length!==1?"s":""} hoy</div>
      </div>
    )}

    {!desperdicios.length?<Empty icon="🗑️">Todavía no registraste desperdicios</Empty>:desperdicios.map(d=>(
      <div key={d.id} style={{background:"#fff",borderRadius:12,padding:16,marginBottom:10,boxShadow:"0 2px 10px rgba(44,26,14,.07)"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
          <div>
            <div style={{fontWeight:700,fontSize:".9rem"}}>{d.producto}</div>
            <div style={{fontSize:".7rem",color:"#7B7063"}}>{fmtFL(d.fecha)}{d.registradoPor?` · ${d.registradoPor}`:""}</div>
          </div>
          <div style={{textAlign:"right"}}>
            <div style={{fontFamily:"Georgia,serif",fontSize:"1.2rem",color:"#C0392B"}}>-{d.cantidad}</div>
            <div style={{fontSize:".68rem",color:"#7B7063"}}>{d.unidad}</div>
          </div>
        </div>
        <div style={{marginTop:8,fontSize:".78rem",color:"#2C1A0E"}}>{d.motivo}</div>
        {d.obs&&<div style={{marginTop:4,fontSize:".76rem",color:"#7B7063",fontStyle:"italic"}}>{d.obs}</div>}
        <div style={{display:"flex",gap:8,marginTop:12,flexWrap:"wrap"}}>
          <SmBtn color="#C0392B" onClick={()=>eliminar(d.id)}>Eliminar</SmBtn>
        </div>
      </div>
    ))}
  </>);
}

function TabDashboard({boletas,cierres,cierresCaja,pagos,sueldos,gastos,proveedores,calcDeuda,calcDigital,saldo,cajaDigitalSaldo,stock,setTab}){
  const hoy = new Date().toDateString();
  const now  = new Date();
  const esMes = iso => { const d=new Date(iso); return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear(); };
  const esSemana = iso => { const d=new Date(iso); const diff=(now-d)/(1000*60*60*24); return diff<=7; };

  // ── DÍA ──
  const cierresHoy    = cierresCaja.filter(c=>new Date(c.fecha).toDateString()===hoy);
  const pagosHoy      = pagos.filter(p=>new Date(p.fecha).toDateString()===hoy);
  const sueldosHoy    = sueldos.filter(s=>new Date(s.fecha).toDateString()===hoy);
  const gastosHoy     = gastos.filter(g=>new Date(g.fecha).toDateString()===hoy);
  const boletasHoy    = boletas.filter(b=>new Date(b.fecha).toDateString()===hoy);

  const ingresosHoy   = cierresHoy.reduce((s,c)=>s+Number(c.total||0),0);
  const digitalHoy    = cierresHoy.reduce((s,c)=>s+Number(c.totalDigital||0),0);
  const efectivoHoy   = cierresHoy.reduce((s,c)=>s+Number(c.efectivo||0),0);
  const pagosHoyTotal = pagosHoy.reduce((s,p)=>s+Number(p.monto||0),0);
  const sueldosHoyTot = sueldosHoy.filter(x=>x.forma!=="Retiro").reduce((s,x)=>s+Number(x.monto||0),0);
  const gastosHoyTot  = gastosHoy.reduce((s,g)=>s+Number(g.monto||0),0);
  const egresosDia    = pagosHoyTotal+sueldosHoyTot+gastosHoyTot;
  const netoDia       = ingresosHoy - egresosDia;

  // ── MES ──
  const ingMes   = cierresCaja.filter(c=>esMes(c.fecha)).reduce((s,c)=>s+Number(c.total||0),0);
  const pagosMes = pagos.filter(p=>esMes(p.fecha)).reduce((s,p)=>s+Number(p.monto||0),0);
  const sueMes   = sueldos.filter(s=>esMes(s.fecha)&&s.forma!=="Retiro").reduce((s,x)=>s+Number(x.monto||0),0);
  const gasMes   = gastos.filter(g=>esMes(g.fecha)).reduce((s,g)=>s+Number(g.monto||0),0);
  const egrMes   = pagosMes+sueMes+gasMes;
  const netoMes  = ingMes - egrMes;

  // ── ALERTAS ──
  const deudaTotal   = proveedores.reduce((s,p)=>{const d=calcDeuda(p.nombre);return s+Math.max(0,d?d.pendiente:0);},0);
  const topDeudores  = proveedores
    .map(p=>{const d=calcDeuda(p.nombre);return{nombre:p.nombre,pendiente:d?Math.max(0,d.pendiente):0};})
    .filter(p=>p.pendiente>0).sort((a,b)=>b.pendiente-a.pendiente).slice(0,3);
  const stockBajo    = stock.filter(s=>Number(s.minimo)>0&&Number(s.cantidad)<=Number(s.minimo));
  const difNeg7d     = cierresCaja.filter(c=>esSemana(c.fecha)&&Number(c.diferencia)<0);

  // ── ÚLTIMOS 7 DÍAS CIERRES ──
  const ultimos7 = [];
  for(let i=6;i>=0;i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    const ds = d.toDateString();
    const tot = cierresCaja.filter(c=>new Date(c.fecha).toDateString()===ds).reduce((s,c)=>s+Number(c.total||0),0);
    const dig = cierresCaja.filter(c=>new Date(c.fecha).toDateString()===ds).reduce((s,c)=>s+Number(c.totalDigital||0),0);
    const ef  = cierresCaja.filter(c=>new Date(c.fecha).toDateString()===ds).reduce((s,c)=>s+Number(c.efectivo||0),0);
    ultimos7.push({label:d.toLocaleDateString("es-AR",{weekday:"short",day:"numeric"}),tot,dig,ef});
  }
  const maxTot = Math.max(...ultimos7.map(d=>d.tot),1);

  const {saldoReal} = calcDigital();
  const totalConsolidado = saldo + saldoReal;

  // Cruce de movimientos digitales (desde siempre)
  const pagosTrDash   = (pagos||[]).filter(p=>p.forma==="Transferencia");
  const sueldosTrDash = (sueldos||[]).filter(s=>s.forma==="Transferencia");
  const gastosTrDash  = (gastos||[]).filter(g=>g.forma==="Transferencia");
  const totalIngresosGlobal=(cierresCaja||[]).reduce((s,c)=>s+Number(c.totalDigital||0),0);
  const totalEgresosGlobal=[...pagosTrDash,...sueldosTrDash,...gastosTrDash].reduce((s,m)=>s+Number(m.monto||0),0);
  const diferenciaGlobal=totalIngresosGlobal-totalEgresosGlobal;

  const PanelNum=({label,value,color,sub})=>(
    <div style={{flex:1,background:color||"#2C1A0E",borderRadius:12,padding:"14px 16px"}}>
      <div style={{fontSize:".62rem",color:"#E8DCC8",opacity:.7,textTransform:"uppercase",letterSpacing:".06em"}}>{label}</div>
      <div style={{fontFamily:"Georgia,serif",fontSize:"1.4rem",color:"#E8DCC8",margin:"4px 0 2px",lineHeight:1.1}}>{fmt(value)}</div>
      {sub&&<div style={{fontSize:".7rem",color:"#E8DCC8",opacity:.6}}>{sub}</div>}
    </div>
  );

  return(<>
    <ST>Dashboard</ST><SS>Panorama general del negocio.</SS>

    {/* DINERO DISPONIBLE */}
    <div style={{background:"#2C1A0E",borderRadius:14,padding:"20px",marginBottom:12}}>
      <div style={{fontSize:".65rem",letterSpacing:".08em",textTransform:"uppercase",color:"#E8DCC8",opacity:.7}}>Total consolidado disponible</div>
      <div style={{fontFamily:"Georgia,serif",fontSize:"2.8rem",color:"#E8DCC8",margin:"4px 0 6px"}}>{fmt(totalConsolidado)}</div>
      <div style={{display:"flex",gap:8}}>
        <PanelNum label="💵 Caja Disponible" value={saldo}/>
        <PanelNum label="💳 Banco" value={saldoReal} color="#1a3a2a"/>
      </div>
    </div>

    {/* CRUCE DE MOVIMIENTOS DIGITALES */}
    <div style={{background:"#fff",borderRadius:14,padding:18,marginBottom:12,boxShadow:"0 2px 12px rgba(44,26,14,.08)"}}>
      <div style={{fontSize:".68rem",fontWeight:700,letterSpacing:".09em",textTransform:"uppercase",color:"#7B7063",marginBottom:14}}>📊 Cruce de movimientos digitales (desde siempre)</div>
      <div style={{display:"flex",gap:8}}>
        <div style={{flex:1,background:"#EAF5F0",borderRadius:10,padding:"12px 14px"}}>
          <div style={{fontSize:".62rem",color:"#2D6A4F",fontWeight:700,textTransform:"uppercase",letterSpacing:".05em",marginBottom:4}}>📥 Ingresos digitales</div>
          <div style={{fontFamily:"Georgia,serif",fontSize:"1.3rem",color:"#2D6A4F"}}>{fmt(totalIngresosGlobal)}</div>
          <div style={{fontSize:".62rem",color:"#7B7063",marginTop:2}}>Suma de cierres de caja</div>
        </div>
        <div style={{flex:1,background:"#FFF0EF",borderRadius:10,padding:"12px 14px"}}>
          <div style={{fontSize:".62rem",color:"#C0392B",fontWeight:700,textTransform:"uppercase",letterSpacing:".05em",marginBottom:4}}>📤 Egresos transferencia</div>
          <div style={{fontFamily:"Georgia,serif",fontSize:"1.3rem",color:"#C0392B"}}>{fmt(totalEgresosGlobal)}</div>
          <div style={{fontSize:".62rem",color:"#7B7063",marginTop:2}}>Pagos + sueldos + gastos</div>
        </div>
      </div>
      <div style={{marginTop:10,padding:"10px 14px",background:diferenciaGlobal>=0?"#EAF5F0":"#FFF0EF",borderRadius:10,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <span style={{fontSize:".78rem",fontWeight:600,color:"#2C1A0E"}}>Diferencia neta</span>
        <span style={{fontFamily:"Georgia,serif",fontSize:"1.2rem",fontWeight:700,color:diferenciaGlobal>=0?"#2D6A4F":"#C0392B"}}>{diferenciaGlobal>=0?"+":""}{fmt(diferenciaGlobal)}</span>
      </div>
    </div>

    {/* ALERTAS */}
    {(stockBajo.length>0||difNeg7d.length>0)&&(
      <div style={{background:"#FFF0EF",border:"1px solid #f5b7b1",borderRadius:12,padding:"14px 16px",marginBottom:12}}>
        <div style={{fontWeight:700,fontSize:".82rem",color:"#C0392B",marginBottom:8}}>⚠️ Alertas</div>
        {stockBajo.length>0&&<div style={{fontSize:".78rem",color:"#C0392B",marginBottom:4}}>📦 Stock bajo: {stockBajo.map(s=>s.nombre).join(", ")}</div>}
        {difNeg7d.length>0&&<div style={{fontSize:".78rem",color:"#C0392B"}}>📉 {difNeg7d.length} cierre{difNeg7d.length!==1?"s":""} con diferencia negativa esta semana</div>}
      </div>
    )}

    {/* RESUMEN DÍA */}
    <div style={{background:"#fff",borderRadius:14,padding:"18px 20px",boxShadow:"0 2px 12px rgba(44,26,14,.08)",marginBottom:12}}>
      <div style={{fontSize:".68rem",fontWeight:700,letterSpacing:".09em",textTransform:"uppercase",color:"#7B7063",marginBottom:12}}>Hoy · {new Date().toLocaleDateString("es-AR",{weekday:"long",day:"numeric",month:"long"})}</div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:12}}>
        {[
          ["💵 Efectivo ingresado",fmt(efectivoHoy),"#2D6A4F"],
          ["💳 Digital ingresado",fmt(digitalHoy),"#B7860B"],
          ["🧾 Boletas recibidas",fmt(boletasHoy.reduce((s,b)=>s+Number(b.monto||0),0)),"#2C1A0E"],
          ["💸 Pagos a proveedores",fmt(pagosHoyTotal),"#C0392B"],
          ["👥 Sueldos",fmt(sueldosHoyTot),"#C0392B"],
          ["🏠 Pagos Digitales",fmt(gastosHoyTot),"#C0392B"],
        ].map(([l,v,c])=>(
          <div key={l} style={{background:"#F9F6F1",borderRadius:10,padding:"10px 12px"}}>
            <div style={{fontSize:".68rem",color:"#7B7063",marginBottom:2}}>{l}</div>
            <div style={{fontWeight:700,fontSize:".92rem",color:c}}>{v}</div>
          </div>
        ))}
      </div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 12px",background:netoDia>=0?"#EAF5F0":"#FFF0EF",borderRadius:10}}>
        <span style={{fontWeight:700,fontSize:".85rem",color:netoDia>=0?"#2D6A4F":"#C0392B"}}>Neto del día</span>
        <span style={{fontFamily:"Georgia,serif",fontSize:"1.3rem",fontWeight:700,color:netoDia>=0?"#2D6A4F":"#C0392B"}}>{netoDia>=0?"+":""}{fmt(netoDia)}</span>
      </div>
      {cierresHoy.length===0&&<div style={{fontSize:".75rem",color:"#7B7063",marginTop:8,textAlign:"center"}}>Sin cierres registrados hoy</div>}
    </div>

    {/* GRÁFICO 7 DÍAS */}
    <div style={{background:"#fff",borderRadius:14,padding:"18px 20px",boxShadow:"0 2px 12px rgba(44,26,14,.08)",marginBottom:12}}>
      <div style={{fontSize:".68rem",fontWeight:700,letterSpacing:".09em",textTransform:"uppercase",color:"#7B7063",marginBottom:14}}>Cierres · últimos 7 días</div>
      <div style={{display:"flex",alignItems:"flex-end",gap:6,height:100}}>
        {ultimos7.map((d,i)=>(
          <div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:3}}>
            <div style={{fontSize:".58rem",color:"#7B7063",whiteSpace:"nowrap"}}>{d.tot>0?fmt(d.tot).replace("$",""):""}</div>
            <div style={{width:"100%",display:"flex",flexDirection:"column",gap:1,justifyContent:"flex-end",height:72}}>
              {d.dig>0&&<div style={{width:"100%",height:Math.max(4,Math.round((d.dig/maxTot)*72*0.6))+"px",background:"#B7860B",borderRadius:"3px 3px 0 0"}}/>}
              {d.ef>0&&<div style={{width:"100%",height:Math.max(4,Math.round((d.ef/maxTot)*72*0.4))+"px",background:"#2D6A4F",borderRadius:d.dig>0?"0":"3px 3px 0 0"}}/>}
              {d.tot===0&&<div style={{width:"100%",height:4,background:"#E8DCC8",borderRadius:3}}/>}
            </div>
            <div style={{fontSize:".62rem",color:"#7B7063",whiteSpace:"nowrap"}}>{d.label}</div>
          </div>
        ))}
      </div>
      <div style={{display:"flex",gap:12,marginTop:8,justifyContent:"center"}}>
        <span style={{fontSize:".68rem",color:"#7B7063"}}><span style={{display:"inline-block",width:10,height:10,background:"#B7860B",borderRadius:2,marginRight:4}}/>Digital</span>
        <span style={{fontSize:".68rem",color:"#7B7063"}}><span style={{display:"inline-block",width:10,height:10,background:"#2D6A4F",borderRadius:2,marginRight:4}}/>Efectivo</span>
      </div>
    </div>

    {/* MES */}
    <div style={{background:"#fff",borderRadius:14,padding:"18px 20px",boxShadow:"0 2px 12px rgba(44,26,14,.08)",marginBottom:12}}>
      <div style={{fontSize:".68rem",fontWeight:700,letterSpacing:".09em",textTransform:"uppercase",color:"#7B7063",marginBottom:12}}>
        {now.toLocaleDateString("es-AR",{month:"long",year:"numeric"})}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:12}}>
        {[
          ["Total ingresos",fmt(ingMes),"#2D6A4F"],
          ["Pagos proveedores",fmt(pagosMes),"#C0392B"],
          ["Sueldos",fmt(sueMes),"#C0392B"],
          ["Pagos Digitales",fmt(gasMes),"#C0392B"],
        ].map(([l,v,c])=>(
          <div key={l} style={{background:"#F9F6F1",borderRadius:10,padding:"10px 12px"}}>
            <div style={{fontSize:".68rem",color:"#7B7063",marginBottom:2}}>{l}</div>
            <div style={{fontWeight:700,fontSize:".92rem",color:c}}>{v}</div>
          </div>
        ))}
      </div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 12px",background:netoMes>=0?"#EAF5F0":"#FFF0EF",borderRadius:10}}>
        <span style={{fontWeight:700,fontSize:".85rem",color:netoMes>=0?"#2D6A4F":"#C0392B"}}>Neto del mes</span>
        <span style={{fontFamily:"Georgia,serif",fontSize:"1.3rem",fontWeight:700,color:netoMes>=0?"#2D6A4F":"#C0392B"}}>{netoMes>=0?"+":""}{fmt(netoMes)}</span>
      </div>
    </div>

    {/* DEUDA TOTAL PROVEEDORES */}
    <div style={{background:"#fff",borderRadius:14,padding:"18px 20px",boxShadow:"0 2px 12px rgba(44,26,14,.08)",marginBottom:12}}>
      <div style={{fontSize:".68rem",fontWeight:700,letterSpacing:".09em",textTransform:"uppercase",color:"#7B7063",marginBottom:8}}>🏪 Deuda total a proveedores</div>
      <div style={{fontFamily:"Georgia,serif",fontSize:"2rem",color:"#C0392B",margin:"4px 0 2px"}}>{fmt(deudaTotal)}</div>
      <div style={{fontSize:".78rem",color:"#7B7063"}}>Suma de deuda pendiente con todos los proveedores</div>
    </div>

    {/* TOP DEUDORES */}
    {topDeudores.length>0&&(
      <div style={{background:"#fff",borderRadius:14,padding:"18px 20px",boxShadow:"0 2px 12px rgba(44,26,14,.08)",marginBottom:12}}>
        <div style={{fontSize:".68rem",fontWeight:700,letterSpacing:".09em",textTransform:"uppercase",color:"#7B7063",marginBottom:12}}>🏪 Top deuda proveedores</div>
        {topDeudores.map((p,i)=>(
          <div key={p.nombre} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 0",borderBottom:i<topDeudores.length-1?"1px solid #F9F6F1":"none"}}>
