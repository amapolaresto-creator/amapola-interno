function StockConteo({stock,saveStock,catalogo,saveCatalogo,proveedoresCat,conteos,saveConteos,registradoPor,onDirtyChange}){
  const[fProv,setFProv]=useState("");
  const[fSector,setFSector]=useState("");
  const[fQuery,setFQuery]=useState("");
  const[valores,setValores]=useState({});
  const[busy,setBusy]=useState(false);
  const[expandido,setExpandido]=useState({});
  const[mostrarInactivos,setMostrarInactivos]=useState(false);
  const[colapsados,setColapsados]=useState({});
  const[agruparPor,setAgruparPor]=useState("proveedor");
  const[verHistorial,setVerHistorial]=useState(false);
  const[fechaConteo,setFechaConteo]=useState(hoyLocal());
  const[desdeHist,setDesdeHist]=useState("");
  const[hastaHist,setHastaHist]=useState("");
  const[verPorSemana,setVerPorSemana]=useState(false);
  const sectoresCat=[...new Set([...stock.map(s=>s.sector),...catalogo.map(c=>c.sector)].filter(Boolean))].sort();
  const thS={padding:"7px 8px",fontWeight:700,color:"#7B7063",fontSize:".63rem",letterSpacing:".05em",textTransform:"uppercase",borderBottom:"2px solid #E8DCC8",textAlign:"left"};
  const tdS={padding:"7px 8px"};
  const UNIDADES=["unidades","kg","g","litros","ml","cajas","bolsas","porciones","paquetes"];

  useEffect(()=>{
    if(onDirtyChange)onDirtyChange(Object.values(valores).some(v=>v!==undefined&&v!==""));
  },[valores]);

  const toggleActivo=async(catalogoId,activoActual)=>{
    if(!catalogoId)return;
    await saveCatalogo(catalogo.map(c=>c.id===catalogoId?{...c,activo:!activoActual}:c));
    toast(activoActual?"Producto marcado como inactivo":"Producto reactivado ✓");
  };

  const catalogoIds=new Set(catalogo.map(c=>c.id));
  const stockPorCatId={};
  stock.forEach(s=>{if(s.catalogoId)stockPorCatId[s.catalogoId]=s;});
  const combinado=[];
  catalogo.forEach(c=>{
    const activo=c.activo!==false;
    const s=stockPorCatId[c.id];
    if(s)combinado.push({...s,catalogoId:c.id,activo});
    else combinado.push({id:"sc_"+c.id,sinCargar:true,catalogoId:c.id,nombre:c.producto,proveedor:c.proveedor,sector:c.sector,unidad:c.unidad||"unidades",cantidad:0,minimo:0,movimientos:[],activo});
  });
  stock.forEach(s=>{if(!s.catalogoId||!catalogoIds.has(s.catalogoId))combinado.push({...s,activo:true});});

  const inactivosCount=catalogo.filter(c=>c.activo===false).length;

  const filtrado=combinado.filter(s=>{
    if(mostrarInactivos){if(s.activo)return false;}else{if(!s.activo)return false;}
    if(fProv&&s.proveedor!==fProv)return false;
    if(fSector&&s.sector!==fSector)return false;
    if(fQuery&&!norm(s.nombre).includes(norm(fQuery)))return false;
    return true;
  });

  const valorDe=s=>valores[s.id]!==undefined?valores[s.id]:(s.sinCargar?"":String(s.cantidad));
  const diffDe=s=>{
    const v=valorDe(s);
    if(v===""||isNaN(Number(v)))return null;
    return Number(v)-(s.sinCargar?0:Number(s.cantidad));
  };

  // Agrupar por proveedor (default) o por sector — físicamente el conteo suele hacerse recorriendo
  // sectores/depósitos, no proveedores, así que se puede alternar según convenga.
  const claveGrupo=s=>agruparPor==="sector"?(s.sector||"Sin sector"):(s.proveedor||"Sin proveedor");
  const gruposCnt=[];
  filtrado.forEach(s=>{
    const key=claveGrupo(s);
    let g=gruposCnt.find(g=>g.key===key);
    if(!g){g={key,items:[]};gruposCnt.push(g);}
    g.items.push(s);
  });
  gruposCnt.sort((a,b)=>a.key.localeCompare(b.key));
  gruposCnt.forEach(g=>g.items.sort((a,b)=>a.nombre.localeCompare(b.nombre)));

  // Último conteo por grupo puntual (mismo criterio que claveGrupo, pero sobre los ítems ya guardados
  // en el historial) — para ver de un vistazo qué proveedor/sector está más atrasado sin expandir cada uno.
  const claveGrupoItem=it=>agruparPor==="sector"?(it.sector||"Sin sector"):(it.proveedor||"Sin proveedor");
  const ultimoConteoDeGrupo=key=>{
    const reg=(conteos||[]).find(c=>(c.items||[]).some(it=>claveGrupoItem(it)===key));
    return reg?reg.fecha:null;
  };

  const colapsarTodos=()=>{const t={};gruposCnt.forEach(g=>{t[g.key]=true;});setColapsados(t);};
  const expandirTodos=()=>setColapsados({});

  const conMenos=filtrado.filter(s=>{const d=diffDe(s);return d!==null&&d<0;}).length;
  const conMas=filtrado.filter(s=>{const d=diffDe(s);return d!==null&&d>0;}).length;

  // Solo se considera "tocado" (y por lo tanto se guarda) lo que realmente se escribió en el campo
  // Contado — así el conteo guardado refleja lo que se verificó a ojo de verdad, no todo lo que
  // quedó visible con el filtro actual.
  const tocados=filtrado.filter(s=>valores[s.id]!==undefined&&valores[s.id]!==""&&!isNaN(Number(valores[s.id])));

  // Diferencia "grande": probablemente un error de tipeo más que consumo normal — se resalta aparte.
  // Ajustado para no marcar de más productos de alto volumen: una diferencia absoluta chica (≥5) solo
  // cuenta si además representa una porción mínima del teórico (≥10%); una diferencia relativa grande
  // (≥30% del teórico) siempre se marca, sin importar el número absoluto.
  const esDiferenciaGrande=(s,d)=>{
    if(d===null||d===0)return false;
    const teorico=s.sinCargar?0:Number(s.cantidad);
    if(teorico<=0)return Math.abs(d)>=5;
    const pct=Math.abs(d)/teorico;
    return pct>=0.3||(Math.abs(d)>=5&&pct>=0.1);
  };

  // Último conteo registrado para el alcance actual (proveedor y/o sector elegidos arriba), y cuántos
  // de los productos visibles ya se cargaron en esta sesión — para no perder de vista qué está
  // desactualizado ni perder el hilo de cuánto falta.
  const diasNumeroDesde=fechaIso=>Math.max(0,Math.floor((Date.now()-new Date(fechaIso).getTime())/(1000*60*60*24)));
  const diasDesde=fechaIso=>{
    const dias=diasNumeroDesde(fechaIso);
    if(dias<=0)return"hoy";
    if(dias===1)return"ayer";
    return`hace ${dias} días`;
  };
  const ultimoConteoRegistro=(conteos||[]).find(c=>(c.items||[]).some(it=>(!fProv||it.proveedor===fProv)&&(!fSector||it.sector===fSector)));

  // Fecha desde la que viene acumulando el "teórico" de ESTE producto puntual (no del alcance general):
  // el conteo anterior más reciente que lo incluyó, o si nunca se contó, la fecha en que se cargó al
  // stock. Sirve para relativizar la diferencia — no es lo mismo -12 en 3 días que -12 en 40.
  const fechaTeoricoDe=s=>{
    if(s.sinCargar)return null;
    const ultimo=(conteos||[]).find(c=>(c.items||[]).some(it=>it.stockId===s.id));
    return ultimo?ultimo.fecha:(s.fecha||null);
  };

  const guardarConteo=async()=>{
    if(!tocados.length){toast(filtrado.length?"No cargaste ningún conteo":"No hay productos para contar con este filtro");return;}
    const conDiferencia=conMenos+conMas;
    const alcanceTxt=fProv?`proveedor ${fProv}`:fSector?`sector ${fSector}`:"todo el inventario";
    if(!confirm(`Vas a registrar un conteo de ${tocados.length} producto${tocados.length!==1?"s":""} (${alcanceTxt}), ${conDiferencia} con diferencia. ¿Confirmás?`))return;
    setBusy(true);
    const fecha=fechaLocalISO(fechaConteo||hoyLocal());
    const nuevosStock=[];
    const itemsConteo=tocados.map(s=>{
      const v=valorDe(s);
      const teorico=s.sinCargar?0:Number(s.cantidad);
      const contado=(v===""||isNaN(Number(v)))?teorico:Math.max(0,Number(v));
      let stockId=s.id;
      if(s.sinCargar){
        stockId=uid();
        const mov={id:uid(),tipo:"entrada",origen:"conteo",cantidad:contado,obs:"Conteo inicial",fecha,registradoPor:registradoPor||null};
        nuevosStock.push({id:stockId,catalogoId:s.catalogoId,nombre:s.nombre,proveedor:s.proveedor,sector:s.sector,cantidad:contado,minimo:0,unidad:s.unidad,movimientos:contado>0?[mov]:[],fecha,registradoPor:registradoPor||null});
      }
      return{stockId,nombre:s.nombre,proveedor:s.proveedor,sector:s.sector,unidad:s.unidad,teorico,contado,diferencia:contado-teorico};
    });
    const stockActualizado=stock.map(s=>{
      const it=itemsConteo.find(i=>i.stockId===s.id);
      if(!it)return s;
      if(it.diferencia===0)return{...s,cantidad:it.contado};
      const mov={id:uid(),tipo:it.diferencia>0?"entrada":"salida",origen:"conteo",cantidad:Math.abs(it.diferencia),obs:`Conteo: teórico ${it.teorico}, contado ${it.contado}`,fecha,registradoPor:registradoPor||null};
      return{...s,cantidad:it.contado,movimientos:[mov,...(s.movimientos||[])].slice(0,50)};
    }).concat(nuevosStock);
    await saveStock(stockActualizado);
    const registro={id:uid(),fecha,alcance:fProv?`Proveedor: ${fProv}`:fSector?`Sector: ${fSector}`:"Todo el inventario",items:itemsConteo,registradoPor:registradoPor||null};
    await saveConteos([registro,...(conteos||[])]);
    toast(`✓ Conteo guardado: ${itemsConteo.length} producto${itemsConteo.length!==1?"s":""}`);
    setValores({});setBusy(false);setFechaConteo(hoyLocal());
  };

  // Cambiar la unidad de medida de un producto desde acá mismo (Conteo): actualiza el catálogo (fuente
  // de verdad para productos "sin cargar") y, si ya tiene un registro de stock cargado, también ese
  // registro — así el cambio se ve reflejado al toque en toda la app.
  const cambiarUnidad=async(s,nuevaUnidad)=>{
    if(s.catalogoId&&catalogoIds.has(s.catalogoId)){
      await saveCatalogo(catalogo.map(c=>c.id===s.catalogoId?{...c,unidad:nuevaUnidad}:c));
    }
    if(!s.sinCargar){
      await saveStock(stock.map(x=>x.id===s.id?{...x,unidad:nuevaUnidad}:x));
    }
    toast("Unidad actualizada ✓");
  };

  // Historial de conteos filtrado por el proveedor elegido arriba (fProv) — si un conteo fue de "Todo el
  // inventario" o de un sector, se muestran solo los ítems de ese proveedor dentro de ese registro.
  const conteosHist=(fProv
    ?(conteos||[]).map(c=>({...c,items:(c.items||[]).filter(it=>it.proveedor===fProv)})).filter(c=>c.items.length>0)
    :(conteos||[])
  ).filter(c=>{
    const f=c.fecha.slice(0,10);
    return(!desdeHist||f>=desdeHist)&&(!hastaHist||f<=hastaHist);
  });

  // Resumen semanal: agrupa los conteos ya filtrados (conteosHist) por semana calendario (lunes a domingo)
  // y por producto, sumando las diferencias de todos los conteos que caigan en esa semana — para ver de un
  // vistazo cuánto se perdió/ganó cada semana, en vez de conteo por conteo. Ojo: si un producto no se contó
  // todas las semanas, el número de una semana puede en realidad cubrir más de 7 días de movimiento (el
  // "teórico" siempre arranca del último conteo de ese producto, sea cuando haya sido).
  const claveDia=d=>{const off=d.getTimezoneOffset();return new Date(d.getTime()-off*60000).toISOString().slice(0,10);};
  const lunesDe=fISO=>{
    const d=new Date(fISO.slice(0,10)+"T12:00:00");
    const dow=(d.getDay()+6)%7; // 0=lunes ... 6=domingo
    d.setDate(d.getDate()-dow);
    return d;
  };
  const resumenSemanal=(()=>{
    const porSemana={};
    conteosHist.forEach(c=>{
      const lunes=lunesDe(c.fecha);
      const domingo=new Date(lunes);domingo.setDate(lunes.getDate()+6);
      const claveSemana=claveDia(lunes);
      if(!porSemana[claveSemana])porSemana[claveSemana]={lunes,domingo,productos:{}};
      (c.items||[]).forEach(it=>{
        const clave=it.stockId||it.nombre;
        if(!porSemana[claveSemana].productos[clave]){
          porSemana[claveSemana].productos[clave]={nombre:it.nombre,unidad:it.unidad,diferencia:0,conteos:0};
        }
        porSemana[claveSemana].productos[clave].diferencia+=Number(it.diferencia||0);
        porSemana[claveSemana].productos[clave].conteos+=1;
      });
    });
    return Object.entries(porSemana)
      .sort((a,b)=>b[0].localeCompare(a[0]))
      .map(([clave,s])=>({
        clave,lunes:s.lunes,domingo:s.domingo,
        productos:Object.values(s.productos).filter(p=>p.diferencia!==0).sort((a,b)=>a.diferencia-b.diferencia),
      }))
      .filter(s=>s.productos.length>0);
  })();

  const verNotaConteo=(c,items,titulo)=>{
    const w=window.open("","_blank");
    if(w){w.document.write(notaConteoHTML(c,items,titulo));w.document.close();}
  };

  // Eliminar un conteo del historial revierte también el ajuste de stock que ese conteo generó (vuelve
  // cada producto a su cantidad teórica de ese momento y saca el movimiento "conteo" correspondiente) —
  // antes solo borraba el registro y el stock quedaba desalineado sin forma fácil de corregirlo.
  // Si el historial está filtrado por proveedor (fProv), un conteo mixto ("Todo el inventario") solo
  // pierde los ítems de ESE proveedor — el resto del registro (otros proveedores) se conserva intacto.
  const eliminarConteo=async c=>{
    const original=(conteos||[]).find(x=>x.id===c.id)||c;
    const itemsAEliminar=fProv?(original.items||[]).filter(it=>it.proveedor===fProv):(original.items||[]);
    const itemsRestantes=fProv?(original.items||[]).filter(it=>it.proveedor!==fProv):[];
    const msg=fProv
      ?`¿Eliminar los ${itemsAEliminar.length} ítems de ${fProv} de este conteo y revertir su ajuste de stock? No se puede deshacer.`
      :"¿Eliminar este conteo y revertir el ajuste de stock que generó? No se puede deshacer.";
    if(!confirm(msg))return;
    const stockRevertido=stock.map(s=>{
      const it=itemsAEliminar.find(i=>i.stockId===s.id);
      if(!it)return s;
      return{...s,cantidad:it.teorico,movimientos:(s.movimientos||[]).filter(m=>!(m.origen==="conteo"&&m.fecha===original.fecha))};
    });
    await saveStock(stockRevertido);
    if(itemsRestantes.length>0){
      await saveConteos((conteos||[]).map(x=>x.id===original.id?{...x,items:itemsRestantes}:x));
    }else{
      await saveConteos((conteos||[]).filter(x=>x.id!==original.id));
    }
    toast("Conteo eliminado y stock revertido ✓");
  };

  if(!combinado.length)return(
    <Empty icon="🧮">Todavía no hay productos en el catálogo. Cargalos primero desde 🗂️ Catálogo.</Empty>
  );

  if(verHistorial)return(<>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16,flexWrap:"wrap",gap:10}}>
      <p style={{fontFamily:"Georgia,serif",fontSize:"1.15rem"}}>🧮 Historial de conteos</p>
      <button onClick={()=>setVerHistorial(false)} style={{padding:"9px 16px",border:"none",borderRadius:10,background:"#E8DCC8",color:"#2C1A0E",fontSize:".8rem",fontWeight:600,cursor:"pointer"}}>← Volver al conteo</button>
    </div>
    <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:16,alignItems:"flex-end"}}>
      <select value={fProv} onChange={e=>setFProv(e.target.value)} style={{...sS,flex:"1 1 200px"}}>
        <option value="">Todos los proveedores</option>
        {proveedoresCat.map(p=><option key={p} value={p}>{p}</option>)}
      </select>
      <div>
        <label style={{display:"block",fontSize:".68rem",fontWeight:600,color:"#7B7063",marginBottom:3}}>Desde</label>
        <input type="date" value={desdeHist} onChange={e=>setDesdeHist(e.target.value)} style={{...iS,fontSize:".82rem",padding:"7px 10px"}}/>
      </div>
      <div>
        <label style={{display:"block",fontSize:".68rem",fontWeight:600,color:"#7B7063",marginBottom:3}}>Hasta</label>
        <input type="date" value={hastaHist} onChange={e=>setHastaHist(e.target.value)} style={{...iS,fontSize:".82rem",padding:"7px 10px"}}/>
      </div>
      {(desdeHist||hastaHist)&&<button onClick={()=>{setDesdeHist("");setHastaHist("");}} style={{padding:"9px 12px",borderRadius:10,border:"1px solid #E8DCC8",background:"transparent",color:"#7B7063",fontSize:".72rem",fontWeight:600,cursor:"pointer"}}>Limpiar fechas</button>}
      <button onClick={()=>setVerPorSemana(!verPorSemana)} style={{padding:"9px 14px",border:"none",borderRadius:10,background:verPorSemana?"#7B7063":"#F2EAE0",color:verPorSemana?"#fff":"#7B7063",fontSize:".78rem",fontWeight:600,cursor:"pointer",whiteSpace:"nowrap"}}>{verPorSemana?"← Ver por conteo":"📅 Ver por semana"}</button>
    </div>
    {verPorSemana?(
      !resumenSemanal.length?<Empty icon="📅">No hay diferencias registradas en ese rango</Empty>:resumenSemanal.map(s=>(
        <div key={s.clave} style={{background:"#fff",borderRadius:12,marginBottom:10,boxShadow:"0 2px 10px rgba(44,26,14,.07)",overflow:"hidden"}}>
          <div style={{padding:"12px 16px",background:"#F9F6F1"}}>
            <div style={{fontWeight:600,fontSize:".85rem"}}>Semana del {fmtF(claveDia(s.lunes)+"T12:00:00")} al {fmtF(claveDia(s.domingo)+"T12:00:00")}</div>
            <div style={{fontSize:".7rem",color:"#7B7063",marginTop:2}}>{s.productos.length} producto{s.productos.length!==1?"s":""} con diferencia</div>
          </div>
          <div style={{overflowX:"auto"}}>
            <table style={{width:"100%",borderCollapse:"collapse",fontSize:".76rem",minWidth:420}}>
              <thead>
                <tr style={{background:"#F9F6F1"}}>
                  <th style={thS}>Producto</th>
                  <th style={{...thS,textAlign:"right"}}>Diferencia semana</th>
                  <th style={{...thS,textAlign:"right"}}>Conteos</th>
                </tr>
              </thead>
              <tbody>
                {s.productos.map((p,i)=>(
                  <tr key={p.nombre} style={{background:i%2===0?"#fff":"#F9F6F1"}}>
                    <td style={tdS}>{p.nombre}</td>
                    <td style={{...tdS,textAlign:"right",fontWeight:700,color:p.diferencia>0?"#2D6A4F":"#C0392B"}}>{p.diferencia>0?"+":""}{p.diferencia} {p.unidad}</td>
                    <td style={{...tdS,textAlign:"right",color:"#7B7063"}}>{p.conteos}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      ))
    ):(
    !conteosHist||!conteosHist.length?<Empty icon="🧮">{fProv?`Todavía no hay ningún conteo con productos de ${fProv}`:"Todavía no hiciste ningún conteo"}</Empty>:conteosHist.map(c=>{
      const abierto=!!expandido[c.id];
      const conDif=(c.items||[]).filter(i=>i.diferencia!==0);
      const tituloNota=fProv?`Proveedor: ${fProv}`:c.alcance;
      return(
        <div key={c.id} style={{background:"#fff",borderRadius:12,marginBottom:10,boxShadow:"0 2px 10px rgba(44,26,14,.07)",overflow:"hidden"}}>
          <div onClick={()=>setExpandido({...expandido,[c.id]:!abierto})} style={{padding:"12px 16px",cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center",gap:8}}>
            <div>
              <div style={{fontWeight:600,fontSize:".85rem"}}>{abierto?"▾":"▸"} {fmtF(c.fecha)} {fmtH(c.fecha)} · {fProv?`Proveedor: ${fProv}`:c.alcance}</div>
              <div style={{fontSize:".7rem",color:"#7B7063",marginTop:2}}>{(c.items||[]).length} contados · {conDif.length} con diferencia{c.registradoPor?` · ${c.registradoPor}`:""}</div>
            </div>
            <div style={{display:"flex",gap:6,flexShrink:0}}>
              <SmBtn color="#2D6A4F" onClick={e=>{e.stopPropagation();verNotaConteo(c,c.items,tituloNota);}}>📄 Nota de conteo</SmBtn>
              <SmBtn color="#C0392B" onClick={e=>{e.stopPropagation();eliminarConteo(c);}}>Eliminar</SmBtn>
            </div>
          </div>
          {abierto&&(
            <div style={{overflowX:"auto",borderTop:"1px solid #F2EAE0"}}>
              <table style={{width:"100%",borderCollapse:"collapse",fontSize:".76rem",minWidth:480}}>
                <thead>
                  <tr style={{background:"#F9F6F1"}}>
                    <th style={thS}>Producto</th>
                    <th style={{...thS,textAlign:"right"}}>Teórico</th>
                    <th style={{...thS,textAlign:"right"}}>Contado</th>
                    <th style={{...thS,textAlign:"right"}}>Diferencia</th>
                  </tr>
                </thead>
                <tbody>
                  {(c.items||[]).map((it,i)=>(
                    <tr key={i} style={{background:i%2===0?"#fff":"#F9F6F1"}}>
                      <td style={tdS}>{it.nombre}</td>
                      <td style={{...tdS,textAlign:"right",color:"#7B7063"}}>{it.teorico} {it.unidad}</td>
                      <td style={{...tdS,textAlign:"right"}}>{it.contado} {it.unidad}</td>
                      <td style={{...tdS,textAlign:"right",fontWeight:700,color:it.diferencia>0?"#2D6A4F":it.diferencia<0?"#C0392B":"#B7A98F"}}>{it.diferencia>0?"+":""}{it.diferencia}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
        </div>
      );
    }))}
  </>);

  return(<>
    <Card title="Nuevo conteo">
      <p style={{fontSize:".78rem",color:"#7B7063",marginBottom:14}}>Elegí qué contar (o dejalo en todos), corregí lo que sea distinto de lo que muestra el sistema y guardá. La diferencia queda registrada como el consumo/venta implícito de ese período.</p>
      <div style={{marginBottom:12}}>
        <label style={{display:"block",fontSize:".68rem",fontWeight:600,color:"#7B7063",marginBottom:3}}>Fecha del conteo</label>
        <input type="date" value={fechaConteo} onChange={e=>setFechaConteo(e.target.value)} style={{...iS,fontSize:".82rem",padding:"7px 10px",width:170}}/>
        {fechaConteo&&fechaConteo!==hoyLocal()&&<div style={{fontSize:".65rem",color:"#B7860B",marginTop:3}}>⚠️ Vas a registrar este conteo con fecha atrasada</div>}
      </div>
      <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
        <input value={fQuery} onChange={e=>setFQuery(e.target.value)} placeholder="Buscar producto..." style={{flex:"2 1 160px",padding:"9px 12px",border:"1.5px solid #E8DCC8",borderRadius:10,fontSize:".82rem",background:"#fff",color:"#2C1A0E"}}/>
        <select value={fProv} onChange={e=>setFProv(e.target.value)} style={{...sS,flex:"1 1 120px"}}>
          <option value="">Todos los proveedores</option>
          {proveedoresCat.map(p=><option key={p} value={p}>{p}</option>)}
        </select>
        <select value={fSector} onChange={e=>setFSector(e.target.value)} style={{...sS,flex:"1 1 110px"}}>
          <option value="">Todos los sectores</option>
          {sectoresCat.map(s=><option key={s} value={s}>{s}</option>)}
        </select>
        <button onClick={()=>setVerHistorial(true)} style={{padding:"9px 14px",border:"none",borderRadius:10,background:"#F2EAE0",color:"#7B7063",fontSize:".78rem",fontWeight:600,cursor:"pointer",whiteSpace:"nowrap"}}>🧮 Historial de conteo{conteosHist&&conteosHist.length>0?` (${conteosHist.length})`:""}</button>
        <button onClick={()=>setMostrarInactivos(!mostrarInactivos)} style={{padding:"9px 14px",border:"none",borderRadius:10,background:mostrarInactivos?"#7B7063":"#F2EAE0",color:mostrarInactivos?"#fff":"#7B7063",fontSize:".78rem",fontWeight:600,cursor:"pointer",whiteSpace:"nowrap"}}>{mostrarInactivos?"← Volver a activos":`😴 Ver inactivos (${inactivosCount})`}</button>
      </div>

      <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center",marginTop:10}}>
        <span style={{fontSize:".7rem",color:"#7B7063"}}>Agrupar por:</span>
        <div style={{display:"flex",borderRadius:20,overflow:"hidden",border:"1px solid #E8DCC8"}}>
          {[["proveedor","Proveedor"],["sector","Sector"]].map(([v,l])=>(
            <button key={v} onClick={()=>setAgruparPor(v)} style={{padding:"5px 12px",border:"none",cursor:"pointer",fontSize:".72rem",fontWeight:600,background:agruparPor===v?"#2C1A0E":"transparent",color:agruparPor===v?"#E8DCC8":"#7B7063"}}>{l}</button>
          ))}
        </div>
        {gruposCnt.length>1&&(<>
          <button onClick={colapsarTodos} style={{padding:"5px 12px",borderRadius:20,border:"1px solid #E8DCC8",background:"transparent",color:"#7B7063",fontSize:".7rem",fontWeight:600,cursor:"pointer"}}>Colapsar todos</button>
          <button onClick={expandirTodos} style={{padding:"5px 12px",borderRadius:20,border:"1px solid #E8DCC8",background:"transparent",color:"#7B7063",fontSize:".7rem",fontWeight:600,cursor:"pointer"}}>Expandir todos</button>
        </>)}
      </div>

      <div style={{display:"flex",gap:8,flexWrap:"wrap",marginTop:12}}>
        <div style={{fontSize:".72rem",color:"#7B7063",background:"#F9F6F1",borderRadius:8,padding:"6px 10px"}}>
          🕒 Último conteo{fProv?` de ${fProv}`:fSector?` de ${fSector}`:""}: <strong>{ultimoConteoRegistro?diasDesde(ultimoConteoRegistro.fecha):"nunca"}</strong>
        </div>
        <div style={{fontSize:".72rem",color:"#7B7063",background:"#F9F6F1",borderRadius:8,padding:"6px 10px"}}>
          ✅ <strong>{tocados.length}/{filtrado.length}</strong> cargados en esta pasada
        </div>
      </div>

      {(conMenos>0||conMas>0)&&(
        <div style={{fontSize:".74rem",color:"#7B7063",marginTop:12}}>
          {conMenos>0&&<span style={{color:"#C0392B",fontWeight:600,marginRight:12}}>⚠️ {conMenos} con menos de lo esperado</span>}
          {conMas>0&&<span style={{color:"#2D6A4F",fontWeight:600}}>+ {conMas} con más de lo esperado</span>}
        </div>
      )}
    </Card>

    {!gruposCnt.length?<Empty icon="🔍">Ningún producto coincide con el filtro</Empty>:gruposCnt.map(g=>{
      const cerrado=!!colapsados[g.key];
      const ultimoGrupo=ultimoConteoDeGrupo(g.key);
      return(
      <div key={g.key} style={{background:"#fff",borderRadius:14,boxShadow:"0 2px 12px rgba(44,26,14,.08)",overflow:"hidden",marginBottom:14}}>
        <div onClick={()=>setColapsados({...colapsados,[g.key]:!cerrado})} style={{background:"#F4EEE3",padding:"9px 16px",fontFamily:"Georgia,serif",fontStyle:"italic",fontSize:".88rem",color:"#2C1A0E",borderBottom:cerrado?"none":"1px solid #E8DCC8",display:"flex",justifyContent:"space-between",alignItems:"center",cursor:"pointer",userSelect:"none"}}>
          <span>{cerrado?"▸":"▾"} {g.key}</span>
          <span style={{display:"flex",gap:8,alignItems:"center"}}>
            <span style={{fontSize:".6rem",color:"#7B7063",fontStyle:"normal",background:"#fff",borderRadius:10,padding:"2px 8px",whiteSpace:"nowrap"}}>🕒 {ultimoGrupo?diasDesde(ultimoGrupo):"nunca"}</span>
            <span style={{fontSize:".65rem",color:"#7B7063",fontStyle:"normal",whiteSpace:"nowrap"}}>{g.items.length} producto{g.items.length!==1?"s":""}</span>
          </span>
        </div>
        {!cerrado&&(
        <div style={{overflowX:"auto"}}>
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:".78rem",minWidth:480}}>
          <thead>
            <tr style={{background:"#F9F6F1"}}>
              <th style={thS}>Producto</th>
              <th style={{...thS,textAlign:"right"}}>Teórico</th>
              <th style={{...thS,width:110}}>Contado</th>
              <th style={{...thS,textAlign:"right"}}>Diferencia</th>
            </tr>
          </thead>
          <tbody>
            {g.items.map((s,i)=>{
              const d=diffDe(s);
              const val=valorDe(s);
              const grande=esDiferenciaGrande(s,d);
              const fechaTeo=fechaTeoricoDe(s);
              const diasTeo=fechaTeo?diasNumeroDesde(fechaTeo):null;
              return(
                <tr key={s.id} style={{background:i%2===0?"#fff":"#F9F6F1"}}>
                  <td style={tdS}>{s.nombre}{s.sinCargar&&<span style={{background:"#E8DCC8",color:"#7B7063",fontSize:".58rem",fontWeight:700,padding:"1px 6px",borderRadius:10,marginLeft:6}}>SIN CARGAR</span>}</td>
                  <td style={{...tdS,textAlign:"right",color:"#7B7063"}}>
                    {s.sinCargar?"—":(<>{s.cantidad} <span style={{fontSize:".68rem"}}>{s.unidad}</span></>)}
                    {fechaTeo&&<div style={{fontSize:".6rem",color:"#B7A98F",marginTop:2}}>desde {fmtF(fechaTeo)} · {diasDesde(fechaTeo)}</div>}
                  </td>
                  <td style={tdS}>
                    <div style={{display:"flex",alignItems:"center",gap:6}}>
                      <input type="number" min="0" value={val} onFocus={e=>e.target.select()} onChange={e=>{const v=e.target.value;if(v!==""&&Number(v)<0)return;setValores({...valores,[s.id]:v});}} placeholder="0" style={{width:80,border:"1.5px solid #E8DCC8",borderRadius:6,padding:"5px 6px",fontSize:".82rem",textAlign:"center"}}/>
                      <select value={s.unidad||"unidades"} onChange={e=>cambiarUnidad(s,e.target.value)} onClick={e=>e.stopPropagation()} style={{fontSize:".68rem",color:"#7B7063",border:"1px solid #E8DCC8",borderRadius:6,padding:"3px 4px",background:"#fff"}}>
                        {UNIDADES.map(u=><option key={u} value={u}>{u}</option>)}
                      </select>
                      <span style={{color:"#B7A98F",fontSize:".8rem"}}>✎</span>
                    </div>
                  </td>
                  <td style={{...tdS,textAlign:"right",fontFamily:"Georgia,serif",fontWeight:700,color:d>0?"#2D6A4F":d<0?"#C0392B":"#B7A98F",background:grande?(d>0?"#EAF5F0":"#FDEDEC"):"transparent"}}>
                    {grande&&<span title="Diferencia grande, revisar">⚠️ </span>}{d===null?"—":(d>0?"+":"")+d}
                    {d!==null&&d!==0&&diasTeo!==null&&<div style={{fontSize:".6rem",color:"#B7A98F",fontWeight:400,fontFamily:"inherit"}}>en {diasTeo} día{diasTeo===1?"":"s"}</div>}
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
        </div>
        )}
      </div>
      );
    })}

    {gruposCnt.length>0&&(
      <Btn bg="#2C1A0E" onClick={guardarConteo} disabled={busy||!tocados.length}>{busy?"Guardando…":`Guardar conteo (${tocados.length} producto${tocados.length!==1?"s":""})`}</Btn>
    )}
  </>);
}
function StockProduccion({stock,saveStock,catalogo,registradoPor,empleados}){
  const EMPS=(empleados||[]).filter(e=>e.estado==="Activo").slice().sort((a,b)=>a.nombre.localeCompare(b.nombre)).map(e=>e.nombre);
  const[prodId,setProdId]=useState("");
  const[cantidad,setCantidad]=useState("");
  const[empleado,setEmpleado]=useState("");
  const[obs,setObs]=useState("");
  const[busy,setBusy]=useState(false);
  const[fecha,setFecha]=useState(hoyLocal());
  const[offset,setOffset]=useState(0);
  const[busqueda,setBusqueda]=useState("");
  const[verMovs,setVerMovs]=useState(null);
  const[editMovId,setEditMovId]=useState(null);
  const[editCant,setEditCant]=useState("");
  const[editEmp,setEditEmp]=useState("");
  const[editObs,setEditObs]=useState("");

  // Solo productos activos del proveedor INTERNO
  const productosInternos=catalogo.filter(c=>norm(c.proveedor)==="interno"&&c.activo!==false)
    .slice().sort((a,b)=>a.producto.localeCompare(b.producto));

  const registrar=async()=>{
    if(!prodId){toast("Elegí un producto");return;}
    if(!cantidad||Number(cantidad)<=0){toast("Ingresá la cantidad producida");return;}
    if(!empleado){toast("Elegí quién lo elaboró");return;}
    setBusy(true);
    const prod=productosInternos.find(c=>c.id===prodId);
    const fechaISO=fechaLocalISO(fecha);
    const stockActual=[...stock];
    const idx=stockActual.findIndex(s=>s.catalogoId===prodId);
    const mov={id:uid(),tipo:"entrada",origen:"produccion",cantidad:Number(cantidad),elaboradoPor:empleado,obs:obs.trim()||"Producción del día",fecha:fechaISO,registradoPor:registradoPor||null};
    if(idx>=0){
      stockActual[idx]={...stockActual[idx],cantidad:stockActual[idx].cantidad+Number(cantidad),movimientos:[mov,...(stockActual[idx].movimientos||[])].slice(0,50)};
    }else{
      stockActual.push({id:uid(),catalogoId:prodId,nombre:prod.producto,proveedor:"INTERNO",sector:prod.sector||"COCINA",cantidad:Number(cantidad),minimo:0,unidad:prod.unidad||"unidades",movimientos:[mov],fecha:fechaISO,registradoPor:registradoPor||null});
    }
    await saveStock(stockActual);
    toast(`✓ ${prod.producto}: +${cantidad} ${prod.unidad||"unidades"} registradas`);
    setBusy(false);setProdId("");setCantidad("");setEmpleado("");setObs("");setFecha(hoyLocal());
  };

  const eliminarMov=async(stockId,movId)=>{
    const s=stock.find(x=>x.id===stockId);
    if(!s)return;
    const mov=(s.movimientos||[]).find(m=>m.id===movId);
    if(!mov)return;
    if(!confirm(`¿Eliminar esta producción de ${mov.cantidad} ${s.unidad||""}? Se descuenta del stock.`))return;
    const nuevaCant=Math.max(0,Number(s.cantidad)-Number(mov.cantidad));
    const nuevos=stock.map(x=>x.id===stockId?{...x,cantidad:nuevaCant,movimientos:(x.movimientos||[]).filter(m=>m.id!==movId)}:x);
    await saveStock(nuevos);
    toast("Producción eliminada, stock revertido");
    setVerMovs(v=>v?{...v,movs:v.movs.filter(m=>m.id!==movId)}:v);
    setEditMovId(null);
  };

  const abrirEdicionMov=mov=>{
    setEditMovId(mov.id);setEditCant(String(mov.cantidad));setEditEmp(mov.elaboradoPor||"");setEditObs(mov.obs||"");
  };

  const guardarEdicionMov=async stockId=>{
    if(!editCant||Number(editCant)<=0){toast("Ingresá una cantidad válida");return;}
    const s=stock.find(x=>x.id===stockId);
    if(!s)return;
    const mov=(s.movimientos||[]).find(m=>m.id===editMovId);
    if(!mov)return;
    const delta=Number(editCant)-Number(mov.cantidad);
    const nuevaCant=Math.max(0,Number(s.cantidad)+delta);
    const movs=(s.movimientos||[]).map(m=>m.id===editMovId?{...m,cantidad:Number(editCant),elaboradoPor:editEmp,obs:editObs.trim()||"Producción del día"}:m);
    const nuevos=stock.map(x=>x.id===stockId?{...x,cantidad:nuevaCant,movimientos:movs}:x);
    await saveStock(nuevos);
    toast("Producción actualizada ✓");
    setVerMovs(v=>v?{...v,movs}:v);
    setEditMovId(null);
  };

  if(!productosInternos.length)return(
    <Empty icon="🍳">No hay productos internos en el catálogo. Agregá productos con proveedor INTERNO desde 🗂️ Catálogo.</Empty>
  );

  const thS={padding:"7px 8px",fontWeight:700,color:"#7B7063",fontSize:".63rem",letterSpacing:".05em",textTransform:"uppercase",borderBottom:"2px solid #E8DCC8",textAlign:"left"};
  const tdS={padding:"7px 8px"};
  const DIAS=["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];
  const monday=(()=>{
    const d=new Date();
    const day=d.getDay();
    const diff=d.getDate()-day+(day===0?-6:1);
    const m=new Date(d.getFullYear(),d.getMonth(),diff);
    m.setDate(m.getDate()+offset*7);
    m.setHours(0,0,0,0);
    return m;
  })();
  const dias=Array.from({length:7},(_,i)=>{const d=new Date(monday);d.setDate(monday.getDate()+i);return d;});
  const hoyDate=new Date();
  const enDia=(f,dia)=>f&&new Date(f).toDateString()===dia.toDateString();
  const rangoLabel=`${dias[0].toLocaleDateString("es-AR",{day:"numeric",month:"short"})} – ${dias[6].toLocaleDateString("es-AR",{day:"numeric",month:"short"})}`;

  const stockPorCatId={};
  stock.forEach(s=>{if(s.catalogoId)stockPorCatId[s.catalogoId]=s;});
  const filas=productosInternos.map(c=>{
    const s=stockPorCatId[c.id];
    return s?{...s,catalogoId:c.id}:{id:"sc_"+c.id,sinCargar:true,catalogoId:c.id,nombre:c.producto,unidad:c.unidad||"unidades",movimientos:[]};
  }).sort((a,b)=>a.nombre.localeCompare(b.nombre));

  const produccionDia=(s,dia)=>(s.movimientos||[]).filter(m=>m.origen==="produccion"&&enDia(m.fecha,dia)).reduce((acc,m)=>acc+Number(m.cantidad||0),0);
  const totalSemana=s=>dias.reduce((acc,d)=>acc+produccionDia(s,d),0);
  const totalHoy=filas.reduce((acc,s)=>acc+produccionDia(s,hoyDate),0);
  const productosHoy=filas.filter(s=>produccionDia(s,hoyDate)>0).length;
  const filasFiltradas=busqueda.trim()?filas.filter(s=>norm(s.nombre).includes(norm(busqueda))):filas;

  return(<>
    <Card title="Registrar producción">
      <p style={{fontSize:".78rem",color:"#7B7063",marginBottom:14}}>Cargá cuánto se produjo hoy de cada producto interno. Suma automáticamente al stock.</p>
      <Field label="Producto">
        <select value={prodId} onChange={e=>setProdId(e.target.value)} style={sS}>
          <option value="">— Elegí un producto —</option>
          {productosInternos.map(c=><option key={c.id} value={c.id}>{c.producto} ({c.unidad||"unidades"})</option>)}
        </select>
      </Field>
      <Field label="Cantidad producida">
        <Inp type="number" value={cantidad} onChange={setCantidad} placeholder="0"/>
      </Field>
      <Field label="Elaborado por">
        <select value={empleado} onChange={e=>setEmpleado(e.target.value)} style={sS}>
          <option value="">— Elegí quién lo elaboró —</option>
          {EMPS.map(n=><option key={n} value={n}>{n}</option>)}
        </select>
      </Field>
      <Field label="Observaciones (opcional)">
        <Inp value={obs} onChange={setObs} placeholder="Ej: tanda de la mañana"/>
      </Field>
      <Field label="Fecha"><Inp type="date" value={fecha} onChange={setFecha}/></Field>
      <Btn bg="#2D6A4F" onClick={registrar} disabled={busy}>{busy?"Guardando…":"Registrar producción"}</Btn>
    </Card>

    <div style={{fontWeight:700,fontSize:".85rem",color:"#2C1A0E",margin:"22px 0 10px"}}>Historial de producción</div>

    {totalHoy>0&&(
      <div style={{background:"#EAF5F0",border:"1px solid #cfe8dc",borderRadius:12,padding:"10px 14px",marginBottom:14,fontSize:".8rem",color:"#2D6A4F",fontWeight:600}}>
        🍳 Hoy se produjeron {totalHoy} unidad{totalHoy!==1?"es":""} de {productosHoy} producto{productosHoy!==1?"s":""}
      </div>
    )}

    <div style={{marginBottom:14}}>
      <Inp value={busqueda} onChange={setBusqueda} placeholder="🔎 Buscar producto..."/>
    </div>

    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8,flexWrap:"wrap",marginBottom:14}}>
      <button onClick={()=>setOffset(offset-1)} style={{padding:"7px 12px",border:"none",borderRadius:8,background:"#E8DCC8",fontWeight:600,cursor:"pointer",fontSize:".8rem"}}>← Semana anterior</button>
      <div style={{textAlign:"center"}}>
        <div style={{fontFamily:"Georgia,serif",fontSize:"1rem",color:"#2C1A0E"}}>{rangoLabel}</div>
        {offset!==0&&<button onClick={()=>setOffset(0)} style={{background:"none",border:"none",color:"#2D6A4F",fontSize:".72rem",fontWeight:600,cursor:"pointer",padding:0,marginTop:2}}>Volver a esta semana</button>}
      </div>
      <button onClick={()=>setOffset(offset+1)} style={{padding:"7px 12px",border:"none",borderRadius:8,background:"#E8DCC8",fontWeight:600,cursor:"pointer",fontSize:".8rem"}}>Semana siguiente →</button>
    </div>

    {!filasFiltradas.length?(
      <Empty icon="🔎">No hay productos que coincidan con la búsqueda.</Empty>
    ):(
    <div style={{background:"#fff",borderRadius:14,boxShadow:"0 2px 12px rgba(44,26,14,.08)",overflow:"hidden",marginBottom:14}}>
      <div style={{overflowX:"auto"}}>
      <table style={{width:"100%",borderCollapse:"collapse",fontSize:".78rem",minWidth:880}}>
        <thead>
          <tr style={{background:"#F9F6F1"}}>
            <th style={thS}>Producto</th>
            <th style={{...thS,textAlign:"right"}}>Stock actual</th>
            {dias.map((d,i)=>{
              const esHoy=d.toDateString()===hoyDate.toDateString();
              return(
                <th key={i} style={{...thS,textAlign:"center",background:esHoy?"#EAF5F0":"#F9F6F1",color:esHoy?"#2D6A4F":"#7B7063"}}>
                  {DIAS[i]}<br/><span style={{fontWeight:400,textTransform:"none",fontSize:".62rem"}}>{d.getDate()}/{d.getMonth()+1}</span>
                </th>
              );
            })}
            <th style={{...thS,textAlign:"right"}}>Total semana</th>
          </tr>
        </thead>
        <tbody>
          {filasFiltradas.map((s,i)=>{
            const tot=totalSemana(s);
            const cantActual=s.sinCargar?0:Number(s.cantidad||0);
            const bajo=!s.sinCargar&&Number(s.minimo)>0&&cantActual<=Number(s.minimo);
            return(
              <tr key={s.id} style={{background:i%2===0?"#fff":"#F9F6F1"}}>
                <td style={tdS}>
                  <div>{s.nombre} <span style={{color:"#B7A88E",fontSize:".68rem"}}>({s.unidad||"unidades"})</span>{s.sinCargar&&<span style={{background:"#E8DCC8",color:"#7B7063",fontSize:".58rem",fontWeight:700,padding:"1px 6px",borderRadius:10,marginLeft:6}}>SIN PRODUCIR</span>}</div>
                </td>
                <td style={{...tdS,textAlign:"right",whiteSpace:"nowrap"}}>
                  {s.sinCargar?<span style={{color:"#D8CFC0"}}>—</span>:(
                    <span style={{color:bajo?"#C0392B":"#2C1A0E",fontWeight:bajo?700:400}}>{cantActual}{bajo&&" BAJO"}</span>
                  )}
                </td>
                {dias.map((d,j)=>{
                  const v=produccionDia(s,d);
                  const movsDia=(s.movimientos||[]).filter(m=>m.origen==="produccion"&&enDia(m.fecha,d));
                  const quienes=[...new Set(movsDia.filter(m=>m.elaboradoPor).map(m=>m.elaboradoPor))];
                  return(
                    <td key={j} style={{...tdS,textAlign:"center",cursor:v>0?"pointer":"default"}} title={quienes.length?`Elaboró: ${quienes.join(", ")} (tocá para ver/editar)`:""} onClick={()=>v>0&&setVerMovs({stockId:s.id,nombre:s.nombre,unidad:s.unidad,fechaLabel:`${DIAS[j]} ${d.getDate()}/${d.getMonth()+1}`,movs:movsDia})}>
                      {v>0?<span style={{color:"#2D6A4F",fontWeight:700,textDecoration:"underline",textDecorationStyle:"dotted"}}>+{v}</span>:<span style={{color:"#D8CFC0"}}>—</span>}
                    </td>
                  );
                })}
                <td style={{...tdS,textAlign:"right",fontFamily:"Georgia,serif",fontWeight:700,color:tot>0?"#2D6A4F":"#D8CFC0",whiteSpace:"nowrap"}}>{tot>0?`+${tot} ${s.unidad}`:"—"}</td>
              </tr>
            );
          })}
        </tbody>
      </table>
      </div>
    </div>
    )}

    {verMovs&&(
      <div style={{position:"fixed",inset:0,background:"rgba(44,26,14,.45)",display:"flex",alignItems:"flex-end",justifyContent:"center",zIndex:200}} onClick={()=>{setVerMovs(null);setEditMovId(null);}}>
        <div style={{background:"#fff",borderRadius:"18px 18px 0 0",padding:20,width:"100%",maxWidth:480,maxHeight:"80vh",overflowY:"auto"}} onClick={e=>e.stopPropagation()}>
          <div style={{fontWeight:700,fontSize:".95rem",marginBottom:2}}>{verMovs.nombre}</div>
          <div style={{fontSize:".72rem",color:"#7B7063",marginBottom:14}}>{verMovs.fechaLabel}</div>
          {!verMovs.movs.length&&<Empty icon="🍳">No quedan producciones cargadas ese día.</Empty>}
          {verMovs.movs.map(m=>(
            <div key={m.id} style={{border:"1px solid #E8DCC8",borderRadius:12,padding:12,marginBottom:10}}>
              {editMovId===m.id?(<>
                <Field label="Cantidad"><Inp type="number" min="0" value={editCant} onChange={v=>Number(v)<0?null:setEditCant(v)}/></Field>
                <Field label="Elaborado por">
                  <select value={editEmp} onChange={e=>setEditEmp(e.target.value)} style={sS}>
                    <option value="">— Elegí quién lo elaboró —</option>
                    {EMPS.map(n=><option key={n} value={n}>{n}</option>)}
                  </select>
                </Field>
                <Field label="Observaciones"><Inp value={editObs} onChange={setEditObs}/></Field>
                <div style={{display:"flex",gap:8}}>
                  <Btn bg="#2D6A4F" onClick={()=>guardarEdicionMov(verMovs.stockId)}>Guardar</Btn>
                  <SmBtn onClick={()=>setEditMovId(null)}>Cancelar</SmBtn>
                </div>
              </>):(<>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <div style={{fontWeight:700,color:"#2D6A4F"}}>+{m.cantidad} {verMovs.unidad}</div>
                  <div style={{display:"flex",gap:10}}>
                    <span onClick={()=>abrirEdicionMov(m)} style={{cursor:"pointer"}} title="Editar">✏️</span>
                    <span onClick={()=>eliminarMov(verMovs.stockId,m.id)} style={{cursor:"pointer"}} title="Eliminar">✕</span>
                  </div>
                </div>
                {m.elaboradoPor&&<div style={{fontSize:".76rem",color:"#7B7063",marginTop:4}}>Elaboró: {m.elaboradoPor}</div>}
                {m.obs&&<div style={{fontSize:".76rem",color:"#7B7063",marginTop:2}}>{m.obs}</div>}
              </>)}
            </div>
          ))}
          <SmBtn onClick={()=>{setVerMovs(null);setEditMovId(null);}}>Cerrar</SmBtn>
        </div>
      </div>
    )}
  </>);
}

function StockCatalogo({catalogo,saveCatalogo,proveedoresCat,proveedores,saveProveedores,stock,saveStock}){
  const[provSel,setProvSel]=useState("");
  const[provNuevo,setProvNuevo]=useState("");
  const[mostrarNuevoProv,setMostrarNuevoProv]=useState(false);
  const[sector,setSector]=useState("COCINA");
  const[producto,setProducto]=useState("");
  const[unidad,setUnidad]=useState("unidades");
  const[minimo,setMinimo]=useState("");
  const[maximo,setMaximo]=useState("");
  const[fProv,setFProv]=useState("");
  const[fSector,setFSector]=useState("");
  const[fQuery,setFQuery]=useState("");
  const[colapsados,setColapsados]=useState({});
  const[busy,setBusy]=useState(false);
  const[editModal,setEditModal]=useState(null);
  const[editProv,setEditProv]=useState("");
  const[editProvNuevo,setEditProvNuevo]=useState("");
  const[editMostrarNuevoProv,setEditMostrarNuevoProv]=useState(false);
  const[editSector,setEditSector]=useState("COCINA");
  const[editProducto,setEditProducto]=useState("");
  const[editMinimo,setEditMinimo]=useState("");
  const[editMaximo,setEditMaximo]=useState("");
  const[editBusy,setEditBusy]=useState(false);
  const[mostrarForm,setMostrarForm]=useState(false);
  const[mostrarInactivos,setMostrarInactivos]=useState(false);
  const UNIDADES=["unidades","kg","g","litros","ml","cajas","bolsas","porciones","paquetes"];
  const sectoresCat=[...new Set(catalogo.map(c=>c.sector).filter(Boolean))].sort();
  const thS={padding:"7px 8px",fontWeight:700,color:"#7B7063",fontSize:".63rem",letterSpacing:".05em",textTransform:"uppercase",borderBottom:"2px solid #E8DCC8",textAlign:"left"};
  const tdS={padding:"7px 8px"};

  const proveedorFinal=mostrarNuevoProv?provNuevo.trim().toUpperCase():provSel;

  const agregar=async()=>{
    if(!proveedorFinal){toast("Elegí o ingresá un proveedor");return;}
    if(!producto.trim()){toast("Ingresá el nombre del producto");return;}
    const yaExiste=catalogo.some(c=>norm(c.proveedor)===norm(proveedorFinal)&&norm(c.producto)===norm(producto));
    if(yaExiste){toast("Ese producto ya existe para ese proveedor");return;}
    if(mostrarNuevoProv){
      const parecido=proveedorParecido(proveedorFinal,proveedores);
      if(parecido&&!confirm(`Ya existe un proveedor parecido: "${parecido.nombre}". ¿"${proveedorFinal}" es realmente distinto? Cancelá si es el mismo y elegilo de la lista para no duplicar su deuda.`))return;
    }
    setBusy(true);
    const nuevo={id:uid(),proveedor:proveedorFinal,sector,producto:producto.trim().toUpperCase(),unidad,minimo:Number(minimo)||0,maximo:Number(maximo)||0};
    await saveCatalogo([...catalogo,nuevo]);
    const yaEsProveedor=(proveedores||[]).some(p=>norm(p.nombre)===norm(proveedorFinal))||PROVEEDORES_SIN_CUENTA_PROPIA.has(proveedorFinal);
    if(!yaEsProveedor){
      const nuevoProv={id:uid(),nombre:proveedorFinal,deudaInicial:0,obs:"",fecha:new Date().toISOString()};
      await saveProveedores([...(proveedores||[]),nuevoProv]);
    }
    toast(yaEsProveedor?"Producto agregado al catálogo ✓":"Producto agregado y proveedor creado ✓");
    setBusy(false);setProducto("");setProvNuevo("");setMostrarNuevoProv(false);setUnidad("unidades");setMinimo("");setMaximo("");setMostrarForm(false);
  };

  const cambiarUnidad=async(id,nuevaUnidad)=>{
    await saveCatalogo(catalogo.map(c=>c.id===id?{...c,unidad:nuevaUnidad}:c));
  };

  const toggleActivo=async(id,activoActual)=>{
    await saveCatalogo(catalogo.map(c=>c.id===id?{...c,activo:!activoActual}:c));
    toast(activoActual?"Producto marcado como inactivo":"Producto reactivado ✓");
  };

  const eliminar=async id=>{
    if(!confirm("¿Eliminar este producto del catálogo? (no afecta el inventario ya cargado)"))return;
    await saveCatalogo(catalogo.filter(c=>c.id!==id));toast("Eliminado");
  };

  const abrirEditar=c=>{
    setEditModal(c);setEditProv(c.proveedor);setEditProvNuevo("");setEditMostrarNuevoProv(false);
    setEditSector(c.sector||"COCINA");setEditProducto(c.producto||"");setEditMinimo(String(c.minimo||""));setEditMaximo(String(c.maximo||""));
  };

  const guardarEdicion=async()=>{
    const proveedorFinal=editMostrarNuevoProv?editProvNuevo.trim().toUpperCase():editProv;
    if(!proveedorFinal){toast("Elegí o ingresá un proveedor");return;}
    if(!editProducto.trim()){toast("Ingresá el nombre del producto");return;}
    const nombreFinal=editProducto.trim().toUpperCase();
    const dup=catalogo.some(c=>c.id!==editModal.id&&norm(c.proveedor)===norm(proveedorFinal)&&norm(c.producto)===norm(nombreFinal));
    if(dup){toast("Ya existe un producto con ese nombre para ese proveedor");return;}
    if(editMostrarNuevoProv){
      const parecido=proveedorParecido(proveedorFinal,proveedores);
      if(parecido&&!confirm(`Ya existe un proveedor parecido: "${parecido.nombre}". ¿"${proveedorFinal}" es realmente distinto? Cancelá si es el mismo y elegilo de la lista para no duplicar su deuda.`))return;
    }
    setEditBusy(true);
    await saveCatalogo(catalogo.map(c=>c.id===editModal.id?{...c,proveedor:proveedorFinal,sector:editSector,producto:nombreFinal,minimo:Number(editMinimo)||0,maximo:Number(editMaximo)||0}:c));
    if(stock&&saveStock){
      const stockActualizado=stock.map(s=>s.catalogoId===editModal.id?{...s,nombre:nombreFinal,proveedor:proveedorFinal,sector:editSector}:s);
      const cambio=stockActualizado.some((s,i)=>s.nombre!==stock[i].nombre||s.proveedor!==stock[i].proveedor||s.sector!==stock[i].sector);
      if(cambio)await saveStock(stockActualizado);
    }
    const yaEsProveedor=(proveedores||[]).some(p=>norm(p.nombre)===norm(proveedorFinal))||PROVEEDORES_SIN_CUENTA_PROPIA.has(proveedorFinal);
    if(!yaEsProveedor){
      const nuevoProv={id:uid(),nombre:proveedorFinal,deudaInicial:0,obs:"",fecha:new Date().toISOString()};
      await saveProveedores([...(proveedores||[]),nuevoProv]);
    }
    toast("Producto actualizado ✓");
    setEditBusy(false);setEditModal(null);
  };

  const inactivosCount=catalogo.filter(c=>c.activo===false).length;

  const listado=catalogo.filter(c=>{
    if(mostrarInactivos){if(c.activo!==false)return false;}else{if(c.activo===false)return false;}
    if(fProv&&c.proveedor!==fProv)return false;
    if(fSector&&c.sector!==fSector)return false;
    if(fQuery&&!norm(c.producto).includes(norm(fQuery)))return false;
    return true;
  }).slice().sort((a,b)=>a.proveedor.localeCompare(b.proveedor)||a.producto.localeCompare(b.producto));

  const grupos=[];
  listado.forEach(c=>{
    let g=grupos.find(g=>g.proveedor===c.proveedor);
    if(!g){g={proveedor:c.proveedor,items:[]};grupos.push(g);}
    g.items.push(c);
  });

  return(<>
    {!mostrarForm&&(
      <div style={{display:"flex",justifyContent:"flex-end",marginBottom:16}}>
        <button onClick={()=>setMostrarForm(true)} style={{padding:"9px 16px",borderRadius:10,border:"none",background:"#2C1A0E",color:"#fff",fontWeight:600,fontSize:".8rem",cursor:"pointer"}}>+ Nuevo producto</button>
      </div>
    )}

    {mostrarForm&&(
    <Card title="Agregar producto al catálogo">
      <Field label="Proveedor">
        {!mostrarNuevoProv?(
          <select value={provSel} onChange={e=>setProvSel(e.target.value)} style={sS}>
            <option value="">— Elegí un proveedor —</option>
            {proveedoresCat.map(p=><option key={p} value={p}>{p}</option>)}
          </select>
        ):(
          <Inp value={provNuevo} onChange={setProvNuevo} placeholder="Nombre del nuevo proveedor"/>
        )}
      </Field>
      <div style={{marginTop:6}}>
        <button onClick={()=>{setMostrarNuevoProv(!mostrarNuevoProv);setProvSel("");setProvNuevo("");}} style={{background:"none",border:"none",color:"#2D6A4F",fontSize:".74rem",fontWeight:600,cursor:"pointer",padding:0}}>
          {mostrarNuevoProv?"← Elegir de la lista":"+ Es un proveedor nuevo"}
        </button>
      </div>
      <Field label="Sector">
        <select value={sector} onChange={e=>setSector(e.target.value)} style={sS}>
          {["COCINA","FRONT","OTRO"].map(s=><option key={s} value={s}>{s}</option>)}
        </select>
      </Field>
      <Field label="Nombre del producto"><Inp value={producto} onChange={setProducto} placeholder="Ej: ACEITE X LITRO"/></Field>
      <Field label="Unidad de medida">
        <select value={unidad} onChange={e=>setUnidad(e.target.value)} style={sS}>
          {UNIDADES.map(u=><option key={u} value={u}>{u}</option>)}
        </select>
      </Field>
      <div style={{display:"flex",gap:8}}>
        <div style={{flex:1}}>
          <Field label="Mínimo"><Inp type="number" value={minimo} onChange={setMinimo} placeholder="0"/></Field>
        </div>
        <div style={{flex:1}}>
          <Field label="Máximo"><Inp type="number" value={maximo} onChange={setMaximo} placeholder="0"/></Field>
        </div>
      </div>
      <div style={{display:"flex",gap:8,marginTop:4}}>
        <button onClick={()=>setMostrarForm(false)} style={{flex:1,padding:13,borderRadius:10,border:"none",background:"#E8DCC8",fontWeight:600,cursor:"pointer"}}>Cancelar</button>
        <Btn onClick={agregar} disabled={busy}>{busy?"Guardando…":"Agregar al catálogo"}</Btn>
      </div>
    </Card>
    )}

    <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:14}}>
      <input value={fQuery} onChange={e=>setFQuery(e.target.value)} placeholder="Buscar producto..." style={{flex:"2 1 160px",padding:"9px 12px",border:"1.5px solid #E8DCC8",borderRadius:10,fontSize:".82rem",background:"#fff",color:"#2C1A0E"}}/>
      <select value={fProv} onChange={e=>setFProv(e.target.value)} style={{...sS,flex:"1 1 120px"}}>
        <option value="">Todos los proveedores ({proveedoresCat.length})</option>
        {proveedoresCat.map(p=><option key={p} value={p}>{p}</option>)}
      </select>
      <select value={fSector} onChange={e=>setFSector(e.target.value)} style={{...sS,flex:"1 1 110px"}}>
        <option value="">Todos los sectores</option>

      </select>
      <button onClick={()=>setMostrarInactivos(!mostrarInactivos)} style={{padding:"9px 14px",border:"none",borderRadius:10,background:mostrarInactivos?"#7B7063":"#F2EAE0",color:mostrarInactivos?"#fff":"#7B7063",fontSize:".78rem",fontWeight:600,cursor:"pointer",whiteSpace:"nowrap"}}>{mostrarInactivos?"← Volver a activos":`😴 Ver inactivos (${inactivosCount})`}</button>
    </div>

    {!grupos.length?<Empty icon="🔍">Ningún producto coincide con el filtro</Empty>:grupos.map(g=>{
      const cerrado=!!colapsados[g.proveedor];

    {editModal&&(

        <div style={{background:"#fff",borderRadius:"20px 20px 0 0",padding:"24px 20px 32px",width:"100%",maxWidth:460,maxHeight:"85vh",overflowY:"auto"}}>

          <Field label="Proveedor">

                <option value="">— Elegí un proveedor —</option>
                {proveedoresCat.map(p=><option key={p} value={p}>{p}</option>)}

            ):(
              <Inp value={editProvNuevo} onChange={setEditProvNuevo} placeholder="Nombre del nuevo proveedor"/>

          <div style={{marginTop:-8,marginBottom:6}}>
            <button onClick={()=>{setEditMostrarNuevoProv(!editMostrarNuevoProv);setEditProv("");setEditProvNuevo("");}} style={{background:"none",border:"none",color:"#2D6A4F",fontSize:".74rem",fontWeight:600,cursor:"pointer",padding:0}}>
