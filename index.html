const RETIRO_SUELDOS_CAT="Retiro para sueldos";
// Categoría de gasto que Adrian usa para registrar retiros de ganancia del dueño (normalmente por
// Transferencia). Desde 2026-08-19 también se puede pagar con la caja retiro para sueldos (forma "Retiro"),
// para cuando la ganancia se saca de esa plata en vez de la Caja Digital.
const RETIRO_GANANCIA_CAT="DIGITAL";

// La pantalla de registro de pago de sueldo se movió a LiquidacionSueldos (2026-08-20): antes era una
// pestaña propia "Sueldos", ahora vive arriba de todo en "Liquidación de sueldos" (sin clave), porque los
// empleados que van a Pagos y tocan "👤 Pagar sueldo" terminan ahí — así entran directo al formulario en
// vez de a un módulo administrativo aparte.


function TabGastos({gastos,saveGastos,saldo,cajaInicial,proveedores,calcDigital}){
  const{saldoReal}=calcDigital();
  const totalMes=gastos.filter(g=>{const d=new Date(g.fecha);const n=new Date();return d.getMonth()===n.getMonth()&&d.getFullYear()===n.getFullYear();}).reduce((a,g)=>a+Number(g.monto||0),0);

  return(<>
    <ST help={"Acá ves el historial completo de gastos del negocio (alquiler, servicios, impuestos, pagos a proveedores cargados como gasto, etc.), tanto en efectivo como por transferencia.\n\n• Para cargar un pago nuevo (proveedor, sueldo o gasto), usá + Registrar pago desde Caja Digital.\n• Acá podés editar, borrar y filtrar todo lo ya cargado."}>Libro Diario</ST><SS>Historial completo de gastos del negocio.</SS>

    <div style={{fontSize:".72rem",color:"#7B7063",marginBottom:16}}>Pagado este mes: <strong style={{color:"#C0392B"}}>{fmt(totalMes)}</strong></div>

    <LibroDiarioGastos gastos={gastos} saveGastos={saveGastos} proveedores={proveedores}/>

    <div style={{marginTop:16}}>
      <div style={{background:"#2D6A4F",borderRadius:10,padding:"12px 14px",marginBottom:10}}>
        <div style={{fontSize:".58rem",letterSpacing:".08em",textTransform:"uppercase",color:"#EAF5F0",opacity:.85}}>💵 Caja disponible</div>
        <div style={{fontFamily:"Georgia,serif",fontSize:"1.3rem",color:"#fff",lineHeight:1.15}}>{fmt(saldo)}</div>
      </div>
      <div style={{background:"#2C1A0E",borderRadius:10,padding:"12px 14px"}}>
        <div style={{fontSize:".58rem",letterSpacing:".08em",textTransform:"uppercase",color:"#E8DCC8",opacity:.7}}>💳 Disponible digital</div>
        <div style={{fontFamily:"Georgia,serif",fontSize:"1.3rem",color:"#E8DCC8",lineHeight:1.15}}>{fmt(saldoReal)}</div>
      </div>
    </div>
  </>);
}



function LibroDiarioGastos({gastos,saveGastos,proveedores}){
  const hoy=new Date();
  const iso=d=>d.toISOString().slice(0,10);
  const inicioMes=new Date(hoy.getFullYear(),hoy.getMonth(),1);
  const[filtroFecha,setFiltroFecha]=useState("mes");
  const[desde,setDesde]=useState(iso(inicioMes));
  const[hasta,setHasta]=useState(iso(hoy));
  const[filtroForma,setFiltroForma]=useState("todo");
  const[filtroCat,setFiltroCat]=useState("todo");
  const[editItem,setEditItem]=useState(null);
  const[editForm,setEditForm]=useState({});
  const[confElim,setConfElim]=useState(null);
  const[busyEdit,setBusyEdit]=useState(false);

  const abrirEditar=g=>{
    setEditItem(g);
    setEditForm({categoria:g.categoria||"",proveedor:g.proveedor||"",monto:String(g.monto),forma:g.forma||"Efectivo",obs:g.obs||"",fecha:g.fecha.slice(0,10)});
  };
  const guardarEdicion=async()=>{
    if(!editForm.categoria||!editForm.monto){toast("Completá categoría y monto");return;}
    setBusyEdit(true);
    const nf=editForm.fecha?fechaLocalISO(editForm.fecha):editItem.fecha;
    await saveGastos(gastos.map(g=>g.id===editItem.id?{...g,categoria:editForm.categoria,proveedor:editForm.proveedor||"",monto:Number(editForm.monto),forma:editForm.forma,obs:editForm.obs,fecha:nf}:g));
    setBusyEdit(false);setEditItem(null);toast("Actualizado ✓");
  };
  const eliminar=async()=>{
    const g=confElim;setConfElim(null);
    await saveGastos(gastos.filter(x=>x.id!==g.id));
    toast("Eliminado ✓");
  };

  const allMovs=[...gastos].sort((a,b)=>a.fecha.localeCompare(b.fecha));
  const categoriasPresentes=[...new Set(gastos.map(g=>g.categoria).filter(Boolean))].sort();

  const desdeF=filtroFecha==="mes"?iso(inicioMes):filtroFecha==="hoy"?iso(hoy):desde;
  const hastaF=filtroFecha==="mes"?iso(hoy):filtroFecha==="hoy"?iso(hoy):hasta;

  const filtrados=allMovs
    .filter(m=>{const f=m.fecha.slice(0,10);return(!desdeF||f>=desdeF)&&(!hastaF||f<=hastaF);})
    .filter(m=>filtroForma==="todo"||m.forma===filtroForma)
    .filter(m=>filtroCat==="todo"||m.categoria===filtroCat);

  const filtradosAsc=[...filtrados].sort((a,b)=>a.fecha.localeCompare(b.fecha));
  let saldoAcum=0;
  const filasAsc=filtradosAsc.map(m=>{
    saldoAcum-=Number(m.monto||0);
    return{...m,_saldo:saldoAcum};
  });
  const filas=[...filasAsc].reverse();

  const totalEf=filtradosAsc.filter(m=>m.forma==="Efectivo").reduce((s,m)=>s+Number(m.monto||0),0);
  const totalTr=filtradosAsc.filter(m=>m.forma==="Transferencia").reduce((s,m)=>s+Number(m.monto||0),0);
  const totalGen=totalEf+totalTr;

  return(
    <div style={{background:"#fff",borderRadius:14,padding:20,boxShadow:"0 2px 12px rgba(44,26,14,.08)",marginTop:16}}>
      <div style={{fontSize:".68rem",fontWeight:700,letterSpacing:".09em",textTransform:"uppercase",color:"#7B7063",marginBottom:14}}>📒 Historial de gastos</div>

      {/* FILTROS FECHA */}
      <div style={{display:"flex",gap:6,marginBottom:10,flexWrap:"wrap"}}>
        {[["hoy","Hoy"],["mes","Este mes"],["custom","Personalizado"]].map(([v,l])=>(
          <button key={v} onClick={()=>{setFiltroFecha(v);if(v==="mes"){setDesde(iso(inicioMes));setHasta(iso(hoy));}if(v==="hoy"){setDesde(iso(hoy));setHasta(iso(hoy));}}}
            style={{padding:"5px 12px",borderRadius:20,border:"none",cursor:"pointer",fontSize:".72rem",fontWeight:600,background:filtroFecha===v?"#2C1A0E":"#E8DCC8",color:filtroFecha===v?"#E8DCC8":"#2C1A0E"}}>{l}</button>
        ))}
      </div>
      {filtroFecha==="custom"&&(
        <div style={{display:"flex",gap:8,marginBottom:10}}>
          <div style={{flex:1}}>
            <label style={{display:"block",fontSize:".7rem",fontWeight:600,color:"#7B7063",marginBottom:3}}>Desde</label>
            <input type="date" value={desde} onChange={e=>setDesde(e.target.value)} style={{...iS,fontSize:".82rem",padding:"7px 10px"}}/>
          </div>
          <div style={{flex:1}}>
            <label style={{display:"block",fontSize:".7rem",fontWeight:600,color:"#7B7063",marginBottom:3}}>Hasta</label>
            <input type="date" value={hasta} onChange={e=>setHasta(e.target.value)} style={{...iS,fontSize:".82rem",padding:"7px 10px"}}/>
          </div>
        </div>
      )}

      {/* FILTRO FORMA */}
      <div style={{display:"flex",gap:6,marginBottom:10,flexWrap:"wrap"}}>
        {[["todo","Todo"],["Efectivo","Efectivo"],["Transferencia","Transferencia"]].map(([v,l])=>(
          <button key={v} onClick={()=>setFiltroForma(v)}
            style={{padding:"4px 10px",borderRadius:20,border:"1px solid #E8DCC8",cursor:"pointer",fontSize:".7rem",fontWeight:600,background:filtroForma===v?"#2C1A0E":"transparent",color:filtroForma===v?"#E8DCC8":"#7B7063"}}>{l}</button>
        ))}
      </div>

      {/* FILTRO CATEGORÍA */}
      {categoriasPresentes.length>0&&(
        <div style={{marginBottom:12}}>
          <select value={filtroCat} onChange={e=>setFiltroCat(e.target.value)} style={{...sS,fontSize:".8rem"}}>
            <option value="todo">Todas las categorías</option>
            {categoriasPresentes.map(c=><option key={c} value={c}>{c}</option>)}
          </select>
        </div>
      )}

      {/* RESUMEN */}
      {filas.length>0&&(
        <div style={{display:"flex",gap:8,marginBottom:12}}>
          {[["💵 Efectivo",fmt(totalEf),"#C0392B"],["🏦 Transferencia",fmt(totalTr),"#B7860B"],["Total",fmt(totalGen),"#2C1A0E"]].map(([l,v,c])=>(
            <div key={l} style={{flex:1,background:"#F9F6F1",borderRadius:10,padding:"8px 10px",textAlign:"center"}}>
              <div style={{fontSize:".6rem",color:"#7B7063",textTransform:"uppercase",letterSpacing:".04em"}}>{l}</div>
              <div style={{fontWeight:700,fontSize:".85rem",color:c,marginTop:2}}>{v}</div>
            </div>
          ))}
        </div>
      )}

      {/* TABLA */}
      {!filas.length?<Empty icon="🏠">Sin gastos en el período</Empty>:(
        <div style={{overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:".75rem",minWidth:360}}>
            <thead>
              <tr style={{background:"#F9F6F1"}}>
                {["Fecha","Categoría","Forma","Monto",""].map(h=>(
                  <th key={h||"acc"} style={{padding:"7px 8px",textAlign:h==="Monto"?"right":h===""?"center":"left",fontWeight:700,color:"#7B7063",fontSize:".63rem",letterSpacing:".05em",textTransform:"uppercase",borderBottom:"2px solid #E8DCC8",whiteSpace:"nowrap"}}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {filas.map((g,i)=>(
                <tr key={g.id} style={{background:i%2===0?"#fff":"#F9F6F1"}}>
                  <td style={{padding:"6px 8px",whiteSpace:"nowrap",color:"#7B7063",fontSize:".72rem"}}>
                    {fmtF(g.fecha)}<br/><span style={{fontSize:".62rem"}}>{fmtH(g.fecha)}</span>
                  </td>
                  <td style={{padding:"6px 8px"}}>
                    <div style={{fontWeight:600,fontSize:".78rem"}}>{g.categoria}</div>
                    {g.proveedor&&g.proveedor!==g.categoria&&<div style={{fontSize:".64rem",color:"#2D6A4F"}}>🏪 {g.proveedor}</div>}
                    {g.obs&&<div style={{fontSize:".65rem",color:"#7B7063"}}>{g.obs}</div>}
                  </td>
                  <td style={{padding:"6px 8px"}}>
                    <span style={{background:g.forma==="Efectivo"?"#EAF5F0":"#FEF9E7",color:g.forma==="Efectivo"?"#2D6A4F":"#B7860B",borderRadius:6,padding:"2px 8px",fontSize:".68rem",fontWeight:600}}>
                      {g.forma==="Efectivo"?"💵 Ef.":"🏦 Transf."}
                    </span>
                  </td>
                  <td style={{padding:"6px 8px",textAlign:"right",fontWeight:700,color:"#C0392B",whiteSpace:"nowrap"}}>{fmt(g.monto)}</td>
                  <td style={{padding:"6px 8px"}}>
                    <div style={{display:"flex",gap:4,justifyContent:"center"}}>
                      <button onClick={()=>abrirEditar(g)} style={{background:"#EAF5F0",border:"none",borderRadius:6,color:"#2D6A4F",fontSize:".6rem",fontWeight:600,cursor:"pointer",padding:"3px 6px"}}>✏️</button>
                      <button onClick={()=>setConfElim(g)} style={{background:"#FFF0EF",border:"none",borderRadius:6,color:"#E74C3C",fontSize:".6rem",fontWeight:600,cursor:"pointer",padding:"3px 6px"}}>✕</button>
                    </div>
                  </td>
                </tr>
              ))}
              <tr style={{background:"#2C1A0E"}}>
                <td colSpan={3} style={{padding:"8px 10px",color:"#E8DCC8",fontWeight:700,fontSize:".76rem"}}>TOTAL</td>
                <td style={{padding:"8px",textAlign:"right",color:"#f5b7b1",fontWeight:700,whiteSpace:"nowrap"}}>{fmt(totalGen)}</td>
                <td/>
              </tr>
            </tbody>
          </table>
        </div>
      )}

      {editItem&&(
        <div style={{position:"fixed",inset:0,background:"rgba(44,26,14,.65)",zIndex:500,display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
          <div style={{background:"#fff",borderRadius:"20px 20px 0 0",padding:"24px 20px 40px",width:"100%",maxWidth:460,maxHeight:"88dvh",overflowY:"auto"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
              <p style={{fontFamily:"Georgia,serif",fontSize:"1.1rem"}}>✏️ Editar pago digital</p>
              <button onClick={()=>setEditItem(null)} style={{background:"none",border:"none",fontSize:"1.4rem",cursor:"pointer",color:"#7B7063"}}>✕</button>
            </div>
            <Field label="Categoría">
              <input list="cats-libro-gastos" value={editForm.categoria||""} onChange={e=>setEditForm(f=>({...f,categoria:e.target.value}))} style={iS}/>
              <datalist id="cats-libro-gastos">{categoriasPresentes.map(c=><option key={c} value={c}/>)}</datalist>
            </Field>
            <Field label="Proveedor (opcional — si corresponde, descuenta su deuda)">
              <select value={editForm.proveedor||""} onChange={e=>setEditForm(f=>({...f,proveedor:e.target.value}))} style={sS}>
                <option value="">— Ninguno —</option>
                {(proveedores||[]).slice().sort((a,b)=>a.nombre.localeCompare(b.nombre)).map(p=><option key={p.id} value={p.nombre}>{p.nombre}</option>)}
              </select>
            </Field>
            <Field label="Monto ($)"><Inp type="number" value={editForm.monto||""} onChange={v=>setEditForm(f=>({...f,monto:v}))}/></Field>
            <Field label="Forma de pago">
              <select value={editForm.forma||"Efectivo"} onChange={e=>setEditForm(f=>({...f,forma:e.target.value}))} style={sS}>
                <option value="Efectivo">Efectivo</option>
                <option value="Transferencia">Transferencia</option>
              </select>
            </Field>
            <Field label="Observaciones"><TA value={editForm.obs||""} onChange={v=>setEditForm(f=>({...f,obs:v}))}/></Field>
            <Field label="Fecha"><Inp type="date" value={editForm.fecha||""} onChange={v=>setEditForm(f=>({...f,fecha:v}))}/></Field>
            <div style={{display:"flex",gap:10,marginTop:8}}>
              <button onClick={()=>setEditItem(null)} style={{flex:1,padding:12,borderRadius:10,border:"none",background:"#E8DCC8",fontWeight:600,cursor:"pointer"}}>Cancelar</button>
              <button onClick={guardarEdicion} disabled={busyEdit} style={{flex:1,padding:12,borderRadius:10,border:"none",background:"#2D6A4F",color:"#fff",fontWeight:600,cursor:"pointer"}}>{busyEdit?"Guardando…":"Guardar"}</button>
            </div>
          </div>
        </div>
      )}

      {confElim&&(
        <div style={{position:"fixed",inset:0,background:"rgba(44,26,14,.65)",zIndex:500,display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
          <div style={{background:"#fff",borderRadius:"20px 20px 0 0",padding:"28px 20px 44px",width:"100%",maxWidth:460}}>
            <p style={{fontFamily:"Georgia,serif",fontSize:"1.1rem",marginBottom:8}}>⚠️ Eliminar registro</p>
            <p style={{fontSize:".85rem",color:"#7B7063",marginBottom:16}}>{confElim.categoria} · {fmt(confElim.monto)} · {fmtF(confElim.fecha)}</p>
            <div style={{display:"flex",gap:10}}>
              <button onClick={()=>setConfElim(null)} style={{flex:1,padding:12,borderRadius:10,border:"none",background:"#E8DCC8",fontWeight:600,cursor:"pointer"}}>Cancelar</button>
              <button onClick={eliminar} style={{flex:1,padding:12,borderRadius:10,border:"none",background:"#C0392B",color:"#fff",fontWeight:600,cursor:"pointer"}}>Eliminar</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function ManualStockModal({onClose}){
  const Sec=({title,children})=>(
    <div style={{marginBottom:18}}>
      <h4 style={{fontFamily:"Georgia,serif",fontSize:"1rem",color:"#2C1A0E",margin:"0 0 6px"}}>{title}</h4>
      <div style={{fontSize:".82rem",color:"#4A3B2C",lineHeight:1.65}}>{children}</div>
    </div>
  );
  return(
    <div style={{position:"fixed",inset:0,background:"rgba(44,26,14,.55)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:16}} onClick={onClose}>
      <div style={{background:"#fff",borderRadius:16,padding:"24px 22px",width:"100%",maxWidth:640,maxHeight:"88vh",overflowY:"auto"}} onClick={e=>e.stopPropagation()}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18}}>
          <span style={{fontFamily:"Georgia,serif",fontSize:"1.2rem",color:"#2C1A0E"}}>📖 Manual de uso — Stock</span>
          <button onClick={onClose} style={{background:"none",border:"none",fontSize:"1.3rem",cursor:"pointer",color:"#7B7063"}}>✕</button>
        </div>

        <Sec title="Qué es este módulo">
          Acá se lleva el control de todos los insumos y productos del local: cuánto hay de cada uno, a qué proveedor se le compra, qué se produjo en cocina, qué se tiró, y los pedidos que se le hacen a cada proveedor. Tiene seis secciones (los botones de arriba): 📋 Control de stock, 🧮 Conteo, 🍳 Producción, 🗑️ Desperdicios, 🗂️ Catálogo y 🧾 Pedidos.
        </Sec>

        <Sec title="Importante: stock 'teórico' vs. stock real">
          Acá NO se descuentan automáticamente las ventas que salen por Fudo. El número que ves en Control de stock es <b>teórico</b>: sube con las compras que cargás y con lo que se produce en cocina, pero no baja solo cuando se vende un plato. Por eso existe 🧮 Conteo: sirve para contar lo que hay REALMENTE en la góndola/heladera/depósito de vez en cuando, y ajustar el número al real. La diferencia entre lo teórico y lo contado es, por lógica, lo que se vendió o se consumió — comparalo con lo que dice Fudo si querés chequear que cierre.
        </Sec>

        <Sec title="📋 Control de stock">
          Es la pantalla principal: una tabla agrupada por proveedor (tocá el nombre del proveedor para abrir/cerrar el grupo), con una fila por producto. Cada fila muestra el stock actual, debajo el sector y hace cuántos días fue el último movimiento cargado, una columna por cada día de la semana (con lo que se cargó ese día — compra o producción en verde, salida en rojo — y un 🧮 si ese día se hizo un conteo), el cierre de semana (último conteo) y botones de acción: <b>+</b> para sumar una entrada (llegó mercadería), <b>−</b> para registrar una salida (no te deja sacar más de lo que hay), <b>⋯</b> para abrir el historial completo del producto, y de forma directa <b>✏️</b> para editar y <b>✕</b> para eliminar. En el modal de Entrada/Salida podés elegir la <b>fecha</b> del movimiento (arranca en hoy, pero se puede cambiar) — así, si cargás algo atrasado, queda en la columna del día que realmente pasó y no en la de hoy. Si editás la cantidad de un producto a mano, eso también queda registrado en su historial como una edición manual, para que no se pierda el rastro de por qué cambió el número.<br/><br/>
          Arriba tenés flechas ← → para moverte de semana, un buscador, filtros por proveedor, sector y "Solo stock bajo", y un botón <b>📱 Vista compacta</b> para ocultar las columnas de los días y ver solo lo esencial (útil en el celular). Los productos con stock bajo el mínimo que definiste quedan marcados en rojo con la palabra <b>BAJO</b>, y también suman al numerito rojo que aparece al lado de "Stock" en el menú de la izquierda.
        </Sec>

        <Sec title="🧮 Conteo">
          Para saber cuánto hay REALMENTE. Elegís si contás todo el inventario o filtrás por proveedor/sector (conteo parcial), y vas cargando lo que contás a mano de cada producto — solo se guarda lo que realmente escribiste, no lo que quedó visible sin tocar. Arriba de todo podés elegir la <b>fecha del conteo</b> (arranca en hoy, pero se puede cambiar) — así, si contaste antes y cargás la app más tarde, el registro queda con la fecha real y no con la del momento en que lo tipeaste. Podés agrupar la lista por Proveedor o por Sector (más cómodo para recorrer el local físicamente), y colapsar/expandir todos los grupos de una — cada grupo muestra en su encabezado hace cuánto fue su último conteo puntual, para ver de un vistazo qué proveedor/sector está más atrasado sin tener que expandir cada uno. Debajo del Teórico de cada producto figura desde cuándo viene acumulando ese número (fecha del último conteo de ESE producto puntual, o de cuando se cargó si nunca se contó), y debajo de la Diferencia, en cuántos días se dio — así una diferencia de -12 en 3 días se lee distinto que -12 en 40. Las diferencias grandes (probable error de tipeo) quedan resaltadas con ⚠️ — se marcan si son al menos el 30% del teórico, o si son 5 unidades o más Y representan al menos el 10% del teórico (para no marcar de más en productos que se mueven en cantidades grandes). Antes de guardar te pide confirmación mostrando la diferencia contra el teórico. Al confirmar, el stock queda ajustado al número que contaste, y esa diferencia se guarda en el historial como "ajuste por conteo". Si empezás a cargar un conteo y tocás otra sección de Stock antes de guardar, te avisa que vas a perder lo tipeado. Desde el botón "🧮 Historial de conteo" se abre una pantalla aparte con todos los conteos hechos, filtrable por proveedor y por rango de fechas (Desde/Hasta) (botón "← Volver al conteo" para regresar), donde cada registro tiene una "📄 Nota de conteo" imprimible (mismo formato que la nota de pedido) y un botón Eliminar que además revierte el ajuste de stock que ese conteo generó, por si se cargó mal. El botón "📅 Ver por semana" cambia la lista por conteo por un resumen agrupado por semana calendario (lunes a domingo): suma la diferencia de todos los conteos de esa semana por producto, para ver de un vistazo cuánto se perdió/ganó cada semana en vez de tener que sumar conteo por conteo — respeta los mismos filtros de proveedor y fechas. Ojo: si un producto no se contó todas las semanas, el número de una semana puede en realidad cubrir más de 7 días de movimiento.
        </Sec>

        <Sec title="🍳 Producción">
          Exclusivo para productos que se elaboran en la propia cocina (los que en el Catálogo tienen proveedor <b>INTERNO</b> — ej. salsas, masas, cosas que se preparan acá y no se compran hechas). Elegís el producto, cuánto se produjo, quién lo hizo (de la lista de empleados activos) y la fecha, y esa cantidad se suma directo al stock de ese producto. Si un producto que se elabora en cocina no aparece en la lista, hay que agregarlo primero en 🗂️ Catálogo con proveedor <b>INTERNO</b>.<br/><br/>
          Arriba de la tabla hay un buscador y, si se produjo algo hoy, un cartel con el total del día. La tabla muestra el stock actual de cada producto (en rojo si está BAJO el mínimo) además de lo producido por día. Tocando cualquier "+N" de un día se abre el detalle de esa producción puntual, con opción de <b>editarla</b> o <b>eliminarla</b> (ajusta el stock automáticamente) por si se cargó algo mal.
        </Sec>

        <Sec title="🗑️ Desperdicios">
          Para registrar lo que se tira, se rompe o se vence, y así saber cuánto se está perdiendo. El desplegable de producto muestra TODO el catálogo activo (incluidos los productos que todavía no tienen stock cargado, marcados "sin cargar"), no solo lo que ya está en Control de stock. Elegís el producto, la cantidad, el motivo (Vencido, Roto/dañado, Quemado/error de cocina, Devolución de cliente, u Otro) y la fecha. Al guardar, esa cantidad se descuenta del stock del producto (si era "sin cargar", se crea la fila arrancando en 0) — el registro queda en la lista de abajo, con opción de eliminarlo si se cargó por error (ojo: eliminar el registro NO repone el stock solo, hay que sumarlo de nuevo a mano si corresponde).
        </Sec>

        <Sec title="🗂️ Catálogo">
          Es la base de TODOS los productos e insumos que se compran o se elaboran, organizados por proveedor (mismo formato de tabla colapsable que Control de stock). Acá se define qué existe, con qué proveedor va y en qué sector se usa (Cocina/Front) — no lleva cantidad, es solo la "ficha" del producto. Desde acá también se pueden generar 🧾 Pedidos, y cada producto se puede marcar como inactivo si se dejó de usar (sin borrarlo, para no perder el historial).
        </Sec>

        <Sec title="🧾 Pedidos">
          Para armar una nota de pedido a un proveedor: elegís el proveedor, cargás la cantidad que necesitás de cada producto de su catálogo, y opcionalmente una observación (ej. "pedir para el jueves"). El pedido queda con estado <b>Pendiente</b>, y se puede pasar a <b>Enviado</b> o <b>Recibido</b> a medida que avanza. Cada pedido tiene un botón ✏️ Editar por si hay que corregir cantidades o el proveedor después de creado, 📄 Nota de pedido para abrir una versión imprimible, y ✕ Eliminar.
        </Sec>

        <Sec title="Cómo agregar un producto o un proveedor nuevo">
          Se puede hacer desde Control de stock o desde Catálogo, con el botón para agregar un producto. Ahí elegís un proveedor ya existente de la lista, o tocás "+ Es un proveedor nuevo" y escribís el nombre — si ese proveedor todavía no existía, el sistema lo da de alta automáticamente (así después ya aparece también en 🏪 Proveedores para llevarle la cuenta). Conviene siempre revisar primero si el proveedor ya está en la lista antes de escribirlo de nuevo, para no duplicarlo con otro nombre o mayúsculas distintas.
        </Sec>

        <Sec title="Para tener en cuenta">
          Si entraste con el usuario de <b>Cocina</b>, solo vas a ver la pestaña de Stock (arranca directo en Control de stock) — no vas a poder ver el resto de la app.<br/><br/>
          El stock bajo se define producto por producto: si cargaste un "mínimo" para un producto y la cantidad actual es igual o menor, se marca como BAJO automáticamente — no hace falta hacer nada más para que se active la alerta.
        </Sec>
      </div>
    </div>
  );
}

function TabStock({stock,saveStock,catalogo,saveCatalogo,pedidos,savePedidos,subInicial,desperdicios,saveDesperdicios,conteos,saveConteos,registradoPor,proveedores,saveProveedores,empleados}){
  const[sub,setSub]=useState(subInicial||"inventario");
  const[verManual,setVerManual]=useState(false);
  const[conteoDirty,setConteoDirty]=useState(false);
  const SUBS=[{id:"inventario",label:"📋 Control de stock"},{id:"conteo",label:"🧮 Conteo"},{id:"produccion",label:"🍳 Producción"},{id:"desperdicios",label:"🗑️ Desperdicios"},{id:"catalogo",label:"🗂️ Catálogo"},{id:"pedidos",label:"🧾 Pedidos"}];
  const cambiarSub=nuevo=>{
    if(sub==="conteo"&&nuevo!=="conteo"&&conteoDirty&&!confirm("Tenés valores de conteo sin guardar. ¿Salir igual? Se van a perder."))return;
    setSub(nuevo);
  };
  const proveedoresCat=[...new Set([...catalogo.map(c=>c.proveedor),...(proveedores||[]).map(p=>p.nombre).filter(n=>!PROVEEDORES_SOLO_PLATA.has(n))].filter(Boolean))].sort();
  const stockBajo=stock.filter(s=>Number(s.minimo)>0&&Number(s.cantidad)<=Number(s.minimo));

  return(<>
    {verManual&&<ManualStockModal onClose={()=>setVerManual(false)}/>}
    <p style={{fontFamily:"Georgia,serif",fontSize:"1.3rem",marginBottom:4,display:"flex",alignItems:"center",gap:8}}>
      Stock
      <button onClick={()=>setVerManual(true)} title="Manual de uso" style={{background:"none",border:"1px solid #E8DCC8",borderRadius:20,padding:"3px 10px",fontSize:".68rem",fontWeight:600,cursor:"pointer",color:"#7B7063",display:"flex",alignItems:"center",gap:4,flexShrink:0}}>📖 Manual de uso</button>
    </p>
    <SS>Control de inventario, catálogo de insumos y pedidos a proveedores.</SS>
    {registradoPor&&<div style={{fontSize:".72rem",color:"#7B7063",marginTop:-12,marginBottom:16}}>Cargando como <strong>{registradoPor}</strong></div>}
    {stockBajo.length>0&&sub!=="inventario"&&(
      <div onClick={()=>cambiarSub("inventario")} style={{background:"#FFF0EF",border:"1px solid #f5b7b1",borderRadius:12,padding:"10px 14px",marginBottom:16,cursor:"pointer",display:"flex",alignItems:"center",gap:8}}>
        <span style={{fontSize:"1rem"}}>⚠️</span>
        <span style={{fontSize:".8rem",color:"#C0392B",fontWeight:600}}>{stockBajo.length} producto{stockBajo.length!==1?"s":""} con stock bajo · Ver inventario</span>
      </div>
    )}
    <div style={{display:"flex",gap:6,marginBottom:18,flexWrap:"wrap"}}>
      {SUBS.map(s=>(
        <button key={s.id} onClick={()=>cambiarSub(s.id)} style={{flex:"1 1 auto",padding:"9px 8px",borderRadius:10,border:"none",background:sub===s.id?"#2C1A0E":"#E8DCC8",color:sub===s.id?"#fff":"#2C1A0E",fontSize:".74rem",fontWeight:600,cursor:"pointer"}}>{s.label}</button>
      ))}
    </div>
    {sub==="inventario"&&<StockInventario stock={stock} saveStock={saveStock} catalogo={catalogo} saveCatalogo={saveCatalogo} proveedoresCat={proveedoresCat} conteos={conteos} registradoPor={registradoPor} proveedores={proveedores} saveProveedores={saveProveedores}/>}
    {sub==="conteo"&&<StockConteo stock={stock} saveStock={saveStock} catalogo={catalogo} saveCatalogo={saveCatalogo} proveedoresCat={proveedoresCat} conteos={conteos} saveConteos={saveConteos} registradoPor={registradoPor} onDirtyChange={setConteoDirty}/>}
    {sub==="produccion"&&<StockProduccion stock={stock} saveStock={saveStock} catalogo={catalogo} registradoPor={registradoPor} empleados={empleados}/>}
    {sub==="desperdicios"&&<StockDesperdicios stock={stock} saveStock={saveStock} catalogo={catalogo} desperdicios={desperdicios} saveDesperdicios={saveDesperdicios} registradoPor={registradoPor}/>}
    {sub==="catalogo"&&<StockCatalogo catalogo={catalogo} saveCatalogo={saveCatalogo} proveedoresCat={proveedoresCat} proveedores={proveedores} saveProveedores={saveProveedores} stock={stock} saveStock={saveStock}/>}
    {sub==="pedidos"&&<StockPedidos catalogo={catalogo} proveedoresCat={proveedoresCat} pedidos={pedidos} savePedidos={savePedidos} registradoPor={registradoPor}/>}
  </>);
}

function StockInventario({stock,saveStock,catalogo,saveCatalogo,proveedoresCat,conteos,registradoPor,proveedores,saveProveedores}){
  const[offset,setOffset]=useState(0);
  const[provSel,setProvSel]=useState("");
  const[catId,setCatId]=useState("");
  const[cantidad,setCantidad]=useState("");
  const[minimo,setMinimo]=useState("");
  const[unidad,setUnidad]=useState("unidades");
  const[busy,setBusy]=useState(false);
  const[editId,setEditId]=useState(null);
  const[movModal,setMovModal]=useState(null);
  const[movCant,setMovCant]=useState("");
  const[movTipo,setMovTipo]=useState("entrada");
  const[movObs,setMovObs]=useState("");
  const[movFecha,setMovFecha]=useState(hoyLocal());
  const[fQuery,setFQuery]=useState("");
  const[fProv,setFProv]=useState("");
  const[fSector,setFSector]=useState("");
  const[soloBajo,setSoloBajo]=useState(false);
  const[histModal,setHistModal]=useState(null);
  const[mostrarAgregar,setMostrarAgregar]=useState(false);
  const[colapsados,setColapsados]=useState({});
  const[modoAgregar,setModoAgregar]=useState("crear");
  const[provNuevo,setProvNuevo]=useState("");
  const[mostrarNuevoProv,setMostrarNuevoProv]=useState(false);
  const[sector,setSector]=useState("COCINA");
  const[nombreProducto,setNombreProducto]=useState("");
  const[mostrarInactivos,setMostrarInactivos]=useState(false);
  const[vistaCompacta,setVistaCompacta]=useState(false);

  const diasNumeroDesde=fechaIso=>Math.max(0,Math.floor((Date.now()-new Date(fechaIso).getTime())/(1000*60*60*24)));
  const diasDesde=fechaIso=>{
    const dias=diasNumeroDesde(fechaIso);
    if(dias<=0)return"hoy";
    if(dias===1)return"ayer";
    return`hace ${dias} días`;
  };
  const ultimoMovimientoDe=s=>{
    if(s.sinCargar)return null;
    return(s.movimientos&&s.movimientos[0]&&s.movimientos[0].fecha)||s.fecha||null;
  };

  const toggleActivo=async(catalogoId,activoActual)=>{
    if(!catalogoId)return;
    await saveCatalogo(catalogo.map(c=>c.id===catalogoId?{...c,activo:!activoActual}:c));
    toast(activoActual?"Producto marcado como inactivo":"Producto reactivado ✓");
  };

  const limpiar=()=>{setEditId(null);setProvSel("");setCatId("");setCantidad("");setMinimo("");setUnidad("unidades");setMostrarAgregar(false);setModoAgregar("crear");setProvNuevo("");setMostrarNuevoProv(false);setSector("COCINA");setNombreProducto("");};

  const abrirCrear=()=>{setEditId(null);setModoAgregar("crear");setProvSel("");setProvNuevo("");setMostrarNuevoProv(false);setSector("COCINA");setNombreProducto("");setCatId("");setCantidad("");setMinimo("");setUnidad("unidades");setMostrarAgregar(true);};

  const abrirCargar=c=>{setEditId(null);setModoAgregar("cargar");setProvSel(c.proveedor);setCatId(c.catalogoId);setCantidad("");setMinimo("");setUnidad(c.unidad||"unidades");setMostrarAgregar(true);};

  const guardarProducto=async()=>{
    if(editId){
      if(!cantidad){toast("Completá la cantidad");return;}
      if(Number(cantidad)<0){toast("La cantidad no puede ser negativa");return;}
      setBusy(true);
      const anterior=stock.find(s=>s.id===editId);
      const cantidadNueva=Number(cantidad);
      const delta=anterior?cantidadNueva-Number(anterior.cantidad):0;
      // Editar la cantidad a mano también deja rastro en el historial del producto — antes cambiaba el
      // número sin dejar fecha, quién ni por qué, a diferencia de Entrada/Salida y Conteo.
      const nuevos=stock.map(s=>{
        if(s.id!==editId)return s;
        let movimientos=s.movimientos||[];
        if(delta!==0){
          const mov={id:uid(),tipo:delta>0?"entrada":"salida",origen:"edicion",cantidad:Math.abs(delta),obs:`Edición manual: ${Number(anterior.cantidad)} → ${cantidadNueva}`,fecha:new Date().toISOString(),registradoPor:registradoPor||null};
          movimientos=[mov,...movimientos].slice(0,50);
        }
        return{...s,cantidad:cantidadNueva,minimo:Number(minimo)||0,unidad,movimientos};
      });
      await saveStock(nuevos);toast("Producto actualizado ✓");
      setBusy(false);limpiar();
      return;
    }
    if(modoAgregar==="cargar"){
      if(!catId){toast("Elegí un producto del catálogo");return;}
      if(!cantidad){toast("Completá la cantidad");return;}
      setBusy(true);
      const c=catalogo.find(x=>x.id===catId);
      const nuevo={id:uid(),catalogoId:c.id,nombre:c.producto,proveedor:c.proveedor,sector:c.sector,cantidad:Number(cantidad),minimo:Number(minimo)||0,unidad,movimientos:[],fecha:new Date().toISOString(),registradoPor:registradoPor||null};
      await saveStock([...stock,nuevo]);
      toast("Producto cargado al inventario ✓");
      setBusy(false);limpiar();
      return;
    }
    const proveedorFinal=mostrarNuevoProv?provNuevo.trim().toUpperCase():provSel;
    if(!proveedorFinal){toast("Elegí o ingresá un proveedor");return;}
    if(!nombreProducto.trim()){toast("Ingresá el nombre del producto");return;}
    if(!cantidad){toast("Completá la cantidad");return;}
    const yaExiste=catalogo.some(c=>norm(c.proveedor)===norm(proveedorFinal)&&norm(c.producto)===norm(nombreProducto));
    if(yaExiste){toast("Ese producto ya existe en el catálogo para ese proveedor");return;}
    if(mostrarNuevoProv){
      const parecido=proveedorParecido(proveedorFinal,proveedores);
      if(parecido&&!confirm(`Ya existe un proveedor parecido: "${parecido.nombre}". ¿"${proveedorFinal}" es realmente distinto? Cancelá si es el mismo y elegilo de la lista para no duplicar su deuda.`))return;
    }
    setBusy(true);
    const nuevoCat={id:uid(),proveedor:proveedorFinal,sector,producto:nombreProducto.trim().toUpperCase(),unidad};
    await saveCatalogo([...catalogo,nuevoCat]);
    const nuevoStock={id:uid(),catalogoId:nuevoCat.id,nombre:nuevoCat.producto,proveedor:proveedorFinal,sector,cantidad:Number(cantidad),minimo:Number(minimo)||0,unidad,movimientos:[],fecha:new Date().toISOString(),registradoPor:registradoPor||null};
    await saveStock([...stock,nuevoStock]);
    const yaEsProveedor=(proveedores||[]).some(p=>norm(p.nombre)===norm(proveedorFinal))||PROVEEDORES_SIN_CUENTA_PROPIA.has(proveedorFinal);
    if(!yaEsProveedor){
      const nuevoProv={id:uid(),nombre:proveedorFinal,deudaInicial:0,obs:"",fecha:new Date().toISOString()};
      await saveProveedores([...(proveedores||[]),nuevoProv]);
    }
    toast(yaEsProveedor?"Producto creado ✓":"Producto y proveedor creados ✓");
    setBusy(false);limpiar();
  };

  const registrarMovimiento=async()=>{
    if(!movCant||Number(movCant)<=0){toast("Ingresá una cantidad válida");return;}
    const item=movModal;
    if(movTipo==="salida"&&Number(movCant)>Number(item.cantidad)){toast(`⚠️ Solo hay ${item.cantidad} ${item.unidad} disponibles`);return;}
    const delta=movTipo==="entrada"?Number(movCant):-Number(movCant);
    const nuevaCant=Math.max(0,item.cantidad+delta);
    const fechaISO=fechaLocalISO(movFecha);
    const mov={id:uid(),tipo:movTipo,cantidad:Number(movCant),obs:movObs.trim(),fecha:fechaISO,registradoPor:registradoPor||null};
    const nuevos=stock.map(s=>s.id===item.id?{...s,cantidad:nuevaCant,movimientos:[mov,...(s.movimientos||[])].slice(0,50)}:s);
    await saveStock(nuevos);
    toast(movTipo==="entrada"?"Entrada registrada ✓":"Salida registrada ✓");
    setMovModal(null);setMovCant("");setMovObs("");setMovFecha(hoyLocal());
  };

  const eliminar=async id=>{
    if(!confirm("¿Eliminar este producto del inventario?"))return;
    await saveStock(stock.filter(s=>s.id!==id));toast("Eliminado");
  };

  const editar=s=>{
    setEditId(s.id);setProvSel(s.proveedor||"");setCatId(s.catalogoId||"");
    setCantidad(String(s.cantidad));setMinimo(String(s.minimo||""));setUnidad(s.unidad||"unidades");
    setMostrarAgregar(true);
  };

  const conAlerta=stock.filter(s=>Number(s.cantidad)<=Number(s.minimo)&&Number(s.minimo)>0);
  const sectoresCat=[...new Set([...stock.map(s=>s.sector),...catalogo.map(c=>c.sector)].filter(Boolean))].sort();

  const catalogoIds=new Set(catalogo.map(c=>c.id));
  const stockPorCatId={};
  stock.forEach(s=>{if(s.catalogoId)stockPorCatId[s.catalogoId]=s;});
  const combinado=[];
  catalogo.forEach(c=>{
    const activo=c.activo!==false;
    const s=stockPorCatId[c.id];
    if(s)combinado.push({...s,catalogoId:c.id,activo});
    else combinado.push({id:"sc_"+c.id,sinCargar:true,catalogoId:c.id,nombre:c.producto,proveedor:c.proveedor,sector:c.sector,unidad:c.unidad||"unidades",cantidad:0,minimo:0,movimientos:[],activo});
  });
  stock.forEach(s=>{if(!s.catalogoId||!catalogoIds.has(s.catalogoId))combinado.push({...s,activo:true});});

  const inactivosCount=catalogo.filter(c=>c.activo===false).length;

  const filtradoInv=combinado.filter(s=>{
    if(mostrarInactivos){if(s.activo)return false;}else{if(!s.activo)return false;}
    if(fProv&&s.proveedor!==fProv)return false;
    if(fSector&&s.sector!==fSector)return false;
    if(soloBajo&&!(Number(s.cantidad)<=Number(s.minimo)&&Number(s.minimo)>0))return false;
    if(fQuery&&!norm(s.nombre).includes(norm(fQuery)))return false;
    return true;
  });
  const gruposInv=[];
  filtradoInv.forEach(s=>{
    const key=s.proveedor||"Sin proveedor";
    let g=gruposInv.find(g=>g.proveedor===key);
    if(!g){g={proveedor:key,items:[]};gruposInv.push(g);}
    g.items.push(s);
  });
  gruposInv.sort((a,b)=>a.proveedor.localeCompare(b.proveedor));
  gruposInv.forEach(g=>g.items.sort((a,b)=>{
    const aAl=Number(a.cantidad)<=Number(a.minimo)&&Number(a.minimo)>0;
    const bAl=Number(b.cantidad)<=Number(b.minimo)&&Number(b.minimo)>0;
    if(aAl!==bAl)return aAl?-1:1;
    return a.nombre.localeCompare(b.nombre);
  }));
  const thS={padding:"7px 8px",fontWeight:700,color:"#7B7063",fontSize:".63rem",letterSpacing:".05em",textTransform:"uppercase",borderBottom:"2px solid #E8DCC8",textAlign:"left"};
  const tdS={padding:"7px 8px"};

  const DIAS=["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];
  const monday=(()=>{
    const d=new Date();
    const day=d.getDay();
    const diff=d.getDate()-day+(day===0?-6:1);
    const m=new Date(d.getFullYear(),d.getMonth(),diff);
    m.setDate(m.getDate()+offset*7);
    m.setHours(0,0,0,0);
    return m;
  })();
  const dias=Array.from({length:7},(_,i)=>{const d=new Date(monday);d.setDate(monday.getDate()+i);return d;});
  const hoyDate=new Date();
  const enDia=(fecha,dia)=>fecha&&new Date(fecha).toDateString()===dia.toDateString();
  const rangoLabel=`${dias[0].toLocaleDateString("es-AR",{day:"numeric",month:"short"})} – ${dias[6].toLocaleDateString("es-AR",{day:"numeric",month:"short"})}`;
  const entradasDia=(s,dia)=>(s.movimientos||[]).filter(m=>m.tipo==="entrada"&&m.origen!=="conteo"&&enDia(m.fecha,dia)).reduce((acc,m)=>acc+Number(m.cantidad||0),0);
  const salidasDia=(s,dia)=>(s.movimientos||[]).filter(m=>m.tipo==="salida"&&m.origen!=="conteo"&&enDia(m.fecha,dia)).reduce((acc,m)=>acc+Number(m.cantidad||0),0);
  const conteoDeDia=(s,dia)=>{
    const delDia=(conteos||[]).filter(c=>enDia(c.fecha,dia)&&(c.items||[]).some(it=>it.stockId===s.id))
      .sort((a,b)=>new Date(b.fecha)-new Date(a.fecha));
    if(!delDia.length)return null;
    const it=delDia[0].items.find(it=>it.stockId===s.id);
    return it?it.contado:null;
  };
  const finSemana=new Date(dias[6].getFullYear(),dias[6].getMonth(),dias[6].getDate(),23,59,59);
  const cierreDe=s=>{
    const delItem=(conteos||[]).filter(c=>{
      const f=new Date(c.fecha);
      return f>=dias[0]&&f<=finSemana&&(c.items||[]).some(it=>it.stockId===s.id);
    }).sort((a,b)=>new Date(b.fecha)-new Date(a.fecha));
    if(!delItem.length)return null;
    const it=delItem[0].items.find(it=>it.stockId===s.id);
    return it?it.contado:null;
  };

  return(<>
    {movModal&&(
      <div style={{position:"fixed",inset:0,background:"rgba(44,26,14,.65)",zIndex:500,display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
        <div style={{background:"#fff",borderRadius:"20px 20px 0 0",padding:"24px 20px 44px",width:"100%",maxWidth:460}}>
          <p style={{fontFamily:"Georgia,serif",fontSize:"1.1rem",marginBottom:4}}>{movModal.nombre}</p>
          <p style={{fontSize:".78rem",color:"#7B7063",marginBottom:16}}>Stock actual: <strong>{movModal.cantidad} {movModal.unidad}</strong></p>
          <div style={{display:"flex",gap:8,marginBottom:14}}>
            {["entrada","salida"].map(t=>(
              <button key={t} onClick={()=>setMovTipo(t)} style={{flex:1,padding:10,borderRadius:10,border:"none",background:movTipo===t?(t==="entrada"?"#2D6A4F":"#C0392B"):"#E8DCC8",color:movTipo===t?"#fff":"#2C1A0E",fontWeight:600,cursor:"pointer",textTransform:"capitalize"}}>
                {t==="entrada"?"📥 Entrada":"📤 Salida"}
              </button>
            ))}
          </div>
          <Field label={`Cantidad (${movModal.unidad})`}><Inp type="number" min="0" value={movCant} onChange={v=>{if(v!==""&&Number(v)<0)return;setMovCant(v);}} placeholder="0"/></Field>
          <Field label="Observaciones"><TA value={movObs} onChange={setMovObs} placeholder="Ej: compra del día, venta..."/></Field>
          <Field label="Fecha"><Inp type="date" value={movFecha} onChange={setMovFecha}/></Field>
          <div style={{display:"flex",gap:10,marginTop:18}}>
            <button onClick={()=>{setMovModal(null);setMovCant("");setMovObs("");setMovFecha(hoyLocal());}} style={{flex:1,padding:12,borderRadius:10,border:"none",background:"#E8DCC8",fontWeight:600,cursor:"pointer"}}>Cancelar</button>
            <button onClick={registrarMovimiento} style={{flex:1,padding:12,borderRadius:10,border:"none",background:movTipo==="entrada"?"#2D6A4F":"#C0392B",color:"#fff",fontWeight:600,cursor:"pointer"}}>Confirmar</button>
          </div>
        </div>
      </div>
    )}

    {histModal&&(
      <div style={{position:"fixed",inset:0,background:"rgba(44,26,14,.65)",zIndex:500,display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
        <div style={{background:"#fff",borderRadius:"20px 20px 0 0",padding:"24px 20px 32px",width:"100%",maxWidth:460,maxHeight:"80vh",overflowY:"auto"}}>
          <p style={{fontFamily:"Georgia,serif",fontSize:"1.1rem",marginBottom:4}}>{histModal.nombre}</p>
          <p style={{fontSize:".78rem",color:"#7B7063",marginBottom:16}}>Stock actual: <strong>{histModal.cantidad} {histModal.unidad}</strong>{histModal.proveedor?` · ${histModal.proveedor}`:""}</p>
          <div style={{fontSize:".68rem",fontWeight:700,color:"#7B7063",textTransform:"uppercase",letterSpacing:".04em",marginBottom:8}}>Últimos movimientos</div>
          {!(histModal.movimientos&&histModal.movimientos.length)?(
            <p style={{fontSize:".78rem",color:"#7B7063",marginBottom:16}}>Todavía no hay movimientos registrados.</p>
          ):(
            <div style={{marginBottom:18}}>
              {histModal.movimientos.map(m=>(
                <div key={m.id} style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",padding:"7px 0",borderBottom:"1px solid #F2EAE0"}}>
                  <div>
                    <div style={{fontSize:".8rem",color:"#2C1A0E"}}>{m.tipo==="entrada"?"📥 Entrada":"📤 Salida"}{m.origen==="produccion"?" · producción":m.origen==="desperdicio"?" · desperdicio":m.origen==="conteo"?" · conteo":m.origen==="edicion"?" · edición manual":""}</div>
                    <div style={{fontSize:".68rem",color:"#7B7063"}}>{fmtF(m.fecha)} {fmtH(m.fecha)}{m.registradoPor?` · ${m.registradoPor}`:""}{m.elaboradoPor?` · Elaboró: ${m.elaboradoPor}`:""}{m.obs?` · ${m.obs}`:""}</div>
                  </div>
                  <div style={{fontFamily:"Georgia,serif",fontSize:"1rem",color:m.tipo==="entrada"?"#2D6A4F":"#C0392B",whiteSpace:"nowrap",marginLeft:10}}>{m.tipo==="entrada"?"+":"−"}{m.cantidad}</div>
                </div>
              ))}
            </div>
          )}
          <div style={{display:"flex",gap:10}}>
            <button onClick={()=>{editar(histModal);setHistModal(null);}} style={{flex:1,padding:12,borderRadius:10,border:"none",background:"#E8DCC8",color:"#2C1A0E",fontWeight:600,cursor:"pointer"}}>Editar</button>
            <button onClick={()=>{eliminar(histModal.id);setHistModal(null);}} style={{flex:1,padding:12,borderRadius:10,border:"none",background:"#FFF0EF",color:"#C0392B",fontWeight:600,cursor:"pointer"}}>Eliminar</button>
            <button onClick={()=>setHistModal(null)} style={{flex:1,padding:12,borderRadius:10,border:"none",background:"#2C1A0E",color:"#fff",fontWeight:600,cursor:"pointer"}}>Cerrar</button>
          </div>
        </div>
      </div>
    )}

    {!mostrarAgregar&&(
      <div style={{display:"flex",justifyContent:"flex-end",marginBottom:16}}>
        <button onClick={abrirCrear} style={{padding:"9px 16px",borderRadius:10,border:"none",background:"#2C1A0E",color:"#fff",fontWeight:600,fontSize:".8rem",cursor:"pointer"}}>+ Crear producto</button>
      </div>
    )}

    {mostrarAgregar&&(
      <div style={{position:"fixed",inset:0,background:"rgba(44,26,14,.65)",zIndex:500,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
        <div style={{background:"#fff",borderRadius:20,padding:"24px 20px 32px",width:"100%",maxWidth:460,maxHeight:"85vh",overflowY:"auto"}}>
          <p style={{fontFamily:"Georgia,serif",fontSize:"1.1rem",marginBottom:14}}>{editId?"Editar producto":modoAgregar==="crear"?"Crear producto nuevo":"Cargar al inventario"}</p>
          {!editId&&modoAgregar==="crear"&&(<>
            <Field label="Proveedor">
              {!mostrarNuevoProv?(
                <select value={provSel} onChange={e=>setProvSel(e.target.value)} style={sS}>
                  <option value="">— Elegí un proveedor —</option>

    {!combinado.length?<Empty icon="📦">Todavía no hay productos cargados. Usá "+ Crear producto" para agregar el primero.</Empty>:(<>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8,flexWrap:"wrap",marginBottom:14}}>

          {offset!==0&&<button onClick={()=>setOffset(0)} style={{background:"none",border:"none",color:"#2D6A4F",fontSize:".72rem",fontWeight:600,cursor:"pointer",padding:0,marginTop:2}}>Volver a esta semana</button>}

      <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:14}}>
        <input value={fQuery} onChange={e=>setFQuery(e.target.value)} placeholder="Buscar producto..." style={{flex:"2 1 160px",padding:"9px 12px",border:"1.5px solid #E8DCC8",borderRadius:10,fontSize:".82rem",background:"#fff",color:"#2C1A0E"}}/>

                return(
                  <tr key={s.id} style={{background:alerta?"#FFF0EF":(i%2===0?"#fff":"#F9F6F1")}}>

                      <div style={{fontSize:".65rem",color:"#B7A98F"}}>{s.sector||"—"}{ultimoMov&&` · ${diasDesde(ultimoMov)}`}</div>

                    <td style={{...tdS,textAlign:"right",fontFamily:"Georgia,serif",fontWeight:700,color:s.sinCargar?"#B7A98F":(alerta?"#C0392B":"#2D6A4F"),whiteSpace:"nowrap"}}>{s.sinCargar?"Sin cargar":(<>{s.cantidad} <span style={{color:"#7B7063",fontWeight:400,fontSize:".7rem"}}>{s.unidad}</span></>)}</td>
                    {!vistaCompacta&&dias.map((d,j)=>{

                      return(
                        <td key={j} style={{...tdS,textAlign:"center"}}>
                          {v===0&&sal===0&&c===null&&<span style={{color:"#D8CFC0"}}>—</span>}

                          {sal>0&&<div style={{color:"#C0392B"}}>−{sal}</div>}
                          {c!==null&&<div style={{color:"#B7860B",fontWeight:700}}>🧮{c}</div>}
                        </td>
                      );
                    })}
                    <td style={{...tdS,textAlign:"center",fontFamily:"Georgia,serif",fontWeight:700,color:cierre!==null?"#2C1A0E":"#D8CFC0",whiteSpace:"nowrap"}}>{cierre!==null?`${cierre} ${s.unidad}`:"—"}</td>
                    <td style={{...tdS,textAlign:"right",whiteSpace:"nowrap"}}>
                      {s.sinCargar?(
                        <button onClick={()=>abrirCargar(s)} style={{background:"#2C1A0E",color:"#fff",border:"none",borderRadius:6,padding:"4px 10px",fontSize:".68rem",fontWeight:600,cursor:"pointer",marginRight:4}}>Cargar</button>
                      ):(<>
                        <button onClick={()=>{setMovModal(s);setMovTipo("entrada");setMovFecha(hoyLocal());}} style={{background:"#EAF5F0",color:"#2D6A4F",border:"none",borderRadius:6,padding:"4px 8px",fontSize:".68rem",fontWeight:600,cursor:"pointer",marginRight:4}}>+</button>
                        <button onClick={()=>{setMovModal(s);setMovTipo("salida");setMovFecha(hoyLocal());}} style={{background:"#FFF0EF",color:"#C0392B",border:"none",borderRadius:6,padding:"4px 8px",fontSize:".68rem",fontWeight:600,cursor:"pointer",marginRight:4}}>−</button>
                        <button onClick={()=>setHistModal(s)} style={{background:"#F2EAE0",color:"#7B7063",border:"none",borderRadius:6,padding:"4px 8px",fontSize:".68rem",fontWeight:600,cursor:"pointer",marginRight:4}}>⋯</button>
                        <button onClick={()=>editar(s)} title="Editar" style={{background:"#F2EAE0",color:"#7B7063",border:"none",borderRadius:6,padding:"4px 8px",fontSize:".68rem",fontWeight:600,cursor:"pointer",marginRight:4}}>✏️</button>
                        <button onClick={()=>eliminar(s.id)} title="Eliminar" style={{background:"#FFF0EF",color:"#C0392B",border:"none",borderRadius:6,padding:"4px 8px",fontSize:".68rem",fontWeight:600,cursor:"pointer",marginRight:4}}>✕</button>
                      </>)}
                      {s.catalogoId&&catalogoIds.has(s.catalogoId)&&(
                        <button onClick={()=>toggleActivo(s.catalogoId,s.activo)} title={s.activo?"Marcar inactivo":"Reactivar"} style={{background:"#F2EAE0",color:"#7B7063",border:"none",borderRadius:6,padding:"4px 8px",fontSize:".68rem",fontWeight:600,cursor:"pointer"}}>{s.activo?"⏸":"▶"}</button>
                      )}
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
          </div>
          )}
        </div>
        );
      })}
      {gruposInv.length>0&&(
        <div style={{display:"flex",gap:16,marginTop:6,fontSize:".68rem",color:"#7B7063",flexWrap:"wrap"}}>
          <span><span style={{color:"#2D6A4F",fontWeight:700}}>+N</span> compra o producción cargada ese día</span>
          <span><span style={{color:"#C0392B",fontWeight:700}}>−N</span> salida registrada ese día</span>
          <span><span style={{color:"#B7860B",fontWeight:700}}>🧮N</span> conteo hecho ese día (parcial o completo)</span>
        </div>

  </>);
}
