function TabCajaEfectivo({cierres,cierresCaja,cajaInicial,pagos,savePagos,sueldos,saveSueldos,gastos,saveGastos,ajustesCajaEfectivo}){
  const hoy=new Date();
  const iso=d=>d.toISOString().slice(0,10);
  const inicioMes=new Date(hoy.getFullYear(),hoy.getMonth(),1);
  const[filtroFecha,setFiltroFecha]=useState("todo");
  const[desde,setDesde]=useState("");
  const[hasta,setHasta]=useState("");
  const[filtroTipo,setFiltroTipo]=useState("todo");
  const[buscar,setBuscar]=useState("");
  const[editItem,setEditItem]=useState(null);
  const[editForm,setEditForm]=useState({});
  const[confElim,setConfElim]=useState(null);

  const pagosEf    = (pagos||[]).filter(p=>p.forma==="Efectivo").map(p=>({...p,_cat:"pago",  _label:p.proveedor,_signo:-1}));
  const sueldosEf  = (sueldos||[]).filter(s=>s.forma==="Efectivo").map(s=>({...s,_cat:"sueldo",_label:s.empleado+" · "+(s.concepto||"Sueldo"),_signo:-1}));
  const gastosEf   = (gastos||[]).filter(g=>g.forma==="Efectivo").map(g=>({...g,_cat:"gasto", _label:g.categoria,_signo:-1}));
  const cierresViejos = (cierres||[]).map(c=>({...c,_cat:"cierre",_label:"Cierre "+c.turno,_signo:1}));
  const cierresNuevos = (cierresCaja||[]).map(c=>({...c,_cat:"cierre",_label:"Cierre "+c.turno,monto:c.efectivo,_signo:1}));
  // Ajustes manuales de caja (Admin > Ajuste de caja disponible) — sin esto este "Saldo final del período"
  // no coincidía con el número real de Caja Disponible en cuanto había algún ajuste registrado.
  const ajustesEf = (ajustesCajaEfectivo||[]).map(a=>({...a,_cat:"ajuste",_label:"Ajuste de caja"+(a.motivo?" · "+a.motivo:""),_signo:Number(a.monto||0)>=0?1:-1,monto:Math.abs(Number(a.monto||0))}));

  const allMovs=[...pagosEf,...sueldosEf,...gastosEf,...cierresViejos,...cierresNuevos,...ajustesEf].sort((a,b)=>a.fecha.localeCompare(b.fecha));

  const desdeF = filtroFecha==="mes"?iso(inicioMes):filtroFecha==="hoy"?iso(hoy):filtroFecha==="custom"?desde:"";
  const hastaF = filtroFecha==="mes"?iso(hoy):filtroFecha==="hoy"?iso(hoy):filtroFecha==="custom"?hasta:"";

  const filtrados = allMovs
    .filter(m=>(!desdeF||m.fecha.slice(0,10)>=desdeF)&&(!hastaF||m.fecha.slice(0,10)<=hastaF))
    .filter(m=>filtroTipo==="todo"||m._cat===filtroTipo)
    .filter(m=>!buscar||(m._label||"").toLowerCase().includes(buscar.toLowerCase())||fmtF(m.fecha).includes(buscar));

  let saldoAcum = Number(cajaInicial)||0;
  if(desdeF){
    allMovs.filter(m=>m.fecha.slice(0,10)<desdeF).forEach(m=>{
      saldoAcum += m._signo*Number(m.monto||0);
    });
  }
  const saldoBase=saldoAcum;
  const filtradosAsc=[...filtrados].sort((a,b)=>a.fecha.localeCompare(b.fecha));
  const filasAsc=filtradosAsc.map(m=>{
    saldoAcum += m._signo*Number(m.monto||0);
    return{...m,_saldo:saldoAcum};
  });
  const filas=[...filasAsc].reverse();

  // Los ajustes de caja no son ingresos ni egresos reales (no hubo una venta ni un pago) — son una
  // corrección del saldo contado. Se muestran aparte, no suman a Ingresos/Egresos ni aparecen en Debe/Haber.
  const totalIngresos=filtradosAsc.filter(m=>m._signo>0&&m._cat!=="ajuste").reduce((s,m)=>s+Number(m.monto||0),0);
  const totalEgresos =filtradosAsc.filter(m=>m._signo<0&&m._cat!=="ajuste").reduce((s,m)=>s+Number(m.monto||0),0);
  const totalAjustes =filtradosAsc.filter(m=>m._cat==="ajuste").reduce((s,m)=>s+m._signo*Number(m.monto||0),0);

  const iconoCat=c=>c==="cierre"?"💵":c==="pago"?"💸":c==="sueldo"?"👤":c==="ajuste"?"⚖️":"🏠";

  const abrirEditar=m=>{
    setEditItem(m);
    setEditForm({
      monto:String(m.monto),obs:m.obs||"",fecha:m.fecha.slice(0,10),
      ...(m._cat==="pago"?{proveedor:m.proveedor,empleado:m.empleado}:{}),
      ...(m._cat==="sueldo"?{empleado:m.empleado,concepto:m.concepto||"Sueldo"}:{}),
      ...(m._cat==="gasto"?{categoria:m.categoria}:{}),
    });
  };

  const guardar=async()=>{
    const nf=editForm.fecha?new Date(editForm.fecha+"T12:00:00").toISOString():editItem.fecha;
    if(editItem._cat==="pago")   await savePagos(pagos.map(p=>p.id===editItem.id?{...p,...editForm,monto:Number(editForm.monto),fecha:nf}:p));
    if(editItem._cat==="sueldo") await saveSueldos(sueldos.map(s=>s.id===editItem.id?{...s,...editForm,monto:Number(editForm.monto),fecha:nf}:s));
    if(editItem._cat==="gasto")  await saveGastos(gastos.map(g=>g.id===editItem.id?{...g,...editForm,monto:Number(editForm.monto),fecha:nf}:g));
    setEditItem(null);toast("Actualizado ✓");
  };

  const eliminar=async()=>{
    const m=confElim;setConfElim(null);
    if(m._cat==="pago")   await savePagos(pagos.filter(p=>p.id!==m.id));
    if(m._cat==="sueldo") await saveSueldos(sueldos.filter(s=>s.id!==m.id));
    if(m._cat==="gasto")  await saveGastos(gastos.filter(g=>g.id!==m.id));
    toast("Eliminado ✓ (los cierres se editan desde su sección)");
  };

  return(<>
    <ST>Caja Disponible</ST><SS>Todos los ingresos y egresos en efectivo, sin límite de fecha.</SS>

    <div style={{background:"#2D6A4F",borderRadius:14,padding:"18px 20px",marginBottom:16}}>
      <div style={{fontSize:".65rem",letterSpacing:".08em",textTransform:"uppercase",color:"#fff",opacity:.8}}>Saldo final del período</div>
      <div style={{fontFamily:"Georgia,serif",fontSize:"2rem",color:"#fff",margin:"4px 0 8px"}}>{fmt(saldoBase+totalIngresos-totalEgresos+totalAjustes)}</div>
      <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
        {[["Saldo base",fmt(saldoBase)],["Ingresos",fmt(totalIngresos)],["Egresos",fmt(totalEgresos)],["Ajustes",(totalAjustes>=0?"+":"")+fmt(totalAjustes)]].map(([l,v])=>(
          <div key={l} style={{flex:1,background:"rgba(255,255,255,.12)",borderRadius:10,padding:"8px 10px"}}>
            <div style={{fontSize:".58rem",color:"#fff",opacity:.6,textTransform:"uppercase"}}>{l}</div>
            <div style={{fontSize:".85rem",fontWeight:700,color:"#fff",marginTop:2}}>{v}</div>
          </div>
        ))}
      </div>
    </div>

    <div style={{display:"flex",gap:6,marginBottom:10,flexWrap:"wrap"}}>
      {[["todo","Todo"],["hoy","Hoy"],["mes","Este mes"],["custom","Personalizado"]].map(([v,l])=>(
        <button key={v} onClick={()=>setFiltroFecha(v)} style={{padding:"5px 12px",borderRadius:20,border:"none",cursor:"pointer",fontSize:".72rem",fontWeight:600,background:filtroFecha===v?"#2C1A0E":"#E8DCC8",color:filtroFecha===v?"#E8DCC8":"#2C1A0E"}}>{l}</button>
      ))}
    </div>
    {filtroFecha==="custom"&&(
      <div style={{display:"flex",gap:8,marginBottom:10}}>
        <div style={{flex:1}}><label style={{display:"block",fontSize:".7rem",fontWeight:600,color:"#7B7063",marginBottom:3}}>Desde</label><input type="date" value={desde} onChange={e=>setDesde(e.target.value)} style={{...iS,fontSize:".82rem",padding:"7px 10px"}}/></div>
        <div style={{flex:1}}><label style={{display:"block",fontSize:".7rem",fontWeight:600,color:"#7B7063",marginBottom:3}}>Hasta</label><input type="date" value={hasta} onChange={e=>setHasta(e.target.value)} style={{...iS,fontSize:".82rem",padding:"7px 10px"}}/></div>
      </div>
    )}
    <div style={{display:"flex",gap:6,marginBottom:10}}>
      {[["todo","Todo"],["cierre","Cierres"],["pago","Pagos"],["sueldo","Sueldos"],["gasto","Pagos dig."],["ajuste","Ajustes"]].map(([v,l])=>(
        <button key={v} onClick={()=>setFiltroTipo(v)} style={{padding:"4px 10px",borderRadius:20,border:"1px solid #E8DCC8",cursor:"pointer",fontSize:".7rem",fontWeight:600,background:filtroTipo===v?"#2C1A0E":"transparent",color:filtroTipo===v?"#E8DCC8":"#7B7063"}}>{l}</button>
      ))}
    </div>
    <input value={buscar} onChange={e=>setBuscar(e.target.value)} placeholder="🔍 Buscar..." style={{...iS,marginBottom:14,fontSize:".82rem"}}/>

    {!filas.length?<Empty icon="📒">Sin movimientos en el período</Empty>:(
      <div style={{overflowX:"auto"}}>
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:".75rem",minWidth:420}}>
          <thead>
            <tr style={{background:"#F9F6F1"}}>
              {["Fecha","Concepto","Debe","Haber","Saldo",""].map(h=>(
                <th key={h} style={{padding:"7px 8px",textAlign:["Fecha","Concepto",""].includes(h)?"left":"right",fontWeight:700,color:"#7B7063",fontSize:".63rem",letterSpacing:".05em",textTransform:"uppercase",borderBottom:"2px solid #E8DCC8",whiteSpace:"nowrap"}}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {filas.map((m,i)=>(
              <tr key={m.id+i} style={{background:i%2===0?"#fff":"#F9F6F1"}}>
                <td style={{padding:"6px 8px",whiteSpace:"nowrap",color:"#7B7063",fontSize:".72rem"}}>{fmtF(m.fecha)}<br/><span style={{fontSize:".62rem"}}>{fmtH(m.fecha)}</span></td>
                <td style={{padding:"6px 8px"}}>
                  <div style={{display:"flex",alignItems:"center",gap:5}}>
                    <span style={{flexShrink:0}}>{iconoCat(m._cat)}</span>
                    <div style={{minWidth:0}}>
                      <div style={{fontWeight:600,fontSize:".76rem",lineHeight:1.3}}>{m._label}</div>
                      {m._cat==="ajuste"?(
                        <div style={{fontSize:".63rem",color:m._signo>0?"#2D6A4F":"#C0392B",fontWeight:700}}>{m._signo>0?"+":"-"}{fmt(m.monto)} · corrección de saldo</div>
                      ):(m.obs&&<div style={{fontSize:".63rem",color:"#7B7063",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",maxWidth:100}}>{m.obs}</div>)}
                    </div>
                  </div>
                </td>
                <td style={{padding:"6px 8px",textAlign:"right",color:"#C0392B",fontWeight:700,whiteSpace:"nowrap"}}>{m._cat!=="ajuste"&&m._signo<0?fmt(Math.abs(m.monto)):""}</td>
                <td style={{padding:"6px 8px",textAlign:"right",color:"#2D6A4F",fontWeight:700,whiteSpace:"nowrap"}}>{m._cat!=="ajuste"&&m._signo>0?fmt(m.monto):""}</td>
                <td style={{padding:"6px 8px",textAlign:"right",fontWeight:700,whiteSpace:"nowrap",color:m._saldo>=0?"#2C1A0E":"#C0392B"}}>{fmt(m._saldo)}</td>
                <td style={{padding:"6px 8px"}}>
                  {m._cat!=="cierre"&&m._cat!=="ajuste"&&(
                    <div style={{display:"flex",gap:4}}>
                      <button onClick={()=>abrirEditar(m)} style={{background:"#EAF5F0",border:"none",borderRadius:6,color:"#2D6A4F",fontSize:".6rem",fontWeight:600,cursor:"pointer",padding:"3px 6px"}}>✏️</button>
                      <button onClick={()=>setConfElim(m)} style={{background:"#FFF0EF",border:"none",borderRadius:6,color:"#E74C3C",fontSize:".6rem",fontWeight:600,cursor:"pointer",padding:"3px 6px"}}>✕</button>
                    </div>
                  )}
                </td>
              </tr>
            ))}
            <tr style={{background:"#2C1A0E"}}>
              <td colSpan={2} style={{padding:"8px 10px",color:"#E8DCC8",fontWeight:700,fontSize:".76rem"}}>TOTALES</td>
              <td style={{padding:"8px",textAlign:"right",color:"#f5b7b1",fontWeight:700,whiteSpace:"nowrap"}}>{fmt(totalEgresos)}</td>
              <td style={{padding:"8px",textAlign:"right",color:"#a9dfbf",fontWeight:700,whiteSpace:"nowrap"}}>{fmt(totalIngresos)}</td>
              <td colSpan={2} style={{padding:"8px",textAlign:"right",fontWeight:700,whiteSpace:"nowrap",color:"#E8DCC8"}}>{fmt(saldoBase+totalIngresos-totalEgresos+totalAjustes)}</td>
            </tr>
          </tbody>
        </table>
      </div>
    )}

    {editItem&&(
      <div style={{position:"fixed",inset:0,background:"rgba(44,26,14,.65)",zIndex:500,display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
        <div style={{background:"#fff",borderRadius:"20px 20px 0 0",padding:"24px 20px 40px",width:"100%",maxWidth:460,maxHeight:"88dvh",overflowY:"auto"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
            <p style={{fontFamily:"Georgia,serif",fontSize:"1.1rem"}}>✏️ Editar {editItem._cat}</p>
            <button onClick={()=>setEditItem(null)} style={{background:"none",border:"none",fontSize:"1.4rem",cursor:"pointer",color:"#7B7063"}}>✕</button>
          </div>
          {editItem._cat==="pago"&&<div style={{marginBottom:10}}><label style={{display:"block",fontSize:".76rem",fontWeight:600,color:"#2C1A0E",marginBottom:4}}>Proveedor</label><input value={editForm.proveedor||""} onChange={e=>setEditForm(f=>({...f,proveedor:e.target.value}))} style={iS}/></div>}
          {editItem._cat==="sueldo"&&<div style={{marginBottom:10}}><label style={{display:"block",fontSize:".76rem",fontWeight:600,color:"#2C1A0E",marginBottom:4}}>Empleado</label><input value={editForm.empleado||""} onChange={e=>setEditForm(f=>({...f,empleado:e.target.value}))} style={iS}/></div>}
          {editItem._cat==="gasto"&&<div style={{marginBottom:10}}><label style={{display:"block",fontSize:".76rem",fontWeight:600,color:"#2C1A0E",marginBottom:4}}>Categoría</label><input value={editForm.categoria||""} onChange={e=>setEditForm(f=>({...f,categoria:e.target.value}))} style={iS}/></div>}
          {[["Monto ($)","monto","number"],["Observaciones","obs","text"]].map(([l,k,t])=>(
            <div key={k} style={{marginBottom:10}}>
              <label style={{display:"block",fontSize:".76rem",fontWeight:600,color:"#2C1A0E",marginBottom:4}}>{l}</label>
              <input type={t} value={editForm[k]||""} onChange={e=>setEditForm(f=>({...f,[k]:e.target.value}))} style={iS}/>
            </div>
          ))}
          <div style={{marginBottom:16}}>
            <label style={{display:"block",fontSize:".76rem",fontWeight:600,color:"#2C1A0E",marginBottom:4}}>Fecha</label>
            <input type="date" value={editForm.fecha||""} onChange={e=>setEditForm(f=>({...f,fecha:e.target.value}))} style={iS}/>
          </div>
          <div style={{display:"flex",gap:10}}>
            <button onClick={()=>setEditItem(null)} style={{flex:1,padding:12,borderRadius:10,border:"none",background:"#E8DCC8",fontWeight:600,cursor:"pointer"}}>Cancelar</button>
            <button onClick={guardar} style={{flex:1,padding:12,borderRadius:10,border:"none",background:"#2D6A4F",color:"#fff",fontWeight:600,cursor:"pointer"}}>Guardar</button>
          </div>
        </div>
      </div>
    )}

    {confElim&&(
      <div style={{position:"fixed",inset:0,background:"rgba(44,26,14,.65)",zIndex:500,display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
        <div style={{background:"#fff",borderRadius:"20px 20px 0 0",padding:"28px 20px 44px",width:"100%",maxWidth:460}}>
          <p style={{fontFamily:"Georgia,serif",fontSize:"1.1rem",marginBottom:8}}>⚠️ Eliminar</p>
          <p style={{fontSize:".85rem",color:"#7B7063",marginBottom:16}}>{confElim._label} · {fmt(confElim.monto)} · {fmtF(confElim.fecha)}</p>
          <div style={{display:"flex",gap:10}}>
            <button onClick={()=>setConfElim(null)} style={{flex:1,padding:12,borderRadius:10,border:"none",background:"#E8DCC8",fontWeight:600,cursor:"pointer"}}>Cancelar</button>
            <button onClick={eliminar} style={{flex:1,padding:12,borderRadius:10,border:"none",background:"#C0392B",color:"#fff",fontWeight:600,cursor:"pointer"}}>Eliminar</button>
          </div>
        </div>
      </div>
    )}
  </>);
}

function TabCajaDigital({calcDigital,cajaDigitalSaldo,saveCajaDigitalSaldo,cajaDigitalAjustes,saveCajaDigitalAjustes,pagos,savePagos,sueldos,saveSueldos,gastos,saveGastos,cierresCaja}){
  const hoy=new Date();
  const iso=d=>d.toISOString().slice(0,10);
  const inicioMes=new Date(hoy.getFullYear(),hoy.getMonth(),1);
  const[filtroFecha,setFiltroFecha]=useState("mes");
  const[desde,setDesde]=useState(iso(inicioMes));
  const[hasta,setHasta]=useState(iso(hoy));
  const[filtroTipo,setFiltroTipo]=useState("todo");
  const[buscar,setBuscar]=useState("");
  const[saldoBanco,setSaldoBanco]=useState("");
  const[notaBanco,setNotaBanco]=useState("");
  const[savingBanco,setSavingBanco]=useState(false);
  const[editItem,setEditItem]=useState(null);
  const[editForm,setEditForm]=useState({});
  const[confElim,setConfElim]=useState(null);

  const{ingresos,egTransf,saldoReal,deducciones}=calcDigital();

  const hoyD=new Date();
  const amexMes=(pagos||[]).filter(p=>{
    if(p.forma!=="Amex")return false;
    const d=new Date(p.fecha);
    return d.getMonth()===hoyD.getMonth()&&d.getFullYear()===hoyD.getFullYear();
  }).reduce((s,p)=>s+Number(p.monto||0),0);

  const actualizarBanco=async()=>{
    if(!saldoBanco){toast("Ingresá el saldo real");return;}
    setSavingBanco(true);
    const saldoAnterior=Number(cajaDigitalSaldo)||0;
    const saldoNuevo=Number(saldoBanco);
    await saveCajaDigitalSaldo(saldoNuevo);
    const nuevoAjuste={
      fecha:new Date().toISOString(),
      saldoAnterior,
      saldoNuevo,
      diferencia:saldoNuevo-saldoAnterior,
      nota:notaBanco.trim(),
    };
    await saveCajaDigitalAjustes([nuevoAjuste,...(cajaDigitalAjustes||[])]);
    setSavingBanco(false);setSaldoBanco("");setNotaBanco("");
    toast("Saldo banco actualizado ✓");
  };

  // Movimientos digitales
  const pagosTr   = (pagos||[]).filter(p=>p.forma==="Transferencia").map(p=>({...p,_cat:"pago",  _label:p.proveedor}));
  const sueldosTr = (sueldos||[]).filter(s=>s.forma==="Transferencia").map(s=>({...s,_cat:"sueldo",_label:s.empleado+" · "+(s.concepto||"Sueldo")}));
  const gastosTr  = (gastos||[]).filter(g=>g.forma==="Transferencia").map(g=>({...g,_cat:"gasto", _label:g.categoria}));
  const allMovs   = [...pagosTr,...sueldosTr,...gastosTr].sort((a,b)=>a.fecha.localeCompare(b.fecha));

  // Filtro fechas
  const desdeF = filtroFecha==="mes"?iso(inicioMes):filtroFecha==="hoy"?iso(hoy):desde;
  const hastaF = filtroFecha==="mes"?iso(hoy):filtroFecha==="hoy"?iso(hoy):hasta;

  const filtrados = allMovs
    .filter(m=>(!desdeF||m.fecha.slice(0,10)>=desdeF)&&(!hastaF||m.fecha.slice(0,10)<=hastaF))
    .filter(m=>filtroTipo==="todo"||m._cat===filtroTipo)
    .filter(m=>!buscar||(m._label||"").toLowerCase().includes(buscar.toLowerCase())||fmtF(m.fecha).includes(buscar));

  // Saldo acumulado desde el saldo real del banco
  // saldoReal = saldo del banco al momento de la última actualización
  // Para el libro: empezamos desde saldoReal y restamos todos los egresos del período
  // (los egresos son los movimientos digitales posteriores al corte)
  const filtradosAsc=[...filtrados].sort((a,b)=>a.fecha.localeCompare(b.fecha));
  let saldoAcum = Number(saldoReal)||0;
  // Restar los egresos anteriores al período para calcular el saldo base
  allMovs.filter(m=>!desdeF||m.fecha.slice(0,10)<desdeF).forEach(m=>{
    saldoAcum -= Number(m.monto||0);
  });
  const saldoBase=saldoAcum;
  const filasAsc=filtradosAsc.map(m=>{
    saldoAcum -= Number(m.monto||0);
    return{...m,_saldo:saldoAcum};
  });
  const filas=[...filasAsc].reverse();

  const totalEgresos=filtradosAsc.reduce((s,m)=>s+Number(m.monto||0),0);

  const iconoCat=c=>c==="pago"?"💸":c==="sueldo"?"👤":"🏠";

  const abrirEditar=m=>{
    setEditItem(m);
    setEditForm({
      monto:String(m.monto),obs:m.obs||"",fecha:m.fecha.slice(0,10),
      ...(m._cat==="pago"?{proveedor:m.proveedor,empleado:m.empleado}:{}),
      ...(m._cat==="sueldo"?{empleado:m.empleado,concepto:m.concepto||"Sueldo"}:{}),
      ...(m._cat==="gasto"?{categoria:m.categoria}:{}),
    });
  };

  const guardar=async()=>{
    const nf=editForm.fecha?new Date(editForm.fecha+"T12:00:00").toISOString():editItem.fecha;
    if(editItem._cat==="pago")   await savePagos(pagos.map(p=>p.id===editItem.id?{...p,...editForm,monto:Number(editForm.monto),fecha:nf}:p));
    if(editItem._cat==="sueldo") await saveSueldos(sueldos.map(s=>s.id===editItem.id?{...s,...editForm,monto:Number(editForm.monto),fecha:nf}:s));
    if(editItem._cat==="gasto")  await saveGastos(gastos.map(g=>g.id===editItem.id?{...g,...editForm,monto:Number(editForm.monto),fecha:nf}:g));
    setEditItem(null);toast("Actualizado ✓");
  };

  const eliminar=async()=>{
    const m=confElim;setConfElim(null);
    if(m._cat==="pago")   await savePagos(pagos.filter(p=>p.id!==m.id));
    if(m._cat==="sueldo") await saveSueldos(sueldos.filter(s=>s.id!==m.id));
    if(m._cat==="gasto")  await saveGastos(gastos.filter(g=>g.id!==m.id));
    toast("Eliminado ✓");
  };

  // Cruce global (desde siempre)
  const totalIngresosGlobal=(cierresCaja||[]).reduce((s,c)=>s+Number(c.totalDigital||0),0);
  const totalEgresosGlobal=[...pagosTr,...sueldosTr,...gastosTr].reduce((s,m)=>s+Number(m.monto||0),0);
  const diferenciaGlobal=totalIngresosGlobal-totalEgresosGlobal;

  return(<>
    <ST help={"Caja Digital muestra el saldo real del banco que actualizás manualmente, más un cruce de todos los ingresos digitales registrados vs los egresos por transferencia.\n\n• Actualizá el saldo cada vez que revisés el banco.\n• El cruce te muestra el flujo total acumulado desde el inicio."}>Caja Digital</ST><SS>Saldo real del banco y cruce de movimientos digitales.</SS>

    {/* PANEL BANCO */}
    <div style={{background:"#2C1A0E",borderRadius:14,padding:"20px",marginBottom:12,border:"2px solid #B7860B"}}>
      <div style={{fontSize:".65rem",letterSpacing:".08em",textTransform:"uppercase",color:"#E8DCC8",opacity:.7}}>💳 Disponible digital</div>
      <div style={{fontFamily:"Georgia,serif",fontSize:"2.2rem",color:"#E8DCC8",margin:"4px 0 2px"}}>{fmt(saldoReal)}</div>
      <div style={{fontSize:".72rem",color:"#E8DCC8",opacity:.6,marginBottom:14}}>Saldo real del banco actualizado manualmente</div>
      <input value={saldoBanco} onChange={e=>setSaldoBanco(e.target.value)} placeholder="Ingresar saldo real del banco" style={{...iS,background:"rgba(255,255,255,.08)",color:"#E8DCC8",border:"1px solid rgba(255,255,255,.2)",marginBottom:8}}/>
      <input value={notaBanco} onChange={e=>setNotaBanco(e.target.value)} placeholder="Motivo del ajuste (opcional, ej: liquidación vieja acreditada)" style={{...iS,background:"rgba(255,255,255,.08)",color:"#E8DCC8",border:"1px solid rgba(255,255,255,.2)",marginBottom:10}}/>
      <button onClick={actualizarBanco} disabled={savingBanco} style={{width:"100%",padding:11,borderRadius:10,border:"1.5px solid #B7860B",background:"#B7860B",color:"#fff",fontWeight:700,fontSize:".84rem",cursor:"pointer"}}>
        {savingBanco?"Guardando…":"Actualizar"}
      </button>
      {cajaDigitalAjustes&&cajaDigitalAjustes.length>0&&(
        <div style={{marginTop:14,paddingTop:14,borderTop:"1px solid rgba(255,255,255,.15)"}}>
          <div style={{fontSize:".65rem",letterSpacing:".08em",textTransform:"uppercase",color:"#E8DCC8",opacity:.7,marginBottom:8}}>Historial de ajustes</div>
          <div style={{display:"flex",flexDirection:"column",gap:6,maxHeight:160,overflowY:"auto"}}>
            {cajaDigitalAjustes.slice(0,10).map((a,i)=>(
              <div key={i} style={{fontSize:".74rem",color:"#E8DCC8",background:"rgba(255,255,255,.06)",borderRadius:6,padding:"7px 10px"}}>
                <div style={{display:"flex",justifyContent:"space-between",fontWeight:600}}>
                  <span>{new Date(a.fecha).toLocaleString("es-AR",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}</span>
                  <span style={{color:a.diferencia>=0?"#a9dfbf":"#f5b7b1"}}>{a.diferencia>=0?"+":""}{fmt(a.diferencia)}</span>
                </div>
                <div style={{opacity:.75}}>{fmt(a.saldoAnterior)} → {fmt(a.saldoNuevo)}</div>
                {a.nota&&<div style={{opacity:.85,marginTop:2,fontStyle:"italic"}}>{a.nota}</div>}
              </div>
            ))}
          </div>
        </div>
      )}
    </div>

    {amexMes>0&&(
      <div style={{background:"#FEF9E7",border:"1px solid #F5D98B",borderRadius:14,padding:"14px 20px",marginBottom:16}}>
        <div style={{fontSize:".65rem",letterSpacing:".08em",textTransform:"uppercase",color:"#B7860B"}}>💳 Cargado a Amex este mes</div>
        <div style={{fontFamily:"Georgia,serif",fontSize:"1.4rem",color:"#7B5E00",margin:"4px 0 0"}}>{fmt(amexMes)}</div>
        <div style={{fontSize:".68rem",color:"#B7860B",opacity:.85}}>No se descuenta de Caja Disponible ni Caja Digital hasta que pagués el resumen de la tarjeta.</div>
      </div>
    )}

    {/* CRUCE GLOBAL */}
    <div style={{background:"#fff",borderRadius:14,padding:18,marginBottom:16,boxShadow:"0 2px 12px rgba(44,26,14,.08)"}}>
      <div style={{fontSize:".68rem",fontWeight:700,letterSpacing:".09em",textTransform:"uppercase",color:"#7B7063",marginBottom:14}}>📊 Cruce de movimientos digitales (desde siempre)</div>
      <div style={{display:"flex",gap:8}}>
        <div style={{flex:1,background:"#EAF5F0",borderRadius:10,padding:"12px 14px"}}>
          <div style={{fontSize:".62rem",color:"#2D6A4F",fontWeight:700,textTransform:"uppercase",letterSpacing:".05em",marginBottom:4}}>📥 Ingresos digitales</div>
          <div style={{fontFamily:"Georgia,serif",fontSize:"1.3rem",color:"#2D6A4F"}}>{fmt(totalIngresosGlobal)}</div>
          <div style={{fontSize:".62rem",color:"#7B7063",marginTop:2}}>Suma de cierres de caja</div>
        </div>
        <div style={{flex:1,background:"#FFF0EF",borderRadius:10,padding:"12px 14px"}}>
          <div style={{fontSize:".62rem",color:"#C0392B",fontWeight:700,textTransform:"uppercase",letterSpacing:".05em",marginBottom:4}}>📤 Egresos transferencia</div>

function TabGerencia({calcDigital,saldo,ini,tot,eg,cajaDigitalSaldo,saveCajaDigitalSaldo}){
  const[saldoBanco,setSaldoBanco]=useState("");
  const[savingBanco,setSavingBanco]=useState(false);
  const{ingresos,egTransf,saldoReal,deducciones}=calcDigital();

  const actualizarBanco=async()=>{
    if(!saldoBanco){toast("Ingresá el saldo real");return;}
    setSavingBanco(true);
    await saveCajaDigitalSaldo(Number(saldoBanco));
    setSavingBanco(false);setSaldoBanco("");
    toast("Saldo banco actualizado ✓");
  };

  const totalDisponible=saldo+saldoReal;

  return(<>
    <ST help={"Vista consolidada para gerencia.\n\n• Total disponible: suma de Caja Disponible (efectivo) + Caja Digital (banco).\n• Caja Disponible: saldo inicial + cierres de turno − pagos en efectivo.\n• Caja Digital: calculada desde el último saldo banco ingresado + ingresos digitales − egresos por transferencia.\n\nPara actualizar el saldo banco de Caja Digital, ingresá el valor real desde la sección Caja Digital o directamente desde acá."}>Gerencia</ST><SS>Resumen de efectivo y caja digital disponible.</SS>

    {/* TOTAL CONSOLIDADO */}
    <div style={{background:"#2C1A0E",borderRadius:14,padding:"22px 20px",marginBottom:16}}>
      <div style={{fontSize:".65rem",letterSpacing:".08em",textTransform:"uppercase",color:"#E8DCC8",opacity:.7}}>Total disponible consolidado</div>
      <div style={{fontFamily:"Georgia,serif",fontSize:"2.6rem",color:"#E8DCC8",margin:"4px 0 2px"}}>{fmt(totalDisponible)}</div>
      <div style={{fontSize:".74rem",color:"#E8DCC8",opacity:.6}}>Caja Disponible + Caja digital</div>
    </div>

    {/* CAJA FUERTE */}
    <div style={{background:"#2D6A4F",borderRadius:14,padding:"20px",marginBottom:12}}>
      <div style={{fontSize:".65rem",letterSpacing:".08em",textTransform:"uppercase",color:"#fff",opacity:.8}}>💵 Caja Disponible · Efectivo</div>
      <div style={{fontFamily:"Georgia,serif",fontSize:"2rem",color:"#fff",margin:"4px 0 8px"}}>{fmt(saldo)}</div>
      <div style={{display:"flex",gap:8}}>
        {[["Inicial",fmt(ini)],["Cierres",fmt(tot)],["Pagado",fmt(eg)]].map(([l,v])=>(
          <div key={l} style={{flex:1,background:"rgba(255,255,255,.12)",borderRadius:10,padding:"8px 10px"}}>
            <div style={{fontSize:".58rem",color:"#fff",opacity:.6,textTransform:"uppercase",letterSpacing:".04em"}}>{l}</div>
            <div style={{fontSize:".85rem",fontWeight:700,color:"#fff",marginTop:2}}>{v}</div>
          </div>
        ))}
      </div>
    </div>

    {/* CAJA DIGITAL */}
    <div style={{background:"#2C1A0E",borderRadius:14,padding:"20px",marginBottom:16,border:"2px solid #B7860B"}}>
      <div style={{fontSize:".65rem",letterSpacing:".08em",textTransform:"uppercase",color:"#E8DCC8",opacity:.7}}>💳 Caja digital · Banco</div>
      <div style={{fontFamily:"Georgia,serif",fontSize:"2rem",color:"#E8DCC8",margin:"4px 0 2px"}}>{fmt(saldoReal)}</div>
      <div style={{fontSize:".72rem",color:"#E8DCC8",opacity:.6,marginBottom:12}}>Saldo real del banco actualizado manualmente</div>
      <div style={{display:"flex",gap:8,marginBottom:14}}>
        {[["Inicial",fmt(ini||0),"#E8DCC8"],["Ingresos dig.",fmt(ingresos),"#a9dfbf"],["Egresos transf.",fmt(egTransf),"#f5b7b1"]].map(([l,v,c])=>(
          <div key={l} style={{flex:1,background:"rgba(255,255,255,.07)",borderRadius:10,padding:"8px 10px"}}>
            <div style={{fontSize:".58rem",color:"#E8DCC8",opacity:.6,textTransform:"uppercase",letterSpacing:".04em"}}>{l}</div>
            <div style={{fontSize:".85rem",fontWeight:700,color:c,marginTop:2}}>{v}</div>
          </div>
        ))}
      </div>
      <div style={{display:"flex",gap:8}}>
        <input type="number" value={saldoBanco} onChange={e=>setSaldoBanco(e.target.value)}
          placeholder="Ingresar saldo inicial banco"
          style={{flex:1,background:"rgba(255,255,255,.1)",border:"1.5px solid rgba(255,255,255,.2)",borderRadius:8,padding:"9px 12px",color:"#fff",fontSize:".85rem",outline:"none",fontFamily:"inherit"}}/>
        <button onClick={actualizarBanco} disabled={savingBanco}
          style={{padding:"9px 16px",border:"none",borderRadius:8,background:"#B7860B",color:"#fff",fontWeight:600,fontSize:".82rem",cursor:"pointer",flexShrink:0}}>
          {savingBanco?"…":"Actualizar"}
        </button>
      </div>
    </div>
  </>);
}

function TabCierresCaja({cierresCaja,saveCierresCaja,cajaDigitalSaldo,saveCajaDigitalSaldo,calcDigital}){
  const TURNOS=["Mostrador Día","Mostrador Noche","PosFUDO1","PosFUDO2"];
  const hoy=hoyLocal();

  const[fecha,setFecha]=useState(hoy);
  const[turno,setTurno]=useState("Mostrador Día");
  const[persona,setPersona]=useState("");
  const[mp,setMp]=useState("");
  const[fudoTarjetas,setFudoTarjetas]=useState("");
  const[postnet,setPostnet]=useState("");
  const[digital,setDigital]=useState("");
  const[uber,setUber]=useState("");
  const[efectivo,setEfectivo]=useState("");
  const[ventaSistema,setVentaSistema]=useState("");
  const[obs,setObs]=useState("");
  const[busy,setBusy]=useState(false);
  const[saldoBanco,setSaldoBanco]=useState("");
  const[savingBanco,setSavingBanco]=useState(false);
  const[fotos,setFotos]=useState([]);
  const[confElim,setConfElim]=useState(null);
  const[verFotos,setVerFotos]=useState(null);
  const[personas,setPersonas]=useState(["Micaela","Priscila","Valentina","Ludmila","Catalina","Lautaro"]);
  const[nuevoPersonaModal,setNuevoPersonaModal]=useState(false);
  const[nuevoPersonaNombre,setNuevoPersonaNombre]=useState("");

  const agregarPersona=()=>{
    const nombre=nuevoPersonaNombre.trim();
    if(!nombre){toast("Ingresá un nombre");return;}
    if(personas.some(p=>norm(p)===norm(nombre))){toast("Ya existe");return;}
    setPersonas([...personas,nombre]);
    setPersona(nombre);setNuevoPersonaNombre("");setNuevoPersonaModal(false);toast("Agregado ✓");
  };
  const eliminarCierre=async()=>{
    const c=confElim;setConfElim(null);
    await saveCierresCaja(cierresCaja.filter(x=>x.id!==c.id));
    toast("Cierre eliminado ✓");
  };

  const n=v=>Number(v)||0;
  const totalDigital=n(mp)+n(fudoTarjetas)+n(postnet)+n(digital)+n(uber);
  const totalCierre=totalDigital+n(efectivo);
  const diferencia=totalCierre-n(ventaSistema);

  const guardar=async()=>{
    if(!persona.trim()||!turno){toast("Completá persona y turno");return;}
    if(!ventaSistema){toast("⚠️ Ingresá la venta del sistema");return;}
    if(!efectivo&&!mp&&!fudoTarjetas&&!postnet&&!digital&&!uber){toast("Ingresá al menos un monto");return;}
    setBusy(true);
    const cierreId=uid();
    const nuevo={
      id:cierreId,tipo:"cierre_caja",
      fecha:fecha?fechaLocalISO(fecha):new Date().toISOString(),
      turno,persona:persona.trim(),
      mp:n(mp),fudoTarjetas:n(fudoTarjetas),postnet:n(postnet),
      digital:n(digital),uber:n(uber),
      efectivo:n(efectivo),totalDigital,total:totalCierre,
      ventaSistema:n(ventaSistema),diferencia,obs:obs.trim(),
    };
    // Guardar cierre SIN fotos (liviano, va rápido aunque el WiFi sea malo)
    const ok=await saveCierresCaja([...cierresCaja,nuevo]);

    setBusy(false);
    if(!ok){toast("❌ Error al guardar — verificá la conexión e intentá de nuevo");return;}
    setMp("");setFudoTarjetas("");setPostnet("");setDigital("");setUber("");
    setEfectivo("");setVentaSistema("");setObs("");setPersona("");
    setFecha(hoyLocal());
    setFotos([]);
    toast("Cierre registrado ✓");
  };

  const actualizarBanco=async()=>{
    if(!saldoBanco){toast("Ingresá el saldo real");return;}
    setSavingBanco(true);
    await saveCajaDigitalSaldo(Number(saldoBanco));
    setSavingBanco(false);setSaldoBanco("");
    toast("Saldo banco actualizado ✓");
  };

  const {ingresos,egTransf,saldoReal,deducciones}=calcDigital();

  // Últimos cierres
  const ultimos=[...cierresCaja].sort((a,b)=>new Date(b.fecha)-new Date(a.fecha)).slice(0,10);

  return(<>
    <ST help={"Registrá acá el cierre de cada turno con el detalle de ventas por canal.\n\n• MP/FUDO, FUDO Tarjetas, PostNet, Digital, Uber Eat: ingresos digitales del turno.\n• Efectivo: dinero en efectivo contado al cerrar.\n• Venta del sistema: total que figura en FUDO — sirve para calcular la diferencia y detectar faltantes.\n• La diferencia (positiva o negativa) queda registrada en el historial.\n• Podés adjuntar fotos del cierre como respaldo."}>Cierres de Caja</ST><SS>Registrá cada cierre al finalizar el turno.</SS>



    {nuevoPersonaModal&&(
      <div style={{position:"fixed",inset:0,background:"rgba(44,26,14,.65)",zIndex:500,display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
        <div style={{background:"#fff",borderRadius:"20px 20px 0 0",padding:"28px 20px 44px",width:"100%",maxWidth:460}}>
          <p style={{fontFamily:"Georgia,serif",fontSize:"1.1rem",marginBottom:16}}>Nueva persona</p>
          <input value={nuevoPersonaNombre} onChange={e=>setNuevoPersonaNombre(e.target.value)} placeholder="Nombre" autoFocus onKeyDown={e=>e.key==="Enter"&&agregarPersona()} style={{...iS,marginBottom:16}}/>
          <div style={{display:"flex",gap:10}}>
            <button onClick={()=>{setNuevoPersonaModal(false);setNuevoPersonaNombre("");}} style={{flex:1,padding:12,borderRadius:10,border:"none",background:"#E8DCC8",fontWeight:600,cursor:"pointer"}}>Cancelar</button>
            <button onClick={agregarPersona} style={{flex:1,padding:12,borderRadius:10,border:"none",background:"#2C1A0E",color:"#fff",fontWeight:600,cursor:"pointer"}}>Agregar</button>
          </div>
        </div>
      </div>
    )}

    {/* FORMULARIO CIERRE */}
    <div style={{background:"#fff",borderRadius:14,padding:20,boxShadow:"0 2px 12px rgba(44,26,14,.08)",marginBottom:16}}>
      <div style={{fontSize:".68rem",fontWeight:700,letterSpacing:".09em",textTransform:"uppercase",color:"#7B7063",marginBottom:14}}>Nuevo cierre</div>

      <div style={{display:"flex",gap:8}}>
        <div style={{flex:1}}>
          <label style={{display:"block",fontSize:".78rem",fontWeight:600,color:"#2C1A0E",marginBottom:5}}>Fecha</label>
          <input type="date" value={fecha} onChange={e=>setFecha(e.target.value)} style={iS}/>
        </div>
        <div style={{flex:1}}>
          <label style={{display:"block",fontSize:".78rem",fontWeight:600,color:"#2C1A0E",marginBottom:5}}>Turno</label>
          <select value={turno} onChange={e=>setTurno(e.target.value)} style={sS}>
            {TURNOS.map(t=><option key={t}>{t}</option>)}
          </select>
        </div>
      </div>

      <Field label="Persona">
        <div style={{display:"flex",gap:8}}>
          <select value={persona} onChange={e=>setPersona(e.target.value)} style={{...sS,flex:1}}>
            <option value="">— Elegí —</option>
            {personas.map(p=><option key={p} value={p}>{p}</option>)}
          </select>
          <button onClick={()=>setNuevoPersonaModal(true)} title="Agregar persona" style={{padding:"10px 14px",border:"1.5px solid #E8DCC8",borderRadius:8,background:"#F9F6F1",fontSize:"1.1rem",cursor:"pointer",flexShrink:0}}>+</button>
        </div>
      </Field>

function PagosAdmin({pagos,savePagos,proveedores}){
  const[buscar,setBuscar]=useState("");
  const[editItem,setEditItem]=useState(null);
  const[editForm,setEditForm]=useState({});
  const[confElim,setConfElim]=useState(null);

  const sorted=[...pagos]
    .filter(p=>!buscar||(p.proveedor||"").toLowerCase().includes(buscar.toLowerCase())||fmtF(p.fecha).includes(buscar))
    .sort((a,b)=>b.fecha.localeCompare(a.fecha)).slice(0,30);

  const abrirEditar=p=>{
    setEditItem(p);
    setEditForm({proveedor:p.proveedor,empleado:p.empleado,monto:String(p.monto),forma:p.forma,obs:p.obs||"",fecha:p.fecha.slice(0,10)});
  };

  const guardar=async()=>{
    if(!editForm.proveedor||!editForm.monto){toast("Completá los campos obligatorios");return;}
    const nuevos=pagos.map(p=>p.id===editItem.id?{...p,...editForm,monto:Number(editForm.monto),fecha:editForm.fecha?new Date(editForm.fecha+"T12:00:00").toISOString():p.fecha}:p);
    await savePagos(nuevos);
    setEditItem(null);toast("Pago actualizado ✓");
  };

  const eliminar=async()=>{
    await savePagos(pagos.filter(p=>p.id!==confElim.id));
    setConfElim(null);toast("Pago eliminado ✓");
  };

  return(<>
    <input value={buscar} onChange={e=>setBuscar(e.target.value)} placeholder="🔍 Buscar por proveedor o fecha..."
      style={{...iS,marginBottom:10,fontSize:".82rem"}}/>
    {!sorted.length?<Empty icon="💸">Sin pagos</Empty>:sorted.map((p,i)=>(
      <div key={p.id} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 0",borderBottom:"1px solid #F9F6F1"}}>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontWeight:600,fontSize:".82rem"}}>{p.proveedor}</div>
          <div style={{fontSize:".7rem",color:"#7B7063"}}>{fmtF(p.fecha)} · {p.forma} · {p.empleado}</div>
          {p.obs&&<div style={{fontSize:".7rem",color:"#7B7063"}}>{p.obs}</div>}
        </div>
        <div style={{fontWeight:700,fontSize:".85rem",color:"#C0392B",flexShrink:0}}>{fmt(p.monto)}</div>
        <div style={{display:"flex",gap:4,flexShrink:0}}>
          <button onClick={()=>abrirEditar(p)} style={{background:"#EAF5F0",border:"none",borderRadius:6,color:"#2D6A4F",fontSize:".62rem",fontWeight:600,cursor:"pointer",padding:"3px 7px"}}>✏️</button>
          <button onClick={()=>setConfElim(p)} style={{background:"#FFF0EF",border:"none",borderRadius:6,color:"#E74C3C",fontSize:".62rem",fontWeight:600,cursor:"pointer",padding:"3px 7px"}}>✕</button>
        </div>
      </div>
    ))}

    {editItem&&(
      <div style={{position:"fixed",inset:0,background:"rgba(44,26,14,.65)",zIndex:500,display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
        <div style={{background:"#fff",borderRadius:"20px 20px 0 0",padding:"24px 20px 40px",width:"100%",maxWidth:460,maxHeight:"88dvh",overflowY:"auto"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
            <p style={{fontFamily:"Georgia,serif",fontSize:"1.1rem"}}>✏️ Editar pago</p>
            <button onClick={()=>setEditItem(null)} style={{background:"none",border:"none",fontSize:"1.4rem",cursor:"pointer",color:"#7B7063"}}>✕</button>
          </div>
          <div style={{marginBottom:10}}>
            <label style={{display:"block",fontSize:".76rem",fontWeight:600,color:"#2C1A0E",marginBottom:4}}>Proveedor</label>
            <select value={editForm.proveedor||""} onChange={e=>setEditForm(f=>({...f,proveedor:e.target.value}))} style={sS}>

              {proveedores.map(p=><option key={p.id} value={p.nombre}>{p.nombre}</option>)}

          </div>
          {[["Registrado por","empleado","text"],["Monto ($)","monto","number"],["Observaciones","obs","text"]].map(([l,k,t])=>(
            <div key={k} style={{marginBottom:10}}>
              <label style={{display:"block",fontSize:".76rem",fontWeight:600,color:"#2C1A0E",marginBottom:4}}>{l}</label>

            <select value={editForm.forma||"Efectivo"} onChange={e=>setEditForm(f=>({...f,forma:e.target.value}))} style={sS}>

              <option value="Transferencia">Transferencia</option>

            <button onClick={guardar} style={{flex:1,padding:12,borderRadius:10,border:"none",background:"#2D6A4F",color:"#fff",fontWeight:600,cursor:"pointer"}}>Guardar</button>

            <button onClick={()=>setConfElim(null)} style={{flex:1,padding:12,borderRadius:10,border:"none",background:"#E8DCC8",fontWeight:600,cursor:"pointer"}}>Cancelar</button>
            <button onClick={eliminar} style={{flex:1,padding:12,borderRadius:10,border:"none",background:"#C0392B",color:"#fff",fontWeight:600,cursor:"pointer"}}>Eliminar</button>

        <div style={{background:"#fff",borderRadius:"20px 20px 0 0",padding:"28px 20px 44px",width:"100%",maxWidth:460}}>
          <p style={{fontFamily:"Georgia,serif",fontSize:"1.1rem",marginBottom:8}}>⚠️ Eliminar sueldo</p>
          <p style={{fontSize:".85rem",color:"#7B7063",marginBottom:16}}>{confElim.empleado} · {confElim.concepto||"Sueldo"} · {fmt(confElim.monto)} · {fmtF(confElim.fecha)}</p>
          <div style={{display:"flex",gap:10}}>
            <button onClick={()=>setConfElim(null)} style={{flex:1,padding:12,borderRadius:10,border:"none",background:"#E8DCC8",fontWeight:600,cursor:"pointer"}}>Cancelar</button>
            <button onClick={eliminar} style={{flex:1,padding:12,borderRadius:10,border:"none",background:"#C0392B",color:"#fff",fontWeight:600,cursor:"pointer"}}>Eliminar</button>
          </div>
        </div>
      </div>
    )}
  </>);
}

function CierresAdmin({cierresCaja,saveCierresCaja}){
  const TURNOS=["Mostrador Día","Mostrador Noche","PosFUDO1","PosFUDO2"];
  const[confElim,setConfElim]=useState(null);
  const[editItem,setEditItem]=useState(null);
  const[editForm,setEditForm]=useState({});
  const[editFotos,setEditFotos]=useState([]);
  const[buscar,setBuscar]=useState("");

  const abrirEditar=c=>{
    setEditItem(c);
    setEditForm({
      fecha:c.fecha.slice(0,10),
      turno:c.turno,
      persona:c.persona,
      mp:String(c.mp||0),
      fudoTarjetas:String(c.fudoTarjetas||0),
      postnet:String(c.postnet||0),
      digital:String(c.digital||0),
      uber:String(c.uber||0),
      efectivo:String(c.efectivo||0),
      ventaSistema:String(c.ventaSistema||0),
      obs:c.obs||"",
    });
    setEditFotos(c.fotos||[]);
  };

  const eliminar=async()=>{
    const c=confElim;setConfElim(null);
    await saveCierresCaja(cierresCaja.filter(x=>x.id!==c.id));
    toast("Cierre eliminado ✓");
  };

  const n=v=>Number(v)||0;
  const totalDigEdit=n(editForm.mp)+n(editForm.fudoTarjetas)+n(editForm.postnet)+n(editForm.digital)+n(editForm.uber);
  const totalEdit=totalDigEdit+n(editForm.efectivo);
  const difEdit=totalEdit-n(editForm.ventaSistema);

  const guardarEdit=async()=>{
    const nuevos=cierresCaja.map(c=>{
      if(c.id!==editItem.id)return c;
      return{
        ...c,
        fecha:editForm.fecha?new Date(editForm.fecha+"T12:00:00").toISOString():c.fecha,
        turno:editForm.turno,
        persona:editForm.persona,
        mp:n(editForm.mp),fudoTarjetas:n(editForm.fudoTarjetas),
        postnet:n(editForm.postnet),digital:n(editForm.digital),uber:n(editForm.uber),
        efectivo:n(editForm.efectivo),totalDigital:totalDigEdit,
        total:totalEdit,ventaSistema:n(editForm.ventaSistema),
        diferencia:difEdit,obs:editForm.obs,fotos:editFotos,
      };
    });
    await saveCierresCaja(nuevos);
    setEditItem(null);
    toast("Cierre actualizado ✓");
  };

  const agregarFotoEdit=async e=>{
    const files=Array.from(e.target.files);
    const comp=await Promise.all(files.map(f=>new Promise(res=>{
      const r=new FileReader();
      r.onload=async ev=>{
        const img=new Image();
        img.onload=()=>{
          let{width:w,height:h}=img;
          if(w>900){h=Math.round(h*900/w);w=900;}
          const c=document.createElement("canvas");c.width=w;c.height=h;
          c.getContext("2d").drawImage(img,0,0,w,h);
          res(c.toDataURL("image/jpeg",0.7));
        };
        img.src=ev.target.result;
      };
      r.readAsDataURL(f);
    })));
    setEditFotos(prev=>[...prev,...comp]);
    e.target.value="";
  };

  const sorted=[...cierresCaja]
    .filter(c=>!buscar||(c.persona||"").toLowerCase().includes(buscar.toLowerCase())||(c.turno||"").toLowerCase().includes(buscar.toLowerCase())||fmtF(c.fecha).includes(buscar))
    .sort((a,b)=>b.fecha.localeCompare(a.fecha)).slice(0,30);

  if(!cierresCaja.length)return<Empty icon="💰">Sin cierres registrados</Empty>;

  const EF=({label,fkey,type="number"})=>(
    <div style={{marginBottom:10}}>
      <label style={{display:"block",fontSize:".72rem",fontWeight:600,color:"#7B7063",marginBottom:3}}>{label}</label>
      <input type={type} value={editForm[fkey]||""} onChange={e=>setEditForm(f=>({...f,[fkey]:e.target.value}))}
        style={{...iS,padding:"8px 10px",fontSize:".85rem"}}/>
    </div>
  );

  return(<>
    {/* BUSCADOR */}
    <input value={buscar} onChange={e=>setBuscar(e.target.value)} placeholder="🔍 Buscar por persona, turno o fecha..."
      style={{...iS,marginBottom:12,fontSize:".85rem"}}/>

    <div style={{overflowX:"auto"}}>
      <table style={{width:"100%",borderCollapse:"collapse",fontSize:".75rem",minWidth:480}}>
        <thead>
          <tr style={{background:"#F9F6F1"}}>
            {["Fecha","Turno","Persona","Efectivo","Fotos","Acciones"].map(h=>(
              <th key={h} style={{padding:"6px 8px",textAlign:h==="Acciones"||h==="Efectivo"?"right":"left",fontWeight:700,color:"#7B7063",fontSize:".63rem",textTransform:"uppercase",borderBottom:"2px solid #E8DCC8",whiteSpace:"nowrap"}}>{h}</th>
            ))}
          </tr>
        </thead>
        <tbody>
          {sorted.map((c,i)=>(
            <tr key={c.id} style={{background:i%2===0?"#fff":"#F9F6F1"}}>
              <td style={{padding:"6px 8px",whiteSpace:"nowrap",color:"#7B7063"}}>{fmtF(c.fecha)}</td>
              <td style={{padding:"6px 8px",whiteSpace:"nowrap"}}>{c.turno}</td>
              <td style={{padding:"6px 8px"}}>{c.persona}</td>
              <td style={{padding:"6px 8px",textAlign:"right",color:"#2D6A4F",fontWeight:600}}>{fmt(c.efectivo)}</td>
              <td style={{padding:"6px 8px"}}>
                {c.fotos&&c.fotos.length>0
                  ?<span style={{fontSize:".68rem",color:"#2D6A4F",fontWeight:600}}>📷 {c.fotos.length}</span>
                  :<span style={{fontSize:".68rem",color:"#E74C3C"}}>Sin foto</span>}
              </td>
              <td style={{padding:"6px 8px",textAlign:"right"}}>
                <div style={{display:"flex",gap:6,justifyContent:"flex-end"}}>
                  <button onClick={()=>abrirEditar(c)} style={{background:"#EAF5F0",border:"none",borderRadius:6,color:"#2D6A4F",fontSize:".65rem",fontWeight:600,cursor:"pointer",padding:"3px 7px"}}>✏️ Editar</button>
                  <button onClick={()=>setConfElim(c)} style={{background:"#FFF0EF",border:"none",borderRadius:6,color:"#E74C3C",fontSize:".65rem",fontWeight:600,cursor:"pointer",padding:"3px 7px"}}>✕ Borrar</button>
                </div>
              </td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>

    {/* MODAL EDITAR COMPLETO */}
    {editItem&&(
      <div style={{position:"fixed",inset:0,background:"rgba(44,26,14,.65)",zIndex:500,display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
        <div style={{background:"#fff",borderRadius:"20px 20px 0 0",padding:"24px 20px 40px",width:"100%",maxWidth:460,maxHeight:"92dvh",overflowY:"auto"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
            <p style={{fontFamily:"Georgia,serif",fontSize:"1.1rem"}}>✏️ Editar cierre</p>
            <button onClick={()=>setEditItem(null)} style={{background:"none",border:"none",fontSize:"1.4rem",cursor:"pointer",color:"#7B7063"}}>✕</button>
          </div>

          {/* FECHA Y TURNO */}
          <div style={{display:"flex",gap:8,marginBottom:10}}>
            <div style={{flex:1}}>
              <label style={{display:"block",fontSize:".72rem",fontWeight:600,color:"#7B7063",marginBottom:3}}>Fecha</label>
              <input type="date" value={editForm.fecha||""} onChange={e=>setEditForm(f=>({...f,fecha:e.target.value}))} style={{...iS,padding:"8px 10px"}}/>
            </div>
            <div style={{flex:1}}>
              <label style={{display:"block",fontSize:".72rem",fontWeight:600,color:"#7B7063",marginBottom:3}}>Turno</label>
              <select value={editForm.turno||""} onChange={e=>setEditForm(f=>({...f,turno:e.target.value}))} style={{...sS,padding:"8px 10px"}}>
                {TURNOS.map(t=><option key={t}>{t}</option>)}
              </select>
            </div>
          </div>
          <EF label="Persona" fkey="persona" type="text"/>

          {/* DIGITAL */}
          <div style={{background:"#FEF9E7",borderRadius:10,padding:"12px",marginBottom:10}}>
            <div style={{fontSize:".68rem",fontWeight:700,color:"#B7860B",textTransform:"uppercase",letterSpacing:".06em",marginBottom:8}}>💳 Digital</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
              {[["MP/FUDO","mp"],["FUDO Tarjetas","fudoTarjetas"],["PostNet","postnet"],["Digital","digital"],["Uber Eat","uber"]].map(([l,k])=>(
                <div key={k}>
                  <label style={{display:"block",fontSize:".68rem",fontWeight:600,color:"#7B7063",marginBottom:3}}>{l}</label>
                  <input type="number" value={editForm[k]||""} onChange={e=>setEditForm(f=>({...f,[k]:e.target.value}))} style={{...iS,padding:"7px 8px",fontSize:".82rem"}}/>
                </div>
              ))}
              <div style={{display:"flex",alignItems:"flex-end"}}>
                <div style={{background:"#2C1A0E",borderRadius:8,padding:"7px 10px",width:"100%"}}>
                  <div style={{fontSize:".6rem",color:"#E8DCC8",opacity:.6}}>Total digital</div>
                  <div style={{fontWeight:700,color:"#E8DCC8",fontSize:".9rem",marginTop:1}}>{fmt(totalDigEdit)}</div>
                </div>
              </div>
            </div>
          </div>

          {/* EFECTIVO */}
          <div style={{background:"#EAF5F0",borderRadius:10,padding:"12px",marginBottom:10}}>
            <div style={{fontSize:".68rem",fontWeight:700,color:"#2D6A4F",textTransform:"uppercase",letterSpacing:".06em",marginBottom:8}}>💵 Efectivo</div>
            <input type="number" value={editForm.efectivo||""} onChange={e=>setEditForm(f=>({...f,efectivo:e.target.value}))} style={{...iS,padding:"8px 10px"}}/>
          </div>

          {/* TOTALES */}
          <div style={{display:"flex",gap:8,marginBottom:10}}>
            <div style={{flex:1,background:"#F9F6F1",borderRadius:10,padding:"8px 10px",textAlign:"center"}}>
              <div style={{fontSize:".6rem",color:"#7B7063"}}>Total</div>
              <div style={{fontFamily:"Georgia,serif",fontSize:"1rem",fontWeight:700}}>{fmt(totalEdit)}</div>
            </div>
            <div style={{flex:1,background:"#F9F6F1",borderRadius:10,padding:"8px 10px"}}>
              <div style={{fontSize:".6rem",color:"#7B7063",textAlign:"center"}}>Venta sistema</div>
              <input type="number" value={editForm.ventaSistema||""} onChange={e=>setEditForm(f=>({...f,ventaSistema:e.target.value}))}
                style={{background:"none",border:"none",outline:"none",fontFamily:"Georgia,serif",fontSize:"1rem",color:"#2C1A0E",width:"100%",textAlign:"center",fontWeight:700}}/>
            </div>
            <div style={{flex:1,background:difEdit>=0?"#EAF5F0":"#FFF0EF",borderRadius:10,padding:"8px 10px",textAlign:"center"}}>
              <div style={{fontSize:".6rem",color:"#7B7063"}}>Diferencia</div>
              <div style={{fontFamily:"Georgia,serif",fontSize:"1rem",fontWeight:700,color:difEdit>=0?"#2D6A4F":"#C0392B"}}>{difEdit>=0?"+":""}{fmt(difEdit)}</div>
            </div>
          </div>

          <EF label="Observaciones" fkey="obs" type="text"/>

          {/* FOTOS */}
          <div style={{marginBottom:14}}>
            <label style={{display:"block",fontSize:".72rem",fontWeight:600,color:"#2C1A0E",marginBottom:8}}>📷 Fotos del cierre</label>
            <label style={{display:"flex",alignItems:"center",gap:10,border:"2px dashed #E8DCC8",borderRadius:10,padding:"10px 14px",cursor:"pointer",background:"#F9F6F1",marginBottom:8}}>
              <input type="file" accept="image/*" multiple onChange={agregarFotoEdit} style={{display:"none"}}/>
              <span style={{fontSize:"1.2rem"}}>📷</span>
              <span style={{fontSize:".78rem",color:"#7B7063"}}>Agregar fotos</span>
            </label>
            {editFotos.length>0&&(
              <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                {editFotos.map((f,j)=>(
                  <div key={j} style={{position:"relative"}}>

          </div>
        </div>
      </div>

    {/* MODAL ELIMINAR */}
    {confElim&&(
      <div style={{position:"fixed",inset:0,background:"rgba(44,26,14,.65)",zIndex:500,display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
        <div style={{background:"#fff",borderRadius:"20px 20px 0 0",padding:"28px 20px 44px",width:"100%",maxWidth:460}}>
          <p style={{fontFamily:"Georgia,serif",fontSize:"1.1rem",marginBottom:8}}>⚠️ Eliminar cierre</p>
          <p style={{fontSize:".85rem",color:"#7B7063",marginBottom:4}}>{confElim.turno} · {confElim.persona} · {fmtF(confElim.fecha)}</p>
          <p style={{fontSize:".85rem",color:"#7B7063",marginBottom:16}}>Total: {fmt(confElim.total)} · Efectivo: {fmt(confElim.efectivo)}</p>
          <p style={{fontSize:".78rem",color:"#C0392B",fontWeight:600,marginBottom:20}}>Esta acción ajustará la caja disponible.</p>
          <div style={{display:"flex",gap:10}}>
            <button onClick={()=>setConfElim(null)} style={{flex:1,padding:13,borderRadius:10,border:"none",background:"#E8DCC8",fontWeight:600,cursor:"pointer"}}>Cancelar</button>

          </div>
        </div>
      </div>
    )}
  </>);
}


function TabAdmin({proveedores,saveProveedores,cajaInicial,saveCajaInicial,askPass,cierresCaja,saveCierresCaja,pagos,savePagos,sueldos,saveSueldos,boletas,saveBoletas,ajustesCajaEfectivo,saveAjustesCajaEfectivo,saldo}){
  const[unlocked,setUnlocked]=useState(false);
  const[passInput,setPassInput]=useState("");
  const[passErr,setPassErr]=useState(false);
  const[seccion,setSeccion]=useState(null);
  const[nombre,setNombre]=useState("");const[deuda,setDeuda]=useState("");
  const[obs,setObs]=useState("");const[montoIni,setMontoIni]=useState("");
  const[busy,setBusy]=useState(false);

  useEffect(()=>{if(unlocked)setMontoIni(cajaInicial>0?String(cajaInicial):"");},[unlocked,cajaInicial]);

  const intentarAcceso=()=>{
    if(passInput==="Barcala716*"){setUnlocked(true);setPassInput("");setPassErr(false);}
    else{setPassErr(true);setPassInput("");}
  };

  const guardarCajaIni=async()=>{
    const v=Number(montoIni);
    if(isNaN(v)||v<0){toast("Ingresá un monto válido");return;}
    await saveCajaInicial(v);toast("Saldo inicial guardado ✓");
  };

  const guardarProv=async()=>{
    if(!nombre.trim()){toast("Ingresá el nombre del proveedor");return;}
    setBusy(true);
    const norm2=s=>String(s||"").trim().toLowerCase();
    const idx=proveedores.findIndex(p=>norm2(p.nombre)===norm2(nombre));
    let nuevos;
    if(idx>=0){
      nuevos=proveedores.map((p,i)=>i===idx?{...p,deudaInicial:Number(deuda)||0,obs:obs.trim()}:p);
      toast("Proveedor actualizado ✓");
    }else{
      nuevos=[...proveedores,{id:uid(),nombre:nombre.trim(),deudaInicial:Number(deuda)||0,obs:obs.trim(),fecha:new Date().toISOString()}];
      toast("Proveedor creado ✓");
    }
    await saveProveedores(nuevos);setBusy(false);setNombre("");setDeuda("");setObs("");
  };

  const eliminar=async id=>{
    if(!confirm("¿Eliminar este proveedor? Los pagos no se borran."))return;
    await saveProveedores(proveedores.filter(p=>p.id!==id));toast("Eliminado");
  };

  const editar=p=>{setNombre(p.nombre);setDeuda(String(p.deudaInicial||""));setObs(p.obs||"");};

  if(!unlocked)return(
    <>
      <ST>Administración</ST><SS>Ingresá la contraseña para acceder.</SS>
      <Card>
        <Field label="Contraseña de administrador">
          <input type="password" value={passInput} onChange={e=>{setPassInput(e.target.value);setPassErr(false);}}
            onKeyDown={e=>e.key==="Enter"&&intentarAcceso()}
            placeholder="Contraseña" autoFocus style={{...iS,border:`1.5px solid ${passErr?"#E74C3C":"#E8DCC8"}`}}/>
        </Field>
        {passErr&&<p style={{color:"#E74C3C",fontSize:".8rem",marginTop:6}}>Contraseña incorrecta</p>}
        <Btn bg="#2C1A0E" onClick={intentarAcceso}>Ingresar</Btn>
      </Card>
    </>
  );

  const SECCIONES=[
    {id:"cajainicial",   icon:"🏦", label:"Saldo inicial de caja"},
    {id:"proveedores",   icon:"🏪", label:"Proveedores"},
    {id:"pagosadmin",    icon:"💸", label:"Editar pagos"},
    {id:"sueldosadmin",  icon:"👷", label:"Editar sueldos"},
    {id:"cierresadmin",  icon:"🗂️", label:"Editar cierres de caja"},
    {id:"boletas",       icon:"🧾", label:"Corregir boletas"},
    {id:"ajustecaja",    icon:"⚖️", label:"Ajuste de caja disponible"},
  ];

  return(<>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
      <ST>Administración</ST>
      <button onClick={()=>{setUnlocked(false);setSeccion(null);}} style={{background:"none",border:"none",fontSize:".75rem",color:"#7B7063",cursor:"pointer"}}>Cerrar sesión</button>
    </div>
    <SS>Configuración y gestión del sistema.</SS>

    {!seccion&&(
      <div style={{display:"flex",flexDirection:"column",gap:10}}>
        {SECCIONES.map(s=>(
          <button key={s.id} onClick={()=>setSeccion(s.id)} style={{display:"flex",alignItems:"center",gap:14,padding:"16px 18px",background:"#fff",border:"1px solid #E8DCC8",borderRadius:12,cursor:"pointer",textAlign:"left",boxShadow:"0 1px 6px rgba(44,26,14,.06)"}}>
            <span style={{fontSize:"1.4rem"}}>{s.icon}</span>
            <span style={{fontWeight:600,fontSize:".9rem",color:"#2C1A0E"}}>{s.label}</span>
            <span style={{marginLeft:"auto",color:"#B7A98F",fontSize:"1.1rem"}}>›</span>
          </button>
        ))}
      </div>
    )}

    {seccion&&(
      <button onClick={()=>setSeccion(null)} style={{display:"flex",alignItems:"center",gap:6,background:"none",border:"none",color:"#7B7063",fontSize:".8rem",fontWeight:600,cursor:"pointer",marginBottom:14,padding:0}}>
        ← Volver al menú Admin
      </button>
    )}

    {seccion==="cajainicial"&&(
      <Card title="Saldo inicial de caja">
        <p style={{fontSize:".8rem",color:"#7B7063",marginBottom:10}}>El efectivo que ya tenías en caja antes de usar este sistema. ⚠️ Modificarlo afecta todo el historial.</p>
        <Field label="Monto inicial ($)"><Inp type="number" value={montoIni} onChange={setMontoIni} placeholder="0"/></Field>
        <Btn bg="#555" onClick={guardarCajaIni}>Guardar saldo inicial</Btn>
      </Card>
    )}

    {seccion==="proveedores"&&(<>
      <Card title="Agregar / editar proveedor">
        <Field label="Proveedor">
          <select value={nombre} onChange={e=>{
            if(e.target.value==="__nuevo__"){setNombre("");setTimeout(()=>document.getElementById("admin-nuevo-prov").focus(),50);}
            else{
              setNombre(e.target.value);
              const p=proveedores.find(x=>x.nombre===e.target.value);
              if(p){setDeuda(String(p.deudaInicial||""));setObs(p.obs||"");}
            }
          }} style={sS}>
            <option value="">— Elegí o creá un proveedor —</option>
            {proveedores.slice().sort((a,b)=>a.nombre.localeCompare(b.nombre)).map(p=><option key={p.id} value={p.nombre}>{p.nombre}</option>)}
            <option value="__nuevo__">➕ Crear nuevo proveedor</option>
          </select>
          {nombre===""&&<input id="admin-nuevo-prov" value={nombre} onChange={e=>setNombre(e.target.value)} placeholder="Nombre del nuevo proveedor" style={{...iS,marginTop:8}}/>}
        </Field>
        <Field label="Observaciones"><Inp value={obs} onChange={setObs} placeholder="Ej: 30 días de plazo"/></Field>
        <Field label="Deuda inicial ($)"><input type="number" value={deuda} onChange={e=>setDeuda(e.target.value)} placeholder="0" style={iS}/></Field>
        <Btn bg="#C0392B" onClick={guardarProv} disabled={busy}>{busy?"Guardando…":"Guardar proveedor"}</Btn>
      </Card>
      {proveedores.length>0&&(
        <Card title="Proveedores registrados">
          {proveedores.slice().sort((a,b)=>a.nombre.localeCompare(b.nombre)).map(p=>(
            <div key={p.id} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 0",borderBottom:"1px solid #F9F6F1"}}>
