function StockPedidos({catalogo,proveedoresCat,pedidos,savePedidos,registradoPor}){
  const[provSel,setProvSel]=useState("");
  const[cants,setCants]=useState({});
  const[obs,setObs]=useState("");
  const[busy,setBusy]=useState(false);
  const[editId,setEditId]=useState(null);

  const productosDelProv=provSel?catalogo.filter(c=>c.proveedor===provSel&&c.activo!==false):[];

  const crearPedido=async()=>{
    const items=productosDelProv.filter(c=>Number(cants[c.id])>0).map(c=>({producto:c.producto,cantidad:Number(cants[c.id])}));
    if(!provSel){toast("Elegí un proveedor");return;}
    if(!items.length){toast("Ingresá cantidad en al menos un producto");return;}
    setBusy(true);
    if(editId){
      await savePedidos(pedidos.map(p=>p.id===editId?{...p,proveedor:provSel,items,obs:obs.trim()}:p));
      toast("Pedido actualizado ✓");
    }else{
      const nuevo={id:uid(),proveedor:provSel,fecha:new Date().toISOString(),items,obs:obs.trim(),estado:"pendiente",creadoPor:registradoPor||null};
      await savePedidos([nuevo,...pedidos]);
      toast("Pedido creado ✓");
    }
    setBusy(false);setProvSel("");setCants({});setObs("");setEditId(null);
  };

  const abrirEditar=p=>{
    setEditId(p.id);
    setProvSel(p.proveedor);
    const nuevosCants={};
    catalogo.filter(c=>c.proveedor===p.proveedor).forEach(c=>{
      const it=(p.items||[]).find(i=>i.producto===c.producto);
      if(it)nuevosCants[c.id]=String(it.cantidad);
    });
    setCants(nuevosCants);
    setObs(p.obs||"");
    window.scrollTo({top:0,behavior:"smooth"});
  };

  const cancelarEdicion=()=>{setEditId(null);setProvSel("");setCants({});setObs("");};

  const cambiarEstado=async(id,estado)=>{
    await savePedidos(pedidos.map(p=>p.id===id?{...p,estado}:p));
    toast("Pedido actualizado ✓");
  };

  const eliminar=async id=>{
    if(!confirm("¿Eliminar este pedido?"))return;
    await savePedidos(pedidos.filter(p=>p.id!==id));toast("Eliminado");
  };

  const verNota=p=>{
    const w=window.open("","_blank");
    if(w){w.document.write(notaPedidoHTML(p));w.document.close();}
  };

  const colorEstado={pendiente:"#B7860B",enviado:"#2980B9",recibido:"#2D6A4F"};

  return(<>
    <Card title={editId?"✏️ Editar pedido":"Nuevo pedido a proveedor"}>
      <Field label="Proveedor">
        <select value={provSel} onChange={e=>{setProvSel(e.target.value);setCants({});}} style={sS}>
          <option value="">— Elegí un proveedor —</option>
          {proveedoresCat.map(p=><option key={p} value={p}>{p}</option>)}
        </select>
      </Field>
      {provSel&&(
        <div style={{marginTop:14,maxHeight:320,overflowY:"auto",border:"1px solid #E8DCC8",borderRadius:10,padding:10}}>
          {productosDelProv.map(c=>(
            <div key={c.id} style={{display:"flex",alignItems:"center",gap:8,padding:"6px 2px",borderBottom:"1px solid #F2EAE0"}}>
              <div style={{flex:1,fontSize:".8rem"}}>{c.producto}</div>
              <input type="number" min="0" value={cants[c.id]||""} onChange={e=>setCants({...cants,[c.id]:e.target.value})} placeholder="0" style={{width:64,border:"1.5px solid #E8DCC8",borderRadius:6,padding:"5px 6px",fontSize:".82rem",textAlign:"center"}}/>
            </div>
          ))}
        </div>
      )}
      <Field label="Observaciones (opcional)"><TA value={obs} onChange={setObs} placeholder="Ej: pedir para el jueves..."/></Field>
      <Btn onClick={crearPedido} disabled={busy}>{busy?"Guardando…":editId?"Guardar cambios":"Crear pedido"}</Btn>
      {editId&&<button onClick={cancelarEdicion} style={{marginTop:8,width:"100%",padding:10,borderRadius:10,border:"none",background:"#E8DCC8",fontWeight:600,cursor:"pointer",fontSize:".82rem"}}>Cancelar edición</button>}
    </Card>

    {!pedidos.length?<Empty icon="🧾">Todavía no creaste pedidos</Empty>:pedidos.map(p=>(
      <div key={p.id} style={{background:"#fff",borderRadius:12,padding:16,marginBottom:10,boxShadow:"0 2px 10px rgba(44,26,14,.07)"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
          <div>
            <div style={{fontWeight:700,fontSize:".9rem"}}>{p.proveedor}</div>
            <div style={{fontSize:".7rem",color:"#7B7063"}}>{fmtFL(p.fecha)}{p.creadoPor?` · ${p.creadoPor}`:""}</div>
          </div>
          <span style={{background:colorEstado[p.estado]+"22",color:colorEstado[p.estado],fontSize:".66rem",fontWeight:700,padding:"3px 9px",borderRadius:20,textTransform:"uppercase"}}>{p.estado}</span>
        </div>
        <div style={{marginTop:10,fontSize:".8rem",color:"#2C1A0E"}}>
          {p.items.map((it,i)=><div key={i} style={{padding:"2px 0"}}>· {it.producto} — <strong>{it.cantidad}</strong></div>)}
        </div>
        {p.obs&&<div style={{marginTop:8,fontSize:".76rem",color:"#7B7063",fontStyle:"italic"}}>{p.obs}</div>}
        <div style={{display:"flex",gap:8,marginTop:12,flexWrap:"wrap"}}>
          <SmBtn color="#2D6A4F" onClick={()=>verNota(p)}>📄 Nota de pedido</SmBtn>
          <SmBtn onClick={()=>abrirEditar(p)}>✏️ Editar</SmBtn>
          {p.estado!=="pendiente"&&<SmBtn onClick={()=>cambiarEstado(p.id,"pendiente")}>Marcar pendiente</SmBtn>}
          {p.estado!=="enviado"&&<SmBtn onClick={()=>cambiarEstado(p.id,"enviado")}>Marcar enviado</SmBtn>}
          {p.estado!=="recibido"&&<SmBtn onClick={()=>cambiarEstado(p.id,"recibido")}>Marcar recibido</SmBtn>}
          <SmBtn color="#C0392B" onClick={()=>eliminar(p.id)}>Eliminar</SmBtn>
        </div>
      </div>
    ))}
  </>);
}




function StockDesperdicios({stock,saveStock,catalogo,desperdicios,saveDesperdicios,registradoPor}){
  const[itemId,setItemId]=useState("");
  const[cantidad,setCantidad]=useState("");
  const[motivo,setMotivo]=useState("Vencido");
  const[obs,setObs]=useState("");
  const[busy,setBusy]=useState(false);
  const[fecha,setFecha]=useState(hoyLocal());

  const MOTIVOS=["Vencido","Roto/dañado","Quemado/error de cocina","Devolución de cliente","Otro"];
  // Combina TODO el catálogo (activo) con lo que ya tiene fila de stock — igual patrón que Control de stock,
  // así los productos que todavía no se cargaron ("sin cargar") también aparecen para poder registrar un desperdicio.
  const catalogoIds=new Set((catalogo||[]).map(c=>c.id));
  const stockPorCatId={};
  stock.forEach(s=>{if(s.catalogoId)stockPorCatId[s.catalogoId]=s;});
  const combinadoDesp=[];
  (catalogo||[]).forEach(c=>{
    if(c.activo===false)return;
    const s=stockPorCatId[c.id];
    if(s)combinadoDesp.push({...s,catalogoId:c.id});
    else combinadoDesp.push({id:"sc_"+c.id,sinCargar:true,catalogoId:c.id,nombre:c.producto,proveedor:c.proveedor,sector:c.sector,unidad:c.unidad||"unidades",cantidad:0,minimo:0,movimientos:[]});
  });
  stock.forEach(s=>{if(!s.catalogoId||!catalogoIds.has(s.catalogoId))combinadoDesp.push(s);});
  const itemsOrdenados=combinadoDesp.sort((a,b)=>a.nombre.localeCompare(b.nombre));
  const itemSel=itemsOrdenados.find(s=>s.id===itemId);

  const registrar=async()=>{
    if(!itemId){toast("Elegí un producto del inventario");return;}
    if(!cantidad||Number(cantidad)<=0){toast("Ingresá la cantidad");return;}
    setBusy(true);
    const fechaISO=fechaLocalISO(fecha);
    const cant=Number(cantidad);
    const mov={id:uid(),tipo:"salida",origen:"desperdicio",cantidad:cant,obs:`${motivo}${obs.trim()?" — "+obs.trim():""}`,fecha:fechaISO,registradoPor:registradoPor||null};
    const existeFila=stock.some(s=>s.id===itemId);
    let stockActual,stockIdFinal;
    if(existeFila){
      stockActual=stock.map(s=>s.id===itemId?{...s,cantidad:Math.max(0,s.cantidad-cant),movimientos:[mov,...(s.movimientos||[])].slice(0,50)}:s);
      stockIdFinal=itemId;
    }else{
      // Producto del catálogo sin fila de stock todavía — se crea la fila (arranca en 0, clampeado) con este movimiento.
      const nuevaFila={id:uid(),catalogoId:itemSel.catalogoId,nombre:itemSel.nombre,proveedor:itemSel.proveedor,sector:itemSel.sector||"",cantidad:0,minimo:0,unidad:itemSel.unidad,movimientos:[mov],fecha:fechaISO};
      stockActual=[...stock,nuevaFila];
      stockIdFinal=nuevaFila.id;
    }
    await saveStock(stockActual);
    const registro={id:uid(),stockId:stockIdFinal,producto:itemSel.nombre,unidad:itemSel.unidad,proveedor:itemSel.proveedor,cantidad:cant,motivo,obs:obs.trim(),registradoPor:registradoPor||null,fecha:fechaISO};
    await saveDesperdicios([registro,...desperdicios]);
    toast(`✓ Desperdicio registrado: ${itemSel.nombre}`);
    setBusy(false);setItemId("");setCantidad("");setObs("");setMotivo("Vencido");setFecha(hoyLocal());
  };

  const eliminar=async id=>{
    if(!confirm("¿Eliminar este registro de desperdicio? (no repone el stock)"))return;
    await saveDesperdicios(desperdicios.filter(d=>d.id!==id));toast("Eliminado");
  };

  const hoyStr=hoyLocal();
  const desperdiciosHoy=desperdicios.filter(d=>d.fecha&&d.fecha.slice(0,10)===hoyStr);

  if(!itemsOrdenados.length)return(
    <Empty icon="🗑️">Todavía no hay productos en el catálogo. Agregalos primero desde 🗂️ Catálogo.</Empty>
  );

  return(<>
    <Card title="Registrar desperdicio">
      <p style={{fontSize:".78rem",color:"#7B7063",marginBottom:14}}>Descuenta del inventario y queda registrado el motivo, para saber cuánto se pierde.</p>
      <Field label="Producto">
        <select value={itemId} onChange={e=>setItemId(e.target.value)} style={sS}>
          <option value="">— Elegí un producto —</option>
          {itemsOrdenados.map(s=><option key={s.id} value={s.id}>{s.nombre} ({s.sinCargar?"sin cargar":`stock: ${s.cantidad} ${s.unidad}`})</option>)}
        </select>
      </Field>
      <Field label={`Cantidad${itemSel?` (${itemSel.unidad})`:""}`}>
        <Inp type="number" value={cantidad} onChange={setCantidad} placeholder="0"/>
      </Field>
      <Field label="Motivo">
        <select value={motivo} onChange={e=>setMotivo(e.target.value)} style={sS}>
          {MOTIVOS.map(m=><option key={m} value={m}>{m}</option>)}
        </select>
      </Field>
      <Field label="Observaciones (opcional)"><TA value={obs} onChange={setObs} placeholder="Ej: se venció ayer"/></Field>
      <Field label="Fecha"><Inp type="date" value={fecha} onChange={setFecha}/></Field>
      <Btn bg="#C0392B" onClick={registrar} disabled={busy}>{busy?"Guardando…":"Registrar desperdicio"}</Btn>
    </Card>

    {desperdiciosHoy.length>0&&(
      <div style={{background:"#FFF0EF",border:"1px solid #f5b7b1",borderRadius:12,padding:"12px 16px",marginBottom:16}}>
        <div style={{fontWeight:700,fontSize:".82rem",color:"#C0392B"}}>🗑️ {desperdiciosHoy.length} desperdicio{desperdiciosHoy.length!==1?"s":""} hoy</div>
      </div>
    )}

    {!desperdicios.length?<Empty icon="🗑️">Todavía no registraste desperdicios</Empty>:desperdicios.map(d=>(
      <div key={d.id} style={{background:"#fff",borderRadius:12,padding:16,marginBottom:10,boxShadow:"0 2px 10px rgba(44,26,14,.07)"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
          <div>
            <div style={{fontWeight:700,fontSize:".9rem"}}>{d.producto}</div>
            <div style={{fontSize:".7rem",color:"#7B7063"}}>{fmtFL(d.fecha)}{d.registradoPor?` · ${d.registradoPor}`:""}</div>
          </div>
          <div style={{textAlign:"right"}}>
            <div style={{fontFamily:"Georgia,serif",fontSize:"1.2rem",color:"#C0392B"}}>-{d.cantidad}</div>
            <div style={{fontSize:".68rem",color:"#7B7063"}}>{d.unidad}</div>
          </div>
        </div>
        <div style={{marginTop:8,fontSize:".78rem",color:"#2C1A0E"}}>{d.motivo}</div>
        {d.obs&&<div style={{marginTop:4,fontSize:".76rem",color:"#7B7063",fontStyle:"italic"}}>{d.obs}</div>}
        <div style={{display:"flex",gap:8,marginTop:12,flexWrap:"wrap"}}>
          <SmBtn color="#C0392B" onClick={()=>eliminar(d.id)}>Eliminar</SmBtn>
        </div>
      </div>
    ))}
  </>);
}

function TabDashboard({boletas,cierres,cierresCaja,pagos,sueldos,gastos,proveedores,calcDeuda,calcDigital,saldo,cajaDigitalSaldo,stock,setTab}){
  const hoy = new Date().toDateString();
  const now  = new Date();
  const esMes = iso => { const d=new Date(iso); return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear(); };
  const esSemana = iso => { const d=new Date(iso); const diff=(now-d)/(1000*60*60*24); return diff<=7; };

  // ── DÍA ──
  const cierresHoy    = cierresCaja.filter(c=>new Date(c.fecha).toDateString()===hoy);
  const pagosHoy      = pagos.filter(p=>new Date(p.fecha).toDateString()===hoy);
  const sueldosHoy    = sueldos.filter(s=>new Date(s.fecha).toDateString()===hoy);
  const gastosHoy     = gastos.filter(g=>new Date(g.fecha).toDateString()===hoy);
  const boletasHoy    = boletas.filter(b=>new Date(b.fecha).toDateString()===hoy);

  const ingresosHoy   = cierresHoy.reduce((s,c)=>s+Number(c.total||0),0);
  const digitalHoy    = cierresHoy.reduce((s,c)=>s+Number(c.totalDigital||0),0);
  const efectivoHoy   = cierresHoy.reduce((s,c)=>s+Number(c.efectivo||0),0);
  const pagosHoyTotal = pagosHoy.reduce((s,p)=>s+Number(p.monto||0),0);
  const sueldosHoyTot = sueldosHoy.filter(x=>x.forma!=="Retiro").reduce((s,x)=>s+Number(x.monto||0),0);
  const gastosHoyTot  = gastosHoy.reduce((s,g)=>s+Number(g.monto||0),0);
  const egresosDia    = pagosHoyTotal+sueldosHoyTot+gastosHoyTot;
  const netoDia       = ingresosHoy - egresosDia;

  // ── MES ──
  const ingMes   = cierresCaja.filter(c=>esMes(c.fecha)).reduce((s,c)=>s+Number(c.total||0),0);
  const pagosMes = pagos.filter(p=>esMes(p.fecha)).reduce((s,p)=>s+Number(p.monto||0),0);
  const sueMes   = sueldos.filter(s=>esMes(s.fecha)&&s.forma!=="Retiro").reduce((s,x)=>s+Number(x.monto||0),0);
  const gasMes   = gastos.filter(g=>esMes(g.fecha)).reduce((s,g)=>s+Number(g.monto||0),0);
  const egrMes   = pagosMes+sueMes+gasMes;
  const netoMes  = ingMes - egrMes;

  // ── ALERTAS ──
  const deudaTotal   = proveedores.reduce((s,p)=>{const d=calcDeuda(p.nombre);return s+Math.max(0,d?d.pendiente:0);},0);
  const topDeudores  = proveedores
    .map(p=>{const d=calcDeuda(p.nombre);return{nombre:p.nombre,pendiente:d?Math.max(0,d.pendiente):0};})
    .filter(p=>p.pendiente>0).sort((a,b)=>b.pendiente-a.pendiente).slice(0,3);
  const stockBajo    = stock.filter(s=>Number(s.minimo)>0&&Number(s.cantidad)<=Number(s.minimo));
  const difNeg7d     = cierresCaja.filter(c=>esSemana(c.fecha)&&Number(c.diferencia)<0);

  // ── ÚLTIMOS 7 DÍAS CIERRES ──
  const ultimos7 = [];
  for(let i=6;i>=0;i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    const ds = d.toDateString();
    const tot = cierresCaja.filter(c=>new Date(c.fecha).toDateString()===ds).reduce((s,c)=>s+Number(c.total||0),0);
    const dig = cierresCaja.filter(c=>new Date(c.fecha).toDateString()===ds).reduce((s,c)=>s+Number(c.totalDigital||0),0);
    const ef  = cierresCaja.filter(c=>new Date(c.fecha).toDateString()===ds).reduce((s,c)=>s+Number(c.efectivo||0),0);
    ultimos7.push({label:d.toLocaleDateString("es-AR",{weekday:"short",day:"numeric"}),tot,dig,ef});
  }
  const maxTot = Math.max(...ultimos7.map(d=>d.tot),1);

  const {saldoReal} = calcDigital();
  const totalConsolidado = saldo + saldoReal;

  // Cruce de movimientos digitales (desde siempre)
  const pagosTrDash   = (pagos||[]).filter(p=>p.forma==="Transferencia");
  const sueldosTrDash = (sueldos||[]).filter(s=>s.forma==="Transferencia");
  const gastosTrDash  = (gastos||[]).filter(g=>g.forma==="Transferencia");
  const totalIngresosGlobal=(cierresCaja||[]).reduce((s,c)=>s+Number(c.totalDigital||0),0);
  const totalEgresosGlobal=[...pagosTrDash,...sueldosTrDash,...gastosTrDash].reduce((s,m)=>s+Number(m.monto||0),0);
  const diferenciaGlobal=totalIngresosGlobal-totalEgresosGlobal;

  const PanelNum=({label,value,color,sub})=>(
    <div style={{flex:1,background:color||"#2C1A0E",borderRadius:12,padding:"14px 16px"}}>
      <div style={{fontSize:".62rem",color:"#E8DCC8",opacity:.7,textTransform:"uppercase",letterSpacing:".06em"}}>{label}</div>
      <div style={{fontFamily:"Georgia,serif",fontSize:"1.4rem",color:"#E8DCC8",margin:"4px 0 2px",lineHeight:1.1}}>{fmt(value)}</div>
      {sub&&<div style={{fontSize:".7rem",color:"#E8DCC8",opacity:.6}}>{sub}</div>}
    </div>
  );

  return(<>
    <ST>Dashboard</ST><SS>Panorama general del negocio.</SS>

    {/* DINERO DISPONIBLE */}
    <div style={{background:"#2C1A0E",borderRadius:14,padding:"20px",marginBottom:12}}>
      <div style={{fontSize:".65rem",letterSpacing:".08em",textTransform:"uppercase",color:"#E8DCC8",opacity:.7}}>Total consolidado disponible</div>
      <div style={{fontFamily:"Georgia,serif",fontSize:"2.8rem",color:"#E8DCC8",margin:"4px 0 6px"}}>{fmt(totalConsolidado)}</div>
      <div style={{display:"flex",gap:8}}>
        <PanelNum label="💵 Caja Disponible" value={saldo}/>
        <PanelNum label="💳 Banco" value={saldoReal} color="#1a3a2a"/>
      </div>
    </div>

    {/* CRUCE DE MOVIMIENTOS DIGITALES */}
    <div style={{background:"#fff",borderRadius:14,padding:18,marginBottom:12,boxShadow:"0 2px 12px rgba(44,26,14,.08)"}}>
      <div style={{fontSize:".68rem",fontWeight:700,letterSpacing:".09em",textTransform:"uppercase",color:"#7B7063",marginBottom:14}}>📊 Cruce de movimientos digitales (desde siempre)</div>
      <div style={{display:"flex",gap:8}}>
        <div style={{flex:1,background:"#EAF5F0",borderRadius:10,padding:"12px 14px"}}>
          <div style={{fontSize:".62rem",color:"#2D6A4F",fontWeight:700,textTransform:"uppercase",letterSpacing:".05em",marginBottom:4}}>📥 Ingresos digitales</div>
          <div style={{fontFamily:"Georgia,serif",fontSize:"1.3rem",color:"#2D6A4F"}}>{fmt(totalIngresosGlobal)}</div>
          <div style={{fontSize:".62rem",color:"#7B7063",marginTop:2}}>Suma de cierres de caja</div>
        </div>
        <div style={{flex:1,background:"#FFF0EF",borderRadius:10,padding:"12px 14px"}}>
          <div style={{fontSize:".62rem",color:"#C0392B",fontWeight:700,textTransform:"uppercase",letterSpacing:".05em",marginBottom:4}}>📤 Egresos transferencia</div>
          <div style={{fontFamily:"Georgia,serif",fontSize:"1.3rem",color:"#C0392B"}}>{fmt(totalEgresosGlobal)}</div>
          <div style={{fontSize:".62rem",color:"#7B7063",marginTop:2}}>Pagos + sueldos + gastos</div>
        </div>
      </div>
      <div style={{marginTop:10,padding:"10px 14px",background:diferenciaGlobal>=0?"#EAF5F0":"#FFF0EF",borderRadius:10,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <span style={{fontSize:".78rem",fontWeight:600,color:"#2C1A0E"}}>Diferencia neta</span>
        <span style={{fontFamily:"Georgia,serif",fontSize:"1.2rem",fontWeight:700,color:diferenciaGlobal>=0?"#2D6A4F":"#C0392B"}}>{diferenciaGlobal>=0?"+":""}{fmt(diferenciaGlobal)}</span>
      </div>
    </div>

    {/* ALERTAS */}
    {(stockBajo.length>0||difNeg7d.length>0)&&(
      <div style={{background:"#FFF0EF",border:"1px solid #f5b7b1",borderRadius:12,padding:"14px 16px",marginBottom:12}}>
        <div style={{fontWeight:700,fontSize:".82rem",color:"#C0392B",marginBottom:8}}>⚠️ Alertas</div>
        {stockBajo.length>0&&<div style={{fontSize:".78rem",color:"#C0392B",marginBottom:4}}>📦 Stock bajo: {stockBajo.map(s=>s.nombre).join(", ")}</div>}
        {difNeg7d.length>0&&<div style={{fontSize:".78rem",color:"#C0392B"}}>📉 {difNeg7d.length} cierre{difNeg7d.length!==1?"s":""} con diferencia negativa esta semana</div>}
      </div>
    )}

    {/* RESUMEN DÍA */}
    <div style={{background:"#fff",borderRadius:14,padding:"18px 20px",boxShadow:"0 2px 12px rgba(44,26,14,.08)",marginBottom:12}}>
      <div style={{fontSize:".68rem",fontWeight:700,letterSpacing:".09em",textTransform:"uppercase",color:"#7B7063",marginBottom:12}}>Hoy · {new Date().toLocaleDateString("es-AR",{weekday:"long",day:"numeric",month:"long"})}</div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:12}}>
        {[
          ["💵 Efectivo ingresado",fmt(efectivoHoy),"#2D6A4F"],
          ["💳 Digital ingresado",fmt(digitalHoy),"#B7860B"],
          ["🧾 Boletas recibidas",fmt(boletasHoy.reduce((s,b)=>s+Number(b.monto||0),0)),"#2C1A0E"],
          ["💸 Pagos a proveedores",fmt(pagosHoyTotal),"#C0392B"],
          ["👥 Sueldos",fmt(sueldosHoyTot),"#C0392B"],
          ["🏠 Pagos Digitales",fmt(gastosHoyTot),"#C0392B"],
        ].map(([l,v,c])=>(
          <div key={l} style={{background:"#F9F6F1",borderRadius:10,padding:"10px 12px"}}>
            <div style={{fontSize:".68rem",color:"#7B7063",marginBottom:2}}>{l}</div>
            <div style={{fontWeight:700,fontSize:".92rem",color:c}}>{v}</div>
          </div>
        ))}
      </div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 12px",background:netoDia>=0?"#EAF5F0":"#FFF0EF",borderRadius:10}}>
        <span style={{fontWeight:700,fontSize:".85rem",color:netoDia>=0?"#2D6A4F":"#C0392B"}}>Neto del día</span>
        <span style={{fontFamily:"Georgia,serif",fontSize:"1.3rem",fontWeight:700,color:netoDia>=0?"#2D6A4F":"#C0392B"}}>{netoDia>=0?"+":""}{fmt(netoDia)}</span>
      </div>
      {cierresHoy.length===0&&<div style={{fontSize:".75rem",color:"#7B7063",marginTop:8,textAlign:"center"}}>Sin cierres registrados hoy</div>}
    </div>

    {/* GRÁFICO 7 DÍAS */}
    <div style={{background:"#fff",borderRadius:14,padding:"18px 20px",boxShadow:"0 2px 12px rgba(44,26,14,.08)",marginBottom:12}}>
      <div style={{fontSize:".68rem",fontWeight:700,letterSpacing:".09em",textTransform:"uppercase",color:"#7B7063",marginBottom:14}}>Cierres · últimos 7 días</div>
      <div style={{display:"flex",alignItems:"flex-end",gap:6,height:100}}>
        {ultimos7.map((d,i)=>(
          <div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:3}}>
            <div style={{fontSize:".58rem",color:"#7B7063",whiteSpace:"nowrap"}}>{d.tot>0?fmt(d.tot).replace("$",""):""}</div>
            <div style={{width:"100%",display:"flex",flexDirection:"column",gap:1,justifyContent:"flex-end",height:72}}>
              {d.dig>0&&<div style={{width:"100%",height:Math.max(4,Math.round((d.dig/maxTot)*72*0.6))+"px",background:"#B7860B",borderRadius:"3px 3px 0 0"}}/>}
              {d.ef>0&&<div style={{width:"100%",height:Math.max(4,Math.round((d.ef/maxTot)*72*0.4))+"px",background:"#2D6A4F",borderRadius:d.dig>0?"0":"3px 3px 0 0"}}/>}
              {d.tot===0&&<div style={{width:"100%",height:4,background:"#E8DCC8",borderRadius:3}}/>}
            </div>
            <div style={{fontSize:".62rem",color:"#7B7063",whiteSpace:"nowrap"}}>{d.label}</div>
          </div>
        ))}
      </div>
      <div style={{display:"flex",gap:12,marginTop:8,justifyContent:"center"}}>
        <span style={{fontSize:".68rem",color:"#7B7063"}}><span style={{display:"inline-block",width:10,height:10,background:"#B7860B",borderRadius:2,marginRight:4}}/>Digital</span>
        <span style={{fontSize:".68rem",color:"#7B7063"}}><span style={{display:"inline-block",width:10,height:10,background:"#2D6A4F",borderRadius:2,marginRight:4}}/>Efectivo</span>
      </div>
    </div>

    {/* MES */}
    <div style={{background:"#fff",borderRadius:14,padding:"18px 20px",boxShadow:"0 2px 12px rgba(44,26,14,.08)",marginBottom:12}}>
      <div style={{fontSize:".68rem",fontWeight:700,letterSpacing:".09em",textTransform:"uppercase",color:"#7B7063",marginBottom:12}}>
        {now.toLocaleDateString("es-AR",{month:"long",year:"numeric"})}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:12}}>
        {[
          ["Total ingresos",fmt(ingMes),"#2D6A4F"],
          ["Pagos proveedores",fmt(pagosMes),"#C0392B"],
          ["Sueldos",fmt(sueMes),"#C0392B"],
          ["Pagos Digitales",fmt(gasMes),"#C0392B"],
        ].map(([l,v,c])=>(
          <div key={l} style={{background:"#F9F6F1",borderRadius:10,padding:"10px 12px"}}>
            <div style={{fontSize:".68rem",color:"#7B7063",marginBottom:2}}>{l}</div>
            <div style={{fontWeight:700,fontSize:".92rem",color:c}}>{v}</div>
          </div>
        ))}
      </div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 12px",background:netoMes>=0?"#EAF5F0":"#FFF0EF",borderRadius:10}}>
        <span style={{fontWeight:700,fontSize:".85rem",color:netoMes>=0?"#2D6A4F":"#C0392B"}}>Neto del mes</span>
        <span style={{fontFamily:"Georgia,serif",fontSize:"1.3rem",fontWeight:700,color:netoMes>=0?"#2D6A4F":"#C0392B"}}>{netoMes>=0?"+":""}{fmt(netoMes)}</span>
      </div>
    </div>

    {/* DEUDA TOTAL PROVEEDORES */}
    <div style={{background:"#fff",borderRadius:14,padding:"18px 20px",boxShadow:"0 2px 12px rgba(44,26,14,.08)",marginBottom:12}}>
      <div style={{fontSize:".68rem",fontWeight:700,letterSpacing:".09em",textTransform:"uppercase",color:"#7B7063",marginBottom:8}}>🏪 Deuda total a proveedores</div>
      <div style={{fontFamily:"Georgia,serif",fontSize:"2rem",color:"#C0392B",margin:"4px 0 2px"}}>{fmt(deudaTotal)}</div>
      <div style={{fontSize:".78rem",color:"#7B7063"}}>Suma de deuda pendiente con todos los proveedores</div>
    </div>

    {/* TOP DEUDORES */}
    {topDeudores.length>0&&(
      <div style={{background:"#fff",borderRadius:14,padding:"18px 20px",boxShadow:"0 2px 12px rgba(44,26,14,.08)",marginBottom:12}}>
        <div style={{fontSize:".68rem",fontWeight:700,letterSpacing:".09em",textTransform:"uppercase",color:"#7B7063",marginBottom:12}}>🏪 Top deuda proveedores</div>
        {topDeudores.map((p,i)=>(
          <div key={p.nombre} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 0",borderBottom:i<topDeudores.length-1?"1px solid #F9F6F1":"none"}}>
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              <div style={{width:24,height:24,borderRadius:"50%",background:"#2C1A0E",color:"#E8DCC8",display:"flex",alignItems:"center",justifyContent:"center",fontSize:".72rem",fontWeight:700}}>{i+1}</div>
              <span style={{fontSize:".88rem",fontWeight:600}}>{p.nombre}</span>
            </div>
            <span style={{fontWeight:700,color:"#C0392B",fontSize:".92rem"}}>{fmt(p.pendiente)}</span>
          </div>
        ))}
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 0 0",marginTop:4,borderTop:"2px solid #E8DCC8"}}>
          <span style={{fontSize:".8rem",color:"#7B7063",fontWeight:600}}>Total deuda</span>
          <span style={{fontFamily:"Georgia,serif",fontSize:"1.1rem",fontWeight:700,color:"#C0392B"}}>{fmt(deudaTotal)}</span>
        </div>
      </div>
    )}

    {/* ACCESOS RÁPIDOS */}
    <div style={{background:"#fff",borderRadius:14,padding:"18px 20px",boxShadow:"0 2px 12px rgba(44,26,14,.08)"}}>
      <div style={{fontSize:".68rem",fontWeight:700,letterSpacing:".09em",textTransform:"uppercase",color:"#7B7063",marginBottom:12}}>Accesos rápidos</div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
        {[
          ["💰 Nuevo cierre","cierres","#2C1A0E"],
          ["🧾 Nueva boleta","boletas","#C0392B"],
          ["💸 Registrar pago","pagos","#B7860B"],
          ["👥 Pagar sueldo","sueldos","#2D6A4F"],
        ].map(([l,id,bg])=>(
          <button key={id} onClick={()=>setTab(id)}
            style={{padding:"12px 8px",borderRadius:10,border:"none",background:bg,color:"#fff",fontWeight:600,fontSize:".8rem",cursor:"pointer",textAlign:"center"}}>
            {l}
          </button>
        ))}
      </div>
    </div>
  </>);
}



function TabCajaEfectivo({cierres,cierresCaja,cajaInicial,pagos,savePagos,sueldos,saveSueldos,gastos,saveGastos,ajustesCajaEfectivo,saveAjustesCajaEfectivo,saldo,proveedores,pagarConExcedente,empleados,saveEmpleados,liquidaciones}){
  const hoy=new Date();
  const iso=d=>d.toISOString().slice(0,10);
  const inicioMes=new Date(hoy.getFullYear(),hoy.getMonth(),1);
  const[filtroFecha,setFiltroFecha]=useState("todo");
  const[desde,setDesde]=useState("");
  const[hasta,setHasta]=useState("");
  const[filtroTipo,setFiltroTipo]=useState("todo");
  const[filtroDH,setFiltroDH]=useState("todos");
  const[buscar,setBuscar]=useState("");
  const[editItem,setEditItem]=useState(null);
  const[editForm,setEditForm]=useState({});
  const[confElim,setConfElim]=useState(null);
  const[retiroModal,setRetiroModal]=useState(false);
  const[retiroMonto,setRetiroMonto]=useState("");
  const[retiroObs,setRetiroObs]=useState("");
  const[retiroFecha,setRetiroFecha]=useState(hoyLocal());
  const[retiroEmp,setRetiroEmp]=useState("");
  const[retiroBusy,setRetiroBusy]=useState(false);
  const[verHistorialRetiro,setVerHistorialRetiro]=useState(false);

  // Contar caja: igual mecánica que "Actualizar saldo banco" en Caja Digital — escribís lo que contaste
  // físicamente y la app calcula sola la diferencia contra el sistema, en vez de tener que restarlo a mano.
  const[contarModal,setContarModal]=useState(false);
  const[contarReal,setContarReal]=useState("");
  const[contarMotivo,setContarMotivo]=useState("");
  const[contarFecha,setContarFecha]=useState(hoyLocal());
  const[contarBusy,setContarBusy]=useState(false);

  // Registrar pago (igual mecanismo que en Caja Digital): agrupa proveedor, sueldo o gasto, todo lo que se
  // pueda pagar acá, con forma de pago Efectivo por defecto ya que estamos parados en Caja Disponible.
  const[nuevoPagoModal,setNuevoPagoModal]=useState(false);
  const[tipoPago,setTipoPago]=useState("proveedor"); // "proveedor" | "sueldo" | "gasto"
  const[prov,setProv]=useState("");const[emp,setEmp]=useState("");
  const[montoPago,setMontoPago]=useState("");const[formaPago,setFormaPago]=useState("Efectivo");
  const[obsPago,setObsPago]=useState("");const[fechaPago,setFechaPago]=useState(hoyLocal());
  const[busyPago,setBusyPago]=useState(false);
  const[nuevoRegModal,setNuevoRegModal]=useState(false);
  const[nuevoRegNombre,setNuevoRegNombre]=useState("");
  const registradores=(empleados||[]).filter(e=>e.estado==="Activo");
  const[empSueldo,setEmpSueldo]=useState("");
  const[conceptoSueldo,setConceptoSueldo]=useState("Sueldo");
  const[hsExtrasSueldo,setHsExtrasSueldo]=useState("");
  const EMPS=(empleados||[]).filter(e=>e.estado!=="Inactivo"&&!e.excluirLiquidacion).slice().sort((a,b)=>a.nombre.localeCompare(b.nombre));
  const CATS_BASE_DIG=['Alquiler','Contadora','Abogada','Conciliaciones','Amex','Impuestos','Carta Documento','Disney','FUDO','Fumigador','Mantenimiento','Movistar','Rapiboy','Retiro para sueldos'];
  const[catsGasto,setCatsGasto]=useState(()=>{
    try{
      const s=localStorage.getItem("amapola_cats_gastos");
      const guardadas=s?JSON.parse(s):[];
      return Array.from(new Set([...CATS_BASE_DIG,...guardadas]));
    }catch{return CATS_BASE_DIG;}
  });
  const[catGasto,setCatGasto]=useState("");
  const[nuevaCatModal,setNuevaCatModal]=useState(false);
  const[nuevaCat,setNuevaCat]=useState("");
  const proveedoresActivos=(proveedores||[]).filter(p=>p.estado!=="Inactivo").slice().sort((a,b)=>a.nombre.localeCompare(b.nombre));

  const agregarRegistrador=async()=>{
    const nombre=nuevoRegNombre.trim();
    if(!nombre){toast("Ingresá un nombre");return;}
    if(registradores.some(r=>norm(r.nombre)===norm(nombre))){toast("Ya existe");setEmp(nombre);setNuevoRegNombre("");setNuevoRegModal(false);return;}
    const nuevo={id:uid(),nombre,apellido:"",dni:"",domicilio:"",telPropio:"",telContacto:"",estado:"Activo"};
    await saveEmpleados([...(empleados||[]),nuevo]);
    setEmp(nombre);setNuevoRegNombre("");setNuevoRegModal(false);
    toast("Agregado ✓");
  };

  const agregarCategoriaGasto=()=>{
    if(!nuevaCat.trim()){toast("Ingresá el nombre de la categoría");return;}
    if(catsGasto.includes(nuevaCat.trim())){toast("Ya existe esa categoría");return;}
    const nuevas=[...catsGasto,nuevaCat.trim()];
    setCatsGasto(nuevas);
    localStorage.setItem("amapola_cats_gastos",JSON.stringify(nuevas));
    setCatGasto(nuevaCat.trim());
    setNuevaCat("");setNuevaCatModal(false);
    toast("Categoría creada ✓");
  };

  const limpiarFormPago=()=>{
    setProv("");setEmp("");setEmpSueldo("");setConceptoSueldo("Sueldo");setHsExtrasSueldo("");
    setCatGasto("");
    setMontoPago("");setObsPago("");setFechaPago(hoyLocal());
  };

  const guardarPago=async()=>{
    // Igual mecanismo que "Antes bloqueaba" en Caja Digital: si supera lo disponible (acá, caja efectivo),
    // se permite igual con confirm de por medio en vez de bloquear directo.
    if(formaPago==="Efectivo"&&Number(montoPago)>Number(saldo||0)){
      if(!confirm(`⚠️ Esto supera la caja disponible (${fmt(saldo)}) — va a quedar en ${fmt(Number(saldo||0)-Number(montoPago))}. ¿Confirmás igual?`))return false;
    }

    if(tipoPago==="proveedor"){
      if(!prov.trim()||!emp.trim()||!montoPago){toast("Completá todos los campos");return false;}
      setBusyPago(true);
      const fechaISO=fechaLocalISO(fechaPago);
      const pagoBase={tipo:"pago",proveedor:prov.trim(),empleado:emp.trim(),monto:Number(montoPago),forma:formaPago,obs:obsPago.trim(),fecha:fechaISO};
      await pagarConExcedente(pagoBase,pagos,savePagos);
      setBusyPago(false);limpiarFormPago();
      toast("Pago registrado ✓");
      return true;
    }

    if(tipoPago==="sueldo"){
      if(!empSueldo||!montoPago){toast("Elegí un empleado e ingresá el monto");return false;}
      // Si el concepto es "Sueldo" y hay una liquidación confirmada de ese empleado+período, este pago
      // queda enlazado a ella (liquidacionId) — así la Nómina de Liquidación de sueldos sigue mostrando
      // "Pago parcial"/"Pagada" aunque el pago se registre acá y no desde el botón de Liquidación (que ya
      // no existe: el pago real se hace desde Caja Disponible, Caja Digital o Sueldos).
      let liquidacionId=null;
      if(conceptoSueldo==="Sueldo"){
        const per=(fechaPago||hoyLocal()).slice(0,7);
        const empMatch=(empleados||[]).find(e=>norm(e.nombre)===norm(empSueldo)||norm(e.nombre).startsWith(norm(empSueldo))||norm(empSueldo).startsWith(norm(e.nombre)));
        const liq=empMatch?(liquidaciones||[]).find(l=>l.empleadoId===empMatch.id&&l.periodo===per&&l.estado==="confirmada"):null;
        if(liq){
          liquidacionId=liq.id;
          const pagado=(sueldos||[]).filter(s=>s.liquidacionId===liq.id).reduce((s2,s)=>s2+Number(s.monto||0),0);
          if(pagado>0&&Math.round(pagado*100)>=Math.round(Number(liq.neto||0)*100)){
            if(!confirm("⚠️ "+empSueldo+" ya tiene la liquidación de "+per+" pagada por completo ("+fmt(pagado)+"). ¿Registrar este pago de todas formas?"))return false;
          }
        }
      }
      setBusyPago(true);
      const fechaISO=fechaLocalISO(fechaPago);
      await saveSueldos([...(sueldos||[]),{id:uid(),tipo:"sueldo",empleado:empSueldo,concepto:conceptoSueldo,hsExtras:conceptoSueldo==="HS Extras"?Number(hsExtrasSueldo)||0:null,monto:Number(montoPago),forma:formaPago,obs:obsPago.trim(),fecha:fechaISO,...(liquidacionId?{liquidacionId}:{})}]);
      setBusyPago(false);limpiarFormPago();
      toast(liquidacionId?"Sueldo registrado ✓ — vinculado a la liquidación del período":"Sueldo registrado ✓");
      return true;
    }

    // gasto (pago digital u otro)
    if(!catGasto||!montoPago){toast("Elegí una categoría e ingresá el monto");return false;}
    if(formaPago==="Retiro"){
      if(norm(catGasto)!==norm(RETIRO_GANANCIA_CAT)){toast("La forma \"Retiro\" solo está disponible para la categoría "+RETIRO_GANANCIA_CAT);return false;}
      if(Number(montoPago)>saldoRetiro){toast("⚠️ Supera el saldo de caja retiro para sueldos ("+fmt(saldoRetiro)+")");return false;}
    }
    setBusyPago(true);
    const fechaISO=fechaLocalISO(fechaPago);
    const registro={id:uid(),tipo:"gasto",categoria:catGasto,monto:Number(montoPago),forma:formaPago,obs:obsPago.trim(),fecha:fechaISO};
    await saveGastos([...(gastos||[]),registro]);
    setBusyPago(false);limpiarFormPago();
    toast(formaPago==="Retiro"?"Gasto registrado ✓ — pagado con la caja retiro para sueldos":"Pago registrado ✓");
    return true;
  };

  const pagosEf    = (pagos||[]).filter(p=>p.forma==="Efectivo").map(p=>({...p,_cat:"pago",  _label:p.proveedor,_signo:-1}));
  const sueldosEf  = (sueldos||[]).filter(s=>s.forma==="Efectivo").map(s=>({...s,_cat:"sueldo",_label:s.empleado+" · "+(s.concepto||"Sueldo"),_signo:-1}));
  const gastosEf   = (gastos||[]).filter(g=>g.forma==="Efectivo").map(g=>({...g,_cat:"gasto", _label:g.categoria,_signo:-1}));
  const cierresViejos = (cierres||[]).map(c=>({...c,_cat:"cierre",_label:"Cierre "+c.turno,_signo:1}));
  const cierresNuevos = (cierresCaja||[]).map(c=>({...c,_cat:"cierre",_label:"Cierre "+c.turno,monto:c.efectivo,_signo:1}));
  // Ajustes manuales de caja (Admin > Ajuste de caja disponible) — sin esto este "Saldo final del período"
  // no coincidía con el número real de Caja Disponible en cuanto había algún ajuste registrado.
  const ajustesEf = (ajustesCajaEfectivo||[]).map(a=>({...a,_cat:"ajuste",_label:"Ajuste de caja"+(a.motivo?" · "+a.motivo:""),_signo:Number(a.monto||0)>=0?1:-1,monto:Math.abs(Number(a.monto||0))}));

  const allMovs=[...pagosEf,...sueldosEf,...gastosEf,...cierresViejos,...cierresNuevos,...ajustesEf].sort((a,b)=>a.fecha.localeCompare(b.fecha));

  const desdeF = filtroFecha==="mes"?iso(inicioMes):filtroFecha==="hoy"?iso(hoy):filtroFecha==="custom"?desde:"";
  const hastaF = filtroFecha==="mes"?iso(hoy):filtroFecha==="hoy"?iso(hoy):filtroFecha==="custom"?hasta:"";

  const filtrados = allMovs
    .filter(m=>(!desdeF||m.fecha.slice(0,10)>=desdeF)&&(!hastaF||m.fecha.slice(0,10)<=hastaF))
    .filter(m=>filtroTipo==="todo"||m._cat===filtroTipo)
    .filter(m=>filtroDH==="todos"||(filtroDH==="debe"&&m._signo<0)||(filtroDH==="haber"&&m._signo>0))
    .filter(m=>!buscar||(m._label||"").toLowerCase().includes(buscar.toLowerCase())||fmtF(m.fecha).includes(buscar));

  let saldoAcum = Number(cajaInicial)||0;
  if(desdeF){
    allMovs.filter(m=>m.fecha.slice(0,10)<desdeF).forEach(m=>{
      saldoAcum += m._signo*Number(m.monto||0);
    });
  }
  const saldoBase=saldoAcum;
  const filtradosAsc=[...filtrados].sort((a,b)=>a.fecha.localeCompare(b.fecha));
  const filasAsc=filtradosAsc.map(m=>{
    saldoAcum += m._signo*Number(m.monto||0);
    return{...m,_saldo:saldoAcum};
  });
  const filas=[...filasAsc].reverse();

  // Los ajustes de caja no son ingresos ni egresos reales (no hubo una venta ni un pago) — son una
  // corrección del saldo contado. Se muestran aparte, no suman a Ingresos/Egresos ni aparecen en Debe/Haber.
  const totalIngresos=filtradosAsc.filter(m=>m._signo>0&&m._cat!=="ajuste").reduce((s,m)=>s+Number(m.monto||0),0);
  const totalEgresos =filtradosAsc.filter(m=>m._signo<0&&m._cat!=="ajuste").reduce((s,m)=>s+Number(m.monto||0),0);
  const totalAjustes =filtradosAsc.filter(m=>m._cat==="ajuste").reduce((s,m)=>s+m._signo*Number(m.monto||0),0);

  const iconoCat=c=>c==="cierre"?"💵":c==="pago"?"💸":c==="sueldo"?"👤":c==="ajuste"?"⚖️":"🏠";

  const abrirEditar=m=>{
    setEditItem(m);
    setEditForm({
      monto:String(m.monto),obs:m.obs||"",fecha:m.fecha.slice(0,10),
      ...(m._cat==="pago"?{proveedor:m.proveedor,empleado:m.empleado}:{}),
      ...(m._cat==="sueldo"?{empleado:m.empleado,concepto:m.concepto||"Sueldo"}:{}),
      ...(m._cat==="gasto"?{categoria:m.categoria}:{}),
    });
  };

  const guardar=async()=>{
    const nf=editForm.fecha?new Date(editForm.fecha+"T12:00:00").toISOString():editItem.fecha;
    if(editItem._cat==="pago")   await savePagos(pagos.map(p=>p.id===editItem.id?{...p,...editForm,monto:Number(editForm.monto),fecha:nf}:p));
    if(editItem._cat==="sueldo") await saveSueldos(sueldos.map(s=>s.id===editItem.id?{...s,...editForm,monto:Number(editForm.monto),fecha:nf}:s));
    if(editItem._cat==="gasto")  await saveGastos(gastos.map(g=>g.id===editItem.id?{...g,...editForm,monto:Number(editForm.monto),fecha:nf}:g));
    setEditItem(null);toast("Actualizado ✓");
  };

  const eliminar=async()=>{
    const m=confElim;setConfElim(null);
    if(m._cat==="pago")   await savePagos(pagos.filter(p=>p.id!==m.id));
    if(m._cat==="sueldo") await saveSueldos(sueldos.filter(s=>s.id!==m.id));
    if(m._cat==="gasto")  await saveGastos(gastos.filter(g=>g.id!==m.id));
    toast("Eliminado ✓ (los cierres se editan desde su sección)");
  };

  // Retiro de efectivo para pagar sueldos: se carga como Gasto (categoría "Retiro para sueldos", forma
  // Efectivo) — eso descuenta la Caja Disponible una sola vez. Después, cada sueldo pagado con esa plata
  // se registra en Sueldos con forma "Retiro" y NO vuelve a descontar caja (ya salió antes). Esta sección
  // muestra el historial completo de esa caja aparte (retiros + usos) y cuánto queda pendiente.
  const totalRetirado=(gastos||[]).filter(g=>g.forma==="Efectivo"&&(g.categoria||"").trim().toLowerCase()===RETIRO_SUELDOS_CAT.toLowerCase()).reduce((s,g)=>s+Number(g.monto||0),0);
  const totalUsadoDeRetiro=(sueldos||[]).filter(s=>s.forma==="Retiro").reduce((s2,s)=>s2+Number(s.monto||0),0)
    +(gastos||[]).filter(g=>g.forma==="Retiro"&&(g.categoria||"").trim().toLowerCase()===RETIRO_GANANCIA_CAT.toLowerCase()).reduce((s2,g)=>s2+Number(g.monto||0),0);
  const saldoRetiro=totalRetirado-totalUsadoDeRetiro;
  const retirosCreados=gastosEf.filter(g=>(g.categoria||"").trim().toLowerCase()===RETIRO_SUELDOS_CAT.toLowerCase()).map(g=>({...g,_tipoRetiro:"retiro"}));
  const retirosUsados=[
    ...(sueldos||[]).filter(s=>s.forma==="Retiro").map(s=>({...s,_cat:"sueldo",_label:s.empleado+" · "+(s.concepto||"Sueldo"),_tipoRetiro:"uso"})),
    ...(gastos||[]).filter(g=>g.forma==="Retiro"&&(g.categoria||"").trim().toLowerCase()===RETIRO_GANANCIA_CAT.toLowerCase()).map(g=>({...g,_cat:"gasto",_label:g.categoria,_tipoRetiro:"uso"})),
  ];
  const movsRetiroAsc=[...retirosCreados,...retirosUsados].sort((a,b)=>a.fecha.localeCompare(b.fecha));
  let _acumRetiro=0;
  const movsRetiro=movsRetiroAsc.map(m=>{
    _acumRetiro+=m._tipoRetiro==="retiro"?Number(m.monto||0):-Number(m.monto||0);
    return{...m,_saldoR:_acumRetiro};
  }).reverse();

  const guardarRetiro=async()=>{
    if(!retiroMonto){toast("Ingresá el monto retirado");return;}
    if(!retiroEmp.trim()){toast("Elegí quién retira");return;}
    if(Number(retiroMonto)>Number(saldo||0)){
      if(!confirm(`⚠️ Esto supera la caja disponible (${fmt(saldo)}) — va a quedar en ${fmt(Number(saldo||0)-Number(retiroMonto))}. ¿Confirmás igual?`))return;
    }
    setRetiroBusy(true);
    await saveGastos([...(gastos||[]),{id:uid(),tipo:"gasto",categoria:RETIRO_SUELDOS_CAT,monto:Number(retiroMonto),forma:"Efectivo",obs:retiroObs.trim(),registradoPor:retiroEmp.trim(),fecha:fechaLocalISO(retiroFecha)}]);
    setRetiroBusy(false);setRetiroModal(false);setRetiroMonto("");setRetiroObs("");setRetiroFecha(hoyLocal());setRetiroEmp("");
    toast("Retiro registrado ✓");
  };

  const confirmarConteo=async()=>{
    if(!contarReal){toast("Ingresá lo que contaste en la caja");return;}
    if(!saveAjustesCajaEfectivo){toast("No se puede guardar el ajuste desde acá");return;}
    setContarBusy(true);
    const real=Number(contarReal);
    const diferencia=real-Number(saldo||0);
    const nuevo={id:uid(),monto:diferencia,motivo:contarMotivo.trim()||"Conteo de caja",saldoAntes:Number(saldo||0),saldoDespues:real,fecha:fechaLocalISO(contarFecha)};
    await saveAjustesCajaEfectivo([nuevo,...(ajustesCajaEfectivo||[])]);
    setContarBusy(false);setContarModal(false);setContarReal("");setContarMotivo("");setContarFecha(hoyLocal());
    toast(diferencia===0?"Sin diferencia — caja OK ✓":"Ajuste registrado ✓ · "+(diferencia>0?"+":"")+fmt(diferencia));
  };

  if(verHistorialRetiro)return(<>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16,flexWrap:"wrap",gap:10}}>
      <p style={{fontFamily:"Georgia,serif",fontSize:"1.15rem"}}>💰 Historial · Caja retiro para sueldos</p>
      <button onClick={()=>setVerHistorialRetiro(false)} style={{padding:"9px 16px",border:"none",borderRadius:10,background:"#E8DCC8",color:"#2C1A0E",fontSize:".8rem",fontWeight:600,cursor:"pointer"}}>← Volver a Caja Disponible</button>
    </div>
    <div style={{background:"#FEF9E7",border:"1px solid #F5D98B",borderRadius:14,padding:"14px 20px",marginBottom:16}}>
      <div style={{fontSize:".65rem",letterSpacing:".08em",textTransform:"uppercase",color:"#B7860B"}}>Saldo pendiente de usar</div>
      <div style={{fontFamily:"Georgia,serif",fontSize:"1.4rem",color:"#7B5E00",margin:"4px 0 0"}}>{fmt(saldoRetiro)}</div>
      <div style={{fontSize:".68rem",color:"#B7860B",opacity:.85}}>Retirado en total: {fmt(totalRetirado)} · Ya usado: {fmt(totalUsadoDeRetiro)}</div>
    </div>
    {!movsRetiro.length?<Empty icon="💰">Todavía no hay movimientos</Empty>:(
      <div style={{overflowX:"auto"}}>
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:".75rem",minWidth:520}}>
          <thead>
            <tr style={{background:"#F9F6F1"}}>
              {["Fecha","Concepto","Debe","Haber","Saldo",""].map(h=>(
                <th key={h||"acc"} style={{padding:"7px 8px",textAlign:["Fecha","Concepto",""].includes(h)?"left":"right",fontWeight:700,color:"#7B7063",fontSize:".63rem",letterSpacing:".05em",textTransform:"uppercase",borderBottom:"2px solid #E8DCC8",whiteSpace:"nowrap"}}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {movsRetiro.map((m,i)=>(
              <tr key={m._cat+m.id} style={{background:i%2===0?"#fff":"#F9F6F1"}}>
                <td style={{padding:"6px 8px",whiteSpace:"nowrap",color:"#7B7063",fontSize:".72rem"}}>{fmtF(m.fecha)}<br/><span style={{fontSize:".62rem"}}>{fmtH(m.fecha)}</span></td>
                <td style={{padding:"6px 8px"}}>
                  <div style={{fontWeight:600,fontSize:".76rem",lineHeight:1.3}}>{m._tipoRetiro==="retiro"?"Retiro de caja"+(m.registradoPor?" · "+m.registradoPor:""):m._label}</div>
                  {m.obs&&<div style={{fontSize:".63rem",color:"#7B7063",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",maxWidth:160}}>{m.obs}</div>}
                </td>
                <td style={{padding:"6px 8px",textAlign:"right",color:"#C0392B",fontWeight:700,whiteSpace:"nowrap"}}>{m._tipoRetiro!=="retiro"?fmt(m.monto):"—"}</td>
                <td style={{padding:"6px 8px",textAlign:"right",color:"#2D6A4F",fontWeight:700,whiteSpace:"nowrap"}}>{m._tipoRetiro==="retiro"?fmt(m.monto):"—"}</td>
                <td style={{padding:"6px 8px",textAlign:"right",fontWeight:700,whiteSpace:"nowrap",color:m._saldoR>=0?"#2C1A0E":"#C0392B"}}>{fmt(m._saldoR)}</td>
                <td style={{padding:"6px 8px"}}>
                  <div style={{display:"flex",gap:4}}>
                    <button onClick={()=>abrirEditar(m)} style={{background:"#EAF5F0",border:"none",borderRadius:6,color:"#2D6A4F",fontSize:".6rem",fontWeight:600,cursor:"pointer",padding:"3px 6px"}}>✏️</button>
                    <button onClick={()=>setConfElim(m)} style={{background:"#FFF0EF",border:"none",borderRadius:6,color:"#E74C3C",fontSize:".6rem",fontWeight:600,cursor:"pointer",padding:"3px 6px"}}>✕</button>
                  </div>
                </td>
              </tr>
            ))}
            <tr style={{background:"#2C1A0E"}}>
              <td colSpan={2} style={{padding:"8px 10px",color:"#E8DCC8",fontWeight:700,fontSize:".76rem"}}>TOTALES</td>
              <td style={{padding:"8px",textAlign:"right",color:"#f5b7b1",fontWeight:700,whiteSpace:"nowrap"}}>{fmt(totalUsadoDeRetiro)}</td>
              <td style={{padding:"8px",textAlign:"right",color:"#a9dfbf",fontWeight:700,whiteSpace:"nowrap"}}>{fmt(totalRetirado)}</td>
              <td style={{padding:"8px",textAlign:"right",fontWeight:700,whiteSpace:"nowrap",color:saldoRetiro>=0?"#a9dfbf":"#f5b7b1"}}>{fmt(saldoRetiro)}</td>
              <td/>
            </tr>
          </tbody>
        </table>
      </div>
    )}
    {editItem&&(
      <div style={{position:"fixed",inset:0,background:"rgba(44,26,14,.65)",zIndex:500,display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
        <div style={{background:"#fff",borderRadius:"20px 20px 0 0",padding:"24px 20px 40px",width:"100%",maxWidth:460,maxHeight:"88dvh",overflowY:"auto"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
            <p style={{fontFamily:"Georgia,serif",fontSize:"1.1rem"}}>✏️ Editar {editItem._cat}</p>
            <button onClick={()=>setEditItem(null)} style={{background:"none",border:"none",fontSize:"1.4rem",cursor:"pointer",color:"#7B7063"}}>✕</button>
          </div>
          {editItem._cat==="pago"&&<div style={{marginBottom:10}}><label style={{display:"block",fontSize:".76rem",fontWeight:600,color:"#2C1A0E",marginBottom:4}}>Proveedor</label><input value={editForm.proveedor||""} onChange={e=>setEditForm(f=>({...f,proveedor:e.target.value}))} style={iS}/></div>}
          {editItem._cat==="sueldo"&&<div style={{marginBottom:10}}><label style={{display:"block",fontSize:".76rem",fontWeight:600,color:"#2C1A0E",marginBottom:4}}>Empleado</label><input value={editForm.empleado||""} onChange={e=>setEditForm(f=>({...f,empleado:e.target.value}))} style={iS}/></div>}
          {editItem._cat==="gasto"&&<div style={{marginBottom:10}}><label style={{display:"block",fontSize:".76rem",fontWeight:600,color:"#2C1A0E",marginBottom:4}}>Categoría</label><input value={editForm.categoria||""} onChange={e=>setEditForm(f=>({...f,categoria:e.target.value}))} style={iS}/></div>}
          {[["Monto ($)","monto","number"],["Observaciones","obs","text"]].map(([l,k,t])=>(
            <div key={k} style={{marginBottom:10}}>
              <label style={{display:"block",fontSize:".76rem",fontWeight:600,color:"#2C1A0E",marginBottom:4}}>{l}</label>
              <input type={t} value={editForm[k]||""} onChange={e=>setEditForm(f=>({...f,[k]:e.target.value}))} style={iS}/>
            </div>
          ))}
          <div style={{marginBottom:16}}>
            <label style={{display:"block",fontSize:".76rem",fontWeight:600,color:"#2C1A0E",marginBottom:4}}>Fecha</label>
            <input type="date" value={editForm.fecha||""} onChange={e=>setEditForm(f=>({...f,fecha:e.target.value}))} style={iS}/>
          </div>
          <div style={{display:"flex",gap:10}}>
            <button onClick={()=>setEditItem(null)} style={{flex:1,padding:12,borderRadius:10,border:"none",background:"#E8DCC8",fontWeight:600,cursor:"pointer"}}>Cancelar</button>
            <button onClick={guardar} style={{flex:1,padding:12,borderRadius:10,border:"none",background:"#2D6A4F",color:"#fff",fontWeight:600,cursor:"pointer"}}>Guardar</button>
          </div>
        </div>
      </div>
    )}
    {confElim&&(
      <div style={{position:"fixed",inset:0,background:"rgba(44,26,14,.65)",zIndex:500,display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
        <div style={{background:"#fff",borderRadius:"20px 20px 0 0",padding:"28px 20px 44px",width:"100%",maxWidth:460}}>
          <p style={{fontFamily:"Georgia,serif",fontSize:"1.1rem",marginBottom:8}}>⚠️ Eliminar</p>
          <p style={{fontSize:".85rem",color:"#7B7063",marginBottom:16}}>{confElim._label||(confElim._tipoRetiro==="retiro"?"Retiro de caja":"")} · {fmt(confElim.monto)} · {fmtF(confElim.fecha)}</p>
          <div style={{display:"flex",gap:10}}>
            <button onClick={()=>setConfElim(null)} style={{flex:1,padding:12,borderRadius:10,border:"none",background:"#E8DCC8",fontWeight:600,cursor:"pointer"}}>Cancelar</button>
            <button onClick={eliminar} style={{flex:1,padding:12,borderRadius:10,border:"none",background:"#C0392B",color:"#fff",fontWeight:600,cursor:"pointer"}}>Eliminar</button>
          </div>
        </div>
      </div>

  </>);

  return(<>
    <ST help={"Acá ves todos los ingresos y egresos en efectivo del negocio (cierres, pagos, sueldos, gastos y ajustes), sin límite de fecha.\n\n• Con + Registrar pago podés cargar, todo desde acá, cualquier cosa que se pague: un pago a Proveedor, un Sueldo o un Gasto — elegí el tipo arriba del formulario. Queda guardado exactamente igual que si lo cargaras en Pagos, Sueldos o Gastos. Por defecto la forma de pago es Efectivo (ya que estás en Caja Disponible), pero también podés elegir Transferencia, Amex o Retiro si hace falta — es el mismo botón que hay en Caja Digital, nada más que acá arranca en Efectivo. Si el monto supera lo que tenés disponible en caja, te avisa y te deja confirmar igual (la caja queda en negativo) — el mismo criterio se aplica ahora en Pagos y Sueldos, para que no cambie según por dónde cargues el pago.\n• Si el pago es tipo Sueldo con concepto 'Sueldo' y ese empleado tiene una liquidación confirmada de ese período en Liquidación de sueldos, el pago se enlaza solo a esa liquidación — así queda marcada como pagada ahí sin que tengas que ir a hacer nada aparte.\n• 🧮 Contar caja: cuando hacés un arqueo físico, escribí acá lo que contaste — la app calcula sola la diferencia contra el sistema y la deja guardada como ajuste (con motivo y fecha), sin que tengas que restarlo vos a mano. Es lo mismo que 'Actualizar saldo banco' en Caja Digital, pero para el efectivo.\n• La sección '💰 Caja retiro para sueldos' es aparte: mostrás cuánto sacaste de la Caja Disponible para juntar y pagar sueldos después, con el historial completo de cada retiro (y quién lo hizo) y cada sueldo (o gasto DIGITAL) pagado con esa plata — tocá 'Ver historial' para abrirlo en una pantalla aparte. Podés registrar un retiro nuevo desde acá o desde Pagos — es el mismo movimiento, y ahora pide quién retira.\n• Cada retiro se carga como Gasto (categoría 'Retiro para sueldos') y descuenta la Caja Disponible una sola vez. Después, cada sueldo pagado con esa plata se registra en Sueldos con forma 'Retiro' y no descuenta la caja de nuevo.\n• El gasto categoría 'DIGITAL' (retiros de ganancia) normalmente se paga por Transferencia, pero si esa vez la sacaste de la caja retiro para sueldos en vez de la Caja Digital, elegí forma 'Retiro' al cargarlo — no te deja cargar más de lo que realmente queda disponible en esa caja aparte."}>Caja Disponible</ST><SS>Todos los ingresos y egresos en efectivo, sin límite de fecha.</SS>

    <div style={{display:"flex",gap:12,marginBottom:16,flexWrap:"wrap",alignItems:"stretch"}}>
      <div style={{flex:"2 1 220px",background:"#2D6A4F",borderRadius:14,padding:"18px 20px"}}>
        <div style={{fontSize:".65rem",letterSpacing:".08em",textTransform:"uppercase",color:"#fff",opacity:.8}}>Caja Disponible Efectivo</div>
        <div style={{fontFamily:"Georgia,serif",fontSize:"2rem",color:"#fff",margin:"4px 0 0"}}>{fmt(saldoBase+totalIngresos-totalEgresos+totalAjustes)}</div>
      </div>

      <div style={{flex:"2 1 220px",background:"#FEF9E7",border:"1px solid #F5D98B",borderRadius:14,padding:"18px 20px"}}>
        <div style={{fontSize:".65rem",letterSpacing:".08em",textTransform:"uppercase",color:"#B7860B"}}>💰 Caja retiro para sueldos</div>
        <div style={{fontFamily:"Georgia,serif",fontSize:"1.4rem",color:"#7B5E00",margin:"4px 0 0"}}>{fmt(saldoRetiro)}</div>
        {totalRetirado>0&&<div style={{fontSize:".68rem",color:"#B7860B",opacity:.85,marginTop:2}}>Retirado en total: {fmt(totalRetirado)} · Ya usado: {fmt(totalUsadoDeRetiro)}</div>}
      </div>

      <button onClick={()=>setNuevoPagoModal(true)} style={{flex:"1 1 150px",padding:"10px 16px",border:"none",borderRadius:10,background:"#2D6A4F",color:"#fff",fontSize:".82rem",fontWeight:600,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",textAlign:"center"}}>+ Registrar pago</button>

      <button onClick={()=>setRetiroModal(true)} style={{flex:"1 1 150px",padding:"10px 16px",border:"none",borderRadius:10,background:"#8B5E3C",color:"#fff",fontSize:".82rem",fontWeight:600,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",textAlign:"center"}}>💰 Retirar p/ sueldos</button>

      <button onClick={()=>setContarModal(true)} style={{flex:"1 1 150px",padding:"10px 16px",border:"1px solid #E8DCC8",borderRadius:10,background:"#fff",color:"#2C1A0E",fontSize:".82rem",fontWeight:600,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",textAlign:"center"}}>🧮 Contar caja</button>
    </div>

    {contarModal&&(
      <div style={{position:"fixed",inset:0,background:"rgba(44,26,14,.65)",zIndex:500,display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
        <div style={{background:"#fff",borderRadius:"20px 20px 0 0",padding:"24px 20px 40px",width:"100%",maxWidth:460,maxHeight:"92dvh",overflowY:"auto"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
            <p style={{fontFamily:"Georgia,serif",fontSize:"1.1rem"}}>🧮 Contar caja</p>
            <button onClick={()=>setContarModal(false)} style={{background:"none",border:"none",fontSize:"1.3rem",color:"#7B7063",cursor:"pointer",padding:4,lineHeight:1}}>✕</button>
          </div>
          <p style={{fontSize:".78rem",color:"#7B7063",marginBottom:16}}>Contá el efectivo real de la caja y escribí el total acá — la app calcula sola la diferencia contra el sistema ({fmt(saldo)}) y la deja registrada como ajuste, con motivo y fecha.</p>
          <Field label="Lo que contaste en la caja ($)"><Inp type="number" value={contarReal} onChange={setContarReal} placeholder="0"/></Field>
          {contarReal&&Number(contarReal)!==Number(saldo||0)&&(
            <p style={{fontSize:".82rem",fontWeight:700,color:Number(contarReal)-Number(saldo||0)>=0?"#2D6A4F":"#C0392B",marginTop:-6,marginBottom:10}}>
              Diferencia: {Number(contarReal)-Number(saldo||0)>=0?"+":""}{fmt(Number(contarReal)-Number(saldo||0))}
            </p>
          )}
          <Field label="Motivo (opcional)"><Inp value={contarMotivo} onChange={setContarMotivo} placeholder="Ej: arqueo de fin de semana"/></Field>
          <Field label="Fecha del conteo"><Inp type="date" value={contarFecha} onChange={setContarFecha}/></Field>
          <Btn bg="#2C1A0E" onClick={confirmarConteo} disabled={contarBusy}>{contarBusy?"Guardando…":"Confirmar conteo"}</Btn>
        </div>
      </div>
    )}

    {movsRetiro.length>0&&(
      <button onClick={()=>setVerHistorialRetiro(true)} style={{marginBottom:16,padding:"8px 12px",border:"1px solid #F5D98B",borderRadius:10,background:"#FEF9E7",color:"#B7860B",fontSize:".76rem",fontWeight:600,cursor:"pointer",width:"100%",textAlign:"left",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <span>Ver historial de caja retiro ({movsRetiro.length} movimiento{movsRetiro.length!==1?"s":""})</span><span>→</span>
      </button>
    )}

    {nuevoPagoModal&&(
      <div style={{position:"fixed",inset:0,background:"rgba(44,26,14,.65)",zIndex:500,display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
        <div style={{background:"#fff",borderRadius:"20px 20px 0 0",padding:"24px 20px 40px",width:"100%",maxWidth:460,maxHeight:"92dvh",overflowY:"auto"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
            <p style={{fontFamily:"Georgia,serif",fontSize:"1.1rem"}}>Nuevo pago</p>
            <button onClick={()=>setNuevoPagoModal(false)} style={{background:"none",border:"none",fontSize:"1.3rem",color:"#7B7063",cursor:"pointer",padding:4,lineHeight:1}}>✕</button>
          </div>

          {nuevaCatModal&&(
            <div style={{position:"fixed",inset:0,background:"rgba(44,26,14,.65)",zIndex:600,display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
              <div style={{background:"#fff",borderRadius:"20px 20px 0 0",padding:"28px 20px 44px",width:"100%",maxWidth:460}}>
                <p style={{fontFamily:"Georgia,serif",fontSize:"1.1rem",marginBottom:16}}>Nueva categoría</p>
                <input value={nuevaCat} onChange={e=>setNuevaCat(e.target.value)} placeholder="Ej: Seguro, Contador, ..."
                  autoFocus onKeyDown={e=>e.key==="Enter"&&agregarCategoriaGasto()}
                  style={{...iS,marginBottom:16}}/>
                <div style={{display:"flex",gap:10}}>
                  <button onClick={()=>{setNuevaCatModal(false);setNuevaCat("");}} style={{flex:1,padding:12,borderRadius:10,border:"none",background:"#E8DCC8",fontWeight:600,cursor:"pointer"}}>Cancelar</button>
                  <button onClick={agregarCategoriaGasto} style={{flex:1,padding:12,borderRadius:10,border:"none",background:"#2D6A4F",color:"#fff",fontWeight:600,cursor:"pointer"}}>Crear</button>
                </div>
              </div>
            </div>
          )}

          {/* TIPO DE PAGO */}
          <div style={{display:"flex",gap:6,marginBottom:14}}>
            {[["proveedor","Proveedor"],["sueldo","Sueldo"],["gasto","Gasto"]].map(([v,l])=>(
              <button key={v} onClick={()=>{setTipoPago(v);limpiarFormPago();}} style={{flex:1,padding:"8px 6px",borderRadius:10,border:"1px solid "+(tipoPago===v?"#2C1A0E":"#E8DCC8"),background:tipoPago===v?"#2C1A0E":"#fff",color:tipoPago===v?"#fff":"#7B7063",fontSize:".76rem",fontWeight:600,cursor:"pointer"}}>{l}</button>
            ))}
          </div>

          {tipoPago==="proveedor"&&(<>
            <Field label="Proveedor">
              <select value={prov} onChange={e=>setProv(e.target.value)} style={sS}>
                <option value="">— Elegí un proveedor —</option>
                {proveedoresActivos.map(p=><option key={p.id} value={p.nombre}>{p.nombre}</option>)}
              </select>
            </Field>
            <Field label="Registrado por">
              <div style={{display:"flex",gap:8}}>
                <select value={emp} onChange={e=>setEmp(e.target.value)} style={{...sS,flex:1}}>
                  <option value="">— Elegí —</option>
                  {registradores.map(r=><option key={r.id} value={r.nombre}>{r.nombre}</option>)}
                </select>
                <button onClick={()=>setNuevoRegModal(true)} title="Agregar persona" style={{padding:"10px 14px",border:"1.5px solid #E8DCC8",borderRadius:8,background:"#F9F6F1",fontSize:"1.1rem",cursor:"pointer",flexShrink:0}}>+</button>
              </div>
            </Field>
          </>)}

          {tipoPago==="sueldo"&&(<>
            <Field label="Empleado">
              <select value={empSueldo} onChange={e=>setEmpSueldo(e.target.value)} style={sS}>
                <option value="">— Elegí un empleado —</option>
                {EMPS.map(e=><option key={e.id} value={e.nombre}>{e.nombre}</option>)}
              </select>
            </Field>
            <Field label="Concepto">
              <select value={conceptoSueldo} onChange={e=>{setConceptoSueldo(e.target.value);setHsExtrasSueldo("");}} style={sS}>
                {["Sueldo","Adelanto","Aguinaldo","Plus","Feriado","HS Extras"].map(c=><option key={c}>{c}</option>)}
              </select>
            </Field>
            {conceptoSueldo==="HS Extras"&&(
              <Field label="Cantidad de horas extras">
                <Inp type="number" value={hsExtrasSueldo} onChange={setHsExtrasSueldo} placeholder="Ej: 4"/>
              </Field>
            )}
          </>)}

          {tipoPago==="gasto"&&(
            <Field label="Categoría">
              <div style={{display:"flex",gap:8}}>
                <select value={catGasto} onChange={e=>setCatGasto(e.target.value)} style={{...sS,flex:1}}>
                  <option value="">— Elegí una categoría —</option>
                  {catsGasto.map(c=><option key={c} value={c}>{c}</option>)}
                </select>
                <button onClick={()=>setNuevaCatModal(true)} title="Nueva categoría"
                  style={{padding:"10px 14px",border:"1.5px solid #E8DCC8",borderRadius:8,background:"#F9F6F1",fontSize:"1.1rem",cursor:"pointer",flexShrink:0}}>+</button>
              </div>
            </Field>
          )}

          <Field label="Monto ($)"><Inp type="number" value={montoPago} onChange={setMontoPago} placeholder="0"/></Field>
          <Field label="Forma de pago">
            <select value={formaPago} onChange={e=>setFormaPago(e.target.value)} style={sS}>
              <option value="Efectivo">Efectivo (descuenta de caja)</option>
              <option value="Transferencia">Transferencia (descuenta disponible digital)</option>
              {(tipoPago==="proveedor"||tipoPago==="gasto")&&<option value="Amex">Amex</option>}
              {(tipoPago==="sueldo"||(tipoPago==="gasto"&&norm(catGasto)===norm(RETIRO_GANANCIA_CAT)))&&<option value="Retiro">Retiro (ya lo tenía en mano, no descuenta caja)</option>}
            </select>
          </Field>
          {formaPago==="Efectivo"&&<div style={{fontSize:".78rem",color:"#2D6A4F",background:"#EAF5F0",borderRadius:8,padding:"8px 10px",marginTop:8}}>💵 Este pago descontará de la caja disponible.</div>}
          {formaPago==="Transferencia"&&<div style={{fontSize:".78rem",color:"#B7860B",background:"#FEF9E7",borderRadius:8,padding:"8px 10px",marginTop:8}}>🏦 Este pago descontará del disponible digital, no de esta caja.</div>}
          {formaPago==="Amex"&&<div style={{fontSize:".78rem",color:"#B7860B",background:"#FEF9E7",borderRadius:8,padding:"8px 10px",marginTop:8}}>💳 No descuenta caja ni banco — queda cargado al resumen de la tarjeta.</div>}
          {formaPago==="Retiro"&&<div style={{fontSize:".78rem",color:"#B7860B",background:"#FEF9E7",borderRadius:8,padding:"8px 10px",marginTop:8}}>💰 No descuenta caja ni banco — se paga con efectivo ya retirado antes (cargado como Gasto "Retiro para sueldos"). Disponible en caja retiro: <strong>{fmt(saldoRetiro)}</strong></div>}
          <Field label="Observaciones"><TA value={obsPago} onChange={setObsPago} placeholder="Ej: pago parcial, boleta #..."/></Field>
          <Field label="Fecha del registro"><Inp type="date" value={fechaPago} onChange={setFechaPago}/></Field>

          <Btn bg="#2D6A4F" onClick={async()=>{if(await guardarPago())setNuevoPagoModal(false);}} disabled={busyPago}>{busyPago?"Guardando…":"Registrar pago"}</Btn>
        </div>
      </div>
    )}

    {nuevoRegModal&&(
      <div style={{position:"fixed",inset:0,background:"rgba(44,26,14,.65)",zIndex:600,display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
        <div style={{background:"#fff",borderRadius:"20px 20px 0 0",padding:"28px 20px 44px",width:"100%",maxWidth:460}}>
          <p style={{fontFamily:"Georgia,serif",fontSize:"1.1rem",marginBottom:16}}>Nueva persona</p>
          <input value={nuevoRegNombre} onChange={e=>setNuevoRegNombre(e.target.value)} placeholder="Nombre" autoFocus onKeyDown={e=>e.key==="Enter"&&agregarRegistrador()} style={{...iS,marginBottom:16}}/>
          <div style={{display:"flex",gap:10}}>
            <button onClick={()=>{setNuevoRegModal(false);setNuevoRegNombre("");}} style={{flex:1,padding:12,borderRadius:10,border:"none",background:"#E8DCC8",fontWeight:600,cursor:"pointer"}}>Cancelar</button>
            <button onClick={agregarRegistrador} style={{flex:1,padding:12,borderRadius:10,border:"none",background:"#2C1A0E",color:"#fff",fontWeight:600,cursor:"pointer"}}>Agregar</button>
          </div>
        </div>
      </div>
    )}

    {retiroModal&&(
      <div style={{position:"fixed",inset:0,background:"rgba(44,26,14,.65)",zIndex:500,display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
        <div style={{background:"#fff",borderRadius:"20px 20px 0 0",padding:"24px 20px 40px",width:"100%",maxWidth:460,maxHeight:"92dvh",overflowY:"auto"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
            <p style={{fontFamily:"Georgia,serif",fontSize:"1.1rem"}}>💰 Retirar efectivo para sueldos</p>
            <button onClick={()=>setRetiroModal(false)} style={{background:"none",border:"none",fontSize:"1.3rem",color:"#7B7063",cursor:"pointer",padding:4,lineHeight:1}}>✕</button>
          </div>
          <p style={{fontSize:".78rem",color:"#7B7063",marginBottom:16}}>Esto descuenta la caja disponible una sola vez (queda cargado como Gasto, categoría "Retiro para sueldos"). Después, cada sueldo que pagues con esta plata registralo en Sueldos con forma "Retiro" — así no se descuenta de nuevo.</p>
          <Field label="Monto retirado ($)"><Inp type="number" value={retiroMonto} onChange={setRetiroMonto} placeholder="0" min="0"/></Field>
          <Field label="Quién retira">
            <select value={retiroEmp} onChange={e=>setRetiroEmp(e.target.value)} style={sS}>
              <option value="">— Elegí —</option>
              {registradores.map(r=><option key={r.id} value={r.nombre}>{r.nombre}</option>)}
            </select>
          </Field>
          <Field label="Observaciones"><TA value={retiroObs} onChange={setRetiroObs} placeholder="Ej: para pagar sueldos de la semana..."/></Field>
          <Field label="Fecha"><Inp type="date" value={retiroFecha} onChange={setRetiroFecha}/></Field>
          <div style={{display:"flex",gap:10,marginTop:18}}>
            <button onClick={()=>setRetiroModal(false)} style={{flex:1,padding:12,borderRadius:10,border:"none",background:"#E8DCC8",fontWeight:600,cursor:"pointer"}}>Cancelar</button>
            <button onClick={guardarRetiro} disabled={retiroBusy} style={{flex:1,padding:12,borderRadius:10,border:"none",background:"#8B5E3C",color:"#fff",fontWeight:600,cursor:"pointer"}}>{retiroBusy?"Guardando…":"Confirmar retiro"}</button>
          </div>
        </div>
      </div>
    )}

    <div style={{display:"flex",gap:6,marginBottom:10}}>

    {/* FILTRO DEBE / HABER */}

          background:filtroDH===v?(v==="debe"?"#C0392B":v==="haber"?"#2D6A4F":"#2C1A0E"):"#E8DCC8",
          color:filtroDH===v?"#fff":"#2C1A0E"}}>{l}</button>

    </div>

    <input value={buscar} onChange={e=>setBuscar(e.target.value)} placeholder="🔍 Buscar..." style={{...iS,marginBottom:14,fontSize:".82rem"}}/>

    {!filas.length?<Empty icon="📒">Sin movimientos en el período</Empty>:(
      <div style={{overflowX:"auto"}}>
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:".75rem",minWidth:420}}>
          <thead>
            <tr style={{background:"#F9F6F1"}}>
              {["Fecha","Concepto","Debe","Haber","Saldo",""].map(h=>(
                <th key={h} style={{padding:"7px 8px",textAlign:["Fecha","Concepto",""].includes(h)?"left":"right",fontWeight:700,color:"#7B7063",fontSize:".63rem",letterSpacing:".05em",textTransform:"uppercase",borderBottom:"2px solid #E8DCC8",whiteSpace:"nowrap"}}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {filas.map((m,i)=>(
              <tr key={m.id+i} style={{background:i%2===0?"#fff":"#F9F6F1"}}>
                <td style={{padding:"6px 8px",whiteSpace:"nowrap",color:"#7B7063",fontSize:".72rem"}}>{fmtF(m.fecha)}<br/><span style={{fontSize:".62rem"}}>{fmtH(m.fecha)}</span></td>
                <td style={{padding:"6px 8px"}}>
                  <div style={{display:"flex",alignItems:"center",gap:5}}>
                    <span style={{flexShrink:0}}>{iconoCat(m._cat)}</span>
                    <div style={{minWidth:0}}>
                      <div style={{fontWeight:600,fontSize:".76rem",lineHeight:1.3}}>{m._label}</div>
                      {m._cat==="ajuste"?(
                        <div style={{fontSize:".63rem",color:m._signo>0?"#2D6A4F":"#C0392B",fontWeight:700}}>{m._signo>0?"+":"-"}{fmt(m.monto)} · corrección de saldo</div>
                      ):(m.obs&&<div style={{fontSize:".63rem",color:"#7B7063",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",maxWidth:100}}>{m.obs}</div>)}
                    </div>
