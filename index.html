              </div>
              <div style={{display:"flex",gap:8}}>
                <SmBtn onClick={()=>editar(p)}>Editar</SmBtn>
                <SmBtn color="#C0392B" onClick={()=>eliminar(p.id)}>Eliminar</SmBtn>
              </div>
            </div>
          ))}
        </Card>
      )}
    </>)}

    {seccion==="pagosadmin"&&(
      <Card title="Editar pagos a proveedores">
        <PagosAdmin pagos={pagos} savePagos={savePagos} proveedores={proveedores}/>
      </Card>
    )}

    {seccion==="sueldosadmin"&&(
      <Card title="Editar sueldos">
        <SueldosAdmin sueldos={sueldos} saveSueldos={saveSueldos}/>
      </Card>
    )}

    {seccion==="cierresadmin"&&(
      <Card title="Gestión de cierres de caja">
        <p style={{fontSize:".8rem",color:"#7B7063",marginBottom:12}}>Eliminá registros incorrectos. Los cierres afectan la caja disponible.</p>
        <CierresAdmin cierresCaja={cierresCaja} saveCierresCaja={saveCierresCaja}/>
      </Card>
    )}

    {seccion==="boletas"&&<AdminBoletas boletas={boletas} saveBoletas={saveBoletas}/>}

    {seccion==="ajustecaja"&&<AjusteCajaEfectivo saldo={saldo} ajustes={ajustesCajaEfectivo} saveAjustes={saveAjustesCajaEfectivo}/>}
  </>);
}

function AjusteCajaEfectivo({saldo,ajustes,saveAjustes}){
  const[monto,setMonto]=useState("");
  const[motivo,setMotivo]=useState("");
  const[busy,setBusy]=useState(false);

  const guardar=async()=>{
    const v=Number(monto);
    if(!monto||isNaN(v)||v===0){toast("Ingresá un monto distinto de cero");return;}
    if(!motivo.trim()){toast("Ingresá el motivo del ajuste");return;}
    setBusy(true);
    const nuevo={id:uid(),monto:v,motivo:motivo.trim(),saldoAntes:saldo,saldoDespues:saldo+v,fecha:new Date().toISOString()};
    await saveAjustes([nuevo,...(ajustes||[])]);
    toast("Ajuste registrado ✓");
    setBusy(false);setMonto("");setMotivo("");
  };

  const eliminar=async id=>{
    if(!confirm("¿Eliminar este ajuste? El saldo de caja se recalculará."))return;
    await saveAjustes((ajustes||[]).filter(a=>a.id!==id));toast("Eliminado");
  };

  return(
    <Card title="Ajuste de caja disponible">
      <p style={{fontSize:".78rem",color:"#7B7063",marginBottom:14}}>Usá esto cuando el efectivo real difiere del sistema. Un monto positivo suma al saldo, uno negativo resta. Queda registrado con motivo y fecha.</p>
      <Field label="Monto del ajuste ($) — positivo suma, negativo resta">
        <Inp type="number" value={monto} onChange={setMonto} placeholder="Ej: 10000 o -10000"/>
      </Field>
      <Field label="Motivo (obligatorio)">
        <Inp value={motivo} onChange={setMotivo} placeholder="Ej: diferencia de conteo 07/07"/>
      </Field>
      <Btn onClick={guardar} disabled={busy}>{busy?"Guardando…":"Registrar ajuste"}</Btn>

      {ajustes&&ajustes.length>0&&(
        <div style={{marginTop:20}}>
          <div style={{fontSize:".72rem",fontWeight:700,letterSpacing:".07em",textTransform:"uppercase",color:"#7B7063",marginBottom:10}}>Historial de ajustes</div>
          {ajustes.map(a=>(
            <div key={a.id} style={{borderBottom:"1px solid #F2EAE0",padding:"10px 0",display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10}}>
              <div>
                <div style={{fontSize:".78rem",color:"#7B7063"}}>{fmtFL(a.fecha)}</div>
                <div style={{fontSize:".82rem",color:"#2C1A0E",margin:"2px 0",fontStyle:"italic"}}>{a.motivo}</div>
                <div style={{fontSize:".72rem",color:"#7B7063"}}>{fmt(a.saldoAntes)} → {fmt(a.saldoDespues)}</div>
              </div>
              <div style={{display:"flex",alignItems:"center",gap:10,flexShrink:0}}>
                <span style={{fontFamily:"Georgia,serif",fontSize:"1.1rem",color:Number(a.monto)>=0?"#2D6A4F":"#C0392B",fontWeight:700}}>{Number(a.monto)>=0?"+":""}{fmt(Math.abs(a.monto))}</span>
                <button onClick={()=>eliminar(a.id)} style={{background:"none",border:"none",color:"#C0392B",fontSize:".72rem",fontWeight:600,cursor:"pointer"}}>Eliminar</button>
              </div>
            </div>
          ))}
        </div>
      )}
    </Card>
  );
}

const CAMPOS_HABER=[
  ["sueldoBasico","Sueldo básico"],
  ["plusVacacional","Plus vacacional"],
  ["plusSac","Plus SAC"],
];
const CAMPOS_DESCUENTO=[
  ["adelantos","Adelantos"],
  ["consumos","Consumos"],
];
function reciboHTML(reg,emp){
  const[y,m]=reg.periodo.split("-");
  const mesTxt=new Date(Number(y),Number(m)-1,1).toLocaleDateString("es-AR",{month:"long",year:"numeric"});
  const fila=(label,val)=>Number(val)?("<tr><td>"+label+"</td><td style=\"text-align:right\">"+fmt(val)+"</td></tr>"):"";
  return "<!DOCTYPE html><html lang=\"es\"><head><meta charset=\"UTF-8\"><title>Recibo — "+emp.nombre+" "+(emp.apellido||"")+"</title>"
    +"<style>body{font-family:Georgia,serif;color:#2C1A0E;padding:36px;max-width:560px;margin:0 auto;}"
    +"h1{font-size:1.3rem;margin:0 0 2px;}.sub{font-size:.8rem;color:#7B7063;margin-bottom:20px;}"
    +"table{width:100%;border-collapse:collapse;margin-bottom:14px;}"
    +"td{padding:5px 0;font-size:.9rem;border-bottom:1px solid #eee;}"
    +".tot{font-weight:700;border-top:2px solid #2C1A0E;border-bottom:none!important;padding-top:8px;}"
    +".neto{font-size:1.4rem;font-weight:700;text-align:right;margin-top:10px;}"
    +".badge{display:inline-block;background:#F2EAE0;padding:3px 10px;border-radius:20px;font-size:.7rem;letter-spacing:.05em;text-transform:uppercase;margin-bottom:16px;}"
    +".foot{font-size:.68rem;color:#999;margin-top:30px;border-top:1px solid #eee;padding-top:10px;}"
    +"@media print{.noprint{display:none;}}</style></head><body>"
    +"<h1>Amapola Resto</h1><div class=\"sub\">Recibo de sueldo — uso interno (no reemplaza el recibo legal)</div>"
    +"<div class=\"badge\">"+mesTxt+"</div>"
    +"<p><strong>"+emp.nombre+" "+(emp.apellido||"")+"</strong>"+(emp.dni?(" · DNI "+emp.dni):"")+"</p>"
    +"<table>"
    +fila("Sueldo básico",reg.sueldoBasico)+fila("Horas extras",reg.hsExtras)+fila("Bono",reg.bono)
    +fila("Feriados",reg.feriados)+fila("Plus vacacional",reg.plusVacacional)+fila("Plus SAC",reg.plusSac)
    +"<tr><td class=\"tot\">Subtotal</td><td class=\"tot\" style=\"text-align:right\">"+fmt(reg.subtotal)+"</td></tr></table>"
    +"<table>"
    +fila("Ausencias",reg.ausencias)+fila("Penalidad",reg.penalidad)+fila("Adelantos",reg.adelantos)+fila("Consumos",reg.consumos)
    +"<tr><td class=\"tot\">Total descuentos</td><td class=\"tot\" style=\"text-align:right\">-"+fmt(reg.totalDescuentos)+"</td></tr></table>"
    +"<div class=\"neto\">NETO A COBRAR: "+fmt(reg.neto)+"</div>"
    +(reg.obs?("<p style=\"font-size:.8rem;color:#7B7063;margin-top:16px;\">"+reg.obs+"</p>"):"")
    +"<div class=\"foot\">Emitido el "+new Date().toLocaleDateString("es-AR")+" · Amapola Interno</div>"
    +"<button class=\"noprint\" onclick=\"window.print()\" style=\"margin-top:20px;padding:10px 20px;border:none;border-radius:8px;background:#2C1A0E;color:#fff;cursor:pointer;\">Imprimir / Guardar PDF</button>"
    +"</body></html>";
}
function LiquidacionSueldos({empleados,saveEmpleados,liquidaciones,saveLiquidaciones}){
  const empleadosActivos=(empleados||[]).filter(e=>e.estado!=="Inactivo"&&!e.excluirLiquidacion).slice().sort((a,b)=>a.nombre.localeCompare(b.nombre));
  const[periodo,setPeriodo]=useState(()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");});
  const[editando,setEditando]=useState(null);
  const[form,setForm]=useState(null);
  const[busy,setBusy]=useState(false);
  const[verBasicos,setVerBasicos]=useState(false);
  const[basicosDraft,setBasicosDraft]=useState({});
  const[bonosDraft,setBonosDraft]=useState({});
  const[verNomina,setVerNomina]=useState(false);

  const mesLabel=p=>{const[y,m]=p.split("-");return new Date(Number(y),Number(m)-1,1).toLocaleDateString("es-AR",{month:"long",year:"numeric"});};
  const liqDe=(empId,per)=>(liquidaciones||[]).find(l=>l.empleadoId===empId&&l.periodo===per);
  const num=v=>Number(v)||0;

  // Horas extras: cantidad de horas × valor hora (básico/208×2). Bono: 0 llegadas tarde/faltas = bono base x2;
  // 1 a 4 = sin cambios (tolerancia); ≥5 = bono base - (cantidad×5000), con tope en el propio bono base (nunca negativo).
  // Ausencias: cantidad de días × valor día (básico/208×8). Feriados: cantidad de feriados × valor feriado (básico/208×8, mismo valor que muestra la Nómina).
  const haberesCalc=f=>{
    const basico=num(f.sueldoBasico);
    const valorHsExtraHora=Math.round((basico/208*2)*100)/100;
    const hsExtrasCantSet=f.hsExtrasCant!==undefined&&f.hsExtrasCant!=="";
    const hsExtrasMonto=hsExtrasCantSet?Math.round(num(f.hsExtrasCant)*valorHsExtraHora*100)/100:num(f.hsExtras);
    const bonoBaseSet=f.bonoBase!==undefined&&f.bonoBase!=="";
    const bonoBase=bonoBaseSet?num(f.bonoBase):num(f.bono);
    const bonoCantSet=f.bonoCant!==undefined&&f.bonoCant!=="";
    const bonoCant=bonoCantSet?num(f.bonoCant):null;
    const bonoMonto=bonoCant===null?bonoBase:(bonoCant===0?bonoBase*2:(bonoCant<5?bonoBase:Math.max(0,bonoBase-Math.min(bonoCant*5000,bonoBase))));
    const valorFeriado=Math.round((basico/208*8)*100)/100;
    const feriadosCantSet=f.feriadosCant!==undefined&&f.feriadosCant!=="";
    const feriadosMonto=feriadosCantSet?Math.round(num(f.feriadosCant)*valorFeriado*100)/100:num(f.feriados);
    const otros=feriadosMonto+num(f.plusVacacional)+num(f.plusSac);
    const subtotal=basico+hsExtrasMonto+bonoMonto+otros;
    const valorAusenciaDia=Math.round((basico/208*8)*100)/100;
    const ausenciasCantSet=f.ausenciasCant!==undefined&&f.ausenciasCant!=="";
    const ausenciasMonto=ausenciasCantSet?Math.round(num(f.ausenciasCant)*valorAusenciaDia*100)/100:num(f.ausencias);
    const totalDescuentos=ausenciasMonto+num(f.adelantos)+num(f.consumos);
    return{valorHsExtraHora,hsExtrasMonto,bonoBase,bonoMonto,valorFeriado,feriadosMonto,subtotal,valorAusenciaDia,ausenciasMonto,totalDescuentos};
  };

  const abrirLiquidacion=emp=>{
    const existente=liqDe(emp.id,periodo);
    setEditando(emp);
    const basicoRef=Number(emp.sueldoBasicoRef)||0;
    const bonoRef=Number(emp.bonoRef)||0;
    if(existente){
      setForm({
        ...existente,
        bonoBase:existente.bonoBase!==undefined?existente.bonoBase:(existente.bono!==undefined&&existente.bono!==""?String(existente.bono):(bonoRef?String(bonoRef):"")),
        hsExtrasCant:existente.hsExtrasCant!==undefined?existente.hsExtrasCant:"",
        bonoCant:existente.bonoCant!==undefined?existente.bonoCant:"",
        ausenciasCant:existente.ausenciasCant!==undefined?existente.ausenciasCant:"",
        feriadosCant:existente.feriadosCant!==undefined?existente.feriadosCant:"",
      });
    }else{
      setForm({
        id:uid(),empleadoId:emp.id,periodo,
        sueldoBasico:basicoRef?String(basicoRef):"",
        hsExtrasCant:"",
        bonoBase:bonoRef?String(bonoRef):"",
        bonoCant:"",
        feriadosCant:"",
        plusVacacional:"",plusSac:"",
        ausenciasCant:"",
        penalidad:"",adelantos:"",consumos:"",
        obs:"",estado:"borrador",fecha:new Date().toISOString(),fechaConfirmacion:null,
      });
    }
  };

  const guardarValores=async emp=>{
    const vB=basicosDraft[emp.id];
    const vBo=bonosDraft[emp.id];
    if(vB===undefined&&vBo===undefined)return;
    await saveEmpleados(empleados.map(e=>e.id===emp.id?{...e,
      sueldoBasicoRef:vB!==undefined?(Number(vB)||0):(e.sueldoBasicoRef||0),
      bonoRef:vBo!==undefined?(Number(vBo)||0):(e.bonoRef||0),
    }:e));
    toast("Valores agendados ✓");
  };

  const guardar=async confirmar=>{
    const{hsExtrasMonto,bonoMonto,feriadosMonto,subtotal,ausenciasMonto,totalDescuentos}=haberesCalc(form);
    if(subtotal<=0){toast("Cargá al menos un haber (ej. sueldo básico)");return null;}
    setBusy(true);
    const registro={...form,empleadoId:editando.id,empleadoNombre:(editando.nombre+" "+(editando.apellido||"")).trim(),periodo,
      hsExtras:hsExtrasMonto,bono:bonoMonto,ausencias:ausenciasMonto,feriados:feriadosMonto,
      subtotal,totalDescuentos,neto:subtotal-totalDescuentos,
      estado:confirmar?"confirmada":(form.estado||"borrador"),
      fechaConfirmacion:confirmar?new Date().toISOString():(form.fechaConfirmacion||null),
      fecha:form.fecha||new Date().toISOString()};
    await saveLiquidaciones([registro,...(liquidaciones||[]).filter(l=>l.id!==registro.id)]);
    setForm(registro);setBusy(false);
    toast(confirmar?"Liquidación confirmada ✓":"Borrador guardado ✓");
    return registro;
  };

  const confirmarYRecibo=async()=>{
    const w=window.open("","_blank");
    const reg=await guardar(true);
    if(!reg){if(w)w.close();return;}
    if(w){w.document.write(reciboHTML(reg,editando));w.document.close();}
    else toast("Habilitá las ventanas emergentes para ver el recibo");
  };
  const verRecibo=()=>{
    const w=window.open("","_blank");
    if(w){w.document.write(reciboHTML(form,editando));w.document.close();}
  };

  if(editando&&form){
    const{valorHsExtraHora,hsExtrasMonto,bonoBase,bonoMonto,valorFeriado,feriadosMonto,subtotal,valorAusenciaDia,ausenciasMonto,totalDescuentos}=haberesCalc(form);
    const neto=subtotal-totalDescuentos;
    const bonoCantVacio=form.bonoCant===undefined||form.bonoCant==="";
    return(<>
      <button onClick={()=>{setEditando(null);setForm(null);}} style={{display:"flex",alignItems:"center",gap:6,background:"none",border:"none",color:"#7B7063",fontSize:".8rem",fontWeight:600,cursor:"pointer",marginBottom:14,padding:0}}>← Volver a la nómina</button>
      <div style={{fontFamily:"Georgia,serif",fontSize:"1.15rem",marginBottom:2}}>{editando.nombre} {editando.apellido||""}</div>
      <div style={{fontSize:".78rem",color:"#7B7063",marginBottom:16}}>{mesLabel(periodo)}{form.estado==="confirmada"&&<span style={{marginLeft:8,color:"#2D6A4F",fontWeight:700}}>✓ Confirmada</span>}</div>

      <Card title="Haberes">
        <Field label="Sueldo básico"><Inp type="number" value={form.sueldoBasico} onChange={v=>setForm(f=>({...f,sueldoBasico:v}))} placeholder="0"/></Field>

        <Field label={<>Horas extras <span style={{fontWeight:400,color:"#7B7063"}}>(cantidad de horas · valor hora {fmt(valorHsExtraHora)})</span></>}><Inp type="number" value={form.hsExtrasCant!==undefined?form.hsExtrasCant:""} onChange={v=>setForm(f=>({...f,hsExtrasCant:v}))} placeholder="0"/></Field>
        <p style={{fontSize:".74rem",color:"#7B7063",margin:"6px 0 0"}}>Total horas extras: <strong style={{color:"#2C1A0E"}}>{fmt(hsExtrasMonto)}</strong></p>

        <Field label="Bono base"><Inp type="number" value={form.bonoBase!==undefined?form.bonoBase:""} onChange={v=>setForm(f=>({...f,bonoBase:v}))} placeholder="0"/></Field>
        <p style={{fontSize:".74rem",color:"#7B7063",margin:"6px 0 0"}}>Bono a liquidar: <strong style={{color:"#2C1A0E"}}>{fmt(bonoMonto)}</strong></p>

        <Field label={<>Feriados <span style={{fontWeight:400,color:"#7B7063"}}>(cantidad de feriados · valor feriado {fmt(valorFeriado)})</span></>}><Inp type="number" value={form.feriadosCant!==undefined?form.feriadosCant:""} onChange={v=>setForm(f=>({...f,feriadosCant:v}))} placeholder="0"/></Field>
        <p style={{fontSize:".74rem",color:"#7B7063",margin:"6px 0 0"}}>Total feriados: <strong style={{color:"#2C1A0E"}}>{fmt(feriadosMonto)}</strong></p>

        {CAMPOS_HABER.filter(([k])=>k!=="sueldoBasico").map(([k,label])=>(
          <Field key={k} label={label}><Inp type="number" value={form[k]} onChange={v=>setForm(f=>({...f,[k]:v}))} placeholder="0"/></Field>
        ))}
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"14px 0 0",marginTop:8,borderTop:"1px solid #F2EAE0"}}>
          <span style={{fontWeight:700,fontSize:".85rem"}}>Subtotal</span>
          <span style={{fontFamily:"Georgia,serif",fontSize:"1.2rem",fontWeight:700,color:"#2D6A4F"}}>{fmt(subtotal)}</span>
        </div>
      </Card>

      <Card title="Descuentos">
        <Field label={<>Ausencias <span style={{fontWeight:400,color:"#7B7063"}}>(cantidad de días · valor día {fmt(valorAusenciaDia)})</span></>}><Inp type="number" value={form.ausenciasCant!==undefined?form.ausenciasCant:""} onChange={v=>setForm(f=>({...f,ausenciasCant:v}))} placeholder="0"/></Field>
        <p style={{fontSize:".74rem",color:"#7B7063",margin:"6px 0 0"}}>Total ausencias: <strong style={{color:"#C0392B"}}>{fmt(ausenciasMonto)}</strong></p>

        <Field label={<>Penalidades <span style={{color:"#C0392B"}}>X</span></>}><Inp type="number" value={form.bonoCant!==undefined?form.bonoCant:""} onChange={v=>setForm(f=>({...f,bonoCant:v}))} placeholder="0 = bono x2"/></Field>
        <p style={{fontSize:".74rem",color:"#7B7063",margin:"6px 0 0"}}>
          {bonoCantVacio?"Sin cargar → se toma el bono base tal cual.":(num(form.bonoCant)===0?"0 llegadas tarde/faltas → bono base x2.":(num(form.bonoCant)<5?"1 a 4 → sin cambios en el bono.":(num(form.bonoCant)+" × $5.000 de descuento (tope: el bono base).")))}
        </p>

        {CAMPOS_DESCUENTO.map(([k,label])=>(
          <Field key={k} label={label}><Inp type="number" value={form[k]} onChange={v=>setForm(f=>({...f,[k]:v}))} placeholder="0"/></Field>
        ))}
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"14px 0 0",marginTop:8,borderTop:"1px solid #F2EAE0"}}>
          <span style={{fontWeight:700,fontSize:".85rem"}}>Total descuentos</span>
          <span style={{fontFamily:"Georgia,serif",fontSize:"1.2rem",fontWeight:700,color:"#C0392B"}}>-{fmt(totalDescuentos)}</span>
        </div>
      </Card>

      <Field label="Observaciones (opcional)"><TA value={form.obs} onChange={v=>setForm(f=>({...f,obs:v}))} placeholder="Notas para el recibo..."/></Field>

      <div style={{background:"#2C1A0E",borderRadius:14,padding:"18px 20px",margin:"18px 0 4px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <span style={{color:"#E8DCC8",fontWeight:600,fontSize:".9rem"}}>Neto a cobrar</span>
        <span style={{fontFamily:"Georgia,serif",fontSize:"1.6rem",color:"#E8DCC8",fontWeight:700}}>{fmt(neto)}</span>
      </div>

      <Btn bg="#7B7063" onClick={()=>guardar(false)} disabled={busy}>{busy?"Guardando…":"Guardar borrador"}</Btn>
      <Btn bg="#2C1A0E" onClick={confirmarYRecibo} disabled={busy}>Confirmar y generar recibo</Btn>
      {form.estado==="confirmada"&&<Btn bg="#B7860B" onClick={verRecibo}>Ver recibo</Btn>}
    </>);
  }

  if(!verNomina){
    return(<>
      <ST help={"Calculá el sueldo de cada empleado por mes: haberes menos descuentos = neto a cobrar. Al confirmar generás un recibo imprimible.\n\nEsto NO registra un pago ni descuenta la Caja Disponible — el pago real se sigue cargando en la pestaña Sueldos como siempre."}>Liquidación de sueldos</ST>
      <SS>Cargá los haberes y descuentos de cada empleado y generá su recibo.</SS>
      <Btn bg="#B7860B" onClick={()=>setVerNomina(true)}>💰 Liquidar Sueldos</Btn>
      <Btn bg="#2C1A0E" onClick={()=>setVerBasicos(v=>!v)}>{verBasicos?"Ocultar Nómina de Empleados Sueldos Básicos y Valores":"📋 Nómina de Empleados Sueldos Básicos y Valores"}</Btn>

      {verBasicos&&(
        <Card title="Sueldos básicos agendados (ayuda memoria)">
          <p style={{fontSize:".78rem",color:"#7B7063",marginBottom:12}}>Básico y bono son editables. HS extra, feriado y ausencia se calculan solos a partir del básico.</p>
          {empleadosActivos.length>0?(
            <div style={{overflowX:"auto"}}>
              <table style={{width:"100%",borderCollapse:"collapse",fontSize:".75rem",minWidth:640}}>
                <thead>
                  <tr style={{background:"#F9F6F1"}}>
                    {["Empleado","Básico","Bono","HS extra","Feriado","Ausencia",""].map(h=>(
                      <th key={h} style={{padding:"7px 8px",textAlign:h==="Empleado"?"left":"right",fontWeight:700,color:"#7B7063",fontSize:".63rem",letterSpacing:".05em",textTransform:"uppercase",borderBottom:"2px solid #E8DCC8",whiteSpace:"nowrap"}}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {empleadosActivos.map((e,i)=>{

                const bonoVal=bonosDraft[e.id]!==undefined?bonosDraft[e.id]:(e.bonoRef||"");
                const basicoNum=Number(basicoVal)||0;

                const inpCell={width:86,border:"1px solid #E8DCC8",borderRadius:6,padding:"5px 6px",fontSize:".72rem",textAlign:"right",fontFamily:"inherit",color:"#2C1A0E",background:"#fff",outline:"none",boxSizing:"border-box"};

function AdminBoletas({boletas,saveBoletas}){
  const[busqueda,setBusqueda]=useState("");
  const[editId,setEditId]=useState(null);
  const[editMonto,setEditMonto]=useState("");
  const[editObs,setEditObs]=useState("");
  const[busy,setBusy]=useState(false);

  const lista=[...boletas]
    .filter(b=>b.tipo==="boleta")
    .sort((a,b)=>new Date(b.fecha)-new Date(a.fecha));

  const filtrada=busqueda.trim()
    ?lista.filter(b=>
        norm(b.proveedor).includes(norm(busqueda))||
        norm(b.empleado).includes(norm(busqueda))||
        norm(b.obs).includes(norm(busqueda))
      )
    :lista;

  const abrirEdit=b=>{setEditId(b.id);setEditMonto(String(b.monto||0));setEditObs(b.obs||"");};
  const cerrarEdit=()=>{setEditId(null);setEditMonto("");setEditObs("");};

  const guardar=async()=>{
    const v=Number(editMonto);
    if(isNaN(v)||v<0){toast("Importe inválido");return;}
    setBusy(true);
    const nuevas=boletas.map(b=>b.id===editId?{...b,monto:v,obs:editObs.trim()}:b);
    await saveBoletas(nuevas);
    toast("Boleta corregida ✓");
    setBusy(false);cerrarEdit();
  };

  return(
    <Card title={`Boletas registradas (${lista.length})`}>
      <Field label="Buscar por proveedor, empleado u observación">
        <Inp value={busqueda} onChange={setBusqueda} placeholder="Ej: Avenida, María..."/>
      </Field>

      {editId&&(()=>{
        const b=boletas.find(x=>x.id===editId);
        return(
          <div style={{background:"#FFF8F0",border:"1.5px solid #F5CBA7",borderRadius:12,padding:16,marginTop:12}}>
            <div style={{fontWeight:700,fontSize:".85rem",marginBottom:12}}>✏️ Editando boleta</div>
            <div style={{fontSize:".78rem",color:"#7B7063",marginBottom:12}}>
              {b.proveedor} · {fmtFL(b.fecha)} · cargó: {b.empleado||"—"}
            </div>
            <Field label="Importe corregido ($)">
              <Inp type="number" value={editMonto} onChange={setEditMonto} placeholder="0"/>
            </Field>
            <Field label="Observaciones">
              <TA value={editObs} onChange={setEditObs} placeholder="Motivo de la corrección..."/>
            </Field>
            <div style={{display:"flex",gap:8,marginTop:14}}>
              <button onClick={cerrarEdit} style={{flex:1,padding:11,borderRadius:10,border:"none",background:"#E8DCC8",fontWeight:600,cursor:"pointer"}}>Cancelar</button>
              <Btn onClick={guardar} disabled={busy}>{busy?"Guardando…":"Guardar corrección"}</Btn>
            </div>
          </div>
        );
      })()}

      <div style={{marginTop:14,display:"flex",flexDirection:"column",gap:6}}>
        {!filtrada.length&&<Empty icon="🧾">No hay boletas que coincidan</Empty>}
        {filtrada.map(b=>(
          <div key={b.id} style={{background:editId===b.id?"#FFF8F0":"#fff",border:editId===b.id?"1.5px solid #F5CBA7":"1px solid #F2EAE0",borderRadius:10,padding:"10px 14px",display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10}}>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontWeight:700,fontSize:".88rem",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{b.proveedor||"Sin proveedor"}</div>
              <div style={{fontSize:".72rem",color:"#7B7063",marginTop:2}}>
                {fmtFL(b.fecha)}{b.empleado?` · ${b.empleado}`:""}
              </div>
              {b.obs&&<div style={{fontSize:".7rem",color:"#7B7063",marginTop:2,fontStyle:"italic"}}>{b.obs}</div>}
            </div>
            <div style={{display:"flex",alignItems:"center",gap:8,flexShrink:0}}>
              <span style={{fontFamily:"Georgia,serif",fontSize:"1.1rem",color:"#2C1A0E"}}>{fmt(b.monto)}</span>
              <button onClick={()=>editId===b.id?cerrarEdit():abrirEdit(b)} style={{padding:"5px 10px",border:"1px solid #E8DCC8",borderRadius:8,background:"none",fontSize:".72rem",fontWeight:600,cursor:"pointer",color:"#2C1A0E"}}>
                {editId===b.id?"✕":"Editar"}
              </button>
            </div>
          </div>
        ))}
      </div>
    </Card>
  );
}

function TabHistorial({boletas,cierres,cierresCaja,pagos,sueldos,gastos,cajaInicial,setLightbox,saveBoletas,saveCierres,saveCierresCaja,savePagos,saveSueldos,saveGastos,ajustesCajaEfectivo,saveAjustesCajaEfectivo}){
  const[filtro,setFiltro]=useState("todo");
  const[filtroDH,setFiltroDH]=useState("todos");
  const hoy=new Date();
  const iso=d=>d.toISOString().slice(0,10);
  const inicioMes=new Date(hoy.getFullYear(),hoy.getMonth(),1);
  const[filtroFecha,setFiltroFecha]=useState("mes");
  const[desde,setDesde]=useState(iso(inicioMes));
  const[hasta,setHasta]=useState(iso(hoy));

  // Movimientos normalizados en dos columnas de flujo: _efDelta (efectivo) y _digDelta (digital/transferencia).
  // _cuenta=true => el movimiento mueve algún saldo real (efectivo o digital); boletas y pagos con Amex
  // (tarjeta de crédito) no mueven nada todavía (quedan como referencia) hasta que se paguen / se pague el resumen.
  const boletasM=(boletas||[]).map(b=>({...b,tipo:"boleta",_cat:"boleta",_efDelta:0,_digDelta:0,_cuenta:false}));
  const cierresM=(cierres||[]).map(c=>({...c,tipo:"cierre",_cat:"cierre",_efDelta:Number(c.monto||0),_digDelta:0,_cuenta:true,proveedor:"Cierre "+c.turno}));
  // Cada cierre de caja trae SIEMPRE dos ingresos simultáneos: lo contado en efectivo y lo vendido por canales
  // digitales (MP/FUDO/PostNet/Digital/Uber). Antes solo se contabilizaba el efectivo — la parte digital
  // no aparecía en ningún lado del Historial.
  const cierresCajaM=(cierresCaja||[]).map(c=>({...c,tipo:"cierre_caja",_cat:"cierre",_efDelta:Number(c.efectivo||0),_digDelta:Number(c.totalDigital||0),_cuenta:true,proveedor:"Cierre "+c.turno,empleado:c.persona,monto:Number(c.total)||(Number(c.efectivo||0)+Number(c.totalDigital||0))}));
  const pagosM=(pagos||[]).map(p=>({...p,tipo:"pago",_cat:"pago",
    _efDelta:p.forma==="Efectivo"?-Number(p.monto||0):0,
    _digDelta:p.forma==="Transferencia"?-Number(p.monto||0):0,
    _cuenta:p.forma==="Efectivo"||p.forma==="Transferencia"}));
  const sueldosM=(sueldos||[]).map(s=>({...s,tipo:"sueldo",_cat:"sueldo",
    _efDelta:s.forma==="Efectivo"?-Number(s.monto||0):0,
    _digDelta:s.forma==="Transferencia"?-Number(s.monto||0):0,
    _cuenta:s.forma==="Efectivo"||s.forma==="Transferencia"}));
  const gastosM=(gastos||[]).map(g=>({...g,tipo:"gasto",_cat:"gasto",
    _efDelta:g.forma==="Efectivo"?-Number(g.monto||0):0,
    _digDelta:g.forma==="Transferencia"?-Number(g.monto||0):0,
    _cuenta:g.forma==="Efectivo"||g.forma==="Transferencia",proveedor:g.categoria}));
  // Ajustes manuales de caja (Admin > Ajuste de caja disponible). Se incluyen para que el saldo de este
  // libro diario coincida con el número de "Caja Disponible" (calcSaldo() ya los suma).
  const ajustesM=(ajustesCajaEfectivo||[]).map(a=>({...a,tipo:"ajuste",_cat:"ajuste",_efDelta:Number(a.monto||0),_digDelta:0,_cuenta:true,proveedor:"Ajuste de caja",obs:a.motivo,monto:Math.abs(Number(a.monto||0))}));
  const allMovs=[...boletasM,...cierresM,...cierresCajaM,...pagosM,...sueldosM,...gastosM,...ajustesM].filter(m=>m.fecha);

  const desdeF=filtroFecha==="mes"?iso(inicioMes):filtroFecha==="hoy"?iso(hoy):desde;
  const hastaF=filtroFecha==="mes"?iso(hoy):filtroFecha==="hoy"?iso(hoy):hasta;

  // Saldo de arrastre: cajaInicial + todo el flujo de EFECTIVO anterior al rango mostrado (sin importar el filtro de tipo).
  // El saldo corrido de esta pantalla es siempre el de Caja Disponible (efectivo) — el saldo de banco/digital
  // no se arrastra acá porque en la app se corrige a mano contra el resumen bancario real (ver Caja Digital).
  let saldoBase=Number(cajaInicial)||0;
  allMovs.filter(m=>m.fecha.slice(0,10)<desdeF).forEach(m=>{saldoBase+=m._efDelta;});

  // Saldo corrido dentro del rango, usando TODOS los tipos (para que el numero sea correcto sin importar el filtro de tipo activo).
  const enRangoAsc=allMovs.filter(m=>{const f=m.fecha.slice(0,10);return(!desdeF||f>=desdeF)&&(!hastaF||f<=hastaF);}).sort((a,b)=>a.fecha.localeCompare(b.fecha));
  let saldoAcum=saldoBase;
  const conSaldo=enRangoAsc.map(m=>{
    saldoAcum+=m._efDelta;
    return{...m,_saldo:saldoAcum};
  });

  // Filtro de tipo + Debe/Haber para mostrar (no altera el calculo de saldo, ya hecho arriba).
  let filas=conSaldo.filter(m=>filtro==="todo"?true:filtro==="cierre"?(m.tipo==="cierre"||m.tipo==="cierre_caja"):m.tipo===filtro);
  if(filtroDH==="debe")filas=filas.filter(m=>(m._efDelta<0||m._digDelta<0)&&m._cat!=="ajuste");
  if(filtroDH==="haber")filas=filas.filter(m=>(m._efDelta>0||m._digDelta>0)&&m._cat!=="ajuste");
  filas=[...filas].reverse();

  // Los ajustes de caja no son ingresos ni egresos reales (no hubo una venta ni un pago) — son una
  // corrección del saldo contado. No suman a Debe/Haber Ef. (el Saldo Ef. sí los sigue incluyendo,
  // se calcula aparte más arriba con _efDelta sobre TODOS los movimientos).
  const totalDebeEf=conSaldo.filter(m=>m._efDelta<0&&m._cat!=="ajuste").reduce((s,m)=>s+Math.abs(m._efDelta),0);
  const totalHaberEf=conSaldo.filter(m=>m._efDelta>0&&m._cat!=="ajuste").reduce((s,m)=>s+m._efDelta,0);
  const totalDebeDig=conSaldo.filter(m=>m._digDelta<0).reduce((s,m)=>s+Math.abs(m._digDelta),0);
  const totalHaberDig=conSaldo.filter(m=>m._digDelta>0).reduce((s,m)=>s+m._digDelta,0);
  const saldoFinal=conSaldo.length?conSaldo[conSaldo.length-1]._saldo:saldoBase;

  const[confirmarElim,setConfirmarElim]=useState(null);
  const pedirEliminar=item=>setConfirmarElim(item);
  const confirmarEliminar=async()=>{
    const item=confirmarElim;
    setConfirmarElim(null);
    if(item.tipo==="boleta")     await saveBoletas(boletas.filter(b=>b.id!==item.id));
    if(item.tipo==="cierre")     await saveCierres(cierres.filter(c=>c.id!==item.id));
    if(item.tipo==="cierre_caja")await saveCierresCaja((cierresCaja||[]).filter(c=>c.id!==item.id));
    if(item.tipo==="pago")       await savePagos(pagos.filter(p=>p.id!==item.id));
    if(item.tipo==="sueldo")     await saveSueldos(sueldos.filter(s=>s.id!==item.id));
    if(item.tipo==="gasto")      await saveGastos(gastos.filter(g=>g.id!==item.id));
    if(item.tipo==="ajuste"&&saveAjustesCajaEfectivo) await saveAjustesCajaEfectivo((ajustesCajaEfectivo||[]).filter(a=>a.id!==item.id));
    toast("Registro eliminado ✓");
  };

  const exportCSV=()=>{
    const rows=[["Tipo","Fecha","Hora","Proveedor/Turno","Empleado","Monto","Forma","Detalle"]];
    boletas.forEach(b=>rows.push(["Boleta",fmtF(b.fecha),fmtH(b.fecha),b.proveedor,b.empleado,b.monto,"",b.obs]));
    cierres.forEach(c=>rows.push(["Cierre",fmtF(c.fecha),fmtH(c.fecha),"Turno "+c.turno,c.empleado,c.monto,"",c.obs]));
    (cierresCaja||[]).forEach(c=>rows.push(["Cierre de Caja",fmtF(c.fecha),fmtH(c.fecha),"Turno "+c.turno,c.persona,c.efectivo,"",c.obs]));
    pagos.forEach(p=>rows.push(["Pago",fmtF(p.fecha),fmtH(p.fecha),p.proveedor,p.empleado,p.monto,p.forma,p.obs]));
    sueldos.forEach(s=>rows.push(["Sueldo",fmtF(s.fecha),fmtH(s.fecha),s.proveedor||s.empleado,s.empleado,s.monto,s.forma,s.obs]));
    gastos.forEach(g=>rows.push(["Gasto",fmtF(g.fecha),fmtH(g.fecha),g.categoria,g.empleado,g.monto,g.forma,g.obs]));
    (ajustesCajaEfectivo||[]).forEach(a=>rows.push(["Ajuste",fmtF(a.fecha),fmtH(a.fecha),"Ajuste de caja","",a.monto,"",a.motivo]));
    const csv=rows.map(r=>r.map(v=>`"${String(v||"").replace(/"/g,'""')}"`).join(",")).join("\n");
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8;"}));
    a.download=`amapola_historial_${hoyLocal()}.csv`;a.click();
  };

  const iconoCat=c=>c==="cierre"?"💵":c==="sueldo"?"👤":c==="gasto"?"🏠":c==="pago"?"💸":c==="ajuste"?"⚖️":"🧾";

  return(<>
    <ST help={"Historial completo de todos los movimientos del negocio, en formato de libro diario.\n\n• Debe Ef. / Haber Ef. = salidas y entradas de efectivo. Saldo Ef. = plata en Caja Disponible en ese momento (coincide con el número de Caja Disponible).\n• Debe Dig. / Haber Dig. = salidas y entradas por transferencia o digital: pagos/sueldos/gastos por transferencia, y la parte digital (MP, FUDO, PostNet, Uber) de cada cierre de caja.\n• No hay una columna de saldo corrido para lo digital: el saldo real de banco se maneja aparte en Caja Digital porque ahí se corrige a mano contra el resumen bancario (por las comisiones y demoras de acreditación).\n• Las boletas y los pagos con Amex (tarjeta de crédito) aparecen como referencia (sin Debe/Haber) porque todavía no mueven ni la caja ni el banco — recién se descuentan cuando pagás el resumen de la tarjeta (eso se carga como Gasto, categoría Amex).\n• Los ajustes de caja tampoco aparecen en Debe/Haber ni suman a esos totales — no son una venta ni un pago, son una corrección del saldo contado. Igual se ven reflejados en el Saldo Ef. corrido.\n• Podes filtrar por tipo, por fecha y por Debe/Haber.\n• Desde aca podes eliminar registros si cometiste un error (requiere confirmar, no se puede deshacer)."}>Historial</ST>
    <SS>Libro diario de todos los movimientos — efectivo y digital.</SS>

    <div style={{background:"#fff",borderRadius:14,padding:20,boxShadow:"0 2px 12px rgba(44,26,14,.08)",marginBottom:16}}>
      <div style={{display:"flex",gap:8,marginBottom:12,flexWrap:"wrap"}}>
        {[["todo","Todo"],["boleta","Boletas"],["cierre","Cierres"],["pago","Pagos"],["sueldo","Sueldos"],["gasto","Pagos dig."],["ajuste","Ajustes"]].map(([f,l])=>(
          <button key={f} onClick={()=>setFiltro(f)} style={{padding:"6px 12px",borderRadius:20,border:"none",cursor:"pointer",fontSize:".72rem",fontWeight:600,background:filtro===f?"#2C1A0E":"#E8DCC8",color:filtro===f?"#E8DCC8":"#2C1A0E"}}>{l}</button>
        ))}
      </div>

      <div style={{display:"flex",gap:6,marginBottom:10,flexWrap:"wrap"}}>
        {[["hoy","Hoy"],["mes","Este mes"],["custom","Personalizado"]].map(([v,l])=>(
          <button key={v} onClick={()=>{setFiltroFecha(v);if(v==="mes"){setDesde(iso(inicioMes));setHasta(iso(hoy));}if(v==="hoy"){setDesde(iso(hoy));setHasta(iso(hoy));}}} style={{padding:"5px 12px",borderRadius:20,border:"none",cursor:"pointer",fontSize:".72rem",fontWeight:600,background:filtroFecha===v?"#2C1A0E":"#E8DCC8",color:filtroFecha===v?"#E8DCC8":"#2C1A0E"}}>{l}</button>
        ))}
      </div>
      {filtroFecha==="custom"&&(
        <div style={{display:"flex",gap:8,marginBottom:10}}>
          <div style={{flex:1}}>
            <label style={{display:"block",fontSize:".7rem",fontWeight:600,color:"#7B7063",marginBottom:3}}>Desde</label>
            <input type="date" value={desde} onChange={e=>setDesde(e.target.value)} style={{...iS,fontSize:".82rem",padding:"7px 10px"}}/>
          </div>
          <div style={{flex:1}}>
            <label style={{display:"block",fontSize:".7rem",fontWeight:600,color:"#7B7063",marginBottom:3}}>Hasta</label>
            <input type="date" value={hasta} onChange={e=>setHasta(e.target.value)} style={{...iS,fontSize:".82rem",padding:"7px 10px"}}/>
          </div>
        </div>
      )}

      <div style={{display:"flex",gap:6,marginBottom:14}}>
        {[["todos","Todos"],["debe","💸 Solo Debe"],["haber","💵 Solo Haber"]].map(([v,l])=>(
          <button key={v} onClick={()=>setFiltroDH(v)} style={{flex:1,padding:"5px 8px",borderRadius:20,border:"none",cursor:"pointer",fontSize:".72rem",fontWeight:600,
            background:filtroDH===v?(v==="debe"?"#C0392B":v==="haber"?"#2D6A4F":"#2C1A0E"):"#E8DCC8",
            color:filtroDH===v?"#fff":"#2C1A0E"}}>{l}</button>
        ))}
      </div>

      <div style={{fontSize:".72rem",color:"#7B7063",marginBottom:4}}>{filas.length} registro{filas.length!==1?"s":""} · Saldo Caja Disponible: <strong style={{color:saldoFinal>=0?"#2D6A4F":"#C0392B"}}>{fmt(saldoFinal)}</strong></div>
      <div style={{display:"flex",gap:8,marginBottom:14,flexWrap:"wrap"}}>
        {[["💵 Efectivo",totalHaberEf,totalDebeEf],["💳 Digital",totalHaberDig,totalDebeDig]].map(([l,h,d])=>(
          <div key={l} style={{flex:1,minWidth:150,background:"#F9F6F1",borderRadius:10,padding:"8px 10px"}}>
            <div style={{fontSize:".6rem",color:"#7B7063",textTransform:"uppercase",letterSpacing:".04em",marginBottom:2}}>{l} del período</div>
            <div style={{fontSize:".76rem",color:"#2D6A4F",fontWeight:700}}>Haber {fmt(h)}</div>
            <div style={{fontSize:".76rem",color:"#C0392B",fontWeight:700}}>Debe {fmt(d)}</div>
          </div>
        ))}
      </div>

      {!filas.length?<Empty icon="📒">Sin registros en el periodo</Empty>:(
        <div style={{overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:".75rem",minWidth:620}}>
            <thead>
              <tr style={{background:"#F9F6F1"}}>
                {["Fecha","Concepto","Debe Ef.","Haber Ef.","Debe Dig.","Haber Dig.","Saldo Ef.",""].map(h=>(
                  <th key={h||"acc"} style={{padding:"7px 8px",textAlign:h==="Fecha"||h==="Concepto"?"left":h===""?"center":"right",fontWeight:700,color:"#7B7063",fontSize:".63rem",letterSpacing:".05em",textTransform:"uppercase",borderBottom:"2px solid #E8DCC8",whiteSpace:"nowrap"}}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {filas.map((f,i)=>(
                <tr key={f.tipo+f.id+i} style={{background:i%2===0?"#fff":"#F9F6F1"}}>
                  <td style={{padding:"6px 8px",whiteSpace:"nowrap",color:"#7B7063",fontSize:".72rem"}}>
                    {fmtF(f.fecha)}<br/><span style={{fontSize:".62rem"}}>{fmtH(f.fecha)}</span>
                  </td>
                  <td style={{padding:"6px 8px"}}>
                    <div style={{display:"flex",alignItems:"center",gap:5}}>
                      <span style={{flexShrink:0}}>{iconoCat(f._cat)}</span>
                      <div style={{minWidth:0}}>
                        <div style={{fontWeight:600,fontSize:".76rem",lineHeight:1.3}}>{f.proveedor||"—"}</div>
                        <div style={{fontSize:".63rem",color:f._cat==="ajuste"?(f._efDelta>0?"#2D6A4F":"#C0392B"):"#7B7063",fontWeight:f._cat==="ajuste"?700:400,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",maxWidth:160}}>
                          {f.empleado?f.empleado+" · ":""}
                          {f._cat==="ajuste"?(f._efDelta>0?"+":"-")+fmt(Math.abs(f._efDelta))+" · corrección de saldo":(!f._cuenta?fmt(f.monto)+(f.tipo==="boleta"?" (boleta, no afecta caja)":f.forma==="Amex"?" (Amex, no descuenta hasta pagar el resumen)":f.forma==="Retiro"?" (pagado con efectivo ya retirado antes)":""):"")}
                          {f.obs?" · "+f.obs:""}
                        </div>
                      </div>
                    </div>
                  </td>
                  <td style={{padding:"6px 8px",textAlign:"right",color:"#C0392B",fontWeight:700,whiteSpace:"nowrap"}}>
                    {f._cat!=="ajuste"&&f._efDelta<0?fmt(Math.abs(f._efDelta)):"—"}
                  </td>
                  <td style={{padding:"6px 8px",textAlign:"right",color:"#2D6A4F",fontWeight:700,whiteSpace:"nowrap"}}>
                    {f._cat!=="ajuste"&&f._efDelta>0?fmt(f._efDelta):"—"}
                  </td>
                  <td style={{padding:"6px 8px",textAlign:"right",color:"#B7860B",fontWeight:700,whiteSpace:"nowrap"}}>
                    {f._digDelta<0?fmt(Math.abs(f._digDelta)):"—"}
                  </td>
                  <td style={{padding:"6px 8px",textAlign:"right",color:"#1a6b8f",fontWeight:700,whiteSpace:"nowrap"}}>
                    {f._digDelta>0?fmt(f._digDelta):"—"}
                  </td>
                  <td style={{padding:"6px 8px",textAlign:"right",fontWeight:700,whiteSpace:"nowrap",color:f._saldo>=0?"#2C1A0E":"#C0392B"}}>{fmt(f._saldo)}</td>
                  <td style={{padding:"6px 8px",textAlign:"center"}}>
                    <button onClick={()=>pedirEliminar(f)} style={{background:"#FFF0EF",border:"1px solid #f5b7b1",borderRadius:6,color:"#E74C3C",fontSize:".68rem",fontWeight:600,cursor:"pointer",padding:"3px 7px"}}>✕</button>
                  </td>
                </tr>
              ))}
              <tr style={{background:"#2C1A0E"}}>
                <td colSpan={2} style={{padding:"8px 10px",color:"#E8DCC8",fontWeight:700,fontSize:".76rem"}}>TOTALES</td>
                <td style={{padding:"8px",textAlign:"right",color:"#f5b7b1",fontWeight:700,whiteSpace:"nowrap"}}>{fmt(totalDebeEf)}</td>
                <td style={{padding:"8px",textAlign:"right",color:"#a9dfbf",fontWeight:700,whiteSpace:"nowrap"}}>{fmt(totalHaberEf)}</td>
                <td style={{padding:"8px",textAlign:"right",color:"#f5d98b",fontWeight:700,whiteSpace:"nowrap"}}>{fmt(totalDebeDig)}</td>
                <td style={{padding:"8px",textAlign:"right",color:"#a9d3e8",fontWeight:700,whiteSpace:"nowrap"}}>{fmt(totalHaberDig)}</td>
                <td style={{padding:"8px",textAlign:"right",fontWeight:700,whiteSpace:"nowrap",color:saldoFinal>=0?"#a9dfbf":"#f5b7b1"}}>{fmt(saldoFinal)}</td>
                <td/>
              </tr>
            </tbody>
          </table>
        </div>
      )}
    </div>

    {filas.length>0&&<button onClick={exportCSV} style={{display:"block",width:"100%",marginBottom:12,padding:12,borderRadius:10,border:"none",background:"#E8DCC8",color:"#C0392B",fontSize:".82rem",fontWeight:600,cursor:"pointer"}}>⬇ Exportar CSV</button>}

    {confirmarElim&&(
      <div style={{position:"fixed",inset:0,background:"rgba(44,26,14,.65)",zIndex:500,display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
        <div style={{background:"#fff",borderRadius:"20px 20px 0 0",padding:"28px 20px 44px",width:"100%",maxWidth:460}}>
          <p style={{fontFamily:"Georgia,serif",fontSize:"1.1rem",marginBottom:8,color:"#2C1A0E"}}>⚠️ Eliminar registro</p>
          <p style={{fontSize:".85rem",color:"#7B7063",marginBottom:6}}>
            <strong>{confirmarElim.tipo==="boleta"?"Boleta":confirmarElim.tipo==="cierre"?"Cierre":confirmarElim.tipo==="cierre_caja"?"Cierre de Caja":confirmarElim.tipo==="ajuste"?"Ajuste de caja":confirmarElim.forma||confirmarElim.tipo}</strong>
            {" · "}{fmt(confirmarElim.monto)}
          </p>
          <p style={{fontSize:".82rem",color:"#7B7063",marginBottom:20}}>{fmtF(confirmarElim.fecha)}{confirmarElim.proveedor?" · "+confirmarElim.proveedor:""}{confirmarElim.obs?" · "+confirmarElim.obs:""}</p>
          <p style={{fontSize:".78rem",color:"#C0392B",marginBottom:20,fontWeight:600}}>Esta accion no se puede deshacer.</p>
          <div style={{display:"flex",gap:10}}>
            <button onClick={()=>setConfirmarElim(null)} style={{flex:1,padding:13,borderRadius:10,border:"none",background:"#E8DCC8",fontWeight:600,cursor:"pointer",fontSize:".95rem"}}>Cancelar</button>
            <button onClick={confirmarEliminar} style={{flex:1,padding:13,borderRadius:10,border:"none",background:"#C0392B",color:"#fff",fontWeight:600,cursor:"pointer",fontSize:".95rem"}}>Eliminar</button>
          </div>
        </div>
      </div>
    )}
  </>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root/>);
</script>
</body>
</html>
