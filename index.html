    </div>

    {/* ESTADO DE CUENTA */}
    <div style={{background:"#fff",borderRadius:14,padding:20,boxShadow:"0 2px 12px rgba(44,26,14,.08)",marginBottom:16}}>
      <div style={{fontSize:".68rem",fontWeight:700,letterSpacing:".09em",textTransform:"uppercase",color:"#7B7063",marginBottom:14}}>Estado de cuenta</div>
      <Field label="Seleccioná un proveedor">
        <select value={provSel} onChange={e=>setProvSel(e.target.value)} style={sS}>
          <option value="">— Elegí un proveedor —</option>
          {sorted.map(p=><option key={p.id} value={p.nombre}>{p.nombre} · {fmt(Math.max(0,p._p))}</option>)}
        </select>
      </Field>
      {provSel&&<>
        <div style={{display:"flex",gap:8,marginTop:12}}>
          <div style={{flex:1}}>
            <label style={{display:"block",fontSize:".72rem",fontWeight:600,color:"#7B7063",marginBottom:3}}>Desde</label>
            <input type="date" value={desdeDet} onChange={e=>setDesdeDet(e.target.value)} style={{...iS,fontSize:".82rem",padding:"7px 10px"}}/>
          </div>
          <div style={{flex:1}}>
            <label style={{display:"block",fontSize:".72rem",fontWeight:600,color:"#7B7063",marginBottom:3}}>Hasta</label>
            <input type="date" value={hastaDet} onChange={e=>setHastaDet(e.target.value)} style={{...iS,fontSize:".82rem",padding:"7px 10px"}}/>
          </div>
        </div>

        {/* RESUMEN */}
        {infoSel&&<div style={{display:"flex",gap:8,margin:"14px 0 0"}}>
          {[["Deuda ini.",fmt(infoSel.deudaInicial),"#E8DCC8"],["Boletas",fmt(infoSel.sumaBoletas),"#f5b7b1"],["Pagado",fmt(infoSel.pagado),"#40916C"],["Pendiente",fmt(Math.max(0,infoSel.pendiente)),infoSel.pendiente>0?"#E74C3C":"#40916C"]].map(([l,v,c])=>(
            <div key={l} style={{flex:1,background:"#2C1A0E",borderRadius:10,padding:"8px 6px",textAlign:"center"}}>
              <div style={{fontSize:".55rem",color:"#E8DCC8",opacity:.6,textTransform:"uppercase"}}>{l}</div>
              <div style={{fontSize:".82rem",fontWeight:700,color:c,marginTop:2}}>{v}</div>
            </div>
          ))}
        </div>}

        {/* TABLA */}
        <div style={{marginTop:14,overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:".78rem"}}>
            <thead>
              <tr style={{background:"#F9F6F1"}}>
                {["Fecha","Tipo","Detalle","Cargo","Pago","Saldo"].map(h=>(
                  <th key={h} style={{padding:"7px 8px",textAlign:h==="Cargo"||h==="Pago"||h==="Saldo"?"right":"left",fontWeight:700,color:"#7B7063",fontSize:".68rem",letterSpacing:".05em",textTransform:"uppercase",whiteSpace:"nowrap",borderBottom:"2px solid #E8DCC8"}}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {!movParaMostrar.length&&!(infoSel&&infoSel.deudaInicial!==0)&&<tr><td colSpan={6} style={{textAlign:"center",padding:"20px",color:"#7B7063"}}>Sin movimientos en el período</td></tr>}
              {movParaMostrar.map((m,i)=>{
                const esBol=m._tipo==="boleta";
                const bg=i%2===0?"#fff":"#F9F6F1";
                return(
                  <tr key={m.id} style={{background:bg}}>
                    <td style={{padding:"7px 8px",whiteSpace:"nowrap",color:"#7B7063"}}>{fmtF(m.fecha)}</td>
                    <td style={{padding:"7px 8px"}}>
                      <span style={{background:esBol?"#FFF0EF":"#EAF5F0",color:esBol?"#C0392B":"#2D6A4F",borderRadius:4,padding:"2px 6px",fontSize:".68rem",fontWeight:700,whiteSpace:"nowrap"}}>
                        {esBol?"Boleta":m.forma}
                      </span>
                    </td>
                    <td style={{padding:"7px 8px",color:"#7B7063",maxWidth:120,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}} title={m.obs||""}>{m.obs||"—"}</td>
                    <td style={{padding:"7px 8px",textAlign:"right",color:"#C0392B",fontWeight:esBol?600:400}}>{esBol?fmt(m.monto):"—"}</td>
                    <td style={{padding:"7px 8px",textAlign:"right",color:"#2D6A4F",fontWeight:!esBol?600:400}}>{!esBol?fmt(m.monto):"—"}</td>
                    <td style={{padding:"7px 8px",textAlign:"right",fontWeight:700,color:m._saldo>0?"#C0392B":"#2D6A4F"}}>{fmt(m._saldo)}</td>
                  </tr>
                );
              })}
              {infoSel&&infoSel.deudaInicial!==0&&(
                <tr style={{background:"#FEF9E7"}}>
                  <td style={{padding:"7px 8px",color:"#7B7063",whiteSpace:"nowrap"}}>—</td>
                  <td style={{padding:"7px 8px"}}><span style={{background:"#E8DCC8",borderRadius:4,padding:"2px 6px",fontSize:".68rem",fontWeight:700}}>Inicial</span></td>
                  <td style={{padding:"7px 8px",color:"#7B7063",maxWidth:120,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>Deuda inicial</td>
                  <td style={{padding:"7px 8px",textAlign:"right",color:"#C0392B",fontWeight:600}}>{fmt(infoSel.deudaInicial)}</td>
                  <td style={{padding:"7px 8px",textAlign:"right"}}>—</td>
                  <td style={{padding:"7px 8px",textAlign:"right",fontWeight:700,color:"#C0392B"}}>{fmt(infoSel.deudaInicial)}</td>
                </tr>
              )}
            </tbody>
          </table>
        </div>
        <div style={{display:"flex",gap:8,marginTop:14}}>
          <button onClick={exportarEstadoCuenta} style={{flex:1,padding:10,borderRadius:10,border:"none",background:"#E8DCC8",color:"#2C1A0E",fontWeight:600,fontSize:".82rem",cursor:"pointer"}}>⬇ Exportar CSV</button>
          <button onClick={()=>{setProvSel("");setDesdeDet("");setHastaDet("");}} style={{padding:10,borderRadius:10,border:"none",background:"#F9F6F1",color:"#7B7063",fontWeight:600,fontSize:".82rem",cursor:"pointer"}}>Limpiar</button>
        </div>
      </>}
    </div>

    {/* BUSCADOR + LISTA */}
    <div style={{marginBottom:12}}>
      <input value={filtroNombre} onChange={e=>setFiltroNombre(e.target.value)} placeholder="🔍 Buscar proveedor..." style={{...iS,fontSize:".85rem"}}/>
    </div>

    {!filtrados.length?<Empty icon="🏪">Sin resultados</Empty>:filtrados.map(p=>{
      const sal=p._p<=0;const pct=p._i>0?Math.max(0,Math.min(100,(p._p/p._i)*100)):0;
      return(
        <div key={p.id} onClick={()=>{setProvSel(p.nombre);setDesdeDet("");setHastaDet("");window.scrollTo({top:0,behavior:"smooth"});}}

    <div style={{height:16}}/>

    {retiroModal&&(
      <div style={{position:"fixed",inset:0,background:"rgba(44,26,14,.65)",zIndex:500,display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
        <div style={{background:"#fff",borderRadius:"20px 20px 0 0",padding:"24px 20px 40px",width:"100%",maxWidth:460,maxHeight:"92dvh",overflowY:"auto"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
            <p style={{fontFamily:"Georgia,serif",fontSize:"1.1rem"}}>💰 Retirar efectivo para sueldos</p>
            <button onClick={()=>setRetiroModal(false)} style={{background:"none",border:"none",fontSize:"1.3rem",color:"#7B7063",cursor:"pointer",padding:4,lineHeight:1}}>✕</button>
          </div>
          <p style={{fontSize:".78rem",color:"#7B7063",marginBottom:16}}>Esto descuenta la caja disponible una sola vez (queda cargado como Gasto, categoría "Retiro para sueldos"). Después, cada sueldo que pagues con esta plata registralo con forma "Retiro" — así no se descuenta de nuevo.</p>
          <Field label="Monto retirado ($)"><Inp type="number" value={retiroMonto} onChange={setRetiroMonto} placeholder="0"/></Field>
          <Field label="Observaciones (opcional)"><TA value={retiroObs} onChange={setRetiroObs} placeholder="Ej: para pagar sueldos de la quincena"/></Field>
          <Field label="Fecha del retiro"><Inp type="date" value={retiroFecha} onChange={setRetiroFecha}/></Field>

function TabGastos({gastos,saveGastos,saldo,cajaInicial}){
  const CATS_BASE=['Alquiler','Contadora','Abogada','Conciliaciones','Amex','Impuestos','Carta Documento','Disney','FUDO','Fumigador','Mantenimiento','Movistar','Rapiboy','Retiro para sueldos'];
  // Combina las categorías base (que pueden crecer con el tiempo) con las que el usuario haya
  // agregado a mano en este dispositivo, para que una categoría nueva agregada al código no quede
  // "perdida" detrás de una lista vieja ya guardada en localStorage.
  const[cats,setCats]=useState(()=>{
    try{
      const s=localStorage.getItem("amapola_cats_gastos");
      const guardadas=s?JSON.parse(s):[];
      return Array.from(new Set([...CATS_BASE,...guardadas]));
    }catch{return CATS_BASE;}
  });
  const[cat,setCat]=useState("");const[monto,setMonto]=useState("");
  const[forma,setForma]=useState("Efectivo");const[obs,setObs]=useState("");
  const[busy,setBusy]=useState(false);
  const[nuevaCatModal,setNuevaCatModal]=useState(false);
  const[nuevaCat,setNuevaCat]=useState("");
  const[nuevoPagoModal,setNuevoPagoModal]=useState(false);

  const agregarCategoria=()=>{
    if(!nuevaCat.trim()){toast("Ingresá el nombre de la categoría");return;}
    if(cats.includes(nuevaCat.trim())){toast("Ya existe esa categoría");return;}
    const nuevas=[...cats,nuevaCat.trim()];
    setCats(nuevas);
    localStorage.setItem("amapola_cats_gastos",JSON.stringify(nuevas));
    setCat(nuevaCat.trim());
    setNuevaCat("");setNuevaCatModal(false);
    toast("Categoría creada ✓");
  };
  const[fecha,setFecha]=useState(hoyLocal());

  const guardar=async()=>{
    if(!cat||!monto){toast("Elegí una categoría e ingresá el monto");return false;}
    if(forma==="Efectivo"&&Number(monto)>saldo){toast("⚠️ Supera la caja disponible");return false;}
    setBusy(true);
    await saveGastos([...gastos,{id:uid(),tipo:"gasto",categoria:cat,monto:Number(monto),forma,obs:obs.trim(),fecha:fecha?fechaLocalISO(fecha):new Date().toISOString()}]);
    setBusy(false);setCat("");setMonto("");setObs("");setFecha(hoyLocal());toast("Pago registrado ✓");
    return true;
  };

  const totalMes=gastos.filter(g=>{const d=new Date(g.fecha);const n=new Date();return d.getMonth()===n.getMonth()&&d.getFullYear()===n.getFullYear();}).reduce((a,g)=>a+Number(g.monto||0),0);

  return(<>
    <ST>Pagos Digitales</ST><SS>Registrá pagos fijos del negocio (alquiler, servicios, impuestos...).</SS>
    <div style={{background:"#2C1A0E",borderRadius:14,padding:"18px 20px",marginBottom:16}}>
      <div style={{fontSize:".65rem",letterSpacing:".08em",textTransform:"uppercase",color:"#E8DCC8",opacity:.7}}>Caja disponible</div>
      <div style={{fontFamily:"Georgia,serif",fontSize:"2rem",color:"#E8DCC8",margin:"4px 0 0"}}>{fmt(saldo)}</div>
      <div style={{fontSize:".72rem",color:"#E8DCC8",opacity:.6,marginTop:4}}>Pagado este mes: <strong style={{color:"#f5b7b1"}}>{fmt(totalMes)}</strong></div>
    </div>

    <Btn bg="#7B7063" onClick={()=>setNuevoPagoModal(true)}>+ Registrar pago</Btn>

    {nuevoPagoModal&&(
      <div style={{position:"fixed",inset:0,background:"rgba(44,26,14,.65)",zIndex:500,display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
        <div style={{background:"#fff",borderRadius:"20px 20px 0 0",padding:"24px 20px 40px",width:"100%",maxWidth:460,maxHeight:"92dvh",overflowY:"auto"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
            <p style={{fontFamily:"Georgia,serif",fontSize:"1.1rem"}}>Nuevo pago digital</p>
            <button onClick={()=>setNuevoPagoModal(false)} style={{background:"none",border:"none",fontSize:"1.3rem",color:"#7B7063",cursor:"pointer",padding:4,lineHeight:1}}>✕</button>
          </div>

          {nuevaCatModal&&(
            <div style={{position:"fixed",inset:0,background:"rgba(44,26,14,.65)",zIndex:600,display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
              <div style={{background:"#fff",borderRadius:"20px 20px 0 0",padding:"28px 20px 44px",width:"100%",maxWidth:460}}>
                <p style={{fontFamily:"Georgia,serif",fontSize:"1.1rem",marginBottom:16}}>Nueva categoría</p>
                <input value={nuevaCat} onChange={e=>setNuevaCat(e.target.value)} placeholder="Ej: Seguro, Contador, ..."
                  autoFocus onKeyDown={e=>e.key==="Enter"&&agregarCategoria()}
                  style={{...iS,marginBottom:16}}/>
                <div style={{display:"flex",gap:10}}>
                  <button onClick={()=>{setNuevaCatModal(false);setNuevaCat("");}} style={{flex:1,padding:12,borderRadius:10,border:"none",background:"#E8DCC8",fontWeight:600,cursor:"pointer"}}>Cancelar</button>
                  <button onClick={agregarCategoria} style={{flex:1,padding:12,borderRadius:10,border:"none",background:"#7B7063",color:"#fff",fontWeight:600,cursor:"pointer"}}>Crear</button>
                </div>
              </div>
            </div>
          )}
          <Field label="Categoría">
            <div style={{display:"flex",gap:8}}>
              <select value={cat} onChange={e=>setCat(e.target.value)} style={{...sS,flex:1}}>
                <option value="">— Elegí una categoría —</option>
                {cats.map(c=><option key={c} value={c}>{c}</option>)}
              </select>
              <button onClick={()=>setNuevaCatModal(true)} title="Nueva categoría"
                style={{padding:"10px 14px",border:"1.5px solid #E8DCC8",borderRadius:8,background:"#F9F6F1",fontSize:"1.1rem",cursor:"pointer",flexShrink:0}}>+</button>
            </div>
          </Field>
          <Field label="Monto ($)"><Inp type="number" value={monto} onChange={setMonto} placeholder="0"/></Field>
          <Field label="Forma de pago">
            <select value={forma} onChange={e=>setForma(e.target.value)} style={sS}>
              <option value="Efectivo">Efectivo (descuenta de caja)</option>
              <option value="Transferencia">Transferencia (solo registro)</option>
            </select>
          </Field>
          {forma==="Efectivo"&&<div style={{fontSize:".78rem",color:"#2D6A4F",background:"#EAF5F0",borderRadius:8,padding:"8px 10px",marginTop:8}}>💵 Este pago descontará de la caja disponible.</div>}
          <Field label="Observaciones"><TA value={obs} onChange={setObs} placeholder="Ej: mes de junio, cuota..."/></Field>
          <Field label="Fecha del registro"><Inp type="date" value={fecha} onChange={setFecha}/></Field>
          <Btn bg="#7B7063" onClick={async()=>{if(await guardar())setNuevoPagoModal(false);}} disabled={busy}>{busy?"Guardando…":"Registrar pago"}</Btn>
        </div>
      </div>
    )}

    <LibroDiarioGastos gastos={gastos} saveGastos={saveGastos}/>
  </>);
}



function LibroDiarioGastos({gastos,saveGastos}){
  const hoy=new Date();
  const iso=d=>d.toISOString().slice(0,10);
  const inicioMes=new Date(hoy.getFullYear(),hoy.getMonth(),1);
  const[filtroFecha,setFiltroFecha]=useState("mes");
  const[desde,setDesde]=useState(iso(inicioMes));
  const[hasta,setHasta]=useState(iso(hoy));
  const[filtroForma,setFiltroForma]=useState("todo");
  const[filtroCat,setFiltroCat]=useState("todo");
  const[editItem,setEditItem]=useState(null);
  const[editForm,setEditForm]=useState({});
  const[confElim,setConfElim]=useState(null);
  const[busyEdit,setBusyEdit]=useState(false);

  const abrirEditar=g=>{
    setEditItem(g);
    setEditForm({categoria:g.categoria||"",monto:String(g.monto),forma:g.forma||"Efectivo",obs:g.obs||"",fecha:g.fecha.slice(0,10)});
  };
  const guardarEdicion=async()=>{
    if(!editForm.categoria||!editForm.monto){toast("Completá categoría y monto");return;}
    setBusyEdit(true);
    const nf=editForm.fecha?fechaLocalISO(editForm.fecha):editItem.fecha;
    await saveGastos(gastos.map(g=>g.id===editItem.id?{...g,categoria:editForm.categoria,monto:Number(editForm.monto),forma:editForm.forma,obs:editForm.obs,fecha:nf}:g));
    setBusyEdit(false);setEditItem(null);toast("Actualizado ✓");
  };
  const eliminar=async()=>{
    const g=confElim;setConfElim(null);
    await saveGastos(gastos.filter(x=>x.id!==g.id));
    toast("Eliminado ✓");
  };

  const allMovs=[...gastos].sort((a,b)=>a.fecha.localeCompare(b.fecha));
  const categoriasPresentes=[...new Set(gastos.map(g=>g.categoria).filter(Boolean))].sort();

  const desdeF=filtroFecha==="mes"?iso(inicioMes):filtroFecha==="hoy"?iso(hoy):desde;
  const hastaF=filtroFecha==="mes"?iso(hoy):filtroFecha==="hoy"?iso(hoy):hasta;

  const filtrados=allMovs
    .filter(m=>{const f=m.fecha.slice(0,10);return(!desdeF||f>=desdeF)&&(!hastaF||f<=hastaF);})
    .filter(m=>filtroForma==="todo"||m.forma===filtroForma)
    .filter(m=>filtroCat==="todo"||m.categoria===filtroCat);

  const filtradosAsc=[...filtrados].sort((a,b)=>a.fecha.localeCompare(b.fecha));
  let saldoAcum=0;
  const filasAsc=filtradosAsc.map(m=>{
    saldoAcum-=Number(m.monto||0);
    return{...m,_saldo:saldoAcum};
  });
  const filas=[...filasAsc].reverse();

  const totalEf=filtradosAsc.filter(m=>m.forma==="Efectivo").reduce((s,m)=>s+Number(m.monto||0),0);
  const totalTr=filtradosAsc.filter(m=>m.forma==="Transferencia").reduce((s,m)=>s+Number(m.monto||0),0);
  const totalGen=totalEf+totalTr;

  return(
    <div style={{background:"#fff",borderRadius:14,padding:20,boxShadow:"0 2px 12px rgba(44,26,14,.08)",marginTop:16}}>
      <div style={{fontSize:".68rem",fontWeight:700,letterSpacing:".09em",textTransform:"uppercase",color:"#7B7063",marginBottom:14}}>📒 Libro diario · Pagos Digitales</div>

      {/* FILTROS FECHA */}
      <div style={{display:"flex",gap:6,marginBottom:10,flexWrap:"wrap"}}>
        {[["hoy","Hoy"],["mes","Este mes"],["custom","Personalizado"]].map(([v,l])=>(
          <button key={v} onClick={()=>{setFiltroFecha(v);if(v==="mes"){setDesde(iso(inicioMes));setHasta(iso(hoy));}if(v==="hoy"){setDesde(iso(hoy));setHasta(iso(hoy));}}}
            style={{padding:"5px 12px",borderRadius:20,border:"none",cursor:"pointer",fontSize:".72rem",fontWeight:600,background:filtroFecha===v?"#2C1A0E":"#E8DCC8",color:filtroFecha===v?"#E8DCC8":"#2C1A0E"}}>{l}</button>
        ))}
      </div>
      {filtroFecha==="custom"&&(
        <div style={{display:"flex",gap:8,marginBottom:10}}>
          <div style={{flex:1}}>
            <label style={{display:"block",fontSize:".7rem",fontWeight:600,color:"#7B7063",marginBottom:3}}>Desde</label>
            <input type="date" value={desde} onChange={e=>setDesde(e.target.value)} style={{...iS,fontSize:".82rem",padding:"7px 10px"}}/>
          </div>
          <div style={{flex:1}}>
            <label style={{display:"block",fontSize:".7rem",fontWeight:600,color:"#7B7063",marginBottom:3}}>Hasta</label>
            <input type="date" value={hasta} onChange={e=>setHasta(e.target.value)} style={{...iS,fontSize:".82rem",padding:"7px 10px"}}/>
          </div>
        </div>
      )}

      {/* FILTRO FORMA */}
      <div style={{display:"flex",gap:6,marginBottom:10,flexWrap:"wrap"}}>
        {[["todo","Todo"],["Efectivo","Efectivo"],["Transferencia","Transferencia"]].map(([v,l])=>(
          <button key={v} onClick={()=>setFiltroForma(v)}
            style={{padding:"4px 10px",borderRadius:20,border:"1px solid #E8DCC8",cursor:"pointer",fontSize:".7rem",fontWeight:600,background:filtroForma===v?"#2C1A0E":"transparent",color:filtroForma===v?"#E8DCC8":"#7B7063"}}>{l}</button>
        ))}
      </div>

      {/* FILTRO CATEGORÍA */}
      {categoriasPresentes.length>0&&(
        <div style={{marginBottom:12}}>
          <select value={filtroCat} onChange={e=>setFiltroCat(e.target.value)} style={{...sS,fontSize:".8rem"}}>
            <option value="todo">Todas las categorías</option>
            {categoriasPresentes.map(c=><option key={c} value={c}>{c}</option>)}
          </select>
        </div>
      )}

      {/* RESUMEN */}
      {filas.length>0&&(
        <div style={{display:"flex",gap:8,marginBottom:12}}>
          {[["💵 Efectivo",fmt(totalEf),"#C0392B"],["🏦 Transferencia",fmt(totalTr),"#B7860B"],["Total",fmt(totalGen),"#2C1A0E"]].map(([l,v,c])=>(
            <div key={l} style={{flex:1,background:"#F9F6F1",borderRadius:10,padding:"8px 10px",textAlign:"center"}}>
              <div style={{fontSize:".6rem",color:"#7B7063",textTransform:"uppercase",letterSpacing:".04em"}}>{l}</div>
              <div style={{fontWeight:700,fontSize:".85rem",color:c,marginTop:2}}>{v}</div>
            </div>
          ))}
        </div>
      )}

      {/* TABLA */}
      {!filas.length?<Empty icon="🏠">Sin gastos en el período</Empty>:(
        <div style={{overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:".75rem",minWidth:360}}>
            <thead>
              <tr style={{background:"#F9F6F1"}}>
                {["Fecha","Categoría","Forma","Monto",""].map(h=>(
                  <th key={h||"acc"} style={{padding:"7px 8px",textAlign:h==="Monto"?"right":h===""?"center":"left",fontWeight:700,color:"#7B7063",fontSize:".63rem",letterSpacing:".05em",textTransform:"uppercase",borderBottom:"2px solid #E8DCC8",whiteSpace:"nowrap"}}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {filas.map((g,i)=>(
                <tr key={g.id} style={{background:i%2===0?"#fff":"#F9F6F1"}}>
                  <td style={{padding:"6px 8px",whiteSpace:"nowrap",color:"#7B7063",fontSize:".72rem"}}>
                    {fmtF(g.fecha)}<br/><span style={{fontSize:".62rem"}}>{fmtH(g.fecha)}</span>
                  </td>
                  <td style={{padding:"6px 8px"}}>
                    <div style={{fontWeight:600,fontSize:".78rem"}}>{g.categoria}</div>
                    {g.obs&&<div style={{fontSize:".65rem",color:"#7B7063"}}>{g.obs}</div>}
                  </td>
                  <td style={{padding:"6px 8px"}}>
                    <span style={{background:g.forma==="Efectivo"?"#EAF5F0":"#FEF9E7",color:g.forma==="Efectivo"?"#2D6A4F":"#B7860B",borderRadius:6,padding:"2px 8px",fontSize:".68rem",fontWeight:600}}>
                      {g.forma==="Efectivo"?"💵 Ef.":"🏦 Transf."}
                    </span>
                  </td>
                  <td style={{padding:"6px 8px",textAlign:"right",fontWeight:700,color:"#C0392B",whiteSpace:"nowrap"}}>{fmt(g.monto)}</td>
                  <td style={{padding:"6px 8px"}}>
                    <div style={{display:"flex",gap:4,justifyContent:"center"}}>
                      <button onClick={()=>abrirEditar(g)} style={{background:"#EAF5F0",border:"none",borderRadius:6,color:"#2D6A4F",fontSize:".6rem",fontWeight:600,cursor:"pointer",padding:"3px 6px"}}>✏️</button>
                      <button onClick={()=>setConfElim(g)} style={{background:"#FFF0EF",border:"none",borderRadius:6,color:"#E74C3C",fontSize:".6rem",fontWeight:600,cursor:"pointer",padding:"3px 6px"}}>✕</button>
                    </div>
                  </td>
                </tr>
              ))}
              <tr style={{background:"#2C1A0E"}}>
                <td colSpan={3} style={{padding:"8px 10px",color:"#E8DCC8",fontWeight:700,fontSize:".76rem"}}>TOTAL</td>
                <td style={{padding:"8px",textAlign:"right",color:"#f5b7b1",fontWeight:700,whiteSpace:"nowrap"}}>{fmt(totalGen)}</td>
                <td/>
              </tr>
            </tbody>
          </table>
        </div>
      )}

      {editItem&&(
        <div style={{position:"fixed",inset:0,background:"rgba(44,26,14,.65)",zIndex:500,display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
          <div style={{background:"#fff",borderRadius:"20px 20px 0 0",padding:"24px 20px 40px",width:"100%",maxWidth:460,maxHeight:"88dvh",overflowY:"auto"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
              <p style={{fontFamily:"Georgia,serif",fontSize:"1.1rem"}}>✏️ Editar pago digital</p>
              <button onClick={()=>setEditItem(null)} style={{background:"none",border:"none",fontSize:"1.4rem",cursor:"pointer",color:"#7B7063"}}>✕</button>
            </div>
            <Field label="Categoría">
              <input list="cats-libro-gastos" value={editForm.categoria||""} onChange={e=>setEditForm(f=>({...f,categoria:e.target.value}))} style={iS}/>
              <datalist id="cats-libro-gastos">{categoriasPresentes.map(c=><option key={c} value={c}/>)}</datalist>
            </Field>
            <Field label="Monto ($)"><Inp type="number" value={editForm.monto||""} onChange={v=>setEditForm(f=>({...f,monto:v}))}/></Field>
            <Field label="Forma de pago">
              <select value={editForm.forma||"Efectivo"} onChange={e=>setEditForm(f=>({...f,forma:e.target.value}))} style={sS}>
                <option value="Efectivo">Efectivo</option>
                <option value="Transferencia">Transferencia</option>
              </select>
            </Field>
            <Field label="Observaciones"><TA value={editForm.obs||""} onChange={v=>setEditForm(f=>({...f,obs:v}))}/></Field>
            <Field label="Fecha"><Inp type="date" value={editForm.fecha||""} onChange={v=>setEditForm(f=>({...f,fecha:v}))}/></Field>
            <div style={{display:"flex",gap:10,marginTop:8}}>
              <button onClick={()=>setEditItem(null)} style={{flex:1,padding:12,borderRadius:10,border:"none",background:"#E8DCC8",fontWeight:600,cursor:"pointer"}}>Cancelar</button>
              <button onClick={guardarEdicion} disabled={busyEdit} style={{flex:1,padding:12,borderRadius:10,border:"none",background:"#2D6A4F",color:"#fff",fontWeight:600,cursor:"pointer"}}>{busyEdit?"Guardando…":"Guardar"}</button>
            </div>
          </div>
        </div>
      )}

      {confElim&&(
        <div style={{position:"fixed",inset:0,background:"rgba(44,26,14,.65)",zIndex:500,display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
          <div style={{background:"#fff",borderRadius:"20px 20px 0 0",padding:"28px 20px 44px",width:"100%",maxWidth:460}}>
            <p style={{fontFamily:"Georgia,serif",fontSize:"1.1rem",marginBottom:8}}>⚠️ Eliminar registro</p>
            <p style={{fontSize:".85rem",color:"#7B7063",marginBottom:16}}>{confElim.categoria} · {fmt(confElim.monto)} · {fmtF(confElim.fecha)}</p>
            <div style={{display:"flex",gap:10}}>
              <button onClick={()=>setConfElim(null)} style={{flex:1,padding:12,borderRadius:10,border:"none",background:"#E8DCC8",fontWeight:600,cursor:"pointer"}}>Cancelar</button>
              <button onClick={eliminar} style={{flex:1,padding:12,borderRadius:10,border:"none",background:"#C0392B",color:"#fff",fontWeight:600,cursor:"pointer"}}>Eliminar</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function TabStock({stock,saveStock,catalogo,saveCatalogo,pedidos,savePedidos,subInicial,desperdicios,saveDesperdicios,registradoPor}){
  const[sub,setSub]=useState(subInicial||"inventario");
  const SUBS=[{id:"inventario",label:"📋 Inventario"},{id:"produccion",label:"🍳 Producción"},{id:"desperdicios",label:"🗑️ Desperdicios"},{id:"catalogo",label:"🗂️ Catálogo"},{id:"pedidos",label:"🧾 Pedidos"}];
  const proveedoresCat=[...new Set(catalogo.map(c=>c.proveedor))].sort();
  const stockBajo=stock.filter(s=>Number(s.minimo)>0&&Number(s.cantidad)<=Number(s.minimo));

  return(<>
    <ST help={"El módulo de Stock tiene cinco secciones:\n\n📋 Inventario: listado de productos con cantidad actual, mínimo y alertas de stock bajo.\n\n🍳 Producción: exclusivo para cocina. Registrá cuánto se produjo de cada producto interno del día.\n\n🗑️ Desperdicios: registrá lo que se tira o se rompe, para saber cuánto se pierde.\n\n🗂️ Catálogo: base de todos los productos e insumos por proveedor.\n\n🧾 Pedidos: generá pedidos a proveedores con seguimiento de estado."}>Stock</ST><SS>Control de inventario, catálogo de insumos y pedidos a proveedores.</SS>
    {registradoPor&&<div style={{fontSize:".72rem",color:"#7B7063",marginTop:-12,marginBottom:16}}>Cargando como <strong>{registradoPor}</strong></div>}
    {stockBajo.length>0&&sub!=="inventario"&&(
      <div onClick={()=>setSub("inventario")} style={{background:"#FFF0EF",border:"1px solid #f5b7b1",borderRadius:12,padding:"10px 14px",marginBottom:16,cursor:"pointer",display:"flex",alignItems:"center",gap:8}}>
        <span style={{fontSize:"1rem"}}>⚠️</span>
        <span style={{fontSize:".8rem",color:"#C0392B",fontWeight:600}}>{stockBajo.length} producto{stockBajo.length!==1?"s":""} con stock bajo · Ver inventario</span>
      </div>
    )}
    <div style={{display:"flex",gap:6,marginBottom:18,flexWrap:"wrap"}}>
      {SUBS.map(s=>(
        <button key={s.id} onClick={()=>setSub(s.id)} style={{flex:"1 1 auto",padding:"9px 8px",borderRadius:10,border:"none",background:sub===s.id?"#2C1A0E":"#E8DCC8",color:sub===s.id?"#fff":"#2C1A0E",fontSize:".74rem",fontWeight:600,cursor:"pointer"}}>{s.label}</button>
      ))}
    </div>
    {sub==="inventario"&&<StockInventario stock={stock} saveStock={saveStock} catalogo={catalogo} proveedoresCat={proveedoresCat} registradoPor={registradoPor}/>}
    {sub==="produccion"&&<StockProduccion stock={stock} saveStock={saveStock} catalogo={catalogo} registradoPor={registradoPor}/>}
    {sub==="desperdicios"&&<StockDesperdicios stock={stock} saveStock={saveStock} desperdicios={desperdicios} saveDesperdicios={saveDesperdicios} registradoPor={registradoPor}/>}
    {sub==="catalogo"&&<StockCatalogo catalogo={catalogo} saveCatalogo={saveCatalogo} proveedoresCat={proveedoresCat}/>}
    {sub==="pedidos"&&<StockPedidos catalogo={catalogo} proveedoresCat={proveedoresCat} pedidos={pedidos} savePedidos={savePedidos} registradoPor={registradoPor}/>}
  </>);
}

function StockInventario({stock,saveStock,catalogo,proveedoresCat,registradoPor}){
  const[provSel,setProvSel]=useState("");
  const[catId,setCatId]=useState("");
  const[cantidad,setCantidad]=useState("");
  const[minimo,setMinimo]=useState("");
  const[unidad,setUnidad]=useState("unidades");
  const[busy,setBusy]=useState(false);
  const[editId,setEditId]=useState(null);
  const[movModal,setMovModal]=useState(null);
  const[movCant,setMovCant]=useState("");
  const[movTipo,setMovTipo]=useState("entrada");
  const[movObs,setMovObs]=useState("");

  const productosDelProv=provSel?catalogo.filter(c=>c.proveedor===provSel):[];
  const catSel=catalogo.find(c=>c.id===catId);

  const limpiar=()=>{setEditId(null);setProvSel("");setCatId("");setCantidad("");setMinimo("");setUnidad("unidades");};

  const guardarProducto=async()=>{
    if(!editId&&!catId){toast("Elegí un producto del catálogo");return;}
    if(!cantidad){toast("Completá la cantidad");return;}
    setBusy(true);
    if(editId){
      const nuevos=stock.map(s=>s.id===editId?{...s,cantidad:Number(cantidad),minimo:Number(minimo)||0,unidad}:s);
      await saveStock(nuevos);toast("Producto actualizado ✓");
    }else{
      const nuevo={id:uid(),catalogoId:catSel.id,nombre:catSel.producto,proveedor:catSel.proveedor,sector:catSel.sector,cantidad:Number(cantidad),minimo:Number(minimo)||0,unidad,movimientos:[],fecha:new Date().toISOString(),registradoPor:registradoPor||null};
      await saveStock([...stock,nuevo]);
      toast("Producto agregado ✓");
    }
    setBusy(false);limpiar();
  };

  const registrarMovimiento=async()=>{
    if(!movCant||Number(movCant)<=0){toast("Ingresá una cantidad válida");return;}
    const item=movModal;
    const delta=movTipo==="entrada"?Number(movCant):-Number(movCant);
    const nuevaCant=Math.max(0,item.cantidad+delta);
    const mov={id:uid(),tipo:movTipo,cantidad:Number(movCant),obs:movObs.trim(),fecha:new Date().toISOString(),registradoPor:registradoPor||null};
    const nuevos=stock.map(s=>s.id===item.id?{...s,cantidad:nuevaCant,movimientos:[mov,...(s.movimientos||[])].slice(0,20)}:s);
    await saveStock(nuevos);
    toast(movTipo==="entrada"?"Entrada registrada ✓":"Salida registrada ✓");
    setMovModal(null);setMovCant("");setMovObs("");
  };

  const eliminar=async id=>{
    if(!confirm("¿Eliminar este producto del inventario?"))return;
    await saveStock(stock.filter(s=>s.id!==id));toast("Eliminado");
  };

  const editar=s=>{
    setEditId(s.id);setProvSel(s.proveedor||"");setCatId(s.catalogoId||"");
    setCantidad(String(s.cantidad));setMinimo(String(s.minimo||""));setUnidad(s.unidad||"unidades");
    window.scrollTo({top:0,behavior:"smooth"});
  };

  const conAlerta=stock.filter(s=>Number(s.cantidad)<=Number(s.minimo)&&Number(s.minimo)>0);

  return(<>
    {conAlerta.length>0&&(
      <div style={{background:"#FFF0EF",border:"1px solid #f5b7b1",borderRadius:12,padding:"12px 16px",marginBottom:16}}>
        <div style={{fontWeight:700,fontSize:".82rem",color:"#C0392B",marginBottom:6}}>⚠️ Stock bajo en {conAlerta.length} producto{conAlerta.length!==1?"s":""}</div>
        {conAlerta.map(s=>(
          <div key={s.id} style={{fontSize:".78rem",color:"#C0392B",padding:"2px 0"}}>
            · {s.nombre}: {s.cantidad} {s.unidad} (mín: {s.minimo})
          </div>
        ))}
      </div>
    )}

    {movModal&&(
      <div style={{position:"fixed",inset:0,background:"rgba(44,26,14,.65)",zIndex:500,display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
        <div style={{background:"#fff",borderRadius:"20px 20px 0 0",padding:"24px 20px 44px",width:"100%",maxWidth:460}}>
          <p style={{fontFamily:"Georgia,serif",fontSize:"1.1rem",marginBottom:4}}>{movModal.nombre}</p>
          <p style={{fontSize:".78rem",color:"#7B7063",marginBottom:16}}>Stock actual: <strong>{movModal.cantidad} {movModal.unidad}</strong></p>
          <div style={{display:"flex",gap:8,marginBottom:14}}>
            {["entrada","salida"].map(t=>(
              <button key={t} onClick={()=>setMovTipo(t)} style={{flex:1,padding:10,borderRadius:10,border:"none",background:movTipo===t?(t==="entrada"?"#2D6A4F":"#C0392B"):"#E8DCC8",color:movTipo===t?"#fff":"#2C1A0E",fontWeight:600,cursor:"pointer",textTransform:"capitalize"}}>
                {t==="entrada"?"📥 Entrada":"📤 Salida"}
              </button>
            ))}
          </div>
          <Field label={`Cantidad (${movModal.unidad})`}><Inp type="number" value={movCant} onChange={setMovCant} placeholder="0"/></Field>
          <Field label="Observaciones"><TA value={movObs} onChange={setMovObs} placeholder="Ej: compra del día, venta..."/></Field>
          <div style={{display:"flex",gap:10,marginTop:18}}>
            <button onClick={()=>{setMovModal(null);setMovCant("");setMovObs("");}} style={{flex:1,padding:12,borderRadius:10,border:"none",background:"#E8DCC8",fontWeight:600,cursor:"pointer"}}>Cancelar</button>
            <button onClick={registrarMovimiento} style={{flex:1,padding:12,borderRadius:10,border:"none",background:movTipo==="entrada"?"#2D6A4F":"#C0392B",color:"#fff",fontWeight:600,cursor:"pointer"}}>Confirmar</button>
          </div>
        </div>
      </div>
    )}

    <Card title={editId?"Editar producto":"Agregar producto al inventario"}>
      {!editId&&(
        <Field label="Proveedor">
          <select value={provSel} onChange={e=>{setProvSel(e.target.value);setCatId("");}} style={sS}>
            <option value="">— Elegí un proveedor —</option>
            {proveedoresCat.map(p=><option key={p} value={p}>{p}</option>)}
          </select>
        </Field>
      )}
      {!editId&&(
        <Field label="Producto">
          <select value={catId} onChange={e=>{const id=e.target.value;setCatId(id);const c=catalogo.find(x=>x.id===id);if(c)setUnidad(c.unidad||"unidades");}} style={sS} disabled={!provSel}>
            <option value="">{provSel?"— Elegí un producto —":"Elegí primero un proveedor"}</option>
            {productosDelProv.map(c=><option key={c.id} value={c.id}>{c.producto} ({c.sector})</option>)}
          </select>
        </Field>
      )}
      {provSel&&!productosDelProv.length&&!editId&&(
        <p style={{fontSize:".74rem",color:"#7B7063",marginTop:6}}>Este proveedor no tiene productos cargados. Agregalos desde la pestaña 🗂️ Catálogo.</p>
      )}
      {editId&&<p style={{fontSize:".82rem",color:"#7B7063",marginTop:8}}>Editando: <strong>{stock.find(s=>s.id===editId)?.nombre}</strong></p>}
      <div style={{display:"flex",gap:8,marginTop:14}}>
        <div style={{flex:1}}>
          <label style={{display:"block",fontSize:".78rem",fontWeight:600,color:"#2C1A0E",marginBottom:5}}>Cantidad actual</label>
          <Inp type="number" value={cantidad} onChange={setCantidad} placeholder="0"/>
        </div>
        <div style={{flex:1}}>
          <label style={{display:"block",fontSize:".78rem",fontWeight:600,color:"#2C1A0E",marginBottom:5}}>Stock mínimo</label>
          <Inp type="number" value={minimo} onChange={setMinimo} placeholder="0"/>
        </div>
      </div>
      <Field label="Unidad de medida">
        <select value={unidad} onChange={e=>setUnidad(e.target.value)} style={sS}>
          {["unidades","kg","g","litros","ml","cajas","bolsas","porciones"].map(u=><option key={u} value={u}>{u}</option>)}
        </select>
      </Field>
      <div style={{display:"flex",gap:8,marginTop:18}}>
        {editId&&<button onClick={limpiar} style={{flex:1,padding:13,borderRadius:10,border:"none",background:"#E8DCC8",fontWeight:600,cursor:"pointer"}}>Cancelar</button>}
        <Btn bg={editId?"#555":"#2C1A0E"} onClick={guardarProducto} disabled={busy}>{busy?"Guardando…":editId?"Actualizar":"Agregar al inventario"}</Btn>
      </div>
    </Card>

    {!stock.length?<Empty icon="📦">Todavía no registraste productos en el inventario</Empty>:stock.map(s=>{
      const alerta=Number(s.cantidad)<=Number(s.minimo)&&Number(s.minimo)>0;
      const pct=s.minimo>0?Math.min(100,(s.cantidad/s.minimo)*100):100;
      return(
        <div key={s.id} style={{background:"#fff",borderRadius:12,padding:16,marginBottom:10,boxShadow:"0 2px 10px rgba(44,26,14,.07)",border:alerta?"1.5px solid #f5b7b1":"1.5px solid transparent"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
            <div>
              <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
                <div style={{fontWeight:700,fontSize:".95rem"}}>{s.nombre}</div>
                {alerta&&<span style={{background:"#FFF0EF",color:"#C0392B",fontSize:".6rem",fontWeight:700,padding:"2px 6px",borderRadius:20}}>⚠️ BAJO</span>}
              </div>
              <div style={{fontSize:".73rem",color:"#7B7063",marginTop:2}}>{s.proveedor?`${s.proveedor} · `:""}Mínimo: {s.minimo} {s.unidad}</div>
            </div>
            <div style={{textAlign:"right"}}>
              <div style={{fontFamily:"Georgia,serif",fontSize:"1.4rem",color:alerta?"#C0392B":"#2D6A4F"}}>{s.cantidad}</div>
              <div style={{fontSize:".72rem",color:"#7B7063"}}>{s.unidad}</div>
            </div>
          </div>
          {s.minimo>0&&<div style={{margin:"10px 0 0",background:"#F9F6F1",borderRadius:4,height:5,overflow:"hidden"}}><div style={{height:"100%",width:Math.min(100,pct)+"%",background:alerta?"#C0392B":"#2D6A4F",borderRadius:4}}/></div>}
          <div style={{display:"flex",gap:8,marginTop:12,flexWrap:"wrap"}}>
            <button onClick={()=>{setMovModal(s);setMovTipo("entrada");}} style={{padding:"6px 12px",border:"none",borderRadius:8,background:"#EAF5F0",color:"#2D6A4F",fontSize:".76rem",fontWeight:600,cursor:"pointer"}}>📥 Entrada</button>
            <button onClick={()=>{setMovModal(s);setMovTipo("salida");}} style={{padding:"6px 12px",border:"none",borderRadius:8,background:"#FFF0EF",color:"#C0392B",fontSize:".76rem",fontWeight:600,cursor:"pointer"}}>📤 Salida</button>
            <SmBtn onClick={()=>editar(s)}>Editar</SmBtn>
            <SmBtn color="#C0392B" onClick={()=>eliminar(s.id)}>Eliminar</SmBtn>
          </div>
        </div>
      );
    })}
  </>);
}

function StockProduccion({stock,saveStock,catalogo,registradoPor}){
  const[prodId,setProdId]=useState("");
  const[cantidad,setCantidad]=useState("");
  const[obs,setObs]=useState("");
  const[busy,setBusy]=useState(false);
  const[fecha,setFecha]=useState(hoyLocal());

  // Solo productos del proveedor INTERNO
  const productosInternos=catalogo.filter(c=>norm(c.proveedor)==="interno")
    .slice().sort((a,b)=>a.producto.localeCompare(b.producto));

  const registrar=async()=>{
    if(!prodId){toast("Elegí un producto");return;}
    if(!cantidad||Number(cantidad)<=0){toast("Ingresá la cantidad producida");return;}
    setBusy(true);
    const prod=productosInternos.find(c=>c.id===prodId);
    const fechaISO=fecha?fechaLocalISO(fecha):new Date().toISOString();
    const stockActual=[...stock];
    const idx=stockActual.findIndex(s=>s.catalogoId===prodId);
    const mov={id:uid(),tipo:"entrada",origen:"produccion",cantidad:Number(cantidad),obs:obs.trim()||"Producción del día",fecha:fechaISO,registradoPor:registradoPor||null};
    if(idx>=0){
      stockActual[idx]={...stockActual[idx],cantidad:stockActual[idx].cantidad+Number(cantidad),movimientos:[mov,...(stockActual[idx].movimientos||[])].slice(0,50)};
    }else{
      stockActual.push({id:uid(),catalogoId:prodId,nombre:prod.producto,proveedor:"INTERNO",sector:prod.sector||"COCINA",cantidad:Number(cantidad),minimo:0,unidad:prod.unidad||"unidades",movimientos:[mov],fecha:fechaISO,registradoPor:registradoPor||null});
    }
    await saveStock(stockActual);
    toast(`✓ ${prod.producto}: +${cantidad} ${prod.unidad||"unidades"} registradas`);
    setBusy(false);setProdId("");setCantidad("");setObs("");setFecha(hoyLocal());
  };

  if(!productosInternos.length)return(
    <Empty icon="🍳">No hay productos internos en el catálogo. Agregá productos con proveedor INTERNO desde 🗂️ Catálogo.</Empty>
  );

  // Producción de hoy
  const hoyStr=hoyLocal();
  const prodHoy=stock.filter(s=>s.proveedor==="INTERNO"&&(s.movimientos||[]).some(m=>m.origen==="produccion"&&m.fecha&&m.fecha.slice(0,10)===hoyStr));

  return(<>
    <Card title="Registrar producción">
      <p style={{fontSize:".78rem",color:"#7B7063",marginBottom:14}}>Cargá cuánto se produjo hoy de cada producto interno. Suma automáticamente al stock.</p>
      <Field label="Producto">
        <select value={prodId} onChange={e=>setProdId(e.target.value)} style={sS}>
          <option value="">— Elegí un producto —</option>
          {productosInternos.map(c=><option key={c.id} value={c.id}>{c.producto} ({c.unidad||"unidades"})</option>)}
        </select>
      </Field>
      <Field label="Cantidad producida">
        <Inp type="number" value={cantidad} onChange={setCantidad} placeholder="0"/>
      </Field>
      <Field label="Observaciones (opcional)">
        <Inp value={obs} onChange={setObs} placeholder="Ej: tanda de la mañana"/>
      </Field>
      <Field label="Fecha"><Inp type="date" value={fecha} onChange={setFecha}/></Field>
      <Btn bg="#2D6A4F" onClick={registrar} disabled={busy}>{busy?"Guardando…":"Registrar producción"}</Btn>
    </Card>

    {prodHoy.length>0&&(
      <Card title="Producción registrada hoy">
        {prodHoy.map(s=>{
          const movsHoy=(s.movimientos||[]).filter(m=>m.origen==="produccion"&&m.fecha&&m.fecha.slice(0,10)===hoyStr);
          const totalHoy=movsHoy.reduce((acc,m)=>acc+m.cantidad,0);
          return(
            <div key={s.id} style={{padding:"10px 0",borderBottom:"1px solid #F2EAE0",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div>
                <div style={{fontWeight:600,fontSize:".88rem"}}>{s.nombre}</div>
                <div style={{fontSize:".72rem",color:"#7B7063"}}>{movsHoy.length} registro{movsHoy.length!==1?"s":""} hoy{movsHoy[0]?.registradoPor?` · ${movsHoy[0].registradoPor}`:""}</div>
              </div>
              <div style={{textAlign:"right"}}>
                <div style={{fontFamily:"Georgia,serif",fontSize:"1.2rem",color:"#2D6A4F"}}>+{totalHoy}</div>
                <div style={{fontSize:".68rem",color:"#7B7063"}}>{s.unidad}</div>
              </div>
            </div>
          );
        })}
      </Card>
    )}
  </>);
}

function StockCatalogo({catalogo,saveCatalogo,proveedoresCat}){
  const[provSel,setProvSel]=useState("");
  const[provNuevo,setProvNuevo]=useState("");
  const[mostrarNuevoProv,setMostrarNuevoProv]=useState(false);
  const[sector,setSector]=useState("COCINA");
  const[producto,setProducto]=useState("");
  const[unidad,setUnidad]=useState("unidades");
  const[filtroProv,setFiltroProv]=useState("");
  const[busy,setBusy]=useState(false);
  const UNIDADES=["unidades","kg","g","litros","ml","cajas","bolsas","porciones","paquetes"];

  const proveedorFinal=mostrarNuevoProv?provNuevo.trim().toUpperCase():provSel;

  const agregar=async()=>{
    if(!proveedorFinal){toast("Elegí o ingresá un proveedor");return;}
    if(!producto.trim()){toast("Ingresá el nombre del producto");return;}
    const yaExiste=catalogo.some(c=>norm(c.proveedor)===norm(proveedorFinal)&&norm(c.producto)===norm(producto));
    if(yaExiste){toast("Ese producto ya existe para ese proveedor");return;}
    setBusy(true);
    const nuevo={id:uid(),proveedor:proveedorFinal,sector,producto:producto.trim().toUpperCase(),unidad};
    await saveCatalogo([...catalogo,nuevo]);
    toast("Producto agregado al catálogo ✓");
    setBusy(false);setProducto("");setProvNuevo("");setMostrarNuevoProv(false);setUnidad("unidades");
  };

  const cambiarUnidad=async(id,nuevaUnidad)=>{
    await saveCatalogo(catalogo.map(c=>c.id===id?{...c,unidad:nuevaUnidad}:c));
  };

  const eliminar=async id=>{
    if(!confirm("¿Eliminar este producto del catálogo? (no afecta el inventario ya cargado)"))return;
    await saveCatalogo(catalogo.filter(c=>c.id!==id));toast("Eliminado");
  };

  const listado=(filtroProv?catalogo.filter(c=>c.proveedor===filtroProv):catalogo)
    .slice().sort((a,b)=>a.proveedor.localeCompare(b.proveedor)||a.producto.localeCompare(b.producto));

  return(<>
    <Card title="Agregar producto al catálogo">
      <Field label="Proveedor">
        {!mostrarNuevoProv?(
          <select value={provSel} onChange={e=>setProvSel(e.target.value)} style={sS}>
            <option value="">— Elegí un proveedor —</option>
            {proveedoresCat.map(p=><option key={p} value={p}>{p}</option>)}
          </select>
        ):(
          <Inp value={provNuevo} onChange={setProvNuevo} placeholder="Nombre del nuevo proveedor"/>
        )}
      </Field>
      <div style={{marginTop:6}}>
        <button onClick={()=>{setMostrarNuevoProv(!mostrarNuevoProv);setProvSel("");setProvNuevo("");}} style={{background:"none",border:"none",color:"#2D6A4F",fontSize:".74rem",fontWeight:600,cursor:"pointer",padding:0}}>
          {mostrarNuevoProv?"← Elegir de la lista":"+ Es un proveedor nuevo"}
        </button>
      </div>
      <Field label="Sector">
        <select value={sector} onChange={e=>setSector(e.target.value)} style={sS}>
          {["COCINA","FRONT","OTRO"].map(s=><option key={s} value={s}>{s}</option>)}
        </select>
      </Field>
      <Field label="Nombre del producto"><Inp value={producto} onChange={setProducto} placeholder="Ej: ACEITE X LITRO"/></Field>
      <Field label="Unidad de medida">
        <select value={unidad} onChange={e=>setUnidad(e.target.value)} style={sS}>
          {UNIDADES.map(u=><option key={u} value={u}>{u}</option>)}
        </select>
      </Field>
      <Btn onClick={agregar} disabled={busy}>{busy?"Guardando…":"Agregar al catálogo"}</Btn>
    </Card>

    <Card title="Catálogo cargado">
      <Field label="Filtrar por proveedor">
        <select value={filtroProv} onChange={e=>setFiltroProv(e.target.value)} style={sS}>
          <option value="">Todos los proveedores ({proveedoresCat.length})</option>
          {proveedoresCat.map(p=><option key={p} value={p}>{p}</option>)}
        </select>
      </Field>
    </Card>
    {(()=>{
      const grupos=[];
      listado.forEach(c=>{
        let g=grupos.find(g=>g.proveedor===c.proveedor);
        if(!g){g={proveedor:c.proveedor,items:[]};grupos.push(g);}
        g.items.push(c);
      });
      return(
        <div style={{background:"#fff",borderRadius:14,boxShadow:"0 2px 12px rgba(44,26,14,.08)",overflow:"hidden"}}>
          {grupos.map((g,gi)=>(
            <div key={g.proveedor}>
              <div style={{background:"#F4EEE3",padding:"9px 16px",borderTop:gi>0?"1px solid #E8DCC8":"none",borderBottom:"1px solid #E8DCC8",display:"flex",justifyContent:"space-between",alignItems:"baseline"}}>
                <span style={{fontFamily:"Georgia,serif",fontStyle:"italic",fontSize:".95rem",color:"#2C1A0E"}}>{g.proveedor}</span>
                <span style={{fontSize:".65rem",color:"#7B7063"}}>{g.items.length} producto{g.items.length!==1?"s":""}</span>
              </div>
              {g.items.map((c,i)=>(
                <div key={c.id} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 16px",borderBottom:"1px solid #F2EAE0"}}>
                  <span style={{fontSize:".68rem",color:"#B7A98F",width:22,flexShrink:0,fontVariantNumeric:"tabular-nums"}}>{i+1}.</span>
                  <span style={{flex:1,fontSize:".83rem",color:"#2C1A0E"}}>{c.producto}</span>
                  <select value={c.unidad||"unidades"} onChange={e=>cambiarUnidad(c.id,e.target.value)} style={{fontSize:".66rem",color:"#7B7063",border:"1px solid #E8DCC8",borderRadius:20,padding:"2px 6px",background:"#fff",flexShrink:0}}>
                    {UNIDADES.map(u=><option key={u} value={u}>{u}</option>)}
                  </select>
                  <span style={{fontSize:".62rem",color:"#7B7063",border:"1px solid #E8DCC8",borderRadius:20,padding:"2px 8px",flexShrink:0}}>{c.sector}</span>
                  <button onClick={()=>eliminar(c.id)} style={{background:"none",border:"none",color:"#C0392B",fontSize:".68rem",fontWeight:600,cursor:"pointer",padding:"2px 4px",flexShrink:0}}>Eliminar</button>
                </div>
              ))}
            </div>
          ))}
        </div>
      );
    })()}
  </>);
}

function StockPedidos({catalogo,proveedoresCat,pedidos,savePedidos,registradoPor}){
  const[provSel,setProvSel]=useState("");
  const[cants,setCants]=useState({});
  const[obs,setObs]=useState("");
  const[busy,setBusy]=useState(false);

  const productosDelProv=provSel?catalogo.filter(c=>c.proveedor===provSel):[];

  const crearPedido=async()=>{
    const items=productosDelProv.filter(c=>Number(cants[c.id])>0).map(c=>({producto:c.producto,cantidad:Number(cants[c.id])}));
    if(!provSel){toast("Elegí un proveedor");return;}
    if(!items.length){toast("Ingresá cantidad en al menos un producto");return;}
    setBusy(true);
    const nuevo={id:uid(),proveedor:provSel,fecha:new Date().toISOString(),items,obs:obs.trim(),estado:"pendiente",creadoPor:registradoPor||null};
    await savePedidos([nuevo,...pedidos]);
    toast("Pedido creado ✓");
    setBusy(false);setProvSel("");setCants({});setObs("");
  };

  const cambiarEstado=async(id,estado)=>{
    await savePedidos(pedidos.map(p=>p.id===id?{...p,estado}:p));
    toast("Pedido actualizado ✓");
  };

  const eliminar=async id=>{
    if(!confirm("¿Eliminar este pedido?"))return;
    await savePedidos(pedidos.filter(p=>p.id!==id));toast("Eliminado");
  };

  const colorEstado={pendiente:"#B7860B",enviado:"#2980B9",recibido:"#2D6A4F"};

  return(<>
    <Card title="Nuevo pedido a proveedor">
      <Field label="Proveedor">
        <select value={provSel} onChange={e=>{setProvSel(e.target.value);setCants({});}} style={sS}>
          <option value="">— Elegí un proveedor —</option>
          {proveedoresCat.map(p=><option key={p} value={p}>{p}</option>)}
        </select>
      </Field>
      {provSel&&(
        <div style={{marginTop:14,maxHeight:320,overflowY:"auto",border:"1px solid #E8DCC8",borderRadius:10,padding:10}}>
          {productosDelProv.map(c=>(
            <div key={c.id} style={{display:"flex",alignItems:"center",gap:8,padding:"6px 2px",borderBottom:"1px solid #F2EAE0"}}>
              <div style={{flex:1,fontSize:".8rem"}}>{c.producto}</div>
              <input type="number" min="0" value={cants[c.id]||""} onChange={e=>setCants({...cants,[c.id]:e.target.value})} placeholder="0" style={{width:64,border:"1.5px solid #E8DCC8",borderRadius:6,padding:"5px 6px",fontSize:".82rem",textAlign:"center"}}/>
            </div>
          ))}
        </div>
      )}
      <Field label="Observaciones (opcional)"><TA value={obs} onChange={setObs} placeholder="Ej: pedir para el jueves..."/></Field>
      <Btn onClick={crearPedido} disabled={busy}>{busy?"Guardando…":"Crear pedido"}</Btn>
    </Card>

    {!pedidos.length?<Empty icon="🧾">Todavía no creaste pedidos</Empty>:pedidos.map(p=>(
      <div key={p.id} style={{background:"#fff",borderRadius:12,padding:16,marginBottom:10,boxShadow:"0 2px 10px rgba(44,26,14,.07)"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
          <div>
            <div style={{fontWeight:700,fontSize:".9rem"}}>{p.proveedor}</div>
            <div style={{fontSize:".7rem",color:"#7B7063"}}>{fmtFL(p.fecha)}{p.creadoPor?` · ${p.creadoPor}`:""}</div>
          </div>
          <span style={{background:colorEstado[p.estado]+"22",color:colorEstado[p.estado],fontSize:".66rem",fontWeight:700,padding:"3px 9px",borderRadius:20,textTransform:"uppercase"}}>{p.estado}</span>
        </div>
        <div style={{marginTop:10,fontSize:".8rem",color:"#2C1A0E"}}>
          {p.items.map((it,i)=><div key={i} style={{padding:"2px 0"}}>· {it.producto} — <strong>{it.cantidad}</strong></div>)}
        </div>
        {p.obs&&<div style={{marginTop:8,fontSize:".76rem",color:"#7B7063",fontStyle:"italic"}}>{p.obs}</div>}
        <div style={{display:"flex",gap:8,marginTop:12,flexWrap:"wrap"}}>
          {p.estado!=="pendiente"&&<SmBtn onClick={()=>cambiarEstado(p.id,"pendiente")}>Marcar pendiente</SmBtn>}
          {p.estado!=="enviado"&&<SmBtn onClick={()=>cambiarEstado(p.id,"enviado")}>Marcar enviado</SmBtn>}
          {p.estado!=="recibido"&&<SmBtn onClick={()=>cambiarEstado(p.id,"recibido")}>Marcar recibido</SmBtn>}
          <SmBtn color="#C0392B" onClick={()=>eliminar(p.id)}>Eliminar</SmBtn>
        </div>
      </div>
    ))}
  </>);
}




function StockDesperdicios({stock,saveStock,desperdicios,saveDesperdicios,registradoPor}){
  const[itemId,setItemId]=useState("");
  const[cantidad,setCantidad]=useState("");
  const[motivo,setMotivo]=useState("Vencido");
  const[obs,setObs]=useState("");
  const[busy,setBusy]=useState(false);
  const[fecha,setFecha]=useState(hoyLocal());

  const MOTIVOS=["Vencido","Roto/dañado","Quemado/error de cocina","Devolución de cliente","Otro"];
  const itemsOrdenados=[...stock].sort((a,b)=>a.nombre.localeCompare(b.nombre));
  const itemSel=stock.find(s=>s.id===itemId);

  const registrar=async()=>{
    if(!itemId){toast("Elegí un producto del inventario");return;}
    if(!cantidad||Number(cantidad)<=0){toast("Ingresá la cantidad");return;}
    setBusy(true);
    const fechaISO=fecha?fechaLocalISO(fecha):new Date().toISOString();
    const cant=Number(cantidad);
    const mov={id:uid(),tipo:"salida",origen:"desperdicio",cantidad:cant,obs:`${motivo}${obs.trim()?" — "+obs.trim():""}`,fecha:fechaISO,registradoPor:registradoPor||null};
    const stockActual=stock.map(s=>s.id===itemId?{...s,cantidad:Math.max(0,s.cantidad-cant),movimientos:[mov,...(s.movimientos||[])].slice(0,50)}:s);
    await saveStock(stockActual);
    const registro={id:uid(),stockId:itemId,producto:itemSel.nombre,unidad:itemSel.unidad,proveedor:itemSel.proveedor,cantidad:cant,motivo,obs:obs.trim(),registradoPor:registradoPor||null,fecha:fechaISO};
    await saveDesperdicios([registro,...desperdicios]);
    toast(`✓ Desperdicio registrado: ${itemSel.nombre}`);
    setBusy(false);setItemId("");setCantidad("");setObs("");setMotivo("Vencido");setFecha(hoyLocal());
  };

  const eliminar=async id=>{
    if(!confirm("¿Eliminar este registro de desperdicio? (no repone el stock)"))return;
    await saveDesperdicios(desperdicios.filter(d=>d.id!==id));toast("Eliminado");
  };

  const hoyStr=hoyLocal();
  const desperdiciosHoy=desperdicios.filter(d=>d.fecha&&d.fecha.slice(0,10)===hoyStr);

  if(!stock.length)return(
    <Empty icon="🗑️">Todavía no hay productos en el inventario. Cargalos primero desde 📋 Inventario.</Empty>
  );

  return(<>
    <Card title="Registrar desperdicio">
      <p style={{fontSize:".78rem",color:"#7B7063",marginBottom:14}}>Descuenta del inventario y queda registrado el motivo, para saber cuánto se pierde.</p>
      <Field label="Producto">
        <select value={itemId} onChange={e=>setItemId(e.target.value)} style={sS}>
          <option value="">— Elegí un producto —</option>
          {itemsOrdenados.map(s=><option key={s.id} value={s.id}>{s.nombre} (stock: {s.cantidad} {s.unidad})</option>)}
        </select>
      </Field>
      <Field label={`Cantidad${itemSel?` (${itemSel.unidad})`:""}`}>
        <Inp type="number" value={cantidad} onChange={setCantidad} placeholder="0"/>
      </Field>
      <Field label="Motivo">
        <select value={motivo} onChange={e=>setMotivo(e.target.value)} style={sS}>
          {MOTIVOS.map(m=><option key={m} value={m}>{m}</option>)}
        </select>
      </Field>
      <Field label="Observaciones (opcional)"><TA value={obs} onChange={setObs} placeholder="Ej: se venció ayer"/></Field>
      <Field label="Fecha"><Inp type="date" value={fecha} onChange={setFecha}/></Field>
      <Btn bg="#C0392B" onClick={registrar} disabled={busy}>{busy?"Guardando…":"Registrar desperdicio"}</Btn>
    </Card>

    {desperdiciosHoy.length>0&&(

function TabDashboard({boletas,cierres,cierresCaja,pagos,sueldos,gastos,proveedores,calcDeuda,calcDigital,saldo,cajaDigitalSaldo,stock,setTab}){
  const hoy = new Date().toDateString();
  const now  = new Date();
  const esMes = iso => { const d=new Date(iso); return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear(); };
  const esSemana = iso => { const d=new Date(iso); const diff=(now-d)/(1000*60*60*24); return diff<=7; };

  // ── DÍA ──
  const cierresHoy    = cierresCaja.filter(c=>new Date(c.fecha).toDateString()===hoy);
  const pagosHoy      = pagos.filter(p=>new Date(p.fecha).toDateString()===hoy);
  const sueldosHoy    = sueldos.filter(s=>new Date(s.fecha).toDateString()===hoy);
  const gastosHoy     = gastos.filter(g=>new Date(g.fecha).toDateString()===hoy);
  const boletasHoy    = boletas.filter(b=>new Date(b.fecha).toDateString()===hoy);

  const ingresosHoy   = cierresHoy.reduce((s,c)=>s+Number(c.total||0),0);
  const digitalHoy    = cierresHoy.reduce((s,c)=>s+Number(c.totalDigital||0),0);
  const efectivoHoy   = cierresHoy.reduce((s,c)=>s+Number(c.efectivo||0),0);
  const pagosHoyTotal = pagosHoy.reduce((s,p)=>s+Number(p.monto||0),0);
  const sueldosHoyTot = sueldosHoy.filter(x=>x.forma!=="Retiro").reduce((s,x)=>s+Number(x.monto||0),0);
  const gastosHoyTot  = gastosHoy.reduce((s,g)=>s+Number(g.monto||0),0);
  const egresosDia    = pagosHoyTotal+sueldosHoyTot+gastosHoyTot;
  const netoDia       = ingresosHoy - egresosDia;

  // ── MES ──
  const ingMes   = cierresCaja.filter(c=>esMes(c.fecha)).reduce((s,c)=>s+Number(c.total||0),0);
  const pagosMes = pagos.filter(p=>esMes(p.fecha)).reduce((s,p)=>s+Number(p.monto||0),0);
  const sueMes   = sueldos.filter(s=>esMes(s.fecha)&&s.forma!=="Retiro").reduce((s,x)=>s+Number(x.monto||0),0);
  const gasMes   = gastos.filter(g=>esMes(g.fecha)).reduce((s,g)=>s+Number(g.monto||0),0);
  const egrMes   = pagosMes+sueMes+gasMes;
  const netoMes  = ingMes - egrMes;

  // ── ALERTAS ──

    .map(p=>{const d=calcDeuda(p.nombre);return{nombre:p.nombre,pendiente:d?Math.max(0,d.pendiente):0};})
