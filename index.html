async function sbGetAll(){
  const r=await fetch(`${SB_URL}/amapola?select=key,value`,{headers:SBH});
  if(!r.ok)throw new Error(`HTTP ${r.status}`);
  const rows=await r.json();
  const m={};
  rows.forEach(x=>{try{m[x.key]=JSON.parse(x.value);}catch{}});
  return{
    boletas:Array.isArray(m.boletas)?m.boletas:[],
    cierres:Array.isArray(m.cierres)?m.cierres:[],
    pagos:Array.isArray(m.pagos)?m.pagos:[],
    proveedores:Array.isArray(m.proveedores)?m.proveedores:[],

  };

async function sbSet(key,value,intentos=3){
  const body=JSON.stringify({key,value:JSON.stringify(value),updated_at:new Date().toISOString()});
  for(let i=0;i<intentos;i++){
    try{
      const r=await fetch(`${SB_URL}/amapola`,{
        method:"POST",
        headers:{...SBH,"Prefer":"resolution=merge-duplicates"},
        body,
      });
      if(r.ok)return;
      const txt=await r.text().catch(()=>"");
      throw new Error(`HTTP ${r.status}: ${txt.slice(0,80)}`);
    }catch(e){
      if(i===intentos-1)throw e;
      await new Promise(r=>setTimeout(r,1500*(i+1)));// 1.5s, 3s entre reintentos
    }
  }
}

async function compress(b64,maxW=900,q=0.72){
  return new Promise(res=>{
    const img=new Image();
    img.onload=()=>{
      let{width:w,height:h}=img;
      if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}
      const c=document.createElement("canvas");c.width=w;c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h);
      res(c.toDataURL("image/jpeg",q));
    };
    img.onerror=()=>res(b64);img.src=b64;
  });
}

function LoginGate({onSuccess}){
  const[user,setUser]=useState("");
  const[pass,setPass]=useState("");
  const[err,setErr]=useState(false);
  const check=()=>{
    const u=user.trim().toLowerCase();
    if(u===SITE_USER&&pass===SITE_PASS){
      localStorage.setItem("amapola_site_auth","1");
      localStorage.setItem("amapola_site_role","full");
      if(window.emailjs){
        emailjs.send(EMAILJS_SERVICE_ID,EMAILJS_TEMPLATE_ID,{
          fecha:new Date().toLocaleString("es-AR"),
          dispositivo:navigator.userAgent,
        }).catch(()=>{});
      }
      onSuccess("full");
    }else if(u===COCINA_USER&&pass===COCINA_LOGIN_PASS){
      localStorage.setItem("amapola_site_auth","1");
      localStorage.setItem("amapola_site_role","cocina");
      if(window.emailjs){
        emailjs.send(EMAILJS_SERVICE_ID,EMAILJS_TEMPLATE_ID,{
          fecha:new Date().toLocaleString("es-AR"),
          dispositivo:navigator.userAgent+" (Cocina)",

      }
      onSuccess("cocina");
    }else{
      setErr(true);setPass("");
    }
  };
  return(
    <div style={{position:"fixed",inset:0,background:"#2C1A0E",display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>

      if(d.stock)setStock(d.stock);
      if(d.cierresCaja)setCierresCaja(d.cierresCaja);
      if(d.empleados&&d.empleados.length>0)setEmpleados(d.empleados);
      if(typeof d.cajaDigitalSaldo==="number")setCajaDigitalSaldo(d.cajaDigitalSaldo);
      if(d.cajaDigitalAjustes)setCajaDigitalAjustes(d.cajaDigitalAjustes);
      if(d.catalogoStock)setCatalogoStock(d.catalogoStock);
      if(d.pedidosStock)setPedidosStock(d.pedidosStock);
      if(d.ajustesCajaEfectivo)setAjustesCajaEfectivo(d.ajustesCajaEfectivo);
      if(d.desperdicios)setDesperdicios(d.desperdicios);
      if(d.liquidaciones)setLiquidaciones(d.liquidaciones);
      online();setPhase("ready");
    }catch(e){setErrMsg(e.message);setPhase("error");}
  };

  useEffect(()=>{
    cargar();
  },[]);

  useEffect(()=>{
    if(phase!=="ready")return;
    const id=setInterval(async()=>{
      try{
        const d=await sbGetAll();online();
        const c=ref.current;
        if(!recentlySaved("boletas")&&JSON.stringify(d.boletas)!==JSON.stringify(c.boletas))setBoletas(d.boletas);
        if(!recentlySaved("cierres")&&JSON.stringify(d.cierres)!==JSON.stringify(c.cierres))setCierres(d.cierres);
        if(!recentlySaved("pagos")&&JSON.stringify(d.pagos)!==JSON.stringify(c.pagos))setPagos(d.pagos);
        if(!recentlySaved("proveedores")&&JSON.stringify(d.proveedores)!==JSON.stringify(c.proveedores))setProveedores(d.proveedores);
        if(!recentlySaved("cajaInicial")&&d.cajaInicial!==c.cajaInicial)setCajaInicial(d.cajaInicial);
        if(!recentlySaved("sueldos")&&JSON.stringify(d.sueldos)!==JSON.stringify(c.sueldos))setSueldos(d.sueldos||[]);
        if(!recentlySaved("gastos")&&JSON.stringify(d.gastos)!==JSON.stringify(c.gastos))setGastos(d.gastos||[]);
        if(!recentlySaved("stock")&&JSON.stringify(d.stock)!==JSON.stringify(c.stock))setStock(d.stock||[]);
        if(!recentlySaved("cierresCaja")&&JSON.stringify(d.cierresCaja)!==JSON.stringify(c.cierresCaja))setCierresCaja(d.cierresCaja||[]);
        if(!recentlySaved("empleados")&&JSON.stringify(d.empleados)!==JSON.stringify(c.empleados)&&d.empleados&&d.empleados.length>0)setEmpleados(d.empleados);
        if(!recentlySaved("cajaDigitalSaldo")&&d.cajaDigitalSaldo!==c.cajaDigitalSaldo)setCajaDigitalSaldo(d.cajaDigitalSaldo||0);
        if(!recentlySaved("cajaDigitalAjustes")&&JSON.stringify(d.cajaDigitalAjustes)!==JSON.stringify(c.cajaDigitalAjustes))setCajaDigitalAjustes(d.cajaDigitalAjustes||[]);
        if(!recentlySaved("catalogoStock")&&JSON.stringify(d.catalogoStock)!==JSON.stringify(c.catalogoStock)&&d.catalogoStock&&d.catalogoStock.length>0)setCatalogoStock(d.catalogoStock);
        if(!recentlySaved("pedidosStock")&&JSON.stringify(d.pedidosStock)!==JSON.stringify(c.pedidosStock))setPedidosStock(d.pedidosStock||[]);
        if(!recentlySaved("ajustesCajaEfectivo")&&JSON.stringify(d.ajustesCajaEfectivo)!==JSON.stringify(c.ajustesCajaEfectivo))setAjustesCajaEfectivo(d.ajustesCajaEfectivo||[]);
        if(!recentlySaved("desperdicios")&&JSON.stringify(d.desperdicios)!==JSON.stringify(c.desperdicios))setDesperdicios(d.desperdicios||[]);
        if(!recentlySaved("liquidaciones")&&JSON.stringify(d.liquidaciones)!==JSON.stringify(c.liquidaciones))setLiquidaciones(d.liquidaciones||[]);
      }catch{offline();}
    },45000);
    return()=>clearInterval(id);
  },[phase]);

  const savingKeys=useRef(new Set());
  const saveTimestamps=useRef({});
  const recentlySaved=key=>savingKeys.current.has(key)||(saveTimestamps.current[key]&&Date.now()-saveTimestamps.current[key]<60000);

  const[saveError,setSaveError]=useState(null);// {key, value, setter, mensaje}

  const save=async(key,value,setter)=>{
    saving();
    savingKeys.current.add(key);
    try{
      await sbSet(key,value);
      setter(value);
      online();
      saveTimestamps.current[key]=Date.now();
      setSaveError(null);// limpiar error si había uno
      return true;
    }
    catch(e){
      offline();
      setSaveError({key,value,setter,msg:"No se pudo guardar por falta de conexión. El dato no está en la base de datos."});
      return false;
    }
    finally{savingKeys.current.delete(key);}
  };

  const saveBoletas=v=>save("boletas",v,setBoletas);
  const saveCierres=v=>save("cierres",v,setCierres);
  const savePagos=v=>save("pagos",v,setPagos);
  const saveProveedores=v=>save("proveedores",v,setProveedores);
  const saveCajaInicial=v=>save("cajaInicial",v,setCajaInicial);
  const saveSueldos=v=>save("sueldos",v,setSueldos);
  const saveGastos=v=>save("gastos",v,setGastos);
  const saveStock=v=>save("stock",v,setStock);
  const saveCierresCaja=v=>save("cierresCaja",v,setCierresCaja);
  const saveEmpleados=v=>save("empleados",v,setEmpleados);
  const saveCajaDigitalSaldo=v=>save("cajaDigitalSaldo",v,setCajaDigitalSaldo);
  const saveCajaDigitalAjustes=v=>save("cajaDigitalAjustes",v,setCajaDigitalAjustes);
  const saveCatalogoStock=v=>save("catalogoStock",v,setCatalogoStock);
  const savePedidosStock=v=>save("pedidosStock",v,setPedidosStock);
  const saveAjustesCajaEfectivo=v=>save("ajustesCajaEfectivo",v,setAjustesCajaEfectivo);
  const saveDesperdicios=v=>save("desperdicios",v,setDesperdicios);
  const saveLiquidaciones=v=>save("liquidaciones",v,setLiquidaciones);
  const askPass=()=>new Promise(r=>setPassModal({resolve:r}));

  const reintentarSave=async()=>{
    if(!saveError)return;
    const{key,value,setter}=saveError;
    saving();
    savingKeys.current.add(key);
    try{
      await sbSet(key,value);
      setter(value);
      online();
      saveTimestamps.current[key]=Date.now();
      setSaveError(null);
      toast("✓ Dato guardado correctamente");
    }catch(e){
      offline();
      setSaveError(prev=>({...prev,msg:"Seguimos sin conexión. El dato NO está guardado."}));
    }finally{savingKeys.current.delete(key);}
  };

  const SaveErrorBanner=saveError?(
    <div style={{position:"fixed",top:0,left:0,right:0,zIndex:1000,background:"#C0392B",color:"#fff",padding:"12px 16px",display:"flex",alignItems:"center",gap:12,boxShadow:"0 4px 20px rgba(0,0,0,.3)"}}>
      <span style={{fontSize:"1.2rem"}}>❌</span>
      <div style={{flex:1}}>
        <div style={{fontWeight:700,fontSize:".85rem"}}>Error al guardar — dato NO registrado</div>
        <div style={{fontSize:".75rem",opacity:.9}}>{saveError.msg}</div>
      </div>
      <button onClick={reintentarSave} style={{background:"#fff",color:"#C0392B",border:"none",borderRadius:8,padding:"8px 14px",fontWeight:700,fontSize:".82rem",cursor:"pointer",flexShrink:0}}>Reintentar</button>
      <button onClick={()=>setSaveError(null)} style={{background:"none",border:"none",color:"#fff",fontSize:"1.2rem",cursor:"pointer",padding:"0 4px",flexShrink:0}}>✕</button>
    </div>
  ):null;

  const calcSaldo=()=>{
    const ini=Number(cajaInicial)||0;
    const tot=cierres.reduce((s,c)=>s+Number(c.monto||0),0);
    const totNuevosCierres=cierresCaja.reduce((s,c)=>s+Number(c.efectivo||0),0);
    const egPagos=pagos.filter(p=>p.forma==="Efectivo").reduce((s,p)=>s+Number(p.monto||0),0);
    const egSueldos=sueldos.filter(s=>s.forma==="Efectivo").reduce((s2,s)=>s2+Number(s.monto||0),0);
    const egGastos=gastos.filter(g=>g.forma==="Efectivo").reduce((s,g)=>s+Number(g.monto||0),0);
    const eg=egPagos+egSueldos+egGastos;
    const totalAjustes=(ajustesCajaEfectivo||[]).reduce((s,a)=>s+Number(a.monto||0),0);
    return{ini,tot:tot+totNuevosCierres,eg,saldo:ini+tot+totNuevosCierres-eg+totalAjustes};
  };
  const calcDigital=()=>{
    const ini=Number(cajaDigitalSaldo)||0;
    const ultimoAjuste=(cajaDigitalAjustes&&cajaDigitalAjustes.length>0)?cajaDigitalAjustes[0].fecha:null;
    const esPosterior=f=>!ultimoAjuste||new Date(f)>new Date(ultimoAjuste);
    const ingresos=cierresCaja.filter(c=>esPosterior(c.fecha)).reduce((s,c)=>s+Number(c.totalDigital||0),0);
    const egTransf=pagos.filter(p=>p.forma==="Transferencia"&&esPosterior(p.fecha)).reduce((s,p)=>s+Number(p.monto||0),0);
    const egSueldosT=sueldos.filter(s=>s.forma==="Transferencia"&&esPosterior(s.fecha)).reduce((s2,s)=>s2+Number(s.monto||0),0);
    const egGastosT=gastos.filter(g=>g.forma==="Transferencia"&&esPosterior(g.fecha)).reduce((s,g)=>s+Number(g.monto||0),0);
    const egTotal=egTransf+egSueldosT+egGastosT;
    // saldoReal = exactamente el saldo real ingresado manualmente (no se suman/restan movimientos)
    const saldoReal=ini;
    const deducciones=0;
    return{ini,ingresos,egTransf:egTotal,saldoReal,deducciones};
  };
  // Pares de proveedores que comparten crédito (excedente de A → B y viceversa)
  const PARES_CREDITO=[["Avenida Efectivo","Avenida Digital"]];// nombres deben calzar EXACTO con proveedores.nombre

  const parDestino=(nombreProv)=>{
    for(const par of PARES_CREDITO){
      if(norm(nombreProv)===norm(par[0]))return par[1];
      if(norm(nombreProv)===norm(par[1]))return par[0];
    }
    return null;
  };

  // Registra un pago y, si hay excedente sobre la deuda, lo transfiere al par.
  // El monto contra el proveedor original queda limitado a lo que realmente debía,
  // y el excedente se registra como pago aparte al proveedor par (misma forma de pago,
  // para que la caja se descuente una sola vez por el total realmente pagado).
  const pagarConExcedente=async(pagoBase,pagosActuales,savePagosFn)=>{
    const deudaInfo=calcDeuda(pagoBase.proveedor);
    const pendiente=deudaInfo?Math.max(0,deudaInfo.pendiente):0;
    const destino=parDestino(pagoBase.proveedor);
    const aplicaOriginal=destino?Math.min(pagoBase.monto,pendiente):pagoBase.monto;
    let listaPagos=pagosActuales;
    if(aplicaOriginal>0){
      listaPagos=[...listaPagos,{...pagoBase,monto:aplicaOriginal,id:uid()}];
    }

    if(destino&&pagoBase.monto>pendiente){
      const excedente=pagoBase.monto-pendiente;
      const pagoExtra={id:uid(),tipo:"pago",proveedor:destino,empleado:pagoBase.empleado||"—",monto:excedente,forma:pagoBase.forma,transferenciaInterna:true,obs:`Excedente de pago de ${pagoBase.proveedor} (auto)`,fecha:pagoBase.fecha||new Date().toISOString()};
      listaPagos=[...listaPagos,pagoExtra];
      toast(`✅ Excedente ${fmt(excedente)} aplicado a ${destino}`);
    }
    await savePagosFn(listaPagos);
  };

  const calcDeuda=nombre=>{
    const p=proveedores.find(p=>norm(p.nombre)===norm(nombre));
    if(!p)return null;
    const deudaIni=Number(p.deudaInicial)||0;
    const sumaBoletas=boletas.filter(b=>norm(b.proveedor)===norm(nombre)&&Number(b.monto)!==0).reduce((s,b)=>s+Number(b.monto||0),0);
    const pagado=pagos.filter(x=>norm(x.proveedor)===norm(nombre)).reduce((s,x)=>s+Number(x.monto||0),0);
    const totalDeuda=deudaIni+sumaBoletas;
    return{deudaInicial:deudaIni,sumaBoletas,totalDeuda,pagado,pendiente:totalDeuda-pagado};
  };

  const{ini,tot,eg,saldo}=calcSaldo();

  if(phase==="init")return(
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",height:"100dvh",background:"#2C1A0E",gap:16}}>
      <div style={{fontFamily:"Georgia,serif",fontStyle:"italic",fontSize:"2rem",color:"#E8DCC8"}}>Amapola</div>
      <div style={{color:"#7B7063",fontSize:".85rem"}}>Conectando con la base de datos…</div>
    </div>
  );

  if(phase==="error")return(
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",height:"100dvh",background:"#2C1A0E",gap:16,padding:24}}>
      <div style={{fontFamily:"Georgia,serif",fontStyle:"italic",fontSize:"2rem",color:"#E8DCC8"}}>Amapola</div>
      <div style={{background:"rgba(231,76,60,.15)",border:"1px solid rgba(231,76,60,.4)",borderRadius:12,padding:"20px",maxWidth:340,textAlign:"center"}}>
        <div style={{fontSize:"1.5rem",marginBottom:8}}>⚠️</div>
        <div style={{color:"#E8DCC8",fontWeight:600,marginBottom:8}}>Sin conexión</div>
        <div style={{color:"#7B7063",fontSize:".78rem",marginBottom:4}}>Error: {errMsg}</div>
      </div>
      <button onClick={()=>{setPhase("init");cargar();}} style={{padding:"12px 28px",borderRadius:10,border:"none",background:"#E74C3C",color:"#fff",fontWeight:600,cursor:"pointer"}}>Reintentar</button>
    </div>
  );

  const TABS_PUBLIC=[
    {id:"boletas",    label:"📸 Boletas"},
    {id:"cierres",    label:"💰 Cierres de Caja"},
    {id:"pagos",      label:"💸 Pagos"},
    {id:"proveedores",label:"🏪 Proveedores"},
    {id:"sueldos",    label:"👥 Sueldos"},
    {id:"fichajes",   label:"🕐 Fichajes"},
    {id:"stock",      label:"📦 Stock"},
  ];
  const TABS_ADMIN=[
    {id:"gastos",     label:"🏠 Pagos Digitales"},
    {id:"historial",  label:"📋 Historial"},
    {id:"dashboard",  label:"🏠 Dashboard"},
    {id:"liquidacion",label:"🧾 Liquidación de sueldos"},
    {id:"gerencia",   label:"💼 Gerencia"},
    {id:"cajaefectivo",label:"💵 Caja Disponible"},
    {id:"cajadigital",label:"💳 Caja Digital"},
    {id:"admin",      label:"⚙️ Admin"},
  ];
  const stockBajoCount=stock.filter(s=>Number(s.minimo)>0&&Number(s.cantidad)<=Number(s.minimo)).length;
  const TABS=cocinaOnly?[{id:"stock",label:"📦 Stock"}]:[...TABS_PUBLIC,...(adminUnlocked?TABS_ADMIN:[{id:"admin-lock",label:"🔒 Admin"}])];

  return(
    <div className="amapola-main" style={{background:"#F9F6F1",minHeight:"100dvh",color:"#2C1A0E"}}>
      <nav className="amapola-sidebar">
        <div style={{fontFamily:"Georgia,serif",fontStyle:"italic",fontSize:"1.3rem",color:"#E8DCC8",padding:"6px 14px 18px"}}>
          Amapola <span style={{color:"#E74C3C",fontStyle:"normal"}}>·</span> Interno
        </div>
        {TABS.map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)} style={{display:"flex",alignItems:"center",width:"100%",textAlign:"left",background:tab===t.id?"rgba(231,76,60,.15)":"transparent",border:"none",borderLeft:tab===t.id?"3px solid #E74C3C":"3px solid transparent",color:tab===t.id?"#E8DCC8":"#B8A88E",fontSize:".85rem",fontWeight:tab===t.id?600:500,padding:"10px 14px",cursor:"pointer",borderRadius:"0 8px 8px 0",marginBottom:2}}>{t.label}{t.id==="stock"&&stockBajoCount>0&&<span style={{marginLeft:6,background:"#E74C3C",color:"#fff",borderRadius:20,padding:"1px 7px",fontSize:".62rem",fontWeight:700}}>{stockBajoCount}</span>}</button>
        ))}
      </nav>
      {SaveErrorBanner}
      <div style={{background:"#2C1A0E",padding:"14px 16px 10px",display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:100}}>
        <div>
          <div className="amapola-header-title" style={{fontFamily:"Georgia,serif",fontStyle:"italic",fontSize:"1.4rem",color:"#E8DCC8",lineHeight:1.1}}>
            Amapola <span style={{color:"#E74C3C",fontStyle:"normal"}}>·</span> Interno
          </div>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <div style={{fontSize:".62rem",color:syncColor,fontWeight:600}}>{syncMsg}</div>
            {adminUnlocked&&<button onClick={()=>{setAdminUnlocked(false);setTab("caja");}} style={{fontSize:".6rem",background:"rgba(255,255,255,.12)",border:"none",color:"#E8DCC8",borderRadius:6,padding:"2px 7px",cursor:"pointer"}}>Salir admin</button>}
            {cerrarSesion&&<button onClick={()=>{if(confirm("¿Cerrar sesión?"))cerrarSesion();}} style={{fontSize:".6rem",background:"rgba(255,255,255,.12)",border:"none",color:"#E8DCC8",borderRadius:6,padding:"2px 7px",cursor:"pointer"}}>Cerrar sesión</button>}
          </div>
        </div>
        {!cocinaOnly&&(
          <div style={{display:"flex",gap:8,alignItems:"stretch"}}>
            <div style={{background:"#1A3C2E",color:"#A8D5BA",borderRadius:20,padding:"5px 12px",textAlign:"center",fontSize:".7rem",fontWeight:600,display:"flex",flexDirection:"column",justifyContent:"center"}}>
              <span style={{opacity:.7,fontSize:".58rem",textTransform:"uppercase",letterSpacing:".04em"}}>{new Date().toLocaleDateString("es-AR",{weekday:"short"}).toUpperCase()}</span>
              <span>{new Date().toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit"})}</span>
            </div>
            <div onClick={()=>setTab("caja")} style={{background:"#2D6A4F",color:"#fff",borderRadius:20,padding:"5px 14px",fontSize:".78rem",fontWeight:600,cursor:"pointer",textAlign:"right"}}>
              <span style={{opacity:.7,fontSize:".62rem",display:"block"}}>DISPONIBLE</span>
              <span style={{fontSize:"1rem"}}>{fmt(saldo)}</span>
            </div>
          </div>
        )}
      </div>
      <div className="amapola-tabbar-mobile" style={{background:"#2C1A0E",borderTop:"1px solid rgba(255,255,255,.08)",position:"sticky",top:60,zIndex:99,overflowX:"auto"}}>
        {TABS.map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)} style={{flex:1,background:"none",border:"none",borderBottom:tab===t.id?"3px solid #E74C3C":"3px solid transparent",color:tab===t.id?"#E8DCC8":"#7B7063",fontSize:".61rem",fontWeight:500,letterSpacing:".03em",textTransform:"uppercase",padding:"10px 4px",cursor:"pointer",whiteSpace:"nowrap"}}>{t.label}{t.id==="stock"&&stockBajoCount>0&&<span style={{marginLeft:4,background:"#E74C3C",color:"#fff",borderRadius:20,padding:"1px 6px",fontSize:".58rem",fontWeight:700}}>{stockBajoCount}</span>}</button>
        ))}
      </div>
      <div className="amapola-content">
        {tab==="admin-lock"&&(
          <div style={{padding:"20px 0"}}>
            <p style={{fontFamily:"Georgia,serif",fontSize:"1.3rem",marginBottom:4}}>Administración</p>
            <p style={{fontSize:".82rem",color:"#7B7063",marginBottom:20}}>Ingresá la contraseña para acceder a Admin y Pagos Digitales.</p>
            <div style={{background:"#fff",borderRadius:14,padding:20,boxShadow:"0 2px 12px rgba(44,26,14,.08)"}}>
              <label style={{display:"block",fontSize:".78rem",fontWeight:600,color:"#2C1A0E",marginBottom:5}}>Contraseña</label>
              <input type="password" value={adminPassInput} autoFocus
                onChange={e=>{setAdminPassInput(e.target.value);setAdminPassErr(false);}}
                onKeyDown={e=>{if(e.key==="Enter"){if(adminPassInput==="Barcala716*"){setAdminUnlocked(true);setAdminPassInput("");setTab("dashboard");}else{setAdminPassErr(true);setAdminPassInput("");}}} }
                placeholder="Contraseña de administrador"
                style={{width:"100%",border:`1.5px solid ${adminPassErr?"#E74C3C":"#E8DCC8"}`,borderRadius:8,padding:"10px 12px",fontFamily:"inherit",fontSize:".92rem",color:"#2C1A0E",background:"#F9F6F1",outline:"none",boxSizing:"border-box",marginBottom:8}}/>
              {adminPassErr&&<p style={{color:"#E74C3C",fontSize:".8rem",marginBottom:8}}>Contraseña incorrecta</p>}
              <button onClick={()=>{if(adminPassInput==="Barcala716*"){setAdminUnlocked(true);setAdminPassInput("");setTab("dashboard");}else{setAdminPassErr(true);setAdminPassInput("");}}}
                style={{display:"block",width:"100%",padding:13,marginTop:8,border:"none",borderRadius:10,background:"#2C1A0E",color:"#fff",fontFamily:"inherit",fontSize:".95rem",fontWeight:600,cursor:"pointer"}}>
                Ingresar
              </button>
            </div>
          </div>
        )}
        {tab==="dashboard"&&adminUnlocked&&<TabDashboard
          boletas={boletas} cierres={cierres} cierresCaja={cierresCaja} pagos={pagos}
          sueldos={sueldos} gastos={gastos} proveedores={proveedores}
          calcDeuda={calcDeuda} calcDigital={calcDigital} saldo={saldo}
          cajaDigitalSaldo={cajaDigitalSaldo} stock={stock} setTab={setTab}/>}
        {tab==="liquidacion"&&adminUnlocked&&<LiquidacionSueldos empleados={empleados} saveEmpleados={saveEmpleados} liquidaciones={liquidaciones} saveLiquidaciones={saveLiquidaciones}/>}
        {tab==="gerencia"&&adminUnlocked&&<TabGerencia calcDigital={calcDigital} saldo={saldo} ini={ini} tot={tot} eg={eg} cajaDigitalSaldo={cajaDigitalSaldo} saveCajaDigitalSaldo={saveCajaDigitalSaldo}/>}
        {tab==="cajaefectivo"&&adminUnlocked&&<TabCajaEfectivo cierres={cierres} cierresCaja={cierresCaja} cajaInicial={cajaInicial} pagos={pagos} savePagos={savePagos} sueldos={sueldos} saveSueldos={saveSueldos} gastos={gastos} saveGastos={saveGastos} ajustesCajaEfectivo={ajustesCajaEfectivo}/>}
        {tab==="cajadigital"&&adminUnlocked&&<TabCajaDigital calcDigital={calcDigital} cajaDigitalSaldo={cajaDigitalSaldo} saveCajaDigitalSaldo={saveCajaDigitalSaldo} cajaDigitalAjustes={cajaDigitalAjustes} saveCajaDigitalAjustes={saveCajaDigitalAjustes} pagos={pagos} savePagos={savePagos} sueldos={sueldos} saveSueldos={saveSueldos} gastos={gastos} saveGastos={saveGastos} cierresCaja={cierresCaja}/>}
        {tab==="boletas"&&<TabBoletas boletas={boletas} saveBoletas={saveBoletas} proveedores={proveedores} saveProveedores={saveProveedores} pagos={pagos} savePagos={savePagos} saldo={saldo} empleados={empleados} saveEmpleados={saveEmpleados} pagarConExcedente={pagarConExcedente} catalogo={catalogoStock} saveStock={saveStock} stock={stock}/>}
        {tab==="caja"&&<TabCaja cierres={cierres} saveCierres={saveCierres} ini={ini} tot={tot} eg={eg} saldo={saldo} cajaInicial={cajaInicial} saveCajaInicial={saveCajaInicial} askPass={askPass}/>}
        {tab==="pagos"&&<TabPagos pagos={pagos} savePagos={savePagos} proveedores={proveedores} saldo={saldo} cierres={cierres} cajaInicial={cajaInicial} cierresCaja={cierresCaja} sueldos={sueldos} gastos={gastos} pagarConExcedente={pagarConExcedente} empleados={empleados} saveEmpleados={saveEmpleados} catalogo={catalogoStock} saveStock={saveStock} stock={stock} ajustesCajaEfectivo={ajustesCajaEfectivo}/>}
        {tab==="proveedores"&&<TabProveedores proveedores={proveedores} saveProveedores={saveProveedores} calcDeuda={calcDeuda} pagos={pagos} boletas={boletas} askPass={askPass}/>}
        {tab==="historial"&&adminUnlocked&&<TabHistorial boletas={boletas} cierres={cierres} cierresCaja={cierresCaja} pagos={pagos} sueldos={sueldos} gastos={gastos} cajaInicial={cajaInicial} setLightbox={setLightbox} saveBoletas={saveBoletas} saveCierres={saveCierres} saveCierresCaja={saveCierresCaja} savePagos={savePagos} saveSueldos={saveSueldos} saveGastos={saveGastos} ajustesCajaEfectivo={ajustesCajaEfectivo} saveAjustesCajaEfectivo={saveAjustesCajaEfectivo}/>}
        {tab==="admin"&&adminUnlocked&&<TabAdmin proveedores={proveedores} saveProveedores={saveProveedores} cajaInicial={cajaInicial} saveCajaInicial={saveCajaInicial} askPass={askPass} cierresCaja={cierresCaja} saveCierresCaja={saveCierresCaja} pagos={pagos} savePagos={savePagos} sueldos={sueldos} saveSueldos={saveSueldos} boletas={boletas} saveBoletas={saveBoletas} ajustesCajaEfectivo={ajustesCajaEfectivo} saveAjustesCajaEfectivo={saveAjustesCajaEfectivo} saldo={saldo}/> }
        {tab==="sueldos"&&<TabSueldos sueldos={sueldos} saveSueldos={saveSueldos} saldo={saldo} gastos={gastos} saveGastos={saveGastos}/>}
        {tab==="gastos"&&adminUnlocked&&<TabGastos gastos={gastos} saveGastos={saveGastos} saldo={saldo} cajaInicial={cajaInicial}/>}
        {tab==="fichajes"&&<TabFichajes/>}
        {tab==="stock"&&<TabStock stock={stock} saveStock={saveStock} catalogo={catalogoStock} saveCatalogo={saveCatalogoStock} pedidos={pedidosStock} savePedidos={savePedidosStock} subInicial="inventario" desperdicios={desperdicios} saveDesperdicios={saveDesperdicios} registradoPor={cocinaOnly?"Cocina":"Administración"}/>}
        {tab==="cierres"&&<TabCierresCaja cierresCaja={cierresCaja} saveCierresCaja={saveCierresCaja} cajaDigitalSaldo={cajaDigitalSaldo} saveCajaDigitalSaldo={saveCajaDigitalSaldo} calcDigital={calcDigital}/>}
      </div>
      {passModal&&<PassModal onConfirm={()=>{setPassModal(null);passModal.resolve(true);}} onCancel={()=>{setPassModal(null);passModal.resolve(false);}}/>}
      {lightbox&&<Lightbox src={lightbox} onClose={()=>setLightbox(null)}/>}
      {toastMsg&&<div style={{position:"fixed",bottom:24,left:"50%",transform:"translateX(-50%)",background:"#2C1A0E",color:"#E8DCC8",padding:"10px 22px",borderRadius:20,fontSize:".84rem",fontWeight:600,zIndex:700,whiteSpace:"nowrap",pointerEvents:"none",boxShadow:"0 4px 20px rgba(0,0,0,.3)"}}>{toastMsg}</div>}
    </div>
  );
}



function NotasTurno({cierres}){
  const[nota,setNota]=useState("");
  const[notas,setNotas]=useState(()=>{try{return JSON.parse(localStorage.getItem("amapola_notas")||"[]");}catch{return[];}});

  const guardar=()=>{
    if(!nota.trim()){toast("Escribí una nota");return;}
    const nueva={id:uid(),texto:nota.trim(),fecha:new Date().toISOString()};
    const nuevas=[nueva,...notas].slice(0,30); // max 30 notas
    setNotas(nuevas);
    localStorage.setItem("amapola_notas",JSON.stringify(nuevas));
    setNota("");toast("Nota guardada ✓");
  };
  const eliminar=id=>{
    const nuevas=notas.filter(n=>n.id!==id);
    setNotas(nuevas);
    localStorage.setItem("amapola_notas",JSON.stringify(nuevas));
  };

  return(
    <Card title="📝 Notas del turno">
      <p style={{fontSize:".78rem",color:"#7B7063",marginBottom:10}}>Dejá avisos para el turno siguiente.</p>
      <TA value={nota} onChange={setNota} placeholder="Ej: falta papel de cocina, llamó el proveedor de carnes..."/>
      <Btn bg="#2C1A0E" onClick={guardar}>Agregar nota</Btn>
      {notas.length>0&&<div style={{marginTop:16}}>
        {notas.map(n=>(
          <div key={n.id} style={{display:"flex",alignItems:"flex-start",gap:10,padding:"10px 0",borderBottom:"1px solid #F9F6F1"}}>
            <div style={{flex:1}}>
              <div style={{fontSize:".88rem",color:"#2C1A0E",lineHeight:1.4}}>{n.texto}</div>
              <div style={{fontSize:".7rem",color:"#7B7063",marginTop:3}}>{fmtFL(n.fecha)} · {fmtH(n.fecha)}</div>
            </div>
            <button onClick={()=>eliminar(n.id)} style={{background:"none",border:"none",color:"#E74C3C",fontSize:"1.1rem",cursor:"pointer",flexShrink:0,padding:"0 4px"}}>✕</button>
          </div>
        ))}
      </div>}
    </Card>
  );
}

function TabBoletas({boletas,saveBoletas,proveedores,saveProveedores,pagos,savePagos,saldo,empleados,saveEmpleados,pagarConExcedente,catalogo,saveStock,stock}){
  const[prov,setProv]=useState("");const[emp,setEmp]=useState("");
  const[monto,setMonto]=useState("");const[obs,setObs]=useState("");
  const[busy,setBusy]=useState(false);
  const[fecha,setFecha]=useState(hoyLocal());
  const[crearModal,setCrearModal]=useState(false);const[nuevoNombre,setNuevoNombre]=useState("");
  const[crearEmpModal,setCrearEmpModal]=useState(false);const[nuevoEmpNombre,setNuevoEmpNombre]=useState("");
  // Detalle de productos comprados
  const[lineas,setLineas]=useState([]);// [{catalogoId,nombre,unidad,cantidad}]
  const[lineaProdId,setLineaProdId]=useState("");
  const[lineaCant,setLineaCant]=useState("");
  // Pago desde boletas
  const[pagoModal,setPagoModal]=useState(false);
  const[pagoMonto,setPagoMonto]=useState("");
  const[pagoForma,setPagoForma]=useState("Efectivo");
  const[pagoObs,setPagoObs]=useState("");
  const[pagoFecha,setPagoFecha]=useState(hoyLocal());
  const[pagoBusy,setPagoBusy]=useState(false);
  const hoy=new Date().toDateString();
  const hoyItems=boletas.filter(b=>new Date(b.fecha).toDateString()===hoy).slice().reverse();
  const[filtroBoletas,setFiltroBoletas]=useState("hoy");
  const[desdeBol,setDesdeBol]=useState(hoyLocal());
  const[hastaBol,setHastaBol]=useState(hoyLocal());
  const[filtroProvBol,setFiltroProvBol]=useState("");

  // Productos del catálogo disponibles (todos, no solo del proveedor seleccionado)
  const productosCat=catalogo?[...catalogo].sort((a,b)=>a.producto.localeCompare(b.producto)):[];
  // Filtrados por proveedor como sugerencia, pero mostramos todos
  const productosSugeridos=prov?productosCat.filter(c=>norm(c.proveedor)===norm(prov)):[];
  const productosResto=prov?productosCat.filter(c=>norm(c.proveedor)!==norm(prov)):productosCat;

  const agregarLinea=()=>{
    if(!lineaProdId){toast("Elegí un producto");return;}
    if(!lineaCant||Number(lineaCant)<=0){toast("Ingresá la cantidad");return;}
    const prod=productosCat.find(c=>c.id===lineaProdId);
    if(!prod)return;
    if(lineas.some(l=>l.catalogoId===lineaProdId)){toast("Ese producto ya está en la lista");return;}
    setLineas([...lineas,{catalogoId:prod.id,nombre:prod.producto,unidad:prod.unidad||"unidades",cantidad:Number(lineaCant),proveedor:prod.proveedor}]);
    setLineaProdId("");setLineaCant("");
  };

  const quitarLinea=id=>setLineas(lineas.filter(l=>l.catalogoId!==id));

  const crearProveedor=async()=>{
    if(!nuevoNombre.trim()){toast("Ingresa un nombre");return;}
    const nuevo={id:uid(),nombre:nuevoNombre.trim(),deudaInicial:0,obs:"",fecha:new Date().toISOString()};
    await saveProveedores([...proveedores,nuevo]);
    setProv(nuevoNombre.trim());setNuevoNombre("");setCrearModal(false);
    toast("Proveedor creado y seleccionado ✓");
  };
  const crearEmpleado=async()=>{
    if(!nuevoEmpNombre.trim()){toast("Ingresá un nombre");return;}
    const nuevo={id:uid(),nombre:nuevoEmpNombre.trim(),apellido:"",dni:"",domicilio:"",telPropio:"",telContacto:"",estado:"Activo"};
    await saveEmpleados([...empleados,nuevo]);
    setEmp(nuevoEmpNombre.trim());setNuevoEmpNombre("");setCrearEmpModal(false);
    toast("Empleado agregado ✓");
  };
  const guardar=async()=>{
    if(!prov||!emp.trim()){toast("Elegí un proveedor y completá el empleado");return;}
    setBusy(true);
    const boletaId=uid();
    const fechaISO=fecha?fechaLocalISO(fecha):new Date().toISOString();
    // Guardar boleta con detalle de productos
    await saveBoletas([...boletas,{id:boletaId,tipo:"boleta",proveedor:prov,empleado:emp.trim(),monto:Number(monto)||0,obs:obs.trim(),fecha:fechaISO,productos:lineas}]);
    // Generar entradas de stock por cada producto comprado
    if(lineas.length>0&&saveStock&&stock){
      const stockActual=[...stock];
      lineas.forEach(linea=>{
        const idx=stockActual.findIndex(s=>s.catalogoId===linea.catalogoId);
        const mov={id:uid(),tipo:"entrada",origen:"boleta",boletaId,cantidad:linea.cantidad,obs:`Compra a ${prov}`,fecha:fechaISO};
        if(idx>=0){
          stockActual[idx]={...stockActual[idx],cantidad:stockActual[idx].cantidad+linea.cantidad,movimientos:[mov,...(stockActual[idx].movimientos||[])].slice(0,50)};
        }else{
          stockActual.push({id:uid(),catalogoId:linea.catalogoId,nombre:linea.nombre,proveedor:linea.proveedor,sector:"",cantidad:linea.cantidad,minimo:0,unidad:linea.unidad,movimientos:[mov],fecha:fechaISO});
        }
      });
      await saveStock(stockActual);
    }
    setBusy(false);setProv("");setEmp("");setMonto("");setObs("");setFecha(hoyLocal());setLineas([]);setLineaProdId("");setLineaCant("");
    toast("Boleta registrada ✓"+(lineas.length>0?` · ${lineas.length} producto${lineas.length!==1?"s":""} al stock`:""));
  };
  const guardarPago=async()=>{
    if(!prov){toast("Elegí un proveedor primero");return;}
    if(!pagoMonto||Number(pagoMonto)<=0){toast("Ingresá un monto válido");return;}
    if(pagoForma==="Efectivo"&&Number(pagoMonto)>saldo){toast("⚠️ Supera la caja disponible");return;}
    setPagoBusy(true);
    const pagoBase={tipo:"pago",proveedor:prov,empleado:emp.trim()||"—",monto:Number(pagoMonto),forma:pagoForma,obs:pagoObs.trim(),fecha:pagoFecha?new Date(pagoFecha+"T12:00:00").toISOString():new Date().toISOString()};
    await pagarConExcedente(pagoBase,pagos,savePagos);
    setPagoBusy(false);setPagoModal(false);setPagoMonto("");setPagoObs("");setPagoForma("Efectivo");setPagoFecha(hoyLocal());
    toast("Pago registrado ✓");
  };

  return(<>
    <ST help={"Registrá acá cada boleta que llega de un proveedor.\n\n• Elegí el proveedor del desplegable (usá + si no existe).\n• 'Empleado que recibe' es quien firmó o recibió la boleta físicamente.\n• El monto suma a la deuda del proveedor y descuenta del disponible cuando lo pagás.\n• Podés adjuntar una foto como respaldo.\n• Desde el listado podés registrar un pago directo al proveedor."}>Boletas de proveedores</ST><SS>Registrá cada boleta ni bien llega el proveedor.</SS>
    {crearModal&&(
      <div style={{position:"fixed",inset:0,background:"rgba(44,26,14,.65)",zIndex:500,display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
        <div style={{background:"#fff",borderRadius:"20px 20px 0 0",padding:"28px 20px 44px",width:"100%",maxWidth:460}}>
          <p style={{fontFamily:"Georgia,serif",fontSize:"1.1rem",marginBottom:16}}>Nuevo proveedor</p>
          <input value={nuevoNombre} onChange={e=>setNuevoNombre(e.target.value)} placeholder="Nombre del proveedor" autoFocus onKeyDown={e=>e.key==="Enter"&&crearProveedor()} style={{...iS,marginBottom:8}}/>
          <p style={{fontSize:".75rem",color:"#7B7063",marginBottom:16}}>Podés agregar la deuda inicial desde la pestana Proveedores.</p>
          <div style={{display:"flex",gap:10}}>
            <button onClick={()=>{setCrearModal(false);setNuevoNombre("");}} style={{flex:1,padding:12,borderRadius:10,border:"none",background:"#E8DCC8",fontWeight:600,cursor:"pointer"}}>Cancelar</button>
            <button onClick={crearProveedor} style={{flex:1,padding:12,borderRadius:10,border:"none",background:"#C0392B",color:"#fff",fontWeight:600,cursor:"pointer"}}>Crear</button>
          </div>
        </div>
      </div>
    )}
    {crearEmpModal&&(
      <div style={{position:"fixed",inset:0,background:"rgba(44,26,14,.65)",zIndex:500,display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
        <div style={{background:"#fff",borderRadius:"20px 20px 0 0",padding:"28px 20px 44px",width:"100%",maxWidth:460}}>
          <p style={{fontFamily:"Georgia,serif",fontSize:"1.1rem",marginBottom:16}}>Nueva persona</p>
          <input value={nuevoEmpNombre} onChange={e=>setNuevoEmpNombre(e.target.value)} placeholder="Nombre" autoFocus onKeyDown={e=>e.key==="Enter"&&crearEmpleado()} style={{...iS,marginBottom:16}}/>
          <div style={{display:"flex",gap:10}}>
            <button onClick={()=>{setCrearEmpModal(false);setNuevoEmpNombre("");}} style={{flex:1,padding:12,borderRadius:10,border:"none",background:"#E8DCC8",fontWeight:600,cursor:"pointer"}}>Cancelar</button>
            <button onClick={crearEmpleado} style={{flex:1,padding:12,borderRadius:10,border:"none",background:"#2C1A0E",color:"#fff",fontWeight:600,cursor:"pointer"}}>Agregar</button>
          </div>
        </div>
      </div>
    )}
    <Card title="Nueva boleta">
      <Field label="Proveedor">
        <div style={{display:"flex",gap:8}}>
          <select value={prov} onChange={e=>setProv(e.target.value)} style={{...sS,flex:1}}>
            <option value="">— Elegí un proveedor —</option>
            {proveedores.map(p=><option key={p.id} value={p.nombre}>{p.nombre}</option>)}
          </select>
          <button onClick={()=>setCrearModal(true)} title="Crear proveedor" style={{padding:"10px 14px",border:"1.5px solid #E8DCC8",borderRadius:8,background:"#F9F6F1",fontSize:"1.1rem",cursor:"pointer",flexShrink:0}}>+</button>
        </div>
      </Field>
      <Field label="Empleado que recibe">
        <div style={{display:"flex",gap:8}}>
          <select value={emp} onChange={e=>setEmp(e.target.value)} style={{...sS,flex:1}}>
            <option value="">— Elegí —</option>
            {empleados.filter(e=>e.estado==="Activo").map(e=><option key={e.id} value={e.nombre}>{e.nombre}</option>)}
          </select>
          <button onClick={()=>setCrearEmpModal(true)} title="Agregar persona" style={{padding:"10px 14px",border:"1.5px solid #E8DCC8",borderRadius:8,background:"#F9F6F1",fontSize:"1.1rem",cursor:"pointer",flexShrink:0}}>+</button>
        </div>
      </Field>
      <Field label="Monto ($)"><Inp type="number" value={monto} onChange={setMonto} placeholder="0"/></Field>
      <Field label="Observaciones"><TA value={obs} onChange={setObs} placeholder="Ej: faltó un bulto..."/></Field>
      <Field label="Fecha del registro"><Inp type="date" value={fecha} onChange={setFecha}/></Field>

      {/* DETALLE DE PRODUCTOS */}
      <div style={{marginTop:16,borderTop:"1px solid #F2EAE0",paddingTop:16}}>
        <div style={{fontSize:".78rem",fontWeight:700,color:"#2C1A0E",marginBottom:10}}>📦 Productos comprados <span style={{fontWeight:400,color:"#7B7063"}}>(opcional — suman al stock automáticamente)</span></div>
        <div style={{display:"flex",gap:6,alignItems:"flex-end",marginBottom:10}}>
          <div style={{flex:1}}>
            <select value={lineaProdId} onChange={e=>setLineaProdId(e.target.value)} style={{...sS,fontSize:".78rem"}}>
              <option value="">— Producto —</option>
              {productosSugeridos.length>0&&<optgroup label={`✓ De ${prov}`}>{productosSugeridos.map(c=><option key={c.id} value={c.id}>{c.producto}</option>)}</optgroup>}
              {productosResto.length>0&&<optgroup label="Otros productos">{productosResto.map(c=><option key={c.id} value={c.id}>{c.producto} ({c.proveedor})</option>)}</optgroup>}
            </select>
          </div>
          <div style={{width:72}}>
            <input type="number" min="0" value={lineaCant} onChange={e=>setLineaCant(e.target.value)} placeholder="Cant." style={{...iS,fontSize:".82rem",textAlign:"center"}}/>
          </div>
          <button onClick={agregarLinea} style={{padding:"10px 12px",border:"none",borderRadius:8,background:"#2C1A0E",color:"#fff",fontWeight:700,fontSize:"1rem",cursor:"pointer",flexShrink:0}}>+</button>
        </div>
        {lineas.length>0&&(
          <div style={{background:"#F9F6F1",borderRadius:10,overflow:"hidden"}}>
            {lineas.map(l=>(
              <div key={l.catalogoId} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 12px",borderBottom:"1px solid #F2EAE0"}}>
                <span style={{flex:1,fontSize:".82rem",color:"#2C1A0E"}}>{l.nombre}</span>
                <span style={{fontSize:".82rem",fontWeight:700,color:"#2D6A4F"}}>{l.cantidad} {l.unidad}</span>
                <button onClick={()=>quitarLinea(l.catalogoId)} style={{background:"none",border:"none",color:"#C0392B",fontSize:".8rem",cursor:"pointer",padding:"0 4px"}}>✕</button>
              </div>
            ))}
            <div style={{padding:"8px 12px",fontSize:".72rem",color:"#7B7063"}}>
              {lineas.length} producto{lineas.length!==1?"s":""} · suman al stock al guardar
            </div>
          </div>
        )}
      </div>

      <Btn bg="#C0392B" onClick={guardar} disabled={busy}>{busy?"Guardando…":"Registrar boleta"}</Btn>
      {prov&&<button onClick={()=>setPagoModal(true)} style={{display:"block",width:"100%",padding:12,marginTop:10,border:"1.5px solid #B7860B",borderRadius:10,background:"#FEF9E7",color:"#B7860B",fontFamily:"inherit",fontSize:".9rem",fontWeight:600,cursor:"pointer"}}>💸 Registrar pago a este proveedor</button>}
    </Card>
    {pagoModal&&(
      <div style={{position:"fixed",inset:0,background:"rgba(44,26,14,.65)",zIndex:500,display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
        <div style={{background:"#fff",borderRadius:"20px 20px 0 0",padding:"24px 20px 44px",width:"100%",maxWidth:460}}>
          <p style={{fontFamily:"Georgia,serif",fontSize:"1.1rem",marginBottom:4}}>💸 Pago a {prov}</p>
          <p style={{fontSize:".78rem",color:"#7B7063",marginBottom:16}}>Caja disponible: <strong>{fmt(saldo)}</strong></p>
          <Field label="Monto ($)"><Inp type="number" value={pagoMonto} onChange={setPagoMonto} placeholder="0"/></Field>
          <Field label="Forma de pago">
            <select value={pagoForma} onChange={e=>setPagoForma(e.target.value)} style={sS}>
              <option value="Efectivo">Efectivo (descuenta de caja)</option>
              <option value="Transferencia">Transferencia (no descuenta caja)</option>
              <option value="Amex">Amex</option>
            </select>
          </Field>
          {pagoForma==="Efectivo"&&<div style={{fontSize:".78rem",color:"#2D6A4F",background:"#EAF5F0",borderRadius:8,padding:"8px 10px",marginTop:8}}>💵 Descontará del efectivo disponible.</div>}
          <Field label="Observaciones"><TA value={pagoObs} onChange={setPagoObs} placeholder="Ej: pago parcial, boleta #..."/></Field>
          <Field label="Fecha"><Inp type="date" value={pagoFecha} onChange={setPagoFecha}/></Field>
          <div style={{display:"flex",gap:10,marginTop:18}}>
            <button onClick={()=>setPagoModal(false)} style={{flex:1,padding:12,borderRadius:10,border:"none",background:"#E8DCC8",fontWeight:600,cursor:"pointer"}}>Cancelar</button>
            <button onClick={guardarPago} disabled={pagoBusy} style={{flex:1,padding:12,borderRadius:10,border:"none",background:"#B7860B",color:"#fff",fontWeight:600,cursor:"pointer"}}>{pagoBusy?"Guardando…":"Confirmar pago"}</button>
          </div>
        </div>
      </div>
    )}
    {/* DETALLE BOLETAS */}
    {(()=>{
      const hoy2=new Date();
      const iso=d=>d.toISOString().slice(0,10);
      const inicioMes=new Date(hoy2.getFullYear(),hoy2.getMonth(),1);
      const desdeF=filtroBoletas==="hoy"?iso(hoy2):filtroBoletas==="mes"?iso(inicioMes):desdeBol;
      const hastaF=filtroBoletas==="hoy"?iso(hoy2):filtroBoletas==="mes"?iso(hoy2):hastaBol;
      const filtradas=[...boletas]
        .filter(b=>{const f=b.fecha.slice(0,10);return(!desdeF||f>=desdeF)&&(!hastaF||f<=hastaF);})
        .filter(b=>!filtroProvBol||norm(b.proveedor)===norm(filtroProvBol))
        .sort((a,b2)=>new Date(b2.fecha)-new Date(a.fecha));
      const total=filtradas.reduce((s,b)=>s+Number(b.monto||0),0);
      return(
        <div style={{background:"#fff",borderRadius:14,padding:20,boxShadow:"0 2px 12px rgba(44,26,14,.08)",marginTop:16}}>
          <div style={{fontSize:".68rem",fontWeight:700,letterSpacing:".09em",textTransform:"uppercase",color:"#7B7063",marginBottom:14}}>📄 Registro de boletas</div>
          <div style={{display:"flex",gap:6,marginBottom:10,flexWrap:"wrap"}}>
            {[["hoy","Hoy"],["mes","Este mes"],["custom","Personalizado"]].map(([v,l])=>(
              <button key={v} onClick={()=>{setFiltroBoletas(v);if(v==="mes"){setDesdeBol(iso(inicioMes));setHastaBol(iso(hoy2));}if(v==="hoy"){setDesdeBol(iso(hoy2));setHastaBol(iso(hoy2));}}}
                style={{padding:"5px 12px",borderRadius:20,border:"none",cursor:"pointer",fontSize:".72rem",fontWeight:600,background:filtroBoletas===v?"#2C1A0E":"#E8DCC8",color:filtroBoletas===v?"#E8DCC8":"#2C1A0E"}}>{l}</button>
            ))}
          </div>
          {filtroBoletas==="custom"&&(
            <div style={{display:"flex",gap:8,marginBottom:10}}>
              <div style={{flex:1}}><label style={{display:"block",fontSize:".7rem",fontWeight:600,color:"#7B7063",marginBottom:3}}>Desde</label><input type="date" value={desdeBol} onChange={e=>setDesdeBol(e.target.value)} style={{...iS,fontSize:".82rem",padding:"7px 10px"}}/></div>
              <div style={{flex:1}}><label style={{display:"block",fontSize:".7rem",fontWeight:600,color:"#7B7063",marginBottom:3}}>Hasta</label><input type="date" value={hastaBol} onChange={e=>setHastaBol(e.target.value)} style={{...iS,fontSize:".82rem",padding:"7px 10px"}}/></div>
            </div>
          )}
          {/* FILTRO PROVEEDOR */}
          {(()=>{
            const provsDisp=[...new Set(boletas.map(b=>b.proveedor).filter(Boolean))].sort();
            return provsDisp.length>0?(
              <div style={{marginBottom:10}}>
                <select value={filtroProvBol} onChange={e=>setFiltroProvBol(e.target.value)} style={{...sS,fontSize:".78rem",padding:"6px 10px"}}>
                  <option value="">Todos los proveedores</option>
                  {provsDisp.map(p=><option key={p} value={p}>{p}</option>)}
                </select>
              </div>
            ):null;
          })()}
          {filtradas.length>0&&<div style={{fontSize:".78rem",color:"#7B7063",marginBottom:10}}>{filtradas.length} boleta{filtradas.length!==1?"s":""}{filtroProvBol?` · ${filtroProvBol}`:""} · Total: <strong style={{color:"#C0392B"}}>{fmt(total)}</strong></div>}
          {!filtradas.length?<Empty icon="📄">Sin boletas en el período</Empty>:(
            <div style={{overflowX:"auto"}}>
              <table style={{width:"100%",borderCollapse:"collapse",fontSize:".75rem",minWidth:380}}>
                <thead>
                  <tr style={{background:"#F9F6F1"}}>
                    {["Fecha","Proveedor","Recibió","Monto"].map(h=>(
                      <th key={h} style={{padding:"7px 8px",textAlign:h==="Monto"?"right":"left",fontWeight:700,color:"#7B7063",fontSize:".63rem",letterSpacing:".05em",textTransform:"uppercase",borderBottom:"2px solid #E8DCC8",whiteSpace:"nowrap"}}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {filtradas.map((b,i)=>(
                    <tr key={b.id} style={{background:i%2===0?"#fff":"#F9F6F1"}}>
                      <td style={{padding:"6px 8px",whiteSpace:"nowrap",color:"#7B7063",fontSize:".72rem"}}>
                        {fmtF(b.fecha)}<br/><span style={{fontSize:".62rem"}}>{fmtH(b.fecha)}</span>
                      </td>
                      <td style={{padding:"6px 8px"}}>
                        <div style={{fontWeight:600,fontSize:".76rem",lineHeight:1.3}}>{b.proveedor||"—"}</div>
                        {b.obs&&<div style={{fontSize:".63rem",color:"#7B7063",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",maxWidth:120}}>{b.obs}</div>}
                      </td>
                      <td style={{padding:"6px 8px",fontSize:".72rem",color:"#7B7063",whiteSpace:"nowrap"}}>{b.empleado||"—"}</td>
                      <td style={{padding:"6px 8px",textAlign:"right",color:"#C0392B",fontWeight:700,whiteSpace:"nowrap"}}>{b.monto>0?fmt(b.monto):"—"}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
        </div>
      );
    })()}
  </>);
}

function TabCaja({cierres,saveCierres,ini,tot,eg,saldo,cajaInicial,saveCajaInicial,askPass}){
  const[montoIni,setMontoIni]=useState("");const[emp,setEmp]=useState("");
  const[turno,setTurno]=useState("Mostrador Día");const[monto,setMonto]=useState("");
  const[obs,setObs]=useState("");const[busy,setBusy]=useState(false);
  const[fecha,setFecha]=useState(hoyLocal());
  const[cajeros,setCajeros]=useState(["Micaela","Priscila","Valentina","Ludmila","Catalina","Lautaro"]);
  const[nuevoModal,setNuevoModal]=useState(false);
  const[nuevoNombre,setNuevoNombre]=useState("");

  const agregarCajero=()=>{
    const nombre=nuevoNombre.trim();
    if(!nombre){toast("Ingresá un nombre");return;}
    if(cajeros.some(c=>norm(c)===norm(nombre))){toast("Ya existe");return;}
    setCajeros([...cajeros,nombre]);
    setEmp(nombre);setNuevoNombre("");setNuevoModal(false);toast("Agregado ✓");
  };

  useEffect(()=>{setMontoIni(cajaInicial>0?String(cajaInicial):"");},[cajaInicial]);
  const guardarIni=async()=>{
    const ok=await askPass();if(!ok)return;
    const v=Number(montoIni);
    if(isNaN(v)||v<0){toast("Ingresá un monto válido");return;}
    await saveCajaInicial(v);toast("Saldo inicial guardado ✓");
  };
  const guardarCierre=async()=>{
    if(!emp.trim()||!monto){toast("Completá empleado y monto");return;}
    setBusy(true);
    await saveCierres([...cierres,{id:uid(),tipo:"cierre",empleado:emp.trim(),turno,monto:Number(monto),obs:obs.trim(),fecha:fecha?fechaLocalISO(fecha):new Date().toISOString()}]);
    setBusy(false);setEmp("");setMonto("");setObs("");setFecha(hoyLocal());toast("Cierre registrado ✓");
  };
  return(<>
    <ST help={"Acá se registran los cierres de turno: el dinero en efectivo que se deposita en la caja fuerte al final de cada turno.\n\n• Cada cierre suma al saldo de caja disponible.\n• Los pagos a proveedores en efectivo restan de ese saldo.\n• El saldo inicial es el monto con el que arrancó la caja (protegido por contraseña).\n• El disponible final = Inicial + Cierres − Pagos en efectivo."}>Caja Disponible</ST><SS>Cierres de turno y caja disponible.</SS>

    {nuevoModal&&(
      <div style={{position:"fixed",inset:0,background:"rgba(44,26,14,.65)",zIndex:500,display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
        <div style={{background:"#fff",borderRadius:"20px 20px 0 0",padding:"28px 20px 44px",width:"100%",maxWidth:460}}>
          <p style={{fontFamily:"Georgia,serif",fontSize:"1.1rem",marginBottom:16}}>Nueva persona</p>
          <input value={nuevoNombre} onChange={e=>setNuevoNombre(e.target.value)} placeholder="Nombre" autoFocus onKeyDown={e=>e.key==="Enter"&&agregarCajero()} style={{...iS,marginBottom:16}}/>
          <div style={{display:"flex",gap:10}}>
            <button onClick={()=>{setNuevoModal(false);setNuevoNombre("");}} style={{flex:1,padding:12,borderRadius:10,border:"none",background:"#E8DCC8",fontWeight:600,cursor:"pointer"}}>Cancelar</button>
            <button onClick={agregarCajero} style={{flex:1,padding:12,borderRadius:10,border:"none",background:"#2C1A0E",color:"#fff",fontWeight:600,cursor:"pointer"}}>Agregar</button>
          </div>
        </div>
      </div>
    )}

    <div style={{background:"#2C1A0E",borderRadius:14,padding:"22px 20px",marginBottom:16}}>
      <div style={{fontSize:".65rem",letterSpacing:".08em",textTransform:"uppercase",color:"#E8DCC8",opacity:.7}}>Caja disponible</div>
      <div style={{fontFamily:"Georgia,serif",fontSize:"2.4rem",color:"#E8DCC8",margin:"4px 0 2px"}}>{fmt(saldo)}</div>
      <div style={{fontSize:".74rem",color:"#E8DCC8",opacity:.6}}>Saldo inicial + cierres − pagos en efectivo</div>
      <div style={{display:"flex",gap:10,marginTop:14}}>
        {[["Inicial",fmt(ini)],["Cierres",fmt(tot)],["Pagado",fmt(eg)]].map(([l,v])=>(
          <div key={l} style={{flex:1,background:"rgba(255,255,255,.07)",borderRadius:10,padding:"10px 12px"}}>
            <div style={{fontSize:".62rem",color:"#E8DCC8",opacity:.6,textTransform:"uppercase",letterSpacing:".05em"}}>{l}</div>
            <div style={{fontSize:".95rem",fontWeight:700,color:"#E8DCC8",marginTop:2}}>{v}</div>
          </div>
        ))}
      </div>
    </div>

    <Card title="Registrar cierre de turno">
      <Field label="Empleado">
        <div style={{display:"flex",gap:8}}>
          <select value={emp} onChange={e=>setEmp(e.target.value)} style={{...sS,flex:1}}>
            <option value="">— Elegí —</option>
            {cajeros.map(c=><option key={c} value={c}>{c}</option>)}
          </select>
          <button onClick={()=>setNuevoModal(true)} title="Agregar persona" style={{padding:"10px 14px",border:"1.5px solid #E8DCC8",borderRadius:8,background:"#F9F6F1",fontSize:"1.1rem",cursor:"pointer",flexShrink:0}}>+</button>
        </div>
      </Field>
      <Field label="Caja"><select value={turno} onChange={e=>setTurno(e.target.value)} style={sS}>{["Mostrador Día","Mostrador Noche","Post FUDO 1","Post FUDO 2"].map(t=><option key={t}>{t}</option>)}</select></Field>
      <Field label="Monto a depositar ($)"><Inp type="number" value={monto} onChange={setMonto} placeholder="0"/></Field>
      <Field label="Observaciones"><TA value={obs} onChange={setObs} placeholder="Ej: faltaron $500..."/></Field>
      <Field label="Fecha del registro"><Inp type="date" value={fecha} onChange={setFecha}/></Field>
      <Btn bg="#2D6A4F" onClick={guardarCierre} disabled={busy}>{busy?"Guardando…":"Confirmar cierre de turno"}</Btn>
    </Card>
    <NotasTurno cierres={cierres}/>
  </>);
}

function TabPagos({pagos,savePagos,proveedores,saldo,cierres,cajaInicial,cierresCaja,sueldos,gastos,pagarConExcedente,empleados,saveEmpleados,catalogo,saveStock,stock,ajustesCajaEfectivo}){
  const[prov,setProv]=useState("");const[emp,setEmp]=useState("");
  const[monto,setMonto]=useState("");const[forma,setForma]=useState("Efectivo");
  const[obs,setObs]=useState("");const[busy,setBusy]=useState(false);
  const[fecha,setFecha]=useState(hoyLocal());
  const[nuevoRegModal,setNuevoRegModal]=useState(false);
  const[nuevoRegNombre,setNuevoRegNombre]=useState("");
  const[nuevoPagoModal,setNuevoPagoModal]=useState(false);
  // Detalle de mercadería descargada (opcional — suma al stock igual que en Boletas)
  const[lineas,setLineas]=useState([]);// [{catalogoId,nombre,unidad,cantidad,proveedor}]
  const[lineaProdId,setLineaProdId]=useState("");
  const[lineaCant,setLineaCant]=useState("");

  // "Registrado por" usa la misma lista persistida de Empleados que Boletas (antes era una lista local que se perdía al recargar).
  const registradores=(empleados||[]).filter(e=>e.estado==="Activo");

  const productosCat=catalogo?[...catalogo].sort((a,b)=>a.producto.localeCompare(b.producto)):[];
  const productosSugeridos=prov?productosCat.filter(c=>norm(c.proveedor)===norm(prov)):[];
  const productosResto=prov?productosCat.filter(c=>norm(c.proveedor)!==norm(prov)):productosCat;

  const agregarLinea=()=>{
    if(!lineaProdId){toast("Elegí un producto");return;}
    if(!lineaCant||Number(lineaCant)<=0){toast("Ingresá la cantidad");return;}
    const prod=productosCat.find(c=>c.id===lineaProdId);
    if(!prod)return;
    if(lineas.some(l=>l.catalogoId===lineaProdId)){toast("Ese producto ya está en la lista");return;}
    setLineas([...lineas,{catalogoId:prod.id,nombre:prod.producto,unidad:prod.unidad||"unidades",cantidad:Number(lineaCant),proveedor:prod.proveedor}]);
    setLineaProdId("");setLineaCant("");
  };
  const quitarLinea=id=>setLineas(lineas.filter(l=>l.catalogoId!==id));

  const agregarRegistrador=async()=>{
    const nombre=nuevoRegNombre.trim();
    if(!nombre){toast("Ingresá un nombre");return;}
    if(registradores.some(r=>norm(r.nombre)===norm(nombre))){toast("Ya existe");setEmp(nombre);setNuevoRegNombre("");setNuevoRegModal(false);return;}
    const nuevo={id:uid(),nombre,apellido:"",dni:"",domicilio:"",telPropio:"",telContacto:"",estado:"Activo"};
    await saveEmpleados([...(empleados||[]),nuevo]);
    setEmp(nombre);setNuevoRegNombre("");setNuevoRegModal(false);
    toast("Agregado ✓");
  };

  const guardar=async()=>{
    if(!prov.trim()||!emp.trim()||!monto){toast("Completá todos los campos");return false;}
    if(forma==="Efectivo"&&Number(monto)>saldo){toast("⚠️ Supera la caja disponible");return false;}
    setBusy(true);
    const fechaISO=fecha?fechaLocalISO(fecha):new Date().toISOString();
    const pagoBase={tipo:"pago",proveedor:prov.trim(),empleado:emp.trim(),monto:Number(monto),forma,obs:obs.trim(),fecha:fechaISO};
    await pagarConExcedente(pagoBase,pagos,savePagos);
    // Mercadería descargada (opcional): suma al stock igual que una boleta
    if(lineas.length>0&&saveStock&&stock){
      const stockActual=[...stock];
      lineas.forEach(linea=>{
        const idx=stockActual.findIndex(s=>s.catalogoId===linea.catalogoId);
        const mov={id:uid(),tipo:"entrada",origen:"pago",cantidad:linea.cantidad,obs:`Mercadería recibida — pago a ${prov.trim()}`,fecha:fechaISO};
        if(idx>=0){
          stockActual[idx]={...stockActual[idx],cantidad:stockActual[idx].cantidad+linea.cantidad,movimientos:[mov,...(stockActual[idx].movimientos||[])].slice(0,50)};
        }else{
          stockActual.push({id:uid(),catalogoId:linea.catalogoId,nombre:linea.nombre,proveedor:linea.proveedor,sector:"",cantidad:linea.cantidad,minimo:0,unidad:linea.unidad,movimientos:[mov],fecha:fechaISO});
        }
      });
      await saveStock(stockActual);
    }
    const nLineas=lineas.length;
    setBusy(false);setProv("");setEmp("");setMonto("");setObs("");setFecha(hoyLocal());setLineas([]);setLineaProdId("");setLineaCant("");
    toast("Pago registrado ✓"+(nLineas>0?` · ${nLineas} producto${nLineas!==1?"s":""} al stock`:""));
    return true;
  };

  return(<>
    <ST help={"Registrá acá cuando pagás una deuda a un proveedor.\n\n• Efectivo: descuenta de la caja disponible Y de la deuda del proveedor.\n• Transferencia / Amex: solo descuenta la deuda del proveedor, no toca la caja ni el banco.\n• Amex es nuestra tarjeta de crédito — un pago con Amex queda cargado al resumen, no sale plata todavía. Cuando pagás el resumen de la tarjeta, eso se registra como un Gasto (Pagos Digitales) en la categoría Amex, en efectivo o transferencia según corresponda.\n• Si pagás de más a Avenida o Avenida Digital, el excedente se transfiere automáticamente al otro Avenida.\n• El historial de pagos está al final de esta pantalla."}>Registrar pago</ST><SS>Descuenta la deuda del proveedor. Efectivo también descuenta de caja.</SS>

    {nuevoRegModal&&(
      <div style={{position:"fixed",inset:0,background:"rgba(44,26,14,.65)",zIndex:500,display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
        <div style={{background:"#fff",borderRadius:"20px 20px 0 0",padding:"28px 20px 44px",width:"100%",maxWidth:460}}>
          <p style={{fontFamily:"Georgia,serif",fontSize:"1.1rem",marginBottom:16}}>Nueva persona</p>
          <input value={nuevoRegNombre} onChange={e=>setNuevoRegNombre(e.target.value)} placeholder="Nombre" autoFocus onKeyDown={e=>e.key==="Enter"&&agregarRegistrador()} style={{...iS,marginBottom:16}}/>
          <div style={{display:"flex",gap:10}}>
            <button onClick={()=>{setNuevoRegModal(false);setNuevoRegNombre("");}} style={{flex:1,padding:12,borderRadius:10,border:"none",background:"#E8DCC8",fontWeight:600,cursor:"pointer"}}>Cancelar</button>
            <button onClick={agregarRegistrador} style={{flex:1,padding:12,borderRadius:10,border:"none",background:"#2C1A0E",color:"#fff",fontWeight:600,cursor:"pointer"}}>Agregar</button>
          </div>
        </div>
      </div>
    )}

    <div style={{background:"#2C1A0E",borderRadius:14,padding:"18px 20px",marginBottom:16}}>
      <div style={{fontSize:".65rem",letterSpacing:".08em",textTransform:"uppercase",color:"#E8DCC8",opacity:.7}}>Caja disponible</div>
      <div style={{fontFamily:"Georgia,serif",fontSize:"2rem",color:"#E8DCC8",margin:"4px 0 0"}}>{fmt(saldo)}</div>
      <div style={{fontSize:".72rem",color:"#E8DCC8",opacity:.6}}>Solo aplica a pagos en efectivo</div>
    </div>
    <Btn bg="#B7860B" onClick={()=>setNuevoPagoModal(true)}>+ Registrar pago</Btn>

    {nuevoPagoModal&&(
      <div style={{position:"fixed",inset:0,background:"rgba(44,26,14,.65)",zIndex:500,display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
        <div style={{background:"#fff",borderRadius:"20px 20px 0 0",padding:"24px 20px 40px",width:"100%",maxWidth:460,maxHeight:"92dvh",overflowY:"auto"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
            <p style={{fontFamily:"Georgia,serif",fontSize:"1.1rem"}}>Nuevo pago</p>
            <button onClick={()=>setNuevoPagoModal(false)} style={{background:"none",border:"none",fontSize:"1.3rem",color:"#7B7063",cursor:"pointer",padding:4,lineHeight:1}}>✕</button>
          </div>
          <Field label="Proveedor">
            <select value={prov} onChange={e=>setProv(e.target.value)} style={sS}>
              <option value="">— Elegí un proveedor —</option>
              {proveedores.map(p=><option key={p.id} value={p.nombre}>{p.nombre}</option>)}
            </select>
          </Field>
          <Field label="Registrado por">
            <div style={{display:"flex",gap:8}}>
              <select value={emp} onChange={e=>setEmp(e.target.value)} style={{...sS,flex:1}}>
                <option value="">— Elegí —</option>
                {registradores.map(r=><option key={r.id} value={r.nombre}>{r.nombre}</option>)}
              </select>
              <button onClick={()=>setNuevoRegModal(true)} title="Agregar persona" style={{padding:"10px 14px",border:"1.5px solid #E8DCC8",borderRadius:8,background:"#F9F6F1",fontSize:"1.1rem",cursor:"pointer",flexShrink:0}}>+</button>
            </div>
          </Field>
          <Field label="Monto ($)"><Inp type="number" value={monto} onChange={setMonto} placeholder="0"/></Field>
          <Field label="Forma de pago">
            <select value={forma} onChange={e=>setForma(e.target.value)} style={sS}>
              <option value="Efectivo">Efectivo (descuenta de caja)</option>
              <option value="Transferencia">Transferencia (no descuenta caja)</option>
              <option value="Amex">Amex</option>
            </select>
          </Field>
          {forma==="Efectivo"&&<div style={{fontSize:".78rem",color:"#2D6A4F",background:"#EAF5F0",borderRadius:8,padding:"8px 10px",marginTop:8}}>💵 Este pago descontará de la caja disponible.</div>}
          {forma==="Amex"&&<div style={{fontSize:".78rem",color:"#B7860B",background:"#FEF9E7",borderRadius:8,padding:"8px 10px",marginTop:8}}>💳 No descuenta caja ni banco — queda cargado al resumen de la tarjeta.</div>}
          <Field label="Observaciones"><TA value={obs} onChange={setObs} placeholder="Ej: pago parcial, boleta #..."/></Field>
          <Field label="Fecha del registro"><Inp type="date" value={fecha} onChange={setFecha}/></Field>

          {/* MERCADERÍA DESCARGADA (opcional) */}
          <div style={{marginTop:16,borderTop:"1px solid #F2EAE0",paddingTop:16}}>
            <div style={{fontSize:".78rem",fontWeight:700,color:"#2C1A0E",marginBottom:10}}>📦 Mercadería descargada <span style={{fontWeight:400,color:"#7B7063"}}>(opcional — suma al stock automáticamente)</span></div>
            <div style={{display:"flex",gap:6,alignItems:"flex-end",marginBottom:10}}>
              <div style={{flex:1}}>
                <select value={lineaProdId} onChange={e=>setLineaProdId(e.target.value)} style={{...sS,fontSize:".78rem"}}>
                  <option value="">— Producto —</option>
                  {productosSugeridos.length>0&&<optgroup label={`✓ De ${prov}`}>{productosSugeridos.map(c=><option key={c.id} value={c.id}>{c.producto}</option>)}</optgroup>}
                  {productosResto.length>0&&<optgroup label="Otros productos">{productosResto.map(c=><option key={c.id} value={c.id}>{c.producto} ({c.proveedor})</option>)}</optgroup>}
                </select>
              </div>
              <div style={{width:72}}>
                <input type="number" min="0" value={lineaCant} onChange={e=>setLineaCant(e.target.value)} placeholder="Cant." style={{...iS,fontSize:".82rem",textAlign:"center"}}/>
              </div>
              <button onClick={agregarLinea} style={{padding:"10px 12px",border:"none",borderRadius:8,background:"#2C1A0E",color:"#fff",fontWeight:700,fontSize:"1rem",cursor:"pointer",flexShrink:0}}>+</button>
            </div>
            {lineas.length>0&&(
              <div style={{background:"#F9F6F1",borderRadius:10,overflow:"hidden"}}>
                {lineas.map(l=>(
                  <div key={l.catalogoId} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 12px",borderBottom:"1px solid #F2EAE0"}}>
                    <span style={{flex:1,fontSize:".82rem",color:"#2C1A0E"}}>{l.nombre}</span>
                    <span style={{fontSize:".82rem",fontWeight:700,color:"#2D6A4F"}}>{l.cantidad} {l.unidad}</span>
                    <button onClick={()=>quitarLinea(l.catalogoId)} style={{background:"none",border:"none",color:"#C0392B",fontSize:".8rem",cursor:"pointer",padding:"0 4px"}}>✕</button>
                  </div>
                ))}
                <div style={{padding:"8px 12px",fontSize:".72rem",color:"#7B7063"}}>
                  {lineas.length} producto{lineas.length!==1?"s":""} · suman al stock al guardar
                </div>
              </div>
            )}
          </div>

          <Btn bg="#B7860B" onClick={async()=>{if(await guardar())setNuevoPagoModal(false);}} disabled={busy}>{busy?"Guardando…":"Registrar pago"}</Btn>
        </div>
      </div>
    )}

    {/* REGISTRO DE PAGOS */}
    <UltimosPagos pagos={pagos} cierres={cierres} cajaInicial={cajaInicial} cierresCaja={cierresCaja} sueldos={sueldos} gastos={gastos} ajustesCajaEfectivo={ajustesCajaEfectivo}/>
  </>);
}


function UltimosPagos({pagos,cierres,cajaInicial,cierresCaja,sueldos,gastos,ajustesCajaEfectivo}){
  const hoy=new Date();
  const iso=d=>d.toISOString().slice(0,10);
  const inicioMes=new Date(hoy.getFullYear(),hoy.getMonth(),1);
  const[filtroFecha,setFiltroFecha]=useState("mes");
  const[desde,setDesde]=useState(iso(inicioMes));
  const[hasta,setHasta]=useState(iso(hoy));
  const[filtroTipo,setFiltroTipo]=useState("todos");

  // Todos los pagos en efectivo
  const pagosEf    = (pagos||[]).filter(p=>p.forma==="Efectivo");
  const sueldosEf  = (sueldos||[]).filter(s=>s.forma==="Efectivo");
  const gastosEf   = (gastos||[]).filter(g=>g.forma==="Efectivo");
  const cierresEf  = (cierres||[]).map(c=>({...c,_cat:"cierre",_signo:1,proveedor:"Cierre "+c.turno}));
  const cierresNEf = (cierresCaja||[]).map(c=>({...c,_cat:"cierre",_signo:1,proveedor:"Cierre "+c.turno,monto:c.efectivo}));
  // Ajustes manuales de caja (ver Admin > Ajuste de caja disponible). Sin esto, el saldo de este libro
  // diario quedaba desincronizado del número de "Caja Disponible" (que sí los suma en calcSaldo()).
  const ajustesEf  = (ajustesCajaEfectivo||[]).map(a=>({...a,_cat:"ajuste",_signo:Number(a.monto||0)>=0?1:-1,proveedor:"Ajuste de caja",obs:a.motivo,monto:Math.abs(Number(a.monto||0))}));

  const egresos = [
    ...pagosEf.map(p=>({...p,_cat:"pago",  _signo:-1})),
    ...sueldosEf.map(s=>({...s,_cat:"sueldo",_signo:-1})),
    ...gastosEf.map(g=>({...g,_cat:"gasto", _signo:-1,proveedor:g.categoria})),
  ];
  const ingresos = [...cierresEf,...cierresNEf].map(c=>({...c,_signo:1}));
  const allMovs  = [...egresos,...ingresos,...ajustesEf].sort((a,b)=>a.fecha.localeCompare(b.fecha));

  // Aplicar filtro de fechas
  const desdeF = filtroFecha==="mes" ? iso(inicioMes) : filtroFecha==="hoy" ? iso(hoy) : desde;
  const hastaF = filtroFecha==="mes" ? iso(hoy)       : filtroFecha==="hoy" ? iso(hoy) : hasta;
  const filtrados = allMovs.filter(m=>{
    const f=m.fecha.slice(0,10);
    return(!desdeF||f>=desdeF)&&(!hastaF||f<=hastaF);
  });

  // Saldo base = cajaInicial + todo lo anterior al filtro
  let saldoBase = Number(cajaInicial)||0;
  allMovs.filter(m=>!desdeF||m.fecha.slice(0,10)<desdeF).forEach(m=>{
    saldoBase += m._signo * Number(m.monto||0);
  });

  // Filas con saldo acumulado (calculado asc, mostrado desc)
  const filtradosAsc = [...filtrados].sort((a,b)=>a.fecha.localeCompare(b.fecha));
  let saldoAcum = saldoBase;
  const filasAsc = filtradosAsc.map(m=>{
    const delta = m._signo * Number(m.monto||0);
    saldoAcum += delta;
    return {...m,_delta:delta,_saldo:saldoAcum};
  });
  const filas = [...filasAsc].reverse().filter(f=>{
    if(filtroTipo==="debe") return f._signo<0&&f._cat!=="ajuste";
    if(filtroTipo==="haber") return f._signo>0&&f._cat!=="ajuste";
    return true;
  });

  // Los ajustes de caja no son ingresos ni egresos reales (no hubo una venta ni un pago) — son una
  // corrección del saldo contado. Se muestran aparte, no suman a Ingresos/Egresos ni aparecen en Debe/Haber.
  const totalIngresos = filasAsc.filter(f=>f._signo>0&&f._cat!=="ajuste").reduce((s,f)=>s+f._delta,0);
  const totalEgresos  = filasAsc.filter(f=>f._signo<0&&f._cat!=="ajuste").reduce((s,f)=>s+Math.abs(f._delta),0);
  const totalAjustes  = filasAsc.filter(f=>f._cat==="ajuste").reduce((s,f)=>s+f._delta,0);
  const neto = totalIngresos - totalEgresos + totalAjustes;
  const iconoCat = c=>c==="cierre"?"💵":c==="sueldo"?"👤":c==="gasto"?"🏠":c==="ajuste"?"⚖️":"💸";

  return(
    <div style={{background:"#fff",borderRadius:14,padding:20,boxShadow:"0 2px 12px rgba(44,26,14,.08)",marginTop:16}}>
      <div style={{fontSize:".68rem",fontWeight:700,letterSpacing:".09em",textTransform:"uppercase",color:"#7B7063",marginBottom:14}}>📒 Libro diario · Efectivo</div>

      {/* FILTROS FECHA */}
      <div style={{display:"flex",gap:6,marginBottom:10,flexWrap:"wrap"}}>
        {[["hoy","Hoy"],["mes","Este mes"],["custom","Personalizado"]].map(([v,l])=>(
          <button key={v} onClick={()=>{setFiltroFecha(v);if(v==="mes"){setDesde(iso(inicioMes));setHasta(iso(hoy));}if(v==="hoy"){setDesde(iso(hoy));setHasta(iso(hoy));}}} style={{padding:"5px 12px",borderRadius:20,border:"none",cursor:"pointer",fontSize:".72rem",fontWeight:600,background:filtroFecha===v?"#2C1A0E":"#E8DCC8",color:filtroFecha===v?"#E8DCC8":"#2C1A0E"}}>{l}</button>
        ))}
      </div>
      {filtroFecha==="custom"&&(
        <div style={{display:"flex",gap:8,marginBottom:10}}>
          <div style={{flex:1}}>
            <label style={{display:"block",fontSize:".7rem",fontWeight:600,color:"#7B7063",marginBottom:3}}>Desde</label>
            <input type="date" value={desde} onChange={e=>setDesde(e.target.value)} style={{...iS,fontSize:".82rem",padding:"7px 10px"}}/>
          </div>
          <div style={{flex:1}}>
            <label style={{display:"block",fontSize:".7rem",fontWeight:600,color:"#7B7063",marginBottom:3}}>Hasta</label>
            <input type="date" value={hasta} onChange={e=>setHasta(e.target.value)} style={{...iS,fontSize:".82rem",padding:"7px 10px"}}/>
          </div>
        </div>
      )}

      {/* FILTROS TIPO */}
      <div style={{display:"flex",gap:6,marginBottom:14}}>
        {[["todos","Todos"],["debe","💸 Solo Debe"],["haber","💵 Solo Haber"]].map(([v,l])=>(
          <button key={v} onClick={()=>setFiltroTipo(v)} style={{flex:1,padding:"5px 8px",borderRadius:20,border:"none",cursor:"pointer",fontSize:".72rem",fontWeight:600,
            background:filtroTipo===v?(v==="debe"?"#C0392B":v==="haber"?"#2D6A4F":"#2C1A0E"):"#E8DCC8",
            color:filtroTipo===v?"#fff":"#2C1A0E"}}>{l}</button>
        ))}
      </div>



      {/* TABLA */}
      {!filas.length?<Empty icon="📒">Sin movimientos en efectivo en el período</Empty>:(
        <div style={{overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:".75rem",minWidth:380}}>
            <thead>
              <tr style={{background:"#F9F6F1"}}>
                {["Fecha","Concepto","Debe","Haber","Saldo"].map(h=>(
                  <th key={h} style={{padding:"7px 8px",textAlign:h==="Fecha"||h==="Concepto"?"left":"right",fontWeight:700,color:"#7B7063",fontSize:".63rem",letterSpacing:".05em",textTransform:"uppercase",borderBottom:"2px solid #E8DCC8",whiteSpace:"nowrap"}}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>

              {filas.map((f,i)=>(
                <tr key={f.id+i} style={{background:i%2===0?"#fff":"#F9F6F1"}}>
                  <td style={{padding:"6px 8px",whiteSpace:"nowrap",color:"#7B7063",fontSize:".72rem"}}>
                    {fmtF(f.fecha)}<br/><span style={{fontSize:".62rem"}}>{fmtH(f.fecha)}</span>
                  </td>
                  <td style={{padding:"6px 8px"}}>
                    <div style={{display:"flex",alignItems:"center",gap:5}}>
                      <span style={{flexShrink:0}}>{iconoCat(f._cat)}</span>
                      <div style={{minWidth:0}}>
                        <div style={{fontWeight:600,fontSize:".76rem",lineHeight:1.3}}>{f.proveedor||"—"}</div>
                        {f._cat==="ajuste"?(
                          <div style={{fontSize:".63rem",color:f._signo>0?"#2D6A4F":"#C0392B",fontWeight:700}}>{f._signo>0?"+":"-"}{fmt(Math.abs(f._delta))} · corrección de saldo{f.obs?" · "+f.obs:""}</div>
                        ):(f.obs&&<div style={{fontSize:".63rem",color:"#7B7063",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",maxWidth:100}}>{f.obs}</div>)}
                      </div>
                    </div>
                  </td>
                  <td style={{padding:"6px 8px",textAlign:"right",color:"#C0392B",fontWeight:700,whiteSpace:"nowrap"}}>
                    {f._cat!=="ajuste"&&f._signo<0?fmt(Math.abs(f._delta)):""}
                  </td>
                  <td style={{padding:"6px 8px",textAlign:"right",color:"#2D6A4F",fontWeight:700,whiteSpace:"nowrap"}}>
                    {f._cat!=="ajuste"&&f._signo>0?fmt(f._delta):""}
                  </td>
                  <td style={{padding:"6px 8px",textAlign:"right",fontWeight:700,whiteSpace:"nowrap",color:f._saldo>=0?"#2C1A0E":"#C0392B"}}>{fmt(f._saldo)}</td>
                </tr>
              ))}
              <tr style={{background:"#2C1A0E"}}>
                <td colSpan={2} style={{padding:"8px 10px",color:"#E8DCC8",fontWeight:700,fontSize:".76rem"}}>TOTALES</td>
                <td style={{padding:"8px",textAlign:"right",color:"#f5b7b1",fontWeight:700,whiteSpace:"nowrap"}}>{fmt(totalEgresos)}</td>
                <td style={{padding:"8px",textAlign:"right",color:"#a9dfbf",fontWeight:700,whiteSpace:"nowrap"}}>{fmt(totalIngresos)}</td>
                <td style={{padding:"8px",textAlign:"right",fontWeight:700,whiteSpace:"nowrap",color:neto>=0?"#a9dfbf":"#f5b7b1"}}>{fmt(saldoBase+neto)}</td>
              </tr>
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

function TabProveedores({proveedores,saveProveedores,calcDeuda,pagos,boletas,askPass}){
  const[nombre,setNombre]=useState("");const[deuda,setDeuda]=useState("");
  const[obs,setObs]=useState("");const[busy,setBusy]=useState(false);
  const[filtroNombre,setFiltroNombre]=useState("");
  const[provSel,setProvSel]=useState("");
  const[desdeDet,setDesdeDet]=useState("");
  const[hastaDet,setHastaDet]=useState("");

  const guardar=async()=>{
    if(!nombre.trim()){toast("Ingresá el nombre");return;}
    const ok=await askPass();if(!ok)return;
    setBusy(true);
    const idx=proveedores.findIndex(p=>norm(p.nombre)===norm(nombre));
    let nuevos;
    if(idx>=0){nuevos=proveedores.map((p,i)=>i===idx?{...p,deudaInicial:Number(deuda)||0,obs:obs.trim()}:p);toast("Actualizado ✓");}
    else{nuevos=[...proveedores,{id:uid(),nombre:nombre.trim(),deudaInicial:Number(deuda)||0,obs:obs.trim(),fecha:new Date().toISOString()}];toast("Guardado ✓");}
    await saveProveedores(nuevos);setBusy(false);setNombre("");setDeuda("");setObs("");
  };
  const eliminar=async id=>{
    if(!confirm("¿Eliminar? Los pagos no se borran."))return;
    await saveProveedores(proveedores.filter(p=>p.id!==id));toast("Eliminado");
  };
  const editar=p=>{setNombre(p.nombre);setDeuda(String(p.deudaInicial||""));setObs(p.obs||"");window.scrollTo({top:0,behavior:"smooth"});};

  const sorted=proveedores.map(p=>{const d=calcDeuda(p.nombre);return{...p,_p:d?d.pendiente:0,_i:d?d.totalDeuda:0,_pagado:d?d.pagado:0};}).sort((a,b)=>b._p-a._p);
  const totalPendienteGlobal=sorted.reduce((s,p)=>s+Math.max(0,p._p),0);
  const filtrados=sorted.filter(p=>!filtroNombre||norm(p.nombre).includes(norm(filtroNombre)));

  // Estado de cuenta del proveedor seleccionado
  const provObj=provSel?proveedores.find(p=>norm(p.nombre)===norm(provSel)):null;
  const infoSel=provObj?calcDeuda(provObj.nombre):null;
  const boletasSel=provSel?boletas.filter(b=>norm(b.proveedor)===norm(provSel)).map(b=>({...b,_tipo:"boleta"})):[];
  const pagosSel=provSel?pagos.filter(p=>norm(p.proveedor)===norm(provSel)).map(p=>({...p,_tipo:"pago"})):[];
  const movSel=[...boletasSel,...pagosSel]
    .filter(m=>{
      const f=m.fecha.slice(0,10);
      return(!desdeDet||f>=desdeDet)&&(!hastaDet||f<=hastaDet);
    })
    .sort((a,b)=>a.fecha.localeCompare(b.fecha));

  // Saldo acumulado (se calcula en orden cronológico ascendente para que el saldo corrido sea correcto)
  let saldoAcum=infoSel?infoSel.deudaInicial:0;
  const movConSaldo=movSel.map(m=>{
    if(m._tipo==="boleta") saldoAcum+=Number(m.monto)||0;
    else saldoAcum-=Number(m.monto)||0;
    return{...m,_saldo:saldoAcum};
  });
  // Para mostrar: lo más reciente primero (el saldo ya viene calculado arriba, acá solo se invierte el orden visual)
  const movParaMostrar=[...movConSaldo].reverse();

  const exportarEstadoCuenta=()=>{
    if(!provSel){toast("Elegí un proveedor primero");return;}
    const rows=[["Fecha","Tipo","Detalle","Cargo","Pago","Saldo"]];
    if(infoSel&&infoSel.deudaInicial) rows.push(["-","Deuda inicial","",infoSel.deudaInicial,"",infoSel.deudaInicial]);
    movConSaldo.forEach(m=>{
      const cargo=m._tipo==="boleta"?m.monto:"";
      const pago =m._tipo!=="boleta"?m.monto:"";
      rows.push([fmtF(m.fecha),m._tipo==="boleta"?"Boleta":m.forma,m.obs||"",cargo,pago,m._saldo.toFixed(2)]);
    });
    const csv=rows.map(r=>r.map(v=>`"${String(v||"").replace(/"/g,'""')}"`).join(",")).join("\n");
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8;"}));
    a.download=`estado_cuenta_${provSel.replace(/\s+/g,"_")}.csv`;a.click();
  };

  return(<>
    <ST help={"Muestra el estado de cuenta de cada proveedor: cuánto se le debe en total.\n\n• La deuda = suma de boletas − suma de pagos.\n• Podés ver el detalle de movimientos de cada proveedor tocando su nombre.\n• Para agregar un proveedor nuevo usá el botón + en la pantalla de Boletas o Pagos."}>Proveedores</ST><SS>Estado de cuenta y deuda por proveedor.</SS>

    {/* PANEL TOTAL */}
    <div style={{background:"#C0392B",borderRadius:14,padding:"18px 20px",marginBottom:16}}>
      <div style={{fontSize:".65rem",letterSpacing:".08em",textTransform:"uppercase",color:"#fff",opacity:.8}}>Total deuda a proveedores</div>
      <div style={{fontFamily:"Georgia,serif",fontSize:"2.2rem",color:"#fff",margin:"4px 0 2px"}}>{fmt(totalPendienteGlobal)}</div>
      <div style={{fontSize:".74rem",color:"#fff",opacity:.7}}>Suma de deudas pendientes · {sorted.length} proveedor{sorted.length!==1?"es":""}</div>
