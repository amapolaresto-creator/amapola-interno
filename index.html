          <span style={{fontFamily:"Georgia,serif",fontSize:"1.2rem",color:"#2C1A0E"}}>📖 Manual de uso — Liquidación de sueldos</span>
          <button onClick={onClose} style={{background:"none",border:"none",fontSize:"1.3rem",cursor:"pointer",color:"#7B7063"}}>✕</button>
        </div>

        <Sec title="Dos partes en una sola pantalla">
          Desde 2026-08-20, "Liquidación de sueldos" reemplaza a la vieja pestaña "Sueldos" y tiene dos partes bien separadas. Arriba de todo, <b>Registrar pago de sueldo</b> — sin contraseña, la puede usar cualquiera (por ejemplo desde Pagos, tocando "👤 Pagar sueldo", se entra directo acá). Más abajo, <b>Nómina y Liquidaciones</b> — armar el sueldo de cada empleado mes a mes, ver la Nómina, Penalidades, Adelantos y HS Extras — pide la clave de administrador para verse, aunque no hayas entrado al modo Admin general de la app.
        </Sec>

        <Sec title="Qué hace la Nómina">
          Acá armás el sueldo de cada empleado, mes a mes: cargás lo que suma (Haberes) y lo que resta (Descuentos), el sistema calcula el Neto a cobrar, y al confirmar generás un recibo para imprimir o guardar en PDF. Esto NO registra un pago ni descuenta ninguna caja — el pago real se carga arriba de todo (Registrar pago de sueldo), o desde Caja Disponible o Caja Digital, con concepto "Sueldo" y la forma que corresponda: Efectivo, Transferencia o Retiro.
        </Sec>

        <Sec title="Paso a paso">
          1. Tocá "Desbloquear con clave de administrador" para entrar a Nómina y Liquidaciones.<br/>
          2. Elegí el Período (mes) arriba de la Nómina.<br/>
          3. En la fila del empleado, tocá "Liquidar" (o "Editar" si ya existe una liquidación de ese período).<br/>
          4. Completá los campos de Haberes y Descuentos que correspondan.<br/>
          5. Revisá el Neto a cobrar al final de la pantalla.<br/>
          6. "Guardar borrador" guarda sin cerrar — se puede seguir editando después.<br/>
          7. "Confirmar y generar recibo" cierra la liquidación de ese mes y abre el recibo listo para imprimir.<br/>
          8. Con la liquidación confirmada, registrá el pago desde "Registrar pago de sueldo" (arriba de todo, en esta misma pantalla) o desde Caja Disponible/Caja Digital — elegí empleado, concepto "Sueldo" y la forma que corresponda. La app detecta sola que existe una liquidación confirmada de ese período y lo enlaza, así la columna Estado de la Nómina pasa a mostrar "Pago parcial" o "💵 Pagada" sin que tengas que hacer nada más.
        </Sec>

        <Sec title="Haberes (lo que suma)">
          <b>Sueldo básico:</b> el sueldo fijo del mes.<br/>
          <b>Horas extras:</b> se autocompleta con lo cargado en el módulo ⏱️ HS Extras para ese período (se puede corregir a mano) — el sistema multiplica la cantidad de horas por el valor hora (básico ÷ 208 × 2).<br/>
          <b>Bono base:</b> el bono de referencia del empleado. Lo que realmente se liquida depende de "Penalidades X" (ver Descuentos): puede duplicarse, quedar igual, o descontarse.<br/>
          <b>Feriados:</b> cargás la cantidad de feriados trabajados — se multiplican por el valor feriado (básico ÷ 208 × 8).<br/>
          <b>Plus vacacional / Plus SAC:</b> montos manuales, cuando corresponda.
        </Sec>

        <Sec title="Descuentos (lo que resta)">
          <b>Ausencias:</b> cargás la cantidad de días que faltó — se multiplican por el valor día (básico ÷ 208 × 8).<br/>
          <b>Penalidades X:</b> cargás un número. 0 → el bono se liquida x2. De 1 a 4 → el bono se liquida sin cambios. 5 o más → se descuenta $5.000 por cada punto, con tope: nunca más que el propio bono base (nunca queda negativo).<br/>
          <b>Desperdicios:</b> descuenta solo lo que haya quedado disponible del bono después de aplicar Penalidades X. Si el bono ya quedó en $0, Desperdicios no puede descontar nada más.<br/>
          <b>Adelantos:</b> se autocompleta solo con lo que ese empleado tenga cargado como "Adelanto" en Registrar pago de sueldo, en el mismo período que estás liquidando. Se puede corregir a mano.<br/>
          <b>Consumos:</b> monto manual.
        </Sec>

        <Sec title="⚡ Penalidades — carga rápida de una X">
          Hay una pantalla aparte, sin contraseña, pensada para cargar rápido desde el celular: tocás el nombre del empleado, sumás una X con un motivo (Celular, Llegada tarde, Salió sin avisar, u otro a elección) y una fecha (por defecto, hoy). El botón ⚡ Penalidades acá adentro muestra lo mismo, más el historial completo del período con opción de borrar una X cargada por error.<br/><br/>
          Cuando abrís una liquidación nueva, el campo "Penalidades X" ya viene con la cantidad de X que tiene ese empleado en el período que estás liquidando. Si la liquidación ya existía, respeta el número que ya tenía guardado (no se pisa solo).
        </Sec>

        <Sec title="💵 Adelantos">
          Este botón muestra, para el período elegido, todos los adelantos cargados en Registrar pago de sueldo (concepto "Adelanto") agrupados por empleado, con el total de cada uno. Si aparece un cartel de "adelantos sin relacionar", es porque el nombre cargado ahí no coincide con ningún empleado activo — conviene revisar y corregir el nombre.
        </Sec>

        <Sec title="⏱️ HS Extras">
          Igual que Penalidades: hay una pantalla aparte, sin contraseña, para cargar rápido la cantidad de horas extra que hizo cada empleado, con fecha (por defecto, hoy) y una nota opcional. El botón ⏱️ HS Extras acá adentro muestra lo mismo, más el historial completo del período con opción de borrar un registro cargado por error.<br/><br/>
          Cuando abrís una liquidación nueva, el campo "Horas extras" ya viene con el total de horas cargadas para ese empleado en el período que estás liquidando.
        </Sec>

        <Sec title="Importante: qué período se está liquidando">
          Todo (Penalidades, Adelantos, HS Extras, la liquidación en sí) sigue el Período que tengas elegido arriba, no el mes calendario de hoy. Si estás parado en septiembre pero elegiste "agosto" como período, vas a ver y liquidar los datos de agosto.
        </Sec>

        <Sec title="El recibo">
          El recibo separa el Sueldo (básico, horas extras, feriados, plus) de los Descuentos, y muestra el Bono en un recuadro aparte justo antes del Neto a cobrar, aclarando que no integra el aguinaldo — para que el empleado entienda que su sueldo es una cosa y el bono es un adicional.
        </Sec>

        <Sec title="Editar después de confirmar">
          Se puede reabrir y modificar una liquidación ya confirmada. Si esa liquidación ya tiene un pago registrado, va a aparecer un cartel de advertencia arriba: si cambiás montos después de haber pagado, el neto puede quedar desalineado con lo ya pagado — conviene revisarlo con cuidado.
        </Sec>

        <Sec title="Registrar el pago">
          Ya no hay un botón de pago propio dentro de la liquidación. Con la liquidación confirmada, el pago se registra desde "Registrar pago de sueldo" (arriba de todo, en esta misma pantalla, sin clave) o desde Caja Disponible/Caja Digital: elegí el empleado, concepto "Sueldo", y la forma que corresponda — Efectivo, Transferencia, o Retiro (si ya se había sacado la plata antes de la caja retiro para sueldos). La app detecta sola la liquidación confirmada de ese período y enlaza el pago. También se puede pagar de a partes (pago parcial): el sistema suma todo lo pagado hasta llegar al neto.
        </Sec>

        <Sec title="Para tener en cuenta">
          Si cargás un pago "Sueldo" para alguien que ya tiene esa liquidación pagada del todo, el sistema avisa antes de guardar, para evitar pagar dos veces por error.
        </Sec>
      </div>
    </div>
  );
}
function LiquidacionSueldos({empleados,saveEmpleados,liquidaciones,saveLiquidaciones,sueldos,saveSueldos,saldo,gastos,penalidades,savePenalidades,horasExtras,saveHorasExtras}){
  const empleadosActivos=(empleados||[]).filter(e=>e.estado!=="Inactivo"&&!e.excluirLiquidacion).slice().sort((a,b)=>a.nombre.localeCompare(b.nombre));
  const[periodo,setPeriodo]=useState(()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");});
  const[editando,setEditando]=useState(null);
  const[form,setForm]=useState(null);
  const[busy,setBusy]=useState(false);
  const[verBasicos,setVerBasicos]=useState(false);
  const[basicosDraft,setBasicosDraft]=useState({});
  const[bonosDraft,setBonosDraft]=useState({});
  const[legajoDraft,setLegajoDraft]=useState({});
  const[legajoAbierto,setLegajoAbierto]=useState(null);
  const[verNomina,setVerNomina]=useState(false);
  const[verPenalidadesAdmin,setVerPenalidadesAdmin]=useState(false);
  const[verAdelantosAdmin,setVerAdelantosAdmin]=useState(false);
  const[verHsExtrasAdmin,setVerHsExtrasAdmin]=useState(false);
  const[verManual,setVerManual]=useState(false);

  // Desbloqueo de Nómina/Liquidaciones con la clave de administrador (independiente del "Admin" general
  // de la app): el registro de pago de sueldo de acá abajo es público (sin clave), pero todo lo demás
  // (liquidar sueldos, ver nómina, penalidades, adelantos, hs extras) sigue pidiendo la clave.
  const[nominaUnlocked,setNominaUnlocked]=useState(false);
  const[pinModal,setPinModal]=useState(false);
  const[pinInput,setPinInput]=useState("");
  const[pinErr,setPinErr]=useState(false);
  const confirmarPin=()=>{
    if(pinInput===ADMIN_PASS){setNominaUnlocked(true);setPinModal(false);setPinInput("");setPinErr(false);}
    else{setPinErr(true);setPinInput("");}
  };

  // --- Registrar pago de sueldo (público, sin clave) — antes era la pestaña propia "Sueldos" ---
  const EMPS_PAGO=empleadosActivos.map(e=>e.nombre);
  // Chequeo anti-duplicado: si el empleado ya tiene la liquidación de ese período pagada del todo,
  // avisar antes de cargar otro "Sueldo" manual (podría ser un pago repetido sin querer).
  const nombreCoincideSueldo=(sNombre,empNombre)=>{
    const a=(sNombre||"").trim().toLowerCase();
    const b=(empNombre||"").trim().toLowerCase();
    if(!a||!b)return false;
    if(a===b)return true;
    return b.startsWith(a)||a.startsWith(b);
  };
  // Liquidación confirmada de ese empleado+período (si existe) — se usa tanto para el aviso de "ya está
  // pagada" como para enlazar automáticamente el pago (liquidacionId) cuando el concepto es "Sueldo".
  const liquidacionConfirmadaDe=(nombreEmp,per)=>{
    const empMatch=(empleados||[]).find(e=>nombreCoincideSueldo(nombreEmp,e.nombre));
    if(!empMatch)return null;
    return(liquidaciones||[]).find(l=>l.empleadoId===empMatch.id&&l.periodo===per&&l.estado==="confirmada")||null;
  };
  const liquidacionYaPagadaCheck=(nombreEmp,per)=>{
    const liq=liquidacionConfirmadaDe(nombreEmp,per);
    if(!liq)return null;
    const pagado=(sueldos||[]).filter(s=>s.liquidacionId===liq.id).reduce((s2,s)=>s2+Number(s.monto||0),0);
    return pagado>0&&Math.round(pagado*100)>=Math.round(Number(liq.neto||0)*100)?{liq,pagado}:null;
  };
  // Saldo de la caja retiro para sueldos (plata ya sacada de Caja Disponible en Pagos o Caja Disponible,
  // categoría "Retiro para sueldos") — no debería dejarse cargar más "Retiro" que lo que efectivamente
  // se sacó y todavía no se usó. También la puede usar el gasto categoría "DIGITAL" (retiros de ganancia).
  const totalRetirado=(gastos||[]).filter(g=>g.forma==="Efectivo"&&(g.categoria||"").trim().toLowerCase()===RETIRO_SUELDOS_CAT.toLowerCase()).reduce((s,g)=>s+Number(g.monto||0),0);
  const totalUsadoDeRetiro=(sueldos||[]).filter(s=>s.forma==="Retiro").reduce((s2,s)=>s2+Number(s.monto||0),0)
    +(gastos||[]).filter(g=>g.forma==="Retiro"&&(g.categoria||"").trim().toLowerCase()===RETIRO_GANANCIA_CAT.toLowerCase()).reduce((s2,g)=>s2+Number(g.monto||0),0);
  const saldoRetiro=totalRetirado-totalUsadoDeRetiro;
  const[empPago,setEmpPago]=useState("");const[montoPago,setMontoPago]=useState("");
  const[formaPago,setFormaPago]=useState("Efectivo");const[obsPago,setObsPago]=useState("");
  const[busyPago,setBusyPago]=useState(false);
  const[fechaPago,setFechaPago]=useState(hoyLocal());
  const[conceptoPago,setConceptoPago]=useState("Sueldo");
  const[hsExtrasPago,setHsExtrasPago]=useState("");
  const[crearModalPago,setCrearModalPago]=useState(false);const[nuevoEmpPago,setNuevoEmpPago]=useState("");
  const[listaEmpsPago,setListaEmpsPago]=useState(EMPS_PAGO);
  useEffect(()=>{
    setListaEmpsPago(l=>{
      const extra=l.filter(n=>!EMPS_PAGO.includes(n));
      return[...EMPS_PAGO,...extra];
    });
  },[JSON.stringify(EMPS_PAGO)]);
  const guardarPagoSueldo=async()=>{
    if(!empPago||!montoPago){toast("Elegí un empleado e ingresá el monto");return;}
    if(formaPago==="Efectivo"&&Number(montoPago)>saldo){
      if(!confirm(`⚠️ Esto supera la caja disponible (${fmt(saldo)}) — va a quedar en ${fmt(saldo-Number(montoPago))}. ¿Confirmás igual?`))return;
    }
    if(formaPago==="Retiro"&&Number(montoPago)>saldoRetiro){toast("⚠️ Supera el saldo de caja retiro para sueldos ("+fmt(saldoRetiro)+")");return;}
    let liquidacionId=null;
    if(conceptoPago==="Sueldo"){
      const per=(fechaPago||hoyLocal()).slice(0,7);
      const chk=liquidacionYaPagadaCheck(empPago,per);
      if(chk&&!confirm("⚠️ "+empPago+" ya tiene la liquidación de "+per+" pagada por completo ("+fmt(chk.pagado)+"). ¿Registrar este pago de todas formas?"))return;
      const liq=liquidacionConfirmadaDe(empPago,per);
      if(liq)liquidacionId=liq.id;
    }
    setBusyPago(true);
    await saveSueldos([...sueldos,{id:uid(),tipo:"sueldo",empleado:empPago,concepto:conceptoPago,hsExtras:conceptoPago==="HS Extras"?Number(hsExtrasPago)||0:null,monto:Number(montoPago),forma:formaPago,obs:obsPago.trim(),fecha:fechaLocalISO(fechaPago),...(liquidacionId?{liquidacionId}:{})}]);
    setBusyPago(false);setEmpPago("");setMontoPago("");setObsPago("");setFechaPago(hoyLocal());setConceptoPago("Sueldo");setHsExtrasPago("");toast(liquidacionId?"Sueldo registrado ✓ — vinculado a la liquidación del período":"Sueldo registrado ✓");
  };
  const crearEmpPago=()=>{
    if(!nuevoEmpPago.trim()){toast("Ingresá un nombre");return;}
    setListaEmpsPago(l=>[...l,nuevoEmpPago.trim()]);
    setEmpPago(nuevoEmpPago.trim());setNuevoEmpPago("");setCrearModalPago(false);
    toast("Empleado creado ✓");
  };
  const hoyPago=new Date().toDateString();
  const hoyItemsPago=(sueldos||[]).filter(s=>new Date(s.fecha).toDateString()===hoyPago).slice().reverse();
  const totalMesPago=(sueldos||[]).filter(s=>{const d=new Date(s.fecha);const n=new Date();return d.getMonth()===n.getMonth()&&d.getFullYear()===n.getFullYear();}).reduce((a,s)=>a+Number(s.monto||0),0);

  const mesLabel=p=>{const[y,m]=p.split("-");return new Date(Number(y),Number(m)-1,1).toLocaleDateString("es-AR",{month:"long",year:"numeric"});};
  const liqDe=(empId,per)=>(liquidaciones||[]).find(l=>l.empleadoId===empId&&l.periodo===per);
  const num=v=>Number(v)||0;

  // Adelantos: se cargan en "Registrar pago de sueldo" acá arriba (concepto "Adelanto") con el nombre del
  // empleado como texto libre. Alias conocidos de nombres viejos que no coinciden tal cual con el real.
  const ALIAS_ADELANTOS={mike:"michael"};
  const nombreCoincide=(sNombre,empNombre)=>{
    const a=(sNombre||"").trim().toLowerCase();
    const b=(empNombre||"").trim().toLowerCase();
    if(!a||!b)return false;
    if(a===b)return true;
    if(ALIAS_ADELANTOS[a]&&b.startsWith(ALIAS_ADELANTOS[a]))return true;
    return b.startsWith(a)||a.startsWith(b);
  };
  const adelantosDe=(emp,per)=>(sueldos||[]).filter(s=>s.concepto==="Adelanto"&&(s.fecha||"").slice(0,7)===per&&nombreCoincide(s.empleado,emp.nombre));
  const adelantosSinEmparejar=per=>(sueldos||[]).filter(s=>s.concepto==="Adelanto"&&(s.fecha||"").slice(0,7)===per&&!empleadosActivos.some(e=>nombreCoincide(s.empleado,e.nombre)));

  // El pago real de una liquidación confirmada ya NO se registra desde acá (se sacó el botón 💰 Pago):
  // Adrian paga directo desde Caja Disponible, Caja Digital o "Registrar pago de sueldo" acá arriba mismo
  // (Efectivo/Transferencia/Retiro), que son las mismas "3 cajas" que ya usa para todo lo demás. Esos tres lugares, al registrar
  // un pago concepto "Sueldo", buscan solos si hay una liquidación confirmada de ese empleado+período y le
  // ponen el liquidacionId correspondiente — así pagadoDe() de acá abajo sigue sumando bien sin que haga
  // falta un flujo de pago aparte dentro de este módulo. Admite pagos parciales igual que antes: si un
  // pago no cubre el neto completo, queda como pago parcial hasta que se complete con otro.
  const pagadoDe=liqId=>(sueldos||[]).filter(s=>s.liquidacionId===liqId).reduce((s2,s)=>s2+Number(s.monto||0),0);

  // Horas extras: cantidad de horas × valor hora (básico/208×2). Bono: 0 llegadas tarde/faltas = bono base x2;
  // 1 a 4 = sin cambios (tolerancia); ≥5 = bono base - (cantidad×5000), con tope en el propio bono base (nunca negativo).
  // Ausencias: cantidad de días × valor día (básico/208×8). Feriados: cantidad de feriados × valor feriado (básico/208×8, mismo valor que muestra la Nómina).
  const haberesCalc=f=>{
    const basico=num(f.sueldoBasico);
    const valorHsExtraHora=Math.round((basico/208*2)*100)/100;
    const hsExtrasCantSet=f.hsExtrasCant!==undefined&&f.hsExtrasCant!=="";
    const hsExtrasMonto=hsExtrasCantSet?Math.round(num(f.hsExtrasCant)*valorHsExtraHora*100)/100:num(f.hsExtras);
    const bonoBaseSet=f.bonoBase!==undefined&&f.bonoBase!=="";
    const bonoBase=bonoBaseSet?num(f.bonoBase):num(f.bono);
    const bonoCantSet=f.bonoCant!==undefined&&f.bonoCant!=="";
    const bonoCant=bonoCantSet?Math.max(0,num(f.bonoCant)):null;
    const bonoMonto=bonoCant===null?bonoBase:(bonoCant===0?bonoBase*2:(bonoCant<5?bonoBase:Math.max(0,bonoBase-Math.min(bonoCant*5000,bonoBase))));
    const valorFeriado=Math.round((basico/208*8)*100)/100;
    const feriadosCantSet=f.feriadosCant!==undefined&&f.feriadosCant!=="";
    const feriadosMonto=feriadosCantSet?Math.round(num(f.feriadosCant)*valorFeriado*100)/100:num(f.feriados);
    const otros=feriadosMonto+num(f.plusVacacional)+num(f.plusSac);
    const subtotal=basico+hsExtrasMonto+bonoMonto+otros;
    const valorAusenciaDia=Math.round((basico/208*8)*100)/100;
    const ausenciasCantSet=f.ausenciasCant!==undefined&&f.ausenciasCant!=="";
    const ausenciasMonto=ausenciasCantSet?Math.round(num(f.ausenciasCant)*valorAusenciaDia*100)/100:num(f.ausencias);
    // Desperdicios: descuenta solo lo que quede disponible del bono (bonoMonto, ya neto de Penalidades X). Tope: ese remanente.
    const bonoDisponible=Math.max(0,bonoMonto);
    const desperdiciosInputSet=f.desperdiciosInput!==undefined&&f.desperdiciosInput!=="";
    const desperdiciosRaw=desperdiciosInputSet?num(f.desperdiciosInput):num(f.desperdicios);
    const desperdiciosMonto=Math.min(desperdiciosRaw,bonoDisponible);
    const totalDescuentos=ausenciasMonto+num(f.adelantos)+num(f.consumos)+desperdiciosMonto;
    return{valorHsExtraHora,hsExtrasMonto,bonoBase,bonoMonto,valorFeriado,feriadosMonto,subtotal,valorAusenciaDia,ausenciasMonto,bonoDisponible,desperdiciosMonto,totalDescuentos};
  };

  const abrirLiquidacion=emp=>{
    const existente=liqDe(emp.id,periodo);
    setEditando(emp);
    const basicoRef=Number(emp.sueldoBasicoRef)||0;
    const bonoRef=Number(emp.bonoRef)||0;
    if(existente){
      setForm({
        ...existente,
        bonoBase:existente.bonoBase!==undefined?existente.bonoBase:(existente.bono!==undefined&&existente.bono!==""?String(existente.bono):(bonoRef?String(bonoRef):"")),
        hsExtrasCant:existente.hsExtrasCant!==undefined?existente.hsExtrasCant:"",
        bonoCant:existente.bonoCant!==undefined?existente.bonoCant:"",
        ausenciasCant:existente.ausenciasCant!==undefined?existente.ausenciasCant:"",
        feriadosCant:existente.feriadosCant!==undefined?existente.feriadosCant:"",
        desperdiciosInput:existente.desperdiciosInput!==undefined?existente.desperdiciosInput:"",
      });
    }else{
      const xDelMes=(penalidades||[]).filter(p=>p.empleadoId===emp.id&&p.periodo===periodo).length;
      const adelantosMes=adelantosDe(emp,periodo).reduce((s,x)=>s+Number(x.monto||0),0);
      const hsExtrasMes=(horasExtras||[]).filter(h=>h.empleadoId===emp.id&&h.periodo===periodo).reduce((s,h)=>s+Number(h.horas||0),0);
      setForm({
        id:uid(),empleadoId:emp.id,periodo,
        sueldoBasico:basicoRef?String(basicoRef):"",
        hsExtrasCant:hsExtrasMes>0?String(hsExtrasMes):"",
        bonoBase:bonoRef?String(bonoRef):"",
        bonoCant:xDelMes>0?String(xDelMes):"",
        feriadosCant:"",
        plusVacacional:"",plusSac:"",
        ausenciasCant:"",
        penalidad:"",adelantos:adelantosMes>0?String(adelantosMes):"",consumos:"",desperdiciosInput:"",
        obs:"",estado:"borrador",fecha:new Date().toISOString(),fechaConfirmacion:null,
      });
    }
  };

  const setLegajoCampo=(empId,campo,valor)=>{
    setLegajoDraft(d=>({...d,[empId]:{...d[empId],[campo]:valor}}));
  };
  const guardarValores=async emp=>{
    const vB=basicosDraft[emp.id];
    const vBo=bonosDraft[emp.id];
    const vL=legajoDraft[emp.id];
    if(vB===undefined&&vBo===undefined&&!vL)return;
    await saveEmpleados(empleados.map(e=>e.id===emp.id?{...e,
      sueldoBasicoRef:vB!==undefined?(Number(vB)||0):(e.sueldoBasicoRef||0),
      bonoRef:vBo!==undefined?(Number(vBo)||0):(e.bonoRef||0),
      dni:vL&&vL.dni!==undefined?vL.dni:(e.dni||""),
      cuit:vL&&vL.cuit!==undefined?vL.cuit:(e.cuit||""),
      fechaNac:vL&&vL.fechaNac!==undefined?vL.fechaNac:(e.fechaNac||""),
      domicilio:vL&&vL.domicilio!==undefined?vL.domicilio:(e.domicilio||""),
      telPropio:vL&&vL.telPropio!==undefined?vL.telPropio:(e.telPropio||""),
      telContacto:vL&&vL.telContacto!==undefined?vL.telContacto:(e.telContacto||""),
    }:e));
    toast("Valores agendados ✓");
  };

  const guardar=async confirmar=>{
    const{hsExtrasMonto,bonoMonto,feriadosMonto,subtotal,ausenciasMonto,desperdiciosMonto,totalDescuentos}=haberesCalc(form);
    if(subtotal<=0){toast("Cargá al menos un haber (ej. sueldo básico)");return null;}
    setBusy(true);
    const registro={...form,empleadoId:editando.id,empleadoNombre:(editando.nombre+" "+(editando.apellido||"")).trim(),periodo,
      hsExtras:hsExtrasMonto,bono:bonoMonto,ausencias:ausenciasMonto,feriados:feriadosMonto,desperdicios:desperdiciosMonto,
      subtotal,totalDescuentos,neto:subtotal-totalDescuentos,
      estado:confirmar?"confirmada":(form.estado||"borrador"),
      fechaConfirmacion:confirmar?new Date().toISOString():(form.fechaConfirmacion||null),
      fecha:form.fecha||new Date().toISOString()};
    await saveLiquidaciones([registro,...(liquidaciones||[]).filter(l=>l.id!==registro.id)]);
    setForm(registro);setBusy(false);
    toast(confirmar?"Liquidación confirmada ✓":"Borrador guardado ✓");
    return registro;
  };

  const confirmarYRecibo=async()=>{
    const w=window.open("","_blank");
    const reg=await guardar(true);
    if(!reg){if(w)w.close();return;}
    if(w){w.document.write(reciboHTML(reg,editando));w.document.close();}
    else toast("Habilitá las ventanas emergentes para ver el recibo");
  };
  const verRecibo=()=>{
    const w=window.open("","_blank");
    if(w){w.document.write(reciboHTML(form,editando));w.document.close();}
  };
  const verReciboDe=(liq,emp)=>{
    const w=window.open("","_blank");
    if(w){w.document.write(reciboHTML(liq,emp));w.document.close();}
    else toast("Habilitá las ventanas emergentes para ver el recibo");
  };

  if(editando&&form){
    const{valorHsExtraHora,hsExtrasMonto,bonoBase,bonoMonto,valorFeriado,feriadosMonto,subtotal,valorAusenciaDia,ausenciasMonto,bonoDisponible,desperdiciosMonto,totalDescuentos}=haberesCalc(form);
    const neto=subtotal-totalDescuentos;
    const bonoCantVacio=form.bonoCant===undefined||form.bonoCant==="";
    const yaPagadoForm=form.id?pagadoDe(form.id):0;
    const inpCell={width:86,border:"1px solid #E8DCC8",borderRadius:6,padding:"5px 6px",fontSize:".72rem",textAlign:"right",fontFamily:"inherit",color:"#2C1A0E",background:"#fff",outline:"none",boxSizing:"border-box"};
    return(<>
      <button onClick={()=>{setEditando(null);setForm(null);}} style={{display:"flex",alignItems:"center",gap:6,background:"none",border:"none",color:"#7B7063",fontSize:".8rem",fontWeight:600,cursor:"pointer",marginBottom:14,padding:0}}>← Volver a la nómina</button>
      <div style={{fontFamily:"Georgia,serif",fontSize:"1.15rem",marginBottom:2}}>{editando.nombre} {editando.apellido||""}</div>
      <div style={{fontSize:".78rem",color:"#7B7063",marginBottom:16}}>{mesLabel(periodo)}{form.estado==="confirmada"&&<span style={{marginLeft:8,color:"#2D6A4F",fontWeight:700}}>✓ Confirmada</span>}</div>

      {yaPagadoForm>0&&(
        <div style={{background:"#FBEAEA",border:"1px solid #F3C7C2",borderRadius:10,padding:"10px 14px",marginBottom:16,fontSize:".78rem",color:"#C0392B"}}>
          ⚠️ Ya se registró un pago de {fmt(yaPagadoForm)} para esta liquidación. Si cambiás los montos y guardás de nuevo, el neto puede quedar desalineado con lo ya pagado — revisalo antes de confirmar.
        </div>
      )}

      <div style={{display:"flex",flexWrap:"wrap",gap:16}}>
      <div style={{flex:"1 1 440px",minWidth:0}}>
      <Card title="Haberes">
        <div style={{overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:".75rem",minWidth:400}}>
            <thead>
              <tr style={{background:"#F9F6F1"}}>
                {["Concepto","Cargás","Importe"].map(h=>(
                  <th key={h} style={{padding:"7px 8px",textAlign:h==="Concepto"?"left":"right",fontWeight:700,color:"#7B7063",fontSize:".63rem",letterSpacing:".05em",textTransform:"uppercase",borderBottom:"2px solid #E8DCC8",whiteSpace:"nowrap"}}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {[
                {label:"Sueldo básico",sub:null,val:form.sueldoBasico,onVal:v=>setForm(f=>({...f,sueldoBasico:v})),imp:null},
                {label:"Horas extras",sub:"valor hora "+fmt(valorHsExtraHora),val:form.hsExtrasCant!==undefined?form.hsExtrasCant:"",onVal:v=>setForm(f=>({...f,hsExtrasCant:v})),imp:fmt(hsExtrasMonto)},
                {label:"Bono base",sub:null,val:form.bonoBase!==undefined?form.bonoBase:"",onVal:v=>setForm(f=>({...f,bonoBase:v})),imp:fmt(bonoMonto)+" a liquidar"},
                {label:"Feriados",sub:"valor feriado "+fmt(valorFeriado),val:form.feriadosCant!==undefined?form.feriadosCant:"",onVal:v=>setForm(f=>({...f,feriadosCant:v})),imp:fmt(feriadosMonto)},
                {label:"Plus vacacional",sub:null,val:form.plusVacacional,onVal:v=>setForm(f=>({...f,plusVacacional:v})),imp:null},
                {label:"Plus SAC",sub:null,val:form.plusSac,onVal:v=>setForm(f=>({...f,plusSac:v})),imp:null},
              ].map((r,i)=>(
                <tr key={r.label} style={{background:i%2===0?"#fff":"#F9F6F1"}}>
                  <td style={{padding:"6px 8px",fontWeight:600,whiteSpace:"nowrap"}}>{r.label}{r.sub&&<div style={{fontSize:".63rem",color:"#7B7063",fontWeight:400}}>{r.sub}</div>}</td>
                  <td style={{padding:"6px 4px",textAlign:"right"}}>
                    <input type="number" min="0" value={r.val} onChange={e=>r.onVal(e.target.value)} placeholder="0" style={inpCell}/>
                  </td>
                  <td style={{padding:"6px 8px",textAlign:"right",color:"#2C1A0E",fontWeight:600,whiteSpace:"nowrap"}}>{r.imp||"—"}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"14px 0 0",marginTop:8,borderTop:"1px solid #F2EAE0"}}>
          <span style={{fontWeight:700,fontSize:".85rem"}}>Subtotal</span>
          <span style={{fontFamily:"Georgia,serif",fontSize:"1.2rem",fontWeight:700,color:"#2D6A4F"}}>{fmt(subtotal)}</span>
        </div>
      </Card>
      </div>

      <div style={{flex:"1 1 440px",minWidth:0}}>
      <Card title="Descuentos">
        <div style={{overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:".75rem",minWidth:400}}>
            <thead>
              <tr style={{background:"#F9F6F1"}}>
                {["Concepto","Cargás","Importe"].map(h=>(
                  <th key={h} style={{padding:"7px 8px",textAlign:h==="Concepto"?"left":"right",fontWeight:700,color:"#7B7063",fontSize:".63rem",letterSpacing:".05em",textTransform:"uppercase",borderBottom:"2px solid #E8DCC8",whiteSpace:"nowrap"}}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {[
                {label:"Ausencias",sub:"valor día "+fmt(valorAusenciaDia),val:form.ausenciasCant!==undefined?form.ausenciasCant:"",onVal:v=>setForm(f=>({...f,ausenciasCant:v})),imp:fmt(ausenciasMonto)},
                {label:<>Penalidades <span style={{color:"#C0392B"}}>X</span></>,sub:null,val:form.bonoCant!==undefined?form.bonoCant:"",onVal:v=>setForm(f=>({...f,bonoCant:v})),ph:"0 = x2",
                  imp:bonoCantVacio?"—":(num(form.bonoCant)===0?"bono x2":(num(form.bonoCant)<5?"sin cambios":"-"+fmt(Math.min(Math.max(0,num(form.bonoCant))*5000,bonoBase))+" del bono"))},
                {label:"Desperdicios",sub:"disponible del bono: "+fmt(bonoDisponible),val:form.desperdiciosInput!==undefined?form.desperdiciosInput:"",onVal:v=>setForm(f=>({...f,desperdiciosInput:v})),imp:fmt(desperdiciosMonto)},
                {label:"Adelantos",sub:null,val:form.adelantos,onVal:v=>setForm(f=>({...f,adelantos:v})),imp:null},
                {label:"Consumos",sub:null,val:form.consumos,onVal:v=>setForm(f=>({...f,consumos:v})),imp:null},
              ].map((r,i)=>(
                <tr key={i} style={{background:i%2===0?"#fff":"#F9F6F1"}}>
                  <td style={{padding:"6px 8px",fontWeight:600,whiteSpace:"nowrap"}}>{r.label}{r.sub&&<div style={{fontSize:".63rem",color:"#7B7063",fontWeight:400}}>{r.sub}</div>}</td>
                  <td style={{padding:"6px 4px",textAlign:"right"}}>
                    <input type="number" min="0" value={r.val} onChange={e=>r.onVal(e.target.value)} placeholder={r.ph||"0"} style={inpCell}/>
                  </td>
                  <td style={{padding:"6px 8px",textAlign:"right",color:"#C0392B",fontWeight:600,whiteSpace:"nowrap"}}>{r.imp||"—"}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"14px 0 0",marginTop:8,borderTop:"1px solid #F2EAE0"}}>
          <span style={{fontWeight:700,fontSize:".85rem"}}>Total descuentos</span>
          <span style={{fontFamily:"Georgia,serif",fontSize:"1.2rem",fontWeight:700,color:"#C0392B"}}>-{fmt(totalDescuentos)}</span>
        </div>
      </Card>
      </div>
      </div>

      <Field label="Observaciones (opcional)"><TA value={form.obs} onChange={v=>setForm(f=>({...f,obs:v}))} placeholder="Notas para el recibo..."/></Field>

      <div style={{background:"#2C1A0E",borderRadius:14,padding:"18px 20px",margin:"18px 0 4px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <span style={{color:"#E8DCC8",fontWeight:600,fontSize:".9rem"}}>Neto a cobrar</span>
        <span style={{fontFamily:"Georgia,serif",fontSize:"1.6rem",color:"#E8DCC8",fontWeight:700}}>{fmt(neto)}</span>
      </div>

      <Btn bg="#7B7063" onClick={()=>guardar(false)} disabled={busy}>{busy?"Guardando…":"Guardar borrador"}</Btn>
      <Btn bg="#2C1A0E" onClick={confirmarYRecibo} disabled={busy}>Confirmar y generar recibo</Btn>
      {form.estado==="confirmada"&&<Btn bg="#B7860B" onClick={verRecibo}>Ver recibo</Btn>}
    </>);
  }

  if(!verNomina){
    return(<>
      <ST help={"Registrá acá el pago de un sueldo, adelanto u horas extras — esta parte no pide clave, la puede usar cualquiera (ej. desde Pagos → '👤 Pagar sueldo' se entra directo acá).\n\n• Elegí el empleado del desplegable (usá + si no existe).\n• Los conceptos disponibles son: Sueldo, Adelanto, Aguinaldo, Plus, Feriado y HS Extras.\n• Cada pago descuenta de la caja disponible si se paga en efectivo — si el monto supera lo disponible, te avisa y te deja confirmar igual.\n• Si el concepto es 'Sueldo' y ese empleado tiene una liquidación confirmada de ese período, el pago se enlaza solo — así la Nómina de acá abajo muestra 'Pagada' sin hacer nada más.\n• 'Retiro' es para cuando ya se sacó la plata antes de la caja (categoría 'Retiro para sueldos') — no vuelve a descontar.\n\nMás abajo, 'Nómina y Liquidaciones' (liquidar sueldos, ver recibos, penalidades, adelantos, HS extras) pide la clave de administrador."}>Liquidación de sueldos</ST>
      <SS>Registrá el pago de un sueldo, o gestioná las liquidaciones del equipo.</SS>

      {crearModalPago&&(
        <div style={{position:"fixed",inset:0,background:"rgba(44,26,14,.65)",zIndex:500,display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
          <div style={{background:"#fff",borderRadius:"20px 20px 0 0",padding:"28px 20px 44px",width:"100%",maxWidth:460}}>
            <p style={{fontFamily:"Georgia,serif",fontSize:"1.1rem",marginBottom:16}}>Nuevo empleado</p>
            <input value={nuevoEmpPago} onChange={e=>setNuevoEmpPago(e.target.value)} placeholder="Nombre del empleado" autoFocus
              onKeyDown={e=>e.key==="Enter"&&crearEmpPago()} style={{...iS,marginBottom:16}}/>
            <div style={{display:"flex",gap:10}}>
              <button onClick={()=>{setCrearModalPago(false);setNuevoEmpPago("");}} style={{flex:1,padding:12,borderRadius:10,border:"none",background:"#E8DCC8",fontWeight:600,cursor:"pointer"}}>Cancelar</button>
              <button onClick={crearEmpPago} style={{flex:1,padding:12,borderRadius:10,border:"none",background:"#2D6A4F",color:"#fff",fontWeight:600,cursor:"pointer"}}>Crear</button>
            </div>
          </div>
        </div>
      )}
      <div style={{background:"#2C1A0E",borderRadius:14,padding:"18px 20px",marginBottom:16}}>
        <div style={{fontSize:".65rem",letterSpacing:".08em",textTransform:"uppercase",color:"#E8DCC8",opacity:.7}}>Caja disponible</div>
        <div style={{fontFamily:"Georgia,serif",fontSize:"2rem",color:"#E8DCC8",margin:"4px 0 0"}}>{fmt(saldo)}</div>
        <div style={{fontSize:".72rem",color:"#E8DCC8",opacity:.6,marginTop:4}}>Pagado este mes: <strong style={{color:"#f5b7b1"}}>{fmt(totalMesPago)}</strong>{saldoRetiro>0?<> · Caja retiro disponible: <strong style={{color:"#F5D98B"}}>{fmt(saldoRetiro)}</strong></>:null}</div>
      </div>
      <Card title="Registrar pago de sueldo">
        <Field label="Empleado">
          <div style={{display:"flex",gap:8}}>
            <select value={empPago} onChange={e=>setEmpPago(e.target.value)} style={{...sS,flex:1}}>
              <option value="">— Elegí un empleado —</option>
              {listaEmpsPago.map(e=><option key={e} value={e}>{e}</option>)}
            </select>
            <button onClick={()=>setCrearModalPago(true)} title="Agregar empleado" style={{padding:"10px 14px",border:"1.5px solid #E8DCC8",borderRadius:8,background:"#F9F6F1",fontSize:"1.1rem",cursor:"pointer",flexShrink:0}}>+</button>
          </div>
        </Field>
        <Field label="Concepto">
          <select value={conceptoPago} onChange={e=>{setConceptoPago(e.target.value);setHsExtrasPago("");}} style={sS}>
            {["Sueldo","Adelanto","Aguinaldo","Plus","Feriado","HS Extras"].map(c=><option key={c}>{c}</option>)}
          </select>
        </Field>
        {conceptoPago==="HS Extras"&&(
          <Field label="Cantidad de horas extras">
            <Inp type="number" value={hsExtrasPago} onChange={setHsExtrasPago} placeholder="Ej: 4"/>
          </Field>
        )}
        <Field label="Monto ($)"><Inp type="number" value={montoPago} onChange={setMontoPago} placeholder="0"/></Field>
        <Field label="Forma de pago">
          <select value={formaPago} onChange={e=>setFormaPago(e.target.value)} style={sS}>
            <option value="Efectivo">Efectivo (descuenta de caja)</option>
            <option value="Transferencia">Transferencia (solo registro)</option>
            <option value="Retiro">Retiro (ya lo tenía en mano, no descuenta caja)</option>
          </select>
        </Field>
        {formaPago==="Efectivo"&&<div style={{fontSize:".78rem",color:"#2D6A4F",background:"#EAF5F0",borderRadius:8,padding:"8px 10px",marginTop:8}}>💵 Este pago descontará de la caja disponible.</div>}
        {formaPago==="Retiro"&&<div style={{fontSize:".78rem",color:"#B7860B",background:"#FEF9E7",borderRadius:8,padding:"8px 10px",marginTop:8}}>💰 No descuenta la caja disponible — se paga con efectivo que ya retiraste antes. Disponible en caja retiro: <strong>{fmt(saldoRetiro)}</strong></div>}
        <Field label="Observaciones"><TA value={obsPago} onChange={setObsPago} placeholder="Ej: quincena, adelanto..."/></Field>
        <Field label="Fecha del registro"><Inp type="date" value={fechaPago} onChange={setFechaPago}/></Field>
        <Btn bg="#2D6A4F" onClick={guardarPagoSueldo} disabled={busyPago}>{busyPago?"Guardando…":"Registrar sueldo"}</Btn>
      </Card>
      <Card title={`Pagos de hoy (${hoyItemsPago.length})`}>
        {!hoyItemsPago.length?<Empty icon="👥">Sin pagos registrados hoy</Empty>:hoyItemsPago.map(s=>(
          <div key={s.id} style={{display:"flex",alignItems:"flex-start",gap:12,padding:"12px 0",borderBottom:"1px solid #F9F6F1"}}>
            <Thumb size={44}>👤</Thumb>
            <div style={{flex:1}}>
              <div style={{fontWeight:600,fontSize:".9rem"}}>{s.empleado}</div>
              <div style={{fontSize:".73rem",color:"#7B7063",marginTop:2}}>{s.concepto||"Sueldo"}{s.hsExtras?" · "+s.hsExtras+" hs":""} · {s.forma} · {fmtH(s.fecha)}</div>
              {s.obs&&<div style={{fontSize:".73rem",color:"#7B7063"}}>{s.obs}</div>}
            </div>
            <div style={{fontWeight:700,fontSize:".78rem",color:"#2D6A4F",whiteSpace:"nowrap"}}>✓ Registrado</div>
          </div>
        ))}
      </Card>

      {pinModal&&(
        <div style={{position:"fixed",inset:0,background:"rgba(44,26,14,.65)",zIndex:500,display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
          <div style={{background:"#fff",borderRadius:"20px 20px 0 0",padding:"28px 20px 44px",width:"100%",maxWidth:460}}>
            <p style={{fontFamily:"Georgia,serif",fontSize:"1.1rem",marginBottom:16}}>🔒 Nómina y Liquidaciones</p>
            <input type="password" placeholder="Clave de administrador" value={pinInput} autoFocus
              onChange={e=>{setPinInput(e.target.value);setPinErr(false);}}
              onKeyDown={e=>e.key==="Enter"&&confirmarPin()}
              style={{...iS,border:`1.5px solid ${pinErr?"#E74C3C":"#E8DCC8"}`,marginBottom:8}}/>
            {pinErr&&<p style={{color:"#E74C3C",fontSize:".8rem",marginBottom:8}}>Clave incorrecta</p>}
            <div style={{display:"flex",gap:10,marginTop:8}}>
              <button onClick={()=>{setPinModal(false);setPinInput("");setPinErr(false);}} style={{flex:1,padding:12,borderRadius:10,border:"none",background:"#E8DCC8",fontWeight:600,cursor:"pointer"}}>Cancelar</button>
              <button onClick={confirmarPin} style={{flex:1,padding:12,borderRadius:10,border:"none",background:"#C0392B",color:"#fff",fontWeight:600,cursor:"pointer"}}>Confirmar</button>
            </div>
          </div>
        </div>
      )}

      {!nominaUnlocked?(
        <Card title="🔒 Nómina y Liquidaciones">
          <p style={{fontSize:".82rem",color:"#7B7063",marginBottom:14}}>Liquidar sueldos, ver recibos, penalidades, adelantos y horas extras del equipo — esta parte pide la clave de administrador.</p>
          <Btn bg="#2C1A0E" onClick={()=>setPinModal(true)}>Desbloquear con clave de administrador</Btn>
        </Card>
      ):(<>
      {verManual&&<ManualLiquidacionModal onClose={()=>setVerManual(false)}/>}
      <Btn bg="#7B7063" onClick={()=>setVerManual(true)}>📖 Manual de uso</Btn>
      <Btn bg="#B7860B" onClick={()=>setVerNomina(true)}>💰 Liquidar Sueldos</Btn>
      <Btn bg="#2C1A0E" onClick={()=>setVerBasicos(v=>!v)}>{verBasicos?"Ocultar Nómina de Empleados Sueldos Básicos y Valores":"📋 Nómina de Empleados Sueldos Básicos y Valores"}</Btn>
      <Btn bg="#C0392B" onClick={()=>setVerPenalidadesAdmin(v=>!v)}>{verPenalidadesAdmin?"Ocultar Penalidades":"⚡ Penalidades"}</Btn>
      <Btn bg="#B7860B" onClick={()=>setVerAdelantosAdmin(v=>!v)}>{verAdelantosAdmin?"Ocultar Adelantos":"💵 Adelantos"}</Btn>
      <Btn bg="#2D6A4F" onClick={()=>setVerHsExtrasAdmin(v=>!v)}>{verHsExtrasAdmin?"Ocultar HS Extras":"⏱️ HS Extras"}</Btn>

      {verPenalidadesAdmin&&(
        <PenalidadesPanel empleados={empleados} penalidades={penalidades} savePenalidades={savePenalidades} mostrarHistorial={true} periodo={periodo} liquidaciones={liquidaciones}/>
      )}

      {verHsExtrasAdmin&&(
        <HsExtrasPanel empleados={empleados} horasExtras={horasExtras} saveHorasExtras={saveHorasExtras} mostrarHistorial={true} periodo={periodo} liquidaciones={liquidaciones}/>
      )}

      {verAdelantosAdmin&&(()=>{
        const sinEmparejar=adelantosSinEmparejar(periodo);
        const conAdelanto=empleadosActivos.filter(e=>adelantosDe(e,periodo).length>0);
        return(
          <Card title={"Adelantos · "+mesLabel(periodo)}>
            <p style={{fontSize:".78rem",color:"#7B7063",marginBottom:14}}>Adelantos cargados en "Registrar pago de sueldo" para {mesLabel(periodo)}. El total de cada empleado se usa como punto de partida en "Adelantos" al liquidar el sueldo (se puede corregir a mano ahí).</p>
            {conAdelanto.length===0&&sinEmparejar.length===0&&<Empty icon="✅">Sin adelantos cargados en {mesLabel(periodo)}.</Empty>}
            {conAdelanto.map(e=>{
              const log=adelantosDe(e,periodo).slice().sort((a,b)=>new Date(b.fecha)-new Date(a.fecha));
              const total=log.reduce((s,x)=>s+Number(x.monto||0),0);
              return(
                <div key={e.id} style={{marginBottom:14}}>
                  <div style={{display:"flex",justifyContent:"space-between",fontWeight:600,fontSize:".82rem",color:"#2C1A0E",marginBottom:4}}>
                    <span>{e.nombre}</span><span>{fmt(total)}</span>
                  </div>
                  {log.map(s=>(
                    <div key={s.id} style={{display:"flex",justifyContent:"space-between",fontSize:".76rem",color:"#7B7063",padding:"4px 0",borderBottom:"1px solid #F2EAE0"}}>
                      <span>{fmtF(s.fecha)} · {s.forma}{s.obs?(" · "+s.obs):""}</span><span>{fmt(s.monto)}</span>
                    </div>
                  ))}
                </div>
              );
            })}
            {sinEmparejar.length>0&&(
              <div style={{marginTop:10,fontSize:".72rem",color:"#C0392B",background:"#FBEAEA",border:"1px solid #F3C7C2",borderRadius:8,padding:"8px 10px"}}>
                ⚠️ {sinEmparejar.length===1?"Hay 1 adelanto":"Hay "+sinEmparejar.length+" adelantos"} de {mesLabel(periodo)} que no pude relacionar con ningún empleado activo: {sinEmparejar.map(s=>"\""+s.empleado+"\" ("+fmt(s.monto)+")").join(", ")}. Revisalo en "Registrar pago de sueldo".
              </div>
            )}
          </Card>
        );
      })()}

      {verBasicos&&(
        <Card title="Sueldos básicos agendados (ayuda memoria)">
          <p style={{fontSize:".78rem",color:"#7B7063",marginBottom:12}}>Básico y Bono, todo editable acá. HS extra, feriado y ausencia se calculan solos a partir del básico. Tocá 🗂️ para ver o editar el legajo (DNI, CUIT, fecha de nacimiento, domicilio y teléfonos) de cada empleado.</p>
          {empleadosActivos.length>0?(
            <div style={{overflowX:"auto"}}>
              <table style={{width:"100%",borderCollapse:"collapse",fontSize:".75rem",minWidth:640}}>
                <thead>
                  <tr style={{background:"#F9F6F1"}}>
                    {["Empleado","Básico","Bono","HS extra","Feriado","Ausencia",""].map(h=>(
                      <th key={h} style={{padding:"7px 8px",textAlign:h==="Empleado"?"left":"right",fontWeight:700,color:"#7B7063",fontSize:".63rem",letterSpacing:".05em",textTransform:"uppercase",borderBottom:"2px solid #E8DCC8",whiteSpace:"nowrap"}}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {empleadosActivos.map((e,i)=>{
                    const basicoVal=basicosDraft[e.id]!==undefined?basicosDraft[e.id]:(e.sueldoBasicoRef||"");
                    const bonoVal=bonosDraft[e.id]!==undefined?bonosDraft[e.id]:(e.bonoRef||"");
                    const basicoNum=Number(basicoVal)||0;
                    const valorHsExtra=basicoNum/208*2;
                    const valorFeriado=basicoNum/208*8;
                    const valorAusencia=basicoNum/208*8;
                    const inpCell={width:86,border:"1px solid #E8DCC8",borderRadius:6,padding:"5px 6px",fontSize:".72rem",textAlign:"right",fontFamily:"inherit",color:"#2C1A0E",background:"#fff",outline:"none",boxSizing:"border-box"};
                    return(
                      <tr key={e.id} style={{background:i%2===0?"#fff":"#F9F6F1"}}>
                        <td style={{padding:"6px 8px",fontWeight:600,whiteSpace:"nowrap"}}>{e.nombre} {e.apellido||""}</td>
                        <td style={{padding:"6px 4px",textAlign:"right"}}>
                          <input type="number" value={basicoVal} onChange={ev=>setBasicosDraft(d=>({...d,[e.id]:ev.target.value}))} placeholder="0" style={inpCell}/>
                        </td>
                        <td style={{padding:"6px 4px",textAlign:"right"}}>
                          <input type="number" value={bonoVal} onChange={ev=>setBonosDraft(d=>({...d,[e.id]:ev.target.value}))} placeholder="0" style={inpCell}/>
                        </td>
                        <td style={{padding:"6px 8px",textAlign:"right",color:"#7B7063",whiteSpace:"nowrap"}}>{fmt(valorHsExtra)}</td>
                        <td style={{padding:"6px 8px",textAlign:"right",color:"#7B7063",whiteSpace:"nowrap"}}>{fmt(valorFeriado)}</td>
                        <td style={{padding:"6px 8px",textAlign:"right",color:"#7B7063",whiteSpace:"nowrap"}}>{fmt(valorAusencia)}</td>
                        <td style={{padding:"6px 4px",textAlign:"right",whiteSpace:"nowrap"}}>
                          <SmBtn onClick={()=>setLegajoAbierto(e.id)} title="Legajo">🗂️</SmBtn>{" "}
                          <SmBtn onClick={()=>guardarValores(e)}>Guardar</SmBtn>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          ):(
            <Empty icon="👷">No hay empleados activos.</Empty>
          )}
        </Card>
      )}
      {legajoAbierto&&(()=>{
        const e=empleados.find(x=>x.id===legajoAbierto);
        if(!e)return null;
        const legajoVal=campo=>(legajoDraft[e.id]&&legajoDraft[e.id][campo]!==undefined)?legajoDraft[e.id][campo]:(e[campo]||"");
        const inpTexto={width:"100%",border:"1px solid #E8DCC8",borderRadius:6,padding:"7px 8px",fontSize:".8rem",textAlign:"left",fontFamily:"inherit",color:"#2C1A0E",background:"#fff",outline:"none",boxSizing:"border-box"};
        return(
          <div style={{position:"fixed",inset:0,background:"rgba(44,26,14,.45)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:1000,padding:16}} onClick={()=>setLegajoAbierto(null)}>
            <div style={{background:"#fff",borderRadius:12,padding:20,width:"100%",maxWidth:420,maxHeight:"90vh",overflowY:"auto"}} onClick={ev=>ev.stopPropagation()}>
              <h3 style={{margin:"0 0 4px",fontSize:"1rem",color:"#2C1A0E"}}>🗂️ Legajo</h3>
              <p style={{margin:"0 0 14px",fontSize:".8rem",color:"#7B7063"}}>{e.nombre} {e.apellido||""}</p>
              <div style={{display:"flex",flexDirection:"column",gap:10}}>
                <Field label="DNI"><input type="text" value={legajoVal("dni")} onChange={ev=>setLegajoCampo(e.id,"dni",ev.target.value)} placeholder="DNI" style={inpTexto}/></Field>
                <Field label="CUIT"><input type="text" value={legajoVal("cuit")} onChange={ev=>setLegajoCampo(e.id,"cuit",ev.target.value)} placeholder="CUIT" style={inpTexto}/></Field>
                <Field label="Fecha de nacimiento"><input type="date" value={legajoVal("fechaNac")} onChange={ev=>setLegajoCampo(e.id,"fechaNac",ev.target.value)} style={inpTexto}/></Field>
                <Field label="Domicilio"><input type="text" value={legajoVal("domicilio")} onChange={ev=>setLegajoCampo(e.id,"domicilio",ev.target.value)} placeholder="Domicilio" style={inpTexto}/></Field>
                <Field label="Tel. propio"><input type="text" value={legajoVal("telPropio")} onChange={ev=>setLegajoCampo(e.id,"telPropio",ev.target.value)} placeholder="Tel. propio" style={inpTexto}/></Field>
                <Field label="Tel. de contacto"><input type="text" value={legajoVal("telContacto")} onChange={ev=>setLegajoCampo(e.id,"telContacto",ev.target.value)} placeholder="Tel. de contacto" style={inpTexto}/></Field>
              </div>
              <div style={{display:"flex",gap:8,marginTop:18,justifyContent:"flex-end"}}>
                <SmBtn onClick={()=>setLegajoAbierto(null)}>Cerrar</SmBtn>
                <Btn bg="#2C1A0E" onClick={async()=>{await guardarValores(e);setLegajoAbierto(null);}}>Guardar legajo</Btn>
              </div>
            </div>
          </div>
        );
      })()}
      </>)}
    </>);
  }

  return(<>
    <button onClick={()=>setVerNomina(false)} style={{display:"flex",alignItems:"center",gap:6,background:"none",border:"none",color:"#7B7063",fontSize:".8rem",fontWeight:600,cursor:"pointer",marginBottom:14,padding:0}}>← Volver</button>
    <ST>Liquidación de sueldos</ST>
    <SS>Cargá los haberes y descuentos de cada empleado y generá su recibo.</SS>
    {verManual&&<ManualLiquidacionModal onClose={()=>setVerManual(false)}/>}
    <Btn bg="#7B7063" onClick={()=>setVerManual(true)}>📖 Manual de uso</Btn>

    <Field label="Período">
      <input type="month" value={periodo} onChange={e=>setPeriodo(e.target.value)} style={iS}/>
    </Field>

    <Card title={"Nómina · "+mesLabel(periodo)}>
      <p style={{fontSize:".78rem",color:"#7B7063",marginBottom:12}}>Básico y bono son editables. HS extra, feriado y ausencia se calculan solos a partir del básico.</p>
      {empleadosActivos.length>0?(
        <div style={{overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:".75rem",minWidth:900}}>
            <thead>
              <tr style={{background:"#F9F6F1"}}>
                {["Empleado","Básico","Bono","HS extra","Feriado","Ausencia","Estado",""].map(h=>(
                  <th key={h} style={{padding:"7px 8px",textAlign:(h==="Empleado"||h==="Estado")?"left":(h===""?"right":"right"),fontWeight:700,color:"#7B7063",fontSize:".63rem",letterSpacing:".05em",textTransform:"uppercase",borderBottom:"2px solid #E8DCC8",whiteSpace:"nowrap"}}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {empleadosActivos.map((e,i)=>{
                const liq=liqDe(e.id,periodo);
                const pagado=liq?pagadoDe(liq.id):0;
                const totalmentePagada=liq&&pagado>0&&Math.round(pagado*100)>=Math.round(Number(liq.neto||0)*100);
                const parcialmentePagada=liq&&pagado>0&&!totalmentePagada;
                const basicoVal=basicosDraft[e.id]!==undefined?basicosDraft[e.id]:(e.sueldoBasicoRef||"");
                const bonoVal=bonosDraft[e.id]!==undefined?bonosDraft[e.id]:(e.bonoRef||"");
                const basicoNum=Number(basicoVal)||0;
                const valorHsExtra=basicoNum/208*2;
                const valorFeriado=basicoNum/208*8;
                const valorAusencia=basicoNum/208*8;
                const inpCell={width:86,border:"1px solid #E8DCC8",borderRadius:6,padding:"5px 6px",fontSize:".72rem",textAlign:"right",fontFamily:"inherit",color:"#2C1A0E",background:"#fff",outline:"none",boxSizing:"border-box"};
                return(
                  <tr key={e.id} style={{background:i%2===0?"#fff":"#F9F6F1"}}>
                    <td style={{padding:"8px",fontWeight:600,whiteSpace:"nowrap"}}>{e.nombre} {e.apellido||""}</td>
                    <td style={{padding:"6px 4px",textAlign:"right"}}>
                      <input type="number" value={basicoVal} onChange={ev=>setBasicosDraft(d=>({...d,[e.id]:ev.target.value}))} placeholder="0" style={inpCell}/>
                    </td>
                    <td style={{padding:"6px 4px",textAlign:"right"}}>
                      <input type="number" value={bonoVal} onChange={ev=>setBonosDraft(d=>({...d,[e.id]:ev.target.value}))} placeholder="0" style={inpCell}/>
                    </td>
                    <td style={{padding:"6px 8px",textAlign:"right",color:"#7B7063",whiteSpace:"nowrap"}}>{fmt(valorHsExtra)}</td>
                    <td style={{padding:"6px 8px",textAlign:"right",color:"#7B7063",whiteSpace:"nowrap"}}>{fmt(valorFeriado)}</td>
                    <td style={{padding:"6px 8px",textAlign:"right",color:"#7B7063",whiteSpace:"nowrap"}}>{fmt(valorAusencia)}</td>
                    <td style={{padding:"8px",whiteSpace:"nowrap",color:liq?(totalmentePagada?"#1B4F72":parcialmentePagada?"#8E44AD":liq.estado==="confirmada"?"#2D6A4F":"#B7860B"):"#B8A88E",fontWeight:liq?700:400}}>
                      {liq?(totalmentePagada?"💵 Pagada · "+fmt(liq.neto):parcialmentePagada?"Pago parcial · "+fmt(pagado)+" de "+fmt(liq.neto):liq.estado==="confirmada"?"✓ Confirmada · "+fmt(liq.neto):"Borrador · "+fmt(liq.neto)):"Sin liquidar"}
                    </td>
                    <td style={{padding:"6px 4px",textAlign:"right",whiteSpace:"nowrap"}}>
                      <div style={{display:"flex",gap:6,justifyContent:"flex-end"}}>
                        <SmBtn onClick={()=>guardarValores(e)}>Guardar</SmBtn>
                        <SmBtn onClick={()=>abrirLiquidacion(e)}>{liq?"Editar":"Liquidar"}</SmBtn>
                        {liq&&liq.estado==="confirmada"&&<SmBtn onClick={()=>verReciboDe(liq,e)}>🧾 Recibo</SmBtn>}
                      </div>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      ):(
        <Empty icon="👷">No hay empleados activos cargados.</Empty>
      )}
    </Card>
  </>);
}

function AdminBoletas({boletas,saveBoletas,proveedores,empleados,stock,saveStock}){
  const[busqueda,setBusqueda]=useState("");
  const[editItem,setEditItem]=useState(null);
  const[editForm,setEditForm]=useState({});
  const[confElim,setConfElim]=useState(null);
  const[busy,setBusy]=useState(false);

  const lista=[...boletas]
    .sort((a,b)=>{
      const d=new Date(b.fecha)-new Date(a.fecha);
      if(d!==0)return d;
      return String(b.id||"").localeCompare(String(a.id||""));
    });

  const filtrada=busqueda.trim()
    ?lista.filter(b=>
        norm(b.proveedor).includes(norm(busqueda))||
        norm(b.empleado).includes(norm(busqueda))||
        norm(b.obs).includes(norm(busqueda))
      )
    :lista;

  const abrirEdit=b=>{
    setEditItem(b);
    setEditForm({proveedor:b.proveedor||"",empleado:b.empleado||"",monto:String(b.monto||0),obs:b.obs||"",fecha:b.fecha?b.fecha.slice(0,10):hoyLocal()});
  };
  const cerrarEdit=()=>{setEditItem(null);setEditForm({});};

  const guardar=async()=>{
    if(!editForm.proveedor){toast("Elegí un proveedor");return;}
    const v=Number(editForm.monto);
    if(isNaN(v)||v<=0){toast("Ingresá un monto mayor a $0");return;}
    setBusy(true);
    const nuevas=boletas.map(b=>b.id===editItem.id?{...b,proveedor:editForm.proveedor,empleado:editForm.empleado,monto:v,obs:editForm.obs.trim(),fecha:editForm.fecha?new Date(editForm.fecha+"T12:00:00").toISOString():b.fecha}:b);
    await saveBoletas(nuevas);
    toast("Boleta corregida ✓");
    setBusy(false);cerrarEdit();
  };

  const eliminar=async()=>{
    const b=confElim;
    setBusy(true);
    if(b.productos&&b.productos.length>0&&stock&&saveStock){
      const stockActual=stock.map(s=>{
        const linea=b.productos.find(p=>p.catalogoId===s.catalogoId);
        if(!linea)return s;
        return{...s,cantidad:Math.max(0,Number(s.cantidad||0)-Number(linea.cantidad||0)),movimientos:(s.movimientos||[]).filter(m=>m.boletaId!==b.id)};
      });
      await saveStock(stockActual);
    }
    await saveBoletas(boletas.filter(x=>x.id!==b.id));
    toast("Boleta eliminada"+(b.productos&&b.productos.length>0?" · stock revertido":""));
    setBusy(false);setConfElim(null);
    if(editItem&&editItem.id===b.id)cerrarEdit();
  };

  return(
    <Card title={`Boletas registradas (${lista.length})`}>
      <Field label="Buscar por proveedor, empleado u observación">
        <Inp value={busqueda} onChange={setBusqueda} placeholder="Ej: Avenida, María..."/>
      </Field>

      <div style={{marginTop:14,display:"flex",flexDirection:"column",gap:6}}>
        {!filtrada.length&&<Empty icon="🧾">No hay boletas que coincidan</Empty>}
        {filtrada.map(b=>(
          <div key={b.id} style={{background:"#fff",border:"1px solid #F2EAE0",borderRadius:10,padding:"10px 14px",display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10}}>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontWeight:700,fontSize:".88rem",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{b.proveedor||"Sin proveedor"}</div>
              <div style={{fontSize:".72rem",color:"#7B7063",marginTop:2}}>
                {fmtFL(b.fecha)}{b.empleado?` · ${b.empleado}`:""}
              </div>
              {b.obs&&<div style={{fontSize:".7rem",color:"#7B7063",marginTop:2,fontStyle:"italic"}}>{b.obs}</div>}
              {b.productos&&b.productos.length>0&&<div style={{fontSize:".66rem",color:"#B7860B",marginTop:2}}>📦 {b.productos.length} producto{b.productos.length!==1?"s":""} sumado{b.productos.length!==1?"s":""} al stock</div>}
            </div>
            <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:6,flexShrink:0}}>
              <span style={{fontFamily:"Georgia,serif",fontSize:"1.1rem",color:"#2C1A0E"}}>{fmt(b.monto)}</span>
              <div style={{display:"flex",gap:4}}>
                <button onClick={()=>abrirEdit(b)} style={{background:"#EAF5F0",border:"none",borderRadius:6,color:"#2D6A4F",fontSize:".62rem",fontWeight:600,cursor:"pointer",padding:"3px 7px"}}>✏️</button>
                <button onClick={()=>setConfElim(b)} style={{background:"#FFF0EF",border:"none",borderRadius:6,color:"#E74C3C",fontSize:".62rem",fontWeight:600,cursor:"pointer",padding:"3px 7px"}}>✕</button>
              </div>
            </div>
          </div>
        ))}
      </div>

      {editItem&&(
        <div style={{position:"fixed",inset:0,background:"rgba(44,26,14,.65)",zIndex:500,display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
          <div style={{background:"#fff",borderRadius:"20px 20px 0 0",padding:"24px 20px 40px",width:"100%",maxWidth:460,maxHeight:"88dvh",overflowY:"auto"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
              <p style={{fontFamily:"Georgia,serif",fontSize:"1.1rem"}}>✏️ Editar boleta</p>
              <button onClick={cerrarEdit} style={{background:"none",border:"none",fontSize:"1.4rem",cursor:"pointer",color:"#7B7063"}}>✕</button>
            </div>
            <Field label="Proveedor">
              <select value={editForm.proveedor||""} onChange={e=>setEditForm(f=>({...f,proveedor:e.target.value}))} style={sS}>
                <option value="">— Elegí —</option>
                {proveedores.map(p=><option key={p.id} value={p.nombre}>{p.nombre}</option>)}
              </select>
            </Field>
            <Field label="Empleado que recibió">
              <select value={editForm.empleado||""} onChange={e=>setEditForm(f=>({...f,empleado:e.target.value}))} style={sS}>
                <option value="">— Elegí —</option>
                {empleados.map(e=><option key={e.id} value={e.nombre}>{e.nombre}</option>)}
              </select>
            </Field>
            <Field label="Importe corregido ($)">
              <Inp type="number" value={editForm.monto} onChange={v=>setEditForm(f=>({...f,monto:v}))} placeholder="0" min="0"/>
            </Field>
            <Field label="Fecha">
              <Inp type="date" value={editForm.fecha} onChange={v=>setEditForm(f=>({...f,fecha:v}))}/>
            </Field>
            <Field label="Observaciones">
              <TA value={editForm.obs} onChange={v=>setEditForm(f=>({...f,obs:v}))} placeholder="Motivo de la corrección..."/>
            </Field>
            {editItem.productos&&editItem.productos.length>0&&(
              <div style={{fontSize:".72rem",color:"#7B7063",background:"#F9F6F1",borderRadius:8,padding:"8px 10px",marginTop:14}}>📦 Esta boleta sumó {editItem.productos.length} producto{editItem.productos.length!==1?"s":""} al stock — corregir estos datos NO ajusta el stock ya cargado.</div>
            )}
            <div style={{display:"flex",gap:8,marginTop:14}}>
              <button onClick={cerrarEdit} style={{flex:1,padding:11,borderRadius:10,border:"none",background:"#E8DCC8",fontWeight:600,cursor:"pointer"}}>Cancelar</button>
              <Btn onClick={guardar} disabled={busy}>{busy?"Guardando…":"Guardar corrección"}</Btn>
            </div>
          </div>
        </div>
      )}

      {confElim&&(
        <div style={{position:"fixed",inset:0,background:"rgba(44,26,14,.65)",zIndex:600,display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
          <div style={{background:"#fff",borderRadius:"20px 20px 0 0",padding:"28px 20px 44px",width:"100%",maxWidth:460}}>
            <p style={{fontFamily:"Georgia,serif",fontSize:"1.1rem",marginBottom:8}}>⚠️ Eliminar boleta</p>
            <p style={{fontSize:".85rem",color:"#7B7063",marginBottom:8}}>{confElim.proveedor} · {fmt(confElim.monto)} · {fmtFL(confElim.fecha)}</p>
            {confElim.productos&&confElim.productos.length>0&&<p style={{fontSize:".78rem",color:"#B7860B",marginBottom:8}}>📦 Se van a revertir {confElim.productos.length} producto{confElim.productos.length!==1?"s":""} del stock.</p>}
            <p style={{fontSize:".78rem",color:"#C0392B",marginBottom:16,fontWeight:600}}>Esta acción no se puede deshacer.</p>
            <div style={{display:"flex",gap:10}}>
              <button onClick={()=>setConfElim(null)} style={{flex:1,padding:12,borderRadius:10,border:"none",background:"#E8DCC8",fontWeight:600,cursor:"pointer"}}>Cancelar</button>
              <button onClick={eliminar} disabled={busy} style={{flex:1,padding:12,borderRadius:10,border:"none",background:"#C0392B",color:"#fff",fontWeight:600,cursor:"pointer"}}>{busy?"Eliminando…":"Eliminar"}</button>
            </div>
          </div>
        </div>
      )}
    </Card>
  );
}

function TabHistorial({boletas,cierres,cierresCaja,pagos,sueldos,gastos,cajaInicial,setLightbox,saveBoletas,saveCierres,saveCierresCaja,savePagos,saveSueldos,saveGastos,ajustesCajaEfectivo,saveAjustesCajaEfectivo,stock,saveStock}){
  const[filtro,setFiltro]=useState("todo");
  const[filtroDH,setFiltroDH]=useState("todos");
  const hoy=new Date();
  const iso=d=>d.toISOString().slice(0,10);
  const inicioMes=new Date(hoy.getFullYear(),hoy.getMonth(),1);
  const[filtroFecha,setFiltroFecha]=useState("mes");
  const[desde,setDesde]=useState(iso(inicioMes));
  const[hasta,setHasta]=useState(iso(hoy));

  // Movimientos normalizados en dos columnas de flujo: _efDelta (efectivo) y _digDelta (digital/transferencia).
  // _cuenta=true => el movimiento mueve algún saldo real (efectivo o digital); boletas y pagos con Amex
  // (tarjeta de crédito) no mueven nada todavía (quedan como referencia) hasta que se paguen / se pague el resumen.
  const boletasM=(boletas||[]).map(b=>({...b,tipo:"boleta",_cat:"boleta",_efDelta:0,_digDelta:0,_cuenta:false}));
  const cierresM=(cierres||[]).map(c=>({...c,tipo:"cierre",_cat:"cierre",_efDelta:Number(c.monto||0),_digDelta:0,_cuenta:true,proveedor:"Cierre "+c.turno}));
  // Cada cierre de caja trae SIEMPRE dos ingresos simultáneos: lo contado en efectivo y lo vendido por canales
  // digitales (MP/FUDO/PostNet/Digital/Uber). Antes solo se contabilizaba el efectivo — la parte digital
  // no aparecía en ningún lado del Historial.
  const cierresCajaM=(cierresCaja||[]).map(c=>({...c,tipo:"cierre_caja",_cat:"cierre",_efDelta:Number(c.efectivo||0),_digDelta:Number(c.totalDigital||0),_cuenta:true,proveedor:"Cierre "+c.turno,empleado:c.persona,monto:Number(c.total)||(Number(c.efectivo||0)+Number(c.totalDigital||0))}));
  const pagosM=(pagos||[]).map(p=>({...p,tipo:"pago",_cat:"pago",
    _efDelta:p.forma==="Efectivo"?-Number(p.monto||0):0,
    _digDelta:p.forma==="Transferencia"?-Number(p.monto||0):0,
    _cuenta:p.forma==="Efectivo"||p.forma==="Transferencia"}));
  const sueldosM=(sueldos||[]).map(s=>({...s,tipo:"sueldo",_cat:"sueldo",
    _efDelta:s.forma==="Efectivo"?-Number(s.monto||0):0,
    _digDelta:s.forma==="Transferencia"?-Number(s.monto||0):0,
    _cuenta:s.forma==="Efectivo"||s.forma==="Transferencia"}));
  const gastosM=(gastos||[]).map(g=>({...g,tipo:"gasto",_cat:"gasto",
    _efDelta:g.forma==="Efectivo"?-Number(g.monto||0):0,
    _digDelta:g.forma==="Transferencia"?-Number(g.monto||0):0,
    _cuenta:g.forma==="Efectivo"||g.forma==="Transferencia",proveedor:g.categoria}));
  // Ajustes manuales de caja (Admin > Ajuste de caja disponible). Se incluyen para que el saldo de este
  // libro diario coincida con el número de "Caja Disponible" (calcSaldo() ya los suma).
  const ajustesM=(ajustesCajaEfectivo||[]).map(a=>({...a,tipo:"ajuste",_cat:"ajuste",_efDelta:Number(a.monto||0),_digDelta:0,_cuenta:true,proveedor:"Ajuste de caja",obs:a.motivo,monto:Math.abs(Number(a.monto||0))}));
  const allMovs=[...boletasM,...cierresM,...cierresCajaM,...pagosM,...sueldosM,...gastosM,...ajustesM].filter(m=>m.fecha);

  const desdeF=filtroFecha==="mes"?iso(inicioMes):filtroFecha==="hoy"?iso(hoy):desde;
  const hastaF=filtroFecha==="mes"?iso(hoy):filtroFecha==="hoy"?iso(hoy):hasta;

  // Saldo de arrastre: cajaInicial + todo el flujo de EFECTIVO anterior al rango mostrado (sin importar el filtro de tipo).
  // El saldo corrido de esta pantalla es siempre el de Caja Disponible (efectivo) — el saldo de banco/digital
  // no se arrastra acá porque en la app se corrige a mano contra el resumen bancario real (ver Caja Digital).
  let saldoBase=Number(cajaInicial)||0;
  allMovs.filter(m=>m.fecha.slice(0,10)<desdeF).forEach(m=>{saldoBase+=m._efDelta;});

  // Saldo corrido dentro del rango, usando TODOS los tipos (para que el numero sea correcto sin importar el filtro de tipo activo).
  const enRangoAsc=allMovs.filter(m=>{const f=m.fecha.slice(0,10);return(!desdeF||f>=desdeF)&&(!hastaF||f<=hastaF);}).sort((a,b)=>a.fecha.localeCompare(b.fecha));
  let saldoAcum=saldoBase;
  const conSaldo=enRangoAsc.map(m=>{
    saldoAcum+=m._efDelta;
    return{...m,_saldo:saldoAcum};
  });

  // Filtro de tipo + Debe/Haber para mostrar (no altera el calculo de saldo, ya hecho arriba).
  let filas=conSaldo.filter(m=>filtro==="todo"?true:filtro==="cierre"?(m.tipo==="cierre"||m.tipo==="cierre_caja"):m.tipo===filtro);
  if(filtroDH==="debe")filas=filas.filter(m=>(m._efDelta<0||m._digDelta<0)&&m._cat!=="ajuste");
  if(filtroDH==="haber")filas=filas.filter(m=>(m._efDelta>0||m._digDelta>0)&&m._cat!=="ajuste");
  filas=[...filas].reverse();

  // Los ajustes de caja no son ingresos ni egresos reales (no hubo una venta ni un pago) — son una
  // corrección del saldo contado. No suman a Debe/Haber Ef. (el Saldo Ef. sí los sigue incluyendo,
  // se calcula aparte más arriba con _efDelta sobre TODOS los movimientos).
  const totalDebeEf=conSaldo.filter(m=>m._efDelta<0&&m._cat!=="ajuste").reduce((s,m)=>s+Math.abs(m._efDelta),0);
  const totalHaberEf=conSaldo.filter(m=>m._efDelta>0&&m._cat!=="ajuste").reduce((s,m)=>s+m._efDelta,0);
  const totalDebeDig=conSaldo.filter(m=>m._digDelta<0).reduce((s,m)=>s+Math.abs(m._digDelta),0);
  const totalHaberDig=conSaldo.filter(m=>m._digDelta>0).reduce((s,m)=>s+m._digDelta,0);
  const saldoFinal=conSaldo.length?conSaldo[conSaldo.length-1]._saldo:saldoBase;

  const[confirmarElim,setConfirmarElim]=useState(null);
  const pedirEliminar=item=>setConfirmarElim(item);
  const confirmarEliminar=async()=>{
    const item=confirmarElim;
    setConfirmarElim(null);
    if(item.tipo==="boleta"){
      if(item.productos&&item.productos.length>0&&stock&&saveStock){
        const stockActual=stock.map(s=>{
          const linea=item.productos.find(p=>p.catalogoId===s.catalogoId);
          if(!linea)return s;
          return{...s,cantidad:Math.max(0,Number(s.cantidad||0)-Number(linea.cantidad||0)),movimientos:(s.movimientos||[]).filter(m=>m.boletaId!==item.id)};
        });
        await saveStock(stockActual);
      }
      await saveBoletas(boletas.filter(b=>b.id!==item.id));
    }
    if(item.tipo==="cierre")     await saveCierres(cierres.filter(c=>c.id!==item.id));
    if(item.tipo==="cierre_caja")await saveCierresCaja((cierresCaja||[]).filter(c=>c.id!==item.id));
    if(item.tipo==="pago")       await savePagos(pagos.filter(p=>p.id!==item.id));
    if(item.tipo==="sueldo")     await saveSueldos(sueldos.filter(s=>s.id!==item.id));
    if(item.tipo==="gasto")      await saveGastos(gastos.filter(g=>g.id!==item.id));
    if(item.tipo==="ajuste"&&saveAjustesCajaEfectivo) await saveAjustesCajaEfectivo((ajustesCajaEfectivo||[]).filter(a=>a.id!==item.id));
    toast("Registro eliminado ✓");
  };

  const exportCSV=()=>{
    const rows=[["Tipo","Fecha","Hora","Proveedor/Turno","Empleado","Monto","Forma","Detalle"]];
    boletas.forEach(b=>rows.push(["Boleta",fmtF(b.fecha),fmtH(b.fecha),b.proveedor,b.empleado,b.monto,"",b.obs]));
    cierres.forEach(c=>rows.push(["Cierre",fmtF(c.fecha),fmtH(c.fecha),"Turno "+c.turno,c.empleado,c.monto,"",c.obs]));
    (cierresCaja||[]).forEach(c=>rows.push(["Cierre de Caja",fmtF(c.fecha),fmtH(c.fecha),"Turno "+c.turno,c.persona,c.efectivo,"",c.obs]));
    pagos.forEach(p=>rows.push(["Pago",fmtF(p.fecha),fmtH(p.fecha),p.proveedor,p.empleado,p.monto,p.forma,p.obs]));
    sueldos.forEach(s=>rows.push(["Sueldo",fmtF(s.fecha),fmtH(s.fecha),s.proveedor||s.empleado,s.empleado,s.monto,s.forma,s.obs]));
    gastos.forEach(g=>rows.push(["Gasto",fmtF(g.fecha),fmtH(g.fecha),g.categoria,g.empleado,g.monto,g.forma,g.obs]));
    (ajustesCajaEfectivo||[]).forEach(a=>rows.push(["Ajuste",fmtF(a.fecha),fmtH(a.fecha),"Ajuste de caja","",a.monto,"",a.motivo]));
    const csv=rows.map(r=>r.map(v=>`"${String(v||"").replace(/"/g,'""')}"`).join(",")).join("\n");
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8;"}));
    a.download=`amapola_historial_${hoyLocal()}.csv`;a.click();
  };

  const iconoCat=c=>c==="cierre"?"💵":c==="sueldo"?"👤":c==="gasto"?"🏠":c==="pago"?"💸":c==="ajuste"?"⚖️":"🧾";

  return(<>
    <ST help={"Historial completo de todos los movimientos del negocio, en formato de libro diario.\n\n• Debe Ef. / Haber Ef. = salidas y entradas de efectivo. Saldo Ef. = plata en Caja Disponible en ese momento (coincide con el número de Caja Disponible).\n• Debe Dig. / Haber Dig. = salidas y entradas por transferencia o digital: pagos/sueldos/gastos por transferencia, y la parte digital (MP, FUDO, PostNet, Uber) de cada cierre de caja.\n• No hay una columna de saldo corrido para lo digital: el saldo real de banco se maneja aparte en Caja Digital porque ahí se corrige a mano contra el resumen bancario (por las comisiones y demoras de acreditación).\n• Las boletas y los pagos con Amex (tarjeta de crédito) aparecen como referencia (sin Debe/Haber) porque todavía no mueven ni la caja ni el banco — recién se descuentan cuando pagás el resumen de la tarjeta (eso se carga como Gasto, categoría Amex).\n• Los ajustes de caja tampoco aparecen en Debe/Haber ni suman a esos totales — no son una venta ni un pago, son una corrección del saldo contado. Igual se ven reflejados en el Saldo Ef. corrido.\n• Podes filtrar por tipo, por fecha y por Debe/Haber.\n• Desde aca podes eliminar registros si cometiste un error (requiere confirmar, no se puede deshacer)."}>Historial</ST>
    <SS>Libro diario de todos los movimientos — efectivo y digital.</SS>

    <div style={{background:"#fff",borderRadius:14,padding:20,boxShadow:"0 2px 12px rgba(44,26,14,.08)",marginBottom:16}}>
      <div style={{display:"flex",gap:8,marginBottom:12,flexWrap:"wrap"}}>
        {[["todo","Todo"],["boleta","Boletas"],["cierre","Cierres"],["pago","Pagos"],["sueldo","Sueldos"],["gasto","Pagos dig."],["ajuste","Ajustes"]].map(([f,l])=>(
          <button key={f} onClick={()=>setFiltro(f)} style={{padding:"6px 12px",borderRadius:20,border:"none",cursor:"pointer",fontSize:".72rem",fontWeight:600,background:filtro===f?"#2C1A0E":"#E8DCC8",color:filtro===f?"#E8DCC8":"#2C1A0E"}}>{l}</button>
        ))}
      </div>

      <div style={{display:"flex",gap:6,marginBottom:10,flexWrap:"wrap"}}>
        {[["hoy","Hoy"],["mes","Este mes"],["custom","Personalizado"]].map(([v,l])=>(
          <button key={v} onClick={()=>{setFiltroFecha(v);if(v==="mes"){setDesde(iso(inicioMes));setHasta(iso(hoy));}if(v==="hoy"){setDesde(iso(hoy));setHasta(iso(hoy));}}} style={{padding:"5px 12px",borderRadius:20,border:"none",cursor:"pointer",fontSize:".72rem",fontWeight:600,background:filtroFecha===v?"#2C1A0E":"#E8DCC8",color:filtroFecha===v?"#E8DCC8":"#2C1A0E"}}>{l}</button>
        ))}
      </div>
      {filtroFecha==="custom"&&(
        <div style={{display:"flex",gap:8,marginBottom:10}}>
          <div style={{flex:1}}>
            <label style={{display:"block",fontSize:".7rem",fontWeight:600,color:"#7B7063",marginBottom:3}}>Desde</label>
            <input type="date" value={desde} onChange={e=>setDesde(e.target.value)} style={{...iS,fontSize:".82rem",padding:"7px 10px"}}/>
          </div>
          <div style={{flex:1}}>
            <label style={{display:"block",fontSize:".7rem",fontWeight:600,color:"#7B7063",marginBottom:3}}>Hasta</label>
            <input type="date" value={hasta} onChange={e=>setHasta(e.target.value)} style={{...iS,fontSize:".82rem",padding:"7px 10px"}}/>
          </div>
        </div>
      )}

      <div style={{display:"flex",gap:6,marginBottom:14}}>
        {[["todos","Todos"],["debe","💸 Solo Debe"],["haber","💵 Solo Haber"]].map(([v,l])=>(
          <button key={v} onClick={()=>setFiltroDH(v)} style={{flex:1,padding:"5px 8px",borderRadius:20,border:"none",cursor:"pointer",fontSize:".72rem",fontWeight:600,
            background:filtroDH===v?(v==="debe"?"#C0392B":v==="haber"?"#2D6A4F":"#2C1A0E"):"#E8DCC8",
            color:filtroDH===v?"#fff":"#2C1A0E"}}>{l}</button>
        ))}
      </div>

      <div style={{fontSize:".72rem",color:"#7B7063",marginBottom:4}}>{filas.length} registro{filas.length!==1?"s":""} · Saldo Caja Disponible: <strong style={{color:saldoFinal>=0?"#2D6A4F":"#C0392B"}}>{fmt(saldoFinal)}</strong></div>
      <div style={{display:"flex",gap:8,marginBottom:14,flexWrap:"wrap"}}>
        {[["💵 Efectivo",totalHaberEf,totalDebeEf],["💳 Digital",totalHaberDig,totalDebeDig]].map(([l,h,d])=>(
          <div key={l} style={{flex:1,minWidth:150,background:"#F9F6F1",borderRadius:10,padding:"8px 10px"}}>
            <div style={{fontSize:".6rem",color:"#7B7063",textTransform:"uppercase",letterSpacing:".04em",marginBottom:2}}>{l} del período</div>
            <div style={{fontSize:".76rem",color:"#2D6A4F",fontWeight:700}}>Haber {fmt(h)}</div>
            <div style={{fontSize:".76rem",color:"#C0392B",fontWeight:700}}>Debe {fmt(d)}</div>
          </div>
        ))}
      </div>

      {!filas.length?<Empty icon="📒">Sin registros en el periodo</Empty>:(
        <div style={{overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:".75rem",minWidth:620}}>
            <thead>
              <tr style={{background:"#F9F6F1"}}>
                {["Fecha","Concepto","Debe Ef.","Haber Ef.","Debe Dig.","Haber Dig.","Saldo Ef.",""].map(h=>(
                  <th key={h||"acc"} style={{padding:"7px 8px",textAlign:h==="Fecha"||h==="Concepto"?"left":h===""?"center":"right",fontWeight:700,color:"#7B7063",fontSize:".63rem",letterSpacing:".05em",textTransform:"uppercase",borderBottom:"2px solid #E8DCC8",whiteSpace:"nowrap"}}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {filas.map((f,i)=>(
                <tr key={f.tipo+f.id+i} style={{background:i%2===0?"#fff":"#F9F6F1"}}>
                  <td style={{padding:"6px 8px",whiteSpace:"nowrap",color:"#7B7063",fontSize:".72rem"}}>
                    {fmtF(f.fecha)}<br/><span style={{fontSize:".62rem"}}>{fmtH(f.fecha)}</span>
                  </td>
                  <td style={{padding:"6px 8px"}}>
                    <div style={{display:"flex",alignItems:"center",gap:5}}>
                      <span style={{flexShrink:0}}>{iconoCat(f._cat)}</span>
                      <div style={{minWidth:0}}>
                        <div style={{fontWeight:600,fontSize:".76rem",lineHeight:1.3}}>{f.proveedor||"—"}</div>
                        <div style={{fontSize:".63rem",color:f._cat==="ajuste"?(f._efDelta>0?"#2D6A4F":"#C0392B"):"#7B7063",fontWeight:f._cat==="ajuste"?700:400,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",maxWidth:160}}>
                          {f.empleado?f.empleado+" · ":""}
                          {f._cat==="ajuste"?(f._efDelta>0?"+":"-")+fmt(Math.abs(f._efDelta))+" · corrección de saldo":(!f._cuenta?fmt(f.monto)+(f.tipo==="boleta"?" (boleta, no afecta caja)":f.forma==="Amex"?" (Amex, no descuenta hasta pagar el resumen)":f.forma==="Retiro"?" (pagado con efectivo ya retirado antes)":""):"")}
                          {f.obs?" · "+f.obs:""}
                        </div>
                      </div>
                    </div>
                  </td>
                  <td style={{padding:"6px 8px",textAlign:"right",color:"#C0392B",fontWeight:700,whiteSpace:"nowrap"}}>
                    {f._cat!=="ajuste"&&f._efDelta<0?fmt(Math.abs(f._efDelta)):"—"}
                  </td>
                  <td style={{padding:"6px 8px",textAlign:"right",color:"#2D6A4F",fontWeight:700,whiteSpace:"nowrap"}}>
                    {f._cat!=="ajuste"&&f._efDelta>0?fmt(f._efDelta):"—"}
                  </td>
                  <td style={{padding:"6px 8px",textAlign:"right",color:"#B7860B",fontWeight:700,whiteSpace:"nowrap"}}>
                    {f._digDelta<0?fmt(Math.abs(f._digDelta)):"—"}
                  </td>
                  <td style={{padding:"6px 8px",textAlign:"right",color:"#1a6b8f",fontWeight:700,whiteSpace:"nowrap"}}>
                    {f._digDelta>0?fmt(f._digDelta):"—"}
                  </td>
                  <td style={{padding:"6px 8px",textAlign:"right",fontWeight:700,whiteSpace:"nowrap",color:f._saldo>=0?"#2C1A0E":"#C0392B"}}>{fmt(f._saldo)}</td>
                  <td style={{padding:"6px 8px",textAlign:"center"}}>
                    <button onClick={()=>pedirEliminar(f)} style={{background:"#FFF0EF",border:"1px solid #f5b7b1",borderRadius:6,color:"#E74C3C",fontSize:".68rem",fontWeight:600,cursor:"pointer",padding:"3px 7px"}}>✕</button>
                  </td>
                </tr>
              ))}
              <tr style={{background:"#2C1A0E"}}>
                <td colSpan={2} style={{padding:"8px 10px",color:"#E8DCC8",fontWeight:700,fontSize:".76rem"}}>TOTALES</td>
                <td style={{padding:"8px",textAlign:"right",color:"#f5b7b1",fontWeight:700,whiteSpace:"nowrap"}}>{fmt(totalDebeEf)}</td>
                <td style={{padding:"8px",textAlign:"right",color:"#a9dfbf",fontWeight:700,whiteSpace:"nowrap"}}>{fmt(totalHaberEf)}</td>
                <td style={{padding:"8px",textAlign:"right",color:"#f5d98b",fontWeight:700,whiteSpace:"nowrap"}}>{fmt(totalDebeDig)}</td>
                <td style={{padding:"8px",textAlign:"right",color:"#a9d3e8",fontWeight:700,whiteSpace:"nowrap"}}>{fmt(totalHaberDig)}</td>
                <td style={{padding:"8px",textAlign:"right",fontWeight:700,whiteSpace:"nowrap",color:saldoFinal>=0?"#a9dfbf":"#f5b7b1"}}>{fmt(saldoFinal)}</td>
                <td/>
              </tr>
            </tbody>
          </table>
        </div>
      )}
    </div>

    {filas.length>0&&<button onClick={exportCSV} style={{display:"block",width:"100%",marginBottom:12,padding:12,borderRadius:10,border:"none",background:"#E8DCC8",color:"#C0392B",fontSize:".82rem",fontWeight:600,cursor:"pointer"}}>⬇ Exportar CSV</button>}

    {confirmarElim&&(
      <div style={{position:"fixed",inset:0,background:"rgba(44,26,14,.65)",zIndex:500,display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
        <div style={{background:"#fff",borderRadius:"20px 20px 0 0",padding:"28px 20px 44px",width:"100%",maxWidth:460}}>
          <p style={{fontFamily:"Georgia,serif",fontSize:"1.1rem",marginBottom:8,color:"#2C1A0E"}}>⚠️ Eliminar registro</p>
          <p style={{fontSize:".85rem",color:"#7B7063",marginBottom:6}}>
            <strong>{confirmarElim.tipo==="boleta"?"Boleta":confirmarElim.tipo==="cierre"?"Cierre":confirmarElim.tipo==="cierre_caja"?"Cierre de Caja":confirmarElim.tipo==="ajuste"?"Ajuste de caja":confirmarElim.forma||confirmarElim.tipo}</strong>
            {" · "}{fmt(confirmarElim.monto)}
          </p>
          <p style={{fontSize:".82rem",color:"#7B7063",marginBottom:20}}>{fmtF(confirmarElim.fecha)}{confirmarElim.proveedor?" · "+confirmarElim.proveedor:""}{confirmarElim.obs?" · "+confirmarElim.obs:""}</p>
          {confirmarElim.tipo==="boleta"&&confirmarElim.productos&&confirmarElim.productos.length>0&&<p style={{fontSize:".78rem",color:"#B7860B",marginBottom:20}}>📦 Se van a revertir {confirmarElim.productos.length} producto{confirmarElim.productos.length!==1?"s":""} del stock.</p>}
          <p style={{fontSize:".78rem",color:"#C0392B",marginBottom:20,fontWeight:600}}>Esta accion no se puede deshacer.</p>
          <div style={{display:"flex",gap:10}}>
            <button onClick={()=>setConfirmarElim(null)} style={{flex:1,padding:13,borderRadius:10,border:"none",background:"#E8DCC8",fontWeight:600,cursor:"pointer",fontSize:".95rem"}}>Cancelar</button>
            <button onClick={confirmarEliminar} style={{flex:1,padding:13,borderRadius:10,border:"none",background:"#C0392B",color:"#fff",fontWeight:600,cursor:"pointer",fontSize:".95rem"}}>Eliminar</button>
          </div>
        </div>
      </div>
    )}
  </>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root/>);
</script>
</body>
</html>
