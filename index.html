                </td>
                <td style={{padding:"6px 8px",textAlign:"right",color:"#C0392B",fontWeight:700,whiteSpace:"nowrap"}}>{m._cat!=="ajuste"&&m._signo<0?fmt(Math.abs(m.monto)):""}</td>
                <td style={{padding:"6px 8px",textAlign:"right",color:"#2D6A4F",fontWeight:700,whiteSpace:"nowrap"}}>{m._cat!=="ajuste"&&m._signo>0?fmt(m.monto):""}</td>
                <td style={{padding:"6px 8px",textAlign:"right",fontWeight:700,whiteSpace:"nowrap",color:m._saldo>=0?"#2C1A0E":"#C0392B"}}>{fmt(m._saldo)}</td>
                <td style={{padding:"6px 8px"}}>
                  {m._cat!=="cierre"&&m._cat!=="ajuste"&&(
                    <div style={{display:"flex",gap:4}}>
                      <button onClick={()=>abrirEditar(m)} style={{background:"#EAF5F0",border:"none",borderRadius:6,color:"#2D6A4F",fontSize:".6rem",fontWeight:600,cursor:"pointer",padding:"3px 6px"}}>✏️</button>
                      <button onClick={()=>setConfElim(m)} style={{background:"#FFF0EF",border:"none",borderRadius:6,color:"#E74C3C",fontSize:".6rem",fontWeight:600,cursor:"pointer",padding:"3px 6px"}}>✕</button>
                    </div>
                  )}
                </td>
              </tr>
            ))}
            <tr style={{background:"#2C1A0E"}}>
              <td colSpan={2} style={{padding:"8px 10px",color:"#E8DCC8",fontWeight:700,fontSize:".76rem"}}>TOTALES</td>
              <td style={{padding:"8px",textAlign:"right",color:"#f5b7b1",fontWeight:700,whiteSpace:"nowrap"}}>{fmt(totalEgresos)}</td>
              <td style={{padding:"8px",textAlign:"right",color:"#a9dfbf",fontWeight:700,whiteSpace:"nowrap"}}>{fmt(totalIngresos)}</td>
              <td colSpan={2} style={{padding:"8px",textAlign:"right",fontWeight:700,whiteSpace:"nowrap",color:"#E8DCC8"}}>{fmt(saldoBase+totalIngresos-totalEgresos+totalAjustes)}</td>
            </tr>
          </tbody>
        </table>
      </div>
    )}

    {editItem&&(
      <div style={{position:"fixed",inset:0,background:"rgba(44,26,14,.65)",zIndex:500,display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
        <div style={{background:"#fff",borderRadius:"20px 20px 0 0",padding:"24px 20px 40px",width:"100%",maxWidth:460,maxHeight:"88dvh",overflowY:"auto"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
            <p style={{fontFamily:"Georgia,serif",fontSize:"1.1rem"}}>✏️ Editar {editItem._cat}</p>
            <button onClick={()=>setEditItem(null)} style={{background:"none",border:"none",fontSize:"1.4rem",cursor:"pointer",color:"#7B7063"}}>✕</button>
          </div>
          {editItem._cat==="pago"&&<div style={{marginBottom:10}}><label style={{display:"block",fontSize:".76rem",fontWeight:600,color:"#2C1A0E",marginBottom:4}}>Proveedor</label><input value={editForm.proveedor||""} onChange={e=>setEditForm(f=>({...f,proveedor:e.target.value}))} style={iS}/></div>}
          {editItem._cat==="sueldo"&&<div style={{marginBottom:10}}><label style={{display:"block",fontSize:".76rem",fontWeight:600,color:"#2C1A0E",marginBottom:4}}>Empleado</label><input value={editForm.empleado||""} onChange={e=>setEditForm(f=>({...f,empleado:e.target.value}))} style={iS}/></div>}
          {editItem._cat==="gasto"&&<div style={{marginBottom:10}}><label style={{display:"block",fontSize:".76rem",fontWeight:600,color:"#2C1A0E",marginBottom:4}}>Categoría</label><input value={editForm.categoria||""} onChange={e=>setEditForm(f=>({...f,categoria:e.target.value}))} style={iS}/></div>}
          {[["Monto ($)","monto","number"],["Observaciones","obs","text"]].map(([l,k,t])=>(
            <div key={k} style={{marginBottom:10}}>
              <label style={{display:"block",fontSize:".76rem",fontWeight:600,color:"#2C1A0E",marginBottom:4}}>{l}</label>
              <input type={t} value={editForm[k]||""} onChange={e=>setEditForm(f=>({...f,[k]:e.target.value}))} style={iS}/>
            </div>
          ))}
          <div style={{marginBottom:16}}>
            <label style={{display:"block",fontSize:".76rem",fontWeight:600,color:"#2C1A0E",marginBottom:4}}>Fecha</label>
            <input type="date" value={editForm.fecha||""} onChange={e=>setEditForm(f=>({...f,fecha:e.target.value}))} style={iS}/>
          </div>
          <div style={{display:"flex",gap:10}}>
            <button onClick={()=>setEditItem(null)} style={{flex:1,padding:12,borderRadius:10,border:"none",background:"#E8DCC8",fontWeight:600,cursor:"pointer"}}>Cancelar</button>
            <button onClick={guardar} style={{flex:1,padding:12,borderRadius:10,border:"none",background:"#2D6A4F",color:"#fff",fontWeight:600,cursor:"pointer"}}>Guardar</button>
          </div>
        </div>
      </div>
    )}

    {confElim&&(
      <div style={{position:"fixed",inset:0,background:"rgba(44,26,14,.65)",zIndex:500,display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
        <div style={{background:"#fff",borderRadius:"20px 20px 0 0",padding:"28px 20px 44px",width:"100%",maxWidth:460}}>
          <p style={{fontFamily:"Georgia,serif",fontSize:"1.1rem",marginBottom:8}}>⚠️ Eliminar</p>
          <p style={{fontSize:".85rem",color:"#7B7063",marginBottom:16}}>{confElim._label} · {fmt(confElim.monto)} · {fmtF(confElim.fecha)}</p>
          <div style={{display:"flex",gap:10}}>
            <button onClick={()=>setConfElim(null)} style={{flex:1,padding:12,borderRadius:10,border:"none",background:"#E8DCC8",fontWeight:600,cursor:"pointer"}}>Cancelar</button>
            <button onClick={eliminar} style={{flex:1,padding:12,borderRadius:10,border:"none",background:"#C0392B",color:"#fff",fontWeight:600,cursor:"pointer"}}>Eliminar</button>
          </div>
        </div>
      </div>
    )}
  </>);
}

function TabCajaDigital({calcDigital,cajaDigitalSaldo,saveCajaDigitalSaldo,cajaDigitalAjustes,saveCajaDigitalAjustes,actualizarSaldoBanco,pagos,savePagos,sueldos,saveSueldos,gastos,saveGastos,cierresCaja,proveedores,pagarConExcedente,empleados,saveEmpleados,liquidaciones}){
  const hoy=new Date();
  const iso=d=>d.toISOString().slice(0,10);
  const inicioMes=new Date(hoy.getFullYear(),hoy.getMonth(),1);
  const[filtroFecha,setFiltroFecha]=useState("mes");
  const[desde,setDesde]=useState(iso(inicioMes));
  const[hasta,setHasta]=useState(iso(hoy));
  const[filtroTipo,setFiltroTipo]=useState("todo");
  const[filtroDH,setFiltroDH]=useState("todos");
  const[buscar,setBuscar]=useState("");
  const[saldoBanco,setSaldoBanco]=useState("");
  const[notaBanco,setNotaBanco]=useState("");
  const[fechaBanco,setFechaBanco]=useState(hoyLocal());
  const[editAjusteId,setEditAjusteId]=useState(null);
  const[savingBanco,setSavingBanco]=useState(false);
  const[verSaldoBanco,setVerSaldoBanco]=useState(false);
  const[editItem,setEditItem]=useState(null);
  const[editForm,setEditForm]=useState({});
  const[confElim,setConfElim]=useState(null);

  // Registrar pago (agrupado acá: proveedor, sueldo o gasto/pago digital, todo lo que se pueda pagar en digital)
  const[nuevoPagoModal,setNuevoPagoModal]=useState(false);
  const[tipoPago,setTipoPago]=useState("proveedor"); // "proveedor" | "sueldo" | "gasto"
  const[prov,setProv]=useState("");const[emp,setEmp]=useState("");
  const[montoPago,setMontoPago]=useState("");const[formaPago,setFormaPago]=useState("Transferencia");
  const[obsPago,setObsPago]=useState("");const[fechaPago,setFechaPago]=useState(hoyLocal());
  const[busyPago,setBusyPago]=useState(false);
  const[nuevoRegModal,setNuevoRegModal]=useState(false);
  const[nuevoRegNombre,setNuevoRegNombre]=useState("");
  const registradores=(empleados||[]).filter(e=>e.estado==="Activo");
  // Sueldo
  const[empSueldo,setEmpSueldo]=useState("");
  const[conceptoSueldo,setConceptoSueldo]=useState("Sueldo");
  const[hsExtrasSueldo,setHsExtrasSueldo]=useState("");
  const EMPS=(empleados||[]).filter(e=>e.estado!=="Inactivo"&&!e.excluirLiquidacion).slice().sort((a,b)=>a.nombre.localeCompare(b.nombre));
  // Gasto (pago digital)
  const CATS_BASE_DIG=['Alquiler','Contadora','Abogada','Conciliaciones','Amex','Impuestos','Carta Documento','Disney','FUDO','Fumigador','Mantenimiento','Movistar','Rapiboy','Retiro para sueldos'];
  const[catsGasto,setCatsGasto]=useState(()=>{
    try{
      const s=localStorage.getItem("amapola_cats_gastos");
      const guardadas=s?JSON.parse(s):[];
      return Array.from(new Set([...CATS_BASE_DIG,...guardadas]));
    }catch{return CATS_BASE_DIG;}
  });
  const[catGasto,setCatGasto]=useState("");
  const[nuevaCatModal,setNuevaCatModal]=useState(false);
  const[nuevaCat,setNuevaCat]=useState("");
  const proveedoresActivos=(proveedores||[]).filter(p=>p.estado!=="Inactivo").slice().sort((a,b)=>a.nombre.localeCompare(b.nombre));

  const{ingresos,egTransf,saldoReal,deducciones}=calcDigital();

  // Saldo de la caja retiro para sueldos (mismo cálculo que en Caja Disponible/Sueldos) — permite pagar acá
  // un gasto categoría "DIGITAL" (retiro de ganancia) con esa plata en vez de Transferencia.
  const totalRetirado=(gastos||[]).filter(g=>g.forma==="Efectivo"&&(g.categoria||"").trim().toLowerCase()===RETIRO_SUELDOS_CAT.toLowerCase()).reduce((s,g)=>s+Number(g.monto||0),0);
  const totalUsadoDeRetiro=(sueldos||[]).filter(s=>s.forma==="Retiro").reduce((s2,s)=>s2+Number(s.monto||0),0)
    +(gastos||[]).filter(g=>g.forma==="Retiro"&&(g.categoria||"").trim().toLowerCase()===RETIRO_GANANCIA_CAT.toLowerCase()).reduce((s2,g)=>s2+Number(g.monto||0),0);
  const saldoRetiro=totalRetirado-totalUsadoDeRetiro;

  const agregarRegistrador=async()=>{
    const nombre=nuevoRegNombre.trim();
    if(!nombre){toast("Ingresá un nombre");return;}
    if(registradores.some(r=>norm(r.nombre)===norm(nombre))){toast("Ya existe");setEmp(nombre);setNuevoRegNombre("");setNuevoRegModal(false);return;}
    const nuevo={id:uid(),nombre,apellido:"",dni:"",domicilio:"",telPropio:"",telContacto:"",estado:"Activo"};
    await saveEmpleados([...(empleados||[]),nuevo]);
    setEmp(nombre);setNuevoRegNombre("");setNuevoRegModal(false);
    toast("Agregado ✓");
  };

  const agregarCategoriaGasto=()=>{
    if(!nuevaCat.trim()){toast("Ingresá el nombre de la categoría");return;}
    if(catsGasto.includes(nuevaCat.trim())){toast("Ya existe esa categoría");return;}
    const nuevas=[...catsGasto,nuevaCat.trim()];
    setCatsGasto(nuevas);
    localStorage.setItem("amapola_cats_gastos",JSON.stringify(nuevas));
    setCatGasto(nuevaCat.trim());
    setNuevaCat("");setNuevaCatModal(false);
    toast("Categoría creada ✓");
  };

  const limpiarFormPago=()=>{
    setProv("");setEmp("");setEmpSueldo("");setConceptoSueldo("Sueldo");setHsExtrasSueldo("");
    setCatGasto("");
    setMontoPago("");setObsPago("");setFechaPago(hoyLocal());
  };

  const guardarPago=async()=>{
    // Antes bloqueaba directo si superaba el disponible digital. Adrian pidió (2026-08-18) poder pagar
    // igual aunque no alcance — el saldo de Caja Digital queda en negativo, con un confirm de por medio
    // para que no sea sin querer.
    if(formaPago==="Transferencia"&&Number(montoPago)>saldoReal){
      if(!confirm(`⚠️ Esto supera el disponible digital (${fmt(saldoReal)}) — la Caja Digital va a quedar en ${fmt(saldoReal-Number(montoPago))}. ¿Confirmás igual?`))return false;
    }

    if(tipoPago==="proveedor"){
      if(!prov.trim()||!emp.trim()||!montoPago){toast("Completá todos los campos");return false;}
      setBusyPago(true);
      const fechaISO=fechaLocalISO(fechaPago);
      const pagoBase={tipo:"pago",proveedor:prov.trim(),empleado:emp.trim(),monto:Number(montoPago),forma:formaPago,obs:obsPago.trim(),fecha:fechaISO};
      await pagarConExcedente(pagoBase,pagos,savePagos);
      setBusyPago(false);limpiarFormPago();
      toast("Pago registrado ✓");
      return true;
    }

    if(tipoPago==="sueldo"){
      if(!empSueldo||!montoPago){toast("Elegí un empleado e ingresá el monto");return false;}
      // Si el concepto es "Sueldo" y hay una liquidación confirmada de ese empleado+período, este pago
      // queda enlazado a ella (liquidacionId) — así la Nómina de Liquidación de sueldos sigue mostrando
      // "Pago parcial"/"Pagada" aunque el pago se registre acá y no desde el botón de Liquidación (que ya
      // no existe: el pago real se hace desde Caja Disponible, Caja Digital o Sueldos).
      let liquidacionId=null;
      if(conceptoSueldo==="Sueldo"){
        const per=(fechaPago||hoyLocal()).slice(0,7);
        const empMatch=(empleados||[]).find(e=>norm(e.nombre)===norm(empSueldo)||norm(e.nombre).startsWith(norm(empSueldo))||norm(empSueldo).startsWith(norm(e.nombre)));
        const liq=empMatch?(liquidaciones||[]).find(l=>l.empleadoId===empMatch.id&&l.periodo===per&&l.estado==="confirmada"):null;
        if(liq){
          liquidacionId=liq.id;
          const pagado=(sueldos||[]).filter(s=>s.liquidacionId===liq.id).reduce((s2,s)=>s2+Number(s.monto||0),0);
          if(pagado>0&&Math.round(pagado*100)>=Math.round(Number(liq.neto||0)*100)){
            if(!confirm("⚠️ "+empSueldo+" ya tiene la liquidación de "+per+" pagada por completo ("+fmt(pagado)+"). ¿Registrar este pago de todas formas?"))return false;
          }
        }
      }
      setBusyPago(true);
      const fechaISO=fechaLocalISO(fechaPago);
      await saveSueldos([...(sueldos||[]),{id:uid(),tipo:"sueldo",empleado:empSueldo,concepto:conceptoSueldo,hsExtras:conceptoSueldo==="HS Extras"?Number(hsExtrasSueldo)||0:null,monto:Number(montoPago),forma:formaPago,obs:obsPago.trim(),fecha:fechaISO,...(liquidacionId?{liquidacionId}:{})}]);
      setBusyPago(false);limpiarFormPago();
      toast(liquidacionId?"Sueldo registrado ✓ — vinculado a la liquidación del período":"Sueldo registrado ✓");
      return true;
    }

    // gasto (pago digital)
    if(!catGasto||!montoPago){toast("Elegí una categoría e ingresá el monto");return false;}
    if(formaPago==="Retiro"){
      if(norm(catGasto)!==norm(RETIRO_GANANCIA_CAT)){toast("La forma \"Retiro\" solo está disponible para la categoría "+RETIRO_GANANCIA_CAT);return false;}
      if(Number(montoPago)>saldoRetiro){toast("⚠️ Supera el saldo de caja retiro para sueldos ("+fmt(saldoRetiro)+")");return false;}
    }
    setBusyPago(true);
    const fechaISO=fechaLocalISO(fechaPago);
    const registro={id:uid(),tipo:"gasto",categoria:catGasto,monto:Number(montoPago),forma:formaPago,obs:obsPago.trim(),fecha:fechaISO};
    await saveGastos([...(gastos||[]),registro]);
    setBusyPago(false);limpiarFormPago();
    toast(formaPago==="Retiro"?"Gasto registrado ✓ — pagado con la caja retiro para sueldos":"Pago registrado ✓");
    return true;
  };

  const limpiarAjusteBanco=()=>{setEditAjusteId(null);setSaldoBanco("");setNotaBanco("");setFechaBanco(hoyLocal());};

  const actualizarBanco=async()=>{
    if(!saldoBanco){toast("Ingresá el saldo real");return;}
    if(!notaBanco.trim()){toast("Ingresá el motivo del ajuste");return;}
    setSavingBanco(true);
    const saldoNuevo=Number(saldoBanco);
    if(editAjusteId){
      // Editar un ajuste existente: si es el más reciente (el que rige el saldo actual), el saldo real de
      // Caja Digital también se corrige. Si es uno viejo, solo se corrige el texto del historial — no
      // afecta el cálculo (calcDigital solo mira cajaDigitalSaldo y la fecha del ajuste más reciente).
      const esUltimo=cajaDigitalAjustes&&cajaDigitalAjustes[0]&&cajaDigitalAjustes[0].id===editAjusteId;
      const fechaISO=fechaLocalISO(fechaBanco);
      const nuevas=(cajaDigitalAjustes||[]).map(a=>a.id===editAjusteId?{...a,saldoNuevo,fecha:fechaISO,diferencia:saldoNuevo-Number(a.saldoAnterior||0),nota:notaBanco.trim()}:a);
      await saveCajaDigitalAjustes(nuevas);
      if(esUltimo)await saveCajaDigitalSaldo(saldoNuevo);
      setSavingBanco(false);limpiarAjusteBanco();
      toast("Ajuste actualizado ✓");
      return;
    }
    const ok=await actualizarSaldoBanco(saldoNuevo,notaBanco,fechaBanco);
    setSavingBanco(false);
    if(ok===false)return;
    limpiarAjusteBanco();
    toast("Saldo banco actualizado ✓");
  };

  const editarAjusteBanco=a=>{
    if(a.tipo==="prestamo"){toast("Los préstamos se editan desde Amex");return;}
    if(!a.id){toast("Este ajuste es de antes de la mejora y no se puede editar — registrá uno nuevo si hace falta corregir.");return;}
    setEditAjusteId(a.id);setSaldoBanco(String(a.saldoNuevo));setNotaBanco(a.nota||"");setFechaBanco(a.fecha?a.fecha.slice(0,10):hoyLocal());
  };

  const eliminarAjusteBanco=async a=>{
    if(!confirm("¿Eliminar este ajuste del historial? El saldo actual de Caja Digital no se modifica automáticamente al borrarlo."))return;
    await saveCajaDigitalAjustes((cajaDigitalAjustes||[]).filter(x=>x.id!==a.id));
    toast("Eliminado");
    if(editAjusteId===a.id)limpiarAjusteBanco();
  };

  // Movimientos digitales
  const pagosTr   = (pagos||[]).filter(p=>p.forma==="Transferencia").map(p=>({...p,_cat:"pago",  _label:p.proveedor,_signo:-1}));
  const sueldosTr = (sueldos||[]).filter(s=>s.forma==="Transferencia").map(s=>({...s,_cat:"sueldo",_label:s.empleado+" · "+(s.concepto||"Sueldo"),_signo:-1}));
  const gastosTr  = (gastos||[]).filter(g=>g.forma==="Transferencia").map(g=>({...g,_cat:"gasto", _label:g.categoria,_signo:-1}));
  const cierresDig= (cierresCaja||[]).filter(c=>Number(c.totalDigital||0)>0).map(c=>({...c,_cat:"cierre",_label:"Cierre "+c.turno,monto:c.totalDigital,_signo:1}));
  // Préstamos (inyección de dinero de Amex a Caja Digital) — ajustes de saldo etiquetados tipo:"prestamo"
  // desde TabAmex. Los demás ajustes ("Actualizar saldo banco") NO se listan acá: son correcciones del
  // saldo contado, no un movimiento real. El préstamo sí es plata real que entró, por eso se lista.
  const prestamosInj=(cajaDigitalAjustes||[]).filter(a=>a.tipo==="prestamo").map(a=>({id:"prestamo-"+a.fecha,fecha:a.fechaMovimiento||a.fecha,_cat:"prestamo",_label:a.nota||"Préstamo Amex",monto:a.diferencia,_signo:1}));
  const allMovs   = [...pagosTr,...sueldosTr,...gastosTr,...cierresDig,...prestamosInj].sort((a,b)=>a.fecha.localeCompare(b.fecha));

  // Filtro fechas
  const desdeF = filtroFecha==="mes"?iso(inicioMes):filtroFecha==="hoy"?iso(hoy):desde;
  const hastaF = filtroFecha==="mes"?iso(hoy):filtroFecha==="hoy"?iso(hoy):hasta;

  const filtrados = allMovs
    .filter(m=>(!desdeF||m.fecha.slice(0,10)>=desdeF)&&(!hastaF||m.fecha.slice(0,10)<=hastaF))
    .filter(m=>filtroTipo==="todo"||m._cat===filtroTipo)
    .filter(m=>filtroDH==="todos"||(filtroDH==="debe"&&m._signo<0)||(filtroDH==="haber"&&m._signo>0))
    .filter(m=>!buscar||(m._label||"").toLowerCase().includes(buscar.toLowerCase())||fmtF(m.fecha).includes(buscar));

  // Saldo acumulado desde el saldo real del banco
  // saldoReal = saldo del banco actual (ya incluye todos los movimientos hasta hoy)
  // Para el libro: deshacemos los movimientos desde el inicio del período hacia atrás para
  // hallar el saldo base, y desde ahí avanzamos sumando ingresos y restando egresos del período.
  const filtradosAsc=[...filtrados].sort((a,b)=>a.fecha.localeCompare(b.fecha));
  let saldoAcum = Number(saldoReal)||0;
  allMovs.filter(m=>!desdeF||m.fecha.slice(0,10)<desdeF).forEach(m=>{
    saldoAcum -= m._signo*Number(m.monto||0);
  });
  const saldoBase=saldoAcum;
  const filasAsc=filtradosAsc.map(m=>{
    saldoAcum += m._signo*Number(m.monto||0);
    return{...m,_saldo:saldoAcum};
  });
  const filas=[...filasAsc].reverse();

  const totalEgresos=filtradosAsc.filter(m=>m._signo<0).reduce((s,m)=>s+Number(m.monto||0),0);
  const totalIngresos=filtradosAsc.filter(m=>m._signo>0).reduce((s,m)=>s+Number(m.monto||0),0);

  const iconoCat=c=>c==="cierre"?"💵":c==="pago"?"💸":c==="sueldo"?"👤":c==="prestamo"?"🏦":"🏠";

  const abrirEditar=m=>{
    setEditItem(m);
    setEditForm({
      monto:String(m.monto),obs:m.obs||"",fecha:m.fecha.slice(0,10),
      ...(m._cat==="pago"?{proveedor:m.proveedor,empleado:m.empleado}:{}),
      ...(m._cat==="sueldo"?{empleado:m.empleado,concepto:m.concepto||"Sueldo"}:{}),
      ...(m._cat==="gasto"?{categoria:m.categoria}:{}),
    });
  };

  const guardar=async()=>{
    const nf=editForm.fecha?new Date(editForm.fecha+"T12:00:00").toISOString():editItem.fecha;
    if(editItem._cat==="pago")   await savePagos(pagos.map(p=>p.id===editItem.id?{...p,...editForm,monto:Number(editForm.monto),fecha:nf}:p));
    if(editItem._cat==="sueldo") await saveSueldos(sueldos.map(s=>s.id===editItem.id?{...s,...editForm,monto:Number(editForm.monto),fecha:nf}:s));
    if(editItem._cat==="gasto")  await saveGastos(gastos.map(g=>g.id===editItem.id?{...g,...editForm,monto:Number(editForm.monto),fecha:nf}:g));
    setEditItem(null);toast("Actualizado ✓");
  };

  const eliminar=async()=>{
    const m=confElim;setConfElim(null);
    if(m._cat==="pago")   await savePagos(pagos.filter(p=>p.id!==m.id));
    if(m._cat==="sueldo") await saveSueldos(sueldos.filter(s=>s.id!==m.id));
    if(m._cat==="gasto")  await saveGastos(gastos.filter(g=>g.id!==m.id));
    toast("Eliminado ✓");
  };

  return(<>
    <ST help={"Caja Digital muestra el saldo del banco: arranca del último saldo real que ingresaste a mano y desde ahí se actualiza sola con cada ingreso digital (cierre de turno) y cada egreso por transferencia (pago a proveedor, sueldo o pago digital).\n\n• Los pagos por transferencia que registrás en Pagos, Sueldos o Pagos Digitales descuentan este saldo automáticamente y quedan anotados en el Libro diario · Digital de acá abajo.\n• Con + Registrar pago podés cargar, todo desde acá, cualquier cosa que se pague en digital: un pago a Proveedor, un Sueldo o un Gasto (Pagos Digitales) — elegí el tipo arriba del formulario. Queda guardado exactamente igual que si lo cargaras en Pagos, Sueldos o Pagos Digitales. Por defecto la forma de pago es Transferencia, pero también podés elegir Efectivo (o Amex/Retiro según el tipo) si hace falta.\n• Si el pago es tipo Sueldo con concepto 'Sueldo' y ese empleado tiene una liquidación confirmada de ese período en Liquidación de sueldos, el pago se enlaza solo a esa liquidación — así queda marcada como pagada ahí sin que tengas que ir a hacer nada aparte.\n• El gasto categoría 'DIGITAL' (retiros de ganancia) normalmente se paga por Transferencia (descuenta acá), pero si esa vez la plata salió de la caja retiro para sueldos en vez de la Caja Digital, elegí forma 'Retiro' — no descuenta ni caja ni banco, y no te deja cargar más de lo que queda disponible en esa caja aparte (la misma que se ve en Caja Disponible y Sueldos).\n• ⚙️ Saldo banco: actualizá el saldo cada vez que revisés el banco, así corregís cualquier diferencia (por ejemplo transferencias que tardan en acreditarse) — eso arranca un nuevo corte. Ahora pide motivo (obligatorio) y fecha del ajuste, te muestra la diferencia contra el saldo anterior mientras escribís, y podés Editar o Eliminar cualquier ajuste ya cargado desde el historial de ese mismo cuadro (excepto los préstamos, que se editan desde Amex). Este mismo botón de actualizar saldo también existe en Gerencia — usés el que usés, queda igual de registrado acá.\n• Los préstamos que cargues en 🏦 Amex → 'Registrar préstamo' aparecen acá como una fila de Haber (🏦, monto recibido) el mismo día que los cargaste — es la inyección de dinero real, a diferencia de una corrección de saldo banco (que no se lista como movimiento porque no es plata que entró, es solo un ajuste contable). Filtrá por 'Préstamos' para verlos solos.\n• El cruce de movimientos digitales de siempre lo ves en el Dashboard."}>Caja Digital</ST><SS>Saldo del banco y libro diario de movimientos digitales.</SS>

    {/* PANEL BANCO */}

              {(tipoPago==="proveedor"||tipoPago==="gasto")&&<option value="Amex">Amex</option>}
              {(tipoPago==="sueldo"||(tipoPago==="gasto"&&norm(catGasto)===norm(RETIRO_GANANCIA_CAT)))&&<option value="Retiro">Retiro (ya lo tenía en mano, no descuenta caja)</option>}

          {formaPago==="Efectivo"&&<div style={{fontSize:".78rem",color:"#2D6A4F",background:"#EAF5F0",borderRadius:8,padding:"8px 10px",marginTop:8}}>💵 Este pago descontará de la caja disponible (efectivo), no del disponible digital.</div>}
          {formaPago==="Amex"&&<div style={{fontSize:".78rem",color:"#B7860B",background:"#FEF9E7",borderRadius:8,padding:"8px 10px",marginTop:8}}>💳 No descuenta caja ni banco — queda cargado al resumen de la tarjeta.</div>}

          <div style={{display:"flex",gap:10}}>

}


function TabGerencia({calcDigital,saldo,ini,tot,eg,cajaDigitalSaldo,actualizarSaldoBanco}){
  const[saldoBanco,setSaldoBanco]=useState("");
  const[notaBanco,setNotaBanco]=useState("");
  const[savingBanco,setSavingBanco]=useState(false);
  const{ingresos,egTransf,saldoReal,deducciones}=calcDigital();

  const actualizarBanco=async()=>{
    if(!saldoBanco){toast("Ingresá el saldo real");return;}
    setSavingBanco(true);
    const ok=await actualizarSaldoBanco(Number(saldoBanco),notaBanco);
    setSavingBanco(false);
    if(ok===false)return;
    setSaldoBanco("");setNotaBanco("");
    toast("Saldo banco actualizado ✓");
  };

  const totalDisponible=saldo+saldoReal;

  return(<>
    <ST help={"Vista consolidada para gerencia.\n\n• Total disponible: suma de Caja Disponible (efectivo) + Caja Digital (banco).\n• Caja Disponible: saldo inicial + cierres de turno − pagos en efectivo.\n• Caja Digital: calculada desde el último saldo banco ingresado + ingresos digitales − egresos por transferencia.\n\nPara actualizar el saldo banco de Caja Digital, ingresá el valor real y el motivo (obligatorio) desde acá o desde la sección Caja Digital — es el mismo ajuste, queda en el mismo historial."}>Gerencia</ST><SS>Resumen de efectivo y caja digital disponible.</SS>

    {/* TOTAL CONSOLIDADO */}
    <div style={{background:"#2C1A0E",borderRadius:14,padding:"22px 20px",marginBottom:16}}>
      <div style={{fontSize:".65rem",letterSpacing:".08em",textTransform:"uppercase",color:"#E8DCC8",opacity:.7}}>Total disponible consolidado</div>
      <div style={{fontFamily:"Georgia,serif",fontSize:"2.6rem",color:"#E8DCC8",margin:"4px 0 2px"}}>{fmt(totalDisponible)}</div>
      <div style={{fontSize:".74rem",color:"#E8DCC8",opacity:.6}}>Caja Disponible + Caja digital</div>
    </div>

    {/* CAJA FUERTE */}
    <div style={{background:"#2D6A4F",borderRadius:14,padding:"20px",marginBottom:12}}>
      <div style={{fontSize:".65rem",letterSpacing:".08em",textTransform:"uppercase",color:"#fff",opacity:.8}}>💵 Caja Disponible · Efectivo</div>
      <div style={{fontFamily:"Georgia,serif",fontSize:"2rem",color:"#fff",margin:"4px 0 8px"}}>{fmt(saldo)}</div>
      <div style={{display:"flex",gap:8}}>
        {[["Inicial",fmt(ini)],["Cierres",fmt(tot)],["Pagado",fmt(eg)]].map(([l,v])=>(
          <div key={l} style={{flex:1,background:"rgba(255,255,255,.12)",borderRadius:10,padding:"8px 10px"}}>
            <div style={{fontSize:".58rem",color:"#fff",opacity:.6,textTransform:"uppercase",letterSpacing:".04em"}}>{l}</div>
            <div style={{fontSize:".85rem",fontWeight:700,color:"#fff",marginTop:2}}>{v}</div>
          </div>
        ))}
      </div>
    </div>

    {/* CAJA DIGITAL */}
    <div style={{background:"#2C1A0E",borderRadius:14,padding:"20px",marginBottom:16,border:"2px solid #B7860B"}}>
      <div style={{fontSize:".65rem",letterSpacing:".08em",textTransform:"uppercase",color:"#E8DCC8",opacity:.7}}>💳 Caja digital · Banco</div>
      <div style={{fontFamily:"Georgia,serif",fontSize:"2rem",color:"#E8DCC8",margin:"4px 0 2px"}}>{fmt(saldoReal)}</div>
      <div style={{fontSize:".72rem",color:"#E8DCC8",opacity:.6,marginBottom:12}}>Saldo real del banco actualizado manualmente</div>
      <div style={{display:"flex",gap:8,marginBottom:14}}>
        {[["Inicial",fmt(ini||0),"#E8DCC8"],["Ingresos dig.",fmt(ingresos),"#a9dfbf"],["Egresos transf.",fmt(egTransf),"#f5b7b1"]].map(([l,v,c])=>(
          <div key={l} style={{flex:1,background:"rgba(255,255,255,.07)",borderRadius:10,padding:"8px 10px"}}>
            <div style={{fontSize:".58rem",color:"#E8DCC8",opacity:.6,textTransform:"uppercase",letterSpacing:".04em"}}>{l}</div>
            <div style={{fontSize:".85rem",fontWeight:700,color:c,marginTop:2}}>{v}</div>
          </div>
        ))}
      </div>
      <div style={{display:"flex",gap:8,marginBottom:8}}>
        <input type="number" value={saldoBanco} onChange={e=>setSaldoBanco(e.target.value)}
          placeholder="Ingresar saldo real banco"

    </div>

function TabCierresCaja({cierresCaja,saveCierresCaja,empleados,saveEmpleados,soloUltimoDia}){
  const TURNOS=["Mostrador Día","Mostrador Noche","PosFUDO1","PosFUDO2"];
  const hoy=hoyLocal();
  const registradores=(empleados||[]).filter(e=>e.estado==="Activo");

  const[fecha,setFecha]=useState(hoy);
  const[turno,setTurno]=useState("Mostrador Día");
  const[persona,setPersona]=useState("");
  const[mp,setMp]=useState("");
  const[fudoTarjetas,setFudoTarjetas]=useState("");
  const[postnet,setPostnet]=useState("");
  const[digital,setDigital]=useState("");
  const[uber,setUber]=useState("");
  const[efectivo,setEfectivo]=useState("");
  const[ventaSistema,setVentaSistema]=useState("");
  const[obs,setObs]=useState("");
  const[busy,setBusy]=useState(false);
  const[confElim,setConfElim]=useState(null);
  const[nuevoPersonaModal,setNuevoPersonaModal]=useState(false);
  const[nuevoPersonaNombre,setNuevoPersonaNombre]=useState("");
  const[filtroFecha,setFiltroFecha]=useState("todos");
  const[desdeF,setDesdeF]=useState(hoy);
  const[hastaF,setHastaF]=useState(hoy);
  const[buscar,setBuscar]=useState("");

  // Se guarda en Empleados (lo mismo que usan Boletas/Sueldos/Pagos) para que quede persistido y no
  // se pierda al recargar la app — antes era una lista fija en memoria que se reiniciaba sola.
  const agregarPersona=async()=>{
    const nombre=nuevoPersonaNombre.trim();
    if(!nombre){toast("Ingresá un nombre");return;}
    if(registradores.some(r=>norm(r.nombre)===norm(nombre))){toast("Ya existe");setPersona(nombre);setNuevoPersonaNombre("");setNuevoPersonaModal(false);return;}
    const nuevo={id:uid(),nombre,apellido:"",dni:"",domicilio:"",telPropio:"",telContacto:"",estado:"Activo"};
    await saveEmpleados([...(empleados||[]),nuevo]);
    setPersona(nombre);setNuevoPersonaNombre("");setNuevoPersonaModal(false);
    toast("Agregado ✓");
  };
  const eliminarCierre=async()=>{
    const c=confElim;setConfElim(null);
    await saveCierresCaja(cierresCaja.filter(x=>x.id!==c.id));
    toast("Cierre eliminado ✓");
  };

  const n=v=>Number(v)||0;
  const totalDigital=n(mp)+n(fudoTarjetas)+n(postnet)+n(digital)+n(uber);
  const totalCierre=totalDigital+n(efectivo);
  const diferencia=totalCierre-n(ventaSistema);

  const guardar=async()=>{
    if(!persona.trim()||!turno){toast("Completá persona y turno");return;}
    if(!ventaSistema){toast("⚠️ Ingresá la venta del sistema");return;}
    if(!efectivo&&!mp&&!fudoTarjetas&&!postnet&&!digital&&!uber){toast("Ingresá al menos un monto");return;}
    setBusy(true);
    const cierreId=uid();
    const nuevo={
      id:cierreId,tipo:"cierre_caja",
      fecha:fechaLocalISO(fecha),
      turno,persona:persona.trim(),
      mp:n(mp),fudoTarjetas:n(fudoTarjetas),postnet:n(postnet),
      digital:n(digital),uber:n(uber),
      efectivo:n(efectivo),totalDigital,total:totalCierre,
      ventaSistema:n(ventaSistema),diferencia,obs:obs.trim(),
    };
    const ok=await saveCierresCaja([...cierresCaja,nuevo]);

    setBusy(false);
    if(!ok){toast("❌ Error al guardar — verificá la conexión e intentá de nuevo");return;}
    setMp("");setFudoTarjetas("");setPostnet("");setDigital("");setUber("");
    setEfectivo("");setVentaSistema("");setObs("");setPersona("");
    setFecha(hoyLocal());
    toast("Cierre registrado ✓");
  };

  // Marca con ⚠️ los cierres cuya diferencia (contra venta del sistema) es grande — más del 3%.
  const UMBRAL_DIF_PCT=0.03;
  const esDifGrande=c=>Number(c.ventaSistema)>0&&Math.abs(Number(c.diferencia))>Number(c.ventaSistema)*UMBRAL_DIF_PCT;

  // Últimos cierres — con filtro de fecha y búsqueda por persona/turno
  const hoy2=new Date();
  const iso2=d=>d.toISOString().slice(0,10);
  const inicioMes2=new Date(hoy2.getFullYear(),hoy2.getMonth(),1);
  const desdeCalc=filtroFecha==="hoy"?hoy:filtroFecha==="mes"?iso2(inicioMes2):filtroFecha==="custom"?desdeF:null;
  const hastaCalc=filtroFecha==="hoy"?hoy:filtroFecha==="mes"?iso2(hoy2):filtroFecha==="custom"?hastaF:null;
  // Acceso Front (rol restringido, solo Stock y Cierres de Caja): en vez de los filtros normales, el
  // historial queda fijo al ÚLTIMO día que tiene algún cierre cargado — así puede constatar si el cierre
  // de ese turno/día ya se hizo o no, sin ver el historial completo de días anteriores.
  const fechaUltimoDia=cierresCaja.length?cierresCaja.reduce((max,c)=>{const f=c.fecha.slice(0,10);return f>max?f:max;},""):null;
  const ultimos=soloUltimoDia
    ? [...cierresCaja]
        .filter(c=>fechaUltimoDia&&c.fecha.slice(0,10)===fechaUltimoDia)
        .sort((a,b)=>{
          const d=new Date(b.fecha)-new Date(a.fecha);
          if(d!==0)return d;
          return String(b.id||"").localeCompare(String(a.id||""));
        })
    : [...cierresCaja]
        .filter(c=>{const f=c.fecha.slice(0,10);return(!desdeCalc||f>=desdeCalc)&&(!hastaCalc||f<=hastaCalc);})
        .filter(c=>!buscar||norm(c.persona).includes(norm(buscar))||norm(c.turno).includes(norm(buscar)))
        .sort((a,b)=>{
          const d=new Date(b.fecha)-new Date(a.fecha);
          if(d!==0)return d;
          return String(b.id||"").localeCompare(String(a.id||""));
        })
        .slice(0,filtroFecha==="todos"?30:200);

  const exportarCierres=()=>{
    if(!ultimos.length){toast("No hay cierres para exportar en este período");return;}
    const rows=[["Fecha","Turno","Persona","MP/FUDO","FUDO Tarjetas","PostNet","Digital","Uber Eat","Efectivo","Total","Venta Sistema","Diferencia","Observaciones"]];
    ultimos.forEach(c=>rows.push([fmtF(c.fecha),c.turno,c.persona,c.mp||0,c.fudoTarjetas||0,c.postnet||0,c.digital||0,c.uber||0,c.efectivo||0,c.total||0,c.ventaSistema||0,c.diferencia||0,c.obs||""]));
    const csv=rows.map(r=>r.map(v=>`"${String(v||"").replace(/"/g,'""')}"`).join(",")).join("\n");
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8;"}));
    a.download=`amapola_cierres_${hoyLocal()}.csv`;a.click();
  };

  return(<>

function PagosAdmin({pagos,savePagos,proveedores}){
  const[buscar,setBuscar]=useState("");
  const[editItem,setEditItem]=useState(null);
  const[editForm,setEditForm]=useState({});
  const[confElim,setConfElim]=useState(null);

  const sorted=[...pagos]
    .filter(p=>!buscar||(p.proveedor||"").toLowerCase().includes(buscar.toLowerCase())||fmtF(p.fecha).includes(buscar))
    .sort((a,b)=>b.fecha.localeCompare(a.fecha)).slice(0,30);

  const abrirEditar=p=>{
    setEditItem(p);
    setEditForm({proveedor:p.proveedor,empleado:p.empleado,monto:String(p.monto),forma:p.forma,obs:p.obs||"",fecha:p.fecha.slice(0,10)});
  };

  const guardar=async()=>{
    if(!editForm.proveedor||!editForm.monto){toast("Completá los campos obligatorios");return;}
    const nuevos=pagos.map(p=>p.id===editItem.id?{...p,...editForm,monto:Number(editForm.monto),fecha:editForm.fecha?new Date(editForm.fecha+"T12:00:00").toISOString():p.fecha}:p);
    await savePagos(nuevos);
    setEditItem(null);toast("Pago actualizado ✓");
  };

  const eliminar=async()=>{
    await savePagos(pagos.filter(p=>p.id!==confElim.id));
    setConfElim(null);toast("Pago eliminado ✓");
  };

  return(<>
    <input value={buscar} onChange={e=>setBuscar(e.target.value)} placeholder="🔍 Buscar por proveedor o fecha..."
      style={{...iS,marginBottom:10,fontSize:".82rem"}}/>
    {!sorted.length?<Empty icon="💸">Sin pagos</Empty>:sorted.map((p,i)=>(
      <div key={p.id} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 0",borderBottom:"1px solid #F9F6F1"}}>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontWeight:600,fontSize:".82rem"}}>{p.proveedor}</div>
          <div style={{fontSize:".7rem",color:"#7B7063"}}>{fmtF(p.fecha)} · {p.forma} · {p.empleado}</div>
          {p.obs&&<div style={{fontSize:".7rem",color:"#7B7063"}}>{p.obs}</div>}
        </div>
        <div style={{fontWeight:700,fontSize:".85rem",color:"#C0392B",flexShrink:0}}>{fmt(p.monto)}</div>
        <div style={{display:"flex",gap:4,flexShrink:0}}>
          <button onClick={()=>abrirEditar(p)} style={{background:"#EAF5F0",border:"none",borderRadius:6,color:"#2D6A4F",fontSize:".62rem",fontWeight:600,cursor:"pointer",padding:"3px 7px"}}>✏️</button>
          <button onClick={()=>setConfElim(p)} style={{background:"#FFF0EF",border:"none",borderRadius:6,color:"#E74C3C",fontSize:".62rem",fontWeight:600,cursor:"pointer",padding:"3px 7px"}}>✕</button>
        </div>
      </div>
    ))}

    {editItem&&(
      <div style={{position:"fixed",inset:0,background:"rgba(44,26,14,.65)",zIndex:500,display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
        <div style={{background:"#fff",borderRadius:"20px 20px 0 0",padding:"24px 20px 40px",width:"100%",maxWidth:460,maxHeight:"88dvh",overflowY:"auto"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
            <p style={{fontFamily:"Georgia,serif",fontSize:"1.1rem"}}>✏️ Editar pago</p>
            <button onClick={()=>setEditItem(null)} style={{background:"none",border:"none",fontSize:"1.4rem",cursor:"pointer",color:"#7B7063"}}>✕</button>
          </div>
          <div style={{marginBottom:10}}>
            <label style={{display:"block",fontSize:".76rem",fontWeight:600,color:"#2C1A0E",marginBottom:4}}>Proveedor</label>
            <select value={editForm.proveedor||""} onChange={e=>setEditForm(f=>({...f,proveedor:e.target.value}))} style={sS}>
              <option value="">— Elegí —</option>
              {proveedores.map(p=><option key={p.id} value={p.nombre}>{p.nombre}</option>)}
            </select>
          </div>
          {[["Registrado por","empleado","text"],["Monto ($)","monto","number"],["Observaciones","obs","text"]].map(([l,k,t])=>(
            <div key={k} style={{marginBottom:10}}>
              <label style={{display:"block",fontSize:".76rem",fontWeight:600,color:"#2C1A0E",marginBottom:4}}>{l}</label>
              <input type={t} value={editForm[k]||""} onChange={e=>setEditForm(f=>({...f,[k]:e.target.value}))} style={iS}/>
            </div>
          ))}
          <div style={{marginBottom:10}}>
            <label style={{display:"block",fontSize:".76rem",fontWeight:600,color:"#2C1A0E",marginBottom:4}}>Forma de pago</label>
            <select value={editForm.forma||"Efectivo"} onChange={e=>setEditForm(f=>({...f,forma:e.target.value}))} style={sS}>
              <option value="Efectivo">Efectivo</option>
              <option value="Transferencia">Transferencia</option>
              <option value="Amex">Amex</option>
            </select>
          </div>
          <div style={{marginBottom:16}}>
            <label style={{display:"block",fontSize:".76rem",fontWeight:600,color:"#2C1A0E",marginBottom:4}}>Fecha</label>
            <input type="date" value={editForm.fecha||""} onChange={e=>setEditForm(f=>({...f,fecha:e.target.value}))} style={iS}/>
          </div>
          <div style={{display:"flex",gap:10}}>
            <button onClick={()=>setEditItem(null)} style={{flex:1,padding:12,borderRadius:10,border:"none",background:"#E8DCC8",fontWeight:600,cursor:"pointer"}}>Cancelar</button>
            <button onClick={guardar} style={{flex:1,padding:12,borderRadius:10,border:"none",background:"#2D6A4F",color:"#fff",fontWeight:600,cursor:"pointer"}}>Guardar</button>
          </div>
        </div>
      </div>
    )}

    {confElim&&(
      <div style={{position:"fixed",inset:0,background:"rgba(44,26,14,.65)",zIndex:500,display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
        <div style={{background:"#fff",borderRadius:"20px 20px 0 0",padding:"28px 20px 44px",width:"100%",maxWidth:460}}>
          <p style={{fontFamily:"Georgia,serif",fontSize:"1.1rem",marginBottom:8}}>⚠️ Eliminar pago</p>
          <p style={{fontSize:".85rem",color:"#7B7063",marginBottom:16}}>{confElim.proveedor} · {fmt(confElim.monto)} · {fmtF(confElim.fecha)}</p>
          <div style={{display:"flex",gap:10}}>
            <button onClick={()=>setConfElim(null)} style={{flex:1,padding:12,borderRadius:10,border:"none",background:"#E8DCC8",fontWeight:600,cursor:"pointer"}}>Cancelar</button>
            <button onClick={eliminar} style={{flex:1,padding:12,borderRadius:10,border:"none",background:"#C0392B",color:"#fff",fontWeight:600,cursor:"pointer"}}>Eliminar</button>
          </div>
        </div>
      </div>
    )}
  </>);
}

function CierresAdmin({cierresCaja,saveCierresCaja}){

    const cambios=[];

    if(totalDigEdit!==Number(c0.totalDigital||0))cambios.push(`Digital ${fmt(c0.totalDigital||0)} → ${fmt(totalDigEdit)}`);
    if(n(editForm.ventaSistema)!==Number(c0.ventaSistema||0))cambios.push(`Venta sistema ${fmt(c0.ventaSistema||0)} → ${fmt(n(editForm.ventaSistema))}`);

        total:totalEdit,ventaSistema:n(editForm.ventaSistema),
        diferencia:difEdit,obs:editForm.obs,
        historialEdits:cambios.length?[{fecha:new Date().toISOString(),cambios},...(c.historialEdits||[])]:c.historialEdits,

  const sorted=[...cierresCaja]

        style={{...iS,padding:"8px 10px",fontSize:".85rem"}}/>

  return(<>
    {/* BUSCADOR */}

      style={{...iS,marginBottom:12,fontSize:".85rem"}}/>

    <div style={{overflowX:"auto"}}>
      <table style={{width:"100%",borderCollapse:"collapse",fontSize:".75rem",minWidth:480}}>

            ))}

            <tr key={c.id} style={{background:i%2===0?"#fff":"#F9F6F1"}}>

                {c.historialEdits&&c.historialEdits.length>0

                  :null}
              </td>
              <td style={{padding:"6px 8px",textAlign:"right"}}>
                <div style={{display:"flex",gap:6,justifyContent:"flex-end"}}>
                  <button onClick={()=>abrirEditar(c)} style={{background:"#EAF5F0",border:"none",borderRadius:6,color:"#2D6A4F",fontSize:".65rem",fontWeight:600,cursor:"pointer",padding:"3px 7px"}}>✏️ Editar</button>
                  <button onClick={()=>setConfElim(c)} style={{background:"#FFF0EF",border:"none",borderRadius:6,color:"#E74C3C",fontSize:".65rem",fontWeight:600,cursor:"pointer",padding:"3px 7px"}}>✕ Borrar</button>
                </div>

    {/* MODAL EDITAR COMPLETO */}
    {editItem&&(

        <div style={{background:"#fff",borderRadius:"20px 20px 0 0",padding:"24px 20px 40px",width:"100%",maxWidth:460,maxHeight:"92dvh",overflowY:"auto"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
            <p style={{fontFamily:"Georgia,serif",fontSize:"1.1rem"}}>✏️ Editar cierre</p>
            <button onClick={()=>setEditItem(null)} style={{background:"none",border:"none",fontSize:"1.4rem",cursor:"pointer",color:"#7B7063"}}>✕</button>

              <input type="date" value={editForm.fecha||""} onChange={e=>setEditForm(f=>({...f,fecha:e.target.value}))} style={{...iS,padding:"8px 10px"}}/>
            </div>
            <div style={{flex:1}}>
              <label style={{display:"block",fontSize:".72rem",fontWeight:600,color:"#7B7063",marginBottom:3}}>Turno</label>

            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
              {[["MP/FUDO","mp"],["FUDO Tarjetas","fudoTarjetas"],["PostNet","postnet"],["Digital","digital"],["Uber Eat","uber"]].map(([l,k])=>(
                <div key={k}>
                  <label style={{display:"block",fontSize:".68rem",fontWeight:600,color:"#7B7063",marginBottom:3}}>{l}</label>
                  <input type="number" value={editForm[k]||""} onChange={e=>setEditForm(f=>({...f,[k]:e.target.value}))} style={{...iS,padding:"7px 8px",fontSize:".82rem"}}/>
                </div>
              ))}
              <div style={{display:"flex",alignItems:"flex-end"}}>
                <div style={{background:"#2C1A0E",borderRadius:8,padding:"7px 10px",width:"100%"}}>
                  <div style={{fontSize:".6rem",color:"#E8DCC8",opacity:.6}}>Total digital</div>
                  <div style={{fontWeight:700,color:"#E8DCC8",fontSize:".9rem",marginTop:1}}>{fmt(totalDigEdit)}</div>

              </div>
            </div>
          </div>

          {/* EFECTIVO */}
          <div style={{background:"#EAF5F0",borderRadius:10,padding:"12px",marginBottom:10}}>
            <div style={{fontSize:".68rem",fontWeight:700,color:"#2D6A4F",textTransform:"uppercase",letterSpacing:".06em",marginBottom:8}}>💵 Efectivo</div>
            <input type="number" value={editForm.efectivo||""} onChange={e=>setEditForm(f=>({...f,efectivo:e.target.value}))} style={{...iS,padding:"8px 10px"}}/>

              <div style={{fontSize:".6rem",color:"#7B7063",textAlign:"center"}}>Venta sistema</div>
              <input type="number" value={editForm.ventaSistema||""} onChange={e=>setEditForm(f=>({...f,ventaSistema:e.target.value}))}

          <EF label="Observaciones" fkey="obs" type="text"/>

          {editItem.historialEdits&&editItem.historialEdits.length>0&&(
            <div style={{marginBottom:14,background:"#F9F6F1",borderRadius:10,padding:"10px 12px"}}>

function TabAdmin({proveedores,saveProveedores,cajaInicial,saveCajaInicial,askPass,cierresCaja,saveCierresCaja,pagos,savePagos,sueldos,saveSueldos,boletas,saveBoletas,ajustesCajaEfectivo,saveAjustesCajaEfectivo,saldo,empleados,stock,saveStock}){
  const[unlocked,setUnlocked]=useState(false);
  const[passInput,setPassInput]=useState("");
  const[passErr,setPassErr]=useState(false);
  const[seccion,setSeccion]=useState(null);
  const[nombre,setNombre]=useState("");const[deuda,setDeuda]=useState("");
  const[obs,setObs]=useState("");const[montoIni,setMontoIni]=useState("");
  const[busy,setBusy]=useState(false);

  useEffect(()=>{if(unlocked)setMontoIni(cajaInicial>0?String(cajaInicial):"");},[unlocked,cajaInicial]);

  const intentarAcceso=()=>{
    if(passInput==="Barcala716*"){setUnlocked(true);setPassInput("");setPassErr(false);}
    else{setPassErr(true);setPassInput("");}
  };

  const guardarCajaIni=async()=>{
    const v=Number(montoIni);
    if(isNaN(v)||v<0){toast("Ingresá un monto válido");return;}
    await saveCajaInicial(v);toast("Saldo inicial guardado ✓");
  };

  const guardarProv=async()=>{
    if(!nombre.trim()){toast("Ingresá el nombre del proveedor");return;}
    setBusy(true);
    const norm2=s=>String(s||"").trim().toLowerCase();
    const idx=proveedores.findIndex(p=>norm2(p.nombre)===norm2(nombre));
    let nuevos;
    if(idx>=0){
      nuevos=proveedores.map((p,i)=>i===idx?{...p,deudaInicial:Number(deuda)||0,obs:obs.trim()}:p);
      toast("Proveedor actualizado ✓");
    }else{
      nuevos=[...proveedores,{id:uid(),nombre:nombre.trim(),deudaInicial:Number(deuda)||0,obs:obs.trim(),fecha:new Date().toISOString()}];
      toast("Proveedor creado ✓");
    }
    await saveProveedores(nuevos);setBusy(false);setNombre("");setDeuda("");setObs("");
  };

  const eliminar=async id=>{
    if(!confirm("¿Eliminar este proveedor? Los pagos no se borran."))return;
    await saveProveedores(proveedores.filter(p=>p.id!==id));toast("Eliminado");
  };

  const editar=p=>{setNombre(p.nombre);setDeuda(String(p.deudaInicial||""));setObs(p.obs||"");};

  if(!unlocked)return(
    <>
      <ST>Administración</ST><SS>Ingresá la contraseña para acceder.</SS>
      <Card>
        <Field label="Contraseña de administrador">
          <input type="password" value={passInput} onChange={e=>{setPassInput(e.target.value);setPassErr(false);}}
            onKeyDown={e=>e.key==="Enter"&&intentarAcceso()}
            placeholder="Contraseña" autoFocus style={{...iS,border:`1.5px solid ${passErr?"#E74C3C":"#E8DCC8"}`}}/>
        </Field>

function AjusteCajaEfectivo({saldo,ajustes,saveAjustes}){
  const[monto,setMonto]=useState("");
  const[motivo,setMotivo]=useState("");
  const[fecha,setFecha]=useState(hoyLocal());
  const[busy,setBusy]=useState(false);
  const[editId,setEditId]=useState(null);

  const limpiar=()=>{setEditId(null);setMonto("");setMotivo("");setFecha(hoyLocal());};

  const guardar=async()=>{
    const v=Number(monto);
    if(!monto||isNaN(v)||v===0){toast("Ingresá un monto distinto de cero");return;}
    if(!motivo.trim()){toast("Ingresá el motivo del ajuste");return;}
    setBusy(true);
    const fechaISO=fechaLocalISO(fecha);
    if(editId){
      // Al editar solo se corrige monto/motivo/fecha de ESTE ajuste — el saldoAntes/saldoDespues que
      // quedó guardado en su momento no se recalcula en cascada contra los ajustes posteriores (el saldo
      // total sigue siendo correcto porque calcSaldo() suma los montos directo, esto es solo el texto del historial).
      const nuevas=(ajustes||[]).map(a=>a.id===editId?{...a,monto:v,motivo:motivo.trim(),fecha:fechaISO,saldoDespues:a.saldoAntes+v}:a);
      await saveAjustes(nuevas);
      toast("Ajuste actualizado ✓");
    }else{
      const nuevo={id:uid(),monto:v,motivo:motivo.trim(),saldoAntes:saldo,saldoDespues:saldo+v,fecha:fechaISO};
      await saveAjustes([nuevo,...(ajustes||[])]);
      toast("Ajuste registrado ✓");
    }
    setBusy(false);limpiar();
  };

  const editar=a=>{
    setEditId(a.id);setMonto(String(a.monto));setMotivo(a.motivo||"");setFecha(a.fecha?a.fecha.slice(0,10):hoyLocal());
  };

  const eliminar=async id=>{
    if(!confirm("¿Eliminar este ajuste? El saldo de caja se recalculará."))return;
    await saveAjustes((ajustes||[]).filter(a=>a.id!==id));toast("Eliminado");
    if(editId===id)limpiar();
  };

  return(
    <Card title="Ajuste de caja disponible">
      <p style={{fontSize:".78rem",color:"#7B7063",marginBottom:14}}>Usá esto cuando el efectivo real difiere del sistema (por ejemplo tras un arqueo). Un monto positivo suma al saldo, uno negativo resta. Poné la fecha real en que contaste la diferencia, no necesariamente hoy — así el libro diario queda ordenado.</p>
      <Field label="Monto del ajuste ($) — positivo suma, negativo resta">
        <Inp type="number" value={monto} onChange={setMonto} placeholder="Ej: 10000 o -10000"/>
      </Field>
      <Field label="Motivo (obligatorio)">
        <Inp value={motivo} onChange={setMotivo} placeholder="Ej: diferencia de conteo 07/07"/>
      </Field>
      <Field label="Fecha del ajuste">
        <Inp type="date" value={fecha} onChange={setFecha}/>
      </Field>
      <div style={{display:"flex",gap:10}}>
        {editId&&<button onClick={limpiar} style={{flex:1,padding:12,borderRadius:10,border:"none",background:"#E8DCC8",fontWeight:600,cursor:"pointer"}}>Cancelar edición</button>}
        <div style={{flex:1}}><Btn onClick={guardar} disabled={busy}>{busy?"Guardando…":editId?"Guardar cambios":"Registrar ajuste"}</Btn></div>
      </div>

      {ajustes&&ajustes.length>0&&(
        <div style={{marginTop:20}}>
          <div style={{fontSize:".72rem",fontWeight:700,letterSpacing:".07em",textTransform:"uppercase",color:"#7B7063",marginBottom:10}}>Historial de ajustes</div>
          {ajustes.map(a=>(
            <div key={a.id} style={{borderBottom:"1px solid #F2EAE0",padding:"10px 0",display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10}}>
              <div>
                <div style={{fontSize:".78rem",color:"#7B7063"}}>{fmtFL(a.fecha)}</div>
                <div style={{fontSize:".82rem",color:"#2C1A0E",margin:"2px 0",fontStyle:"italic"}}>{a.motivo}</div>
                <div style={{fontSize:".72rem",color:"#7B7063"}}>{fmt(a.saldoAntes)} → {fmt(a.saldoDespues)}</div>
              </div>
              <div style={{display:"flex",alignItems:"center",gap:10,flexShrink:0}}>
                <span style={{fontFamily:"Georgia,serif",fontSize:"1.1rem",color:Number(a.monto)>=0?"#2D6A4F":"#C0392B",fontWeight:700}}>{Number(a.monto)>=0?"+":""}{fmt(Math.abs(a.monto))}</span>
                <button onClick={()=>editar(a)} style={{background:"none",border:"none",color:"#2D6A4F",fontSize:".72rem",fontWeight:600,cursor:"pointer"}}>Editar</button>
                <button onClick={()=>eliminar(a.id)} style={{background:"none",border:"none",color:"#C0392B",fontSize:".72rem",fontWeight:600,cursor:"pointer"}}>Eliminar</button>
              </div>
            </div>
          ))}
        </div>
      )}
    </Card>
  );
}

    +".badge{display:inline-block;background:#F2EAE0;padding:3px 10px;border-radius:20px;font-size:.7rem;letter-spacing:.05em;text-transform:uppercase;margin-bottom:16px;}"
    +".foot{font-size:.68rem;color:#999;margin-top:30px;border-top:1px solid #eee;padding-top:10px;}"

    +"<tr><td class=\"tot\">Total descuentos</td><td class=\"tot\" style=\"text-align:right\">-"+fmt(reg.totalDescuentos)+"</td></tr></table>"
    +bonoBox
    +"<div class=\"neto\">NETO A COBRAR: "+fmt(reg.neto)+"</div>"
    +(reg.obs?("<p style=\"font-size:.8rem;color:#7B7063;margin-top:16px;\">"+reg.obs+"</p>"):"")
    +"<div class=\"foot\">Emitido el "+new Date().toLocaleDateString("es-AR")+" · Amapola Interno</div>"

}
function PenalidadesPanel({empleados,penalidades,savePenalidades,mostrarHistorial,periodo,liquidaciones}){
  const empleadosActivos=(empleados||[]).filter(e=>e.estado!=="Inactivo"&&!e.excluirLiquidacion).slice().sort((a,b)=>a.nombre.localeCompare(b.nombre));
  const mesLabel=p=>{const[y,m]=p.split("-");return new Date(Number(y),Number(m)-1,1).toLocaleDateString("es-AR",{month:"long",year:"numeric"});};
  const periodoActual=(()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");})();
  const periodoRef=periodo||periodoActual;
  const[empSel,setEmpSel]=useState(null);
  const[otroTxt,setOtroTxt]=useState("");
  const[fechaInput,setFechaInput]=useState(hoyLocal());
  const[busy,setBusy]=useState(false);
  const[lastAdded,setLastAdded]=useState(null);
  const MOTIVOS=["Celular","Llegada tarde","Salió sin avisar"];

  useEffect(()=>{
    if(!lastAdded)return;
    const t=setTimeout(()=>setLastAdded(null),8000);
    return()=>clearTimeout(t);
  },[lastAdded]);

  const countDe=empId=>(penalidades||[]).filter(p=>p.empleadoId===empId&&p.periodo===periodoRef).length;

  const abrir=empId=>{setEmpSel(empId);setOtroTxt("");setFechaInput(hoyLocal());};
  const cerrar=()=>{setEmpSel(null);setOtroTxt("");setFechaInput(hoyLocal());};

  const periodoDeFechaInput=(fechaInput||hoyLocal()).slice(0,7);
  const liqCerrada=empSel&&(liquidaciones||[]).find(l=>l.empleadoId===empSel&&l.periodo===periodoDeFechaInput&&l.estado==="confirmada");

  const agregar=async(emp,motivo)=>{
    if(!motivo||!motivo.trim())return;
    setBusy(true);
    const fecha=fechaLocalISO(fechaInput);
    const periodoNuevo=periodoDeFechaInput;
    const registro={id:uid(),empleadoId:emp.id,periodo:periodoNuevo,motivo:motivo.trim(),fecha};
    await savePenalidades([registro,...(penalidades||[])]);
    setBusy(false);cerrar();
    setLastAdded({id:registro.id,nombre:emp.nombre});
    toast("X registrada para "+emp.nombre+" ✓");
  };

  const eliminar=async id=>{
    await savePenalidades((penalidades||[]).filter(p=>p.id!==id));
    toast("Eliminada");
  };

  const deshacerUltimo=async()=>{
    if(!lastAdded)return;
    await savePenalidades((penalidades||[]).filter(p=>p.id!==lastAdded.id));
    toast("X deshecha");
    setLastAdded(null);
  };

  const emp=empSel?empleadosActivos.find(x=>x.id===empSel):null;
  const chipBtn={padding:"8px 14px",borderRadius:20,border:"1px solid #E8DCC8",background:"#F9F6F1",cursor:"pointer",fontSize:".8rem",fontFamily:"inherit"};
  const inpFecha={border:"1px solid #E8DCC8",borderRadius:8,padding:"8px 10px",fontSize:".82rem",fontFamily:"inherit",boxSizing:"border-box"};

  return(<>
    <Card title="⚡ Penalidades rápidas — registrar X">
      <p style={{fontSize:".78rem",color:"#7B7063",marginBottom:14}}>Tocá el nombre de un empleado para sumarle una X. El acumulado de {mesLabel(periodoRef)} se usa como punto de partida en "Penalidades X" al liquidar el sueldo (se puede corregir a mano ahí).</p>
      <div style={{display:"flex",flexWrap:"wrap",gap:10}}>
        {empleadosActivos.map(e=>{
          const c=countDe(e.id);
          return(
            <button key={e.id} onClick={()=>abrir(e.id)} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:4,minWidth:104,padding:"14px 10px",borderRadius:12,border:"1px solid #E8DCC8",background:c>0?"#FBEAEA":"#fff",cursor:"pointer",fontFamily:"inherit"}}>
              <span style={{fontWeight:600,fontSize:".85rem",textAlign:"center",color:"#2C1A0E"}}>{e.nombre}</span>
              <span style={{fontSize:"1rem",fontWeight:700,color:c>0?"#C0392B":"#B8A88E"}}>{c>0?(c+" X"):"—"}</span>
            </button>
          );
        })}
      </div>
    </Card>

    {emp&&(
      <div style={{position:"fixed",inset:0,background:"rgba(44,26,14,.45)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:1000,padding:16}} onClick={cerrar}>
        <div style={{background:"#fff",borderRadius:12,padding:20,width:"100%",maxWidth:360}} onClick={ev=>ev.stopPropagation()}>
          <h3 style={{margin:"0 0 4px",fontSize:"1rem",color:"#2C1A0E"}}>Nueva X — {emp.nombre}</h3>
          <p style={{margin:"0 0 12px",fontSize:".78rem",color:"#7B7063"}}>¿Motivo?</p>
          <div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:12}}>
            {MOTIVOS.map(m=>(
              <button key={m} disabled={busy} onClick={()=>agregar(emp,m)} style={chipBtn}>{m}</button>
            ))}
          </div>
          <div style={{display:"flex",gap:8,marginBottom:12}}>
            <input value={otroTxt} onChange={ev=>setOtroTxt(ev.target.value)} placeholder="Otro motivo…" style={{flex:1,border:"1px solid #E8DCC8",borderRadius:8,padding:"8px 10px",fontSize:".82rem",fontFamily:"inherit",boxSizing:"border-box"}}/>
            <SmBtn disabled={busy||!otroTxt.trim()} onClick={()=>agregar(emp,otroTxt)}>Agregar</SmBtn>
          </div>
          <label style={{display:"block",fontSize:".65rem",color:"#7B7063",textTransform:"uppercase",letterSpacing:".04em",marginBottom:4}}>Fecha (por defecto, hoy)</label>
          <input type="date" value={fechaInput} onChange={ev=>setFechaInput(ev.target.value)} style={{...inpFecha,width:"100%"}}/>
          {liqCerrada&&(
            <p style={{fontSize:".72rem",color:"#C0392B",background:"#FBEAEA",border:"1px solid #F3C7C2",borderRadius:8,padding:"8px 10px",marginTop:10}}>⚠️ {mesLabel(periodoDeFechaInput)} ya fue liquidado y confirmado para {emp.nombre}. Esta X va a quedar registrada pero no se va a sumar sola a esa liquidación — hay que ajustarla a mano si hace falta.</p>
          )}
          <button onClick={cerrar} style={{marginTop:16,background:"none",border:"none",color:"#7B7063",fontSize:".78rem",cursor:"pointer",fontFamily:"inherit"}}>Cancelar</button>
        </div>
      </div>
    )}

    {lastAdded&&(
      <div style={{position:"fixed",left:"50%",bottom:20,transform:"translateX(-50%)",background:"#2C1A0E",color:"#fff",borderRadius:30,padding:"10px 18px",display:"flex",alignItems:"center",gap:12,fontSize:".82rem",zIndex:1100,boxShadow:"0 4px 16px rgba(0,0,0,.25)"}}>
        <span>X registrada para {lastAdded.nombre}</span>
        <button onClick={deshacerUltimo} style={{background:"none",border:"none",color:"#F2C94C",fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>Deshacer</button>
      </div>
    )}

    {mostrarHistorial&&(
      <Card title={"Historial de "+mesLabel(periodoRef)}>
        {empleadosActivos.map(e=>{

function HsExtrasPanel({empleados,horasExtras,saveHorasExtras,mostrarHistorial,periodo,liquidaciones}){
  const empleadosActivos=(empleados||[]).filter(e=>e.estado!=="Inactivo"&&!e.excluirLiquidacion).slice().sort((a,b)=>a.nombre.localeCompare(b.nombre));
  const mesLabel=p=>{const[y,m]=p.split("-");return new Date(Number(y),Number(m)-1,1).toLocaleDateString("es-AR",{month:"long",year:"numeric"});};
  const periodoActual=(()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");})();
  const periodoRef=periodo||periodoActual;
  const[empSel,setEmpSel]=useState(null);
  const[horasInput,setHorasInput]=useState("");
  const[obsInput,setObsInput]=useState("");
  const[fechaInput,setFechaInput]=useState(hoyLocal());
  const[busy,setBusy]=useState(false);
  const[lastAdded,setLastAdded]=useState(null);

  useEffect(()=>{
    if(!lastAdded)return;
    const t=setTimeout(()=>setLastAdded(null),8000);
    return()=>clearTimeout(t);
  },[lastAdded]);

  const totalDe=empId=>(horasExtras||[]).filter(h=>h.empleadoId===empId&&h.periodo===periodoRef).reduce((s,h)=>s+Number(h.horas||0),0);

  const abrir=empId=>{setEmpSel(empId);setHorasInput("");setObsInput("");setFechaInput(hoyLocal());};
  const cerrar=()=>{setEmpSel(null);setHorasInput("");setObsInput("");setFechaInput(hoyLocal());};

  const periodoDeFechaInput=(fechaInput||hoyLocal()).slice(0,7);
  const liqCerrada=empSel&&(liquidaciones||[]).find(l=>l.empleadoId===empSel&&l.periodo===periodoDeFechaInput&&l.estado==="confirmada");

  const agregar=async emp=>{
    const h=Number(horasInput);
    if(!horasInput||!(h>0)){toast("Cargá la cantidad de horas");return;}
    setBusy(true);
    const fecha=fechaLocalISO(fechaInput);
    const registro={id:uid(),empleadoId:emp.id,periodo:periodoDeFechaInput,horas:h,obs:obsInput.trim(),fecha};
    await saveHorasExtras([registro,...(horasExtras||[])]);
    setBusy(false);cerrar();
    setLastAdded({id:registro.id,nombre:emp.nombre,horas:h});
    toast(h+" hs registradas para "+emp.nombre+" ✓");
  };

  const eliminar=async id=>{
    await saveHorasExtras((horasExtras||[]).filter(h=>h.id!==id));
    toast("Eliminada");
  };

  const deshacerUltimo=async()=>{
    if(!lastAdded)return;
    await saveHorasExtras((horasExtras||[]).filter(h=>h.id!==lastAdded.id));
    toast("Registro deshecho");
    setLastAdded(null);
  };

  const emp=empSel?empleadosActivos.find(x=>x.id===empSel):null;
  const inpFecha={border:"1px solid #E8DCC8",borderRadius:8,padding:"8px 10px",fontSize:".82rem",fontFamily:"inherit",boxSizing:"border-box"};

  return(<>
    <Card title="⏱️ HS Extras rápidas — cargar horas">
      <p style={{fontSize:".78rem",color:"#7B7063",marginBottom:14}}>Tocá el nombre de un empleado para cargarle las horas extra que hizo. El acumulado de {mesLabel(periodoRef)} se usa como cantidad de horas extra al liquidar el sueldo (se puede corregir a mano ahí).</p>
      <div style={{display:"flex",flexWrap:"wrap",gap:10}}>
        {empleadosActivos.map(e=>{
          const t=totalDe(e.id);
          return(
            <button key={e.id} onClick={()=>abrir(e.id)} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:4,minWidth:104,padding:"14px 10px",borderRadius:12,border:"1px solid #E8DCC8",background:t>0?"#EAF3EC":"#fff",cursor:"pointer",fontFamily:"inherit"}}>
              <span style={{fontWeight:600,fontSize:".85rem",textAlign:"center",color:"#2C1A0E"}}>{e.nombre}</span>
              <span style={{fontSize:"1rem",fontWeight:700,color:t>0?"#2D6A4F":"#B8A88E"}}>{t>0?(t+" hs"):"—"}</span>
            </button>
          );
        })}
      </div>
    </Card>

    {emp&&(
      <div style={{position:"fixed",inset:0,background:"rgba(44,26,14,.45)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:1000,padding:16}} onClick={cerrar}>
        <div style={{background:"#fff",borderRadius:12,padding:20,width:"100%",maxWidth:360}} onClick={ev=>ev.stopPropagation()}>
          <h3 style={{margin:"0 0 4px",fontSize:"1rem",color:"#2C1A0E"}}>Nuevas horas extra — {emp.nombre}</h3>
          <p style={{margin:"0 0 12px",fontSize:".78rem",color:"#7B7063"}}>¿Cuántas horas?</p>
          <input type="number" min="0" step="0.5" value={horasInput} onChange={ev=>setHorasInput(ev.target.value)} placeholder="Ej: 3" autoFocus style={{width:"100%",border:"1px solid #E8DCC8",borderRadius:8,padding:"8px 10px",fontSize:".82rem",fontFamily:"inherit",boxSizing:"border-box",marginBottom:12}}/>
          <input value={obsInput} onChange={ev=>setObsInput(ev.target.value)} placeholder="Nota (opcional)" style={{width:"100%",border:"1px solid #E8DCC8",borderRadius:8,padding:"8px 10px",fontSize:".82rem",fontFamily:"inherit",boxSizing:"border-box",marginBottom:12}}/>
          <label style={{display:"block",fontSize:".65rem",color:"#7B7063",textTransform:"uppercase",letterSpacing:".04em",marginBottom:4}}>Fecha (por defecto, hoy)</label>
          <input type="date" value={fechaInput} onChange={ev=>setFechaInput(ev.target.value)} style={{...inpFecha,width:"100%"}}/>
          {liqCerrada&&(
            <p style={{fontSize:".72rem",color:"#C0392B",background:"#FBEAEA",border:"1px solid #F3C7C2",borderRadius:8,padding:"8px 10px",marginTop:10}}>⚠️ {mesLabel(periodoDeFechaInput)} ya fue liquidado y confirmado para {emp.nombre}. Estas horas van a quedar registradas pero no se van a sumar solas a esa liquidación — hay que ajustarlas a mano si hace falta.</p>
          )}
          <div style={{display:"flex",gap:8,marginTop:14}}>
            <button onClick={cerrar} style={{flex:1,padding:10,borderRadius:8,border:"1px solid #E8DCC8",background:"#fff",color:"#7B7063",fontSize:".8rem",cursor:"pointer",fontFamily:"inherit"}}>Cancelar</button>
            <SmBtn disabled={busy} onClick={()=>agregar(emp)}>Agregar</SmBtn>
          </div>
        </div>
      </div>
    )}

    {lastAdded&&(
      <div style={{position:"fixed",left:"50%",bottom:20,transform:"translateX(-50%)",background:"#2C1A0E",color:"#fff",borderRadius:30,padding:"10px 18px",display:"flex",alignItems:"center",gap:12,fontSize:".82rem",zIndex:1100,boxShadow:"0 4px 16px rgba(0,0,0,.25)"}}>
        <span>{lastAdded.horas} hs registradas para {lastAdded.nombre}</span>
        <button onClick={deshacerUltimo} style={{background:"none",border:"none",color:"#F2C94C",fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>Deshacer</button>
      </div>
    )}

    {mostrarHistorial&&(
      <Card title={"Historial de "+mesLabel(periodoRef)}>
        {empleadosActivos.map(e=>{
          const log=(horasExtras||[]).filter(h=>h.empleadoId===e.id&&h.periodo===periodoRef).slice().sort((a,b)=>new Date(b.fecha)-new Date(a.fecha));
          if(log.length===0)return null;
          const total=log.reduce((s,h)=>s+Number(h.horas||0),0);
          return(
            <div key={e.id} style={{marginBottom:14}}>
              <div style={{display:"flex",justifyContent:"space-between",fontWeight:600,fontSize:".82rem",color:"#2C1A0E",marginBottom:4}}>
                <span>{e.nombre}</span><span>{total} hs</span>
              </div>
              {log.map(h=>(
                <div key={h.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",fontSize:".76rem",color:"#7B7063",padding:"4px 0",borderBottom:"1px solid #F2EAE0"}}>
                  <span>{h.horas} hs · {new Date(h.fecha).toLocaleDateString("es-AR")}{h.obs?(" · "+h.obs):""}</span>
                  <button onClick={()=>eliminar(h.id)} style={{background:"none",border:"none",color:"#C0392B",cursor:"pointer",fontSize:".76rem",fontFamily:"inherit"}}>eliminar</button>
                </div>
              ))}
            </div>
          );
        })}
        {(horasExtras||[]).filter(h=>h.periodo===periodoRef).length===0&&<Empty icon="✅">Sin horas extra cargadas en {mesLabel(periodoRef)}.</Empty>}
      </Card>
    )}
  </>);
}
function TabAmex({amexCuotas,saveAmexCuotas,proveedores,pagos,cajaDigitalSaldo,saveCajaDigitalSaldo,cajaDigitalAjustes,saveCajaDigitalAjustes,calcDigital}){
  const[showForm,setShowForm]=useState(false);
  const[editId,setEditId]=useState(null);
  const[descripcion,setDescripcion]=useState("");
  const[proveedor,setProveedor]=useState("");
  const[montoTotal,setMontoTotal]=useState("");
  const[montoRecibido,setMontoRecibido]=useState("");
  const[cantidadCuotas,setCantidadCuotas]=useState("");
  const[fechaCompra,setFechaCompra]=useState(hoyLocal());
  const[obs,setObs]=useState("");
  const[recurrente,setRecurrente]=useState(false);
  const[esPrestamo,setEsPrestamo]=useState(false);
  const[verFinalizadas,setVerFinalizadas]=useState(false);
  const[mesExpandido,setMesExpandido]=useState(null);
  const[cantMeses,setCantMeses]=useState(6);

  const mesesEntre=(desde,hasta)=>{
    const[y1,m1]=String(desde).slice(0,7).split("-").map(Number);
    const[y2,m2]=String(hasta).slice(0,7).split("-").map(Number);
    return(y2-y1)*12+(m2-m1);
  };
  const numCuota=c=>Math.max(1,mesesEntre(c.fechaCuota1||c.fechaCompra,hoyLocal())+1);
  const finalizada=c=>c.recurrente?false:numCuota(c)>Number(c.cantidadCuotas);
  const cuotaActual=c=>Math.min(numCuota(c),Number(c.cantidadCuotas));
  const restantes=c=>Math.max(0,Number(c.cantidadCuotas)-numCuota(c)+1);
  const montoCuota=c=>c.recurrente?Number(c.montoTotal||0):Number(c.montoTotal||0)/Number(c.cantidadCuotas||1);

  const lista=(amexCuotas||[]).slice().sort((a,b)=>new Date(b.fechaCompra)-new Date(a.fechaCompra));
  const activas=lista.filter(c=>!finalizada(c));
  const finalizadas=lista.filter(c=>finalizada(c));

  // Proyección: cuánto corresponde pagar cada uno de los próximos meses, según las cuotas vigentes en cada uno
  const mesLabelCorto=m=>{const[y,mm]=m.split("-");return new Date(Number(y),Number(mm)-1,1).toLocaleDateString("es-AR",{month:"long",year:"numeric"});};
  const nCuotaEnMes=(c,mes)=>mesesEntre(c.fechaCuota1||c.fechaCompra,mes+"-01")+1;
  const activaEnMes=(c,mes)=>{
    const n=nCuotaEnMes(c,mes);
    return c.recurrente?n>=1:(n>=1&&n<=Number(c.cantidadCuotas));
  };
  const mesesFuturos=(()=>{
    const hoy=new Date();
    const arr=[];
    for(let i=0;i<cantMeses;i++){
      const d=new Date(hoy.getFullYear(),hoy.getMonth()+i,1);
      arr.push(d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"));
    }
    return arr;
  })();
  const proyeccion=mesesFuturos.map(mes=>{
    const items=(amexCuotas||[]).filter(c=>activaEnMes(c,mes));
    const total=items.reduce((s,c)=>s+montoCuota(c),0);
    return{mes,total,items};
  });

  const limpiar=()=>{setEditId(null);setDescripcion("");setProveedor("");setMontoTotal("");setMontoRecibido("");setCantidadCuotas("");setFechaCompra(hoyLocal());setObs("");setRecurrente(false);setEsPrestamo(false);};
  const abrirNuevo=()=>{limpiar();setShowForm(true);};
  const abrirNuevoPrestamo=()=>{limpiar();setEsPrestamo(true);setDescripcion("Préstamo Amex");setShowForm(true);};
  const abrirEditar=c=>{
    setEditId(c.id);setDescripcion(c.descripcion);setProveedor(c.proveedor||"");
    setMontoTotal(String(c.montoTotal));setCantidadCuotas(c.recurrente?"":String(c.cantidadCuotas));
    setMontoRecibido(c.esPrestamo?String(c.montoRecibido!=null?c.montoRecibido:c.montoTotal):"");
    setFechaCompra(c.fechaCompra);setObs(c.obs||"");setRecurrente(!!c.recurrente);setEsPrestamo(!!c.esPrestamo);setShowForm(true);
  };
  const cerrar=()=>{setShowForm(false);limpiar();};

  // Un préstamo de Amex es plata que ENTRA a Caja Digital (a diferencia de una compra, que solo genera
  // deuda/cuotas sin mover caja). Al crearlo (no al editar, para no sumarlo dos veces) se suma el monto
  // al saldo real de Caja Digital, con el mismo mecanismo que "Actualizar saldo real" — así queda
  // reflejado en el banco Y con el seguimiento de cuotas para saber qué falta devolver.
  const guardar=async()=>{
    if(!descripcion.trim()){toast(esPrestamo?"Falta la descripción del préstamo":"Falta la descripción");return;}
    const mt=Number(montoTotal);
    if(!(mt>0)){toast(esPrestamo?"Monto a devolver inválido":recurrente?"Monto mensual inválido":"Monto total inválido");return;}
    const mr=esPrestamo?Number(montoRecibido):mt;
    if(esPrestamo&&!(mr>0)){toast("Monto recibido inválido");return;}
    const cc=recurrente?1:Number(cantidadCuotas);
    if(!recurrente&&!(cc>0)){toast("Cantidad de cuotas inválida");return;}
    const base={descripcion:descripcion.trim(),proveedor:esPrestamo?"":proveedor.trim(),montoTotal:mt,montoRecibido:esPrestamo?mr:undefined,cantidadCuotas:cc,fechaCompra,obs:obs.trim(),recurrente,esPrestamo};
    if(!editId)base.fechaCuota1=fechaCompra;// nuevo registro: cuota 1 arranca el mismo mes de la compra por defecto
    if(editId){
      const nuevas=(amexCuotas||[]).map(c=>c.id===editId?{...c,...base}:c);
      await saveAmexCuotas(nuevas);
      toast(esPrestamo?"Préstamo actualizado (el saldo de Caja Digital no se vuelve a tocar)":"Compra actualizada");
    }else{
      const registro={id:uid(),...base};
      await saveAmexCuotas([registro,...(amexCuotas||[])]);
      if(esPrestamo&&saveCajaDigitalSaldo&&saveCajaDigitalAjustes){
        // saldoAnterior se toma del saldoReal EN VIVO (calcDigital), no del cajaDigitalSaldo guardado a secas —
        // así no se pierden los cierres/pagos por transferencia que ya se hayan acumulado desde el último ajuste.
        const saldoAnterior=calcDigital?Number(calcDigital().saldoReal)||0:Number(cajaDigitalSaldo)||0;
        const saldoNuevo=saldoAnterior+mr;
        await saveCajaDigitalSaldo(saldoNuevo);
        // fecha = momento real en que se aplicó el ajuste (para que el corte de calcDigital sea correcto).
        // fechaMovimiento = fecha que elegiste como "Fecha del préstamo" — es la que se muestra en el Libro diario.
        await saveCajaDigitalAjustes([{id:uid(),fecha:new Date().toISOString(),fechaMovimiento:fechaLocalISO(fechaCompra),saldoAnterior,saldoNuevo,diferencia:mr,nota:"Préstamo Amex: "+descripcion.trim()+" (recibido "+fmt(mr)+", a devolver "+fmt(mt)+")",tipo:"prestamo"},...(cajaDigitalAjustes||[])]);
        toast("Préstamo registrado ✓ · "+fmt(mr)+" sumado a Caja Digital");
      }else{
        toast("Compra registrada");
      }
    }
    cerrar();
  };

  const eliminar=async id=>{
    const item=(amexCuotas||[]).find(c=>c.id===id);
    const msg=item&&item.esPrestamo
      ?"¿Eliminar este préstamo? Esto NO resta el monto de Caja Digital (esa plata ya está contada ahí) — solo borra el seguimiento de cuotas."
      :"¿Eliminar esta compra en cuotas?";
    if(!confirm(msg))return;
    await saveAmexCuotas((amexCuotas||[]).filter(c=>c.id!==id));
    toast("Eliminada");
  };

  const nombresProv=(proveedores||[]).map(p=>p.nombre).slice().sort();
  const thS={padding:"7px 8px",fontWeight:700,color:"#7B7063",fontSize:".63rem",letterSpacing:".05em",textTransform:"uppercase",borderBottom:"2px solid #E8DCC8",textAlign:"left"};
  const tdS={padding:"7px 8px"};

  const hoyD=new Date();
  const amexMes=(pagos||[]).filter(p=>{
    if(p.forma!=="Amex")return false;
    const d=new Date(p.fecha);
    return d.getMonth()===hoyD.getMonth()&&d.getFullYear()===hoyD.getFullYear();
  }).reduce((s,p)=>s+Number(p.monto||0),0);

  return(
    <div style={{padding:"20px 0"}}>
      <ST help={"Compras pagadas con Amex en cuotas, y préstamos que dio la tarjeta — no hace falta que estén ligadas a un proveedor de Boletas, pueden ser compras sueltas (equipamiento, insumos grandes, etc.).\n\n• Arriba de todo está 'Próximos meses': te muestra cuánto vas a tener que pagar cada uno de los próximos 3/6/12 meses, sumando todas las cuotas, préstamos y débitos recurrentes vigentes en cada mes. Tocá un mes para ver el detalle.\n• '+ Registrar compra': cargá la descripción, monto total, cantidad de cuotas y la fecha real de compra.\n• '🏦 Registrar préstamo': para cuando Amex te da un préstamo en efectivo (no una compra). Acá hay DOS montos separados porque Amex suele descontar intereses: 'Monto recibido' es la plata que efectivamente te depositaron, y es la ÚNICA que se suma — SOLO en ese momento, al guardar — al saldo real de Caja Digital (mismo efecto que 'Actualizar saldo real' en esa pantalla). 'Monto a devolver' puede ser mayor (incluye intereses) y es el que se usa para calcular las cuotas del resumen de Amex — ese seguimiento de cuotas no vuelve a tocar Caja Digital solo. Ej: te depositan $3.500.000 pero terminás devolviendo $3.744.650 en cuotas — cargás recibido 3.500.000 y a devolver 3.744.650. Editar un préstamo después no vuelve a sumar nada a Caja Digital; eliminarlo tampoco resta — esa plata ya quedó contada en el banco, borrar solo saca el seguimiento de cuotas. Los préstamos se marcan con la etiqueta 🏦 PRÉSTAMO en las tablas para no confundirlos con compras reales, y en la lista se ve el monto recibido debajo de la descripción. La fila que aparece en el Libro diario de Caja Digital usa la 'Fecha del préstamo' que elegiste acá (no el día que lo cargaste en la app), así que si lo cargás unos días tarde podés poner la fecha real en que Amex te lo depositó.\n• La 'cuota actual' se calcula sola según los meses que pasaron desde la fecha de compra/préstamo — no depende de si ya pagaste o no el resumen de Amex. Por defecto asume que la 1ra cuota se factura el mismo mes; si tu caso es distinto, avisame para ajustar ese registro puntual.\n• El resumen mensual de Amex seguís cargándolo a mano como Gasto (categoría Amex) igual que siempre — esta pantalla es solo para ver qué compras/préstamos están vigentes y cuánto corresponde ese mes.\n• Un registro sigue apareciendo como activo mes a mes hasta agotar sus cuotas, aunque ya hayas pagado el resumen de ese mes. Cuando se agotan, pasa solo a 'Finalizadas'.\n• Si tildás 'Débito recurrente' (solo para compras), no se le pone cantidad de cuotas — se asume que se repite todos los meses sin fecha de fin (ej. un seguro o un servicio), hasta que lo elimines a mano."}>💳 Amex — compras en cuotas</ST>
      <SS>Compras pagadas con Amex en cuotas, ligadas o no a un proveedor.</SS>

      {amexMes>0&&(
        <div style={{background:"#FEF9E7",border:"1px solid #F5D98B",borderRadius:14,padding:"14px 20px",marginBottom:16}}>
          <div style={{fontSize:".65rem",letterSpacing:".08em",textTransform:"uppercase",color:"#B7860B"}}>💳 Cargado a Amex este mes</div>
          <div style={{fontFamily:"Georgia,serif",fontSize:"1.4rem",color:"#7B5E00",margin:"4px 0 0"}}>{fmt(amexMes)}</div>
          <div style={{fontSize:".68rem",color:"#B7860B",opacity:.85}}>No se descuenta de Caja Disponible ni Caja Digital hasta que pagués el resumen de la tarjeta.</div>
        </div>
      )}

      <Card title="Próximos meses — cuánto corresponde pagar">
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
          <div style={{display:"flex",gap:6}}>
            {[3,6,12].map(n=>(
              <button key={n} onClick={()=>setCantMeses(n)} style={{padding:"5px 12px",borderRadius:20,border:"1px solid "+(cantMeses===n?"#2C1A0E":"#E8DCC8"),background:cantMeses===n?"#2C1A0E":"#fff",color:cantMeses===n?"#fff":"#7B7063",fontSize:".72rem",fontWeight:600,cursor:"pointer"}}>{n} meses</button>
            ))}
          </div>
          <div style={{display:"flex",gap:6}}>
            <SmBtn onClick={abrirNuevo}>+ Registrar compra</SmBtn>
            <SmBtn onClick={abrirNuevoPrestamo}>🏦 Registrar préstamo</SmBtn>
          </div>
        </div>
        <div style={{overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:".8rem"}}>
            <tbody>

}
function ManualLiquidacionModal({onClose}){
  const Sec=({title,children})=>(
    <div style={{marginBottom:18}}>
      <h4 style={{fontFamily:"Georgia,serif",fontSize:"1rem",color:"#2C1A0E",margin:"0 0 6px"}}>{title}</h4>
      <div style={{fontSize:".82rem",color:"#4A3B2C",lineHeight:1.65}}>{children}</div>
    </div>
  );
  return(
    <div style={{position:"fixed",inset:0,background:"rgba(44,26,14,.55)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:16}} onClick={onClose}>
      <div style={{background:"#fff",borderRadius:16,padding:"24px 22px",width:"100%",maxWidth:640,maxHeight:"88vh",overflowY:"auto"}} onClick={e=>e.stopPropagation()}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18}}>
