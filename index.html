              </select>
              <button onClick={()=>setNuevoRegModal(true)} title="Agregar persona" style={{padding:"10px 14px",border:"1.5px solid #E8DCC8",borderRadius:8,background:"#F9F6F1",fontSize:"1.1rem",cursor:"pointer",flexShrink:0}}>+</button>
            </div>
          </Field>
          <Field label="Monto ($)"><Inp type="number" value={monto} onChange={setMonto} placeholder="0"/></Field>
          <Field label="Forma de pago">
            <select value={forma} onChange={e=>setForma(e.target.value)} style={sS}>
              <option value="Efectivo">Efectivo (descuenta de caja)</option>
              <option value="Transferencia">Transferencia (no descuenta caja)</option>
              <option value="Amex">Amex</option>
            </select>
          </Field>
          {forma==="Efectivo"&&<div style={{fontSize:".78rem",color:"#2D6A4F",background:"#EAF5F0",borderRadius:8,padding:"8px 10px",marginTop:8}}>💵 Este pago descontará de la caja disponible.</div>}
          {forma==="Amex"&&<div style={{fontSize:".78rem",color:"#B7860B",background:"#FEF9E7",borderRadius:8,padding:"8px 10px",marginTop:8}}>💳 No descuenta caja ni banco — queda cargado al resumen de la tarjeta.</div>}
          <Field label="Observaciones"><TA value={obs} onChange={setObs} placeholder="Ej: pago parcial, boleta #..."/></Field>
          <Field label="Fecha del registro"><Inp type="date" value={fecha} onChange={setFecha}/></Field>

          {/* MERCADERÍA DESCARGADA (opcional) */}
          <div style={{marginTop:16,borderTop:"1px solid #F2EAE0",paddingTop:16}}>
            <div style={{fontSize:".78rem",fontWeight:700,color:"#2C1A0E",marginBottom:10}}>📦 Mercadería descargada <span style={{fontWeight:400,color:"#7B7063"}}>(opcional — suma al stock automáticamente)</span></div>
            <div style={{display:"flex",gap:6,alignItems:"flex-end",marginBottom:10}}>
              <div style={{flex:1}}>
                <select value={lineaProdId} onChange={e=>setLineaProdId(e.target.value)} style={{...sS,fontSize:".78rem"}}>
                  <option value="">— Producto —</option>
                  {productosSugeridos.length>0&&<optgroup label={`✓ De ${prov}`}>{productosSugeridos.map(c=><option key={c.id} value={c.id}>{c.producto}</option>)}</optgroup>}
                  {productosResto.length>0&&<optgroup label="Otros productos">{productosResto.map(c=><option key={c.id} value={c.id}>{c.producto} ({c.proveedor})</option>)}</optgroup>}
                </select>
              </div>
              <div style={{width:72}}>
                <input type="number" min="0" value={lineaCant} onChange={e=>setLineaCant(e.target.value)} placeholder="Cant." style={{...iS,fontSize:".82rem",textAlign:"center"}}/>
              </div>
              <button onClick={agregarLinea} style={{padding:"10px 12px",border:"none",borderRadius:8,background:"#2C1A0E",color:"#fff",fontWeight:700,fontSize:"1rem",cursor:"pointer",flexShrink:0}}>+</button>
            </div>
            {lineas.length>0&&(
              <div style={{background:"#F9F6F1",borderRadius:10,overflow:"hidden"}}>
                {lineas.map(l=>(
                  <div key={l.catalogoId} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 12px",borderBottom:"1px solid #F2EAE0"}}>
                    <span style={{flex:1,fontSize:".82rem",color:"#2C1A0E"}}>{l.nombre}</span>
                    <span style={{fontSize:".82rem",fontWeight:700,color:"#2D6A4F"}}>{l.cantidad} {l.unidad}</span>
                    <button onClick={()=>quitarLinea(l.catalogoId)} style={{background:"none",border:"none",color:"#C0392B",fontSize:".8rem",cursor:"pointer",padding:"0 4px"}}>✕</button>
                  </div>
                ))}
                <div style={{padding:"8px 12px",fontSize:".72rem",color:"#7B7063"}}>
                  {lineas.length} producto{lineas.length!==1?"s":""} · suman al stock al guardar
                </div>
              </div>
            )}
          </div>

          <Btn bg="#B7860B" onClick={async()=>{if(await guardar())setNuevoPagoModal(false);}} disabled={busy}>{busy?"Guardando…":"Registrar pago"}</Btn>
        </div>
      </div>
    )}

    {/* REGISTRO DE PAGOS */}
    <UltimosPagos pagos={pagos} cierres={cierres} cajaInicial={cajaInicial} cierresCaja={cierresCaja} sueldos={sueldos} gastos={gastos} ajustesCajaEfectivo={ajustesCajaEfectivo}/>
  </>);
}


function UltimosPagos({pagos,cierres,cajaInicial,cierresCaja,sueldos,gastos,ajustesCajaEfectivo}){
  const hoy=new Date();
  const iso=d=>d.toISOString().slice(0,10);
  const inicioMes=new Date(hoy.getFullYear(),hoy.getMonth(),1);
  const[filtroFecha,setFiltroFecha]=useState("mes");
  const[desde,setDesde]=useState(iso(inicioMes));
  const[hasta,setHasta]=useState(iso(hoy));
  const[filtroTipo,setFiltroTipo]=useState("todos");

  // Todos los pagos en efectivo
  const pagosEf    = (pagos||[]).filter(p=>p.forma==="Efectivo");
  const sueldosEf  = (sueldos||[]).filter(s=>s.forma==="Efectivo");
  const gastosEf   = (gastos||[]).filter(g=>g.forma==="Efectivo");
  const cierresEf  = (cierres||[]).map(c=>({...c,_cat:"cierre",_signo:1,proveedor:"Cierre "+c.turno}));
  const cierresNEf = (cierresCaja||[]).map(c=>({...c,_cat:"cierre",_signo:1,proveedor:"Cierre "+c.turno,monto:c.efectivo}));
  // Ajustes manuales de caja (ver Admin > Ajuste de caja disponible). Sin esto, el saldo de este libro
  // diario quedaba desincronizado del número de "Caja Disponible" (que sí los suma en calcSaldo()).
  const ajustesEf  = (ajustesCajaEfectivo||[]).map(a=>({...a,_cat:"ajuste",_signo:Number(a.monto||0)>=0?1:-1,proveedor:"Ajuste de caja",obs:a.motivo,monto:Math.abs(Number(a.monto||0))}));
  // Pagos a proveedores hechos por Transferencia (digital): solo para visualizar acá mezclados con el
  // resto — NO son movimientos de efectivo, así que _signo:0 hace que no sumen a Debe/Haber ni al saldo
  // corrido de este libro (que es 100% de Caja Disponible en efectivo).
  const pagosDig   = (pagos||[]).filter(p=>p.forma==="Transferencia").map(p=>({...p,_cat:"pagoDigital",_signo:0}));

  const egresos = [
    ...pagosEf.map(p=>({...p,_cat:"pago",  _signo:-1})),
    ...sueldosEf.map(s=>({...s,_cat:"sueldo",_signo:-1})),
    ...gastosEf.map(g=>({...g,_cat:"gasto", _signo:-1,proveedor:g.categoria})),
  ];
  const ingresos = [...cierresEf,...cierresNEf].map(c=>({...c,_signo:1}));
  const allMovs  = [...egresos,...ingresos,...ajustesEf,...pagosDig].sort((a,b)=>a.fecha.localeCompare(b.fecha));

  // Aplicar filtro de fechas
  const desdeF = filtroFecha==="mes" ? iso(inicioMes) : filtroFecha==="hoy" ? iso(hoy) : desde;
  const hastaF = filtroFecha==="mes" ? iso(hoy)       : filtroFecha==="hoy" ? iso(hoy) : hasta;
  const filtrados = allMovs.filter(m=>{
    const f=m.fecha.slice(0,10);
    return(!desdeF||f>=desdeF)&&(!hastaF||f<=hastaF);
  });

  // Saldo base = cajaInicial + todo lo anterior al filtro
  let saldoBase = Number(cajaInicial)||0;
  allMovs.filter(m=>!desdeF||m.fecha.slice(0,10)<desdeF).forEach(m=>{
    saldoBase += m._signo * Number(m.monto||0);
  });

  // Filas con saldo acumulado (calculado asc, mostrado desc)
  const filtradosAsc = [...filtrados].sort((a,b)=>a.fecha.localeCompare(b.fecha));
  let saldoAcum = saldoBase;
  const filasAsc = filtradosAsc.map(m=>{
    const delta = m._signo * Number(m.monto||0);
    saldoAcum += delta;
    return {...m,_delta:delta,_saldo:saldoAcum};
  });
  const filas = [...filasAsc].reverse().filter(f=>{
    if(filtroTipo==="debe") return f._signo<0&&f._cat!=="ajuste"&&f._cat!=="pagoDigital";
    if(filtroTipo==="haber") return f._signo>0&&f._cat!=="ajuste"&&f._cat!=="pagoDigital";
    return true;
  });

  // Los ajustes de caja no son ingresos ni egresos reales (no hubo una venta ni un pago) — son una
  // corrección del saldo contado. Se muestran aparte, no suman a Ingresos/Egresos ni aparecen en Debe/Haber.
  const totalIngresos = filasAsc.filter(f=>f._signo>0&&f._cat!=="ajuste").reduce((s,f)=>s+f._delta,0);
  const totalEgresos  = filasAsc.filter(f=>f._signo<0&&f._cat!=="ajuste").reduce((s,f)=>s+Math.abs(f._delta),0);
  const totalAjustes  = filasAsc.filter(f=>f._cat==="ajuste").reduce((s,f)=>s+f._delta,0);
  const neto = totalIngresos - totalEgresos + totalAjustes;
  const iconoCat = c=>c==="cierre"?"💵":c==="sueldo"?"👤":c==="gasto"?"🏠":c==="ajuste"?"⚖️":c==="pagoDigital"?"🏦":"💸";

  return(
    <div style={{background:"#fff",borderRadius:14,padding:20,boxShadow:"0 2px 12px rgba(44,26,14,.08)",marginTop:16}}>
      <div style={{fontSize:".68rem",fontWeight:700,letterSpacing:".09em",textTransform:"uppercase",color:"#7B7063",marginBottom:14}}>📒 Libro diario · Efectivo</div>

      {/* FILTROS FECHA */}
      <div style={{display:"flex",gap:6,marginBottom:10,flexWrap:"wrap"}}>
        {[["hoy","Hoy"],["mes","Este mes"],["custom","Personalizado"]].map(([v,l])=>(
          <button key={v} onClick={()=>{setFiltroFecha(v);if(v==="mes"){setDesde(iso(inicioMes));setHasta(iso(hoy));}if(v==="hoy"){setDesde(iso(hoy));setHasta(iso(hoy));}}} style={{padding:"5px 12px",borderRadius:20,border:"none",cursor:"pointer",fontSize:".72rem",fontWeight:600,background:filtroFecha===v?"#2C1A0E":"#E8DCC8",color:filtroFecha===v?"#E8DCC8":"#2C1A0E"}}>{l}</button>
        ))}
      </div>
      {filtroFecha==="custom"&&(
        <div style={{display:"flex",gap:8,marginBottom:10}}>
          <div style={{flex:1}}>
            <label style={{display:"block",fontSize:".7rem",fontWeight:600,color:"#7B7063",marginBottom:3}}>Desde</label>
            <input type="date" value={desde} onChange={e=>setDesde(e.target.value)} style={{...iS,fontSize:".82rem",padding:"7px 10px"}}/>
          </div>
          <div style={{flex:1}}>
            <label style={{display:"block",fontSize:".7rem",fontWeight:600,color:"#7B7063",marginBottom:3}}>Hasta</label>
            <input type="date" value={hasta} onChange={e=>setHasta(e.target.value)} style={{...iS,fontSize:".82rem",padding:"7px 10px"}}/>
          </div>
        </div>
      )}

      {/* FILTROS TIPO */}
      <div style={{display:"flex",gap:6,marginBottom:14}}>
        {[["todos","Todos"],["debe","💸 Solo Debe"],["haber","💵 Solo Haber"]].map(([v,l])=>(
          <button key={v} onClick={()=>setFiltroTipo(v)} style={{flex:1,padding:"5px 8px",borderRadius:20,border:"none",cursor:"pointer",fontSize:".72rem",fontWeight:600,
            background:filtroTipo===v?(v==="debe"?"#C0392B":v==="haber"?"#2D6A4F":"#2C1A0E"):"#E8DCC8",
            color:filtroTipo===v?"#fff":"#2C1A0E"}}>{l}</button>
        ))}
      </div>



      {/* TABLA */}
      {!filas.length?<Empty icon="📒">Sin movimientos en efectivo en el período</Empty>:(
        <div style={{overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:".75rem",minWidth:380}}>
            <thead>
              <tr style={{background:"#F9F6F1"}}>
                {["Fecha","Concepto","Debe","Haber","Saldo"].map(h=>(
                  <th key={h} style={{padding:"7px 8px",textAlign:h==="Fecha"||h==="Concepto"?"left":"right",fontWeight:700,color:"#7B7063",fontSize:".63rem",letterSpacing:".05em",textTransform:"uppercase",borderBottom:"2px solid #E8DCC8",whiteSpace:"nowrap"}}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>

              {filas.map((f,i)=>(
                <tr key={f.id+i} style={{background:i%2===0?"#fff":"#F9F6F1"}}>
                  <td style={{padding:"6px 8px",whiteSpace:"nowrap",color:"#7B7063",fontSize:".72rem"}}>
                    {fmtF(f.fecha)}<br/><span style={{fontSize:".62rem"}}>{fmtH(f.fecha)}</span>
                  </td>
                  <td style={{padding:"6px 8px"}}>
                    <div style={{display:"flex",alignItems:"center",gap:5}}>
                      <span style={{flexShrink:0}}>{iconoCat(f._cat)}</span>
                      <div style={{minWidth:0}}>
                        <div style={{fontWeight:600,fontSize:".76rem",lineHeight:1.3}}>{f.proveedor||"—"}</div>
                        {f._cat==="ajuste"?(
                          <div style={{fontSize:".63rem",color:f._signo>0?"#2D6A4F":"#C0392B",fontWeight:700}}>{f._signo>0?"+":"-"}{fmt(Math.abs(f._delta))} · corrección de saldo{f.obs?" · "+f.obs:""}</div>
                        ):f._cat==="pagoDigital"?(
                          <div style={{fontSize:".63rem",color:"#B7860B",fontWeight:700}}>🏦 {fmt(f.monto)} por transferencia · no afecta el efectivo{f.obs?" · "+f.obs:""}</div>
                        ):(f.obs&&<div style={{fontSize:".63rem",color:"#7B7063",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",maxWidth:100}}>{f.obs}</div>)}
                      </div>
                    </div>
                  </td>
                  <td style={{padding:"6px 8px",textAlign:"right",color:"#C0392B",fontWeight:700,whiteSpace:"nowrap"}}>
                    {f._cat!=="ajuste"&&f._signo<0?fmt(Math.abs(f._delta)):""}
                  </td>
                  <td style={{padding:"6px 8px",textAlign:"right",color:"#2D6A4F",fontWeight:700,whiteSpace:"nowrap"}}>
                    {f._cat!=="ajuste"&&f._signo>0?fmt(f._delta):""}
                  </td>
                  <td style={{padding:"6px 8px",textAlign:"right",fontWeight:700,whiteSpace:"nowrap",color:f._saldo>=0?"#2C1A0E":"#C0392B"}}>{fmt(f._saldo)}</td>
                </tr>
              ))}
              <tr style={{background:"#2C1A0E"}}>
                <td colSpan={2} style={{padding:"8px 10px",color:"#E8DCC8",fontWeight:700,fontSize:".76rem"}}>TOTALES</td>
                <td style={{padding:"8px",textAlign:"right",color:"#f5b7b1",fontWeight:700,whiteSpace:"nowrap"}}>{fmt(totalEgresos)}</td>
                <td style={{padding:"8px",textAlign:"right",color:"#a9dfbf",fontWeight:700,whiteSpace:"nowrap"}}>{fmt(totalIngresos)}</td>
                <td style={{padding:"8px",textAlign:"right",fontWeight:700,whiteSpace:"nowrap",color:neto>=0?"#a9dfbf":"#f5b7b1"}}>{fmt(saldoBase+neto)}</td>
              </tr>
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

function TabProveedores({proveedores,saveProveedores,calcDeuda,pagos,boletas,gastos,askPass}){
  const[nombre,setNombre]=useState("");const[deuda,setDeuda]=useState("");
  const[obs,setObs]=useState("");const[busy,setBusy]=useState(false);
  const[filtroNombre,setFiltroNombre]=useState("");
  const[provSel,setProvSel]=useState("");
  const[desdeDet,setDesdeDet]=useState("");
  const[hastaDet,setHastaDet]=useState("");
  const[mostrarForm,setMostrarForm]=useState(false);
  const[verInactivos,setVerInactivos]=useState(false);

  const guardar=async()=>{
    if(!nombre.trim()){toast("Ingresá el nombre");return;}
    setBusy(true);
    const idx=proveedores.findIndex(p=>norm(p.nombre)===norm(nombre));
    let nuevos;
    if(idx>=0){nuevos=proveedores.map((p,i)=>i===idx?{...p,deudaInicial:Number(deuda)||0,obs:obs.trim()}:p);toast("Actualizado ✓");}
    else{nuevos=[...proveedores,{id:uid(),nombre:nombre.trim(),deudaInicial:Number(deuda)||0,obs:obs.trim(),fecha:new Date().toISOString()}];toast("Guardado ✓");}
    await saveProveedores(nuevos);setBusy(false);setNombre("");setDeuda("");setObs("");setMostrarForm(false);
  };
  const eliminar=async id=>{
    if(!confirm("¿Eliminar? Los pagos no se borran."))return;
    await saveProveedores(proveedores.filter(p=>p.id!==id));toast("Eliminado");
  };
  const editar=p=>{setNombre(p.nombre);setDeuda(String(p.deudaInicial||""));setObs(p.obs||"");setMostrarForm(true);};
  const abrirNuevo=()=>{setNombre("");setDeuda("");setObs("");setMostrarForm(true);};
  const toggleActivo=async p=>{
    const nuevoEstado=p.estado==="Inactivo"?"Activo":"Inactivo";
    await saveProveedores(proveedores.map(x=>x.id===p.id?{...x,estado:nuevoEstado}:x));
    toast(nuevoEstado==="Inactivo"?"Proveedor ocultado ✓":"Proveedor activado ✓");
  };

  const sorted=proveedores.map(p=>{const d=calcDeuda(p.nombre);return{...p,_p:d?d.pendiente:0,_i:d?d.totalDeuda:0,_pagado:d?d.pagado:0};}).sort((a,b)=>b._p-a._p);
  const totalPendienteGlobal=sorted.reduce((s,p)=>s+Math.max(0,p._p),0);
  const inactivosCount=sorted.filter(p=>p.estado==="Inactivo").length;
  const baseVisible=verInactivos?sorted:sorted.filter(p=>p.estado!=="Inactivo");
  const filtrados=baseVisible.filter(p=>!filtroNombre||norm(p.nombre).includes(norm(filtroNombre)));

  // Estado de cuenta del proveedor seleccionado
  const provObj=provSel?proveedores.find(p=>norm(p.nombre)===norm(provSel)):null;
  const infoSel=provObj?calcDeuda(provObj.nombre):null;
  const boletasSel=provSel?boletas.filter(b=>norm(b.proveedor)===norm(provSel)).map(b=>({...b,_tipo:"boleta"})):[];
  const pagosSel=provSel?pagos.filter(p=>norm(p.proveedor)===norm(provSel)).map(p=>({...p,_tipo:"pago"})):[];
  const gastosSel=provSel?(gastos||[]).filter(g=>g.proveedor&&norm(g.proveedor)===norm(provSel)).map(g=>({...g,_tipo:"gasto",obs:g.obs||`Pago digital · ${g.categoria||""}`})):[];
  const movSel=[...boletasSel,...pagosSel,...gastosSel]
    .filter(m=>{
      const f=m.fecha.slice(0,10);
      return(!desdeDet||f>=desdeDet)&&(!hastaDet||f<=hastaDet);
    })
    .sort((a,b)=>a.fecha.localeCompare(b.fecha));

  // Saldo acumulado (se calcula en orden cronológico ascendente para que el saldo corrido sea correcto)
  let saldoAcum=infoSel?infoSel.deudaInicial:0;
  const movConSaldo=movSel.map(m=>{
    if(m._tipo==="boleta") saldoAcum+=Number(m.monto)||0;
    else saldoAcum-=Number(m.monto)||0;
    return{...m,_saldo:saldoAcum};
  });
  // Para mostrar: lo más reciente primero (el saldo ya viene calculado arriba, acá solo se invierte el orden visual)
  const movParaMostrar=[...movConSaldo].reverse();

  const exportarEstadoCuenta=()=>{
    if(!provSel){toast("Elegí un proveedor primero");return;}
    const rows=[["Fecha","Tipo","Detalle","Cargo","Pago","Saldo"]];
    if(infoSel&&infoSel.deudaInicial) rows.push(["-","Deuda inicial","",infoSel.deudaInicial,"",infoSel.deudaInicial]);
    movConSaldo.forEach(m=>{
      const cargo=m._tipo==="boleta"?m.monto:"";
      const pago =m._tipo!=="boleta"?m.monto:"";
      rows.push([fmtF(m.fecha),m._tipo==="boleta"?"Boleta":m.forma,m.obs||"",cargo,pago,m._saldo.toFixed(2)]);
    });
    const csv=rows.map(r=>r.map(v=>`"${String(v||"").replace(/"/g,'""')}"`).join(",")).join("\n");
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8;"}));
    a.download=`estado_cuenta_${provSel.replace(/\s+/g,"_")}.csv`;a.click();
  };

  return(<>
    <ST help={"Muestra el estado de cuenta de cada proveedor: cuánto se le debe en total.\n\n• La deuda = suma de boletas − pagos. Los pagos incluyen tanto los cargados en 💸 Pagos como los pagos digitales de 🏠 Pagos Digitales que tengan este proveedor asignado (ej: le pagaste por transferencia desde ahí en vez de por Pagos).\n• Podés ver el detalle de movimientos de cada proveedor tocando su nombre — ahí aparecen boletas, pagos y pagos digitales mezclados en orden cronológico.\n• Usá el botón + Nuevo proveedor para agregar uno, o el ✏️ de cada fila para editarlo.\n• 🚫 Activos e inactivos: los proveedores inactivos quedan ocultos de la lista (y no aparecen para elegir al cargar una boleta o un pago nuevo), pero su deuda sigue contando en el total y no se pierde nada de su historial. Tocá 👁️ Ver inactivos para volver a verlos, y ✅ en la fila para reactivarlos."}>Proveedores</ST><SS>Estado de cuenta y deuda por proveedor.</SS>

    {mostrarForm&&(
      <div style={{position:"fixed",inset:0,background:"rgba(44,26,14,.65)",zIndex:500,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
        <div style={{background:"#fff",borderRadius:20,padding:"24px 20px 32px",width:"100%",maxWidth:460,maxHeight:"85vh",overflowY:"auto"}}>
          <p style={{fontFamily:"Georgia,serif",fontSize:"1.1rem",marginBottom:14}}>{proveedores.some(p=>norm(p.nombre)===norm(nombre))&&nombre?"Editar proveedor":"Nuevo proveedor"}</p>
          <Field label="Nombre"><Inp value={nombre} onChange={setNombre} placeholder="Ej: UTENSILIOS"/></Field>
          <Field label="Deuda inicial"><Inp type="number" value={deuda} onChange={setDeuda} placeholder="0"/></Field>
          <Field label="Observaciones (opcional)"><TA value={obs} onChange={setObs} placeholder="Notas sobre este proveedor"/></Field>
          <div style={{display:"flex",gap:8,marginTop:18}}>
            <button onClick={()=>{setMostrarForm(false);setNombre("");setDeuda("");setObs("");}} style={{flex:1,padding:13,borderRadius:10,border:"none",background:"#E8DCC8",fontWeight:600,cursor:"pointer"}}>Cancelar</button>
            <Btn bg="#2C1A0E" onClick={guardar} disabled={busy}>{busy?"Guardando…":"Guardar"}</Btn>
          </div>
        </div>
      </div>
    )}

    {/* PANEL TOTAL */}
    <div style={{display:"flex",alignItems:"stretch",gap:10,marginBottom:16}}>
      <div style={{background:"#C0392B",borderRadius:10,padding:"10px 14px",flex:1,minWidth:0}}>
        <div style={{fontSize:".6rem",letterSpacing:".08em",textTransform:"uppercase",color:"#fff",opacity:.8}}>Total deuda a proveedores</div>
        <div style={{fontFamily:"Georgia,serif",fontSize:"1.4rem",color:"#fff",margin:"2px 0 0"}}>{fmt(totalPendienteGlobal)}</div>
      </div>
      <button onClick={abrirNuevo} style={{padding:"9px 16px",borderRadius:10,border:"none",background:"#2C1A0E",color:"#fff",fontWeight:600,fontSize:".8rem",cursor:"pointer",whiteSpace:"nowrap",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center"}}>+ Nuevo proveedor</button>
    </div>

    {/* ESTADO DE CUENTA */}
    {provSel&&(
      <div style={{background:"#fff",borderRadius:14,padding:20,boxShadow:"0 2px 12px rgba(44,26,14,.08)",marginBottom:16}}>
        <div style={{fontSize:".68rem",fontWeight:700,letterSpacing:".09em",textTransform:"uppercase",color:"#7B7063",marginBottom:14}}>Estado de cuenta · {provSel}</div>
        <div style={{display:"flex",gap:8}}>
          <div style={{flex:1}}>
            <label style={{display:"block",fontSize:".72rem",fontWeight:600,color:"#7B7063",marginBottom:3}}>Desde</label>
            <input type="date" value={desdeDet} onChange={e=>setDesdeDet(e.target.value)} style={{...iS,fontSize:".82rem",padding:"7px 10px"}}/>
          </div>
          <div style={{flex:1}}>
            <label style={{display:"block",fontSize:".72rem",fontWeight:600,color:"#7B7063",marginBottom:3}}>Hasta</label>
            <input type="date" value={hastaDet} onChange={e=>setHastaDet(e.target.value)} style={{...iS,fontSize:".82rem",padding:"7px 10px"}}/>
          </div>
        </div>

        {/* RESUMEN */}
        {infoSel&&<div style={{display:"flex",gap:8,margin:"14px 0 0"}}>
          {[["Deuda ini.",fmt(infoSel.deudaInicial),"#E8DCC8"],["Boletas",fmt(infoSel.sumaBoletas),"#f5b7b1"],["Pagado",fmt(infoSel.pagado),"#40916C"],["Pendiente",fmt(Math.max(0,infoSel.pendiente)),infoSel.pendiente>0?"#E74C3C":"#40916C"]].map(([l,v,c])=>(
            <div key={l} style={{flex:1,background:"#2C1A0E",borderRadius:10,padding:"8px 6px",textAlign:"center"}}>
              <div style={{fontSize:".55rem",color:"#E8DCC8",opacity:.6,textTransform:"uppercase"}}>{l}</div>
              <div style={{fontSize:".82rem",fontWeight:700,color:c,marginTop:2}}>{v}</div>
            </div>
          ))}
        </div>}

        {/* TABLA */}
        <div style={{marginTop:14,overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:".78rem"}}>
            <thead>
              <tr style={{background:"#F9F6F1"}}>
                {["Fecha","Tipo","Detalle","Cargo","Pago","Saldo"].map(h=>(
                  <th key={h} style={{padding:"7px 8px",textAlign:h==="Cargo"||h==="Pago"||h==="Saldo"?"right":"left",fontWeight:700,color:"#7B7063",fontSize:".68rem",letterSpacing:".05em",textTransform:"uppercase",whiteSpace:"nowrap",borderBottom:"2px solid #E8DCC8"}}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {!movParaMostrar.length&&!(infoSel&&infoSel.deudaInicial!==0)&&<tr><td colSpan={6} style={{textAlign:"center",padding:"20px",color:"#7B7063"}}>Sin movimientos en el período</td></tr>}
              {movParaMostrar.map((m,i)=>{
                const esBol=m._tipo==="boleta";
                const bg=i%2===0?"#fff":"#F9F6F1";
                return(
                  <tr key={m.id} style={{background:bg}}>
                    <td style={{padding:"7px 8px",whiteSpace:"nowrap",color:"#7B7063"}}>{fmtF(m.fecha)}</td>
                    <td style={{padding:"7px 8px"}}>
                      <span style={{background:esBol?"#FFF0EF":"#EAF5F0",color:esBol?"#C0392B":"#2D6A4F",borderRadius:4,padding:"2px 6px",fontSize:".68rem",fontWeight:700,whiteSpace:"nowrap"}}>
                        {esBol?"Boleta":m.forma}
                      </span>
                    </td>
                    <td style={{padding:"7px 8px",color:"#7B7063",maxWidth:120,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}} title={m.obs||""}>{m.obs||"—"}</td>
                    <td style={{padding:"7px 8px",textAlign:"right",color:"#C0392B",fontWeight:esBol?600:400}}>{esBol?fmt(m.monto):"—"}</td>
                    <td style={{padding:"7px 8px",textAlign:"right",color:"#2D6A4F",fontWeight:!esBol?600:400}}>{!esBol?fmt(m.monto):"—"}</td>
                    <td style={{padding:"7px 8px",textAlign:"right",fontWeight:700,color:m._saldo>0?"#C0392B":"#2D6A4F"}}>{fmt(m._saldo)}</td>
                  </tr>
                );
              })}
              {infoSel&&infoSel.deudaInicial!==0&&(
                <tr style={{background:"#FEF9E7"}}>
                  <td style={{padding:"7px 8px",color:"#7B7063",whiteSpace:"nowrap"}}>—</td>
                  <td style={{padding:"7px 8px"}}><span style={{background:"#E8DCC8",borderRadius:4,padding:"2px 6px",fontSize:".68rem",fontWeight:700}}>Inicial</span></td>
                  <td style={{padding:"7px 8px",color:"#7B7063",maxWidth:120,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>Deuda inicial</td>
                  <td style={{padding:"7px 8px",textAlign:"right",color:"#C0392B",fontWeight:600}}>{fmt(infoSel.deudaInicial)}</td>
                  <td style={{padding:"7px 8px",textAlign:"right"}}>—</td>
                  <td style={{padding:"7px 8px",textAlign:"right",fontWeight:700,color:"#C0392B"}}>{fmt(infoSel.deudaInicial)}</td>
                </tr>
              )}
            </tbody>
          </table>
        </div>
        <div style={{display:"flex",gap:8,marginTop:14}}>
          <button onClick={exportarEstadoCuenta} style={{flex:1,padding:10,borderRadius:10,border:"none",background:"#E8DCC8",color:"#2C1A0E",fontWeight:600,fontSize:".82rem",cursor:"pointer"}}>⬇ Exportar CSV</button>
          <button onClick={()=>{setProvSel("");setDesdeDet("");setHastaDet("");}} style={{padding:10,borderRadius:10,border:"none",background:"#F9F6F1",color:"#7B7063",fontWeight:600,fontSize:".82rem",cursor:"pointer"}}>Limpiar</button>
        </div>
      </div>
    )}

    {/* BUSCADOR + LISTA */}
    <div style={{marginBottom:12}}>
      <input value={filtroNombre} onChange={e=>setFiltroNombre(e.target.value)} placeholder="🔍 Buscar proveedor..." style={{...iS,fontSize:".85rem"}}/>
    </div>
    {inactivosCount>0&&(
      <div style={{marginBottom:12}}>
        <button onClick={()=>setVerInactivos(v=>!v)} style={{padding:"6px 12px",borderRadius:20,border:"1px solid #E8DCC8",cursor:"pointer",fontSize:".72rem",fontWeight:600,background:verInactivos?"#2C1A0E":"transparent",color:verInactivos?"#E8DCC8":"#7B7063"}}>
          {verInactivos?"🙈 Ocultar inactivos":`👁️ Ver inactivos (${inactivosCount})`}
        </button>
      </div>
    )}

    {!filtrados.length?<Empty icon="🏪">Sin resultados</Empty>:(
      <div style={{background:"#fff",borderRadius:14,padding:16,boxShadow:"0 2px 12px rgba(44,26,14,.08)"}}>
        <div style={{overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:".78rem",minWidth:340}}>
            <thead>
              <tr style={{background:"#F9F6F1"}}>
                {["Proveedor","Pendiente",""].map(h=>(
                  <th key={h||"acc"} style={{padding:"7px 8px",textAlign:h==="Pendiente"?"right":h===""?"center":"left",fontWeight:700,color:"#7B7063",fontSize:".63rem",letterSpacing:".05em",textTransform:"uppercase",borderBottom:"2px solid #E8DCC8",whiteSpace:"nowrap"}}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {filtrados.map((p,i)=>{
                const sal=p._p<=0;
                const inactivo=p.estado==="Inactivo";
                return(
                  <tr key={p.id} onClick={()=>{setProvSel(p.nombre);setDesdeDet("");setHastaDet("");window.scrollTo({top:0,behavior:"smooth"});}}
                    style={{background:i%2===0?"#fff":"#F9F6F1",cursor:"pointer",opacity:inactivo?.55:1}}>
                    <td style={{padding:"6px 8px"}}>
                      <div style={{fontWeight:600,fontSize:".8rem",display:"flex",alignItems:"center",gap:6}}>
                        {p.nombre}
                        {inactivo&&<span style={{background:"#E8DCC8",color:"#7B7063",borderRadius:4,padding:"1px 6px",fontSize:".6rem",fontWeight:700,textTransform:"uppercase"}}>Inactivo</span>}
                      </div>
                      {p.obs&&<div style={{fontSize:".65rem",color:"#7B7063",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",maxWidth:220}}>{p.obs}</div>}
                    </td>
                    <td style={{padding:"6px 8px",textAlign:"right",fontWeight:700,color:sal?"#2D6A4F":"#C0392B",whiteSpace:"nowrap"}}>{sal?"✅ Saldado":fmt(Math.max(0,p._p))}</td>
                    <td style={{padding:"6px 8px"}} onClick={e=>e.stopPropagation()}>
                      <div style={{display:"flex",gap:4,justifyContent:"center"}}>
                        <button onClick={()=>toggleActivo(p)} title={inactivo?"Activar":"Ocultar (marcar inactivo)"} style={{background:inactivo?"#EAF5F0":"#FEF9E7",border:"none",borderRadius:6,color:inactivo?"#2D6A4F":"#B7860B",fontSize:".62rem",fontWeight:600,cursor:"pointer",padding:"3px 6px"}}>{inactivo?"✅":"🚫"}</button>
                        <button onClick={()=>editar(p)} title="Editar" style={{background:"#EAF5F0",border:"none",borderRadius:6,color:"#2D6A4F",fontSize:".62rem",fontWeight:600,cursor:"pointer",padding:"3px 6px"}}>✏️</button>
                        <button onClick={()=>eliminar(p.id)} title="Eliminar" style={{background:"#FFF0EF",border:"none",borderRadius:6,color:"#E74C3C",fontSize:".62rem",fontWeight:600,cursor:"pointer",padding:"3px 6px"}}>✕</button>
                      </div>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>
    )}
  </>);
}

const RETIRO_SUELDOS_CAT="Retiro para sueldos";

function TabSueldos({sueldos,saveSueldos,saldo,gastos,saveGastos,empleados,liquidaciones}){
  const EMPS=(empleados||[]).filter(e=>e.estado!=="Inactivo"&&!e.excluirLiquidacion).slice().sort((a,b)=>a.nombre.localeCompare(b.nombre)).map(e=>e.nombre);
  // Chequeo anti-duplicado: si el empleado ya tiene la liquidación de ese período pagada del todo,
  // avisar antes de cargar otro "Sueldo" manual (podría ser un pago repetido sin querer).
  const nombreCoincideSueldo=(sNombre,empNombre)=>{
    const a=(sNombre||"").trim().toLowerCase();
    const b=(empNombre||"").trim().toLowerCase();
    if(!a||!b)return false;
    if(a===b)return true;
    return b.startsWith(a)||a.startsWith(b);
  };
  const liquidacionYaPagada=(nombreEmp,per)=>{
    const empMatch=(empleados||[]).find(e=>nombreCoincideSueldo(nombreEmp,e.nombre));
    if(!empMatch)return null;
    const liq=(liquidaciones||[]).find(l=>l.empleadoId===empMatch.id&&l.periodo===per&&l.estado==="confirmada");
    if(!liq)return null;
    const pagado=(sueldos||[]).filter(s=>s.liquidacionId===liq.id).reduce((s2,s)=>s2+Number(s.monto||0),0);
    return pagado>0&&Math.round(pagado*100)>=Math.round(Number(liq.neto||0)*100)?{liq,pagado}:null;
  };
  const[emp,setEmp]=useState("");const[monto,setMonto]=useState("");
  const[forma,setForma]=useState("Efectivo");const[obs,setObs]=useState("");
  const[busy,setBusy]=useState(false);
  const[fecha,setFecha]=useState(hoyLocal());
  const[concepto,setConcepto]=useState("Sueldo");
  const[hsExtras,setHsExtras]=useState("");
  const[crearModal,setCrearModal]=useState(false);const[nuevoEmp,setNuevoEmp]=useState("");
  const[listaEmps,setListaEmps]=useState(EMPS);
  useEffect(()=>{
    setListaEmps(l=>{
      const extra=l.filter(n=>!EMPS.includes(n));
      return[...EMPS,...extra];
    });
  },[JSON.stringify(EMPS)]);
  const[retiroModal,setRetiroModal]=useState(false);
  const[retiroMonto,setRetiroMonto]=useState("");
  const[retiroObs,setRetiroObs]=useState("");
  const[retiroFecha,setRetiroFecha]=useState(hoyLocal());
  const[retiroBusy,setRetiroBusy]=useState(false);

  const guardarRetiro=async()=>{
    if(!retiroMonto){toast("Ingresá el monto retirado");return;}
    if(Number(retiroMonto)>saldo){toast("⚠️ Supera la caja disponible");return;}
    setRetiroBusy(true);
    await saveGastos([...(gastos||[]),{id:uid(),tipo:"gasto",categoria:RETIRO_SUELDOS_CAT,monto:Number(retiroMonto),forma:"Efectivo",obs:retiroObs.trim(),fecha:retiroFecha?fechaLocalISO(retiroFecha):new Date().toISOString()}]);
    setRetiroBusy(false);setRetiroModal(false);setRetiroMonto("");setRetiroObs("");setRetiroFecha(hoyLocal());
    toast("Retiro registrado ✓");
  };

  const guardar=async()=>{
    if(!emp||!monto){toast("Elegí un empleado e ingresá el monto");return;}
    if(forma==="Efectivo"&&Number(monto)>saldo){toast("⚠️ Supera la caja disponible");return;}
    if(concepto==="Sueldo"){
      const per=(fecha||hoyLocal()).slice(0,7);
      const chk=liquidacionYaPagada(emp,per);
      if(chk&&!confirm("⚠️ "+emp+" ya tiene la liquidación de "+per+" pagada por completo ("+fmt(chk.pagado)+"). ¿Registrar este pago de todas formas?"))return;
    }
    setBusy(true);
    await saveSueldos([...sueldos,{id:uid(),tipo:"sueldo",empleado:emp,concepto,hsExtras:concepto==="HS Extras"?Number(hsExtras)||0:null,monto:Number(monto),forma,obs:obs.trim(),fecha:fecha?fechaLocalISO(fecha):new Date().toISOString()}]);
    setBusy(false);setEmp("");setMonto("");setObs("");setFecha(hoyLocal());setConcepto("Sueldo");setHsExtras("");toast("Sueldo registrado ✓");
  };
  const crearEmp=()=>{
    if(!nuevoEmp.trim()){toast("Ingresá un nombre");return;}
    setListaEmps(l=>[...l,nuevoEmp.trim()]);
    setEmp(nuevoEmp.trim());setNuevoEmp("");setCrearModal(false);
    toast("Empleado creado ✓");
  };

  const hoy=new Date().toDateString();
  const hoyItems=sueldos.filter(s=>new Date(s.fecha).toDateString()===hoy).slice().reverse();
  const totalMes=sueldos.filter(s=>{const d=new Date(s.fecha);const n=new Date();return d.getMonth()===n.getMonth()&&d.getFullYear()===n.getFullYear();}).reduce((a,s)=>a+Number(s.monto||0),0);

  // Retiro de efectivo para pagar sueldos: se carga como Gasto (categoría "Retiro para sueldos", forma
  // Efectivo) — eso descuenta la Caja Disponible una sola vez. Después, cada sueldo pagado con esa plata
  // se registra con forma "Retiro" y NO vuelve a descontar caja (ya salió antes). Este cartel muestra
  // cuánto de lo retirado todavía no se usó en sueldos.
  const totalRetirado=(gastos||[]).filter(g=>g.forma==="Efectivo"&&(g.categoria||"").trim().toLowerCase()===RETIRO_SUELDOS_CAT.toLowerCase()).reduce((s,g)=>s+Number(g.monto||0),0);
  const totalUsadoDeRetiro=sueldos.filter(s=>s.forma==="Retiro").reduce((s,x)=>s+Number(x.monto||0),0);
  const saldoRetiro=totalRetirado-totalUsadoDeRetiro;

  return(<>
    <ST help={"Registrá acá los pagos de sueldos, anticipos y horas extras.\n\n• Elegí el empleado del desplegable (usá + si no existe).\n• Los conceptos disponibles son: Sueldo, Anticipo, Horas extra y Vacaciones.\n• Cada pago descuenta de la caja disponible si se paga en efectivo.\n• Si vas a pagar varios sueldos con plata que ya sacaste antes de la caja: primero cargá el retiro como un Gasto (Pagos Digitales) en efectivo, categoría 'Retiro para sueldos'. Después, cada sueldo pagado con esa plata se registra acá con forma 'Retiro' — así no se descuenta la caja dos veces.\n• El historial de pagos está al final de la pantalla."}>Sueldos</ST><SS>Registrá pagos de sueldos a empleados.</SS>
    {crearModal&&(
      <div style={{position:"fixed",inset:0,background:"rgba(44,26,14,.65)",zIndex:500,display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
        <div style={{background:"#fff",borderRadius:"20px 20px 0 0",padding:"28px 20px 44px",width:"100%",maxWidth:460}}>
          <p style={{fontFamily:"Georgia,serif",fontSize:"1.1rem",marginBottom:16}}>Nuevo empleado</p>
          <input value={nuevoEmp} onChange={e=>setNuevoEmp(e.target.value)} placeholder="Nombre del empleado" autoFocus
            onKeyDown={e=>e.key==="Enter"&&crearEmp()} style={{...iS,marginBottom:16}}/>
          <div style={{display:"flex",gap:10}}>
            <button onClick={()=>{setCrearModal(false);setNuevoEmp("");}} style={{flex:1,padding:12,borderRadius:10,border:"none",background:"#E8DCC8",fontWeight:600,cursor:"pointer"}}>Cancelar</button>
            <button onClick={crearEmp} style={{flex:1,padding:12,borderRadius:10,border:"none",background:"#2D6A4F",color:"#fff",fontWeight:600,cursor:"pointer"}}>Crear</button>
          </div>
        </div>
      </div>
    )}
    <div style={{background:"#2C1A0E",borderRadius:14,padding:"18px 20px",marginBottom:16}}>
      <div style={{fontSize:".65rem",letterSpacing:".08em",textTransform:"uppercase",color:"#E8DCC8",opacity:.7}}>Caja disponible</div>
      <div style={{fontFamily:"Georgia,serif",fontSize:"2rem",color:"#E8DCC8",margin:"4px 0 0"}}>{fmt(saldo)}</div>
      <div style={{fontSize:".72rem",color:"#E8DCC8",opacity:.6,marginTop:4}}>Pagado este mes: <strong style={{color:"#f5b7b1"}}>{fmt(totalMes)}</strong></div>
    </div>
    {totalRetirado>0&&(
      <div style={{background:"#FEF9E7",border:"1px solid #F5D98B",borderRadius:14,padding:"14px 20px",marginBottom:12}}>
        <div style={{fontSize:".65rem",letterSpacing:".08em",textTransform:"uppercase",color:"#B7860B"}}>💰 Efectivo retirado, pendiente de usar en sueldos</div>
        <div style={{fontFamily:"Georgia,serif",fontSize:"1.4rem",color:"#7B5E00",margin:"4px 0 0"}}>{fmt(saldoRetiro)}</div>
        <div style={{fontSize:".68rem",color:"#B7860B",opacity:.85}}>Retirado en total: {fmt(totalRetirado)} · Ya usado en sueldos: {fmt(totalUsadoDeRetiro)}</div>
      </div>
    )}
    <Btn bg="#B7860B" onClick={()=>setRetiroModal(true)}>💰 Retirar efectivo para sueldos</Btn>
    <div style={{height:16}}/>

    {retiroModal&&(
      <div style={{position:"fixed",inset:0,background:"rgba(44,26,14,.65)",zIndex:500,display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
        <div style={{background:"#fff",borderRadius:"20px 20px 0 0",padding:"24px 20px 40px",width:"100%",maxWidth:460,maxHeight:"92dvh",overflowY:"auto"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
            <p style={{fontFamily:"Georgia,serif",fontSize:"1.1rem"}}>💰 Retirar efectivo para sueldos</p>
            <button onClick={()=>setRetiroModal(false)} style={{background:"none",border:"none",fontSize:"1.3rem",color:"#7B7063",cursor:"pointer",padding:4,lineHeight:1}}>✕</button>
          </div>
          <p style={{fontSize:".78rem",color:"#7B7063",marginBottom:16}}>Esto descuenta la caja disponible una sola vez (queda cargado como Gasto, categoría "Retiro para sueldos"). Después, cada sueldo que pagues con esta plata registralo con forma "Retiro" — así no se descuenta de nuevo.</p>
          <Field label="Monto retirado ($)"><Inp type="number" value={retiroMonto} onChange={setRetiroMonto} placeholder="0"/></Field>
          <Field label="Observaciones (opcional)"><TA value={retiroObs} onChange={setRetiroObs} placeholder="Ej: para pagar sueldos de la quincena"/></Field>
          <Field label="Fecha del retiro"><Inp type="date" value={retiroFecha} onChange={setRetiroFecha}/></Field>
          <div style={{display:"flex",gap:10,marginTop:8}}>
            <button onClick={()=>setRetiroModal(false)} style={{flex:1,padding:12,borderRadius:10,border:"none",background:"#E8DCC8",fontWeight:600,cursor:"pointer"}}>Cancelar</button>
            <button onClick={guardarRetiro} disabled={retiroBusy} style={{flex:1,padding:12,borderRadius:10,border:"none",background:"#B7860B",color:"#fff",fontWeight:600,cursor:"pointer"}}>{retiroBusy?"Guardando…":"Registrar retiro"}</button>
          </div>
        </div>
      </div>
    )}
    <Card title="Registrar pago de sueldo">
      <Field label="Empleado">
        <div style={{display:"flex",gap:8}}>
          <select value={emp} onChange={e=>setEmp(e.target.value)} style={{...sS,flex:1}}>
            <option value="">— Elegí un empleado —</option>
            {listaEmps.map(e=><option key={e} value={e}>{e}</option>)}
          </select>
          <button onClick={()=>setCrearModal(true)} title="Agregar empleado" style={{padding:"10px 14px",border:"1.5px solid #E8DCC8",borderRadius:8,background:"#F9F6F1",fontSize:"1.1rem",cursor:"pointer",flexShrink:0}}>+</button>
        </div>
      </Field>
      <Field label="Concepto">
        <select value={concepto} onChange={e=>{setConcepto(e.target.value);setHsExtras("");}} style={sS}>
          {["Sueldo","Adelanto","Aguinaldo","Plus","Feriado","HS Extras"].map(c=><option key={c}>{c}</option>)}
        </select>
      </Field>
      {concepto==="HS Extras"&&(
        <Field label="Cantidad de horas extras">
          <Inp type="number" value={hsExtras} onChange={setHsExtras} placeholder="Ej: 4"/>
        </Field>
      )}
      <Field label="Monto ($)"><Inp type="number" value={monto} onChange={setMonto} placeholder="0"/></Field>
      <Field label="Forma de pago">
        <select value={forma} onChange={e=>setForma(e.target.value)} style={sS}>
          <option value="Efectivo">Efectivo (descuenta de caja)</option>
          <option value="Transferencia">Transferencia (solo registro)</option>
          <option value="Retiro">Retiro (ya lo tenía en mano, no descuenta caja)</option>
        </select>
      </Field>
      {forma==="Efectivo"&&<div style={{fontSize:".78rem",color:"#2D6A4F",background:"#EAF5F0",borderRadius:8,padding:"8px 10px",marginTop:8}}>💵 Este pago descontará de la caja disponible.</div>}
      {forma==="Retiro"&&<div style={{fontSize:".78rem",color:"#B7860B",background:"#FEF9E7",borderRadius:8,padding:"8px 10px",marginTop:8}}>💰 No descuenta la caja disponible — se paga con efectivo que ya retiraste antes (cargado como Gasto "Retiro para sueldos").</div>}
      <Field label="Observaciones"><TA value={obs} onChange={setObs} placeholder="Ej: quincena, adelanto..."/></Field>
      <Field label="Fecha del registro"><Inp type="date" value={fecha} onChange={setFecha}/></Field>
      <Btn bg="#2D6A4F" onClick={guardar} disabled={busy}>{busy?"Guardando…":"Registrar sueldo"}</Btn>
    </Card>
    <Card title={`Pagos de hoy (${hoyItems.length})`}>
      {!hoyItems.length?<Empty icon="👥">Sin pagos registrados hoy</Empty>:hoyItems.map(s=>(
        <div key={s.id} style={{display:"flex",alignItems:"flex-start",gap:12,padding:"12px 0",borderBottom:"1px solid #F9F6F1"}}>
          <Thumb size={44}>👤</Thumb>
          <div style={{flex:1}}>
            <div style={{fontWeight:600,fontSize:".9rem"}}>{s.empleado}</div>
            <div style={{fontSize:".73rem",color:"#7B7063",marginTop:2}}>{s.concepto||"Sueldo"}{s.hsExtras?" · "+s.hsExtras+" hs":""} · {s.forma} · {fmtH(s.fecha)}</div>
            {s.obs&&<div style={{fontSize:".73rem",color:"#7B7063"}}>{s.obs}</div>}
          </div>
          <div style={{fontWeight:700,fontSize:".78rem",color:"#2D6A4F",whiteSpace:"nowrap"}}>✓ Registrado</div>
        </div>
      ))}
    </Card>
  </>);
}


function TabGastos({gastos,saveGastos,saldo,cajaInicial,proveedores}){
  const CATS_BASE=['Alquiler','Contadora','Abogada','Conciliaciones','Amex','Impuestos','Carta Documento','Disney','FUDO','Fumigador','Mantenimiento','Movistar','Rapiboy','Retiro para sueldos'];
  // Combina las categorías base (que pueden crecer con el tiempo) con las que el usuario haya
  // agregado a mano en este dispositivo, para que una categoría nueva agregada al código no quede
  // "perdida" detrás de una lista vieja ya guardada en localStorage.
  const[cats,setCats]=useState(()=>{
    try{
      const s=localStorage.getItem("amapola_cats_gastos");
      const guardadas=s?JSON.parse(s):[];
      return Array.from(new Set([...CATS_BASE,...guardadas]));
    }catch{return CATS_BASE;}
  });
  const[cat,setCat]=useState("");const[monto,setMonto]=useState("");
  const[forma,setForma]=useState("Efectivo");const[obs,setObs]=useState("");
  const[busy,setBusy]=useState(false);
  const[nuevaCatModal,setNuevaCatModal]=useState(false);
  const[nuevaCat,setNuevaCat]=useState("");
  const[nuevoPagoModal,setNuevoPagoModal]=useState(false);
  const[modoProv,setModoProv]=useState(false);
  const[provSel,setProvSel]=useState("");
  const proveedoresOrd=(proveedores||[]).filter(p=>p.estado!=="Inactivo").slice().sort((a,b)=>a.nombre.localeCompare(b.nombre));

  const agregarCategoria=()=>{
    if(!nuevaCat.trim()){toast("Ingresá el nombre de la categoría");return;}
    if(cats.includes(nuevaCat.trim())){toast("Ya existe esa categoría");return;}
    const nuevas=[...cats,nuevaCat.trim()];
    setCats(nuevas);
    localStorage.setItem("amapola_cats_gastos",JSON.stringify(nuevas));
    setCat(nuevaCat.trim());
    setNuevaCat("");setNuevaCatModal(false);
    toast("Categoría creada ✓");
  };
  const[fecha,setFecha]=useState(hoyLocal());

  const guardar=async()=>{
    if(modoProv){
      if(!provSel||!monto){toast("Elegí un proveedor e ingresá el monto");return false;}
    }else{
      if(!cat||!monto){toast("Elegí una categoría e ingresá el monto");return false;}
    }
    if(forma==="Efectivo"&&Number(monto)>saldo){toast("⚠️ Supera la caja disponible");return false;}
    setBusy(true);
    const registro={id:uid(),tipo:"gasto",categoria:modoProv?provSel:cat,monto:Number(monto),forma,obs:obs.trim(),fecha:fecha?fechaLocalISO(fecha):new Date().toISOString()};
    if(modoProv)registro.proveedor=provSel;
    await saveGastos([...gastos,registro]);
    setBusy(false);setCat("");setProvSel("");setModoProv(false);setMonto("");setObs("");setFecha(hoyLocal());toast("Pago registrado ✓");
    return true;
  };

  const totalMes=gastos.filter(g=>{const d=new Date(g.fecha);const n=new Date();return d.getMonth()===n.getMonth()&&d.getFullYear()===n.getFullYear();}).reduce((a,g)=>a+Number(g.monto||0),0);

  return(<>
    <ST>Pagos Digitales</ST><SS>Registrá pagos fijos del negocio (alquiler, servicios, impuestos...).</SS>
    <div style={{background:"#2C1A0E",borderRadius:14,padding:"18px 20px",marginBottom:16}}>
      <div style={{fontSize:".65rem",letterSpacing:".08em",textTransform:"uppercase",color:"#E8DCC8",opacity:.7}}>Caja disponible</div>
      <div style={{fontFamily:"Georgia,serif",fontSize:"2rem",color:"#E8DCC8",margin:"4px 0 0"}}>{fmt(saldo)}</div>
      <div style={{fontSize:".72rem",color:"#E8DCC8",opacity:.6,marginTop:4}}>Pagado este mes: <strong style={{color:"#f5b7b1"}}>{fmt(totalMes)}</strong></div>
    </div>

    <Btn bg="#7B7063" onClick={()=>setNuevoPagoModal(true)}>+ Registrar pago</Btn>

    {nuevoPagoModal&&(
      <div style={{position:"fixed",inset:0,background:"rgba(44,26,14,.65)",zIndex:500,display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
        <div style={{background:"#fff",borderRadius:"20px 20px 0 0",padding:"24px 20px 40px",width:"100%",maxWidth:460,maxHeight:"92dvh",overflowY:"auto"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
            <p style={{fontFamily:"Georgia,serif",fontSize:"1.1rem"}}>Nuevo pago digital</p>
            <button onClick={()=>setNuevoPagoModal(false)} style={{background:"none",border:"none",fontSize:"1.3rem",color:"#7B7063",cursor:"pointer",padding:4,lineHeight:1}}>✕</button>
          </div>

          {nuevaCatModal&&(
            <div style={{position:"fixed",inset:0,background:"rgba(44,26,14,.65)",zIndex:600,display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
              <div style={{background:"#fff",borderRadius:"20px 20px 0 0",padding:"28px 20px 44px",width:"100%",maxWidth:460}}>
                <p style={{fontFamily:"Georgia,serif",fontSize:"1.1rem",marginBottom:16}}>Nueva categoría</p>
                <input value={nuevaCat} onChange={e=>setNuevaCat(e.target.value)} placeholder="Ej: Seguro, Contador, ..."
                  autoFocus onKeyDown={e=>e.key==="Enter"&&agregarCategoria()}
                  style={{...iS,marginBottom:16}}/>
                <div style={{display:"flex",gap:10}}>
                  <button onClick={()=>{setNuevaCatModal(false);setNuevaCat("");}} style={{flex:1,padding:12,borderRadius:10,border:"none",background:"#E8DCC8",fontWeight:600,cursor:"pointer"}}>Cancelar</button>
                  <button onClick={agregarCategoria} style={{flex:1,padding:12,borderRadius:10,border:"none",background:"#7B7063",color:"#fff",fontWeight:600,cursor:"pointer"}}>Crear</button>
                </div>
              </div>
            </div>
          )}
          <div style={{display:"flex",gap:6,marginBottom:12}}>
            <button type="button" onClick={()=>{setModoProv(false);setProvSel("");}}
              style={{flex:1,padding:"7px 10px",borderRadius:8,border:"1.5px solid #E8DCC8",cursor:"pointer",fontSize:".76rem",fontWeight:600,background:!modoProv?"#2C1A0E":"#F9F6F1",color:!modoProv?"#fff":"#7B7063"}}>Categoría</button>
            <button type="button" onClick={()=>{setModoProv(true);setCat("");}}
              style={{flex:1,padding:"7px 10px",borderRadius:8,border:"1.5px solid #E8DCC8",cursor:"pointer",fontSize:".76rem",fontWeight:600,background:modoProv?"#2C1A0E":"#F9F6F1",color:modoProv?"#fff":"#7B7063"}}>Proveedor</button>
          </div>
          {!modoProv?(
            <Field label="Categoría">
              <div style={{display:"flex",gap:8}}>
                <select value={cat} onChange={e=>setCat(e.target.value)} style={{...sS,flex:1}}>
                  <option value="">— Elegí una categoría —</option>
                  {cats.map(c=><option key={c} value={c}>{c}</option>)}
                </select>
                <button onClick={()=>setNuevaCatModal(true)} title="Nueva categoría"
                  style={{padding:"10px 14px",border:"1.5px solid #E8DCC8",borderRadius:8,background:"#F9F6F1",fontSize:"1.1rem",cursor:"pointer",flexShrink:0}}>+</button>
              </div>
            </Field>
          ):(
            <Field label="Proveedor">
              <select value={provSel} onChange={e=>setProvSel(e.target.value)} style={sS}>
                <option value="">— Elegí un proveedor —</option>
                {proveedoresOrd.map(p=><option key={p.id} value={p.nombre}>{p.nombre}</option>)}
              </select>
              <div style={{fontSize:".72rem",color:"#7B7063",marginTop:6}}>Este pago se descuenta de la deuda pendiente de {provSel||"ese proveedor"} (se ve reflejado en 🏪 Proveedores).</div>
            </Field>
          )}
          <Field label="Monto ($)"><Inp type="number" value={monto} onChange={setMonto} placeholder="0"/></Field>
          <Field label="Forma de pago">
            <select value={forma} onChange={e=>setForma(e.target.value)} style={sS}>
              <option value="Efectivo">Efectivo (descuenta de caja)</option>
              <option value="Transferencia">Transferencia (solo registro)</option>
            </select>
          </Field>
          {forma==="Efectivo"&&<div style={{fontSize:".78rem",color:"#2D6A4F",background:"#EAF5F0",borderRadius:8,padding:"8px 10px",marginTop:8}}>💵 Este pago descontará de la caja disponible.</div>}
          <Field label="Observaciones"><TA value={obs} onChange={setObs} placeholder="Ej: mes de junio, cuota..."/></Field>
          <Field label="Fecha del registro"><Inp type="date" value={fecha} onChange={setFecha}/></Field>
          <Btn bg="#7B7063" onClick={async()=>{if(await guardar())setNuevoPagoModal(false);}} disabled={busy}>{busy?"Guardando…":"Registrar pago"}</Btn>
        </div>
      </div>
    )}

    <LibroDiarioGastos gastos={gastos} saveGastos={saveGastos} proveedores={proveedores}/>
  </>);
}



function LibroDiarioGastos({gastos,saveGastos,proveedores}){
  const hoy=new Date();
  const iso=d=>d.toISOString().slice(0,10);
  const inicioMes=new Date(hoy.getFullYear(),hoy.getMonth(),1);
  const[filtroFecha,setFiltroFecha]=useState("mes");
  const[desde,setDesde]=useState(iso(inicioMes));
  const[hasta,setHasta]=useState(iso(hoy));
  const[filtroForma,setFiltroForma]=useState("todo");
  const[filtroCat,setFiltroCat]=useState("todo");
  const[editItem,setEditItem]=useState(null);
  const[editForm,setEditForm]=useState({});
  const[confElim,setConfElim]=useState(null);
  const[busyEdit,setBusyEdit]=useState(false);

  const abrirEditar=g=>{
    setEditItem(g);
    setEditForm({categoria:g.categoria||"",proveedor:g.proveedor||"",monto:String(g.monto),forma:g.forma||"Efectivo",obs:g.obs||"",fecha:g.fecha.slice(0,10)});
  };
  const guardarEdicion=async()=>{
    if(!editForm.categoria||!editForm.monto){toast("Completá categoría y monto");return;}
    setBusyEdit(true);
    const nf=editForm.fecha?fechaLocalISO(editForm.fecha):editItem.fecha;
    await saveGastos(gastos.map(g=>g.id===editItem.id?{...g,categoria:editForm.categoria,proveedor:editForm.proveedor||"",monto:Number(editForm.monto),forma:editForm.forma,obs:editForm.obs,fecha:nf}:g));
    setBusyEdit(false);setEditItem(null);toast("Actualizado ✓");
  };
  const eliminar=async()=>{
    const g=confElim;setConfElim(null);
    await saveGastos(gastos.filter(x=>x.id!==g.id));
    toast("Eliminado ✓");
  };

  const allMovs=[...gastos].sort((a,b)=>a.fecha.localeCompare(b.fecha));
  const categoriasPresentes=[...new Set(gastos.map(g=>g.categoria).filter(Boolean))].sort();

  const desdeF=filtroFecha==="mes"?iso(inicioMes):filtroFecha==="hoy"?iso(hoy):desde;
  const hastaF=filtroFecha==="mes"?iso(hoy):filtroFecha==="hoy"?iso(hoy):hasta;

  const filtrados=allMovs
    .filter(m=>{const f=m.fecha.slice(0,10);return(!desdeF||f>=desdeF)&&(!hastaF||f<=hastaF);})
    .filter(m=>filtroForma==="todo"||m.forma===filtroForma)
    .filter(m=>filtroCat==="todo"||m.categoria===filtroCat);

  const filtradosAsc=[...filtrados].sort((a,b)=>a.fecha.localeCompare(b.fecha));
  let saldoAcum=0;
  const filasAsc=filtradosAsc.map(m=>{
    saldoAcum-=Number(m.monto||0);
    return{...m,_saldo:saldoAcum};
  });
  const filas=[...filasAsc].reverse();

  const totalEf=filtradosAsc.filter(m=>m.forma==="Efectivo").reduce((s,m)=>s+Number(m.monto||0),0);
  const totalTr=filtradosAsc.filter(m=>m.forma==="Transferencia").reduce((s,m)=>s+Number(m.monto||0),0);
  const totalGen=totalEf+totalTr;

  return(
    <div style={{background:"#fff",borderRadius:14,padding:20,boxShadow:"0 2px 12px rgba(44,26,14,.08)",marginTop:16}}>
      <div style={{fontSize:".68rem",fontWeight:700,letterSpacing:".09em",textTransform:"uppercase",color:"#7B7063",marginBottom:14}}>📒 Libro diario · Pagos Digitales</div>

      {/* FILTROS FECHA */}
      <div style={{display:"flex",gap:6,marginBottom:10,flexWrap:"wrap"}}>
        {[["hoy","Hoy"],["mes","Este mes"],["custom","Personalizado"]].map(([v,l])=>(
          <button key={v} onClick={()=>{setFiltroFecha(v);if(v==="mes"){setDesde(iso(inicioMes));setHasta(iso(hoy));}if(v==="hoy"){setDesde(iso(hoy));setHasta(iso(hoy));}}}
            style={{padding:"5px 12px",borderRadius:20,border:"none",cursor:"pointer",fontSize:".72rem",fontWeight:600,background:filtroFecha===v?"#2C1A0E":"#E8DCC8",color:filtroFecha===v?"#E8DCC8":"#2C1A0E"}}>{l}</button>
        ))}
      </div>
      {filtroFecha==="custom"&&(
        <div style={{display:"flex",gap:8,marginBottom:10}}>
          <div style={{flex:1}}>
            <label style={{display:"block",fontSize:".7rem",fontWeight:600,color:"#7B7063",marginBottom:3}}>Desde</label>
            <input type="date" value={desde} onChange={e=>setDesde(e.target.value)} style={{...iS,fontSize:".82rem",padding:"7px 10px"}}/>
          </div>
          <div style={{flex:1}}>
            <label style={{display:"block",fontSize:".7rem",fontWeight:600,color:"#7B7063",marginBottom:3}}>Hasta</label>
            <input type="date" value={hasta} onChange={e=>setHasta(e.target.value)} style={{...iS,fontSize:".82rem",padding:"7px 10px"}}/>
          </div>
        </div>
      )}

      {/* FILTRO FORMA */}
      <div style={{display:"flex",gap:6,marginBottom:10,flexWrap:"wrap"}}>
        {[["todo","Todo"],["Efectivo","Efectivo"],["Transferencia","Transferencia"]].map(([v,l])=>(
          <button key={v} onClick={()=>setFiltroForma(v)}
            style={{padding:"4px 10px",borderRadius:20,border:"1px solid #E8DCC8",cursor:"pointer",fontSize:".7rem",fontWeight:600,background:filtroForma===v?"#2C1A0E":"transparent",color:filtroForma===v?"#E8DCC8":"#7B7063"}}>{l}</button>
        ))}
      </div>

      {/* FILTRO CATEGORÍA */}
      {categoriasPresentes.length>0&&(
        <div style={{marginBottom:12}}>
          <select value={filtroCat} onChange={e=>setFiltroCat(e.target.value)} style={{...sS,fontSize:".8rem"}}>
            <option value="todo">Todas las categorías</option>
            {categoriasPresentes.map(c=><option key={c} value={c}>{c}</option>)}
          </select>
        </div>
      )}

      {/* RESUMEN */}
      {filas.length>0&&(
        <div style={{display:"flex",gap:8,marginBottom:12}}>
          {[["💵 Efectivo",fmt(totalEf),"#C0392B"],["🏦 Transferencia",fmt(totalTr),"#B7860B"],["Total",fmt(totalGen),"#2C1A0E"]].map(([l,v,c])=>(
            <div key={l} style={{flex:1,background:"#F9F6F1",borderRadius:10,padding:"8px 10px",textAlign:"center"}}>
              <div style={{fontSize:".6rem",color:"#7B7063",textTransform:"uppercase",letterSpacing:".04em"}}>{l}</div>
              <div style={{fontWeight:700,fontSize:".85rem",color:c,marginTop:2}}>{v}</div>
            </div>
          ))}
        </div>
      )}

      {/* TABLA */}
      {!filas.length?<Empty icon="🏠">Sin gastos en el período</Empty>:(
        <div style={{overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:".75rem",minWidth:360}}>
            <thead>
              <tr style={{background:"#F9F6F1"}}>
                {["Fecha","Categoría","Forma","Monto",""].map(h=>(
                  <th key={h||"acc"} style={{padding:"7px 8px",textAlign:h==="Monto"?"right":h===""?"center":"left",fontWeight:700,color:"#7B7063",fontSize:".63rem",letterSpacing:".05em",textTransform:"uppercase",borderBottom:"2px solid #E8DCC8",whiteSpace:"nowrap"}}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {filas.map((g,i)=>(
                <tr key={g.id} style={{background:i%2===0?"#fff":"#F9F6F1"}}>
                  <td style={{padding:"6px 8px",whiteSpace:"nowrap",color:"#7B7063",fontSize:".72rem"}}>
                    {fmtF(g.fecha)}<br/><span style={{fontSize:".62rem"}}>{fmtH(g.fecha)}</span>
                  </td>
                  <td style={{padding:"6px 8px"}}>
                    <div style={{fontWeight:600,fontSize:".78rem"}}>{g.categoria}</div>
                    {g.proveedor&&g.proveedor!==g.categoria&&<div style={{fontSize:".64rem",color:"#2D6A4F"}}>🏪 {g.proveedor}</div>}
                    {g.obs&&<div style={{fontSize:".65rem",color:"#7B7063"}}>{g.obs}</div>}
                  </td>
                  <td style={{padding:"6px 8px"}}>
                    <span style={{background:g.forma==="Efectivo"?"#EAF5F0":"#FEF9E7",color:g.forma==="Efectivo"?"#2D6A4F":"#B7860B",borderRadius:6,padding:"2px 8px",fontSize:".68rem",fontWeight:600}}>
                      {g.forma==="Efectivo"?"💵 Ef.":"🏦 Transf."}
                    </span>
                  </td>
                  <td style={{padding:"6px 8px",textAlign:"right",fontWeight:700,color:"#C0392B",whiteSpace:"nowrap"}}>{fmt(g.monto)}</td>
                  <td style={{padding:"6px 8px"}}>
                    <div style={{display:"flex",gap:4,justifyContent:"center"}}>
                      <button onClick={()=>abrirEditar(g)} style={{background:"#EAF5F0",border:"none",borderRadius:6,color:"#2D6A4F",fontSize:".6rem",fontWeight:600,cursor:"pointer",padding:"3px 6px"}}>✏️</button>

function ManualStockModal({onClose}){
  const Sec=({title,children})=>(
    <div style={{marginBottom:18}}>
      <h4 style={{fontFamily:"Georgia,serif",fontSize:"1rem",color:"#2C1A0E",margin:"0 0 6px"}}>{title}</h4>
      <div style={{fontSize:".82rem",color:"#4A3B2C",lineHeight:1.65}}>{children}</div>
    </div>
  );
  return(
    <div style={{position:"fixed",inset:0,background:"rgba(44,26,14,.55)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:16}} onClick={onClose}>
      <div style={{background:"#fff",borderRadius:16,padding:"24px 22px",width:"100%",maxWidth:640,maxHeight:"88vh",overflowY:"auto"}} onClick={e=>e.stopPropagation()}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18}}>
          <span style={{fontFamily:"Georgia,serif",fontSize:"1.2rem",color:"#2C1A0E"}}>📖 Manual de uso — Stock</span>
          <button onClick={onClose} style={{background:"none",border:"none",fontSize:"1.3rem",cursor:"pointer",color:"#7B7063"}}>✕</button>
        </div>

        <Sec title="Qué es este módulo">
          Acá se lleva el control de todos los insumos y productos del local: cuánto hay de cada uno, a qué proveedor se le compra, qué se produjo en cocina, qué se tiró, y los pedidos que se le hacen a cada proveedor. Tiene seis secciones (los botones de arriba): 📋 Control de stock, 🧮 Conteo, 🍳 Producción, 🗑️ Desperdicios, 🗂️ Catálogo y 🧾 Pedidos.
        </Sec>

        <Sec title="Importante: stock 'teórico' vs. stock real">
          Acá NO se descuentan automáticamente las ventas que salen por Fudo. El número que ves en Control de stock es <b>teórico</b>: sube con las compras que cargás y con lo que se produce en cocina, pero no baja solo cuando se vende un plato. Por eso existe 🧮 Conteo: sirve para contar lo que hay REALMENTE en la góndola/heladera/depósito de vez en cuando, y ajustar el número al real. La diferencia entre lo teórico y lo contado es, por lógica, lo que se vendió o se consumió — comparalo con lo que dice Fudo si querés chequear que cierre.
        </Sec>

        <Sec title="📋 Control de stock">
          Es la pantalla principal: una tabla agrupada por proveedor (tocá el nombre del proveedor para abrir/cerrar el grupo), con una fila por producto. Cada fila muestra el stock actual, una columna por cada día de la semana (con lo que se cargó ese día — compra o producción — y un 🧮 si ese día se hizo un conteo), el cierre de semana (último conteo) y botones de acción: <b>+</b> para sumar una entrada (llegó mercadería), <b>−</b> para registrar una salida, y <b>⋯</b> para abrir el historial completo del producto (ahí también podés editarlo o eliminarlo).<br/><br/>
          Arriba tenés flechas ← → para moverte de semana, un buscador, y filtros por proveedor, sector y "Solo stock bajo". Los productos con stock bajo el mínimo que definiste quedan marcados en rojo con la palabra <b>BAJO</b>, y también suman al numerito rojo que aparece al lado de "Stock" en el menú de la izquierda.
        </Sec>

        <Sec title="🧮 Conteo">
          Para saber cuánto hay REALMENTE. Elegís si contás todo el inventario o filtrás por proveedor/sector (conteo parcial), y vas cargando lo que contás a mano de cada producto. Antes de guardar te pide confirmación mostrando la diferencia contra el teórico. Al confirmar, el stock queda ajustado al número que contaste, y esa diferencia se guarda en el historial del producto como "ajuste por conteo" — no se pierde el dato de qué tan cerca (o lejos) estaba lo teórico de lo real.
        </Sec>

        <Sec title="🍳 Producción">
          Exclusivo para productos que se elaboran en la propia cocina (los que en el Catálogo tienen proveedor <b>INTERNO</b> — ej. salsas, masas, cosas que se preparan acá y no se compran hechas). Elegís el producto, cuánto se produjo, quién lo hizo y la fecha, y esa cantidad se suma directo al stock de ese producto. Si un producto que se elabora en cocina no aparece en la lista, hay que agregarlo primero en 🗂️ Catálogo con proveedor <b>INTERNO</b>.
        </Sec>

        <Sec title="🗑️ Desperdicios">
          Para registrar lo que se tira, se rompe o se vence, y así saber cuánto se está perdiendo. Elegís el producto del inventario, la cantidad, el motivo (Vencido, Roto/dañado, Quemado/error de cocina, Devolución de cliente, u Otro) y la fecha. Al guardar, esa cantidad se descuenta del stock del producto — el registro queda en la lista de abajo, con opción de eliminarlo si se cargó por error (ojo: eliminar el registro NO repone el stock solo, hay que sumarlo de nuevo a mano si corresponde).
        </Sec>

        <Sec title="🗂️ Catálogo">
          Es la base de TODOS los productos e insumos que se compran o se elaboran, organizados por proveedor (mismo formato de tabla colapsable que Control de stock). Acá se define qué existe, con qué proveedor va y en qué sector se usa (Cocina/Front) — no lleva cantidad, es solo la "ficha" del producto. Desde acá también se pueden generar 🧾 Pedidos, y cada producto se puede marcar como inactivo si se dejó de usar (sin borrarlo, para no perder el historial).
        </Sec>

        <Sec title="🧾 Pedidos">
          Para armar una nota de pedido a un proveedor: elegís el proveedor, cargás la cantidad que necesitás de cada producto de su catálogo, y opcionalmente una observación (ej. "pedir para el jueves"). El pedido queda con estado <b>Pendiente</b>, y se puede pasar a <b>Enviado</b> o <b>Recibido</b> a medida que avanza. Cada pedido tiene un botón ✏️ Editar por si hay que corregir cantidades o el proveedor después de creado, 📄 Nota de pedido para abrir una versión imprimible, y ✕ Eliminar.
        </Sec>

        <Sec title="Cómo agregar un producto o un proveedor nuevo">
          Se puede hacer desde Control de stock o desde Catálogo, con el botón para agregar un producto. Ahí elegís un proveedor ya existente de la lista, o tocás "+ Es un proveedor nuevo" y escribís el nombre — si ese proveedor todavía no existía, el sistema lo da de alta automáticamente (así después ya aparece también en 🏪 Proveedores para llevarle la cuenta). Conviene siempre revisar primero si el proveedor ya está en la lista antes de escribirlo de nuevo, para no duplicarlo con otro nombre o mayúsculas distintas.
        </Sec>

        <Sec title="Para tener en cuenta">
          Si entraste con el usuario de <b>Cocina</b>, solo vas a ver la pestaña de Stock (arranca directo en Control de stock) — no vas a poder ver el resto de la app.<br/><br/>
          El stock bajo se define producto por producto: si cargaste un "mínimo" para un producto y la cantidad actual es igual o menor, se marca como BAJO automáticamente — no hace falta hacer nada más para que se active la alerta.
        </Sec>
      </div>
    </div>
  );
}
