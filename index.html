                                  <button disabled={rowBusy} onClick={()=>quitarProductoDeBoleta(b,l)} style={{background:"none",border:"none",color:"#C0392B",fontSize:".8rem",cursor:"pointer",padding:"0 4px"}}>✕</button>
                                </div>
                              ))}
                            </div>
                          )}
                          <div style={{display:"flex",gap:6,alignItems:"flex-end"}}>
                            <div style={{flex:1}}>
                              <select value={addProdId} onChange={e=>setAddProdId(e.target.value)} style={{...sS,fontSize:".78rem"}}>
                                <option value="">— Agregar producto —</option>
                                {productosCat.filter(c=>norm(c.proveedor)===norm(b.proveedor)).length>0&&<optgroup label={`✓ De ${b.proveedor}`}>{productosCat.filter(c=>norm(c.proveedor)===norm(b.proveedor)).map(c=><option key={c.id} value={c.id}>{c.producto}</option>)}</optgroup>}
                                <optgroup label="Otros productos">{productosCat.filter(c=>norm(c.proveedor)!==norm(b.proveedor)).map(c=><option key={c.id} value={c.id}>{c.producto} ({c.proveedor})</option>)}</optgroup>
                              </select>
                            </div>
                            <div style={{width:72}}>
                              <input type="number" min="0" value={addProdCant} onChange={e=>setAddProdCant(e.target.value)} placeholder="Cant." style={{...iS,fontSize:".82rem",textAlign:"center"}}/>
                            </div>
                            <button disabled={rowBusy} onClick={()=>agregarProductoABoleta(b)} style={{padding:"10px 12px",border:"none",borderRadius:8,background:"#2C1A0E",color:"#fff",fontWeight:700,fontSize:"1rem",cursor:"pointer",flexShrink:0}}>+</button>
                          </div>
                          <div style={{fontSize:".68rem",color:"#7B7063",marginTop:6}}>Agregar o quitar acá también suma o resta del stock.</div>
                        </td>
                      </tr>
                    )}
                    </React.Fragment>
                    );
                  })}
                </tbody>
              </table>
            </div>
          )}
        </div>
      );
    })()}
  </>);
}

function TabCaja({cierres,saveCierres,ini,tot,eg,saldo,cajaInicial,saveCajaInicial,askPass,ajustesCajaEfectivo,saveAjustesCajaEfectivo}){
  const[montoIni,setMontoIni]=useState("");const[emp,setEmp]=useState("");
  const[turno,setTurno]=useState("Mostrador Día");const[monto,setMonto]=useState("");
  const[obs,setObs]=useState("");const[busy,setBusy]=useState(false);
  const[fecha,setFecha]=useState(hoyLocal());
  const[cajeros,setCajeros]=useState(["Micaela","Priscila","Valentina","Ludmila","Catalina","Lautaro"]);
  const[nuevoModal,setNuevoModal]=useState(false);
  const[nuevoNombre,setNuevoNombre]=useState("");

  const agregarCajero=()=>{
    const nombre=nuevoNombre.trim();
    if(!nombre){toast("Ingresá un nombre");return;}
    if(cajeros.some(c=>norm(c)===norm(nombre))){toast("Ya existe");return;}
    setCajeros([...cajeros,nombre]);
    setEmp(nombre);setNuevoNombre("");setNuevoModal(false);toast("Agregado ✓");
  };

  useEffect(()=>{setMontoIni(cajaInicial>0?String(cajaInicial):"");},[cajaInicial]);
  const guardarIni=async()=>{
    const ok=await askPass();if(!ok)return;
    const v=Number(montoIni);
    if(isNaN(v)||v<0){toast("Ingresá un monto válido");return;}
    const anterior=Number(cajaInicial)||0;
    await saveCajaInicial(v);
    // Deja rastro del cambio (antes solo se pisaba el valor sin ningún historial) — reusa el mismo
    // historial de "Ajuste de caja disponible" para no agregar otra tabla; monto:0 porque esto no es
    // un ajuste que sume o reste del saldo, es el cambio del punto de partida en sí.
    if(saveAjustesCajaEfectivo&&v!==anterior){
      const nuevo={id:uid(),monto:0,motivo:"Saldo inicial cambiado de "+fmt(anterior)+" a "+fmt(v),saldoAntes:anterior,saldoDespues:v,fecha:new Date().toISOString()};
      await saveAjustesCajaEfectivo([nuevo,...(ajustesCajaEfectivo||[])]);
    }
    toast("Saldo inicial guardado ✓");
  };
  const guardarCierre=async()=>{
    if(!emp.trim()||!monto){toast("Completá empleado y monto");return;}
    setBusy(true);
    await saveCierres([...cierres,{id:uid(),tipo:"cierre",empleado:emp.trim(),turno,monto:Number(monto),obs:obs.trim(),fecha:fechaLocalISO(fecha)}]);
    setBusy(false);setEmp("");setMonto("");setObs("");setFecha(hoyLocal());toast("Cierre registrado ✓");
  };
  return(<>
    <ST help={"Acá se registran los cierres de turno: el dinero en efectivo que se deposita en la caja fuerte al final de cada turno.\n\n• Cada cierre suma al saldo de caja disponible.\n• Los pagos a proveedores en efectivo restan de ese saldo.\n• El saldo inicial es el monto con el que arrancó la caja (protegido por contraseña). Si lo cambiás, queda un registro de 'antes → después' en el historial de Ajustes de caja disponible (Admin), para no perder el rastro.\n• El disponible final = Inicial + Cierres − Pagos en efectivo."}>Caja Disponible</ST><SS>Cierres de turno y caja disponible.</SS>

    {nuevoModal&&(
      <div style={{position:"fixed",inset:0,background:"rgba(44,26,14,.65)",zIndex:500,display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
        <div style={{background:"#fff",borderRadius:"20px 20px 0 0",padding:"28px 20px 44px",width:"100%",maxWidth:460}}>
          <p style={{fontFamily:"Georgia,serif",fontSize:"1.1rem",marginBottom:16}}>Nueva persona</p>
          <input value={nuevoNombre} onChange={e=>setNuevoNombre(e.target.value)} placeholder="Nombre" autoFocus onKeyDown={e=>e.key==="Enter"&&agregarCajero()} style={{...iS,marginBottom:16}}/>
          <div style={{display:"flex",gap:10}}>
            <button onClick={()=>{setNuevoModal(false);setNuevoNombre("");}} style={{flex:1,padding:12,borderRadius:10,border:"none",background:"#E8DCC8",fontWeight:600,cursor:"pointer"}}>Cancelar</button>
            <button onClick={agregarCajero} style={{flex:1,padding:12,borderRadius:10,border:"none",background:"#2C1A0E",color:"#fff",fontWeight:600,cursor:"pointer"}}>Agregar</button>
          </div>
        </div>
      </div>
    )}

    <div style={{background:"#2C1A0E",borderRadius:14,padding:"22px 20px",marginBottom:16}}>
      <div style={{fontSize:".65rem",letterSpacing:".08em",textTransform:"uppercase",color:"#E8DCC8",opacity:.7}}>Caja disponible</div>
      <div style={{fontFamily:"Georgia,serif",fontSize:"2.4rem",color:"#E8DCC8",margin:"4px 0 2px"}}>{fmt(saldo)}</div>
      <div style={{fontSize:".74rem",color:"#E8DCC8",opacity:.6}}>Saldo inicial + cierres − pagos en efectivo</div>
      <div style={{display:"flex",gap:10,marginTop:14}}>
        {[["Inicial",fmt(ini)],["Cierres",fmt(tot)],["Pagado",fmt(eg)]].map(([l,v])=>(
          <div key={l} style={{flex:1,background:"rgba(255,255,255,.07)",borderRadius:10,padding:"10px 12px"}}>
            <div style={{fontSize:".62rem",color:"#E8DCC8",opacity:.6,textTransform:"uppercase",letterSpacing:".05em"}}>{l}</div>
            <div style={{fontSize:".95rem",fontWeight:700,color:"#E8DCC8",marginTop:2}}>{v}</div>
          </div>
        ))}
      </div>
    </div>

    <Card title="Registrar cierre de turno">
      <Field label="Empleado">
        <div style={{display:"flex",gap:8}}>
          <select value={emp} onChange={e=>setEmp(e.target.value)} style={{...sS,flex:1}}>
            <option value="">— Elegí —</option>
            {cajeros.map(c=><option key={c} value={c}>{c}</option>)}
          </select>
          <button onClick={()=>setNuevoModal(true)} title="Agregar persona" style={{padding:"10px 14px",border:"1.5px solid #E8DCC8",borderRadius:8,background:"#F9F6F1",fontSize:"1.1rem",cursor:"pointer",flexShrink:0}}>+</button>
        </div>
      </Field>
      <Field label="Caja"><select value={turno} onChange={e=>setTurno(e.target.value)} style={sS}>{["Mostrador Día","Mostrador Noche","Post FUDO 1","Post FUDO 2"].map(t=><option key={t}>{t}</option>)}</select></Field>
      <Field label="Monto a depositar ($)"><Inp type="number" value={monto} onChange={setMonto} placeholder="0"/></Field>
      <Field label="Observaciones"><TA value={obs} onChange={setObs} placeholder="Ej: faltaron $500..."/></Field>
      <Field label="Fecha del registro"><Inp type="date" value={fecha} onChange={setFecha}/></Field>
      <Btn bg="#2D6A4F" onClick={guardarCierre} disabled={busy}>{busy?"Guardando…":"Confirmar cierre de turno"}</Btn>
    </Card>
    <NotasTurno cierres={cierres}/>
  </>);
}

function TabPagos({pagos,savePagos,proveedores,saldo,cierres,cajaInicial,cierresCaja,sueldos,gastos,saveGastos,pagarConExcedente,empleados,saveEmpleados,catalogo,saveStock,stock,ajustesCajaEfectivo,setTab}){
  const[prov,setProv]=useState("");const[emp,setEmp]=useState("");
  const[monto,setMonto]=useState("");const[forma,setForma]=useState("Efectivo");
  const[obs,setObs]=useState("");const[busy,setBusy]=useState(false);
  const[fecha,setFecha]=useState(hoyLocal());
  const[nuevoRegModal,setNuevoRegModal]=useState(false);
  const[nuevoRegNombre,setNuevoRegNombre]=useState("");
  const[nuevoPagoModal,setNuevoPagoModal]=useState(false);
  const[retiroModal,setRetiroModal]=useState(false);
  const[retiroMonto,setRetiroMonto]=useState("");
  const[retiroObs,setRetiroObs]=useState("");
  const[retiroFecha,setRetiroFecha]=useState(hoyLocal());
  const[retiroEmp,setRetiroEmp]=useState("");
  const[retiroBusy,setRetiroBusy]=useState(false);
  // Detalle de mercadería descargada (opcional — suma al stock igual que en Boletas)
  const[lineas,setLineas]=useState([]);// [{catalogoId,nombre,unidad,cantidad,proveedor}]
  const[lineaProdId,setLineaProdId]=useState("");
  const[lineaCant,setLineaCant]=useState("");

  // "Registrado por" usa la misma lista persistida de Empleados que Boletas (antes era una lista local que se perdía al recargar).
  const registradores=(empleados||[]).filter(e=>e.estado==="Activo");

  const productosCat=catalogo?[...catalogo].sort((a,b)=>a.producto.localeCompare(b.producto)):[];
  const productosSugeridos=prov?productosCat.filter(c=>norm(c.proveedor)===norm(prov)):[];
  const productosResto=prov?productosCat.filter(c=>norm(c.proveedor)!==norm(prov)):productosCat;

  const agregarLinea=()=>{
    if(!lineaProdId){toast("Elegí un producto");return;}
    if(!lineaCant||Number(lineaCant)<=0){toast("Ingresá la cantidad");return;}
    const prod=productosCat.find(c=>c.id===lineaProdId);
    if(!prod)return;
    if(lineas.some(l=>l.catalogoId===lineaProdId)){toast("Ese producto ya está en la lista");return;}
    setLineas([...lineas,{catalogoId:prod.id,nombre:prod.producto,unidad:prod.unidad||"unidades",cantidad:Number(lineaCant),proveedor:prod.proveedor}]);
    setLineaProdId("");setLineaCant("");
  };
  const quitarLinea=id=>setLineas(lineas.filter(l=>l.catalogoId!==id));

  const agregarRegistrador=async()=>{
    const nombre=nuevoRegNombre.trim();
    if(!nombre){toast("Ingresá un nombre");return;}
    if(registradores.some(r=>norm(r.nombre)===norm(nombre))){toast("Ya existe");setEmp(nombre);setNuevoRegNombre("");setNuevoRegModal(false);return;}
    const nuevo={id:uid(),nombre,apellido:"",dni:"",domicilio:"",telPropio:"",telContacto:"",estado:"Activo"};
    await saveEmpleados([...(empleados||[]),nuevo]);
    setEmp(nombre);setNuevoRegNombre("");setNuevoRegModal(false);
    toast("Agregado ✓");
  };

  const guardar=async()=>{
    if(!prov.trim()||!emp.trim()||!monto){toast("Completá todos los campos");return false;}
    if(forma==="Efectivo"&&Number(monto)>saldo){
      if(!confirm(`⚠️ Esto supera la caja disponible (${fmt(saldo)}) — va a quedar en ${fmt(saldo-Number(monto))}. ¿Confirmás igual?`))return false;
    }
    setBusy(true);
    const fechaISO=fechaLocalISO(fecha);
    const pagoBase={tipo:"pago",proveedor:prov.trim(),empleado:emp.trim(),monto:Number(monto),forma,obs:obs.trim(),fecha:fechaISO};
    await pagarConExcedente(pagoBase,pagos,savePagos);
    // Mercadería descargada (opcional): suma al stock igual que una boleta
    if(lineas.length>0&&saveStock&&stock){
      const stockActual=[...stock];
      lineas.forEach(linea=>{
        const idx=stockActual.findIndex(s=>s.catalogoId===linea.catalogoId);
        const mov={id:uid(),tipo:"entrada",origen:"pago",cantidad:linea.cantidad,obs:`Mercadería recibida — pago a ${prov.trim()}`,fecha:fechaISO};
        if(idx>=0){
          stockActual[idx]={...stockActual[idx],cantidad:stockActual[idx].cantidad+linea.cantidad,movimientos:[mov,...(stockActual[idx].movimientos||[])].slice(0,50)};
        }else{
          stockActual.push({id:uid(),catalogoId:linea.catalogoId,nombre:linea.nombre,proveedor:linea.proveedor,sector:"",cantidad:linea.cantidad,minimo:0,unidad:linea.unidad,movimientos:[mov],fecha:fechaISO});
        }
      });
      await saveStock(stockActual);
    }
    const nLineas=lineas.length;
    setBusy(false);setProv("");setEmp("");setMonto("");setObs("");setFecha(hoyLocal());setLineas([]);setLineaProdId("");setLineaCant("");
    toast("Pago registrado ✓"+(nLineas>0?` · ${nLineas} producto${nLineas!==1?"s":""} al stock`:""));
    return true;
  };

  // Retiro de efectivo para pagar sueldos: se carga como Gasto (categoría "Retiro para sueldos", forma
  // Efectivo) — eso descuenta la Caja Disponible una sola vez. Después, cada sueldo pagado con esa plata
  // se registra en Sueldos con forma "Retiro" y NO vuelve a descontar caja (ya salió antes).
  const guardarRetiro=async()=>{
    if(!retiroMonto){toast("Ingresá el monto retirado");return;}
    if(!retiroEmp.trim()){toast("Elegí quién retira");return;}
    if(Number(retiroMonto)>Number(saldo||0)){
      if(!confirm(`⚠️ Esto supera la caja disponible (${fmt(saldo)}) — va a quedar en ${fmt(Number(saldo||0)-Number(retiroMonto))}. ¿Confirmás igual?`))return;
    }
    setRetiroBusy(true);
    await saveGastos([...(gastos||[]),{id:uid(),tipo:"gasto",categoria:RETIRO_SUELDOS_CAT,monto:Number(retiroMonto),forma:"Efectivo",obs:retiroObs.trim(),registradoPor:retiroEmp.trim(),fecha:fechaLocalISO(retiroFecha)}]);
    setRetiroBusy(false);setRetiroModal(false);setRetiroMonto("");setRetiroObs("");setRetiroFecha(hoyLocal());setRetiroEmp("");
    toast("Retiro registrado ✓");
  };

  return(<>
    <ST help={"Registrá acá cuando pagás una deuda a un proveedor.\n\n• Efectivo: descuenta de la caja disponible Y de la deuda del proveedor. Si el monto supera lo disponible, te avisa y te deja confirmar igual (la caja queda en negativo).\n• Transferencia / Amex: solo descuenta la deuda del proveedor, no toca la caja ni el banco.\n• Amex es nuestra tarjeta de crédito — un pago con Amex queda cargado al resumen, no sale plata todavía. Cuando pagás el resumen de la tarjeta, eso se registra como un Gasto (Pagos Digitales) en la categoría Amex, en efectivo o transferencia según corresponda.\n• Si pagás de más a Avenida o Avenida Digital, el excedente se transfiere automáticamente al otro Avenida.\n• '💰 Retirar p/ sueldos' pide quién retira, además del monto, motivo y fecha — así queda quién sacó la plata de la caja.\n• El historial de pagos está al final de esta pantalla — ahí también aparecen mezclados, solo como referencia (🏦), los pagos por Transferencia: no suman a Debe/Haber ni al saldo corrido porque no son movimientos de efectivo."}>Registrar pago</ST><SS>Descuenta la deuda del proveedor. Efectivo también descuenta de caja.</SS>

    {nuevoRegModal&&(
      <div style={{position:"fixed",inset:0,background:"rgba(44,26,14,.65)",zIndex:500,display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
        <div style={{background:"#fff",borderRadius:"20px 20px 0 0",padding:"28px 20px 44px",width:"100%",maxWidth:460}}>
          <p style={{fontFamily:"Georgia,serif",fontSize:"1.1rem",marginBottom:16}}>Nueva persona</p>
          <input value={nuevoRegNombre} onChange={e=>setNuevoRegNombre(e.target.value)} placeholder="Nombre" autoFocus onKeyDown={e=>e.key==="Enter"&&agregarRegistrador()} style={{...iS,marginBottom:16}}/>
          <div style={{display:"flex",gap:10}}>
            <button onClick={()=>{setNuevoRegModal(false);setNuevoRegNombre("");}} style={{flex:1,padding:12,borderRadius:10,border:"none",background:"#E8DCC8",fontWeight:600,cursor:"pointer"}}>Cancelar</button>
            <button onClick={agregarRegistrador} style={{flex:1,padding:12,borderRadius:10,border:"none",background:"#2C1A0E",color:"#fff",fontWeight:600,cursor:"pointer"}}>Agregar</button>
          </div>
        </div>
      </div>
    )}

    <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:16,flexWrap:"wrap"}}>
      <div style={{background:"#2D6A4F",borderRadius:10,padding:"9px 14px",flex:1,minWidth:120}}>
        <div style={{fontSize:".58rem",letterSpacing:".06em",textTransform:"uppercase",color:"#EAF5F0",opacity:.85}}>Caja disponible</div>
        <div style={{fontFamily:"Georgia,serif",fontSize:"1.25rem",color:"#fff",lineHeight:1.15}}>{fmt(saldo)}</div>
      </div>
      <button onClick={()=>setNuevoPagoModal(true)} style={{padding:"13px 18px",border:"none",borderRadius:10,background:"#B7860B",color:"#fff",fontSize:".9rem",fontWeight:600,cursor:"pointer",whiteSpace:"nowrap",flexShrink:0}}>+ Pago a proveedor</button>
      {setTab&&<button onClick={()=>setTab("sueldos")} style={{padding:"13px 18px",border:"none",borderRadius:10,background:"#2C5F8A",color:"#fff",fontSize:".9rem",fontWeight:600,cursor:"pointer",whiteSpace:"nowrap",flexShrink:0}}>👤 Pagar sueldo</button>}
      <button onClick={()=>setRetiroModal(true)} style={{padding:"13px 18px",border:"none",borderRadius:10,background:"#8B5E3C",color:"#fff",fontSize:".9rem",fontWeight:600,cursor:"pointer",whiteSpace:"nowrap",flexShrink:0}}>💰 Retirar p/ sueldos</button>
    </div>

    {retiroModal&&(
      <div style={{position:"fixed",inset:0,background:"rgba(44,26,14,.65)",zIndex:500,display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
        <div style={{background:"#fff",borderRadius:"20px 20px 0 0",padding:"24px 20px 40px",width:"100%",maxWidth:460,maxHeight:"92dvh",overflowY:"auto"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
            <p style={{fontFamily:"Georgia,serif",fontSize:"1.1rem"}}>💰 Retirar efectivo para sueldos</p>
            <button onClick={()=>setRetiroModal(false)} style={{background:"none",border:"none",fontSize:"1.3rem",color:"#7B7063",cursor:"pointer",padding:4,lineHeight:1}}>✕</button>
          </div>
          <p style={{fontSize:".78rem",color:"#7B7063",marginBottom:16}}>Esto descuenta la caja disponible una sola vez (queda cargado como Gasto, categoría "Retiro para sueldos"). Después, cada sueldo que pagues con esta plata registralo en Sueldos con forma "Retiro" — así no se descuenta de nuevo.</p>
          <Field label="Monto retirado ($)"><Inp type="number" value={retiroMonto} onChange={setRetiroMonto} placeholder="0"/></Field>
          <Field label="Quién retira">
            <select value={retiroEmp} onChange={e=>setRetiroEmp(e.target.value)} style={sS}>
              <option value="">— Elegí —</option>
              {registradores.map(r=><option key={r.id} value={r.nombre}>{r.nombre}</option>)}
            </select>
          </Field>
          <Field label="Observaciones (opcional)"><TA value={retiroObs} onChange={setRetiroObs} placeholder="Ej: para pagar sueldos de la quincena"/></Field>
          <Field label="Fecha del retiro"><Inp type="date" value={retiroFecha} onChange={setRetiroFecha}/></Field>
          <div style={{display:"flex",gap:10,marginTop:8}}>
            <button onClick={()=>setRetiroModal(false)} style={{flex:1,padding:12,borderRadius:10,border:"none",background:"#E8DCC8",fontWeight:600,cursor:"pointer"}}>Cancelar</button>
            <button onClick={guardarRetiro} disabled={retiroBusy} style={{flex:1,padding:12,borderRadius:10,border:"none",background:"#B7860B",color:"#fff",fontWeight:600,cursor:"pointer"}}>{retiroBusy?"Guardando…":"Registrar retiro"}</button>
          </div>
        </div>
      </div>
    )}

    {nuevoPagoModal&&(
      <div style={{position:"fixed",inset:0,background:"rgba(44,26,14,.65)",zIndex:500,display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
        <div style={{background:"#fff",borderRadius:"20px 20px 0 0",padding:"24px 20px 40px",width:"100%",maxWidth:460,maxHeight:"92dvh",overflowY:"auto"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
            <p style={{fontFamily:"Georgia,serif",fontSize:"1.1rem"}}>Nuevo pago</p>
            <button onClick={()=>setNuevoPagoModal(false)} style={{background:"none",border:"none",fontSize:"1.3rem",color:"#7B7063",cursor:"pointer",padding:4,lineHeight:1}}>✕</button>
          </div>
          <Field label="Proveedor">
            <select value={prov} onChange={e=>setProv(e.target.value)} style={sS}>
              <option value="">— Elegí un proveedor —</option>
              {proveedores.filter(p=>p.estado!=="Inactivo").map(p=><option key={p.id} value={p.nombre}>{p.nombre}</option>)}
            </select>
          </Field>
          <Field label="Registrado por">
            <div style={{display:"flex",gap:8}}>
              <select value={emp} onChange={e=>setEmp(e.target.value)} style={{...sS,flex:1}}>
                <option value="">— Elegí —</option>
                {registradores.map(r=><option key={r.id} value={r.nombre}>{r.nombre}</option>)}
              </select>
              <button onClick={()=>setNuevoRegModal(true)} title="Agregar persona" style={{padding:"10px 14px",border:"1.5px solid #E8DCC8",borderRadius:8,background:"#F9F6F1",fontSize:"1.1rem",cursor:"pointer",flexShrink:0}}>+</button>
            </div>
          </Field>
          <Field label="Monto ($)"><Inp type="number" value={monto} onChange={setMonto} placeholder="0"/></Field>
          <Field label="Forma de pago">
            <select value={forma} onChange={e=>setForma(e.target.value)} style={sS}>
              <option value="Efectivo">Efectivo (descuenta de caja)</option>
              <option value="Transferencia">Transferencia (no descuenta caja)</option>
              <option value="Amex">Amex</option>
            </select>
          </Field>
          {forma==="Efectivo"&&<div style={{fontSize:".78rem",color:"#2D6A4F",background:"#EAF5F0",borderRadius:8,padding:"8px 10px",marginTop:8}}>💵 Este pago descontará de la caja disponible.</div>}
          {forma==="Amex"&&<div style={{fontSize:".78rem",color:"#B7860B",background:"#FEF9E7",borderRadius:8,padding:"8px 10px",marginTop:8}}>💳 No descuenta caja ni banco — queda cargado al resumen de la tarjeta.</div>}
          <Field label="Observaciones"><TA value={obs} onChange={setObs} placeholder="Ej: pago parcial, boleta #..."/></Field>
          <Field label="Fecha del registro"><Inp type="date" value={fecha} onChange={setFecha}/></Field>

          {/* MERCADERÍA DESCARGADA (opcional) */}
          <div style={{marginTop:16,borderTop:"1px solid #F2EAE0",paddingTop:16}}>
            <div style={{fontSize:".78rem",fontWeight:700,color:"#2C1A0E",marginBottom:10}}>📦 Mercadería descargada <span style={{fontWeight:400,color:"#7B7063"}}>(opcional — suma al stock automáticamente)</span></div>
            <div style={{display:"flex",gap:6,alignItems:"flex-end",marginBottom:10}}>
              <div style={{flex:1}}>
                <select value={lineaProdId} onChange={e=>setLineaProdId(e.target.value)} style={{...sS,fontSize:".78rem"}}>
                  <option value="">— Producto —</option>
                  {productosSugeridos.length>0&&<optgroup label={`✓ De ${prov}`}>{productosSugeridos.map(c=><option key={c.id} value={c.id}>{c.producto}</option>)}</optgroup>}
                  {productosResto.length>0&&<optgroup label="Otros productos">{productosResto.map(c=><option key={c.id} value={c.id}>{c.producto} ({c.proveedor})</option>)}</optgroup>}
                </select>
              </div>
              <div style={{width:72}}>
                <input type="number" min="0" value={lineaCant} onChange={e=>setLineaCant(e.target.value)} placeholder="Cant." style={{...iS,fontSize:".82rem",textAlign:"center"}}/>
              </div>
              <button onClick={agregarLinea} style={{padding:"10px 12px",border:"none",borderRadius:8,background:"#2C1A0E",color:"#fff",fontWeight:700,fontSize:"1rem",cursor:"pointer",flexShrink:0}}>+</button>
            </div>
            {lineas.length>0&&(
              <div style={{background:"#F9F6F1",borderRadius:10,overflow:"hidden"}}>
                {lineas.map(l=>(
                  <div key={l.catalogoId} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 12px",borderBottom:"1px solid #F2EAE0"}}>
                    <span style={{flex:1,fontSize:".82rem",color:"#2C1A0E"}}>{l.nombre}</span>
                    <span style={{fontSize:".82rem",fontWeight:700,color:"#2D6A4F"}}>{l.cantidad} {l.unidad}</span>
                    <button onClick={()=>quitarLinea(l.catalogoId)} style={{background:"none",border:"none",color:"#C0392B",fontSize:".8rem",cursor:"pointer",padding:"0 4px"}}>✕</button>
                  </div>
                ))}
                <div style={{padding:"8px 12px",fontSize:".72rem",color:"#7B7063"}}>
                  {lineas.length} producto{lineas.length!==1?"s":""} · suman al stock al guardar
                </div>
              </div>
            )}
          </div>

          <Btn bg="#B7860B" onClick={async()=>{if(await guardar())setNuevoPagoModal(false);}} disabled={busy}>{busy?"Guardando…":"Registrar pago"}</Btn>
        </div>
      </div>
    )}

    {/* REGISTRO DE PAGOS */}
    <UltimosPagos pagos={pagos} cierres={cierres} cajaInicial={cajaInicial} cierresCaja={cierresCaja} sueldos={sueldos} gastos={gastos} ajustesCajaEfectivo={ajustesCajaEfectivo}/>
  </>);
}


function UltimosPagos({pagos,cierres,cajaInicial,cierresCaja,sueldos,gastos,ajustesCajaEfectivo}){
  const hoy=new Date();
  const iso=d=>d.toISOString().slice(0,10);
  const inicioMes=new Date(hoy.getFullYear(),hoy.getMonth(),1);
  const[filtroFecha,setFiltroFecha]=useState("mes");
  const[desde,setDesde]=useState(iso(inicioMes));
  const[hasta,setHasta]=useState(iso(hoy));
  const[filtroTipo,setFiltroTipo]=useState("todos");

  // Todos los pagos en efectivo
  const pagosEf    = (pagos||[]).filter(p=>p.forma==="Efectivo");
  const sueldosEf  = (sueldos||[]).filter(s=>s.forma==="Efectivo");
  const gastosEf   = (gastos||[]).filter(g=>g.forma==="Efectivo");
  const cierresEf  = (cierres||[]).map(c=>({...c,_cat:"cierre",_signo:1,proveedor:"Cierre "+c.turno}));
  const cierresNEf = (cierresCaja||[]).map(c=>({...c,_cat:"cierre",_signo:1,proveedor:"Cierre "+c.turno,monto:c.efectivo}));
  // Ajustes manuales de caja (ver Admin > Ajuste de caja disponible). Sin esto, el saldo de este libro
  // diario quedaba desincronizado del número de "Caja Disponible" (que sí los suma en calcSaldo()).
  const ajustesEf  = (ajustesCajaEfectivo||[]).map(a=>({...a,_cat:"ajuste",_signo:Number(a.monto||0)>=0?1:-1,proveedor:"Ajuste de caja",obs:a.motivo,monto:Math.abs(Number(a.monto||0))}));
  // Pagos a proveedores hechos por Transferencia (digital): solo para visualizar acá mezclados con el
  // resto — NO son movimientos de efectivo, así que _signo:0 hace que no sumen a Debe/Haber ni al saldo
  // corrido de este libro (que es 100% de Caja Disponible en efectivo).
  const pagosDig   = (pagos||[]).filter(p=>p.forma==="Transferencia").map(p=>({...p,_cat:"pagoDigital",_signo:0}));

  const egresos = [
    ...pagosEf.map(p=>({...p,_cat:"pago",  _signo:-1})),
    ...sueldosEf.map(s=>({...s,_cat:"sueldo",_signo:-1,proveedor:s.empleado+" · "+(s.concepto||"Sueldo")})),
    ...gastosEf.map(g=>({...g,_cat:"gasto", _signo:-1,proveedor:g.categoria})),
  ];
  const ingresos = [...cierresEf,...cierresNEf].map(c=>({...c,_signo:1}));
  const allMovs  = [...egresos,...ingresos,...ajustesEf,...pagosDig].sort((a,b)=>a.fecha.localeCompare(b.fecha));

  // Aplicar filtro de fechas
  const desdeF = filtroFecha==="mes" ? iso(inicioMes) : filtroFecha==="hoy" ? iso(hoy) : desde;
  const hastaF = filtroFecha==="mes" ? iso(hoy)       : filtroFecha==="hoy" ? iso(hoy) : hasta;
  const filtrados = allMovs.filter(m=>{
    const f=m.fecha.slice(0,10);
    return(!desdeF||f>=desdeF)&&(!hastaF||f<=hastaF);
  });

  // Saldo base = cajaInicial + todo lo anterior al filtro
  let saldoBase = Number(cajaInicial)||0;
  allMovs.filter(m=>!desdeF||m.fecha.slice(0,10)<desdeF).forEach(m=>{
    saldoBase += m._signo * Number(m.monto||0);
  });

  // Filas con saldo acumulado (calculado asc, mostrado desc)
  const filtradosAsc = [...filtrados].sort((a,b)=>a.fecha.localeCompare(b.fecha));
  let saldoAcum = saldoBase;
  const filasAsc = filtradosAsc.map(m=>{
    const delta = m._signo * Number(m.monto||0);
    saldoAcum += delta;
    return {...m,_delta:delta,_saldo:saldoAcum};
  });
  const filas = [...filasAsc].reverse().filter(f=>{
    if(filtroTipo==="debe") return f._signo<0&&f._cat!=="ajuste"&&f._cat!=="pagoDigital";
    if(filtroTipo==="haber") return f._signo>0&&f._cat!=="ajuste"&&f._cat!=="pagoDigital";
    return true;
  });

  // Los ajustes de caja no son ingresos ni egresos reales (no hubo una venta ni un pago) — son una
  // corrección del saldo contado. Se muestran aparte, no suman a Ingresos/Egresos ni aparecen en Debe/Haber.
  const totalIngresos = filasAsc.filter(f=>f._signo>0&&f._cat!=="ajuste").reduce((s,f)=>s+f._delta,0);
  const totalEgresos  = filasAsc.filter(f=>f._signo<0&&f._cat!=="ajuste").reduce((s,f)=>s+Math.abs(f._delta),0);
  const totalAjustes  = filasAsc.filter(f=>f._cat==="ajuste").reduce((s,f)=>s+f._delta,0);
  const neto = totalIngresos - totalEgresos + totalAjustes;
  const iconoCat = c=>c==="cierre"?"💵":c==="sueldo"?"👤":c==="gasto"?"🏠":c==="ajuste"?"⚖️":c==="pagoDigital"?"🏦":"💸";

  return(
    <div style={{background:"#fff",borderRadius:14,padding:20,boxShadow:"0 2px 12px rgba(44,26,14,.08)",marginTop:16}}>
      <div style={{fontSize:".68rem",fontWeight:700,letterSpacing:".09em",textTransform:"uppercase",color:"#7B7063",marginBottom:14}}>📒 Libro diario · Efectivo</div>

      {/* FILTROS FECHA */}
      <div style={{display:"flex",gap:6,marginBottom:10,flexWrap:"wrap"}}>
        {[["hoy","Hoy"],["mes","Este mes"],["custom","Personalizado"]].map(([v,l])=>(
          <button key={v} onClick={()=>{setFiltroFecha(v);if(v==="mes"){setDesde(iso(inicioMes));setHasta(iso(hoy));}if(v==="hoy"){setDesde(iso(hoy));setHasta(iso(hoy));}}} style={{padding:"5px 12px",borderRadius:20,border:"none",cursor:"pointer",fontSize:".72rem",fontWeight:600,background:filtroFecha===v?"#2C1A0E":"#E8DCC8",color:filtroFecha===v?"#E8DCC8":"#2C1A0E"}}>{l}</button>
        ))}
      </div>
      {filtroFecha==="custom"&&(
        <div style={{display:"flex",gap:8,marginBottom:10}}>
          <div style={{flex:1}}>
            <label style={{display:"block",fontSize:".7rem",fontWeight:600,color:"#7B7063",marginBottom:3}}>Desde</label>
            <input type="date" value={desde} onChange={e=>setDesde(e.target.value)} style={{...iS,fontSize:".82rem",padding:"7px 10px"}}/>
          </div>
          <div style={{flex:1}}>
            <label style={{display:"block",fontSize:".7rem",fontWeight:600,color:"#7B7063",marginBottom:3}}>Hasta</label>
            <input type="date" value={hasta} onChange={e=>setHasta(e.target.value)} style={{...iS,fontSize:".82rem",padding:"7px 10px"}}/>
          </div>
        </div>
      )}

      {/* FILTROS TIPO */}
      <div style={{display:"flex",gap:6,marginBottom:14}}>
        {[["todos","Todos"],["debe","💸 Solo Debe"],["haber","💵 Solo Haber"]].map(([v,l])=>(
          <button key={v} onClick={()=>setFiltroTipo(v)} style={{flex:1,padding:"5px 8px",borderRadius:20,border:"none",cursor:"pointer",fontSize:".72rem",fontWeight:600,
            background:filtroTipo===v?(v==="debe"?"#C0392B":v==="haber"?"#2D6A4F":"#2C1A0E"):"#E8DCC8",
            color:filtroTipo===v?"#fff":"#2C1A0E"}}>{l}</button>
        ))}
      </div>



      {/* TABLA */}
      {!filas.length?<Empty icon="📒">Sin movimientos en efectivo en el período</Empty>:(
        <div style={{overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:".75rem",minWidth:380}}>
            <thead>
              <tr style={{background:"#F9F6F1"}}>
                {["Fecha","Concepto","Debe","Haber","Saldo"].map(h=>(
                  <th key={h} style={{padding:"7px 8px",textAlign:h==="Fecha"||h==="Concepto"?"left":"right",fontWeight:700,color:"#7B7063",fontSize:".63rem",letterSpacing:".05em",textTransform:"uppercase",borderBottom:"2px solid #E8DCC8",whiteSpace:"nowrap"}}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>

              {filas.map((f,i)=>(
                <tr key={f.id+i} style={{background:i%2===0?"#fff":"#F9F6F1"}}>
                  <td style={{padding:"6px 8px",whiteSpace:"nowrap",color:"#7B7063",fontSize:".72rem"}}>
                    {fmtF(f.fecha)}<br/><span style={{fontSize:".62rem"}}>{fmtH(f.fecha)}</span>
                  </td>
                  <td style={{padding:"6px 8px"}}>
                    <div style={{display:"flex",alignItems:"center",gap:5}}>
                      <span style={{flexShrink:0}}>{iconoCat(f._cat)}</span>
                      <div style={{minWidth:0}}>
                        <div style={{fontWeight:600,fontSize:".76rem",lineHeight:1.3}}>{f.proveedor||"—"}</div>
                        {f._cat==="ajuste"?(
                          <div style={{fontSize:".63rem",color:f._signo>0?"#2D6A4F":"#C0392B",fontWeight:700}}>{f._signo>0?"+":"-"}{fmt(Math.abs(f._delta))} · corrección de saldo{f.obs?" · "+f.obs:""}</div>
                        ):f._cat==="pagoDigital"?(
                          <div style={{fontSize:".63rem",color:"#B7860B",fontWeight:700}}>🏦 {fmt(f.monto)} por transferencia · no afecta el efectivo{f.obs?" · "+f.obs:""}</div>
                        ):(f.obs&&<div style={{fontSize:".63rem",color:"#7B7063",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",maxWidth:100}}>{f.obs}</div>)}
                      </div>
                    </div>
                  </td>
                  <td style={{padding:"6px 8px",textAlign:"right",color:"#C0392B",fontWeight:700,whiteSpace:"nowrap"}}>
                    {f._cat!=="ajuste"&&f._signo<0?fmt(Math.abs(f._delta)):""}
                  </td>
                  <td style={{padding:"6px 8px",textAlign:"right",color:"#2D6A4F",fontWeight:700,whiteSpace:"nowrap"}}>
                    {f._cat!=="ajuste"&&f._signo>0?fmt(f._delta):""}
                  </td>
                  <td style={{padding:"6px 8px",textAlign:"right",fontWeight:700,whiteSpace:"nowrap",color:f._saldo>=0?"#2C1A0E":"#C0392B"}}>{fmt(f._saldo)}</td>
                </tr>
              ))}
              <tr style={{background:"#2C1A0E"}}>
                <td colSpan={2} style={{padding:"8px 10px",color:"#E8DCC8",fontWeight:700,fontSize:".76rem"}}>TOTALES</td>
                <td style={{padding:"8px",textAlign:"right",color:"#f5b7b1",fontWeight:700,whiteSpace:"nowrap"}}>{fmt(totalEgresos)}</td>
                <td style={{padding:"8px",textAlign:"right",color:"#a9dfbf",fontWeight:700,whiteSpace:"nowrap"}}>{fmt(totalIngresos)}</td>
                <td style={{padding:"8px",textAlign:"right",fontWeight:700,whiteSpace:"nowrap",color:neto>=0?"#a9dfbf":"#f5b7b1"}}>{fmt(saldoBase+neto)}</td>
              </tr>
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

function TabProveedores({proveedores,saveProveedores,calcDeuda,pagos,savePagos,boletas,saveBoletas,gastos,saveGastos,catalogoStock,saveCatalogoStock,stock,saveStock,askPass}){
  const[nombre,setNombre]=useState("");const[deuda,setDeuda]=useState("");
  const[obs,setObs]=useState("");const[busy,setBusy]=useState(false);
  const[filtroNombre,setFiltroNombre]=useState("");
  const[provSel,setProvSel]=useState("");
  const[desdeDet,setDesdeDet]=useState("");
  const[hastaDet,setHastaDet]=useState("");
  const[mostrarForm,setMostrarForm]=useState(false);
  const[verInactivos,setVerInactivos]=useState(false);
  const[mostrarFusion,setMostrarFusion]=useState(false);
  const[fusionOrigen,setFusionOrigen]=useState("");
  const[fusionDestino,setFusionDestino]=useState("");
  const[fusionBusy,setFusionBusy]=useState(false);

  const provEditando=nombre?proveedores.find(p=>norm(p.nombre)===norm(nombre)):null;

  const guardar=async()=>{
    if(!nombre.trim()){toast("Ingresá el nombre");return;}
    const idx=proveedores.findIndex(p=>norm(p.nombre)===norm(nombre));
    if(idx<0){
      const parecido=proveedorParecido(nombre,proveedores);
      if(parecido&&!confirm(`Ya existe un proveedor parecido: "${parecido.nombre}". ¿"${nombre.trim()}" es realmente distinto? Cancelá si es el mismo y elegilo de la lista para no duplicar su deuda.`))return;
    }
    setBusy(true);
    let nuevos;
    if(idx>=0){
      const anterior=Number(proveedores[idx].deudaInicial)||0;
      const nuevoValor=Number(deuda)||0;
      let historialDeuda=proveedores[idx].historialDeuda||[];
      if(anterior!==nuevoValor)historialDeuda=[{fecha:new Date().toISOString(),anterior,nuevo:nuevoValor},...historialDeuda];
      nuevos=proveedores.map((p,i)=>i===idx?{...p,deudaInicial:nuevoValor,obs:obs.trim(),historialDeuda}:p);
      toast("Actualizado ✓");
    }
    else{nuevos=[...proveedores,{id:uid(),nombre:nombre.trim(),deudaInicial:Number(deuda)||0,obs:obs.trim(),fecha:new Date().toISOString()}];toast("Guardado ✓");}
    await saveProveedores(nuevos);setBusy(false);setNombre("");setDeuda("");setObs("");setMostrarForm(false);
  };
  const eliminar=async id=>{
    const p=proveedores.find(x=>x.id===id);
    const d=p?calcDeuda(p.nombre):null;
    const pendiente=d?d.pendiente:0;
    const msg=pendiente>0
      ?`Este proveedor tiene una deuda pendiente de ${fmt(pendiente)}. Si lo eliminás, esa deuda deja de aparecer en el total (las boletas y pagos no se borran, pero dejás de verla acá). ¿Eliminar igual?`
      :"¿Eliminar? Los pagos no se borran.";
    if(!confirm(msg))return;
    await saveProveedores(proveedores.filter(x=>x.id!==id));toast("Eliminado");
  };
  const editar=p=>{setNombre(p.nombre);setDeuda(String(p.deudaInicial||""));setObs(p.obs||"");setMostrarForm(true);};
  const abrirNuevo=()=>{setNombre("");setDeuda("");setObs("");setMostrarForm(true);};
  const toggleActivo=async p=>{
    const nuevoEstado=p.estado==="Inactivo"?"Activo":"Inactivo";
    await saveProveedores(proveedores.map(x=>x.id===p.id?{...x,estado:nuevoEstado}:x));
    toast(nuevoEstado==="Inactivo"?"Proveedor ocultado ✓":"Proveedor activado ✓");
  };

  const fusionar=async()=>{
    if(!fusionOrigen||!fusionDestino){toast("Elegí los dos proveedores");return;}
    if(norm(fusionOrigen)===norm(fusionDestino)){toast("Elegí dos proveedores distintos");return;}
    const origenObj=proveedores.find(p=>norm(p.nombre)===norm(fusionOrigen));
    const destinoObj=proveedores.find(p=>norm(p.nombre)===norm(fusionDestino));
    if(!origenObj||!destinoObj){toast("Proveedor no encontrado");return;}
    if(!confirm(`Vas a fusionar "${origenObj.nombre}" dentro de "${destinoObj.nombre}". Todas sus boletas, pagos y gastos van a pasar a nombre de "${destinoObj.nombre}", y su deuda inicial se suma. "${origenObj.nombre}" se elimina como proveedor. Esta acción no se puede deshacer. ¿Continuar?`))return;
    setFusionBusy(true);
    const nombreDestino=destinoObj.nombre;
    if(saveBoletas&&boletas.some(b=>norm(b.proveedor)===norm(origenObj.nombre)))
      await saveBoletas(boletas.map(b=>norm(b.proveedor)===norm(origenObj.nombre)?{...b,proveedor:nombreDestino}:b));
    if(savePagos&&pagos.some(x=>norm(x.proveedor)===norm(origenObj.nombre)))
      await savePagos(pagos.map(x=>norm(x.proveedor)===norm(origenObj.nombre)?{...x,proveedor:nombreDestino}:x));
    if(saveGastos&&(gastos||[]).some(g=>g.proveedor&&norm(g.proveedor)===norm(origenObj.nombre)))
      await saveGastos((gastos||[]).map(g=>g.proveedor&&norm(g.proveedor)===norm(origenObj.nombre)?{...g,proveedor:nombreDestino}:g));
    if(catalogoStock&&saveCatalogoStock&&catalogoStock.some(c=>norm(c.proveedor)===norm(origenObj.nombre)))
      await saveCatalogoStock(catalogoStock.map(c=>norm(c.proveedor)===norm(origenObj.nombre)?{...c,proveedor:nombreDestino}:c));
    if(stock&&saveStock&&stock.some(s=>norm(s.proveedor)===norm(origenObj.nombre)))
      await saveStock(stock.map(s=>norm(s.proveedor)===norm(origenObj.nombre)?{...s,proveedor:nombreDestino}:s));
    const anteriorDeuda=Number(destinoObj.deudaInicial)||0;
    const nuevaDeudaInicial=anteriorDeuda+(Number(origenObj.deudaInicial)||0);
    const historialDeuda=[{fecha:new Date().toISOString(),anterior:anteriorDeuda,nuevo:nuevaDeudaInicial,nota:`Fusión con "${origenObj.nombre}"`},...(destinoObj.historialDeuda||[])];
    const nuevosProveedores=proveedores.filter(p=>p.id!==origenObj.id).map(p=>p.id===destinoObj.id?{...p,deudaInicial:nuevaDeudaInicial,historialDeuda}:p);
    await saveProveedores(nuevosProveedores);
    setFusionBusy(false);setMostrarFusion(false);setFusionOrigen("");setFusionDestino("");
    toast(`Fusionado: "${origenObj.nombre}" ahora es "${destinoObj.nombre}" ✓`);
  };

  const sorted=proveedores.map(p=>{
    const d=calcDeuda(p.nombre);
    const fechas=[
      ...boletas.filter(b=>norm(b.proveedor)===norm(p.nombre)).map(b=>b.fecha),
      ...pagos.filter(x=>norm(x.proveedor)===norm(p.nombre)).map(x=>x.fecha),
      ...(gastos||[]).filter(g=>g.proveedor&&norm(g.proveedor)===norm(p.nombre)).map(g=>g.fecha)
    ];
    const ultima=fechas.length?fechas.reduce((a,b)=>a>b?a:b):null;
    return{...p,_p:d?d.pendiente:0,_i:d?d.totalDeuda:0,_pagado:d?d.pagado:0,_ultima:ultima};
  }).sort((a,b)=>b._p-a._p);
  const totalPendienteGlobal=sorted.reduce((s,p)=>s+Math.max(0,p._p),0);
  const inactivosCount=sorted.filter(p=>p.estado==="Inactivo").length;
  const baseVisible=verInactivos?sorted:sorted.filter(p=>p.estado!=="Inactivo");
  const filtrados=baseVisible.filter(p=>!filtroNombre||norm(p.nombre).includes(norm(filtroNombre)));

  // Estado de cuenta del proveedor seleccionado
  const provObj=provSel?proveedores.find(p=>norm(p.nombre)===norm(provSel)):null;
  const infoSel=provObj?calcDeuda(provObj.nombre):null;
  const boletasSel=provSel?boletas.filter(b=>norm(b.proveedor)===norm(provSel)).map(b=>({...b,_tipo:"boleta"})):[];
  const pagosSel=provSel?pagos.filter(p=>norm(p.proveedor)===norm(provSel)).map(p=>({...p,_tipo:"pago"})):[];
  const gastosSel=provSel?(gastos||[]).filter(g=>g.proveedor&&norm(g.proveedor)===norm(provSel)).map(g=>({...g,_tipo:"gasto",obs:g.obs||`Pago digital · ${g.categoria||""}`})):[];
  const movSel=[...boletasSel,...pagosSel,...gastosSel]
    .filter(m=>{
      const f=m.fecha.slice(0,10);
      return(!desdeDet||f>=desdeDet)&&(!hastaDet||f<=hastaDet);
    })
    .sort((a,b)=>a.fecha.localeCompare(b.fecha));

  // Saldo acumulado (se calcula en orden cronológico ascendente para que el saldo corrido sea correcto)
  let saldoAcum=infoSel?infoSel.deudaInicial:0;
  const movConSaldo=movSel.map(m=>{
    if(m._tipo==="boleta") saldoAcum+=Number(m.monto)||0;
    else saldoAcum-=Number(m.monto)||0;
    return{...m,_saldo:saldoAcum};
  });
  // Para mostrar: lo más reciente primero (el saldo ya viene calculado arriba, acá solo se invierte el orden visual)
  const movParaMostrar=[...movConSaldo].reverse();

  const exportarEstadoCuenta=()=>{
    if(!provSel){toast("Elegí un proveedor primero");return;}
    const rows=[["Fecha","Tipo","Detalle","Cargo","Pago","Saldo"]];
    if(infoSel&&infoSel.deudaInicial) rows.push(["-","Deuda inicial","",infoSel.deudaInicial,"",infoSel.deudaInicial]);
    movConSaldo.forEach(m=>{
      const cargo=m._tipo==="boleta"?m.monto:"";
      const pago =m._tipo!=="boleta"?m.monto:"";
      rows.push([fmtF(m.fecha),m._tipo==="boleta"?"Boleta":m.forma,m.obs||"",cargo,pago,m._saldo.toFixed(2)]);
    });
    const csv=rows.map(r=>r.map(v=>`"${String(v||"").replace(/"/g,'""')}"`).join(",")).join("\n");
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8;"}));
    a.download=`estado_cuenta_${provSel.replace(/\s+/g,"_")}.csv`;a.click();
  };

  return(<>
    <ST help={"Muestra el estado de cuenta de cada proveedor: cuánto se le debe en total.\n\n• La deuda = suma de boletas − pagos. Los pagos incluyen tanto los cargados en 💸 Pagos como los pagos digitales de 🏠 Pagos Digitales que tengan este proveedor asignado (ej: le pagaste por transferencia desde ahí en vez de por Pagos).\n• Podés ver el detalle de movimientos de cada proveedor tocando su nombre — ahí aparecen boletas, pagos y pagos digitales mezclados en orden cronológico.\n• Usá el botón + Nuevo proveedor para agregar uno, o el ✏️ de cada fila para editarlo.\n• Si al crear un proveedor (acá o al cargar una boleta/producto) el nombre se parece mucho a uno que ya existe, la app te avisa para evitar duplicarlo por error.\n• 🔀 Fusionar: si dos proveedores quedaron cargados con nombres distintos siendo el mismo, usá este botón para unirlos — todas sus boletas, pagos y gastos pasan al que elijas como destino, la deuda inicial se suma, y el otro se elimina. No se puede deshacer.\n• Si editás la deuda inicial de un proveedor que ya tenía una cargada, queda un historial del cambio (fecha, valor anterior y nuevo) visible al editarlo.\n• Cuando un proveedor quedó con saldo a favor (le pagaste de más), se muestra en azul como \"💰 A favor\" en vez de plata pendiente.\n• La columna Última act. muestra la fecha del movimiento (boleta, pago o gasto) más reciente de cada proveedor.\n• Si eliminás un proveedor que tiene deuda pendiente, la app te avisa antes de confirmar.\n• 🚫 Activos e inactivos: los proveedores inactivos quedan ocultos de la lista (y no aparecen para elegir al cargar una boleta o un pago nuevo), pero su deuda sigue contando en el total y no se pierde nada de su historial. Tocá 👁️ Ver inactivos para volver a verlos, y ✅ en la fila para reactivarlos."}>Proveedores</ST><SS>Estado de cuenta y deuda por proveedor.</SS>

    {mostrarForm&&(

        <div style={{background:"#fff",borderRadius:20,padding:"24px 20px 32px",width:"100%",maxWidth:460,maxHeight:"85vh",overflowY:"auto"}}>

          <Field label="Nombre"><Inp value={nombre} onChange={setNombre} placeholder="Ej: UTENSILIOS"/></Field>
          <Field label="Deuda inicial"><Inp type="number" value={deuda} onChange={setDeuda} placeholder="0"/></Field>
          <Field label="Observaciones (opcional)"><TA value={obs} onChange={setObs} placeholder="Notas sobre este proveedor"/></Field>
          {provEditando&&provEditando.historialDeuda&&provEditando.historialDeuda.length>0&&(
            <div style={{background:"#F9F6F1",borderRadius:8,padding:"8px 10px",marginBottom:12,maxHeight:120,overflowY:"auto"}}>
              <div style={{fontSize:".62rem",fontWeight:700,letterSpacing:".05em",textTransform:"uppercase",color:"#7B7063",marginBottom:4}}>Historial de deuda inicial</div>
              {provEditando.historialDeuda.map((h,i)=>(
                <div key={i} style={{fontSize:".68rem",color:"#7B7063",marginBottom:2}}>{fmtFL(h.fecha)}: {fmt(h.anterior)} → {fmt(h.nuevo)}{h.nota?` (${h.nota})`:""}</div>

          )}
          <div style={{display:"flex",gap:8,marginTop:18}}>
            <button onClick={()=>{setMostrarForm(false);setNombre("");setDeuda("");setObs("");}} style={{flex:1,padding:13,borderRadius:10,border:"none",background:"#E8DCC8",fontWeight:600,cursor:"pointer"}}>Cancelar</button>
            <Btn bg="#2C1A0E" onClick={guardar} disabled={busy}>{busy?"Guardando…":"Guardar"}</Btn>
          </div>
        </div>

    {mostrarFusion&&(
      <div style={{position:"fixed",inset:0,background:"rgba(44,26,14,.65)",zIndex:500,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>

    {/* ESTADO DE CUENTA */}

        {/* TABLA */}

              {!movParaMostrar.length&&!(infoSel&&infoSel.deudaInicial!==0)&&<tr><td colSpan={6} style={{textAlign:"center",padding:"20px",color:"#7B7063"}}>Sin movimientos en el período</td></tr>}
              {movParaMostrar.map((m,i)=>{
                const esBol=m._tipo==="boleta";
                const bg=i%2===0?"#fff":"#F9F6F1";
                return(
                  <tr key={m.id} style={{background:bg}}>
                    <td style={{padding:"7px 8px",whiteSpace:"nowrap",color:"#7B7063"}}>{fmtF(m.fecha)}</td>
                    <td style={{padding:"7px 8px"}}>
                      <span style={{background:esBol?"#FFF0EF":"#EAF5F0",color:esBol?"#C0392B":"#2D6A4F",borderRadius:4,padding:"2px 6px",fontSize:".68rem",fontWeight:700,whiteSpace:"nowrap"}}>
                        {esBol?"Boleta":m.forma}
                      </span>
                    </td>
                    <td style={{padding:"7px 8px",color:"#7B7063",maxWidth:120,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}} title={m.obs||""}>{m.obs||"—"}</td>
                    <td style={{padding:"7px 8px",textAlign:"right",color:"#C0392B",fontWeight:esBol?600:400}}>{esBol?fmt(m.monto):"—"}</td>
                    <td style={{padding:"7px 8px",textAlign:"right",color:"#2D6A4F",fontWeight:!esBol?600:400}}>{!esBol?fmt(m.monto):"—"}</td>
                    <td style={{padding:"7px 8px",textAlign:"right",fontWeight:700,color:m._saldo>0?"#C0392B":"#2D6A4F"}}>{fmt(m._saldo)}</td>
                  </tr>

              })}
              {infoSel&&infoSel.deudaInicial!==0&&(
                <tr style={{background:"#FEF9E7"}}>
                  <td style={{padding:"7px 8px",color:"#7B7063",whiteSpace:"nowrap"}}>—</td>
                  <td style={{padding:"7px 8px"}}><span style={{background:"#E8DCC8",borderRadius:4,padding:"2px 6px",fontSize:".68rem",fontWeight:700}}>Inicial</span></td>
                  <td style={{padding:"7px 8px",color:"#7B7063",maxWidth:120,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>Deuda inicial</td>
                  <td style={{padding:"7px 8px",textAlign:"right",color:"#C0392B",fontWeight:600}}>{fmt(infoSel.deudaInicial)}</td>
                  <td style={{padding:"7px 8px",textAlign:"right"}}>—</td>
                  <td style={{padding:"7px 8px",textAlign:"right",fontWeight:700,color:"#C0392B"}}>{fmt(infoSel.deudaInicial)}</td>
                </tr>
              )}
            </tbody>
          </table>
        </div>
        <div style={{display:"flex",gap:8,marginTop:14}}>
          <button onClick={exportarEstadoCuenta} style={{flex:1,padding:10,borderRadius:10,border:"none",background:"#E8DCC8",color:"#2C1A0E",fontWeight:600,fontSize:".82rem",cursor:"pointer"}}>⬇ Exportar CSV</button>
          <button onClick={()=>{setProvSel("");setDesdeDet("");setHastaDet("");}} style={{padding:10,borderRadius:10,border:"none",background:"#F9F6F1",color:"#7B7063",fontWeight:600,fontSize:".82rem",cursor:"pointer"}}>Limpiar</button>
        </div>

    {/* BUSCADOR + LISTA */}
    <div style={{marginBottom:12}}>
      <input value={filtroNombre} onChange={e=>setFiltroNombre(e.target.value)} placeholder="🔍 Buscar proveedor..." style={{...iS,fontSize:".85rem"}}/>
    </div>
    {inactivosCount>0&&(
      <div style={{marginBottom:12}}>
        <button onClick={()=>setVerInactivos(v=>!v)} style={{padding:"6px 12px",borderRadius:20,border:"1px solid #E8DCC8",cursor:"pointer",fontSize:".72rem",fontWeight:600,background:verInactivos?"#2C1A0E":"transparent",color:verInactivos?"#E8DCC8":"#7B7063"}}>
          {verInactivos?"🙈 Ocultar inactivos":`👁️ Ver inactivos (${inactivosCount})`}
        </button>

    )}

    {!filtrados.length?<Empty icon="🏪">Sin resultados</Empty>:(
      <div style={{background:"#fff",borderRadius:14,padding:16,boxShadow:"0 2px 12px rgba(44,26,14,.08)"}}>
        <div style={{overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:".78rem",minWidth:340}}>
            <thead>
              <tr style={{background:"#F9F6F1"}}>
                {["Proveedor","Última act.","Pendiente",""].map(h=>(
                  <th key={h||"acc"} style={{padding:"7px 8px",textAlign:h==="Pendiente"?"right":h===""?"center":h==="Última act."?"center":"left",fontWeight:700,color:"#7B7063",fontSize:".63rem",letterSpacing:".05em",textTransform:"uppercase",borderBottom:"2px solid #E8DCC8",whiteSpace:"nowrap"}}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {filtrados.map((p,i)=>{
                const esCredito=p._p<0;
                const sal=p._p===0;
                const inactivo=p.estado==="Inactivo";
                return(
                  <tr key={p.id} onClick={()=>{setProvSel(p.nombre);setDesdeDet("");setHastaDet("");window.scrollTo({top:0,behavior:"smooth"});}}
                    style={{background:i%2===0?"#fff":"#F9F6F1",cursor:"pointer",opacity:inactivo?.55:1}}>
                    <td style={{padding:"6px 8px"}}>
                      <div style={{fontWeight:600,fontSize:".8rem",display:"flex",alignItems:"center",gap:6}}>

                      </div>
                      {p.obs&&<div style={{fontSize:".65rem",color:"#7B7063",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",maxWidth:220}}>{p.obs}</div>}
                    </td>
                    <td style={{padding:"6px 8px",textAlign:"center",color:"#7B7063",fontSize:".72rem",whiteSpace:"nowrap"}}>{p._ultima?fmtF(p._ultima):"—"}</td>
                    <td style={{padding:"6px 8px",textAlign:"right",fontWeight:700,color:esCredito?"#2E86C1":sal?"#2D6A4F":"#C0392B",whiteSpace:"nowrap"}}>{esCredito?`💰 A favor ${fmt(Math.abs(p._p))}`:sal?"✅ Saldado":fmt(p._p)}</td>
                    <td style={{padding:"6px 8px"}} onClick={e=>e.stopPropagation()}>
                      <div style={{display:"flex",gap:4,justifyContent:"center"}}>
                        <button onClick={()=>toggleActivo(p)} title={inactivo?"Activar":"Ocultar (marcar inactivo)"} style={{background:inactivo?"#EAF5F0":"#FEF9E7",border:"none",borderRadius:6,color:inactivo?"#2D6A4F":"#B7860B",fontSize:".62rem",fontWeight:600,cursor:"pointer",padding:"3px 6px"}}>{inactivo?"✅":"🚫"}</button>
                        <button onClick={()=>editar(p)} title="Editar" style={{background:"#EAF5F0",border:"none",borderRadius:6,color:"#2D6A4F",fontSize:".62rem",fontWeight:600,cursor:"pointer",padding:"3px 6px"}}>✏️</button>
                        <button onClick={()=>eliminar(p.id)} title="Eliminar" style={{background:"#FFF0EF",border:"none",borderRadius:6,color:"#E74C3C",fontSize:".62rem",fontWeight:600,cursor:"pointer",padding:"3px 6px"}}>✕</button>
                      </div>

  </>);
}
